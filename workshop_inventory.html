<meta charset="UTF-8">

<!-- مكتبات نظام التوثيق التقني (سكشن): ماركداون + هايلايت أكواد + معادلات + مخططات. لو النت مقطوع بيرجع تلقائي لمحرك بديل مدمج -->

<style>
:root, [data-theme="amber"]{
  --bg:#0b0f14; --panel:#12181f; --panel2:#1a2330; --panel3:#212c3b;
  --border:#28323f; --border-lt:#33404f;
  --text:#e7edf5; --dim:#8ea0b3; --dim2:#5d6c7d;
  --amber:#f2a93c; --amber-dim:#3a2d16; --amber-dark:#b5721f; --amber-ink:#1a1000; --amber-border:#5a4420; --amber-rgb:242,169,60;
  --green:#3ddc84; --green-dim:#123321;
  --yellow:#f2c53d; --yellow-dim:#3a3212;
  --red:#ff5d5d; --red-dim:#3a1414;
  --blue:#4da3ff; --blue-dim:#122a44;
  --grid-rgb:255,255,255; --grid-op:.015;
  --theme-emoji:"🟠"; --theme-label:"كهرماني";
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans Arabic','Segoe UI',sans-serif;
}
[data-theme="night-blue"]{
  --bg:#0a0f1a; --panel:#111a2b; --panel2:#182338; --panel3:#1f2d47;
  --border:#28384f; --border-lt:#334660;
  --text:#e6edf7; --dim:#8a9db8; --dim2:#5a6c85;
  --amber:#4da3ff; --amber-dim:#122a44; --amber-dark:#2f6fc4; --amber-ink:#04101f; --amber-border:#1e3f66; --amber-rgb:77,163,255;
  --green:#3ddc84; --green-dim:#123321;
  --yellow:#f2c53d; --yellow-dim:#3a3212;
  --red:#ff5d5d; --red-dim:#3a1414;
  --blue:#7fc4ff; --blue-dim:#16324d;
  --grid-rgb:255,255,255; --grid-op:.015;
  --theme-emoji:"🌌"; --theme-label:"أزرق ليلي";
}
[data-theme="circuit-green"]{
  --bg:#070c08; --panel:#0d150e; --panel2:#131f15; --panel3:#1a2c1c;
  --border:#20361f; --border-lt:#2b4a2a;
  --text:#e3f3e6; --dim:#88ad8e; --dim2:#557259;
  --amber:#26e07a; --amber-dim:#0f3320; --amber-dark:#189955; --amber-ink:#02150a; --amber-border:#1a5c3a; --amber-rgb:38,224,122;
  --green:#26e07a; --green-dim:#0f3320;
  --yellow:#ffd23d; --yellow-dim:#3a3212;
  --red:#ff4d4d; --red-dim:#3a1414;
  --blue:#4da3ff; --blue-dim:#122a44;
  --grid-rgb:38,224,122; --grid-op:.045;
  --theme-emoji:"🔌"; --theme-label:"دائرة LED";
}
[data-theme="daylight"]{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f5; --panel3:#e4e9ef;
  --border:#d7dee6; --border-lt:#c7d0db;
  --text:#1c2530; --dim:#5c6b7c; --dim2:#8ea0b3;
  --amber:#c9821f; --amber-dim:#fbeedc; --amber-dark:#a56517; --amber-ink:#ffffff; --amber-border:#e0c090; --amber-rgb:201,130,31;
  --green:#1f9d5c; --green-dim:#e3f7ec;
  --yellow:#a8790a; --yellow-dim:#fbf2d9;
  --red:#d9433c; --red-dim:#fceaea;
  --blue:#1f6fb2; --blue-dim:#e6f0fa;
  --grid-rgb:0,0,0; --grid-op:.025;
  --theme-emoji:"☀️"; --theme-label:"فاتح نهاري";
}
[data-theme="warm-paper"]{
  --bg:#f2e9d8; --panel:#f9f3e6; --panel2:#efe4cf; --panel3:#e8dac0;
  --border:#d8c9a8; --border-lt:#c9b896;
  --text:#2e2a22; --dim:#6c6250; --dim2:#8a7355;
  --amber:#8a5a2d; --amber-dim:#e9dcc4; --amber-dark:#6b4420; --amber-ink:#ffffff; --amber-border:#c9a870; --amber-rgb:138,90,45;
  --green:#5c7a52; --green-dim:#e3ead9;
  --yellow:#96700a; --yellow-dim:#f2e6c9;
  --red:#a63a3a; --red-dim:#f2dede;
  --blue:#3a5a8c; --blue-dim:#dde6f2;
  --grid-rgb:0,0,0; --grid-op:.03;
  --theme-emoji:"📖"; --theme-label:"دفتر ورقي";
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
body{background-image:
  linear-gradient(var(--bg) 0, var(--bg) 100%),
  repeating-linear-gradient(0deg, rgba(var(--grid-rgb),var(--grid-op)) 0 1px, transparent 1px 24px),
  repeating-linear-gradient(90deg, rgba(var(--grid-rgb),var(--grid-op)) 0 1px, transparent 1px 24px);
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);border-radius:6px;padding:8px 10px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-lt);border-radius:4px;}
.hidden{display:none !important;}
a{color:var(--blue);}

.app-shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:230px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px 8px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--amber),var(--amber-dark));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--amber-ink);font-family:var(--mono);font-size:15px;}
.brand-text{line-height:1.25;}
.brand-text b{font-size:14.5px;display:block;}
.brand-text span{font-size:11px;color:var(--dim);font-family:var(--mono);}
nav.navlist{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:var(--dim);text-align:right;padding:9px 10px;border-radius:8px;font-size:13.5px;transition:.15s;}
.nav-item .ico{font-size:15px;width:18px;text-align:center;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel3);color:var(--amber);border-right:3px solid var(--amber);padding-right:7px;}
.save-badge{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);padding:8px 10px;border-radius:8px;border:1px solid var(--border);cursor:default;text-align:center;}
.save-badge.fail{cursor:pointer;color:var(--red);border-color:var(--red);}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:relative;z-index:20;}
.search-wrap{position:relative;flex:1;max-width:520px;}
#searchInput{width:100%;padding:10px 14px;font-size:13.5px;}
.search-results{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--panel3);border:1px solid var(--border-lt);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-height:360px;overflow-y:auto;z-index:50;}
.sres-item{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:center;}
.sres-item:last-child{border-bottom:none;}
.sres-item:hover{background:var(--panel2);}
.sres-name{font-weight:600;font-size:13.5px;}
.sres-meta{font-size:11px;color:var(--dim);font-family:var(--mono);}
.sres-loc{font-size:11px;color:var(--amber);font-family:var(--mono);white-space:nowrap;}
.notif-bell{position:relative;font-size:19px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
#notifCount{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-size:10px;font-family:var(--mono);border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;}
.notif-panel{position:absolute;top:60px;left:20px;width:340px;max-height:70vh;overflow-y:auto;background:var(--panel3);border:1px solid var(--border-lt);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:60;padding:8px;}
.notif-row{padding:10px 12px;border-radius:8px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;}
.notif-row:hover{background:var(--panel2);}

#viewContainer{flex:1;overflow-y:auto;padding:22px 26px 60px 26px;}
.view-title{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
.view-title h1{font-size:19px;margin:0;}
.view-title .sub{color:var(--dim);font-size:12.5px;}
.view-desc{color:var(--dim);font-size:12.5px;margin-bottom:18px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;}
.stat-card .num{font-family:var(--mono);font-size:24px;font-weight:600;}
.stat-card .lbl{font-size:11.5px;color:var(--dim);margin-top:2px;}
.stat-card.warn .num{color:var(--yellow);}
.stat-card.crit .num{color:var(--red);}
.stat-card.good .num{color:var(--green);}
.stat-card.info .num{color:var(--blue);}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
.theme-grid-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:8px;}
.theme-swatch{position:relative;background:var(--panel2);border:1.5px solid var(--border-lt);border-radius:10px;padding:12px;cursor:pointer;transition:.15s;}
.theme-swatch:hover{border-color:var(--amber);transform:translateY(-1px);}
.theme-swatch.active{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-dim);}
.ts-preview{height:34px;border-radius:7px;border:1px solid var(--border-lt);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;background:var(--bg);}
.ts-dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
.ts-name{font-size:12.5px;font-weight:700;}
.ts-desc{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.5;}
.ts-badge{position:absolute;top:8px;left:8px;background:var(--amber);color:var(--amber-ink);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;}
.panel h3{margin:0 0 12px 0;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
.btn{background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:500;transition:.15s;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);}
.btn.primary:hover{filter:brightness(1.1);color:var(--amber-ink);}
.btn.danger{color:var(--red);border-color:var(--red-dim);}
.btn.danger:hover{background:var(--red-dim);}
.btn.small{padding:5px 10px;font-size:11.5px;}

/* Storage / cabinet visuals */
.rack-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:22px;overflow:hidden;}
.rack-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,var(--panel3),var(--panel2));border-bottom:1px solid var(--border);}
.rack-plate{display:flex;align-items:center;gap:10px;}
.plate-tag{font-family:var(--mono);font-size:11px;background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-border);padding:3px 8px;border-radius:5px;}
.rack-head b{font-size:14px;}
.rack-head .meta{color:var(--dim);font-size:11px;}
.rack-head-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;width:100%;}
.rack-columns{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start;background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px);
}
.rack-column{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;min-width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.column-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.column-head b{color:var(--amber);}
.box-card{background:var(--panel3);border:1px solid var(--border-lt);border-radius:8px;padding:8px;}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;margin-bottom:6px;}
.box-head b{font-size:12px;}
.box-cells{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;}
.cell{position:relative;border-radius:7px;border:1px solid var(--border-lt);background:var(--panel);min-height:58px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;overflow:hidden;}
.cell::before,.cell::after{content:'';position:absolute;top:5px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.06);}
.cell::before{right:5px;} .cell::after{left:5px;}
.cell:hover{border-color:var(--amber);transform:translateY(-1px);}
.cell .cid{font-family:var(--mono);font-size:9.5px;color:var(--dim2);}
.cell .cname{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell .cqty{font-family:var(--mono);font-size:14px;font-weight:700;}
.cell.status-green{border-right:4px solid var(--green);}
.cell.status-yellow{border-right:4px solid var(--yellow);}
.cell.status-red{border-right:4px solid var(--red);}
.cell.status-empty{border-style:dashed;opacity:.55;align-items:center;justify-content:center;}
.cell.status-empty .plus{font-size:18px;color:var(--dim2);}
.cell.highlight{animation:pulseBlue 1.1s ease-in-out 3;border-color:var(--blue) !important;box-shadow:0 0 0 3px var(--blue-dim),0 0 20px rgba(77,163,255,.5);}
@keyframes pulseBlue{0%,100%{box-shadow:0 0 0 3px var(--blue-dim);}50%{box-shadow:0 0 0 6px rgba(77,163,255,.25);}}
.cell.dragover{outline:2px dashed var(--amber);}

/* flash sequence: rack -> column -> box -> cell */
@keyframes flashStep{0%,100%{box-shadow:none;} 50%{box-shadow:0 0 0 4px var(--amber-dim),0 0 26px rgba(var(--amber-rgb),.6);border-color:var(--amber) !important;}}
.flash-step{animation:flashStep .55s ease-in-out 2;}
@keyframes pulseWait{0%,100%{box-shadow:0 0 0 3px var(--blue-dim);} 50%{box-shadow:0 0 0 8px rgba(77,163,255,.4);}}
.cell.flash-wait{animation:pulseWait 1s ease-in-out infinite !important;border-color:var(--blue) !important;z-index:5;}

/* collapsed rack list card */
.rack-panel.compact-only{cursor:default;}

/* full-page rack view: takes over the whole storage screen, columns on top, selected box's cells below */
.rack-fullpage-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 150px);}
.rack-fullpage-wrap .rack-head-top{flex-wrap:wrap;}
.rack-fullpage-columns{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start;border-bottom:1px solid var(--border);background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px);
}
.box-chip{background:var(--panel3);border:1px solid var(--border-lt);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:150px;transition:.15s;}
.box-chip:hover{border-color:var(--amber);}
.box-chip.selected{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-dim);background:var(--panel2);}
.box-chip .bc-name{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.box-chip .bc-name b{font-size:12.5px;}
.box-chip .bc-count{font-family:var(--mono);color:var(--dim);font-size:11px;}
.box-chip .bc-hint{font-size:10px;color:var(--dim2);margin-top:3px;}
.rack-detail-panel{flex:1;padding:20px;background:var(--panel2);min-height:340px;}
.rack-detail-panel .box-card.expanded{background:transparent;border:none;padding:0;}
.rack-detail-empty{text-align:center;color:var(--dim);padding:70px 20px;font-size:13px;}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.preset-row button.active{border-color:var(--amber);color:var(--amber);}

/* checklist */
.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.check-row:last-child{border-bottom:none;}
.check-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--amber);flex-shrink:0;}
.check-row .ctext{flex:1;font-size:13px;}
.check-row .ctext.done{color:var(--dim);text-decoration:line-through;}
.check-row .cdate{font-size:10.5px;color:var(--dim2);font-family:var(--mono);}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,6,9,.7);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:var(--panel);border:1px solid var(--border-lt);border-radius:16px;width:100%;max-width:640px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h2{margin:0;font-size:16px;}
.modal-head .close{background:transparent;border:none;color:var(--dim);font-size:20px;}
.modal-tabs{display:flex;gap:4px;padding:10px 16px 0 16px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.mtab{background:transparent;border:none;color:var(--dim);padding:8px 10px;font-size:12px;border-radius:6px 6px 0 0;}
.mtab.active{color:var(--amber);background:var(--panel2);}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1;}
.mpanel{display:none;}
.mpanel.active{display:block;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.field-row.full{grid-template-columns:1fr;}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.chip{display:inline-block;background:var(--panel3);border:1px solid var(--border-lt);border-radius:20px;padding:3px 10px;font-size:11px;margin:2px;}
.chip.green{color:var(--green);} .chip.yellow{color:var(--yellow);} .chip.red{color:var(--red);}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.tbl th{text-align:right;color:var(--dim);font-weight:500;font-size:11px;padding:8px 10px;border-bottom:1px solid var(--border);}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);}
table.tbl tr:hover td{background:var(--panel2);}
.pill{padding:2px 8px;border-radius:20px;font-size:10.5px;font-family:var(--mono);}
.pill.green{background:var(--green-dim);color:var(--green);}
.pill.yellow{background:var(--yellow-dim);color:var(--yellow);}
.pill.red{background:var(--red-dim);color:var(--red);}
.pill.gray{background:var(--panel3);color:var(--dim);}

.hist-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.hist-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.hist-ico.use{background:var(--red-dim);color:var(--red);}
.hist-ico.purchase{background:var(--green-dim);color:var(--green);}
.hist-ico.move{background:var(--blue-dim);color:var(--blue);}
.hist-ico.adjust{background:var(--yellow-dim);color:var(--yellow);}
.hist-main b{font-size:12.5px;}
.hist-main .d{font-size:11px;color:var(--dim);font-family:var(--mono);}

.map-board{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;min-height:520px;padding:20px;overflow:auto;}
.map-item{position:absolute;background:var(--panel3);border:1px solid var(--border-lt);border-radius:10px;padding:10px 12px;cursor:grab;user-select:none;min-width:110px;text-align:center;transition:border-color .15s;}
.map-item:hover{border-color:var(--amber);}
.map-item b{display:block;font-size:12px;}
.map-item span{font-size:10px;color:var(--dim);font-family:var(--mono);}
.map-item.wb{border-style:dashed;}

.bar-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;}
.bar{width:100%;background:linear-gradient(180deg,var(--amber),var(--amber-dark));border-radius:4px 4px 0 0;min-height:3px;}
.bar-lbl{font-size:9.5px;color:var(--dim);text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-val{font-family:var(--mono);font-size:10px;color:var(--text);}

.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.donut{width:130px;height:130px;border-radius:50%;flex-shrink:0;}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px;}
.legend .sw{width:10px;height:10px;border-radius:3px;}

.empty-state{text-align:center;padding:40px 20px;color:var(--dim);}
.empty-state .big{font-size:32px;margin-bottom:8px;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.searchbox-inline{flex:1;min-width:180px;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;}
.card:hover{border-color:var(--amber);}
.card b{font-size:13.5px;display:block;}
.card .sub{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:2px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);padding:10px 18px;border-radius:10px;font-size:12.5px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.5);}
@media (max-width:820px){
  .sidebar{width:64px;}
  .brand-text,.nav-item span.lbl{display:none;}
  .save-badge{font-size:0;}
  .field-row{grid-template-columns:1fr;}
}

.customize-note{background:var(--blue-dim);border:1px solid rgba(77,163,255,.35);color:var(--text);padding:10px 12px;border-radius:8px;font-size:11.5px;line-height:1.7;margin-bottom:12px;}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.settings-grid .field.full{grid-column:1/-1;}
.range-line{display:flex;align-items:center;gap:8px;}
.range-line input[type=range]{flex:1;accent-color:var(--amber);padding:0;}
.range-value{font-family:var(--mono);min-width:42px;text-align:center;color:var(--amber);}
.layout-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.layout-inline input,.layout-inline select{max-width:125px;}
.layout-tag{font-size:10px;color:var(--dim);font-family:var(--mono);background:var(--panel2);padding:3px 7px;border-radius:5px;}

.visual-var-strip{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.visual-var{display:flex;align-items:center;gap:6px;background:rgba(77,163,255,.08);border:1px solid rgba(77,163,255,.28);border-radius:6px;padding:4px 7px;font-size:10px;color:var(--text)}
.visual-var .vv-name{color:var(--dim)}
.visual-var .vv-value{font-family:var(--mono);font-weight:700}
.vv-bar{width:44px;height:5px;background:#263342;border-radius:99px;overflow:hidden}
.vv-bar i{display:block;height:100%;border-radius:inherit;background:var(--blue)}
.vv-light{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
.vv-level{display:flex;gap:2px;align-items:flex-end;height:12px}
.vv-level i{width:4px;background:var(--green);border-radius:2px}
.vv-graph{font-family:var(--mono);letter-spacing:-2px;color:var(--amber)}
.visual-config-btn{border-color:rgba(77,163,255,.35)!important;color:var(--blue)!important}
.visual-modal-intro{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px;color:var(--dim);font-size:11.5px;line-height:1.8}
.visual-var-row{display:grid;grid-template-columns:1.3fr .7fr .7fr .7fr 1fr auto;gap:6px;align-items:end;padding:8px 0;border-bottom:1px solid var(--border)}
.visual-var-row input,.visual-var-row select{min-width:0}
.visual-var-row .field label{font-size:10px}
.visual-relations{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.visual-relations label{border:1px solid var(--border-lt);border-radius:6px;padding:6px 8px;font-size:11px;cursor:pointer}
.visual-relations label:has(input:checked){border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.visual-drag-indicator{position:absolute;z-index:4;cursor:grab;user-select:none;touch-action:none}
.visual-drag-indicator:active{cursor:grabbing}
.visual-target{outline:1px dashed var(--blue);outline-offset:3px}
.storage-rack-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.storage-rack-grid .rack-panel{margin-bottom:0}
.visual-link-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr .9fr .9fr auto;gap:6px;align-items:end;border-bottom:1px solid var(--border);padding:8px 0}
.visual-link-row .field label{font-size:10px}
.visual-link-empty{color:var(--dim2);font-size:11px;padding:10px 0}

/* ============================== نظام التوثيق التقني للخلية (مستورد من code_library) ============================== */
.sec-scope{
  --paper: var(--panel3); --paper-card: var(--panel2); --paper-shadow: rgba(0,0,0,.45);
  --ink: var(--text); --ink-soft: var(--dim); --rule: var(--border-lt);
  --accent: var(--amber); --accent-rgb: var(--amber-rgb); --accent-dark: var(--amber-dark);
  --marker: var(--yellow); --danger: var(--red);
  --tab: #4a3418; --surface: var(--panel3); --surface-soft: var(--panel2);
  --tint: rgba(var(--amber-rgb),.14); --on-accent: var(--amber-ink);
  --font-display: var(--sans);
  --overlay-rgb: 0,0,0; --zebra-rgb: 255,255,255;
  color: var(--text); font-family: var(--sans);
}
.sec-scope .card{background:var(--paper-card);}
.sec-scope button{
    background:var(--surface); color:var(--ink); border:1.5px solid var(--rule);
    padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit;
    transition:border-color .15s, transform .1s, background .15s;
  }
.sec-scope button:hover{border-color:var(--accent);}
.sec-scope button:active{transform:scale(.97);}
.sec-scope button.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent-dark); font-weight:700;}
.sec-scope button.primary:hover{background:var(--accent-dark);}
.sec-scope button.ghost{background:transparent;}
.sec-scope button.danger{color:var(--danger); border-color:#e0bcbc;}
.sec-scope button.small{padding:3px 9px; font-size:11px;}
.sec-scope input[type=text],
.sec-scope input[type=search]{
    background:var(--surface); border:1.5px solid var(--rule); color:var(--ink);
    padding:7px 10px; border-radius:8px; font-size:13px; font-family:inherit;
  }
.sec-scope .autosave-status{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
.sec-scope .autosave-status.on{color:var(--accent-dark); font-weight:700;}
.sec-scope .autosave-status.pending{color:#b8860b; font-weight:700;}
.sec-scope .autosave-status.err{color:var(--danger); font-weight:700;}
.sec-scope .fmt-toolbar{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; padding:6px; background:var(--paper); border:1px solid var(--rule); border-radius:6px;}
.sec-scope .fmt-btn{background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:3px 8px; font-size:12px; cursor:pointer; color:var(--ink); line-height:1.6;}
.sec-scope .fmt-btn:hover{border-color:var(--accent); background:var(--paper-card);}
.sec-scope .fmt-sep{width:1px; align-self:stretch; background:var(--rule); margin:0 2px;}
.sec-scope .fmt-btn.custom-rule{background:#fff8e8; border-color:var(--marker);}
.sec-scope .extra-explanations-holder{display:flex; flex-direction:column; gap:12px; margin-top:10px;}
.sec-scope .extra-explain-box{border:1px solid var(--rule); border-radius:8px; padding:10px; background:var(--paper);}
.sec-scope .extra-explain-box .exbox-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.sec-scope .extra-explain-box.is-collapsed .exbox-body{display:none;}
.sec-scope .extra-explain-box.is-collapsed .exbox-head{margin-bottom:0;}
.sec-scope .extra-explain-box .exbox-title{flex:1; font-size:13px; font-weight:700; border:1px solid var(--rule); border-radius:5px; padding:5px 8px; background:var(--surface); color:var(--ink);}
.sec-scope .add-explain-btn{margin-top:10px;}
.sec-scope .card{
    background:var(--paper-card);
    border:1.5px solid var(--rule); border-radius:4px;
    padding:20px 22px; position:relative;
    box-shadow:3px 4px 0 var(--paper-shadow);
  }
.sec-scope .card::before{ 
    content:""; position:absolute; top:-2px; inset-inline-start:18px; width:46px; height:8px;
    background:var(--marker); border-radius:0 0 4px 4px;
  }
.sec-scope .card-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px; padding-top:4px;}
.sec-scope .card-head input.titlein{
    flex:1; font-size:19px; font-weight:700; background:transparent; border:none;
    color:var(--ink); border-bottom:1.5px dashed transparent; padding:2px 0; font-family:var(--font-display);
  }
.sec-scope .card-head input.titlein:focus{outline:none; border-bottom-color:var(--accent);}
.sec-scope .card-actions{display:flex; gap:6px; flex-shrink:0;}
.sec-scope .starbtn{cursor:pointer; font-size:20px; color:#d8cdb4; user-select:none;}
.sec-scope .starbtn.on{color:var(--marker); text-shadow:0 0 1px #b8860b;}
.sec-scope .tag{font-size:10.5px; color:#fff; background:var(--tab); padding:2px 9px; border-radius:20px; font-weight:700;}
.sec-scope .section-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px; margin:14px 0 6px; border-bottom:1px dotted var(--rule); padding-bottom:3px;}
.sec-scope .explain-view{
    width:100%; min-height:60px; background:var(--surface-soft); border:1px solid var(--rule); color:var(--ink);
    border-radius:6px; padding:12px 14px; font-size:14.5px; line-height:1.85; direction:rtl; text-align:right;
    cursor:text; font-family:"Cairo",sans-serif;
  }
.sec-scope .explain-view .md-empty{color:var(--ink-soft); font-style:italic;}
.sec-scope .explain-view .md-p{margin:0 0 10px;}
.sec-scope .explain-view .md-p:last-child{margin-bottom:0;}
.sec-scope .explain-view .md-diagram{
    direction:ltr; text-align:left; margin:8px 0 12px; padding:12px 14px; background:#2b2820; color:#e9dfc4;
    border-radius:6px; border:1px solid #45402f; font-family:"Consolas","Fira Code",monospace;
    font-size:12.5px; line-height:1.5; overflow-x:auto; white-space:pre;
  }
.sec-scope .explain-view .md-h{margin:16px 0 8px; color:var(--accent-dark); font-weight:800; line-height:1.4;}
.sec-scope .explain-view h4.md-h{font-size:19px;}
.sec-scope .explain-view h5.md-h{font-size:16px;}
.sec-scope .explain-view h6.md-h{font-size:14px;}
.sec-scope .explain-view .md-emoji-head{
    font-weight:800; font-size:15.5px; margin:16px 0 8px; color:var(--accent-dark);
    padding-bottom:4px; border-bottom:2px solid var(--rule);
  }
.sec-scope .explain-view .md-subhead{
    font-weight:800; font-size:14.5px; margin:14px 0 6px; color:var(--accent-dark); line-height:1.5;
  }
.sec-scope .explain-view .md-subhead:first-child{margin-top:0;}
.sec-scope .explain-view .md-hr{border:none; border-top:1px dashed var(--rule); margin:14px 0;}
.sec-scope .explain-view .md-quote{
    margin:8px 0; padding:6px 12px; border-right:3px solid var(--accent); background:var(--tint);
    color:var(--ink-soft); border-radius:4px;
  }
.sec-scope .explain-view .md-list{margin:6px 0 10px; padding-right:22px; padding-left:4px;}
.sec-scope .explain-view .md-list li{margin:4px 0;}
.sec-scope .explain-view .md-list .md-list{margin:4px 0 4px; padding-right:20px;}
.sec-scope .explain-view .md-quote .md-p{margin:0 0 6px;}
.sec-scope .explain-view .md-quote .md-p:last-child{margin-bottom:0;}
.sec-scope .explain-view a{color:var(--accent-dark); text-decoration:underline; text-decoration-color:var(--marker);}
.sec-scope .explain-view a:hover{color:var(--danger);}
.sec-scope .explain-view del{color:var(--ink-soft); opacity:.75;}
.sec-scope .explain-view code{
    background:var(--tint); border:1px solid var(--rule); border-radius:4px; padding:1px 6px;
    font-family:"Fira Code","Consolas",monospace; font-size:13px; direction:ltr; display:inline-block;
  }
.sec-scope .explain-view strong{color:var(--accent-dark);}
.sec-scope .explain-view .md-table-wrap{overflow-x:auto; margin:8px 0 12px; border-radius:6px; border:1px solid var(--rule);}
.sec-scope .explain-view table.md-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.sec-scope .explain-view table.md-table th,
.sec-scope .explain-view table.md-table td{
    border:1px solid var(--rule); padding:7px 10px; text-align:center; vertical-align:middle;
  }
.sec-scope .explain-view table.md-table th{background:var(--tint); color:var(--accent-dark); font-weight:800;}
.sec-scope .explain-view table.md-table tr:nth-child(even) td{background:rgba(var(--zebra-rgb),.045);}
.sec-scope .explain-view h1.md-h{font-size:24px;}
.sec-scope .explain-view h2.md-h{font-size:21px;}
.sec-scope .explain-view h3.md-h{font-size:19px;}
.sec-scope .explain-view .md-callout{border-radius:8px; padding:10px 14px; border-right-width:5px;}
.sec-scope .explain-view .md-callout-tip{background:#eaf6ea; border-color:#4caf50;}
.sec-scope .explain-view .md-callout-warn{background:#fff6e5; border-color:#e0a800;}
.sec-scope .explain-view .md-callout-info{background:#e8f2fb; border-color:#2f7fd1;}
.sec-scope .explain-view .md-callout-danger{background:#fdeaea; border-color:var(--danger, #d9534f);}
.sec-scope .explain-view input[type="checkbox"]{margin-left:6px; transform:translateY(2px);}
.sec-scope .explain-view .md-tasklist{list-style:none; padding-right:6px;}
.sec-scope .explain-view .md-tasklist li{margin:4px 0;}
.sec-scope .explain-view .md-codewrap{
    margin:8px 0 12px; border-radius:8px; overflow:hidden; border:1px solid #2a2a2a; background:#1e1e1e; direction:ltr;
  }
.sec-scope .explain-view .md-codehead{
    display:flex; align-items:center; justify-content:space-between; background:#2d2d2d; color:#ccc;
    padding:6px 10px; font-size:12px; font-family:"Cairo",sans-serif;
  }
.sec-scope .explain-view .md-codelang{opacity:.8; text-transform:uppercase; letter-spacing:.5px;}
.sec-scope .explain-view .md-codebtns{display:flex; gap:6px;}
.sec-scope .explain-view .md-codebtn{
    background:#3a3a3a; color:#ddd; border:1px solid #4a4a4a; border-radius:5px; padding:3px 9px;
    font-size:11px; cursor:pointer; font-family:"Cairo",sans-serif;
  }
.sec-scope .explain-view .md-codebtn:hover{background:#4a4a4a;}
.sec-scope .explain-view .md-codebody{display:flex;}
.sec-scope .explain-view .md-codewrap.collapsed .md-codebody{display:none;}
.sec-scope .explain-view .md-codenums{
    user-select:none; opacity:.35; color:#fff; text-align:left; padding:10px 8px 10px 10px;
    font-family:"Fira Code","Consolas",monospace; font-size:13px; line-height:1.6; white-space:pre; border-left:1px solid #333;
  }
.sec-scope .explain-view .md-codepre{margin:0; padding:10px 12px; overflow-x:auto; flex:1;}
.sec-scope .explain-view .md-codepre code.hljs{
    background:transparent !important; font-family:"Fira Code","Consolas",monospace; font-size:13px; line-height:1.6; padding:0;
  }
.sec-scope .explain-view .mermaid-pending{color:var(--ink-soft); font-style:italic; padding:8px 0;}
.sec-scope .explain-view .mermaid-rendered{margin:10px 0; text-align:center; overflow-x:auto;}
.sec-scope .explain-view .md-footnotes{margin-top:14px; font-size:13px; color:var(--ink-soft);}
.sec-scope .explain-view .md-fnlist{padding-right:20px;}
.sec-scope .explain-view .md-fnref a{text-decoration:none; font-weight:700;}
.sec-scope .explain-view .md-fnback{margin-right:4px; text-decoration:none;}
.sec-scope .explain-view .katex-display{overflow-x:auto; overflow-y:hidden; padding:4px 0;}
.sec-scope textarea.explain{
    width:100%; min-height:220px; background:
      repeating-linear-gradient(var(--surface-soft) 0 31px, var(--rule) 31px 32px);
    background-attachment:local;
    border:1px solid var(--rule);
    color:var(--ink); border-radius:6px; padding:10px 12px; font-size:14.5px; line-height:32px; direction:rtl;
    resize:vertical; font-family:"Cairo",sans-serif;
  }
.sec-scope .label-row{display:flex; align-items:center; justify-content:space-between; margin:14px 0 6px;}
.sec-scope .label-row .section-label{margin:0;}
.sec-scope .expand-btn{padding:2px 9px; font-size:11px;}
.sec-scope .mindmap-panel{
    border:1px solid var(--rule); border-radius:8px; overflow:hidden; background:var(--surface);
    --mm-bg:#fbf9f2; --mm-node:#ffffff; --mm-node-border:#c9bd9a; --mm-text:#241f1a; --mm-line:#a99b74;
  }
.sec-scope .mindmap-panel:focus{outline:none; box-shadow:inset 0 0 0 2px rgba(122,92,45,.25);}
.sec-scope .mindmap-panel.mm-dark{ --mm-bg:#1c1a16; --mm-node:#2a2620; --mm-node-border:#4a4436; --mm-text:#efe9da; --mm-line:#8a7f60; }
.sec-scope .mm-toolbar{
    display:flex; gap:5px; flex-wrap:wrap; align-items:center; padding:7px 9px;
    background:var(--paper); border-bottom:1px solid var(--rule);
  }
.sec-scope .mm-toolbar button{font-size:11.5px; padding:4px 8px;}
.sec-scope .mm-toolbar select,
.sec-scope .mm-toolbar input[type="text"]{font-size:11.5px; padding:3px 6px; border:1px solid var(--rule); border-radius:5px;}
.sec-scope .mm-toolbar input[type="text"].mm-search{width:110px;}
.sec-scope .mm-toolbar .mm-sep{width:1px; align-self:stretch; background:var(--rule); margin:0 2px;}
.sec-scope .mm-toolbar input[type="color"]{width:26px; height:24px; padding:1px; border:1px solid var(--rule); border-radius:4px; cursor:pointer;}
.sec-scope .mm-stage-wrap{position:relative; height:380px; background:var(--mm-bg); overflow:hidden; touch-action:none;}
.sec-scope .mm-stage-wrap svg{width:100%; height:100%; display:block; cursor:grab;}
.sec-scope .mm-stage-wrap svg.panning{cursor:grabbing;}
.sec-scope .mm-node-box{
    width:100%; height:100%; box-sizing:border-box; display:flex; align-items:center; justify-content:center;
    background:var(--mm-node); border:2px solid var(--mm-node-border); color:var(--mm-text);
    border-radius:10px; font-size:13px; padding:4px 8px; text-align:center; outline:none;
    cursor:default; overflow:hidden; word-break:break-word; user-select:text;
  }
.sec-scope .mm-node-box.shape-ellipse{border-radius:999px;}
.sec-scope .mm-node-box.shape-rect{border-radius:2px;}
.sec-scope .mm-node-box.shape-none{border-color:transparent; background:transparent;}
.sec-scope .mm-node-box.shape-circle{border-radius:50%; padding:8px;}
.sec-scope .mm-node-box.shape-diamond{
    border-radius:0; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    padding:16px 26px;
  }
.sec-scope .mm-node-box.shape-triangle{
    border-radius:0; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    padding:32px 20px 6px;
  }
.sec-scope .mm-node-box.shape-hexagon{
    border-radius:0; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    padding:6px 20px;
  }
.sec-scope .mm-node-box.shape-octagon{
    border-radius:0;
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    padding:6px 18px;
  }

.bookshelf-rack{overflow:visible!important;background:transparent!important;border:none!important;perspective:1200px;}

      {id:uid('map'),type:'shelf',refId:shelves[0].id,label:'الرف الأول',x:40,y:20,w:260,h:70},

      {id:uid('map'),type:'drawer',refId:drawers[0].id,label:'درج 01',x:40,y:220,w:150,h:70},
      {id:uid('map'),type:'drawer',refId:drawers[1].id,label:'درج 02',x:210,y:220,w:150,h:70},

/* ============================= INDEXEDDB PERSISTENCE ============================= */
let dbPromise=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(DB_NAME,DB_VERSION);
      req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    }catch(e){reject(e);}
  });
  return dbPromise;
}
async function idbGet(key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly');
    const r=tx.objectStore(STORE).get(key);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
async function idbSet(key,val){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(val,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}

let saveTimer=null;
function setSaveBadge(status,extra){
  const el=document.getElementById('saveBadge');
  el.classList.remove('fail');
  el.onclick=null;
  if(status==='pending'){ el.textContent='🟡 جارٍ الحفظ...'; }
  else if(status==='saved'){ el.textContent='🟢 تم الحفظ '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); }
  else if(status==='fail'){
    el.textContent='🔴 فشل الحفظ (اضغط للتفاصيل)';
    el.classList.add('fail');
    el.onclick=()=>alert('تشخيص الخطأ:\\n'+(extra||'خطأ غير معروف')+'\\n\\nتم استخدام التخزين الاحتياطي (localStorage) كإجراء وقائي.');
  }
}
// يبني قائمة تنبيهات نقص المخزون الحالية ويبعتها لمخزن الـ HUB المشترك، عشان مركز
// القيادة (وأي تطبيق تاني) يشوف فورًا أي مكوّن وصل للتحذير أو الحرج، من غير ما
// يفتح تطبيق الورشة أصلاً. بتتنفّذ في كل مرة الحالة بتتغيّر (جوه scheduleSave).
function syncLowStockToHub(){
  try{
    if(!window.HUB) return;
    const rows = state.components
      .map(c => ({ c, total: totalQtyOfComponent(c.id) }))
      .filter(x => x.total <= x.c.warningStock);
    const alerts = rows.map(({c, total}) => ({
      key: c.id,
      level: total <= c.criticalStock ? 'critical' : 'warning',
      title: (total <= c.criticalStock ? '🔴 نقص حرج: ' : '🟡 اقترب النفاد: ') + c.name,
      message: `الكمية الحالية ${total} من أصل هدف ${c.targetStock} (حد التحذير ${c.warningStock}, الحد الحرج ${c.criticalStock}).`
    }));
    window.HUB.syncAlertsForSource('workshop', alerts);
  }catch(e){}
}
function scheduleSave(){
  setSaveBadge('pending');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,500);
  syncLowStockToHub();
}
const MAX_EMERGENCY_LOCALSTORAGE_BYTES = 1800000;
let saveRevision = 0;
let saveInFlight = false;
let saveQueued = false;
async function doSave(){
  if(saveInFlight){ saveQueued=true; return; }
  saveInFlight=true;
  try{
    const json=JSON.stringify(state);
    const revision=++saveRevision;
    // التخزين الرئيسي: IndexedDB. لا نستخدم localStorage كقاعدة البيانات لأنه صغير ومناسب فقط للطوارئ.
    await idbSet(STATE_KEY,json);
    await idbSet('state_meta',{revision,savedAt:new Date().toISOString(),bytes:json.length,storage:'indexeddb'});
    // نسخة طوارئ صغيرة فقط إذا كانت الحالة صغيرة؛ الملفات الكبيرة لا تدخل هنا إطلاقاً.
    if(json.length<=MAX_EMERGENCY_LOCALSTORAGE_BYTES){
      try{ localStorage.setItem(FALLBACK_KEY,json); }catch(e){}
    }
    setSaveBadge('saved');
  }catch(e){
    // محاولة أخيرة للنسخة المحلية الصغيرة فقط.
    try{
      const json=JSON.stringify(state);
      if(json.length<=MAX_EMERGENCY_LOCALSTORAGE_BYTES){ localStorage.setItem(FALLBACK_KEY,json); setSaveBadge('saved'); }
      else setSaveBadge('fail','تعذر الحفظ في IndexedDB؛ والحالة أكبر من مساحة النسخة الاحتياطية المحلية.');
    }catch(e2){ setSaveBadge('fail',String(e2?.message||e?.message||e)); }
  }finally{
    saveInFlight=false;
    if(saveQueued){ saveQueued=false; scheduleSave(); }
  }
}
function flushSaveNow(){
  try{
    const json=JSON.stringify(state);
    if(json.length<=MAX_EMERGENCY_LOCALSTORAGE_BYTES){ try{ localStorage.setItem(FALLBACK_KEY,json); }catch(e){} }
    try{ idbSet(STATE_KEY,json).catch(()=>{}); }catch(e){}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSaveNow(); });
window.addEventListener('pagehide',flushSaveNow);
window.addEventListener('beforeunload',flushSaveNow);

/* ترقية البيانات القديمة (رفوف بها صفوف/أعمدة شبكية) إلى نظام الأعمدة/العبوات/الخلايا الجديد */
function migrateStateIfNeeded(){
  if(!state || state.columns) return; // بيانات جديدة بالفعل أو لا توجد بيانات
  const oldContainersById={};
  (state.containers||[]).forEach(c=>{ oldContainersById[c.id]=c; });
  state.columns=[]; state.boxes=[]; state.containers=[];
  [...(state.shelves||[]),...(state.drawers||[])].forEach(rack=>{
    const oldCells=rack.cells||[];
    const oldCols=rack.cols||(oldCells.length?Math.max(...oldCells.map(c=>c.col)):0);
    const oldRows=rack.rows||(oldCells.length?Math.max(...oldCells.map(c=>c.row)):0);
    for(let c=1;c<=oldCols;c++){
      const col={id:uid('col'),rackId:rack.id,order:c,name:'عمود '+c};
      state.columns.push(col);
      const box={id:uid('box'),columnId:col.id,order:1,label:'عبوة '+c,cellCount:oldRows};
      state.boxes.push(box);
      for(let r=1;r<=oldRows;r++){
        const oldCell=oldCells.find(x=>x.row===r&&x.col===c);
        let componentId=null, quantity=0;
        if(oldCell && oldCell.containerId){
          const oldCont=oldContainersById[oldCell.containerId];
          if(oldCont){ componentId=oldCont.componentId; quantity=Number(oldCont.quantity||0); }
        }
        state.containers.push({id:uid('cell'),boxId:box.id,index:r-1,componentId,quantity,dateAdded:nowISO()});
      }
    }
    delete rack.cells; delete rack.cols; delete rack.rows;
  });
  scheduleSave();
}

/* يضمن وجود تقسيمة صفوف/أعمدة لكل عبوة (للبيانات القديمة التي بها عدد خلايا فقط) وقائمة تشيك ليست */
function ensureNewFields(){
  let changed=false;
  (state.boxes||[]).forEach(b=>{
    if(!b.rows || !b.cols){
      b.rows=1; b.cols=b.cellCount||cellsOfBox(b.id).length||1; changed=true;
    }
  });
  if(!state.checklist){ state.checklist=[]; changed=true; }
  if(!state.purchases) state.purchases=[];
  if(!state.uiTheme){ state.uiTheme='amber'; changed=true; }
  if(!Array.isArray(state.categories)) { state.categories=[...DEFAULT_CATEGORIES]; changed=true; }
  else { const merged=[...state.categories]; DEFAULT_CATEGORIES.forEach(c=>{ if(!merged.includes(c)) merged.push(c); }); if(merged.length!==state.categories.length){ state.categories=merged; changed=true; } }
  if(changed) scheduleSave();
}
function applyUiTheme(){
  document.documentElement.setAttribute('data-theme', (state&&state.uiTheme)||'amber');
}

async function loadState(){
  try{
    const raw=await idbGet(STATE_KEY);
    if(raw){ state=JSON.parse(raw); migrateStateIfNeeded(); ensureNewFields(); ensureStoragePreferences(); applyPreferences(); applyUiTheme(); return; }
  }catch(e){}
  try{
    const raw=localStorage.getItem(FALLBACK_KEY);
    if(raw){ state=JSON.parse(raw); migrateStateIfNeeded(); ensureNewFields(); ensureStoragePreferences(); applyPreferences(); applyUiTheme(); scheduleSave(); return; }
  }catch(e){}
  state=seedState();
  ensureStoragePreferences();
  applyPreferences();
  applyUiTheme();
  scheduleSave();
}

/* ============================= HELPERS: DATA QUERIES ============================= */
function allRacks(){ return [...state.shelves, ...state.drawers]; }
function findBox(id){ return state.boxes.find(b=>b.id===id); }
function findColumn(id){ return state.columns.find(c=>c.id===id); }
function columnsOfRack(rackId){ return state.columns.filter(c=>c.rackId===rackId).sort((a,b)=>a.order-b.order); }
function boxesOfColumn(colId){ return state.boxes.filter(b=>b.columnId===colId).sort((a,b)=>a.order-b.order); }
function cellsOfBox(boxId){ return state.containers.filter(c=>c.boxId===boxId).sort((a,b)=>a.index-b.index); }
function findContainer(id){ return state.containers.find(c=>c.id===id); } // "container" هنا = خلية (تحمل مكون+كمية مباشرة)
function findCell(cellId){ return findContainer(cellId); }
function findRackByCellId(cellId){
  const cell=findContainer(cellId); if(!cell) return null;
  const box=findBox(cell.boxId); if(!box) return null;
  const col=findColumn(box.columnId); if(!col) return null;
  return allRacks().find(r=>r.id===col.rackId)||null;
}
function findComponent(id){ return state.components.find(c=>c.id===id); }
function containerOfComponent(compId){ return state.containers.filter(c=>c.componentId===compId); }
function totalQtyOfComponent(compId){ return containerOfComponent(compId).reduce((s,c)=>s+Number(c.quantity||0),0); }
function cellStatus(cell){
  if(!cell.componentId) return 'empty';
  const comp=findComponent(cell.componentId);
  if(!comp) return 'gray';
  const q=Number(cell.quantity||0);
  if(q<=Number(comp.criticalStock||0)) return 'red';
  if(q<=Number(comp.warningStock||0)) return 'yellow';
  return 'green';
}
function locationLabel(cellId){
  if(!cellId) return 'غير مخصص (مؤقت)';
  const cell=findContainer(cellId); if(!cell) return cellId;
  const box=findBox(cell.boxId); if(!box) return cellId;
  const col=findColumn(box.columnId);
  const rack=col? allRacks().find(r=>r.id===col.rackId): null;
  if(!rack||!col) return `${box.label} · خلية ${cell.index+1}`;
  return `${rack.name} · ${col.name} · ${box.label} · خلية ${cell.index+1}`;
}
function statusColor(s){ return {green:'#3ddc84',yellow:'#f2c53d',red:'#ff5d5d',empty:'#5d6c7d',gray:'#5d6c7d'}[s]||'#5d6c7d'; }
function statusLabelAr(s){ return {green:'طبيعي',yellow:'تحذير',red:'حرج',empty:'فارغ',gray:'غير معروف'}[s]||s; }

/* ============================= ROUTER ============================= */
let currentView='dashboard';
function showView(v){
  currentView=v;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  const map={dashboard:renderDashboard,storage:renderStorage,map:renderMap,components:renderComponents,lowstock:renderLowStock,purchases:renderPurchases,checklist:renderChecklist,history:renderHistory,projects:renderProjects,experiments:renderExperiments,stats:renderStats,settings:renderSettings};
  (map[v]||renderDashboard)();
}
document.getElementById('navlist').addEventListener('click',e=>{
  const b=e.target.closest('.nav-item'); if(!b) return; showView(b.dataset.view);
});

/* ============================= TOAST ============================= */
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

/* ============================= MODAL SYSTEM ============================= */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(title,bodyHTML,footHTML,tabs){
  const root=document.getElementById('modalRoot');
  let tabsHTML='';
  if(tabs&&tabs.length){
    tabsHTML='<div class="modal-tabs">'+tabs.map((t,i)=>`<button class="mtab ${i===0?'active':''}" data-mtab="${t.id}">${t.label}</button>`).join('')+'</div>';
  }
  root.innerHTML=`<div class="modal-backdrop" id="mbackdrop">
    <div class="modal-box">
      <div class="modal-head"><h2>${title}</h2><button class="close" id="mclose">✕</button></div>
      ${tabsHTML}
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML?`<div class="modal-foot">${footHTML}</div>`:''}
    </div>
  </div>`;
  document.getElementById('mclose').onclick=closeModal;
  document.getElementById('mbackdrop').addEventListener('click',e=>{ if(e.target.id==='mbackdrop') closeModal(); });
  if(tabs&&tabs.length){
    root.querySelectorAll('.mtab').forEach(btn=>{
      btn.onclick=()=>{
        root.querySelectorAll('.mtab').forEach(b=>b.classList.remove('active'));
        root.querySelectorAll('.mpanel').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        const p=root.querySelector(`.mpanel[data-panel="${btn.dataset.mtab}"]`);
        if(p) p.classList.add('active');
      };
    });
  }
}

function emptyCellOptions(){
  let out='';
  state.containers.filter(c=>!c.componentId).forEach(c=>{ out+=`<option value="${c.id}">${locationLabel(c.id)}</option>`; });
  return out;
}

function moveContainer(fromCellId,targetCellId){
  const fromCell=findContainer(fromCellId);
  const targetCell=findContainer(targetCellId);
  if(!fromCell||!targetCell||fromCellId===targetCellId) return;
  if(targetCell.componentId){
    if(!confirm('الخلية الهدف بها مكون آخر بالفعل. هل تريد تبديل محتوى الخليتين؟')) return;
    const tmpComp=targetCell.componentId, tmpQty=targetCell.quantity;
    targetCell.componentId=fromCell.componentId; targetCell.quantity=fromCell.quantity;
    fromCell.componentId=tmpComp; fromCell.quantity=tmpQty;
  } else {
    targetCell.componentId=fromCell.componentId; targetCell.quantity=fromCell.quantity;
    fromCell.componentId=null; fromCell.quantity=0;
  }
  state.usageHistory.unshift({id:uid('h'),date:nowISO(),componentId:targetCell.componentId,type:'move',qtyChange:0,project:'',purpose:'نقل مكون بين الخلايا',notes:'',fromLocation:fromCellId,toLocation:targetCellId});
  scheduleSave();
}

function histRowHTML(h){
  const comp=findComponent(h.componentId);
  const icoMap={use:'📤',purchase:'📥',move:'🔀',adjust:'✏️'};
  const signed=h.qtyChange>0?`+${h.qtyChange}`:(h.qtyChange<0?`${h.qtyChange}`:'');
  let desc='';
  if(h.type==='use') desc=`استخدام ${signed} قطعة${h.project?(' · مشروع: '+h.project):''}${h.purpose?(' · '+h.purpose):''}`;
  else if(h.type==='purchase') desc=`إضافة/شراء ${signed} قطعة${h.notes?(' · '+h.notes):''}`;
  else if(h.type==='move') desc=`نُقلت من ${h.fromLocation||'—'} إلى ${h.toLocation||'—'}`;
  else desc=h.purpose||'';
  return `<div class="hist-row"><div class="hist-ico ${h.type}">${icoMap[h.type]||'•'}</div>
    <div class="hist-main"><b>${comp?comp.name:'مكون محذوف'}</b><div class="d">${fmtDate(h.date)}</div><div style="font-size:12px;margin-top:2px;">${desc}</div></div></div>`;
}
function expRowHTML(ex){

/* ============================= STORAGE CELL SYSTEM ENHANCEMENTS ============================= */
/* نقل نظام المؤشرات والربط المرتبط بالرف/العمود/العبوة من النسخة المصدر،
   مع الإبقاء على نظام التوثيق التقني ونظام تحريك/تحجيم التخزين الموجودين في النسخة المعدلة. */

function ensureStoragePreferences(){
  if(!state) return;
  const d={
    labels:{shelf:'رف',drawer:'درج',column:'عمود',box:'عبوة',cell:'خلية'},
    grid:{columns:4,gap:5,cellHeight:58,fontSize:11,columnWidth:200},
    colors:{amber:'#f2a93c',blue:'#4da3ff',green:'#3ddc84',yellow:'#f2c53d',red:'#ff5d5d'},
    page:{padding:26,fontSize:13,flow:'column',gap:18,mainWidth:'auto'},
    addBehavior:{newRack:'storage',newColumn:'open',newBox:'select'}
  };
  if(!state.preferences) state.preferences=JSON.parse(JSON.stringify(d));
  else{
    state.preferences.labels=Object.assign({},d.labels,state.preferences.labels||{});
    state.preferences.grid=Object.assign({},d.grid,state.preferences.grid||{});
    state.preferences.colors=Object.assign({},d.colors,state.preferences.colors||{});
    state.preferences.page=Object.assign({},d.page,state.preferences.page||{});
    state.preferences.addBehavior=Object.assign({},d.addBehavior,state.preferences.addBehavior||{});
  }
  state.columns=Array.isArray(state.columns)?state.columns:[];
  state.boxes=Array.isArray(state.boxes)?state.boxes:[];
  state.containers=Array.isArray(state.containers)?state.containers:[];
}

function labelFor(kind){
  return (state.preferences&&state.preferences.labels&&state.preferences.labels[kind]) ||
    ({shelf:'رف',drawer:'درج',column:'عمود',box:'عبوة',cell:'خلية'}[kind]||kind);
}

function visualLabel(kind){ return kind==='rack'?'الرف / الدرج':kind==='column'?'العمود':'العبوة'; }

function visualItem(id,kind){
  if(kind==='rack') return allRacks().find(x=>x.id===id);
  if(kind==='column') return findColumn(id);
  return findBox(id);
}

function ensureVisual(item){
  if(!item.visualVars) item.visualVars=[{id:uid('var'),name:'المخزون الحالي',unit:'قطعة',min:0,max:500,current:68,mode:'percent',visible:true}];
  if(!item.visualLinks) item.visualLinks=[];
  if(!Array.isArray(item.visualLinks)) item.visualLinks=Object.keys(item.visualLinks).filter(k=>item.visualLinks[k]).map(k=>({id:uid('link'),sourceVar:'المخزون الحالي',targetType:k,targetId:k,targetField:'القيمة الحالية',sync:'live'}));
  if(!item.visualIndicator) item.visualIndicator={x:55,y:8};
  return item;
}

function visualPercent(v){ const min=Number(v.min)||0,max=Number(v.max)||1,cur=Number(v.current)||0; return Math.max(0,Math.min(100,Math.round((cur-min)/(max-min)*100))); }

function visualOneHTML(v){
  const pct=visualPercent(v), color=pct<20?'var(--red)':pct<45?'var(--yellow)':'var(--green)';
  if(v.visible===false) return '';
  let mark='';
  if(v.mode==='percent') mark=`<span class="vv-value">${pct}%</span><span class="vv-bar"><i style="width:${pct}%;background:${color}"></i></span>`;
  if(v.mode==='indicator') mark=`<span class="vv-bar" style="width:64px"><i style="width:${pct}%;background:${color}"></i></span><span class="vv-value">${pct}%</span>`;
  if(v.mode==='light') mark=`<i class="vv-light" style="color:${color};background:${color}"></i><span class="vv-value">${pct}%</span>`;
  if(v.mode==='level') mark=`<span class="vv-level">${[1,2,3,4,5].map(n=>`<i style="height:${n*2+2}px;opacity:${pct>=n*20?1:.22};background:${color}"></i>`).join('')}</span><span class="vv-value">${pct}%</span>`;
  if(v.mode==='graph') mark=`<span class="vv-graph">▁▃▂▅▆▇</span><span class="vv-value">${pct}%</span>`;
  return `<span class="visual-var"><span class="vv-name">${v.name}</span>${mark}</span>`;
}

function visualVarsHTML(item,kind){
  ensureVisual(item);
  const strip=(item.visualVars||[]).map(visualOneHTML).join('');
  if(!strip) return '';
  const pos=item.visualIndicator||{x:55,y:8};
  const drag=kind==='box'?`<span class="visual-drag-indicator" data-visual-indicator="${item.id}" style="left:${pos.x}px;top:${pos.y}px;background:var(--amber-dim);border:1px solid var(--amber);border-radius:5px;padding:2px 5px;font-size:9px;color:var(--amber)">اسحب المؤشر</span>`:'';
  return `<div class="visual-var-strip" style="position:relative"><span style="font-size:9px;color:var(--dim2);width:100%">مؤشرات مرتبطة</span>${strip}${drag}</div>`;
}

function visualVarRowHTML(v){
  return `<div class="visual-var-row" data-vrow="${v.id}">
    <div class="field"><label>اسم المتغير</label><input data-v="name" value="${v.name||''}"></div>
    <div class="field"><label>Min</label><input data-v="min" type="number" value="${v.min??0}"></div>
    <div class="field"><label>Max</label><input data-v="max" type="number" value="${v.max??100}"></div>
    <div class="field"><label>الحالي</label><input data-v="current" type="number" value="${v.current??0}"></div>
    <div class="field"><label>طريقة العرض</label><select data-v="mode">${[['percent','نسبة مئوية'],['indicator','مؤشر'],['light','لمبة'],['level','مستوى'],['graph','جراف']].map(x=>`<option value="${x[0]}" ${v.mode===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
    <button class="btn small danger" data-v-delete>حذف</button>
  </div>`;
}

function visualLinkRowHTML(link){
  const storage=[...allRacks(),...state.columns,...state.boxes];
  const sourceOptions=storage.map(x=>`<option value="${x.id}" ${link.sourceId===x.id?'selected':''}>${x.name||x.label}</option>`).join('');
  const targetOptions=`<option value="alerts" ${link.targetId==='alerts'?'selected':''}>التنبيهات</option><option value="purchases" ${link.targetId==='purchases'?'selected':''}>المشتريات</option><option value="components" ${link.targetId==='components'?'selected':''}>المكونات</option>`+storage.map(x=>`<option value="${x.id}" ${link.targetId===x.id?'selected':''}>${x.name||x.label}</option>`).join('');
  const varOptions=(item.visualVars||[]).map(v=>`<option ${link.sourceVar===v.name?'selected':''}>${v.name}</option>`).join('');
  return `<div class="visual-link-row" data-vlink-row="${link.id}">
    <div class="field"><label>العنصر المصدر</label><select data-link="sourceId"><option value="${item.id}" ${!link.sourceId||link.sourceId===item.id?'selected':''}>هذا العنصر</option>${sourceOptions}</select></div>
    <div class="field"><label>المتغير</label><select data-link="sourceVar">${varOptions||'<option>المخزون الحالي</option>'}</select></div>
    <div class="field"><label>الهدف</label><select data-link="targetId">${targetOptions}</select></div>
    <div class="field"><label>حقل الهدف</label><select data-link="targetField"><option ${link.targetField==='القيمة الحالية'?'selected':''}>القيمة الحالية</option><option ${link.targetField==='حد التحذير'?'selected':''}>حد التحذير</option><option ${link.targetField==='حد الخطر'?'selected':''}>حد الخطر</option><option ${link.targetField==='الكمية المطلوبة'?'selected':''}>الكمية المطلوبة</option><option ${link.targetField==='الحالة'?'selected':''}>الحالة</option></select></div>
    <div class="field"><label>التحويل</label><select data-link="transform"><option value="same" ${link.transform==='same'?'selected':''}>نفس القيمة</option><option value="percent" ${link.transform==='percent'?'selected':''}>تحويل إلى ٪</option><option value="invert" ${link.transform==='invert'?'selected':''}>عكس النسبة</option><option value="boolean" ${link.transform==='boolean'?'selected':''}>حالة نعم/لا</option></select></div>
    <div class="field"><label>المزامنة</label><select data-link="sync"><option value="live" ${link.sync==='live'?'selected':''}>مباشرة</option><option value="onChange" ${link.sync==='onChange'?'selected':''}>عند التغيير</option><option value="manual" ${link.sync==='manual'?'selected':''}>يدوية</option></select></div>
    <button class="btn small danger" data-link-delete>حذف</button>
  </div>`;
}

function openVisualVariables(id,kind){
  const item=ensureVisual(visualItem(id,kind)); if(!item) return;
  const rows=(item.visualVars||[]).map(visualVarRowHTML).join('');
  const links=(item.visualLinks||[]).map(x=>visualLinkRowHTML({...x,sourceId:x.sourceId||item.id})).join('');
  openModal(`متغيرات ومؤشرات ${visualLabel(kind)}`,`
    <div class="visual-modal-intro">أضف أي متغير تريد عرضه خارج ${visualLabel(kind)}. النسبة تحسب من Min وMax، ويمكن تغيير طريقة العرض أو إخفاؤها لاحقًا. الإعدادات تحفظ داخل نفس بيانات الصفحة.</div>
    <div id="visualVarRows">${rows}</div>
    <button class="btn small" id="visualAddVar">+ إضافة متغير</button>
    <h3 style="font-size:13px;margin:18px 0 6px">العلاقات والربط</h3>
    <div class="visual-modal-intro">اختر من أين تأتي القيمة، أي متغير يتم نقله، وإلى أي هدف. يمكنك إنشاء أكثر من علاقة مستقلة بدل الربط العام.</div>
    <div id="visualLinkRows">${links||'<div class="visual-link-empty">لا توجد علاقات بعد</div>'}</div>
    <button class="btn small" id="visualAddLink">+ إضافة علاقة</button>
    <label class="check-row" style="border:0"><input id="visualApplyAll" type="checkbox"><span class="ctext">تطبيق المتغيرات والعلاقات على كل الرفوف والأعمدة والعبوات</span></label>
  `,`<button class="btn" id="visualCancel">إلغاء</button><button class="btn primary" id="visualSave">حفظ المتغيرات</button>`);
  const rowsEl=document.getElementById('visualVarRows');
  const linksEl=document.getElementById('visualLinkRows');
  document.getElementById('visualAddVar').onclick=()=>rowsEl.insertAdjacentHTML('beforeend',visualVarRowHTML({id:uid('var'),name:'متغير جديد',unit:'',min:0,max:100,current:50,mode:'percent',visible:true}));
   document.getElementById('visualAddLink').onclick=()=>{linksEl.querySelector('.visual-link-empty')?.remove();linksEl.insertAdjacentHTML('beforeend',visualLinkRowHTML({id:uid('link'),sourceId:item.id,sourceVar:item.visualVars[0]?.name||'المخزون الحالي',targetId:'alerts',targetField:'القيمة الحالية',transform:'same',sync:'live'}));};
  rowsEl.addEventListener('click',e=>{if(e.target.closest('[data-v-delete]')) e.target.closest('[data-vrow]').remove();});
  linksEl.addEventListener('click',e=>{if(e.target.closest('[data-link-delete]')) e.target.closest('[data-vlink-row]').remove();});
  document.getElementById('visualCancel').onclick=closeModal;
  document.getElementById('visualSave').onclick=()=>{
    const vars=[...rowsEl.querySelectorAll('[data-vrow]')].map(row=>{const get=k=>row.querySelector(`[data-v="${k}"]`);return {id:row.dataset.vrow,name:get('name').value.trim()||'متغير',unit:'',min:Number(get('min').value)||0,max:Number(get('max').value)||100,current:Number(get('current').value)||0,mode:get('mode').value,visible:true};});
    const links=[...linksEl.querySelectorAll('[data-vlink-row]')].map(row=>{const get=k=>row.querySelector(`[data-link="${k}"]`);return {id:row.dataset.vlinkRow,sourceId:get('sourceId').value,sourceVar:get('sourceVar').value,targetId:get('targetId').value,targetField:get('targetField').value,transform:get('transform').value,sync:get('sync').value};});
    const apply=document.getElementById('visualApplyAll').checked;
    const targets=apply?[...allRacks(),...state.columns,...state.boxes]:[item];
    targets.forEach(t=>{t.visualVars=JSON.parse(JSON.stringify(vars));t.visualLinks=JSON.parse(JSON.stringify(links));});
    scheduleSave(); closeModal(); showView('storage'); toast(apply?'تم تطبيق الإعدادات على كل عناصر التخزين':'تم حفظ المتغيرات والمؤشرات');
  };
}

function wireVisualIndicators(){
  document.querySelectorAll('[data-visual-indicator]').forEach(el=>{
    const id=el.dataset.visualIndicator, box=findBox(id); if(!box) return;
    ensureVisual(box); el.addEventListener('pointerdown',e=>{
      e.preventDefault(); const startX=e.clientX,startY=e.clientY,orig={...box.visualIndicator}; el.setPointerCapture(e.pointerId);
      const move=ev=>{box.visualIndicator.x=Math.max(0,orig.x+ev.clientX-startX);box.visualIndicator.y=Math.max(0,orig.y+ev.clientY-startY);el.style.left=box.visualIndicator.x+'px';el.style.top=box.visualIndicator.y+'px';};
      const end=()=>{el.releasePointerCapture(e.pointerId);el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);scheduleSave();};
      el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);
    });
  });
}

function applyPreferences(){
  const p=state&&state.preferences; if(!p) return;
  const root=document.documentElement;
  root.style.setProperty('--cell-height',Math.max(32,Number(p.grid.cellHeight)||58)+'px');
  root.style.setProperty('--cell-font',Math.max(9,Number(p.grid.fontSize)||11)+'px');
  root.style.setProperty('--grid-gap',Math.max(1,Number(p.grid.gap)||5)+'px');
  root.style.setProperty('--column-width',Math.max(140,Number(p.grid.columnWidth)||200)+'px');
  root.style.setProperty('--page-padding',Math.max(8,Number(p.page.padding)||26)+'px');
  root.style.setProperty('--page-font',Math.max(10,Number(p.page.fontSize)||13)+'px');
  root.style.setProperty('--page-gap',Math.max(0,Number(p.page.gap)||18)+'px');
}

/* ============================= VIEWS ============================= */
function viewHeader(title,sub){
  return `<div class="view-title"><h1>${title}</h1><span class="sub">${sub||''}</span></div>`;
}

function computeNotifications(){
  const list=[];
  state.components.forEach(comp=>{
    const total=totalQtyOfComponent(comp.id);
    if(total<=0) list.push({type:'crit',icon:'⛔',text:`${comp.name} — نفد المخزون`,go:()=>{showView('components');}});
    else if(total<=comp.criticalStock) list.push({type:'crit',icon:'🔴',text:`${comp.name} — مستوى حرج (${total})`,go:()=>{showView('components');}});
    else if(total<=comp.warningStock) list.push({type:'warn',icon:'⚠️',text:`${comp.name} — مخزون منخفض (${total})`,go:()=>{showView('components');}});
  });
  const pendingPurchases=state.purchases.filter(p=>p.status==='pending').length;
  if(pendingPurchases) list.push({type:'info',icon:'🛒',text:`${pendingPurchases} عناصر بانتظار الشراء`,go:()=>showView('purchases')});
  const failedExp=state.experiments.filter(e=>e.result==='FAIL').length;
  if(failedExp) list.push({type:'info',icon:'🧪',text:`${failedExp} تجارب بنتيجة FAIL تحتاج مراجعة`,go:()=>showView('experiments')});
  return list;
}

function cellIndicatorConfig(cell){
  const d=cell&&cell.indicator;
  if(!d) return {enabled:false,type:'text',source:'quantity',label:'',value:'',color:'#5aa7ff',min:0,max:100};
  return {
    enabled:d.enabled!==false,
    type:d.type||'text',
    source:d.source||'quantity',
    label:d.label||'',
    value:d.value==null?'':String(d.value),
    color:d.color||'#5aa7ff',
    min:Number.isFinite(Number(d.min))?Number(d.min):0,
    max:Number.isFinite(Number(d.max))?Number(d.max):100
  };
}
function escCellIndicator(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function cellIndicatorValue(cell){
  const cfg=cellIndicatorConfig(cell);
  const comp=cell&&cell.componentId?findComponent(cell.componentId):null;
  let value='';
  if(cfg.source==='quantity') value=cell?cell.quantity:0;
  else if(cfg.source==='status') value=cell?statusLabelAr(cellStatus(cell)):'فارغة';
  else if(cfg.source==='voltage') value=comp?.voltage||'';
  else if(cfg.source==='current') value=comp?.current||'';
  else if(cfg.source==='value') value=comp?.value||'';
  else if(cfg.source==='partNumber') value=comp?.partNumber||'';
  else if(cfg.source==='componentName') value=comp?.name||'';
  else if(cfg.source==='link') value=(comp?.links||[])[0]||'';
  else value=cfg.value;
  return String(value??'');
}
function cellIndicatorPercent(cell){
  const cfg=cellIndicatorConfig(cell);
  const raw=Number(cellIndicatorValue(cell));
  if(!Number.isFinite(raw)) return 0;
  const min=Number(cfg.min||0), max=Number(cfg.max||100);
  if(max<=min) return raw>min?100:0;
  return Math.max(0,Math.min(100,((raw-min)/(max-min))*100));
}
function cellIndicatorHTML(cell){
  const cfg=cellIndicatorConfig(cell);
  if(!cfg.enabled) return '';
  const raw=cellIndicatorValue(cell);
  const label=cfg.label?escCellIndicator(cfg.label)+': ':'';
  const value=escCellIndicator(raw);
  const color=escCellIndicator(cfg.color||'#5aa7ff');
  if(cfg.type==='lamp'){
    return `<div class="cell-indicator ind-lamp" title="${label}${value}" style="--ind-color:${color}"><span class="ind-lamp-dot"></span><span class="ind-label">${label}${value}</span></div>`;
  }
  if(cfg.type==='bar'){
    const pct=cellIndicatorPercent(cell).toFixed(0);
    return `<div class="cell-indicator ind-bar" title="${label}${value}" style="--ind-color:${color};--ind-pct:${pct}%"><span class="ind-bar-fill"></span></div>`;
  }
  if(cfg.type==='number'){
    return `<div class="cell-indicator ind-number" title="${label}${value}" style="color:${color}">${label}${value}</div>`;
  }
  if(cfg.type==='badge'){
    return `<div class="cell-indicator ind-badge" title="${label}${value}" style="border-color:${color};color:${color}">${label}${value}</div>`;
  }
  return `<div class="cell-indicator ind-text" title="${label}${value}" style="color:${color}">${label}${value}</div>`;
}

function mixIndicatorMode(){
  try{
    const v=localStorage.getItem('workshop_cell_indicator_mode');
    return ['cells','percent','level','lamp'].includes(v)?v:'cells';
  }catch(e){return 'cells'}
}
function cycleMixIndicatorMode(){
  const order=['cells','percent','level','lamp'];
  const cur=mixIndicatorMode(), next=order[(order.indexOf(cur)+1)%order.length];
  try{localStorage.setItem('workshop_cell_indicator_mode',next)}catch(e){}
  if(typeof showView==='function')showView('storage');
}
function mixIndicatorHTML(box,occ,total){
  const ratio=total?Math.max(0,Math.min(1,occ/total)):0;
  const pct=Math.round(ratio*100);
  const mode=mixIndicatorMode();
  let visual='';

  if(mode==='cells'){
    const cells=cellsOfBox(box.id);
    const rows=Math.max(1,Number(box.rows)||1);
    const cols=Math.max(1,Number(box.cols)||cells.length||1);
    const dots=cells.map((cell,i)=>{
      const status=cellStatus(cell);
      const label=cell.componentId
        ? `${i+1}: ${statusLabelAr(status)} · ${cell.quantity}`
        : `${i+1}: فارغة`;
      return `<i class="vs3-cell-dot status-${status}" title="${label}"></i>`;
    }).join('');
    visual=`<span class="vs3-cell-map" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)" title="حالة كل خلية">${dots}</span>`;
  }else if(mode==='level'){
    const n=Math.round(ratio*5);
    visual='<span class="vs3-mix-level" title="مستوى الامتلاء '+pct+'%">'+
      [0,1,2,3,4].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')+'</span>';
  }else if(mode==='lamp'){
    const alpha=(.22+ratio*.78).toFixed(2);
    const hue=Math.round(12+ratio*38);
    visual=`<span class="vs3-mix-lamp" title="حالة المكس ${pct}%" style="background:hsl(${hue} 75% 58% / ${alpha});box-shadow:0 0 ${Math.round(3+ratio*8)}px hsl(${hue} 75% 58% / ${Math.min(1,.18+ratio*.55)})"></span>`;
  }else{
    visual=`<span class="vs3-mix-percent" title="نسبة الخلايا المشغولة">${pct}%</span>`;
  }

  return `<div class="vs3-mix-indicator">${visual}</div>
    <button class="vs3-mix-control" type="button" onclick="event.stopPropagation();cycleMixIndicatorMode()" title="تغيير شكل مؤشر حالة الخلايا">↻</button>`;
}

/* يفتح الرف بحجم الصفحة، يختار العبوة المطلوبة (تظهر تقسيمتها ومحتواها أسفل الأعمدة)،
   ثم يعمل فلاش متسلسل: رف ← عمود/عبوة ← لوحة التفاصيل ← خلية، وتبقى الخلية توميض حتى يفتحها المستخدم */
function revealAndFlash(cellId){
  const cell=findContainer(cellId); if(!cell) return;
  const box=findBox(cell.boxId); if(!box) return;
  const col=findColumn(box.columnId); if(!col) return;
  const rack=allRacks().find(r=>r.id===col.rackId); if(!rack) return;

  uiState.expandedRack=rack.id;
  uiState.selectedBox=box.id;
  showView('storage');

  setTimeout(()=>{
    const wrapEl=document.querySelector('.rack-fullpage-wrap');
    const colEl=document.querySelector(`.rack-column[data-col-id="${col.id}"]`);
    const chipEl=document.querySelector(`.box-chip[data-box-id="${box.id}"]`);
    const panelEl=document.querySelector('[data-detail-panel]');
    const cellEl=document.querySelector(`.cell[data-cell-id="${cellId}"]`);

    if(wrapEl) wrapEl.scrollIntoView({behavior:'smooth',block:'start'});

    if(colEl){ colEl.classList.add('flash-step'); setTimeout(()=>colEl.classList.remove('flash-step'),1150); }
    setTimeout(()=>{ if(chipEl){ chipEl.classList.add('flash-step'); setTimeout(()=>chipEl.classList.remove('flash-step'),1150); } },380);
    setTimeout(()=>{ if(panelEl){ panelEl.classList.add('flash-step'); setTimeout(()=>panelEl.classList.remove('flash-step'),1150); } },760);
    setTimeout(()=>{
      if(cellEl){ cellEl.scrollIntoView({behavior:'smooth',block:'center'}); cellEl.classList.add('flash-wait'); }
    },1150);
  },80);
}
function jumpToCell(cellId){ revealAndFlash(cellId); }

function addColumn(rackId){
  const cols=columnsOfRack(rackId);
  state.columns.push({id:uid('col'),rackId,order:cols.length+1,name:labelFor('column')+' '+(cols.length+1)});
  scheduleSave(); showView('storage');

function removeColumn(colId){
  if(!confirm('سيتم حذف هذا العمود وكل العبوات والخلايا بداخله نهائيًا. هل أنت متأكد؟')) return;
  const boxIds=new Set(boxesOfColumn(colId).map(b=>b.id));
  state.containers=state.containers.filter(c=>!boxIds.has(c.boxId));
  state.boxes=state.boxes.filter(b=>b.columnId!==colId);
  state.columns=state.columns.filter(c=>c.id!==colId);
  scheduleSave(); showView('storage');
}

function normalizeColumnOrders(rackId){
  columnsOfRack(rackId).forEach((c,i)=>c.order=i+1);
}
function moveColumn(colId, direction){
  const col=findColumn(colId); if(!col) return;
  const cols=columnsOfRack(col.rackId);
  const i=cols.findIndex(c=>c.id===colId);
  const j=i+direction;
  if(j<0 || j>=cols.length){ toast(direction<0?'العمود بالفعل في أقصى اليسار':'العمود بالفعل في أقصى اليمين'); return; }
  const other=cols[j];
  const tmp=col.order; col.order=other.order; other.order=tmp;
  normalizeColumnOrders(col.rackId);
  scheduleSave();
  uiState.selectedColumn=colId;
  showView('storage');
}
function swapColumns(colAId,colBId){
  const a=findColumn(colAId),b=findColumn(colBId);
  if(!a||!b||a.rackId!==b.rackId)return;
  const tmp=a.order;a.order=b.order;b.order=tmp;
  normalizeColumnOrders(a.rackId);
  scheduleSave();showView('storage');
}
function columnDropHandler(e,targetColId){
  e.preventDefault();
  const sourceId=e.dataTransfer.getData('text/plain');
  if(!sourceId || sourceId===targetColId)return;
  const a=findColumn(sourceId),b=findColumn(targetColId);
  if(!a||!b||a.rackId!==b.rackId)return;
  const cols=columnsOfRack(a.rackId);
  const from=cols.findIndex(c=>c.id===sourceId), to=cols.findIndex(c=>c.id===targetColId);
  if(from<0||to<0)return;
  const moved=cols.splice(from,1)[0];
  cols.splice(to,0,moved);
  cols.forEach((c,i)=>c.order=i+1);
  state.columns.forEach(c=>{
    if(c.rackId===a.rackId){
      const hit=cols.find(x=>x.id===c.id); if(hit)c.order=hit.order;
    }
  });
  scheduleSave();
  uiState.selectedColumn=sourceId;
  showView('storage');
}

function setBoxLayout(boxId,rowsRaw,colsRaw){
  const box=findBox(boxId); if(!box) return;
  const rows=Math.max(1,Math.min(20,Number(rowsRaw)||1));
  const cols=Math.max(1,Math.min(20,Number(colsRaw)||1));
  const newCount=rows*cols;
  const cells=cellsOfBox(boxId);
  if(newCount<cells.length){
    const toRemove=cells.slice(newCount);
    if(toRemove.some(c=>c.componentId)){ toast('لا يمكن تصغير التقسيمة: بعض الخلايا مشغولة — أفرغها أولًا'); return; }
    const removeIds=new Set(toRemove.map(c=>c.id));
    state.containers=state.containers.filter(c=>!removeIds.has(c.id));
  } else if(newCount>cells.length){
    for(let i=cells.length;i<newCount;i++){ state.containers.push({id:uid('cell'),boxId,index:i,componentId:null,quantity:0,dateAdded:nowISO()}); }
  }
  box.rows=rows; box.cols=cols; box.cellCount=newCount;
  scheduleSave(); closeModal(); showView('storage'); toast('تم تحديث تقسيمة العبوة');
}

function renderMap(){

  `<div class="map-board" id="mapBoard" style="height:560px;">

    </div>`).join('')}
  </div>`;
  document.querySelectorAll('.map-item').forEach(el=>{
    let dragging=false, sx=0, sy=0, ox=0, oy=0;
    el.addEventListener('pointerdown',e=>{
      dragging=true; sx=e.clientX; sy=e.clientY;
      const m=state.workshopMap.find(x=>x.id===el.dataset.id);
      ox=m.x; oy=m.y; el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove',e=>{
      if(!dragging) return;
      const dx=sx-e.clientX, dy=e.clientY-sy;
      const m=state.workshopMap.find(x=>x.id===el.dataset.id);
      m.x=Math.max(0,ox+dx); m.y=Math.max(0,oy+dy);
      el.style.right=m.x+'px'; el.style.top=m.y+'px';
    });
    el.addEventListener('pointerup',()=>{ if(dragging){ dragging=false; scheduleSave(); } });
    el.addEventListener('click',e=>{
      if(Math.abs(e.clientX-sx)>4||Math.abs(e.clientY-sy)>4) return;
      const m=state.workshopMap.find(x=>x.id===el.dataset.id);
      if(m.refId){ uiState.expandedRack=m.refId; uiState.selectedBox=null; showView('storage'); setTimeout(()=>{ const wrapEl=document.querySelector('.rack-fullpage-wrap'); if(wrapEl){ wrapEl.scrollIntoView({behavior:'smooth',block:'start'}); wrapEl.classList.add('flash-step'); setTimeout(()=>wrapEl.classList.remove('flash-step'),1150); } },60); }
    });
  });
}

function addToPurchaseList(compId){
  const comp=findComponent(compId);
  if(state.purchases.some(p=>p.componentId===compId && p.status==='pending')){ toast('موجود بالفعل في قائمة الشراء'); return; }
  const total=totalQtyOfComponent(compId);
  const need=Math.max(comp.targetStock-total,comp.reorderQty||0,1);
  const priority= total<=comp.criticalStock?'HIGH':'MEDIUM';
  state.purchases.unshift({id:uid('pur'),componentId:compId,need,priority,status:'pending',supplier:comp.supplier||'',price:comp.purchasePrice||0,date:nowISO()});
  scheduleSave(); toast('تمت الإضافة إلى قائمة الشراء'); showView(currentView);
}

function updatePurchaseField(id,field,val){ const p=state.purchases.find(x=>x.id===id); if(p){p[field]=val; scheduleSave();} }
function removePurchase(id){ state.purchases=state.purchases.filter(p=>p.id!==id); scheduleSave(); showView('purchases'); }
function receivePurchase(id){
  const p=state.purchases.find(x=>x.id===id); if(!p) return;
  if(!p.componentId){
    state.purchases=state.purchases.filter(x=>x.id!==id);
    scheduleSave(); showView('purchases'); toast('تم تعليم الصنف اليدوي كمُستلم');
    return;
  }
  const comp=findComponent(p.componentId);
  const containers=containerOfComponent(p.componentId);
  let target=containers[0];
  if(!target){ toast('لا يوجد موقع فعلي لهذا المكون — أضفه أولًا من التخزين المرئي'); return; }
  target.quantity+=p.need;
  state.usageHistory.unshift({id:uid('h'),date:nowISO(),componentId:p.componentId,type:'purchase',qtyChange:p.need,project:'',purpose:'استلام مشتريات',notes:'المورد: '+(p.supplier||'-'),fromLocation:'',toLocation:target.id});
  state.purchases=state.purchases.filter(x=>x.id!==id);
  scheduleSave(); showView('purchases'); toast('تم استلام الكمية وإضافتها للمخزون');
}
