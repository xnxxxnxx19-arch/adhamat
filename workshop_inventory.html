/* ============================= STORAGE CELL SYSTEM ENHANCEMENTS ============================= */
/* نقل نظام المؤشرات والربط المرتبط بالرف/العمود/العبوة من النسخة المصدر،
   مع الإبقاء على نظام التوثيق التقني ونظام تحريك/تحجيم التخزين الموجودين في النسخة المعدلة. */

function ensureStoragePreferences(){
  if(!state) return;
  const d={
    labels:{shelf:'رف',drawer:'درج',column:'عمود',box:'عبوة',cell:'خلية'},
    grid:{columns:4,gap:5,cellHeight:58,fontSize:11,columnWidth:200},
    colors:{amber:'#f2a93c',blue:'#4da3ff',green:'#3ddc84',yellow:'#f2c53d',red:'#ff5d5d'},
    page:{padding:26,fontSize:13,flow:'column',gap:18,mainWidth:'auto'},
    addBehavior:{newRack:'storage',newColumn:'open',newBox:'select'}
  };
  if(!state.preferences) state.preferences=JSON.parse(JSON.stringify(d));
  else{
    state.preferences.labels=Object.assign({},d.labels,state.preferences.labels||{});
    state.preferences.grid=Object.assign({},d.grid,state.preferences.grid||{});
    state.preferences.colors=Object.assign({},d.colors,state.preferences.colors||{});
    state.preferences.page=Object.assign({},d.page,state.preferences.page||{});
    state.preferences.addBehavior=Object.assign({},d.addBehavior,state.preferences.addBehavior||{});
  }
  state.columns=Array.isArray(state.columns)?state.columns:[];
  state.boxes=Array.isArray(state.boxes)?state.boxes:[];
  state.containers=Array.isArray(state.containers)?state.containers:[];
}

function labelFor(kind){
  return (state.preferences&&state.preferences.labels&&state.preferences.labels[kind]) ||
    ({shelf:'رف',drawer:'درج',column:'عمود',box:'عبوة',cell:'خلية'}[kind]||kind);
}

function visualLabel(kind){ return kind==='rack'?'الرف / الدرج':kind==='column'?'العمود':'العبوة'; }

function visualItem(id,kind){
  if(kind==='rack') return allRacks().find(x=>x.id===id);
  if(kind==='column') return findColumn(id);
  return findBox(id);
}

function ensureVisual(item){
  if(!item.visualVars) item.visualVars=[{id:uid('var'),name:'المخزون الحالي',unit:'قطعة',min:0,max:500,current:68,mode:'percent',visible:true}];
  if(!item.visualLinks) item.visualLinks=[];
  if(!Array.isArray(item.visualLinks)) item.visualLinks=Object.keys(item.visualLinks).filter(k=>item.visualLinks[k]).map(k=>({id:uid('link'),sourceVar:'المخزون الحالي',targetType:k,targetId:k,targetField:'القيمة الحالية',sync:'live'}));
  if(!item.visualIndicator) item.visualIndicator={x:55,y:8};
  return item;
}

function visualPercent(v){ const min=Number(v.min)||0,max=Number(v.max)||1,cur=Number(v.current)||0; return Math.max(0,Math.min(100,Math.round((cur-min)/(max-min)*100))); }

function visualOneHTML(v){
  const pct=visualPercent(v), color=pct<20?'var(--red)':pct<45?'var(--yellow)':'var(--green)';
  if(v.visible===false) return '';
  let mark='';
  if(v.mode==='percent') mark=`<span class="vv-value">${pct}%</span><span class="vv-bar"><i style="width:${pct}%;background:${color}"></i></span>`;
  if(v.mode==='indicator') mark=`<span class="vv-bar" style="width:64px"><i style="width:${pct}%;background:${color}"></i></span><span class="vv-value">${pct}%</span>`;
  if(v.mode==='light') mark=`<i class="vv-light" style="color:${color};background:${color}"></i><span class="vv-value">${pct}%</span>`;
  if(v.mode==='level') mark=`<span class="vv-level">${[1,2,3,4,5].map(n=>`<i style="height:${n*2+2}px;opacity:${pct>=n*20?1:.22};background:${color}"></i>`).join('')}</span><span class="vv-value">${pct}%</span>`;
  if(v.mode==='graph') mark=`<span class="vv-graph">▁▃▂▅▆▇</span><span class="vv-value">${pct}%</span>`;
  return `<span class="visual-var"><span class="vv-name">${v.name}</span>${mark}</span>`;
}

function visualVarsHTML(item,kind){
  ensureVisual(item);
  const strip=(item.visualVars||[]).map(visualOneHTML).join('');
  if(!strip) return '';
  const pos=item.visualIndicator||{x:55,y:8};
  const drag=kind==='box'?`<span class="visual-drag-indicator" data-visual-indicator="${item.id}" style="left:${pos.x}px;top:${pos.y}px;background:var(--amber-dim);border:1px solid var(--amber);border-radius:5px;padding:2px 5px;font-size:9px;color:var(--amber)">اسحب المؤشر</span>`:'';
  return `<div class="visual-var-strip" style="position:relative"><span style="font-size:9px;color:var(--dim2);width:100%">مؤشرات مرتبطة</span>${strip}${drag}</div>`;
}

function visualVarRowHTML(v){
  return `<div class="visual-var-row" data-vrow="${v.id}">
    <div class="field"><label>اسم المتغير</label><input data-v="name" value="${v.name||''}"></div>
    <div class="field"><label>Min</label><input data-v="min" type="number" value="${v.min??0}"></div>
    <div class="field"><label>Max</label><input data-v="max" type="number" value="${v.max??100}"></div>
    <div class="field"><label>الحالي</label><input data-v="current" type="number" value="${v.current??0}"></div>
    <div class="field"><label>طريقة العرض</label><select data-v="mode">${[['percent','نسبة مئوية'],['indicator','مؤشر'],['light','لمبة'],['level','مستوى'],['graph','جراف']].map(x=>`<option value="${x[0]}" ${v.mode===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
    <button class="btn small danger" data-v-delete>حذف</button>
  </div>`;
}

function visualLinkRowHTML(link){
  const storage=[...allRacks(),...state.columns,...state.boxes];
  const sourceOptions=storage.map(x=>`<option value="${x.id}" ${link.sourceId===x.id?'selected':''}>${x.name||x.label}</option>`).join('');
  const targetOptions=`<option value="alerts" ${link.targetId==='alerts'?'selected':''}>التنبيهات</option><option value="purchases" ${link.targetId==='purchases'?'selected':''}>المشتريات</option><option value="components" ${link.targetId==='components'?'selected':''}>المكونات</option>`+storage.map(x=>`<option value="${x.id}" ${link.targetId===x.id?'selected':''}>${x.name||x.label}</option>`).join('');
  const varOptions=(item.visualVars||[]).map(v=>`<option ${link.sourceVar===v.name?'selected':''}>${v.name}</option>`).join('');
  return `<div class="visual-link-row" data-vlink-row="${link.id}">
    <div class="field"><label>العنصر المصدر</label><select data-link="sourceId"><option value="${item.id}" ${!link.sourceId||link.sourceId===item.id?'selected':''}>هذا العنصر</option>${sourceOptions}</select></div>
    <div class="field"><label>المتغير</label><select data-link="sourceVar">${varOptions||'<option>المخزون الحالي</option>'}</select></div>
    <div class="field"><label>الهدف</label><select data-link="targetId">${targetOptions}</select></div>
    <div class="field"><label>حقل الهدف</label><select data-link="targetField"><option ${link.targetField==='القيمة الحالية'?'selected':''}>القيمة الحالية</option><option ${link.targetField==='حد التحذير'?'selected':''}>حد التحذير</option><option ${link.targetField==='حد الخطر'?'selected':''}>حد الخطر</option><option ${link.targetField==='الكمية المطلوبة'?'selected':''}>الكمية المطلوبة</option><option ${link.targetField==='الحالة'?'selected':''}>الحالة</option></select></div>
    <div class="field"><label>التحويل</label><select data-link="transform"><option value="same" ${link.transform==='same'?'selected':''}>نفس القيمة</option><option value="percent" ${link.transform==='percent'?'selected':''}>تحويل إلى ٪</option><option value="invert" ${link.transform==='invert'?'selected':''}>عكس النسبة</option><option value="boolean" ${link.transform==='boolean'?'selected':''}>حالة نعم/لا</option></select></div>
    <div class="field"><label>المزامنة</label><select data-link="sync"><option value="live" ${link.sync==='live'?'selected':''}>مباشرة</option><option value="onChange" ${link.sync==='onChange'?'selected':''}>عند التغيير</option><option value="manual" ${link.sync==='manual'?'selected':''}>يدوية</option></select></div>
    <button class="btn small danger" data-link-delete>حذف</button>
  </div>`;
}

  const item=ensureVisual(visualItem(id,kind)); if(!item) return;

  const linksEl=document.getElementById('visualLinkRows');

   document.getElementById('visualAddLink').onclick=()=>{linksEl.querySelector('.visual-link-empty')?.remove();linksEl.insertAdjacentHTML('beforeend',visualLinkRowHTML({id:uid('link'),sourceId:item.id,sourceVar:item.visualVars[0]?.name||'المخزون الحالي',targetId:'alerts',targetField:'القيمة الحالية',transform:'same',sync:'live'}));};
  rowsEl.addEventListener('click',e=>{if(e.target.closest('[data-v-delete]')) e.target.closest('[data-vrow]').remove();});
  linksEl.addEventListener('click',e=>{if(e.target.closest('[data-link-delete]')) e.target.closest('[data-vlink-row]').remove();});
  document.getElementById('visualCancel').onclick=closeModal;
  document.getElementById('visualSave').onclick=()=>{
    const vars=[...rowsEl.querySelectorAll('[data-vrow]')].map(row=>{const get=k=>row.querySelector(`[data-v="${k}"]`);return {id:row.dataset.vrow,name:get('name').value.trim()||'متغير',unit:'',min:Number(get('min').value)||0,max:Number(get('max').value)||100,current:Number(get('current').value)||0,mode:get('mode').value,visible:true};});
    const links=[...linksEl.querySelectorAll('[data-vlink-row]')].map(row=>{const get=k=>row.querySelector(`[data-link="${k}"]`);return {id:row.dataset.vlinkRow,sourceId:get('sourceId').value,sourceVar:get('sourceVar').value,targetId:get('targetId').value,targetField:get('targetField').value,transform:get('transform').value,sync:get('sync').value};});
    const apply=document.getElementById('visualApplyAll').checked;
    const targets=apply?[...allRacks(),...state.columns,...state.boxes]:[item];
    targets.forEach(t=>{t.visualVars=JSON.parse(JSON.stringify(vars));t.visualLinks=JSON.parse(JSON.stringify(links));});
    scheduleSave(); closeModal(); showView('storage'); toast(apply?'تم تطبيق الإعدادات على كل عناصر التخزين':'تم حفظ المتغيرات والمؤشرات');
  };
}

function wireVisualIndicators(root){
  (root||document).querySelectorAll('[data-visual-indicator]').forEach(el=>{
    const id=el.dataset.visualIndicator, box=findBox(id); if(!box) return;
    ensureVisual(box); el.addEventListener('pointerdown',e=>{
      e.preventDefault(); const startX=e.clientX,startY=e.clientY,orig={...box.visualIndicator}; el.setPointerCapture(e.pointerId);
      const move=ev=>{box.visualIndicator.x=Math.max(0,orig.x+ev.clientX-startX);box.visualIndicator.y=Math.max(0,orig.y+ev.clientY-startY);el.style.left=box.visualIndicator.x+'px';el.style.top=box.visualIndicator.y+'px';};
      const end=()=>{el.releasePointerCapture(e.pointerId);el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);scheduleSave();};
      el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);
    });
  });
}

/* ============================= VIEWS ============================= */
function viewHeader(title,sub){
  return `<div class="view-title"><h1>${title}</h1><span class="sub">${sub||''}</span></div>`;
}

function computeNotifications(){
  const list=[];
  state.components.forEach(comp=>{
    const total=totalQtyOfComponent(comp.id);
    if(total<=0) list.push({key:'comp:'+comp.id,type:'crit',icon:'⛔',text:`${comp.name} — نفد المخزون`,go:()=>{showView('components');}});
    else if(total<=comp.criticalStock) list.push({key:'comp:'+comp.id,type:'crit',icon:'🔴',text:`${comp.name} — مستوى حرج (${total})`,go:()=>{showView('components');}});
    else if(total<=comp.warningStock) list.push({key:'comp:'+comp.id,type:'warn',icon:'⚠️',text:`${comp.name} — مخزون منخفض (${total})`,go:()=>{showView('components');}});
  });
  const pendingPurchases=state.purchases.filter(p=>p.status==='pending').length;
  if(pendingPurchases) list.push({key:'purchases-pending',type:'info',icon:'🛒',text:`${pendingPurchases} عناصر بانتظار الشراء`,go:()=>showView('purchases')});
  const failedExp=state.experiments.filter(e=>e.result==='FAIL').length;
  if(failedExp) list.push({key:'experiments-fail',type:'info',icon:'🧪',text:`${failedExp} تجارب بنتيجة FAIL تحتاج مراجعة`,go:()=>showView('experiments')});
  const dismissed=new Set(state.dismissedNotifications||[]);
  return list.filter(n=>!dismissed.has(n.key));
}
function renderNotifBadge(){
  const list=computeNotifications();
  const c=document.getElementById('notifCount');
  if(list.length){ c.textContent=list.length; c.classList.remove('hidden'); } else c.classList.add('hidden');
}
function dismissNotification(key){
  if(!Array.isArray(state.dismissedNotifications)) state.dismissedNotifications=[];
  if(!state.dismissedNotifications.includes(key)) state.dismissedNotifications.push(key);
  scheduleSave();
  renderNotifBadge();
  const panel=document.getElementById('notifPanel');
  if(panel && !panel.classList.contains('hidden')) renderNotifPanel();
  if(currentView==='dashboard') showView('dashboard');
}
function restoreAllNotifications(){
  state.dismissedNotifications=[];
  scheduleSave();
  renderNotifBadge();
  renderNotifPanel();
  if(currentView==='dashboard') showView('dashboard');
}

function renderDashboard(){
  const vc=document.getElementById('viewContainer');
  const totalComponents=state.components.length;
  const totalContainers=state.boxes.length;
  const usedCells=state.containers.filter(c=>c.componentId).length;
  const emptyCells=state.containers.filter(c=>!c.componentId).length;
  const low=state.components.filter(c=>{const t=totalQtyOfComponent(c.id); return t>0 && t<=c.warningStock;});
  const crit=state.components.filter(c=>{const t=totalQtyOfComponent(c.id); return t>0 && t<=c.criticalStock;});
  const out=state.components.filter(c=>totalQtyOfComponent(c.id)<=0);
  const totalUsage=state.usageHistory.filter(h=>h.type==='use').reduce((s,h)=>s+Math.abs(h.qtyChange),0);
  const notifs=computeNotifications();

  vc.innerHTML=`
    ${viewHeader('لوحة التحكم','نظرة عامة سريعة على حالة الورشة')}
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${totalComponents}</div><div class="lbl">إجمالي المكونات</div></div>
      <div class="stat-card"><div class="num">${totalContainers}</div><div class="lbl">إجمالي العبوات</div></div>
      <div class="stat-card good"><div class="num">${usedCells}</div><div class="lbl">خلايا مشغولة</div></div>
      <div class="stat-card"><div class="num">${emptyCells}</div><div class="lbl">خلايا فارغة</div></div>
      <div class="stat-card warn"><div class="num">${low.length}</div><div class="lbl">مخزون منخفض</div></div>
      <div class="stat-card crit"><div class="num">${crit.length}</div><div class="lbl">مستوى حرج</div></div>
      <div class="stat-card crit"><div class="num">${out.length}</div><div class="lbl">نفد المخزون</div></div>
      <div class="stat-card info"><div class="num">${totalUsage}</div><div class="lbl">إجمالي القطع المستخدمة</div></div>
    </div>
    <div class="panel">
      <h3>🔔 التنبيهات (${notifs.length})</h3>
      ${notifs.length? notifs.slice(0,8).map(n=>`<div class="notif-row" style="justify-content:space-between;">
        <span style="cursor:pointer;flex:1;" onclick='(${n.go.toString()})()'>${n.icon} ${n.text}</span>
        <span title="حذف الإشعار" style="cursor:pointer;color:var(--red);padding-inline-start:8px;" onclick="dismissNotification('${n.key}')">✕</span>
      </div>`).join(''):'<div class="empty-state">لا توجد تنبيهات — كل شيء تحت السيطرة 👍</div>'}
      ${(state.dismissedNotifications||[]).length?`<div style="margin-top:8px;font-size:11px;color:var(--dim);">${state.dismissedNotifications.length} إشعار مخفي · <span style="cursor:pointer;text-decoration:underline;" onclick="restoreAllNotifications()">إظهار الكل</span></div>`:''}
    </div>
    <div class="panel">
      <h3>🗄️ اختصار: التخزين المرئي <button class="btn small" onclick="showView('storage')">فتح</button></h3>
      <p style="color:var(--dim);font-size:12.5px;margin:0;">استعرض الرفوف والأدراج بصريًا وتتبع مكان كل مكون فعليًا داخل الورشة.</p>
    </div>
  `;
}

/* يحفظ مكان التمرير (الأفقي لصف الأعمدة + الرأسي لحاوية الصفحة نفسها #viewContainer)
   قبل ما نعيد رسم المحتوى، عشان اختيار أي عمود أو عبوة ما يحرّكش الصفحة من مكانها خالص */
function captureStorageScroll(vc){
  const stage=vc.querySelector('.vs3-library-stage');
  const cols=vc.querySelector('.vs3-full-columns');
  return {
    vcScrollTop: vc.scrollTop,
    stageScrollTop: stage?stage.scrollTop:0,
    stageScrollLeft: stage?stage.scrollLeft:0,
    colsScrollLeft: cols?cols.scrollLeft:0
  };
}
function restoreStorageScroll(vc,s){
  if(!s) return;
  const apply=()=>{
    const stage=vc.querySelector('.vs3-library-stage');
    const cols=vc.querySelector('.vs3-full-columns');
    vc.scrollTop=s.vcScrollTop;
    if(stage){ stage.scrollTop=s.stageScrollTop; stage.scrollLeft=s.stageScrollLeft; }
    if(cols) cols.scrollLeft=s.colsScrollLeft;
  };
  apply();
  requestAnimationFrame(()=>{ apply(); requestAnimationFrame(apply); });
}
function renderStorage(){
  const vc=document.getElementById('viewContainer');
  const _scroll=captureStorageScroll(vc);
  if(uiState.expandedColumn){
    const col=findColumn(uiState.expandedColumn);
    if(col){
      vc.innerHTML=columnFullPageHTML(col);
      wireCellEvents();
      wireVisualIndicators();
      restoreStorageScroll(vc,_scroll);
      return;
    }
    uiState.expandedColumn=null;
  }
  if(uiState.expandedRack){
    const rack=allRacks().find(r=>r.id===uiState.expandedRack);
    if(rack){
      vc.innerHTML=rackFullPageHTML(rack);
      wireCellEvents();
      wireBoxChipEvents();
      wireVisualIndicators();
      restoreStorageScroll(vc,_scroll);
      return;
    }
    uiState.expandedRack=null;
  }
  let html=viewHeader('التخزين المرئي',`${labelFor('shelf')} ← ${labelFor('column')} ← ${labelFor('box')} ← ${labelFor('cell')} — اضغط 🔍 تكبير على أي رف لفتحه بحجم الصفحة`)+`
  <div class="toolbar">
    <button class="btn primary small" onclick="openAddRack('shelf')">+ إضافة رف</button>
    <button class="btn primary small" onclick="openAddRack('drawer')">+ إضافة درج</button>
    <button class="btn small" onclick="openLayoutSettings()">⚙ تخصيص التخزين</button>
  </div>`;
  allRacks().forEach(r=>{ html+=rackCollapsedHTML(r); });
  vc.innerHTML=html;
  wireVisualIndicators();
  restoreStorageScroll(vc,_scroll);
}
function rackCollapsedHTML(rack){
  const cols=columnsOfRack(rack.id);
  let totalCells=0, occCells=0;
  cols.forEach(col=>{ boxesOfColumn(col.id).forEach(box=>{ const cells=cellsOfBox(box.id); totalCells+=cells.length; occCells+=cells.filter(c=>c.componentId).length; }); });
  return `<div class="rack-panel" data-rack-id="${rack.id}">
    <div class="rack-head">
      <div class="rack-head-top">
        <div class="rack-plate"><span class="plate-tag">${rack.type==='shelf'?'S'+pad(rack.number):'D'+pad(rack.number)}</span><b>${rack.name}</b></div>
        <div class="meta">${rack.description||''} · ${occCells}/${totalCells} خلية مشغولة · ${cols.length} عمود</div>
        <button class="btn small visual-config-btn" onclick="openVisualVariables('${rack.id}','rack')">متغيرات</button>
        <button class="btn small" onclick="renameRack('${rack.id}')">✎ بيانات</button>
        <button class="btn small danger" onclick="removeRack('${rack.id}')" title="حذف الرف/الدرج">🗑 حذف</button>
                <button class="btn small primary" onclick="toggleRackExpand('${rack.id}')">🔍 تكبير</button>
      </div>
      ${visualVarsHTML(rack,'rack')}
    </div>
  </div>`;
}
function toggleRackExpand(rackId){
  uiState.expandedColumn=null;
  uiState.expandedRack = (uiState.expandedRack===rackId) ? null : rackId;
  uiState.selectedBox=null;
  showView('storage');
}

function openColumnPage(colId){
  const col=findColumn(colId);
  if(!col) return;
  uiState.expandedColumn=col.id;
  uiState.selectedColumn=col.id;
  uiState.selectedBox=null;
  showView('storage');
}
/* تحديث جزئي لحالة التحديد (عمود/عبوة) داخل صفحة الرف المكبّرة، من غير هدم/إعادة بناء
   الصفحة كلها (innerHTML كامل). بنبدّل بس كلاسات "محدد" على العمود/العبوة، وبنحدّث محتوى
   لوحة التفاصيل السفلية فقط. طالما مفيش هدم لعناصر الـ DOM الحالية، مكان التمرير (أفقي
   ورأسي) بيفضل ثابت تلقائيًا من غير أي تدخل إضافي. يرجع true لو نفّذ التحديث، أو false
   لو مفيش صفحة رف مكبّرة مفتوحة حاليًا (وفي الحالة دي بيتم اللجوء لإعادة الرسم الكاملة كما كان). */
function updateRackSelectionUiOnly(){
  const wrap=document.querySelector('.rack-fullpage-wrap[data-rack-id]');
  if(!wrap) return false;

  wrap.querySelectorAll('.vs3-full-column[data-col-id]').forEach(el=>{
    const isSel = uiState.selectedColumn===el.dataset.colId;
    el.classList.toggle('column-selected', isSel);
    const toolbar=el.querySelector('.vs3-col-toolbar');
    if(toolbar) toolbar.classList.toggle('is-visible', isSel);
    const actions=el.querySelector('.vs3-col-actions');
    if(actions) actions.classList.toggle('is-visible', isSel);
  });

  wrap.querySelectorAll('.vs3-full-book[data-box-id]').forEach(el=>{
    const isSel = uiState.selectedBox===el.dataset.boxId;
    el.classList.toggle('selected', isSel);
    const actions=el.querySelector('.vs3-book-actions');
    if(actions) actions.classList.toggle('is-visible', isSel);
  });

  const panel=wrap.querySelector('[data-detail-panel]');
  if(panel){
    const selectedBox=uiState.selectedBox?findBox(uiState.selectedBox):null;
    panel.innerHTML = selectedBox
      ? `<div class="vs3-cell-title"><b>📦 ${selectedBox.label}</b><span>اضغط على خلية لعرض تفاصيلها</span></div>${boxDetailHTML(selectedBox)}`
      : '<div class="rack-detail-empty">اضغط على عمود لاختياره، أو اضغط على عبوة لعرض خلاياها.</div>';
    wireCellEvents(panel);
    wireVisualIndicators(panel);
  }
  return true;
}
function selectColumn(colId){
  uiState.expandedColumn=null;
  uiState.selectedColumn = (uiState.selectedColumn===colId) ? null : colId;
  uiState.selectedBox = null;
  if(updateRackSelectionUiOnly()){ currentView='storage'; return; }
  showView('storage');
}
function selectBox(boxId){
  uiState.selectedBox = (uiState.selectedBox===boxId) ? null : boxId;
  uiState.selectedColumn = null;
  if(updateRackSelectionUiOnly()){ currentView='storage'; return; }
  showView('storage');
}
function boxChipHTML(box){
  const cells=cellsOfBox(box.id);
  const occ=cells.filter(c=>c.componentId).length;
  const rows=box.rows||1, cols=box.cols||cells.length||1;
  const selected=uiState.selectedBox===box.id;
  return `<div class="box-chip ${selected?'selected':''}" data-box-id="${box.id}">
    <div class="bc-name"><b>${box.label}</b><span class="bc-count">${occ}/${cells.length}</span></div>
    <div class="bc-hint">تقسيمة ${rows}×${cols}${selected?' · معروضة أسفل':''} · <span onclick="event.stopPropagation();renameBox('${box.id}')" style="text-decoration:underline;cursor:pointer;">✏️ إعادة تسمية</span></div>
  </div>`;
}
function columnChipsHTML(col){
  const boxes=boxesOfColumn(col.id);
  const boxesHTML=boxes.map(box=>boxChipHTML(box)).join('');
  return `<div class="rack-column" data-col-id="${col.id}">
    <div class="column-head">
       <b>${col.name}</b>
      <div style="display:flex;gap:4px;">
         <button class="btn small" onclick="renameColumn('${col.id}')">✎</button>
         <button class="btn small visual-config-btn" onclick="openVisualVariables('${col.id}','column')">متغيرات</button>
         <button class="btn small" onclick="openAddBox('${col.id}')">+ عبوة</button>
        <button class="btn small primary" onclick="openColumnPage('${col.id}')">🔍 تكبير</button>
        <button class="btn small danger" onclick="removeColumn('${col.id}')" title="حذف العمود">🗑</button>
      </div>
    </div>
     ${visualVarsHTML(col,'column')}
    ${boxesHTML || '<div class="empty-state" style="padding:14px;font-size:11.5px;">لا توجد عبوات — أضف واحدة</div>'}
  </div>`;
}

function cellIndicatorConfig(cell){
  const d=cell&&cell.indicator;
  if(!d) return {enabled:false,type:'text',source:'quantity',label:'',value:'',color:'#5aa7ff',min:0,max:100};
  return {
    enabled:d.enabled!==false,
    type:d.type||'text',
    source:d.source||'quantity',
    label:d.label||'',
    value:d.value==null?'':String(d.value),
    color:d.color||'#5aa7ff',
    min:Number.isFinite(Number(d.min))?Number(d.min):0,
    max:Number.isFinite(Number(d.max))?Number(d.max):100
  };
}
function escCellIndicator(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function cellIndicatorValue(cell){
  const cfg=cellIndicatorConfig(cell);
  const comp=cell&&cell.componentId?findComponent(cell.componentId):null;
  let value='';
  if(cfg.source==='quantity') value=cell?cell.quantity:0;
  else if(cfg.source==='status') value=cell?statusLabelAr(cellStatus(cell)):'فارغة';
  else if(cfg.source==='voltage') value=comp?.voltage||'';
  else if(cfg.source==='current') value=comp?.current||'';
  else if(cfg.source==='value') value=comp?.value||'';
  else if(cfg.source==='partNumber') value=comp?.partNumber||'';
  else if(cfg.source==='componentName') value=comp?.name||'';
  else if(cfg.source==='link') value=(comp?.links||[])[0]||'';
  else if(cfg.source && cfg.source.indexOf('spec_')===0 && typeof getSpecValue==='function' && typeof allSpecDefs==='function'){
    const def=allSpecDefs().find(d=>('spec_'+d.key)===cfg.source);
    value=def && comp?getSpecValue(comp,def):'';
  }
  else value=cfg.value;
  return String(value??'');
}
function cellIndicatorPercent(cell){
  const cfg=cellIndicatorConfig(cell);
  const raw=Number(cellIndicatorValue(cell));
  if(!Number.isFinite(raw)) return 0;
  const min=Number(cfg.min||0), max=Number(cfg.max||100);
  if(max<=min) return raw>min?100:0;
  return Math.max(0,Math.min(100,((raw-min)/(max-min))*100));
}
function cellIndicatorHTML(cell){
  const cfg=cellIndicatorConfig(cell);
  if(!cfg.enabled) return '';
  const raw=cellIndicatorValue(cell);
  const label=cfg.label?escCellIndicator(cfg.label)+': ':'';
  const value=escCellIndicator(raw);
  const color=escCellIndicator(cfg.color||'#5aa7ff');
  if(cfg.type==='lamp'){
    return `<div class="cell-indicator ind-lamp" title="${label}${value}" style="--ind-color:${color}"><span class="ind-lamp-dot"></span><span class="ind-label">${label}${value}</span></div>`;
  }
  if(cfg.type==='bar'){
    const pct=cellIndicatorPercent(cell).toFixed(0);
    return `<div class="cell-indicator ind-bar" title="${label}${value}" style="--ind-color:${color};--ind-pct:${pct}%"><span class="ind-bar-fill"></span></div>`;
  }
  if(cfg.type==='number'){
    return `<div class="cell-indicator ind-number" title="${label}${value}" style="color:${color}">${label}${value}</div>`;
  }
  if(cfg.type==='badge'){
    return `<div class="cell-indicator ind-badge" title="${label}${value}" style="border-color:${color};color:${color}">${label}${value}</div>`;
  }
  return `<div class="cell-indicator ind-text" title="${label}${value}" style="color:${color}">${label}${value}</div>`;
}

function mixIndicatorMode(){
  try{
    const v=localStorage.getItem('workshop_cell_indicator_mode');
    return ['cells','percent','level','lamp'].includes(v)?v:'cells';
  }catch(e){return 'cells'}
}
function cycleMixIndicatorMode(){
  const order=['cells','percent','level','lamp'];
  const cur=mixIndicatorMode(), next=order[(order.indexOf(cur)+1)%order.length];
  try{localStorage.setItem('workshop_cell_indicator_mode',next)}catch(e){}
  if(typeof showView==='function')showView('storage');
}
function mixIndicatorHTML(box,occ,total){
  const ratio=total?Math.max(0,Math.min(1,occ/total)):0;
  const pct=Math.round(ratio*100);
  const mode=mixIndicatorMode();
  let visual='';

  if(mode==='cells'){
    const cells=cellsOfBox(box.id);
    const rows=Math.max(1,Number(box.rows)||1);
    const cols=Math.max(1,Number(box.cols)||cells.length||1);
    const dots=cells.map((cell,i)=>{
      const status=cellStatus(cell);
      const label=cell.componentId
        ? `${i+1}: ${statusLabelAr(status)} · ${cell.quantity}`
        : `${i+1}: فارغة`;
      return `<i class="vs3-cell-dot status-${status}" title="${label}"></i>`;
    }).join('');
    visual=`<span class="vs3-cell-map" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)" title="حالة كل خلية">${dots}</span>`;
  }else if(mode==='level'){
    const n=Math.round(ratio*5);
    visual='<span class="vs3-mix-level" title="مستوى الامتلاء '+pct+'%">'+
      [0,1,2,3,4].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')+'</span>';
  }else if(mode==='lamp'){
    const alpha=(.22+ratio*.78).toFixed(2);
    const hue=Math.round(12+ratio*38);
    visual=`<span class="vs3-mix-lamp" title="حالة المكس ${pct}%" style="background:hsl(${hue} 75% 58% / ${alpha});box-shadow:0 0 ${Math.round(3+ratio*8)}px hsl(${hue} 75% 58% / ${Math.min(1,.18+ratio*.55)})"></span>`;
  }else{
    visual=`<span class="vs3-mix-percent" title="نسبة الخلايا المشغولة">${pct}%</span>`;
  }

  return `<div class="vs3-mix-indicator">${visual}</div>
    <button class="vs3-mix-control" type="button" onclick="event.stopPropagation();cycleMixIndicatorMode()" title="تغيير شكل مؤشر حالة الخلايا">↻</button>`;
}

function wireCellEvents(root){
  (root||document).querySelectorAll('.cell').forEach(el=>{
    el.addEventListener('click',e=>{ e.stopPropagation(); el.classList.remove('flash-wait'); openCellDetail(el.dataset.cellId); });
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',el.dataset.cellId); });
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
    el.addEventListener('drop',e=>{
      e.preventDefault(); el.classList.remove('dragover');
      const fromCellId=e.dataTransfer.getData('text/plain');
      const fromCell=findCell(fromCellId);
      if(!fromCell || !fromCell.componentId || fromCellId===el.dataset.cellId) return;
      moveContainer(fromCellId, el.dataset.cellId);
      showView('storage'); toast('تم نقل المكون');
    });
  });
}
(function bindCellClickFallback(){
  const vc=document.getElementById('viewContainer');
  if(!vc || vc.dataset.cellClickBound==='1') return;
  vc.dataset.cellClickBound='1';
  vc.addEventListener('click',e=>{
    if(e.target.closest('button,input,select,textarea,a')) return;
    const cell=e.target.closest('.cell[data-cell-id]');
    if(!cell || !vc.contains(cell) || e.defaultPrevented) return;
    cell.classList.remove('flash-wait');
    openCellDetail(cell.dataset.cellId);
  });
})();
/* يفتح الرف بحجم الصفحة، يختار العبوة المطلوبة (تظهر تقسيمتها ومحتواها أسفل الأعمدة)،
   ثم يعمل فلاش متسلسل: رف ← عمود/عبوة ← لوحة التفاصيل ← خلية، وتبقى الخلية توميض حتى يفتحها المستخدم */
function revealAndFlash(cellId){
  const cell=findContainer(cellId); if(!cell) return;
  const box=findBox(cell.boxId); if(!box) return;
  const col=findColumn(box.columnId); if(!col) return;
  const rack=allRacks().find(r=>r.id===col.rackId); if(!rack) return;

  uiState.expandedRack=rack.id;
  uiState.selectedBox=box.id;
  showView('storage');

  setTimeout(()=>{
    const wrapEl=document.querySelector('.rack-fullpage-wrap');
    const colEl=document.querySelector(`.rack-column[data-col-id="${col.id}"]`);
    const chipEl=document.querySelector(`.box-chip[data-box-id="${box.id}"]`);
    const panelEl=document.querySelector('[data-detail-panel]');
    const cellEl=document.querySelector(`.cell[data-cell-id="${cellId}"]`);

    if(wrapEl) wrapEl.scrollIntoView({behavior:'smooth',block:'start'});

    if(colEl){ colEl.classList.add('flash-step'); setTimeout(()=>colEl.classList.remove('flash-step'),1150); }
    setTimeout(()=>{ if(chipEl){ chipEl.classList.add('flash-step'); setTimeout(()=>chipEl.classList.remove('flash-step'),1150); } },380);
    setTimeout(()=>{ if(panelEl){ panelEl.classList.add('flash-step'); setTimeout(()=>panelEl.classList.remove('flash-step'),1150); } },760);
    setTimeout(()=>{
      if(cellEl){ cellEl.scrollIntoView({behavior:'smooth',block:'center'}); cellEl.classList.add('flash-wait'); }
    },1150);
  },80);
}
function jumpToCell(cellId){ revealAndFlash(cellId); }

function addColumn(rackId){
  const cols=columnsOfRack(rackId);
  state.columns.push({id:uid('col'),rackId,order:cols.length+1,name:labelFor('column')+' '+(cols.length+1)});
  scheduleSave(); showView('storage');
}
function removeColumn(colId){
  if(!confirm('سيتم حذف هذا العمود وكل العبوات والخلايا بداخله نهائيًا. هل أنت متأكد؟')) return;
  const boxIds=new Set(boxesOfColumn(colId).map(b=>b.id));
  state.containers=state.containers.filter(c=>!boxIds.has(c.boxId));
  state.boxes=state.boxes.filter(b=>b.columnId!==colId);
  state.columns=state.columns.filter(c=>c.id!==colId);
  scheduleSave(); showView('storage');
}

function normalizeColumnOrders(rackId){
  columnsOfRack(rackId).forEach((c,i)=>c.order=i+1);
}
function moveColumn(colId, direction){
  const col=findColumn(colId); if(!col) return;
  const cols=columnsOfRack(col.rackId);
  const i=cols.findIndex(c=>c.id===colId);
  const j=i+direction;
  if(j<0 || j>=cols.length){ toast(direction<0?'العمود بالفعل في أقصى اليسار':'العمود بالفعل في أقصى اليمين'); return; }
  const other=cols[j];
  const tmp=col.order; col.order=other.order; other.order=tmp;
  normalizeColumnOrders(col.rackId);
  scheduleSave();
  uiState.selectedColumn=colId;
  showView('storage');
}
function swapColumns(colAId,colBId){
  const a=findColumn(colAId),b=findColumn(colBId);
  if(!a||!b||a.rackId!==b.rackId)return;
  const tmp=a.order;a.order=b.order;b.order=tmp;
  normalizeColumnOrders(a.rackId);
  scheduleSave();showView('storage');
}
function columnDropHandler(e,targetColId){
  e.preventDefault();
  const sourceId=e.dataTransfer.getData('text/plain');
  if(!sourceId || sourceId===targetColId)return;
  const a=findColumn(sourceId),b=findColumn(targetColId);
  if(!a||!b||a.rackId!==b.rackId)return;
  const cols=columnsOfRack(a.rackId);
  const from=cols.findIndex(c=>c.id===sourceId), to=cols.findIndex(c=>c.id===targetColId);
  if(from<0||to<0)return;
  const moved=cols.splice(from,1)[0];
  cols.splice(to,0,moved);
  cols.forEach((c,i)=>c.order=i+1);
  state.columns.forEach(c=>{
    if(c.rackId===a.rackId){
      const hit=cols.find(x=>x.id===c.id); if(hit)c.order=hit.order;
    }
  });
  scheduleSave();
  uiState.selectedColumn=sourceId;
  showView('storage');
}

function removeBox(boxId){
  const cells=cellsOfBox(boxId);
  const msg=cells.some(c=>c.componentId)? 'هذه العبوة تحتوي على مكونات وسيتم حذفها نهائيًا مع محتواها. متابعة؟':'حذف هذه العبوة؟';
  if(!confirm(msg)) return;
  const ids=new Set(cells.map(c=>c.id));
  state.containers=state.containers.filter(c=>!ids.has(c.id));
  state.boxes=state.boxes.filter(b=>b.id!==boxId);
  if(uiState.selectedBox===boxId) uiState.selectedBox=null;
  scheduleSave(); showView('storage');
}
function removeRack(rackId){
  const rack=allRacks().find(r=>r.id===rackId);
  if(!rack) return;
  const cols=columnsOfRack(rackId);
  const colIds=new Set(cols.map(c=>c.id));
  const boxes=state.boxes.filter(b=>colIds.has(b.columnId));
  const boxIds=new Set(boxes.map(b=>b.id));
  const cells=state.containers.filter(c=>boxIds.has(c.boxId));
  const hasContent=cells.some(c=>c.componentId || Number(c.quantity||0)>0);
  const kind=rack.type==='shelf'?'الرف':'الدرج';
  const msg=hasContent
    ? `سيتم حذف ${kind} «${rack.name}» وكل الأعمدة والعبوات والخلايا بداخله، بما فيها المكونات الموجودة فيها. هل أنت متأكد؟`
    : `حذف ${kind} «${rack.name}» وكل الأعمدة والعبوات والخلايا التابعة له؟`;
  if(!confirm(msg)) return;

  state.containers=state.containers.filter(c=>!boxIds.has(c.boxId));
  state.boxes=state.boxes.filter(b=>!colIds.has(b.columnId));
  state.columns=state.columns.filter(c=>c.rackId!==rackId);
  if(rack.type==='shelf') state.shelves=state.shelves.filter(r=>r.id!==rackId);
  else state.drawers=state.drawers.filter(r=>r.id!==rackId);
  if(Array.isArray(state.workshopMap)) state.workshopMap=state.workshopMap.filter(m=>m.refId!==rackId);
  if(uiState.expandedRack===rackId) uiState.expandedRack=null;
  if(uiState.selectedColumn && !state.columns.some(c=>c.id===uiState.selectedColumn)) uiState.selectedColumn=null;
  if(uiState.selectedBox && !state.boxes.some(b=>b.id===uiState.selectedBox)) uiState.selectedBox=null;
  scheduleSave();
  showView('storage');
  toast(`تم حذف ${kind} «${rack.name}»`);
}

function setBoxLayout(boxId,rowsRaw,colsRaw){
  const box=findBox(boxId); if(!box) return;
  const rows=Math.max(1,Math.min(20,Number(rowsRaw)||1));
  const cols=Math.max(1,Math.min(20,Number(colsRaw)||1));
  const newCount=rows*cols;
  const cells=cellsOfBox(boxId);
  if(newCount<cells.length){
    const toRemove=cells.slice(newCount);
    if(toRemove.some(c=>c.componentId)){ toast('لا يمكن تصغير التقسيمة: بعض الخلايا مشغولة — أفرغها أولًا'); return; }
    const removeIds=new Set(toRemove.map(c=>c.id));
    state.containers=state.containers.filter(c=>!removeIds.has(c.id));
  } else if(newCount>cells.length){
    for(let i=cells.length;i<newCount;i++){ state.containers.push({id:uid('cell'),boxId,index:i,componentId:null,quantity:0,dateAdded:nowISO()}); }
  }
  box.rows=rows; box.cols=cols; box.cellCount=newCount;
  scheduleSave(); closeModal(); showView('storage'); toast('تم تحديث تقسيمة العبوة');
}

function renderMap(){
  const vc=document.getElementById('viewContainer');
  vc.innerHTML=viewHeader('خريطة الورشة','تمثيل مبسط للمكان الفعلي — اسحب العناصر لإعادة ترتيبها')+
  `<div class="map-board" id="mapBoard" style="height:560px;">
    ${state.workshopMap.map(m=>`<div class="map-item ${m.type==='workbench'?'wb':''}" data-id="${m.id}" style="right:${m.x}px;top:${m.y}px;width:${m.w}px;min-height:${m.h}px;">
      <b>${m.label}</b><span>${m.type==='workbench'?'منطقة عمل':(m.type==='shelf'?'رف':'درج')}</span>
    </div>`).join('')}
  </div>`;
  document.querySelectorAll('.map-item').forEach(el=>{
    let dragging=false, sx=0, sy=0, ox=0, oy=0;
    el.addEventListener('pointerdown',e=>{
      dragging=true; sx=e.clientX; sy=e.clientY;
      const m=state.workshopMap.find(x=>x.id===el.dataset.id);
      ox=m.x; oy=m.y; el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove',e=>{
      if(!dragging) return;
      const dx=sx-e.clientX, dy=e.clientY-sy;
      const m=state.workshopMap.find(x=>x.id===el.dataset.id);
      m.x=Math.max(0,ox+dx); m.y=Math.max(0,oy+dy);
      el.style.right=m.x+'px'; el.style.top=m.y+'px';
    });
    el.addEventListener('pointerup',()=>{ if(dragging){ dragging=false; scheduleSave(); } });
    el.addEventListener('click',e=>{
      if(Math.abs(e.clientX-sx)>4||Math.abs(e.clientY-sy)>4) return;
      const m=state.workshopMap.find(x=>x.id===el.dataset.id);
      if(m.refId){ uiState.expandedRack=m.refId; uiState.selectedBox=null; showView('storage'); setTimeout(()=>{ const wrapEl=document.querySelector('.rack-fullpage-wrap'); if(wrapEl){ wrapEl.scrollIntoView({behavior:'smooth',block:'start'}); wrapEl.classList.add('flash-step'); setTimeout(()=>wrapEl.classList.remove('flash-step'),1150); } },60); }
    });
  });
}

  let selected=state.categories[0]||null;const listEl=document.getElementById('categoryList'),editorEl=document.getElementById('categoryEditor');

    const f=String(filter||'').trim().toLowerCase(),cats=state.categories.filter(c=>!f||c.toLowerCase().includes(f));
    listEl.innerHTML=cats.length?cats.map(cat=>{const schema=state.categorySchemas[cat]||{specs:[]};const count=Array.isArray(schema.specs)?schema.specs.length:0;const compCount=state.components.filter(c=>c.category===cat).length;return `<button type="button" class="category-row ${cat===selected?'active':''}" data-cat="${escCategory(cat)}"><span class="category-row-main"><b>${escCategory(cat)}</b><small>${compCount} مكون · ${count} مواصفة</small></span><span class="category-row-arrow">‹</span></button>`;}).join(''):'<div class="empty-state" style="padding:25px 10px">لا توجد فئات مطابقة</div>';

N / PNP / MOSFET / IGBT، مع الجهد والتيار والقدرة والتردد والحزمة. وكل فئة أخرى لها جدولها الخاص.</div>`;

function renderComponents(){
  const vc=document.getElementById('viewContainer');
  vc.innerHTML=viewHeader('المكونات','كل مكون إلكتروني مسجل في المكتبة')+`
    <div class="toolbar"><input class="searchbox-inline" id="compFilter" placeholder="فلترة بالاسم/الفئة/رقم القطعة..."></div>
    <div id="compGrid" class="grid-cards"></div>
  `;
  function draw(filter){
    const f=(filter||'').trim().toLowerCase();
    const list=state.components.filter(c=>!f || (c.name+c.category+c.partNumber).toLowerCase().includes(f));
    const grid=document.getElementById('compGrid');
    if(!list.length){ grid.innerHTML='<div class="empty-state">لا توجد نتائج</div>'; return; }
    grid.innerHTML=list.map(c=>{
      const total=totalQtyOfComponent(c.id);
      const st=total<=0?'red':(total<=c.criticalStock?'red':(total<=c.warningStock?'yellow':'green'));
      return `<div class="card" style="position:relative;" onclick="openComponentQuickView('${c.id}')">
        <span title="حذف المكون" onclick="event.stopPropagation();deleteComponent('${c.id}')" style="position:absolute;top:8px;left:8px;cursor:pointer;color:var(--red);font-size:14px;">✕</span>
        <div style="display:flex;justify-content:space-between;"><b>${c.name}</b><span class="pill ${st}">${total}</span></div>
        <div class="sub">${c.category||'—'} ${c.package?(' · '+c.package):''}</div>
      </div>`;
    }).join('');
  }
  draw('');
  document.getElementById('compFilter').addEventListener('input',e=>draw(e.target.value));
}
function openComponentQuickView(compId){
  const comp=findComponent(compId);
  const containers=containerOfComponent(compId);
  openModal(comp.name,`
    <div class="field-row"><div class="field"><label>الفئة</label><input value="${comp.category||''}" readonly></div>
    <div class="field"><label>رقم القطعة</label><input value="${comp.partNumber||''}" readonly></div></div>
    <h3 style="font-size:13px;margin-top:14px;">المواقع الحالية (${containers.length})</h3>
    ${containers.length? containers.map(ct=>{ const box=findBox(ct.boxId); return `<div class="card" style="margin-bottom:8px;" onclick="closeModal();revealAndFlash('${ct.id}');"><b>${box?box.label:'—'}</b><div class="sub">${locationLabel(ct.id)} · الكمية: ${ct.quantity}</div></div>`; }).join(''):'<div class="empty-state">غير موجود في أي موقع فعليًا (مخزون مؤقت)</div>'}
  `,`<button class="btn danger" id="deleteFromQuick">🗑 حذف المكون</button><button class="btn" id="editFromQuick">تعديل بيانات المكون</button><button class="btn" onclick="closeModal()">إغلاق</button>`);
  document.getElementById('editFromQuick').onclick=()=>openEditComponent(compId,()=>openComponentQuickView(compId));
  document.getElementById('deleteFromQuick').onclick=()=>deleteComponent(compId);
}
function deleteComponent(compId){
  const comp=findComponent(compId);
  if(!comp) return;
  const containers=containerOfComponent(compId);
  const total=totalQtyOfComponent(compId);
  const usageCount=(state.usageHistory||[]).filter(h=>h.componentId===compId).length;
  let msg=`سيتم حذف المكون «${comp.name}» نهائيًا من المكتبة.`;
  if(containers.length) msg+=`\nستُفرَّغ ${containers.length} خلية/موقع كان يحتوي عليه (إجمالي الكمية: ${total}).`;
  if(usageCount) msg+=`\nسجل الاستخدام السابق (${usageCount} حركة) سيبقى في السجل التاريخي دون ربط بمكون قائم.`;
  msg+='\nهل أنت متأكد؟';
  if(!confirm(msg)) return;
  containers.forEach(c=>{ c.componentId=null; c.quantity=0; });
  state.purchases=(state.purchases||[]).filter(p=>p.componentId!==compId);
  state.components=state.components.filter(c=>c.id!==compId);
  scheduleSave();
  closeModal();
  showView('components');
  toast('تم حذف المكون');
}

function renderLowStock(){
  const vc=document.getElementById('viewContainer');
  const rows=state.components.map(c=>({c,total:totalQtyOfComponent(c.id)})).filter(x=>x.total<=x.c.warningStock);
  rows.sort((a,b)=>a.total-b.total);
  vc.innerHTML=viewHeader('نقص المخزون','المكونات التي وصلت إلى حد التحذير أو أقل')+`
    ${rows.length?`<table class="tbl"><thead><tr><th>المكون</th><th>الحالي</th><th>التحذير</th><th>الحرج</th><th>الهدف</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${rows.map(({c,total})=>{
      const st=total<=0?'red':(total<=c.criticalStock?'red':'yellow');
      const already=state.purchases.some(p=>p.componentId===c.id && p.status==='pending');
      return `<tr><td><b>${c.name}</b><div class="sub" style="font-size:10.5px;color:var(--dim);">${c.category||''}</div></td>
      <td>${total}</td><td>${c.warningStock}</td><td>${c.criticalStock}</td><td>${c.targetStock}</td>
      <td><span class="pill ${st}">${statusLabelAr(st)}</span></td>
      <td>${already?'<span class="sub">مضاف للشراء</span>':`<button class="btn small primary" onclick="addToPurchaseList('${c.id}')">أضف للشراء</button>`}</td></tr>`;
    }).join('')}
    </tbody></table>`:'<div class="empty-state"><div class="big">✅</div>لا يوجد نقص في المخزون حاليًا</div>'}
  `;
}
function addToPurchaseList(compId){
  const comp=findComponent(compId);
  if(state.purchases.some(p=>p.componentId===compId && p.status==='pending')){ toast('موجود بالفعل في قائمة الشراء'); return; }
  const total=totalQtyOfComponent(compId);
  const need=Math.max(comp.targetStock-total,comp.reorderQty||0,1);
  const priority= total<=comp.criticalStock?'HIGH':'MEDIUM';
  state.purchases.unshift({id:uid('pur'),componentId:compId,need,priority,status:'pending',supplier:comp.supplier||'',price:comp.purchasePrice||0,date:nowISO()});
  scheduleSave(); toast('تمت الإضافة إلى قائمة الشراء'); showView(currentView);
}

function renderPurchases(){
  const vc=document.getElementById('viewContainer');
  const pending=state.purchases.filter(p=>p.status==='pending');
  vc.innerHTML=viewHeader('المشتريات','إدارة احتياجات الشراء وأولوياتها')+`
    <div class="toolbar"><button class="btn primary small" onclick="openAddManualPurchase()">+ إضافة يدوي إلى سلة المشتريات</button></div>
    ${pending.length?`<table class="tbl"><thead><tr><th>الصنف</th><th>الحالي</th><th>الهدف</th><th>الاحتياج</th><th>الأولوية</th><th>المورد</th><th></th></tr></thead><tbody>
    ${pending.map(p=>{
      const comp=p.componentId?findComponent(p.componentId):null;
      const total=comp?totalQtyOfComponent(p.componentId):null;
      const name=comp?comp.name:(p.manualName||'—');
      return `<tr><td><b>${name}</b>${!comp?'<div class="sub" style="font-size:10px;color:var(--dim);">إضافة يدوية</div>':''}</td><td>${total!=null?total:'—'}</td><td>${comp?comp.targetStock:'—'}</td><td>${p.need}</td>
      <td><span class="pill ${p.priority==='HIGH'?'red':'yellow'}">${p.priority}</span></td>
      <td><input value="${p.supplier||''}" onchange="updatePurchaseField('${p.id}','supplier',this.value)" style="width:110px;"></td>
      <td><button class="btn small primary" onclick="receivePurchase('${p.id}')">تم الاستلام</button> <button class="btn small danger" onclick="removePurchase('${p.id}')">حذف</button></td></tr>`;
    }).join('')}</tbody></table>`:'<div class="empty-state"><div class="big">🛒</div>لا توجد عناصر بانتظار الشراء</div>'}
  `;
}
function updatePurchaseField(id,field,val){ const p=state.purchases.find(x=>x.id===id); if(p){p[field]=val; scheduleSave();} }
function removePurchase(id){ state.purchases=state.purchases.filter(p=>p.id!==id); scheduleSave(); showView('purchases'); }
function receivePurchase(id){
  const p=state.purchases.find(x=>x.id===id); if(!p) return;
  if(!p.componentId){
    state.purchases=state.purchases.filter(x=>x.id!==id);
    scheduleSave(); showView('purchases'); toast('تم تعليم الصنف اليدوي كمُستلم');
    return;
  }
  const comp=findComponent(p.componentId);
  const containers=containerOfComponent(p.componentId);
  let target=containers[0];
  if(!target){ toast('لا يوجد موقع فعلي لهذا المكون — أضفه أولًا من التخزين المرئي'); return; }
  target.quantity+=p.need;
  state.usageHistory.unshift({id:uid('h'),date:nowISO(),componentId:p.componentId,type:'purchase',qtyChange:p.need,project:'',purpose:'استلام مشتريات',notes:'المورد: '+(p.supplier||'-'),fromLocation:'',toLocation:target.id});
  state.purchases=state.purchases.filter(x=>x.id!==id);
  scheduleSave(); showView('purchases'); toast('تم استلام الكمية وإضافتها للمخزون');
}
function openAddManualPurchase(){
  const compOptions=state.components.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  openModal('إضافة يدوية إلى سلة المشتريات',`
    <div class="field-row full"><div class="field"><label>اربطها بمكوّن موجود (اختياري)</label>
      <select id="mpComp"><option value="">— بدون ربط: اسم حر —</option>${compOptions}</select>

    <div class="field-row"><div class="field"><label>الكمية المطلوبة</label><input type="number" id="mpNeed" value="1" min="1"></div>
    <div class="field"><label>الأولوية</label><select id="mpPriority"><option value="MEDIUM">MEDIUM</option><option value="HIGH">HIGH</option></select></div></div>
    <div class="field-row"><div class="field"><label>المورد</label><input id="mpSupplier"></div>
    <div class="field"><label>السعر التقريبي</label><input type="number" id="mpPrice" value="0"></div></div>
  `,`<button class="btn" id="mpCancel">إلغاء</button><button class="btn primary" id="mpSave">إضافة</button>`);
  document.getElementById('mpCancel').onclick=closeModal;
  document.getElementById('mpSave').onclick=()=>{
    const compId=document.getElementById('mpComp').value||null;
    const manualName=document.getElementById('mpName').value.trim();
    if(!compId && !manualName){ toast('اختر مكونًا أو أدخل اسم الصنف'); return; }
    const need=Math.max(1,Number(document.getElementById('mpNeed').value||1));
    state.purchases.unshift({id:uid('pur'),componentId:compId,manualName:compId?'':manualName,need,priority:document.getElementById('mpPriority').value,status:'pending',supplier:document.getElementById('mpSupplier').value,price:Number(document.getElementById('mpPrice').value||0),date:nowISO(),manual:true});
    scheduleSave(); closeModal(); showView('purchases'); toast('تمت الإضافة إلى سلة المشتريات');
  };

function renderStats(){
  const vc=document.getElementById('viewContainer');
  const counts={green:0,yellow:0,red:0,empty:0};
  state.containers.forEach(c=>counts[cellStatus(c)]++);
  const usageByComp={};
  state.usageHistory.filter(h=>h.type==='use').forEach(h=>{ usageByComp[h.componentId]=(usageByComp[h.componentId]||0)+Math.abs(h.qtyChange); });
  const topUsed=Object.entries(usageByComp).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([id,q])=>({name:(findComponent(id)||{}).name||'—',q}));
  const usageByCat={};
  state.usageHistory.filter(h=>h.type==='use').forEach(h=>{ const c=findComponent(h.componentId); if(c) usageByCat[c.category]=(usageByCat[c.category]||0)+Math.abs(h.qtyChange); });
  const topCat=Object.entries(usageByCat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxUse=Math.max(1,...topUsed.map(x=>x.q));

  // monthly consumption (last 6 months)
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({key:d.getFullYear()+'-'+d.getMonth(),label:d.toLocaleDateString('ar-EG',{month:'short'}),total:0}); }
  state.usageHistory.filter(h=>h.type==='use').forEach(h=>{
    const d=new Date(h.date); const key=d.getFullYear()+'-'+d.getMonth();
    const m=months.find(mm=>mm.key===key); if(m) m.total+=Math.abs(h.qtyChange);
  });
  const maxMonth=Math.max(1,...months.map(m=>m.total));

  const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;
  let acc=0; const stops=['green','yellow','red','empty'].map(k=>{ const start=acc/total*360; acc+=counts[k]; const end=acc/total*360; return `${statusColor(k)} ${start}deg ${end}deg`; }).join(',');

  vc.innerHTML=viewHeader('الإحصائيات','تحليل المخزون والاستهلاك')+`
    <div class="panel"><h3>حالة الخلايا</h3>
      <div class="donut-wrap">
        <div class="donut" style="background:conic-gradient(${stops});"></div>
        <div class="legend">
          <div><span class="sw" style="background:var(--green)"></span> طبيعي: ${counts.green}</div>
          <div><span class="sw" style="background:var(--yellow)"></span> تحذير: ${counts.yellow}</div>
          <div><span class="sw" style="background:var(--red)"></span> حرج: ${counts.red}</div>
          <div><span class="sw" style="background:var(--dim2)"></span> فارغ: ${counts.empty}</div>
        </div>
      </div>
    </div>
    <div class="panel"><h3>أكثر المكونات استخدامًا</h3>
      <div class="bar-chart">${topUsed.length? topUsed.map(x=>`<div class="bar-col"><div class="bar-val">${x.q}</div><div class="bar" style="height:${(x.q/maxUse*100)}%;"></div><div class="bar-lbl">${x.name}</div></div>`).join(''):'<div class="empty-state">لا توجد بيانات استخدام بعد</div>'}</div>
    </div>
    <div class="panel"><h3>الاستهلاك الشهري (آخر 6 أشهر)</h3>
      <div class="bar-chart">${months.map(m=>`<div class="bar-col"><div class="bar-val">${m.total}</div><div class="bar" style="height:${(m.total/maxMonth*100)}%;"></div><div class="bar-lbl">${m.label}</div></div>`).join('')}</div>
    </div>
    <div class="panel"><h3>أكثر الفئات استخدامًا</h3>
      ${topCat.length? topCat.map(([cat,q])=>`<div class="chip">${cat}: ${q}</div>`).join(''):'<div class="empty-state">لا توجد بيانات</div>'}
    </div>
  `;

async function renderStorageStatus(){

  try{

    const persistent=!!(navigator.storage?.persisted&&await navigator.storage.persisted());
    const opfs=!!(await getOPFSRoot());
    const assets=await listStoredAssetIds();
    el.innerHTML=`<div><b>التخزين الرئيسي:</b> IndexedDB</div><div><b>الملفات الكبيرة:</b> ${opfs?'OPFS ✅':'IndexedDB (احتياطي) ⚠️'}</div><div><b>الأصول المخزنة:</b> ${assets.length}</div><div><b>المستخدم:</b> ${formatFileSize(usage)}${quota?` / ${formatFileSize(quota)}`:''}</div><div><b>تخزين دائم:</b> ${persistent?'مفعل ✅':'غير مفعل'}</div>`;
  }catch(e){el.textContent='تعذر قراءة حالة مساحة التخزين.';}

/* ============================= FULL PROJECT IMPORT / EXPORT ============================= */
const FULL_BACKUP_VERSION=6;
const STREAM_EXPORT_THRESHOLD=100*1024*1024;
function backupSafeName(name,fallback='item'){return String(name||fallback).replace(/[\\/:*?"<>|\u0000-\u001F]/g,'_').replace(/\s+/g,' ').trim().slice(0,120)||fallback;}
function backupUtf8(s){return new TextEncoder().encode(String(s));}
function backupConcat(parts){let n=0;parts.forEach(x=>n+=x.length);const out=new Uint8Array(n);let o=0;parts.forEach(x=>{out.set(x,o);o+=x.length});return out;}
function backupU16(n){return new Uint8Array([n&255,(n>>>8)&255]);}
function backupU32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]);}
const BACKUP_CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function backupCRC32(data){let c=0xffffffff;for(let i=0;i<data.length;i++)c=BACKUP_CRC_TABLE[(c^data[i])&255]^(c>>>8);return (c^0xffffffff)>>>0;}

   تُستعاد بأقصى ما يمكن استعادته، مع تقرير واضح بما نجح وما فشل وليه. */
function importReport(){ return {restoredAssets:0, failedAssets:[], skippedEntries:[], warnings:[], legacyEmbeddedConverted:0}; }
async function importStoredZipStream(file,st,rep){
  let pos=0,stateBytes=null,manifestBytes=null,assetManifestBytes=null,localStorageBytes=null,indexedDbExtraBytes=null,explicit={},assets=[];const total=file.size;
  while(pos+4<=total){
    let h,name,dataStart,dataEnd,sig;
    try{
      const sigBytes=new Uint8Array(await file.slice(pos,pos+4).arrayBuffer());sig=backupReadU32(sigBytes,0);
      if(sig===0x02014b50||sig===0x06054b50)break; // central directory / end — انتهت السجلات المحلية
      if(sig!==0x04034b50){ rep.warnings.push(`توقيف القراءة عند موضع ${pos}: توقيع غير معروف (الملف قد يحتوي بيانات زائدة بعد الأرشيف).`); break; }
      h=await readZipHeader(file,pos);
      if(h.flags&8){ rep.warnings.push('تنسيق Data Descriptor غير مدعوم — تم إيقاف قراءة الأرشيف عند هذا السجل.'); break; }
      if(h.method!==0){ rep.warnings.push('عثرنا على مدخل مضغوط (compressed) غير مدعوم داخل الأرشيف — تم تخطيه.'); pos=pos+30+h.nlen+h.xlen+h.csize; continue; }
      const nameBytes=new Uint8Array(await file.slice(pos+30,pos+30+h.nlen).arrayBuffer());
      name=new TextDecoder().decode(nameBytes);
      dataStart=pos+30+h.nlen+h.xlen;dataEnd=dataStart+h.csize;
      if(dataEnd>total){ rep.warnings.push('الأرشيف يبدو مقطوعًا/تالفًا عند: '+name+' — تم إيقاف القراءة هنا، وسنكمل بما استطعنا استخراجه فعليًا قبل هذه النقطة.'); break; }
    }catch(e){ rep.warnings.push('تعذّرت قراءة سجل داخل الأرشيف عند موضع '+pos+': '+(e?.message||e)); break; }
    try{
      if(name==='project/state.json') stateBytes=new Uint8Array(await file.slice(dataStart,dataEnd).arrayBuffer());
      else if(name==='project/manifest.json') manifestBytes=new Uint8Array(await file.slice(dataStart,dataEnd).arrayBuffer());
      else if(name==='project/asset-manifest.json') assetManifestBytes=new Uint8Array(await file.slice(dataStart,dataEnd).arrayBuffer());
      else if(name==='project/local-storage.json') localStorageBytes=new Uint8Array(await file.slice(dataStart,dataEnd).arrayBuffer());
      else if(name==='project/indexeddb-extra.json') indexedDbExtraBytes=new Uint8Array(await file.slice(dataStart,dataEnd).arrayBuffer());
      else if(name==='project/image-db-extra.json') explicit[name]=new Uint8Array(await file.slice(dataStart,dataEnd).arrayBuffer());
      else if(/^project\/(categories|category-schemas|components|storage-layout|history|audit-history|audit-history-meta|undo-history|maps|projects|experiments|purchases|checklist|preferences)\.json$/.test(name)) explicit[name]=new Uint8Array(await file.slice(dataStart,dataEnd).arrayBuffer());
      else if(name==='project/emergency-fallback.json' || name==='project/backup-runtime.json' || name==='project/ui-state.json' || name==='project/state-meta.json') explicit[name]=new Uint8Array(await file.slice(dataStart,dataEnd).arrayBuffer());
      // نتعرّف على أي مجلد أصول محتمل (assets/…) وليس فقط المسارين الحاليين، حتى تبقى الحزم
      // القديمة/المستقبلية بأسماء مجلدات مختلفة قابلة للاستيراد بدل تجاهلها بصمت.
      else if(/^assets\//.test(name)) assets.push({name,start:dataStart,end:dataEnd,crc:h.crc});
      else rep.skippedEntries.push(name);
    }catch(e){ rep.warnings.push('فشل استخراج: '+name+' — '+(e?.message||e)); }
    pos=dataEnd;if(st)st.textContent=`⏳ استيراد الحزمة… ${Math.min(100,Math.round(pos/total*100))}%`;
  }
  if(!stateBytes) throw new Error('الحزمة لا تحتوي project/state.json — لا يوجد مشروع يمكن استعادته من هذا الملف.');
  if(!manifestBytes) rep.warnings.push('لا يوجد manifest.json داخل الحزمة (حزمة قديمة أو غير مكتملة) — تم المتابعة بدونه.');
  else{
    try{
      const m=JSON.parse(new TextDecoder().decode(manifestBytes));
      if(m.format!=='Workshop Inventory Full Project') rep.warnings.push('توقيع الحزمة غير معروف ("'+(m.format||'?')+'")؛ تمت محاولة الاستيراد كحزمة توافقية على أي حال.');
    }catch(e){ rep.warnings.push('manifest.json تالف/غير قابل للقراءة — تم تجاهله والمتابعة.'); }
  }
  try{ state=JSON.parse(new TextDecoder().decode(stateBytes)); }
  catch(e){ throw new Error('project/state.json تالف ولا يمكن تحليله (JSON غير صالح): '+(e?.message||e)); }
  migrateStateIfNeeded();ensureNewFields();ensureStoragePreferences();applyPreferences();applyUiTheme();
  if(localStorageBytes){try{const incomingLS=JSON.parse(new TextDecoder().decode(localStorageBytes));clearPortableLocalStorageExcept(incomingLS);restorePortableLocalStorage(incomingLS,rep);}catch(e){rep.warnings.push('local-storage.json تالف — تم استيراد بيانات المشروع بدونه.');}}
  restoreRuntimeLocalStorageFromState();
  if(indexedDbExtraBytes){try{await restoreBackupIndexedDBMeta(JSON.parse(new TextDecoder().decode(indexedDbExtraBytes)),rep);}catch(e){rep.warnings.push('indexeddb-extra.json تالف — تم تجاهله.');}}
  if(explicit['project/image-db-extra.json']){try{await restoreImageDbExtra(JSON.parse(new TextDecoder().decode(explicit['project/image-db-extra.json'])),rep);}catch(e){rep.warnings.push('image-db-extra.json تالف — تم تجاهله.');}}
  /* تحقق واسترجاع صريح للأجزاء المهمة. state.json هو المصدر الأساسي، وهذه الملفات تمنع فقدان جزء
     إذا كان ملف حالة قديمًا أو ناقصًا جزئيًا. لا نستبدل قيمًا موجودة فعليًا بقيم فارغة. */
  const parseExplicit=(name)=>{try{return JSON.parse(new TextDecoder().decode(explicit[name]));}catch(e){rep.warnings.push(name+' تالف — تم الاعتماد على state.json.');return null;}};
  /* الملفات الصريحة هي نسخ تحقق مستقلة؛ إذا كانت سليمة نعيدها بالكامل بدل شرط 'إذا كانت فارغة'،
     لأن الهدف من Full Restore هو عدم ترك نسخة قديمة/ناقصة من أي قسم فوق النسخة المستوردة. */
  if(explicit['project/categories.json']){const x=parseExplicit('project/categories.json');if(Array.isArray(x))state.categories=x;}
  if(explicit['project/category-schemas.json']){const x=parseExplicit('project/category-schemas.json');if(x&&typeof x==='object')state.categorySchemas=x;}
  if(explicit['project/components.json']){const x=parseExplicit('project/components.json');if(Array.isArray(x))state.components=x;}
  if(explicit['project/storage-layout.json']){const x=parseExplicit('project/storage-layout.json');if(x&&typeof x==='object'){for(const k of ['shelves','drawers','columns','boxes','containers'])if(Array.isArray(x[k]))state[k]=x[k];}}
  if(explicit['project/history.json']){const x=parseExplicit('project/history.json');if(Array.isArray(x))state.usageHistory=x;}
  if(explicit['project/audit-history.json']){const x=parseExplicit('project/audit-history.json');if(Array.isArray(x))state.auditHistory=x;}
  if(explicit['project/undo-history.json']){const x=parseExplicit('project/undo-history.json');if(x&&typeof x==='object'){if(Array.isArray(x.history))state.history=x.history;if(Array.isArray(x.future))state.future=x.future;}}
  if(explicit['project/maps.json']){const x=parseExplicit('project/maps.json');if(Array.isArray(x))state.workshopMap=x;}
  for(const [file,key] of [['project/projects.json','projects'],['project/experiments.json','experiments'],['project/purchases.json','purchases'],['project/checklist.json','checklist']]){
    if(explicit[file]){const x=parseExplicit(file);if(Array.isArray(x))state[key]=x;}
  }
  if(explicit['project/preferences.json']){const x=parseExplicit('project/preferences.json');if(x&&typeof x==='object')state.preferences=x;}
  if(explicit['project/ui-state.json']){try{const x=parseExplicit('project/ui-state.json');if(x&&typeof x==='object')uiState=x;}catch(e){}}
  migrateStateIfNeeded();ensureNewFields();ensureStoragePreferences();
  let amap={};
  if(assetManifestBytes){ try{ amap=JSON.parse(new TextDecoder().decode(assetManifestBytes))||{}; }catch(e){ rep.warnings.push('asset-manifest.json تالف — سيتم استنتاج معرّفات الملفات من أسمائها مباشرة.'); } }
  for(const a of assets){
    try{
      const info=amap[a.name]||{};
      const id=String(info.id||backupSafeName(a.name.split('/').pop().split('.')[0]));
      const blob=file.slice(a.start,a.end,{type:info.mime||guessMimeFromName(a.name)});
      const check=await streamBlobCRC(blob);
      if(check.size!==a.end-a.start||check.crc!==a.crc){
        rep.failedAssets.push({name:a.name,reason:'فشل فحص السلامة (CRC/الحجم) — الملف على الأغلب تلف أثناء النقل'});
        continue; // لا نوقف باقي الاستيراد بسبب ملف واحد تالف
      }
      await idbPutImage(id,blob,{name:info.name||a.name.split('/').pop(),mime:info.mime||blob.type,size:blob.size});
      rep.restoredAssets++;
    }catch(e){ rep.failedAssets.push({name:a.name,reason:String(e?.message||e)}); }
  }
  // بعد الاستيراد: نحوّل أي صور/ملفات ما زالت مضمّنة كـ data: URL داخل الحالة (من نسخ قديمة جدًا)
  // إلى أصول مخزّنة، بنفس آلية الترقية المستخدمة عند التصدير.
  try{ const before=state.__largeAssetMigrationDone; state.__largeAssetMigrationDone=false; await migrateLegacyDataUrlsToAssets(); if(!before && state.__largeAssetMigrationDone){} }catch(e){}
  return rep;
}
async function importPlainJSONFile(file,rep){
  const text=await file.text();
  let parsed;
  try{ parsed=JSON.parse(text); }catch(e){ throw new Error('الملف JSON غير صالح ولا يمكن تحليله: '+(e?.message||e)); }
  // يدعم كل من: ملف JSON خام لحالة التطبيق، أو ملف مغلّف بمفتاح "state"/"data" من مصادر أخرى.
  if(parsed && typeof parsed==='object' && !Array.isArray(parsed) && (parsed.columns||parsed.boxes||parsed.containers)){
    state=parsed;
  }else if(parsed && typeof parsed==='object' && parsed.state && typeof parsed.state==='object'){
    state=parsed.state; if(parsed.localStorage) restorePortableLocalStorage(parsed.localStorage,rep); rep.warnings.push('تم استخراج بيانات المشروع من مفتاح "state" داخل الملف.');
  }else{
    throw new Error('لا يمكن التعرّف على بنية بيانات المخزن داخل هذا الملف JSON.');
  }
  migrateStateIfNeeded();ensureNewFields();ensureStoragePreferences();applyPreferences();applyUiTheme();
  try{ state.__largeAssetMigrationDone=false; await migrateLegacyDataUrlsToAssets(); }catch(e){}
  return rep;
}
/* فحص سلامة بعد الاستيراد: يبحث داخل الحالة عن أي مرجع idbimg_ لا يقابله ملف مخزَّن فعليًا،
   بدل أن يظهر العطل لاحقًا بصمت كصورة/مرفق مفقود أثناء الاستخدام العادي. */
async function scanForMissingAssetRefs(){
  const stored=new Set((await listStoredAssetIds()).map(String));
  const missing=new Set();
  const seen=new WeakSet();
  (function walk(v){
    if(!v) return;
    if(typeof v==='string'){ if(isIdbImageRef(v) && !stored.has(v)) missing.add(v); return; }
    if(typeof v!=='object') return;
    if(seen.has(v)) return; seen.add(v);
    if(Array.isArray(v)){ v.forEach(walk); return; }
    Object.keys(v).forEach(k=>{ if(k!=='history'&&k!=='future') walk(v[k]); });
  })(state);
  return [...missing];
}
function renderImportReport(rep,missingRefs){
  const lines=[];
  lines.push(`✅ تم الاستيراد — ${rep.restoredAssets} ملف مُستعاد بنجاح.`);
  if(rep.failedAssets.length) lines.push(`⚠️ ${rep.failedAssets.length} ملف فشلت استعادته: `+rep.failedAssets.slice(0,8).map(f=>f.name).join('، ')+(rep.failedAssets.length>8?' …':''));
  if(missingRefs && missingRefs.length) lines.push(`⚠️ يوجد ${missingRefs.length} مرجع صورة/مرفق داخل بيانات المشروع بدون ملف فعلي مطابق (روابط قديمة أو ملفات لم تُصدَّر). لن تظهر هذه العناصر لحين إعادة رفعها يدويًا.`);
  if(rep.warnings.length) lines.push('ملاحظات: '+rep.warnings.slice(0,6).join(' | '));
  return lines.join('\n');
}
async function importFullProject(file){
  if(!confirm('سيتم استبدال بيانات التطبيق الحالية واستعادة المشروع والملفات المرفقة. هل تريد المتابعة؟'))return;
  const st=document.getElementById('backupStatus');if(st)st.textContent='⏳ جارٍ فحص الحزمة…';
  const rep=importReport();
  try{
    // نتعرّف على نوع الملف من محتواه الفعلي (توقيع البايتات) وليس فقط امتداد الاسم،
    // حتى لو أعاد المستخدم تسمية الملف أو جاء من مصدر آخر.
    const head=new Uint8Array(await file.slice(0,4).arrayBuffer());
    const isZip = head[0]===0x50 && head[1]===0x4b;
    if(isZip){
      await importStoredZipStream(file,st,rep);
    }else{
      // ليس ZIP — نحاول قراءته كنص JSON (يدعم ملفات "JSON فقط" المُصدَّرة، أو أي state.json مفرد).
      await importPlainJSONFile(file,rep);
    }
    const missingRefs=await scanForMissingAssetRefs();
    restoreRuntimeLocalStorageFromState();
    captureRuntimeLocalStorageIntoState();
    resetAuditTracker();
    scheduleSave();
    await flushSaveForBackup();
    showView('dashboard');
    if(st){ st.textContent=renderImportReport(rep,missingRefs); st.style.whiteSpace='pre-line'; }
    toast(rep.failedAssets.length||missingRefs.length?'تم الاستيراد مع بعض التحذيرات — راجع التفاصيل':'تم استيراد المشروع بالكامل');
  }catch(e){
    console.error(e);
    if(st){ st.textContent='❌ فشل الاستيراد: '+(e.message||e); st.style.whiteSpace='pre-line'; }
    toast('تعذّر استيراد هذا الملف');
  }
}

/* البحث يشمل: اسم المكون، اسم العبوة، اسم الرف، اسم العمود، ورقم الخلية (عبر locationLabel) */
const searchInput=document.getElementById('searchInput');
const searchResultsEl=document.getElementById('searchResults');
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){ searchResultsEl.classList.add('hidden'); return; }
  const seenCell=new Set();
  let rows='';

  const compSearchText=c=>{
    const parts=[c.name,c.partNumber,c.category,c.manufacturer,c.value,c.package,c.voltage,c.current,c.power,c.tolerance,c.frequency,c.notes,c.supplier];
    if(c.customSpecs) parts.push(...Object.values(c.customSpecs));
    return parts.filter(Boolean).join(' ').toLowerCase();
  };
  const compMatches=state.components.filter(c=>compSearchText(c).includes(q)).slice(0,8);
  compMatches.forEach(c=>{
    const containers=containerOfComponent(c.id);
    const first=containers[0];
    const loc=first? locationLabel(first.id): 'مخزون مؤقت (غير مخصص)';
    if(first) seenCell.add(first.id);
    let specHint='';
    if(c.customSpecs){
      const hit=Object.entries(c.customSpecs).find(([k,v])=>v && String(v).toLowerCase().includes(q));
      if(hit && typeof allSpecDefs==='function'){
        const def=allSpecDefs().find(d=>d.key===hit[0]);
        if(def) specHint=` · ${def.label}: ${hit[1]}`;
      }
    }
    rows+=`<div class="sres-item" data-comp="${c.id}" data-cell="${first?first.id:''}">
      <div><div class="sres-name">${c.name}</div><div class="sres-meta">${c.category||''} · إجمالي: ${totalQtyOfComponent(c.id)}${specHint}</div></div>
      <div class="sres-loc">${loc}</div>
    </div>`;
  });

  // مطابقة مباشرة على اسم الرف / العمود / العبوة / رقم الخلية
  const locMatches=state.containers.filter(c=>!seenCell.has(c.id) && locationLabel(c.id).toLowerCase().includes(q)).slice(0,8);
  locMatches.forEach(c=>{
    const comp=c.componentId?findComponent(c.componentId):null;
    rows+=`<div class="sres-item" data-cell="${c.id}">
      <div><div class="sres-name">${comp?comp.name:'خلية فارغة'}</div><div class="sres-meta">${comp?('إجمالي: '+totalQtyOfComponent(comp.id)):'موقع تخزين'}</div></div>
      <div class="sres-loc">${locationLabel(c.id)}</div>
    </div>`;
  });

  if(!rows){ searchResultsEl.innerHTML='<div class="sres-item"><span>لا توجد نتائج</span></div>'; searchResultsEl.classList.remove('hidden'); return; }
  searchResultsEl.innerHTML=rows;
  searchResultsEl.classList.remove('hidden');
});
searchResultsEl.addEventListener('click',e=>{
  const row=e.target.closest('.sres-item'); if(!row) return;
  const cellId=row.dataset.cell;
  searchResultsEl.classList.add('hidden'); searchInput.value='';
  if(cellId){ revealAndFlash(cellId); }
  else if(row.dataset.comp){ openComponentQuickView(row.dataset.comp); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('.search-wrap')) searchResultsEl.classList.add('hidden'); });

/* notifications panel */
function renderNotifPanel(){
  const panel=document.getElementById('notifPanel');
  const list=computeNotifications();
  const dismissedCount=(state.dismissedNotifications||[]).length;
  panel.innerHTML=(list.length? list.map((n,i)=>`<div class="notif-row" data-i="${i}" style="justify-content:space-between;">
      <span class="notif-go" data-i="${i}" style="cursor:pointer;flex:1;">${n.icon} ${n.text}</span>
      <span class="notif-del" data-i="${i}" title="حذف الإشعار" style="cursor:pointer;color:var(--red);padding-inline-start:8px;">✕</span>
    </div>`).join(''):'<div class="empty-state">لا توجد تنبيهات</div>')
    +(dismissedCount?`<div style="padding:8px 12px;font-size:11px;color:var(--dim);">${dismissedCount} إشعار مخفي · <span id="notifRestoreAll" style="cursor:pointer;text-decoration:underline;">إظهار الكل</span></div>`:'');
  panel.querySelectorAll('.notif-go').forEach(el=>{ el.onclick=()=>{ const i=Number(el.dataset.i); list[i].go(); panel.classList.add('hidden'); }; });
  panel.querySelectorAll('.notif-del').forEach(el=>{ el.onclick=(e)=>{ e.stopPropagation(); const i=Number(el.dataset.i); dismissNotification(list[i].key); }; });
  const restoreEl=document.getElementById('notifRestoreAll');
  if(restoreEl) restoreEl.onclick=()=>restoreAllNotifications();
}
document.getElementById('notifBell').addEventListener('click',e=>{
  e.stopPropagation();
  const panel=document.getElementById('notifPanel');
  renderNotifPanel();
  panel.classList.toggle('hidden');
});
document.addEventListener('click',e=>{ if(!e.target.closest('#notifBell') && !e.target.closest('#notifPanel')) document.getElementById('notifPanel').classList.add('hidden'); });

  captureRuntimeLocalStorageIntoState();

  document.addEventListener('change',e=>{if(e.target&&e.target.closest('#viewContainer,#modalRoot')){setTimeout(()=>{try{scheduleSave();}catch(_e){}},0);}},false);
  showView('dashboard');

})();

function openFullscreen(title, mountFn, onClose){
    const overlay = document.createElement("div");
    overlay.className = "fs-overlay";
    overlay.innerHTML = `
      <div class="fs-box">
