/* ---------- Aggregation for rack / column / box ---------- */
function visualChildren(item,kind,scope){
  const want=scope||'auto';
  if(kind==='rack'){
    const cols=columnsOfRack(item.id);
    if(want==='columns')return cols;
    if(want==='boxes')return cols.flatMap(c=>boxesOfColumn(c.id));
    if(want==='cells')return cols.flatMap(c=>boxesOfColumn(c.id).flatMap(b=>cellsOfBox(b.id)));
    return cols;
  }
  if(kind==='column'){
    const boxes=boxesOfColumn(item.id);
    if(want==='boxes')return boxes;
    if(want==='cells')return boxes.flatMap(b=>cellsOfBox(b.id));
    return boxes;
  }
  if(kind==='box')return cellsOfBox(item.id);
  return [];
}
function visualAllCells(item,kind){
  return visualChildren(item,kind,'cells');
}
function visualMetric(item,kind,v){
  const scope=v.scope||'auto', metric=v.metric||'manual', children=visualChildren(item,kind,scope);
  if(metric==='manual')return {value:numI(v.current,0),count:1,series:[numI(v.current,0)]};
  if(metric==='count')return {value:children.length,count:children.length,series:children.map(()=>1)};
  if(metric==='occupied')return {value:children.filter(x=>x.componentId).length,count:children.length,series:children.map(x=>x.componentId?1:0)};
  if(metric==='empty')return {value:children.filter(x=>!x.componentId).length,count:children.length,series:children.map(x=>x.componentId?0:1)};
  if(metric==='quantity')return {value:children.reduce((s,x)=>s+numI(x.quantity,0),0),count:children.length,series:children.map(x=>numI(x.quantity,0))};
  if(metric==='avgQuantity')return {value:children.length?children.reduce((s,x)=>s+numI(x.quantity,0),0)/children.length:0,count:children.length,series:children.map(x=>numI(x.quantity,0))};
  if(metric==='maxQuantity')return {value:children.length?Math.max(...children.map(x=>numI(x.quantity,0))):0,count:children.length,series:children.map(x=>numI(x.quantity,0))};
  if(metric==='minQuantity')return {value:children.length?Math.min(...children.map(x=>numI(x.quantity,0))):0,count:children.length,series:children.map(x=>numI(x.quantity,0))};
  if(metric==='fill')return {value:children.length?children.filter(x=>x.componentId).length/children.length*100:0,count:children.length,series:children.map(x=>x.componentId?100:0),percent:true};
  if(metric==='componentTypes'){
    const ids=new Set(children.filter(x=>x.componentId).map(x=>x.componentId));return {value:ids.size,count:children.length,series:[ids.size]};
  }
  if(metric==='lowStock'){
    const n=children.filter(x=>{if(!x.componentId)return false;const c=findComponent(x.componentId);return c&&numI(x.quantity,0)<=numI(c.warningStock,0);}).length;
    return {value:n,count:children.length,series:children.map(x=>x.componentId&&(()=>{const c=findComponent(x.componentId);return c&&numI(x.quantity,0)<=numI(c.warningStock,0)?1:0})())};
  }
  if(metric==='criticalStock'){
    const n=children.filter(x=>{if(!x.componentId)return false;const c=findComponent(x.componentId);return c&&numI(x.quantity,0)<=numI(c.criticalStock,0);}).length;
    return {value:n,count:children.length,series:children.map(x=>x.componentId&&(()=>{const c=findComponent(x.componentId);return c&&numI(x.quantity,0)<=numI(c.criticalStock,0)?1:0})())};
  }
  if(metric==='children'){
    return {value:children.length,count:children.length,series:children.map(()=>1)};
  }
  return {value:numI(v.current,0),count:1,series:[numI(v.current,0)]};
}
function visualPercentV(v,res){
  if(v.metric==='fill')return clampI(res.value);
  const min=numI(v.min,0),max=numI(v.max,100);
  return max<=min?(res.value>min?100:0):clampI((res.value-min)/(max-min)*100);
}
function visualSeriesHTMLV(series,color){
  const a=(series||[]).slice(-8); if(!a.length)return '';
  const max=Math.max(1,...a.map(x=>numI(x,0)));
  return a.map(x=>`<i style="height:${Math.max(3,Math.round(numI(x,0)/max*18))}px;background:${color}"></i>`).join('');
}
function visualOneHTML(v,item,kind){
  if(v.visible===false)return '';
  const res=visualMetric(item,kind,v), pct=visualPercentV(v,res), color=v.color||'#f2aa3b', p=Math.round(pct);
  let mark='';
  if(v.mode==='percent')mark=`<span class="vv-value">${p}%</span><span class="vv-bar"><i style="width:${p}%;background:${color}"></i></span>`;
  else if(v.mode==='indicator')mark=`<span class="vv-bar"><i style="width:${p}%;background:${color}"></i></span><span class="vv-value">${p}%</span>`;
  else if(v.mode==='light')mark=`<i class="vv-light" style="color:${color};background:${color}"></i><span class="vv-value">${p}%</span>`;
  else if(v.mode==='level')mark=`<span class="vv-level">${[1,2,3,4,5].map(n=>`<i style="height:${n*3}px;opacity:${p>=n*20?1:.22};background:${color}"></i>`).join('')}</span><span class="vv-value">${p}%</span>`;
  else if(v.mode==='ring')mark=`<span class="vv-ring" style="--vv-color:${color};transform:rotate(${p*3.6}deg)"><span style="transform:rotate(-${p*3.6}deg);font-size:7px">${p}%</span></span>`;
  else if(v.mode==='donut')mark=`<span class="vv-donut" style="--vv-color:${color};--vv-pct:${p}%"><span style="position:relative;z-index:1;font-size:7px">${p}%</span></span>`;
  else if(v.mode==='steps')mark=`<span class="vv-steps">${[1,2,3,4,5,6].map(n=>`<i style="background:${color};opacity:${p>=n*100/6?1:.18}"></i>`).join('')}</span>`;
  else if(v.mode==='bars')mark=`<span class="vv-mini-bars">${visualSeriesHTMLV(res.series,color)}</span>`;
  else if(v.mode==='spark')mark=`<span class="vv-spark" style="color:${color}">${(res.series||[]).slice(-8).map(x=>['▁','▂','▃','▄','▅','▆','▇','█'][Math.max(0,Math.min(7,Math.round(numI(x,0)/(Math.max(1,...(res.series||[1])))*7))) ]).join('')}</span>`;
  else if(v.mode==='gauge')mark=`<span class="vv-gauge"><i style="--vv-color:${color};transform:rotate(${(-65+p*1.3)}deg)"></i></span><span class="vv-value">${p}%</span>`;
  else if(v.mode==='number')mark=`<span class="vv-value" style="color:${color}">${escI(res.value)}${escI(v.unit||'')}</span>`;
  else if(v.mode==='badge')mark=`<span class="vv-badge" style="--vv-color:${color}">${escI(res.value)}${escI(v.unit||'')}</span>`;
  else mark=`<span class="vv-value">${escI(res.value)}${escI(v.unit||'')}</span>`;
  return `<span class="visual-var" title="${escI(v.name||'')}"><span class="vv-name">${escI(v.name||'')}</span>${mark}</span>`;
}
function ensureVisual(item){
  if(!item.visualVars) item.visualVars=[{id:uid('var'),name:'المخزون الحالي',unit:'قطعة',min:0,max:500,current:68,mode:'percent',visible:true,scope:'auto',metric:'manual',color:'#f2aa3b'}];

}
function visualVarsHTML(item,kind){
  ensureVisual(item);
  const strip=(item.visualVars||[]).map(v=>visualOneHTML(v,item,kind)).join('');
  if(!strip)return '';
  return `<div class="visual-var-strip"><span style="font-size:9px;color:var(--dim2)">مؤشرات مرتبطة</span>${strip}</div>`;
}
function visualVarRowHTML(v){
  const scopes=[['auto','الأبناء تلقائيًا'],['columns','الأعمدة'],['boxes','العبوات'],['cells','الخلايا']];
  const metrics=[['manual','قيمة يدوية'],['quantity','إجمالي الكمية'],['avgQuantity','متوسط الكمية'],['maxQuantity','أعلى كمية'],['minQuantity','أقل كمية'],['occupied','خلايا مشغولة'],['empty','خلايا فارغة'],['fill','نسبة الامتلاء'],['count','عدد العناصر'],['componentTypes','عدد أنواع المكونات'],['lowStock','مخزون منخفض'],['criticalStock','مخزون حرج']];
  const modes=[['percent','نسبة مئوية'],['indicator','شريط'],['light','لمبة'],['ring','حلقة'],['donut','دونات'],['level','مستويات'],['steps','خطوات'],['bars','أعمدة'],['spark','مخطط صغير'],['gauge','عداد'],['number','رقم'],['badge','شارة']];
  return `<div class="visual-var-row" data-vrow="${v.id}">
    <div class="field"><label>اسم المؤشر</label><input data-v="name" value="${escI(v.name||'')}"></div>

        remove.textContent='🗑'; remove.title='حذف المقطع';
        top.append(title,toggle,remove);

        const bodyEl=document.createElement('div'); bodyEl.className='vdoc-multi-body';
        const view=document.createElement('div');
        view.className='explain-view vdoc-multi-view';
        view.innerHTML=typeof renderMarkdownLite==='function'?renderMarkdownLite(item.content||''):(item.content||'').replace(/\n/g,'<br>');
        const toolbarHolder=document.createElement('div');
        toolbarHolder.className='fmt-toolbar-holder'; toolbarHolder.style.display='none';
        const ta=document.createElement('textarea');
        ta.className='vdoc-multi-editor'; ta.value=item.content||''; ta.style.display='none';
        bodyEl.append(view,toolbarHolder,ta);
        row.append(top,bodyEl); list.appendChild(row);

        if(typeof buildFormatToolbar==='function')toolbarHolder.appendChild(buildFormatToolbar(()=>ta));
        if(typeof enhanceMarkdownView==='function')enhanceMarkdownView(view);

        title.addEventListener('input',e=>{item.title=e.target.value;save()});
        toggle.addEventListener('click',()=>{
          const collapsed=row.classList.toggle('is-collapsed');
          toggle.textContent=collapsed?'⌄':'⌃';
          toggle.title=collapsed?'إظهار الشرح':'إخفاء الشرح مع إبقاء العنوان';
        });
        remove.onclick=()=>{
          if(typeof armConfirm==='function' && !armConfirm(remove,'حذف المقطع؟'))return;
          section.explanations.splice(index,1); save(); renderList();
        };

        const edit=()=>{
          view.style.display='none';
          toolbarHolder.style.display='flex';
          ta.style.display='block';
          autoGrow(ta); ta.focus();
        };
        view.addEventListener('click',edit);
        ta.addEventListener('input',()=>{item.content=ta.value;autoGrow(ta);save()});
        ta.addEventListener('blur',()=>{
          item.content=ta.value;
          view.innerHTML=typeof renderMarkdownLite==='function'?renderMarkdownLite(item.content):(item.content||'').replace(/\n/g,'<br>');
          if(typeof enhanceMarkdownView==='function')enhanceMarkdownView(view);
          ta.style.display='none'; toolbarHolder.style.display='none'; view.style.display='block';
          save();
        });
      });
    };

    add.onclick=()=>{
      section.explanations.push({id:typeof secUid==='function'?secUid():'note_'+Date.now(),title:'',content:''});
      save(); renderList();
    };
    renderList(); body.appendChild(wrap);
  }

  window.mountCellSection=function(host,container){
    prior(host,container);
    host.__docSection=container.section;
    requestAnimationFrame(()=>enhance(host,container.section));
  };
  new MutationObserver(()=>document.querySelectorAll('.vdoc').forEach(host=>{
    if(host.__docSection)enhance(host,host.__docSection)
  })).observe(document.body,{childList:true,subtree:true});
})();
</script>

<!-- ISOLATED BOX DRAG/DROP PATCH: does not replace existing rendering or storage code -->
<style id="box-dnd-patch-style">
.box-card[data-box-id],.vs3-full-book[data-box-id],.box-chip[data-box-id]{touch-action:manipulation}
.box-dnd-dragging{opacity:.55!important;outline:2px solid var(--amber)!important}
.box-dnd-over{outline:2px dashed var(--amber)!important;outline-offset:3px}
.rack-column.box-dnd-column-over{box-shadow:inset 0 0 0 2px var(--amber);background:var(--amber-dim)}
</style>
<script id="box-dnd-patch">
(function(){
  'use strict';
  var dragBoxId=null;
  function boxEl(n){ return n && n.closest ? n.closest('[data-box-id]') : null; }
  function colEl(n){ return n && n.closest ? n.closest('[data-col-id]') : null; }
  function isInteractive(n){ return !!(n && n.closest && n.closest('button,input,select,textarea,a')); }
  function getBox(id){ try{return Array.isArray(state.boxes)?state.boxes.find(function(b){return String(b.id)===String(id)}):null;}catch(e){return null;} }
  function normalize(columnId){
    if(!state || !Array.isArray(state.boxes)) return;
    var list=state.boxes.filter(function(b){return String(b.columnId)===String(columnId);})
      .sort(function(a,b){return (Number(a.order)||0)-(Number(b.order)||0);});
    list.forEach(function(b,i){b.order=i+1;});
  }
  function commit(fromId,targetColumnId,beforeId){
    var box=getBox(fromId); if(!box || !targetColumnId) return false;
    var oldCol=box.columnId;
    var moving=state.boxes.filter(function(b){return String(b.columnId)===String(oldCol);})
      .sort(function(a,b){return (Number(a.order)||0)-(Number(b.order)||0);});
    var idx=moving.indexOf(box); if(idx>=0)moving.splice(idx,1);
    if(String(oldCol)===String(targetColumnId)){
      if(beforeId){var bi=moving.findIndex(function(b){return String(b.id)===String(beforeId);}); if(bi<0)bi=moving.length; moving.splice(bi,0,box);} else moving.push(box);
      moving.forEach(function(b,i){b.order=i+1;});
    }else{
      box.columnId=targetColumnId;
      var dest=state.boxes.filter(function(b){return String(b.columnId)===String(targetColumnId)&&b!==box;})
        .sort(function(a,b){return (Number(a.order)||0)-(Number(b.order)||0);});
      if(beforeId){var di=dest.findIndex(function(b){return String(b.id)===String(beforeId);}); if(di<0)di=dest.length; dest.splice(di,0,box);} else dest.push(box);
      dest.forEach(function(b,i){b.order=i+1;}); normalize(oldCol);
    }
    try{scheduleSave();}catch(e){}
    return true;
  }
  function markDraggable(root){
    (root||document).querySelectorAll('[data-box-id]').forEach(function(el){
      if(!el.hasAttribute('draggable')) el.setAttribute('draggable','true');
      if(!el.dataset.boxDndReady){el.dataset.boxDndReady='1';}
    });
  }
  document.addEventListener('dragstart',function(e){
    if(isInteractive(e.target)) return;
    var b=boxEl(e.target); if(!b) return;
    dragBoxId=b.dataset.boxId; if(!dragBoxId)return;
    b.classList.add('box-dnd-dragging');
    try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('application/x-workshop-box',dragBoxId);e.dataTransfer.setData('text/plain','BOX:'+dragBoxId);}catch(_){ }
    e.stopPropagation();
  },true);
  document.addEventListener('dragover',function(e){
    var id=dragBoxId || (function(){try{return e.dataTransfer.getData('application/x-workshop-box')}catch(_){return null}})(); if(!id)return;
    var b=boxEl(e.target), c=colEl(e.target); if(!b && !c)return;
    e.preventDefault(); e.stopPropagation();
    if(b && String(b.dataset.boxId)!==String(id)) b.classList.add('box-dnd-over');
    if(c) c.classList.add('box-dnd-column-over');
    try{e.dataTransfer.dropEffect='move';}catch(_){}
  },true);
  document.addEventListener('dragleave',function(e){var b=boxEl(e.target),c=colEl(e.target); if(b)b.classList.remove('box-dnd-over'); if(c)c.classList.remove('box-dnd-column-over');},true);
  document.addEventListener('drop',function(e){
    var id=dragBoxId; try{id=id||e.dataTransfer.getData('application/x-workshop-box')||String(e.dataTransfer.getData('text/plain')||'').replace(/^BOX:/,'');}catch(_){}
    if(!id || !getBox(id)) return;
    var targetBox=boxEl(e.target), targetCol=colEl(e.target);
    if(!targetCol && targetBox){var tb=getBox(targetBox.dataset.boxId); if(tb)targetCol={dataset:{colId:tb.columnId}};}
    if(!targetCol || !targetCol.dataset || !targetCol.dataset.colId) return;
    e.preventDefault(); e.stopPropagation();
    var beforeId=targetBox && String(targetBox.dataset.boxId)!==String(id)?targetBox.dataset.boxId:null;
    if(commit(id,targetCol.dataset.colId,beforeId)){
      try{showView(currentView||'storage');}catch(_){ }
      try{toast('تم نقل / ترتيب العبوة');}catch(_){ }
    }
    dragBoxId=null;
  },true);
  document.addEventListener('dragend',function(){document.querySelectorAll('.box-dnd-dragging,.box-dnd-over,.box-dnd-column-over').forEach(function(x){x.classList.remove('box-dnd-dragging','box-dnd-over','box-dnd-column-over');});dragBoxId=null;},true);
  markDraggable(document);
  var mo=new MutationObserver(function(){markDraggable(document);});
  mo.observe(document.documentElement,{childList:true,subtree:true});
})();
</script>


<!-- BOX FLASH ON CELL SEARCH PATCH -->
<style id="box-flash-search-patch">
@keyframes boxSearchFlash{
  0%,100%{outline:0 solid transparent;box-shadow:none;filter:none}
  50%{outline:3px solid var(--amber);outline-offset:3px;box-shadow:0 0 0 6px var(--amber-dim),0 0 30px rgba(var(--amber-rgb),.75);filter:brightness(1.12)}
}
.box-search-flash{animation:boxSearchFlash .6s ease-in-out 3!important;position:relative;z-index:30}
</style>
<script id="box-flash-search-patch">
(function(){
  function flashBoxEverywhere(boxId){
    if(!boxId) return;
    var id=String(boxId);
    var esc=(window.CSS&&CSS.escape)?CSS.escape(id):id.replace(/["\\]/g,'\\$&');
    var selectors=[
      '[data-box-id="'+esc+'"]',
      '[data-boxid="'+esc+'"]',
      '[data-box="'+esc+'"]',
      '.box-card[data-box-id="'+esc+'"]',
      '.box-chip[data-box-id="'+esc+'"]',
      '.vs3-full-book[data-box-id="'+esc+'"]',
      '.column-page-box[data-box-id="'+esc+'"]'
    ];
    var seen=new Set();
    document.querySelectorAll(selectors.join(',')).forEach(function(el){
      if(seen.has(el)) return; seen.add(el);
      el.classList.remove('box-search-flash');
      void el.offsetWidth;
      el.classList.add('box-search-flash');
      setTimeout(function(){el.classList.remove('box-search-flash');},1900);
    });
  }
  window.flashBoxForSearch=flashBoxEverywhere;

  var original=window.revealAndFlash;
  if(typeof original==='function'){
    window.revealAndFlash=function(cellId){
      var boxId='';
      try{
        var cell=(typeof findContainer==='function')?findContainer(cellId):null;
        boxId=cell&&cell.boxId;
      }catch(e){}
      original.apply(this,arguments);
      [420,850,1250].forEach(function(delay){
        setTimeout(function(){flashBoxEverywhere(boxId);},delay);
      });
    };
  }

  document.addEventListener('DOMContentLoaded',function(){
    if(typeof window.revealAndFlash!=='function') return;
  });
})();
</script>
