        const gear = document.createElement("button"); gear.className="col-icon-btn"; gear.textContent="⚙"; gear.title="إدارة الخيارات";
        gear.onclick = ()=> tblModalManageOptions(col, rerenderHolder);
        cell.appendChild(gear);
      }
      if(table.columns.length>1){
        const del = document.createElement("button"); del.className="col-icon-btn del"; del.textContent="✕"; del.title="حذف العمود";
        del.onclick = (e)=>{
          if(!armConfirm(e.currentTarget, "تأكيد؟")) return;
          table.columns = table.columns.filter(c=>c.id!==col.id);
          table.rows.forEach(r=>{ delete r.values[col.id]; });
          scheduleSave(); rerenderHolder();
        };
        cell.appendChild(del);
      }
      th.appendChild(cell);
      trh.appendChild(th);

      table.columns.forEach(c=>{ values[c.id] = c.type==="select" ? (c.options[0]||"") : ""; });
      table.rows.push(makeTblRow(values));
      scheduleSave(); rerenderHolder();

    rowFooter.appendChild(addRowBtn);

function appendTblRow(tbody, table, row, rerenderHolder){
    const tr = document.createElement("tr");

    table.columns.forEach(col=>{
      const td = document.createElement("td");
      if(col.type==="select"){
        const sel = document.createElement("select"); sel.className="cell-select";
        col.options.forEach(opt=>{
          const o = document.createElement("option"); o.value=opt; o.textContent=opt;
          if(row.values[col.id]===opt) o.selected=true;
          sel.appendChild(o);
        });
        sel.onchange = ()=>{ row.values[col.id] = sel.value; scheduleSave(); };
        td.appendChild(sel);
      } else {
        const inp = document.createElement("input"); inp.className="cell-text";
        inp.value = row.values[col.id] !== undefined ? row.values[col.id] : "";
        inp.oninput = ()=>{ row.values[col.id] = inp.value; scheduleSave(); };
        td.appendChild(inp);
      }
      tr.appendChild(td);
    });

    const tdSpacer = document.createElement("td");
    tr.appendChild(tdSpacer);

    const tdActions = document.createElement("td"); tdActions.className="actions-cell";

    const chk = document.createElement("button"); chk.className="chk"+(row.checked?" on":"");
    chk.textContent = row.checked?"✓":""; chk.title="تمييز كمكتمل";
    chk.onclick = ()=>{
      row.checked = !row.checked;
      chk.className="chk"+(row.checked?" on":""); chk.textContent = row.checked?"✓":"";
      scheduleSave();
    };
    tdActions.appendChild(chk);

    const noteBtn = document.createElement("button");
    function hasContent(){ return row.note1 || row.note2 || (row.comments && row.comments.length); }
    noteBtn.className="note-toggle"+(hasContent()?" has-content":"");
    noteBtn.textContent="📝"; noteBtn.title="ملاحظات وتعليقات";
    tdActions.appendChild(noteBtn);

    const imgBtn = document.createElement("button"); imgBtn.className="img-toggle"; imgBtn.title="الصور";
    function refreshImgBtn(){
      if(row.images && row.images.length){
        imgBtn.innerHTML = `<img><span class="count-badge">${row.images.length}</span>`;

function openImageDB(){
    if(imgDbPromise) return imgDbPromise;
    imgDbPromise = new Promise((resolve, reject) => {
      if(!("indexedDB" in window)){ reject(new Error("IndexedDB غير مدعوم في هذا المتصفح")); return; }
      const req = indexedDB.open(IMG_DB_NAME, IMG_DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(IMG_STORE)) db.createObjectStore(IMG_STORE);
        if(!db.objectStoreNames.contains(APP_STORE)) db.createObjectStore(APP_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return imgDbPromise;
  }

function genImageId(){ return "idbimg_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9); }

function fileKindFromMime(mime, name){
    mime = mime || ""; name = (name || "").toLowerCase();
    if(mime.indexOf("image/") === 0) return "image";
    if(mime.indexOf("video/") === 0) return "video";
    if(mime.indexOf("audio/") === 0) return "audio";
    if(mime === "application/pdf" || name.endsWith(".pdf")) return "pdf";
    return "other";
  }

function tblFileIconFor(mime, name){
    const kind = fileKindFromMime(mime, name);
    if(kind === "image") return "🖼️";
    if(kind === "video") return "🎬";
    if(kind === "audio") return "🎵";
    if(kind === "pdf") return "📄";
    const n = (name || "").toLowerCase();
    if(/\.(zip|rar|7z|tar|gz)$/.test(n)) return "📦";
    if(/\.(c|cpp|h|hpp|py|js|ts|java|json|html|css|asm|s|hex|ino|sh|php|rb|go|rs)$/.test(n)) return "💻";
    if(/\.(exe|bin|dll|so|apk)$/.test(n)) return "⚙️";
    if(/\.(doc|docx|xls|xlsx|ppt|pptx|txt|md)$/.test(n)) return "📃";
    return "📎";
  }

function formatFileSize(bytes){
    if(bytes == null || !isFinite(bytes)) return "";
    if(bytes < 1024) return bytes + " B";
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
    if(bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + " MB";
    if(bytes < 1024*1024*1024*1024) return (bytes/(1024*1024*1024)).toFixed(2) + " GB";
    return (bytes/(1024*1024*1024*1024)).toFixed(2) + " TB";
  }

function isIdbImageRef(ref){ return typeof ref === "string" && ref.indexOf("data:") !== 0 && ref.indexOf("idbimg_") === 0; }

function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

function base64ToBlob(dataUrl){
    const parts = dataUrl.split(",");
    const meta = parts[0]; const b64 = parts[1];
    const mimeMatch = meta.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type: mime});
  }

/* ============================= LARGE FILE STORAGE ============================= */
const LARGE_ASSET_THRESHOLD = 8 * 1024 * 1024; // 8MB: الملفات الكبيرة تذهب إلى OPFS عند توفره.
const ASSET_META_PREFIX = 'asset_meta:';
let opfsRootPromise=null;
async function getOPFSRoot(){
  if(opfsRootPromise) return opfsRootPromise;
  opfsRootPromise=(async()=>{
    if(!navigator.storage?.getDirectory) return null;
    const root=await navigator.storage.getDirectory();
    return await root.getDirectoryHandle('workshop-assets',{create:true});
  })().catch(()=>null);
  return opfsRootPromise;
}
async function opfsPut(id,blob){
  const dir=await getOPFSRoot(); if(!dir) throw new Error('OPFS غير متاح');
  const h=await dir.getFileHandle(String(id),{create:true});
  const w=await h.createWritable();
  try{ await w.write(blob); await w.close(); }catch(e){ try{await w.abort();}catch(_e){} throw e; }
}
async function opfsGet(id){
  const dir=await getOPFSRoot(); if(!dir) return null;
  try{ const h=await dir.getFileHandle(String(id)); return await h.getFile(); }catch(e){ return null; }
}
async function opfsDelete(id){
  const dir=await getOPFSRoot(); if(!dir) return;
  try{ await dir.removeEntry(String(id)); }catch(e){}
}
async function idbPutImage(id, blob, extraMeta={}){
  const meta={id:String(id),mime:blob?.type||extraMeta.mime||'application/octet-stream',size:Number(blob?.size||extraMeta.size||0),name:extraMeta.name||'',createdAt:extraMeta.createdAt||new Date().toISOString()};
  const shouldUseOPFS=meta.size>=LARGE_ASSET_THRESHOLD;
  if(shouldUseOPFS){
    try{
      await opfsPut(id,blob);
      meta.backend='opfs';
      await idbSet(ASSET_META_PREFIX+String(id),meta);
      return meta;
    }catch(e){ /* fallback to IndexedDB */ }
  }
  const db=await openImageDB();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(IMG_STORE,'readwrite');
    tx.objectStore(IMG_STORE).put(blob,id);
    tx.oncomplete=()=>resolve(true); tx.onerror=()=>reject(tx.error);
  });
  meta.backend='idb';
  try{ await idbSet(ASSET_META_PREFIX+String(id),meta); }catch(e){}
  return meta;
}
async function idbGetImage(id){
  const key=String(id);
  let meta=null; try{ meta=await idbGet(ASSET_META_PREFIX+key); }catch(e){}
  if(meta?.backend==='opfs'){
    const f=await opfsGet(key); if(f) return f;
    // لو ملف OPFS اختفى، جرّب نسخة IndexedDB القديمة إن وجدت.
  }
  try{
    const db=await openImageDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(IMG_STORE,'readonly'); const req=tx.objectStore(IMG_STORE).get(id);
      req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbDeleteImage(id){
  const key=String(id);
  await opfsDelete(key);
  try{
    const db=await openImageDB();
    await new Promise((resolve,reject)=>{const tx=db.transaction(IMG_STORE,'readwrite');tx.objectStore(IMG_STORE).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});
  }catch(e){}
  try{ await idbSet(ASSET_META_PREFIX+key,null); }catch(e){}
}
async function getAssetMeta(id){ try{return await idbGet(ASSET_META_PREFIX+String(id));}catch(e){return null;} }
async function listStoredAssetIds(){
  const ids=new Set();
  try{
    const db=await openImageDB();
    const keys=await new Promise((resolve,reject)=>{const tx=db.transaction(IMG_STORE,'readonly'),req=tx.objectStore(IMG_STORE).getAllKeys();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});
    keys.forEach(k=>ids.add(String(k)));
  }catch(e){}
  // metadata store contains OPFS assets even when the IndexedDB blob store is empty.
  try{
    const db=await openDB();
    const keys=await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAllKeys();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});
    keys.filter(k=>String(k).startsWith(ASSET_META_PREFIX)).forEach(k=>ids.add(String(k).slice(ASSET_META_PREFIX.length)));
  }catch(e){}
  return [...ids];
}
/* ============================= مسح كامل لكل بيانات التطبيق ============================= */
/* يمسح فعليًا: قاعدة بيانات الحالة (IndexedDB)، قاعدة بيانات الصور/الملفات المرفقة (IndexedDB)،
   ملفات OPFS الكبيرة، وكل مفاتيح localStorage الخاصة بالتطبيق. لا يُبقي أي أثر لأي بيانات سابقة. */
async function wipeAllAppData(){
  const errors=[];
  // 1) تفريغ متجر الحالة الرئيسي (state + asset_meta + أي مفاتيح أخرى بداخله)
  try{
    const db=await openDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).clear();
      tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
    });
  }catch(e){ errors.push('state-db: '+(e?.message||e)); }
  // 2) تفريغ قاعدة بيانات الصور/الملفات المرفقة بالكامل (كل الـ object stores بداخلها)
  try{
    const idb=await openImageDB();
    const names=Array.from(idb.objectStoreNames||[]);
    if(names.length){
      await new Promise((resolve,reject)=>{
        const tx=idb.transaction(names,'readwrite');
        names.forEach(n=>tx.objectStore(n).clear());
        tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
      });
    }
  }catch(e){ errors.push('image-db: '+(e?.message||e)); }
  // 3) حذف كل الملفات الكبيرة المخزَّنة في OPFS
  try{
    if(navigator.storage?.getDirectory){
      const root=await navigator.storage.getDirectory();
      const dir=await root.getDirectoryHandle('workshop-assets',{create:false}).catch(()=>null);
      if(dir){
        const names=[];
        for await (const name of dir.keys()) names.push(name);
        for(const name of names){ try{ await dir.removeEntry(name); }catch(e){} }
      }
    }
  }catch(e){ errors.push('opfs: '+(e?.message||e)); }
  // 4) مسح كل مفاتيح localStorage الخاصة بالتطبيق (نفس منطق الاستيراد الكامل: كل شيء عدا مفاتيح __ المحجوزة)
  try{ clearPortableLocalStorageExcept({}); }catch(e){ errors.push('localStorage: '+(e?.message||e)); }
  return errors;
}
async function migrateLegacyDataUrlsToAssets(){
  if(!state || state.__largeAssetMigrationDone) return;
  let changed=false,converted=0;
  const seen=new WeakSet();
  async function walk(obj){
    if(!obj || typeof obj!=='object') return;
    if(seen.has(obj)) return; seen.add(obj);
    if(Array.isArray(obj)){
      for(let i=0;i<obj.length;i++){
        const v=obj[i];
        if(typeof v==='string' && v.startsWith('data:') && v.length>1000){
          try{const blob=base64ToBlob(v);const id=genImageId();await idbPutImage(id,blob,{mime:blob.type});obj[i]=id;changed=true;converted++;}catch(e){}
        }else if(v&&typeof v==='object') await walk(v);
      }
      return;
    }
    for(const k of Object.keys(obj)){
      const v=obj[k];
      if(typeof v==='string' && v.startsWith('data:') && v.length>1000){
        try{const blob=base64ToBlob(v);const id=genImageId();await idbPutImage(id,blob,{mime:blob.type});obj[k]=id;changed=true;converted++;}catch(e){}
      }else if(v&&typeof v==='object') await walk(v);
    }
  }
  try{ await walk(state); state.__largeAssetMigrationDone=true; if(changed) scheduleSave(); if(converted) console.info('Migrated embedded assets:',converted); }catch(e){}
}

let imgNaturalW = 0, imgNaturalH = 0, imgBaseScale = 1, imgZoomFactor = 1, imgTx = 0, imgTy = 0;;
const MIN_ZOOM = 0.5, MAX_ZOOM = 6;;
tblLightboxImgEl.addEventListener("load", ()=>{
    imgNaturalW = tblLightboxImgEl.naturalWidth;
    imgNaturalH = tblLightboxImgEl.naturalHeight;
    imgZoomFactor = 1;

    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY);
  }, { passive:false });
const activePointers = new Map();;
let dragStart = null, dragMoved = false, pinchStartDist = null, pinchStartZoom = null;;
tblLightboxStageEl.addEventListener("pointerdown", (e)=>{
    if(tblLightboxImgEl.style.display === "none") return;
    tblLightboxStageEl.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    dragMoved = false;
    if(activePointers.size === 1){
      dragStart = { x:e.clientX, y:e.clientY, tx:imgTx, ty:imgTy };
      tblLightboxStageEl.classList.add("dragging");
    } else if(activePointers.size === 2){
      dragStart = null;
      const pts = Array.from(activePointers.values());
      pinchStartDist = ptDist(pts[0], pts[1]);
      pinchStartZoom = imgZoomFactor;
    }
  });
tblLightboxStageEl.addEventListener("pointermove", (e)=>{
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size === 1 && dragStart){
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if(Math.abs(dx) + Math.abs(dy) > 6) dragMoved = true;
      imgTx = dragStart.tx + dx; imgTy = dragStart.ty + dy;
      applyImgTransform();
    } else if(activePointers.size === 2 && pinchStartDist){
      dragMoved = true;
      const pts = Array.from(activePointers.values());
      const dist = ptDist(pts[0], pts[1]);
      const mid = ptMid(pts[0], pts[1]);
      const stageRect = tblLightboxStageEl.getBoundingClientRect();
      const oldScale = imgBaseScale * imgZoomFactor;
      let newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinchStartZoom * (dist / pinchStartDist)));
      const newScale = imgBaseScale * newZoom;
      const cx = mid.x - stageRect.left, cy = mid.y - stageRect.top;
      imgTx = cx - (cx - imgTx) * (newScale / oldScale);
      imgTy = cy - (cy - imgTy) * (newScale / oldScale);
      imgZoomFactor = newZoom;
      applyImgTransform();
    }
  });
tblLightboxStageEl.addEventListener("pointerup", releasePointer);
tblLightboxStageEl.addEventListener("pointercancel", releasePointer);
tblLightboxStageEl.addEventListener("pointerleave", (e)=>{ if(activePointers.has(e.pointerId)) releasePointer(e); });

  const holder = card.querySelector(".codes-holder");

  {
    const viewEl = card.querySelector('[data-act="explain-view"]');

      const ta = document.createElement("textarea");

  function focusBlock(name){

  card.querySelector('[data-act="addtable-quick"]').addEventListener("click", ()=>{

  card.querySelector('[data-act="focus-mindmap"]').addEventListener("click", ()=>focusBlock("mindmap"));
  card.querySelector('[data-act="toggle-all"]').addEventListener("click", ()=>{
    const blocks=[...card.querySelectorAll('.content-block')];
    const shouldCollapse=blocks.some(b=>!b.classList.contains('is-collapsed'));
    blocks.forEach(block=>{
      block.classList.toggle('is-collapsed',shouldCollapse);
      const b=block.querySelector('[data-act="collapse"]');
      if(b) b.textContent=shouldCollapse?'⌄ فتح':'⌃ طي';
    });
  });

  return card;
}

function mountCellSection(mountEl, cont){
  const s = ensureCellSection(cont);
  function doMount(){
    mountEl.innerHTML = "";
    window.__secRerender = doMount;
    mountEl.appendChild(buildSectionCard(s, { rerender: doMount }));
  }
  doMount();
}
window.mountCellSection = mountCellSection;

<script>

(function(){

const SELECTOR='.rack-panel[data-rack-id],.rack-fullpage-wrap[data-rack-id],.rack-column[data-col-id],.vs3-full-column[data-col-id],.box-chip[data-box-id],.box-card[data-box-id],.vs3-full-book[data-box-id],.cell[data-cell-id]';

function css(){if(document.getElementById('sv4css'))return;const st=document.createElement('style');st.id='sv4css';st.textContent=`

#viewContainer .sv-selected[data-sv-kind]::after{content:'✓';position:absolute;top:-7px;left:-7px;width:16px;height:16px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:100001;pointer-events:none}

function updateStatus(){const t=document.getElementById('storageVisualEditor');if(!t)return;const el=document.querySelector('#viewContainer .sv-selected');const n=el?(el.dataset.rackId?'رف/درج':el.dataset.colId?'عمود':el.dataset.boxId?'عبوة':'خلية'):'لا يوجد عنصر';const s=t.querySelector('.sv-status');if(s)s.textContent='العنصر: '+n;}

 const rack=document.querySelector('#viewContainer .rack-fullpage-wrap');const host=rack?rack.querySelector('.rack-head'):document.querySelector('#viewContainer .view-title');if(host)host.insertAdjacentElement(rack?'afterend':'afterend',t);return t;}
function addHandles(el){el.querySelectorAll(':scope > .sv-handle').forEach(x=>x.remove());if(mode!=='resize')return;['x','y','both'].forEach(type=>{const h=document.createElement('i');h.className='sv-handle sv-handle-'+type;h.dataset.resize=type;h.setAttribute('aria-label','تغيير الحجم');el.appendChild(h);});}

function moveSelected(dx,dy){const el=document.querySelector('#viewContainer .sv-selected');if(!el)return;if(mode!=='move')return;const k=key(el);if(!k)return;const v=val(el);v.dx=(v.dx||0)+dx;v.dy=(v.dy||0)+dy;layout[k]=v;apply(el);save();}
function init(){const vc=document.getElementById('viewContainer');if(!vc||typeof currentView==='undefined'||currentView!=='storage')return;css();const t=mountToolbar();t.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));t.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();e.stopPropagation();moveSelected(b.dataset.dir==='left'?-10:b.dataset.dir==='right'?10:0,b.dataset.dir==='up'?-10:b.dataset.dir==='down'?10:0);};});t.querySelector('[data-r]').onclick=()=>{const el=vc.querySelector('.sv-selected');if(!el){if(typeof toast==='function')toast('اختر عنصرًا أولًا');return;}delete layout[key(el)];apply(el);save();select(null);refresh();};t.querySelector('[data-ra]').onclick=()=>{if(!confirm('إعادة كل عناصر التخزين المرئي إلى أماكنها وأحجامها الأصلية؟'))return;layout={};save();all().forEach(el=>{el.style.transform='';});select(null);refresh();};
 refresh();setMode(mode);
 if(!vc.dataset.sv4Bound){vc.dataset.sv4Bound='1';let resizeDrag=null;
 vc.addEventListener('click',e=>{
   if(e.target.closest('#storageVisualEditor'))return;
   if(e.target.closest('button,input,select,textarea,a'))return;

 vc.addEventListener('pointerdown',e=>{if(e.button!==0)return;const handle=e.target.closest('.sv-handle');if(!handle||mode!=='resize')return;const el=handle.closest(SELECTOR);if(!el)return;const k=key(el),v=val(el),r=el.getBoundingClientRect();resizeDrag={el,k,type:handle.dataset.resize,px:e.clientX,py:e.clientY,sx:v.sx||1,sy:v.sy||1,w:r.width/(v.sx||1),h:r.height/(v.sy||1)};select(el);try{el.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();e.stopPropagation();},true);

 }

<script>
/* ================= STORAGE VISUAL EDITOR v5 ================= */
(function(){
'use strict';
const V5KEY='storageVisualLayout_v5';
let v5Layout={};
try{v5Layout=JSON.parse(localStorage.getItem(V5KEY)||'{}')||{};}catch(e){v5Layout={};}
const SEL='.rack-panel[data-rack-id],.rack-fullpage-wrap[data-rack-id],.rack-column[data-col-id],.vs3-full-column[data-col-id],.box-chip[data-box-id],.box-card[data-box-id],.vs3-full-book[data-box-id],.cell[data-cell-id]';
let v5Mode='move', v5Resize=null;

function v5Save(){try{localStorage.setItem(V5KEY,JSON.stringify(v5Layout));}catch(e){}}
function v5Key(el){
  if(el.dataset.rackId)return'rack:'+el.dataset.rackId;
  if(el.dataset.colId)return'col:'+el.dataset.colId;
  if(el.dataset.boxId)return'box:'+el.dataset.boxId;
  if(el.dataset.cellId)return'cell:'+el.dataset.cellId;
  return null;
}
function v5Val(el){return v5Layout[v5Key(el)]||{dx:0,dy:0,sx:1,sy:1};}
function v5All(){return [...document.querySelectorAll('#viewContainer '+SEL)];}
function v5Apply(el){
  const v=v5Layout[v5Key(el)];
  if(!v){el.style.transform='';return;}
  el.style.transform=`translate3d(${v.dx||0}px,${v.dy||0}px,0) scale(${v.sx||1},${v.sy||1})`;
  el.style.transformOrigin='top left';
}
function v5Selected(){return document.querySelector('#viewContainer .sv-selected');}
function v5Select(el){
  v5All().forEach(x=>x.classList.remove('sv-selected'));
  if(el)el.classList.add('sv-selected');
  v5UpdateToolbar();
}
function v5Type(el){
  if(!el)return'لا يوجد عنصر';
  return el.dataset.rackId?'رف / درج':el.dataset.colId?'عمود':el.dataset.boxId?'عبوة':'خلية';
}
function v5ScaleText(el){
  if(!el)return'100%';
  const v=v5Val(el);
  return `${Math.round((v.sx||1)*100)}% × ${Math.round((v.sy||1)*100)}%`;
}
function v5Step(){
  const el=document.querySelector('#sv5Step');
  return el?Math.max(1,Number(el.value)||10):10;
}
function v5Move(dx,dy){
  const el=v5Selected();if(!el)return;
  const k=v5Key(el);const v=v5Val(el);
  v.dx=(v.dx||0)+dx;v.dy=(v.dy||0)+dy;v5Layout[k]=v;v5Apply(el);v5Save();v5UpdateToolbar();
}
function v5Scale(dsx,dsy){
  const el=v5Selected();if(!el)return;
  const k=v5Key(el);const v=v5Val(el);
  v.sx=Math.max(.35,Math.min(3,(v.sx||1)+dsx));
  v.sy=Math.max(.35,Math.min(3,(v.sy||1)+dsy));
  v5Layout[k]=v;v5Apply(el);v5Save();v5UpdateToolbar();
}
function v5ResetSize(){
  const el=v5Selected();if(!el)return;
  const k=v5Key(el);const v=v5Val(el);
  v.sx=1;v.sy=1;v5Layout[k]=v;v5Apply(el);v5Save();v5UpdateToolbar();
}
function v5ResetAll(){
  if(!confirm('إعادة مواقع وأحجام عناصر المشهد كلها للوضع الأصلي؟'))return;
  v5Layout={};v5Save();v5All().forEach(el=>{el.style.transform='';});
  v5Select(null);v5Refresh();
}
function v5UpdateToolbar(){
  const t=document.getElementById('storageVisualEditor');if(!t)return;
  const el=v5Selected();
  const st=t.querySelector('.sv-status');if(st)st.textContent=el?`العنصر: ${v5Type(el)}`:'اختر رفًا أو عمودًا أو عبوة';
  const sc=t.querySelector('.sv-scale');if(sc)sc.textContent=v5ScaleText(el);
}
function v5AddHandles(el){
  el.querySelectorAll(':scope > .sv-handle').forEach(x=>x.remove());
  if(v5Mode!=='resize')return;
  ['x','y','both'].forEach(type=>{
    const h=document.createElement('i');
    h.className='sv-handle sv-handle-'+type;
    h.dataset.resize=type;
    el.appendChild(h);
  });
}
function v5Refresh(){v5All().forEach(el=>{v5Apply(el);v5AddHandles(el);});v5UpdateToolbar();}
function v5Toolbar(){
  let old=document.getElementById('storageVisualEditor');if(old)old.remove();
  const t=document.createElement('div');t.id='storageVisualEditor';
  t.innerHTML=`
    <span class="sv-title">🛠️ تحرير المشهد</span>
    <button class="btn small active" data-v5mode="move">↔ تحريك</button>
    <button class="btn small" data-v5mode="resize">⤢ تغيير الحجم</button>
    <span class="sv-status">اختر عنصرًا</span>
    <div class="sv-size-group">
      <span class="sv-size-label">الحجم</span>
      <button class="btn small sv-size-btn" data-v5size="minus" title="تصغير">−</button>
      <span class="sv-scale">100% × 100%</span>
      <button class="btn small sv-size-btn" data-v5size="plus" title="تكبير">＋</button>
      <button class="btn small sv-size-btn" data-v5size="reset" title="الحجم الأصلي">1:1</button>
    </div>
    <label class="sv-step">خطوة <input id="sv5Step" type="number" min="1" max="100" value="10" style="width:38px;background:transparent;color:inherit;border:0;text-align:center"></label>
    <button class="btn small sv-arrow" data-v5dir="up">▲</button>
    <button class="btn small sv-arrow" data-v5dir="left">◀</button>
    <button class="btn small sv-arrow" data-v5dir="down">▼</button>
    <button class="btn small sv-arrow" data-v5dir="right">▶</button>
    <button class="btn small" data-v5reset>↺ إعادة العنصر</button>
    <button class="btn small danger" data-v5resetall>🗑 إعادة الكل</button>
    <span class="sv-help">اختر عنصرًا ثم حرّكه بالأسهم أو كبّر/صغّر من أزرار الحجم. في وضع الحجم تظهر مقابض على العنصر.</span>`;
  const rack=document.querySelector('#viewContainer .rack-fullpage-wrap');
  const host=rack?.querySelector('.rack-head')||document.querySelector('#viewContainer .view-title');
  if(host)host.insertAdjacentElement('afterend',t);
  t.querySelectorAll('[data-v5mode]').forEach(b=>b.onclick=()=>{
    v5Mode=b.dataset.v5mode;
    t.querySelectorAll('[data-v5mode]').forEach(x=>x.classList.toggle('active',x===b));
    v5Refresh();
  });
  t.querySelectorAll('[data-v5dir]').forEach(b=>b.onclick=()=>{
    if(v5Mode!=='move'){v5Mode='move';t.querySelectorAll('[data-v5mode]').forEach(x=>x.classList.toggle('active',x.dataset.v5mode==='move'));v5Refresh();}
    const s=v5Step(),d=b.dataset.v5dir;
    v5Move(d==='left'?-s:d==='right'?s:0,d==='up'?-s:d==='down'?s:0);
  });
  t.querySelector('[data-v5size="minus"]').onclick=()=>v5Scale(-.05,-.05);
  t.querySelector('[data-v5size="plus"]').onclick=()=>v5Scale(.05,.05);
  t.querySelector('[data-v5size="reset"]').onclick=v5ResetSize;
  t.querySelector('[data-v5reset]').onclick=()=>{
    const el=v5Selected();if(!el){toast?.('اختر عنصرًا أولًا');return;}
    delete v5Layout[v5Key(el)];el.style.transform='';v5Save();v5Refresh();
  };
  t.querySelector('[data-v5resetall]').onclick=v5ResetAll;
  return t;
}
function v5Init(){
  const vc=document.getElementById('viewContainer');
  if(!vc||typeof currentView==='undefined'||currentView!=='storage')return;
  if(!document.getElementById('sv5css')){
    const st=document.createElement('style');st.id='sv5css';
    st.textContent=`
      #viewContainer.sv5-resize .sv-handle{display:block}
      #viewContainer.sv5-move .sv-handle{display:none}
      .sv-handle{position:absolute;z-index:100002;background:var(--amber);border:2px solid var(--amber-ink);box-sizing:border-box;touch-action:none;pointer-events:auto}
      .sv-handle-x{right:2px;top:50%;transform:translateY(-50%);width:11px;height:38px;border-radius:6px;cursor:ew-resize}
      .sv-handle-y{bottom:2px;left:50%;transform:translateX(-50%);width:38px;height:11px;border-radius:6px;cursor:ns-resize}
      .sv-handle-both{right:2px;bottom:2px;width:18px;height:18px;border-radius:5px;cursor:nwse-resize}
    `;
    document.head.appendChild(st);
  }
  v5Toolbar();v5Refresh();
  if(vc.dataset.v5Bound)return;
  vc.dataset.v5Bound='1';

  vc.addEventListener('click',e=>{
    if(e.target.closest('#storageVisualEditor'))return;
    if(e.target.closest('button,input,select,textarea,a'))return;
    const el=e.target.closest(SEL);if(!el||!vc.contains(el))return;
    v5Select(el);
  },true);

  vc.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const h=e.target.closest('.sv-handle');
    if(!h||v5Mode!=='resize')return;
    const el=h.closest(SEL);if(!el)return;
    const k=v5Key(el),v=v5Val(el),r=el.getBoundingClientRect();
    v5Resize={el,k,type:h.dataset.resize,px:e.clientX,py:e.clientY,
      sx:v.sx||1,sy:v.sy||1,w:r.width/(v.sx||1),h:r.height/(v.sy||1)};
    v5Select(el);
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();e.stopPropagation();
  },true);

  vc.addEventListener('pointermove',e=>{
    if(!v5Resize)return;
    const d=v5Resize,dx=e.clientX-d.px,dy=e.clientY-d.py;
    let sx=d.sx,sy=d.sy;
    if(d.type==='x'||d.type==='both')sx=Math.max(.35,Math.min(3,d.sx+dx/d.w));
    if(d.type==='y'||d.type==='both')sy=Math.max(.35,Math.min(3,d.sy+dy/d.h));
    v5Layout[d.k]={...v5Val(d.el),sx,sy};v5Apply(d.el);v5UpdateToolbar();
    e.preventDefault();
  },true);

  const finish=()=>{if(v5Resize){v5Save();v5Resize=null;}};
  vc.addEventListener('pointerup',finish,true);
  vc.addEventListener('pointercancel',finish,true);
}
const oldShow=window.showView;
if(typeof oldShow==='function'){
  window.showView=function(v){oldShow(v);if(v==='storage')requestAnimationFrame(()=>requestAnimationFrame(v5Init));};
}
window.initStorageVisualEditorV5=v5Init;
setTimeout(v5Init,120);
})();
</script>

<script id="category-search-state-bridge">
(function(){
  try{
    if(!window.getWorkshopState){
      window.getWorkshopState=function(){
        try{ if(typeof state!=='undefined' && state) return state; }catch(e){}
        return window.state||null;
      };
    }
  }catch(e){}
})();
</script>
<script id="advanced-cell-search-js">
(function(){
  /* بحث هرمي: الفئة ← المواصفة ← قيمة المواصفة */
  const labels={
    price:'السعر',current:'التيار',voltage:'الجهد',size:'الحجم',package:'الباكديج',
    type:'النوع',power:'القدرة',manufacturer:'الشركة',model:'الموديل',description:'الوصف'
  };
  // state الرئيسي معرف بـ let داخل التطبيق وليس كـ window.state.
  // نقرأه مباشرةً مع fallback حتى يكون البحث مرتبطًا بنفس قاعدة البيانات.
  function appState(){
    try{
      if(typeof state!=='undefined' && state) return state;
    }catch(e){}
    return window.state||{};
  }

  const builtinDefs=[
    {key:'price',label:'السعر',type:'number'},
    {key:'current',label:'التيار',type:'text'},
    {key:'voltage',label:'الجهد',type:'text'},
    {key:'size',label:'الحجم',type:'text'},
    {key:'package',label:'الباكديج',type:'text'},
    {key:'type',label:'النوع',type:'text'},
    {key:'power',label:'القدرة',type:'text'},
    {key:'manufacturer',label:'الشركة',type:'text'},
    {key:'model',label:'الموديل',type:'text'},
    {key:'description',label:'الوصف',type:'text'}
  ];

  function norm(v){
    return String(v??'').trim().toLowerCase()
      .replace(/أ|إ|آ/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
      .replace(/٫/g,'.').replace(/،/g,',');
  }
  function categoryDefs(category){
    const s=appState();
    const schema=s.categorySchemas?.[category];
    if(!schema) return [];
    // البحث يعرض مجموعتين منفصلتين:
    // 1) حقول بيانات المكون التي تديرها الفئة
    // 2) مواصفات الفئة
    const fields=Array.isArray(schema.fields)
      ? schema.fields.map(f=>({...f, __source:'field', __key:String(f.key||''), key:'field:'+String(f.key||'')}))
      : [];
    const specs=Array.isArray(schema.specs)
      ? schema.specs.map(f=>({...f, __source:'spec', __key:String(f.key||''), key:'spec:'+String(f.key||'')}))
      : [];
    return fields.concat(specs).filter(d=>d.__key);
  }
  function allCategories(){
    const s=appState();
    return Array.isArray(s.categories)?s.categories:[];
  }
  function getCategorySpecValue(comp,spec){
    if(!comp||!spec)return '';
    const key=String(spec.__key||spec.key||'');
    const source=spec.__source || (key.startsWith('field:')?'field':'spec');
    const cleanKey=key.replace(/^(field|spec):/,'');

    if(source==='field'){
      // نفس مصدر البيانات المستخدم في نموذج «حقول الفئة».
      if(typeof getCategoryFieldValue==='function'){
        const v=getCategoryFieldValue(comp,{...spec,key:cleanKey});
        // لا نستخدم القيمة الافتراضية للفئة كأنها قيمة فعلية للمكون.
        const direct=comp[cleanKey]!==undefined && comp[cleanKey]!==null ? comp[cleanKey] : undefined;
        const custom=comp.customFields?.[cleanKey];
        if(direct!==undefined && String(direct)!=='') return direct;
        if(custom!==undefined && custom!==null && String(custom)!=='') return custom;
      }
      if(comp[cleanKey]!==undefined && comp[cleanKey]!==null && String(comp[cleanKey])!=='') return comp[cleanKey];
      if(comp.customFields && Object.prototype.hasOwnProperty.call(comp.customFields,cleanKey)){
        return comp.customFields[cleanKey] ?? '';
      }
      return '';
    }

    const real={voltage:'voltage',current:'current',power:'power',package:'package'}[cleanKey];
    if(real && comp[real]!==undefined && comp[real]!==null && comp[real]!=='') return comp[real];
    if(comp.customSpecs && Object.prototype.hasOwnProperty.call(comp.customSpecs,cleanKey)){
      const v=comp.customSpecs[cleanKey];
      if(v!==undefined && v!==null && String(v)!=='') return v;
    }

    // توافق مع البيانات القديمة لمواصفات الفئة.
    const label=norm(spec.label||cleanKey);
    if(/نوع|type|ترانزستور|channel/.test(label)) return comp.subcategory||comp.type||comp.value||'';
    if(/جهد|voltage|volt/.test(label)) return comp.voltage||'';
    if(/تيار|current|amp|امبير|أمبير/.test(label)) return comp.current||'';
    if(/قدره|قدرة|power|watt|وات/.test(label)) return comp.power||'';
    if(/حزمه|حزمة|package|pack|باكدج/.test(label)) return comp.package||'';
    if(/سعر|price/.test(label)) return comp.purchasePrice??'';
    if(/شركة|مصنع|manufacturer|supplier|مورد/.test(label)) return comp.manufacturer||comp.supplier||'';
    if(/موديل|model|part|قطعه|قطعة|رقم/.test(label)) return comp.partNumber||'';
    if(/قيمه|قيمة|value/.test(label)) return comp.value||'';
    if(/وصف|ملاحظ|description|notes/.test(label)) return comp.notes||'';
    return '';
  }
  function getSelectedSpec(){
    const cat=document.getElementById('acsCategory')?.value||'';
    const key=document.getElementById('acsField')?.value||'';
    const defs=cat ? categoryDefs(cat) : builtinDefs.map(d=>({...d,__source:'field',__key:d.key}));
    return defs.find(d=>d.key===key)||null;
  }
  function refreshSpecSelect(){
    const cat=document.getElementById('acsCategory');
    const sel=document.getElementById('acsField');
    const q=document.getElementById('acsQuery');
    if(!cat||!sel)return;
    const old=sel.value;
    let defs=[];
    if(cat.value){
      defs=categoryDefs(cat.value);
    }else{
      defs=builtinDefs;
    }
    if(cat.value){
      const fields=defs.filter(d=>d.__source==='field');
      const specs=defs.filter(d=>d.__source==='spec');
      const optionHtml=d=>`<option value="${String(d.key).replace(/"/g,'&quot;')}">${String(d.label||d.__key||d.key).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</option>`;
      sel.innerHTML='<option value="">— اختر الحقل أو المواصفة —</option>'+
        (fields.length?`<optgroup label="حقول بيانات المكون">${fields.map(optionHtml).join('')}</optgroup>`:'')+
        (specs.length?`<optgroup label="مواصفات الفئة">${specs.map(optionHtml).join('')}</optgroup>`:'');
    }else{
      sel.innerHTML='<option value="">— اختر الحقل —</option>'+
        defs.map(d=>`<option value="${String(d.key).replace(/"/g,'&quot;')}">${String(d.label||d.key).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</option>`).join('');
    }
    if([...sel.options].some(o=>o.value===old)) sel.value=old;
    if(q){
      const spec=getSelectedSpec();
      q.placeholder=spec?.type==='select' ? 'اكتب/اختر قيمة الحقل أو المواصفة...' :
        (cat.value ? `ابحث في «${spec?.label||'الحقل أو المواصفة'}» فقط...` : 'اختر الفئة ثم الحقل ثم اكتب القيمة...');
    }
    updateValueChoices();
  }
  function updateValueChoices(){
    const wrap=document.getElementById('acsValueChoices');
    const q=document.getElementById('acsQuery');
    if(!wrap||!q)return;
    const spec=getSelectedSpec();
    const opts=spec ? normalizeCategorySpecOptions(spec.options) : [];
    if(!spec || !opts.length){
      wrap.innerHTML='';
      return;
    }
    wrap.innerHTML=opts.map(o=>{
      const safe=String(o).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      return `<button type="button" class="acs-value-chip" data-value="${safe}">${safe}</button>`;
    }).join('');
    wrap.querySelectorAll('[data-value]').forEach(btn=>btn.onclick=()=>{
      q.value=btn.dataset.value||'';
      wrap.querySelectorAll('.acs-value-chip').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      showSearchSuggestions();
      search();
    });
  }
  function getSearchableComponents(){
    const s=appState();
    return Array.isArray(s.components)?s.components:[];
  }
  function componentLocationText(comp){
    const s=appState();
    const cells=getStorageCells().filter(c=>componentOf(c)?.id===comp.id);
    if(!cells.length)return 'غير موجود حاليًا في الخلايا';
    const locs=cells.slice(0,3).map(c=>{
      const loc=cellLocation(c);
      const rn=loc.rack?.name||'رف';
      const cn=loc.col?.name||'عمود';
      const bn=loc.box?.label||'عبوة';
      const ix=Number.isFinite(Number(c.index))?`خلية ${Number(c.index)+1}`:'خلية';
      return `${rn} › ${cn} › ${bn} › ${ix}`;
    });
    return locs.join(' · ')+(cells.length>3?` · +${cells.length-3}`:'');
  }
  function suggestionText(comp,spec){
    const raw=getCategorySpecValue(comp,spec);
    const name=comp.name||comp.partNumber||'مكون';
    const part=comp.partNumber && comp.partNumber!==name ? ` · ${comp.partNumber}`:'';
    const val=raw!==''?` · ${raw}`:'';
    const source=spec?.__source==='field'?'حقل بيانات المكون':'مواصفة الفئة';
    return `${name}${part} · ${source}: ${spec?.label||spec?.__key||''}${val}`;
  }
  function showSearchSuggestions(){
    const box=document.getElementById('acsSuggestions');
    const q=document.getElementById('acsQuery');
    const cat=document.getElementById('acsCategory')?.value||'';
    const spec=getSelectedSpec();
    if(!box||!q||!cat||!spec){if(box)box.innerHTML='';return;}
    const query=norm(q.value);
    if(!query){box.innerHTML='';return;}
    const comps=getSearchableComponents().filter(c=>{
      // التلميحات تخص الفئة المحددة والحقل/المواصفة المحددة فقط.
      if(norm(c.category)!==norm(cat))return false;
      const raw=getCategorySpecValue(c,spec);
      if(raw===undefined || raw===null || String(raw).trim()==='')return false;
      // لا نبحث في اسم المكون أو باقي المواصفات؛ فقط في الحقل الذي اختاره المستخدم.
      return !query || norm(raw).includes(query);
    });
    if(!comps.length){box.innerHTML='';return;}
    const unique=[];
    const seen=new Set();
    comps.forEach(c=>{
      const key=String(c.id);
      if(!seen.has(key)){seen.add(key);unique.push(c);}
    });
    box.innerHTML=unique.slice(0,8).map(c=>{
      const id=String(c.id).replace(/"/g,'&quot;');
      const title=escapeHtml(suggestionText(c,spec));
      const loc=escapeHtml(componentLocationText(c));
      // نربط الاقتراح بأول خلية فعلية للمكون حتى الضغط على الاقتراح
      // يفتح نفس موقع هذا المكون بالضبط، ولا يعيد البحث عن القيمة فقط.
      const targetCell=getStorageCells().find(cell=>String(cell.componentId||cell.component_id||cell.component)===String(c.id));
      const cellId=targetCell ? String(targetCell.id).replace(/"/g,'&quot;') : '';
      return `<button type="button" class="acs-suggestion" data-comp-id="${id}" data-cell-id="${cellId}">
        <span class="acs-suggestion-title">${title}</span>
        <span class="acs-suggestion-loc">${loc}</span>
      </button>`;
    }).join('');
    box.querySelectorAll('[data-comp-id]').forEach(btn=>{
      btn.onclick=()=>{
        const comp=getSearchableComponents().find(c=>String(c.id)===String(btn.dataset.compId));
        if(!comp)return;
        const raw=getCategorySpecValue(comp,spec);
        q.value=String(raw||comp.name||comp.partNumber||'');
        box.innerHTML='';

        // مهم: لا نعيد تشغيل search() هنا، لأن ذلك قد يأخذ أول مكون
        // يطابق نفس القيمة بدل المكون الذي اختاره المستخدم.
        // ننتقل مباشرةً إلى خلية الاقتراح المحددة.
        const targetCellId=btn.dataset.cellId||'';
        if(targetCellId){
          rememberSearch(cat.value, document.getElementById('acsField')?.value||'', q.value, spec);
          clearMarks();
          if(typeof revealAndFlash==='function'){
            revealAndFlash(targetCellId);
            const result=document.getElementById('acsResult');
            setTimeout(()=>{
              if(result) result.innerHTML=`تم الانتقال إلى <b>${escapeHtml(comp.name||comp.partNumber||'المكون')}</b> — <b>${escapeHtml(locationLabel(targetCellId))}</b>`;
            },1250);
          }else{
            const cell=findCell(targetCellId);
            if(cell) applyHighlights(new Set([String(targetCellId)]),targetCellId);
          }
        }else{
          // المكون قد لا يكون مخزنًا في خلية حاليًا؛ عندها نستخدم البحث المعتاد.
          search();
        }
      };
    });
  }
  function escapeHtml(v){
    return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function populateCategories(){
    const sel=document.getElementById('acsCategory');
    if(!sel)return;
    const old=sel.value;
    const cats=allCategories();
    sel.innerHTML='<option value="">— كل الفئات —</option>'+
      cats.map(c=>`<option value="${String(c).replace(/"/g,'&quot;')}">${String(c).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</option>`).join('');
    if(cats.includes(old))sel.value=old;
    refreshSpecSelect();
  }

  function parseNumber(v){
    const m=norm(v).replace(/,/g,'.').match(/-?\d+(?:\.\d+)?/);
    return m?Number(m[0]):NaN;
  }
  function valueMatches(raw,query){
    if(raw===undefined||raw===null||String(raw)==='')return false;
    const a=norm(raw), b=norm(query);
    if(!b)return false;
    const an=parseNumber(raw), bn=parseNumber(query);
    if(!Number.isNaN(an)&&!Number.isNaN(bn) &&
       /^(price|current|voltage|size|power)$/.test(document.getElementById('acsField')?.value||'')){
      if(an===bn)return true;
    }
    return a.includes(b);
  }
  function getStorageCells(){
    const s=appState();
    if(Array.isArray(s.containers))return s.containers;
    if(Array.isArray(s.cells))return s.cells;
    return [];
  }
  function componentOf(cell){
    const s=appState();
    const id=cell?.componentId||cell?.component_id||cell?.component;
    return id ? (s.components||[]).find(c=>c.id===id)||null : null;
  }
  function matchesCell(cell,category,spec,query){
    const comp=componentOf(cell);
    if(!comp)return false;
    if(category && norm(comp.category)!==norm(category))return false;
    if(!spec)return false;
    const raw=getCategorySpecValue(comp,spec);
    return valueMatches(raw,query);
  }
  function getCellElements(){
    const root=document.querySelector('#viewContainer');
    if(!root)return [];
    return [...root.querySelectorAll('.cell[data-cell-id]')];
  }
  function clearMarks(){
    document.querySelectorAll('#viewContainer .cell[data-cell-id]').forEach(el=>{
      el.classList.remove('acs-match','acs-dim','acs-search-target');
    });
  }
  function cellLocation(cell){
    const s=appState();
    const box=s.boxes?.find(b=>b.id===cell.boxId);
    const col=box ? s.columns?.find(c=>c.id===box.columnId) : null;
    const rack=col ? (s.racks||[]).find(r=>r.id===col.rackId) : null;
    return {box,col,rack};
  }
  function rememberSearch(category,field,query,spec){
    window.__acsLastSearch={category,field,query,specKey:spec?.key||''};
  }
  function restoreSearchUI(){
    const last=window.__acsLastSearch;
    if(!last)return;
    const c=document.getElementById('acsCategory');
    const f=document.getElementById('acsField');
    const q=document.getElementById('acsQuery');
    if(c && [...c.options].some(o=>o.value===last.category)) c.value=last.category;
    refreshSpecSelect();
    if(f && [...f.options].some(o=>o.value===last.field)) f.value=last.field;
    if(q)q.value=last.query;
    updateValueChoices();
  }
  function applyHighlights(ids,scrollId){
    const els=getCellElements();
    let count=0, target=null;
    els.forEach(el=>{
      const id=String(el.dataset.cellId||'');
      if(ids.has(id)){
        el.classList.add('acs-match'); count++;
        if(id===String(scrollId)) target=el;
      }else{
        el.classList.add('acs-dim');
      }
    });
    if(target){
      target.classList.add('acs-search-target');
      setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'center',inline:'center'}),80);
      setTimeout(()=>target.classList.remove('acs-search-target'),1800);
    }
    return count;
  }
  function navigateToFirstMatch(matchCells,category,field,query,spec){
    if(!matchCells.length)return;
    const first=matchCells[0];
    const loc=cellLocation(first);
    rememberSearch(category,field,query,spec);

    // استخدم مسار التنقل الموحد الموجود في البرنامج نفسه.
    // هذا المسار يفتح الرف + يحدد العبوة + يعيد الرسم + يصل للخلية
    // ويعمل وميضًا عليها، بدل الاكتفاء بتظليل نتائج البحث داخل لوحة البحث.
    if(typeof revealAndFlash==='function' && loc.rack){
      revealAndFlash(first.id);
      setTimeout(()=>{
        const result=document.getElementById('acsResult');
        if(result){
          result.innerHTML=`تم العثور على <b>${matchCells.length}</b> خلية مطابقة — `+
            `تم الانتقال إلى: <b>${locationLabel(first.id)}</b>`+
            (matchCells.length>1?` · عدد النتائج: <b>${matchCells.length}</b>`:'');
        }
      },1250);
      return;
    }

    // احتياطي في حالة وجود نتيجة غير مرتبطة برف.
    applyHighlights(new Set(matchCells.map(c=>String(c.id))),first.id);
  }
  function search(){
    const category=document.getElementById('acsCategory')?.value||'';
    const field=document.getElementById('acsField')?.value||'';
    const query=document.getElementById('acsQuery')?.value?.trim()||'';
    const result=document.getElementById('acsResult');
    const spec=getSelectedSpec();
    clearMarks();

    if(!category){
      if(result)result.textContent='اختر الفئة أولًا.';
      return;
    }
    if(!field||!spec){
      if(result)result.textContent='اختر المواصفة المطلوبة لهذه الفئة.';
      return;
    }
    if(!query){
      if(result)result.textContent='اكتب قيمة المواصفة التي تريد البحث عنها.';
      return;
    }

    const cells=getStorageCells().filter(c=>c && (c.componentId||c.component_id||c.component));
    const matches=cells.filter(cell=>matchesCell(cell,category,spec,query));

    rememberSearch(category,field,query,spec);

    if(!matches.length){
      if(result){
        result.innerHTML=`لا توجد نتائج للفئة <b>${category}</b> والمواصفة <b>${spec.label||spec.key}</b> بالقيمة <b>${query}</b>.`;
      }
      return;
    }

    // في كل الحالات انتقل فعليًا إلى أول خلية مطابقة، حتى لو كان الرف
    // الحالي مفتوحًا؛ يجب أيضًا اختيار العبوة الصحيحة وإظهار محتواها.
    navigateToFirstMatch(matches,category,field,query,spec);
  }
  function clearSearch(){
    window.__acsLastSearch=null;
    const q=document.getElementById('acsQuery'); if(q)q.value='';
    const r=document.getElementById('acsResult'); if(r)r.textContent='';
    const sg=document.getElementById('acsSuggestions'); if(sg)sg.innerHTML='';
    const f=document.getElementById('acsField'); if(f)f.value='';
    const c=document.getElementById('acsCategory'); if(c)c.value='';
    clearMarks();
    refreshSpecSelect();
  }

  window.acsSearch=search;
  window.acsClear=clearSearch;

  function mount(){
    const vc=document.querySelector('#viewContainer');
    if(!vc)return;
    let box=document.getElementById('advancedCellSearch');
    if(!box){
      box=document.createElement('div');
      box.id='advancedCellSearch';
      box.className='advanced-cell-search';
      box.innerHTML=`
        <div class="acs-top">
          <span class="acs-label">🔎 بحث متقدم</span>
          <select id="acsCategory" aria-label="الفئة">
            <option value="">— الفئة —</option>
          </select>
          <select id="acsField" aria-label="حقل بيانات المكون أو مواصفة الفئة">
            <option value="">— المواصفة —</option>
          </select>
          <div class="acs-query-wrap">
            <input id="acsQuery" placeholder="اختر الفئة ثم المواصفة ثم اكتب القيمة..." autocomplete="off">
            <div id="acsSuggestions" class="acs-suggestions"></div>
          </div>
          <button class="btn small primary" type="button" id="acsRun">بحث</button>
          <button class="btn small" type="button" id="acsClear">مسح</button>
        </div>
        <div id="acsValueChoices" class="acs-value-choices"></div>
        <div class="acs-help">حدد الفئة، ثم اختر إحدى مواصفاتها، ثم اكتب القيمة المطلوبة. سيتم تمييز الخلايا المطابقة وإخفاء/تعتيم غير المطابق.</div>
        <div id="acsResult" class="acs-result"></div>`;
      const target=vc.querySelector('.rack-fullpage-wrap,.rack-panel,.storage-view,.storage-dashboard')||vc.firstElementChild;
      if(target)target.parentNode.insertBefore(box,target);
      else vc.prepend(box);

      document.getElementById('acsCategory').addEventListener('change',()=>{
        document.getElementById('acsField').value='';
        document.getElementById('acsQuery').value='';
        clearMarks();
        const sg=document.getElementById('acsSuggestions');if(sg)sg.innerHTML='';
        refreshSpecSelect();
      });
      document.getElementById('acsField').addEventListener('change',()=>{
        document.getElementById('acsQuery').value='';
        const sg=document.getElementById('acsSuggestions');if(sg)sg.innerHTML='';
        updateValueChoices();
      });
      document.getElementById('acsRun').onclick=search;
      document.getElementById('acsClear').onclick=clearSearch;
      document.getElementById('acsQuery').addEventListener('input',()=>showSearchSuggestions());
      document.getElementById('acsQuery').addEventListener('focus',()=>showSearchSuggestions());
      document.getElementById('acsQuery').addEventListener('keydown',e=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const first=document.querySelector('#acsSuggestions [data-comp-id]');
          if(first && document.getElementById('acsQuery').value.trim()) first.click();
          else search();
        }
      });
      document.addEventListener('click',e=>{
        const box=document.getElementById('advancedCellSearch');
        const sg=document.getElementById('acsSuggestions');
        if(box&&sg&&!box.contains(e.target))sg.innerHTML='';
      });
    }
    populateCategories();
    restoreSearchUI();
  }

  const oldShow=window.showView;
  if(typeof oldShow==='function'){
    window.showView=function(v){
      oldShow(v);
      if(v==='storage')setTimeout(mount,30);
    };
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(mount,60));
  setTimeout(mount,250);
})();
</script>

<script id="item-specs-editor-js">
(function(){
  const SPEC_KEY='workshop_custom_cell_specs_v1';
  const BASE_EXTRA_SPECS=[
    {key:'power',label:'القدرة (Power)',real:'power'},
    {key:'tolerance',label:'التفاوت (Tolerance)',real:'tolerance'},
    {key:'frequency',label:'التردد (Frequency)',real:'frequency'}
  ];
  function loadRegistry(){
    try{
      const x=JSON.parse(localStorage.getItem(SPEC_KEY)||'[]');
      return Array.isArray(x)?x.filter(s=>s&&s.key&&s.label):[];
    }catch(e){return [];}
  }
  function saveRegistry(a){ try{localStorage.setItem(SPEC_KEY,JSON.stringify(a));}catch(e){} }
  function makeKey(s){
    return 'custom_'+String(s).trim().toLowerCase().replace(/\s+/g,'_').replace(/[^\w\u0600-\u06ff-]/g,'_').slice(0,50);
  }
  function allSpecDefs(){
    return BASE_EXTRA_SPECS.map(f=>({key:f.key,label:f.label,real:f.real,builtin:true}))
      .concat(loadRegistry().map(s=>({key:s.key,label:s.label,real:null,builtin:false})));
  }
  function addSpecDefinition(label,example){
    label=String(label||'').trim();
    if(!label) return null;
    const k=makeKey(label);
    const built=BASE_EXTRA_SPECS.map(f=>f.key);
    const reg=loadRegistry();
    if(built.includes(k)||reg.some(s=>s.key===k)) return k;
    reg.push({key:k,label,example:String(example||'').trim()});
    saveRegistry(reg);
    if(typeof window.refreshSpecSearchField==='function') window.refreshSpecSearchField();
    return k;
  }
  function removeSpecDefinition(key){
    saveRegistry(loadRegistry().filter(s=>s.key!==key));
    const list=(window.state&&Array.isArray(window.state.components))?window.state.components:[];
    list.forEach(c=>{
      if(c.customSpecs) delete c.customSpecs[key];
      if(Array.isArray(c.enabledSpecs)) c.enabledSpecs=c.enabledSpecs.filter(k=>k!==key);
    });
    if(typeof scheduleSave==='function') scheduleSave();
    if(typeof window.refreshSpecSearchField==='function') window.refreshSpecSearchField();
  }
  function getSpecValue(obj,def){
    if(def.real) return obj[def.real]||'';
    return (obj.customSpecs&&obj.customSpecs[def.key])||'';
  }
  function setSpecValue(obj,def,val){
    if(def.real){ obj[def.real]=val; return; }
    if(!obj.customSpecs) obj.customSpecs={};
    obj.customSpecs[def.key]=val;
  }
  function esc(v){ return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  window.getSpecRegistry=loadRegistry;
  window.allSpecDefs=allSpecDefs;
  window.addSpecDefinition=addSpecDefinition;
  window.removeSpecDefinition=removeSpecDefinition;
  window.getSpecValue=getSpecValue;

  window.renderSpecsEditor=function(targetObj,container,onChange){
    if(!container) return;
    if(!targetObj.customSpecs) targetObj.customSpecs={};
    if(!Array.isArray(targetObj.enabledSpecs)) targetObj.enabledSpecs=[];
    const defs=allSpecDefs();
    const rows=defs.map(def=>{
      const enabled=targetObj.enabledSpecs.includes(def.key);
      const val=getSpecValue(targetObj,def);
      return `<div class="spec-editor-row" data-spec-row="${def.key}">
        <label class="check-row"><input type="checkbox" data-spec-toggle="${def.key}" ${enabled?'checked':''}><span>${esc(def.label)}</span></label>
        <input type="text" data-spec-value="${def.key}" value="${esc(val)}" placeholder="القيمة" style="display:${enabled?'block':'none'}">
        ${def.builtin?'':`<button type="button" class="del-spec-btn" data-del-spec="${def.key}" title="حذف هذه المواصفة نهائيًا من النظام">🗑</button>`}
      </div>`;
    }).join('');
    container.innerHTML=`<div class="spec-editor-box">
      <div class="spec-editor-title">⚙️ مواصفات إضافية</div>
      <div class="spec-editor-sub">حدد أي بيانات تنطبق على هذا العنصر — تقدر تضيف مواصفة جديدة زي "السعة" أو أي حاجة تانية</div>
      <div class="spec-editor-list">${rows||''}</div>
      <div class="spec-editor-add">
        <input type="text" class="new-spec-label" placeholder="اسم مواصفة جديدة: السعة">
        <input type="text" class="new-spec-example" placeholder="مثال: 1000mAh">
        <button type="button" class="btn small add-spec-btn">＋ إضافة</button>
      </div>
    </div>`;
    function fire(){ if(typeof onChange==='function') onChange(); }
    container.querySelectorAll('[data-spec-toggle]').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const key=cb.dataset.specToggle;
        const row=container.querySelector(`[data-spec-row="${key}"]`);
        const input=row?row.querySelector('[data-spec-value]'):null;
        if(cb.checked){
          if(!targetObj.enabledSpecs.includes(key)) targetObj.enabledSpecs.push(key);
          if(input) input.style.display='block';
        }else{
          targetObj.enabledSpecs=targetObj.enabledSpecs.filter(k=>k!==key);
          if(input) input.style.display='none';
        }
        fire();
      });
    });
    container.querySelectorAll('[data-spec-value]').forEach(inp=>{
      inp.addEventListener('input',()=>{
        const key=inp.dataset.specValue;
        const def=defs.find(d=>d.key===key);
        if(def) setSpecValue(targetObj,def,inp.value);
        fire();
      });
    });
    container.querySelectorAll('[data-del-spec]').forEach(btn=>{
      btn.onclick=()=>{
        if(!confirm('حذف هذه المواصفة نهائيًا من كل العناصر؟')) return;
        removeSpecDefinition(btn.dataset.delSpec);
        window.renderSpecsEditor(targetObj,container,onChange);
      };
    });
    const addBtn=container.querySelector('.add-spec-btn');
    if(addBtn) addBtn.onclick=()=>{
      const l=container.querySelector('.new-spec-label');
      const e=container.querySelector('.new-spec-example');
      const label=l.value.trim();
      if(!label){ if(typeof toast==='function') toast('اكتب اسم المواصفة'); else alert('اكتب اسم المواصفة'); return; }
      const key=addSpecDefinition(label,e.value);
      if(key && !targetObj.enabledSpecs.includes(key)) targetObj.enabledSpecs.push(key);
      fire();
      window.renderSpecsEditor(targetObj,container,onChange);
    };
  };

  window.enabledSpecsHTML=function(comp){
    if(!comp||!Array.isArray(comp.enabledSpecs)||!comp.enabledSpecs.length) return '';
    const defs=allSpecDefs();
    const rows=comp.enabledSpecs.map(key=>{
      const def=defs.find(d=>d.key===key);
      if(!def) return '';
      const val=getSpecValue(comp,def);
      if(!val) return '';
      return `<div class="esv-row"><span>${esc(def.label)}</span><b>${esc(val)}</b></div>`;
    }).filter(Boolean).join('');
    if(!rows) return '';
    return `<div class="enabled-specs-view">${rows}</div>`;
  };
})();
</script>

<script id="custom-specs-js">
(function(){
/*
  متوافق مع نظام الفئات:
  هذا الجزء يحتفظ بالمواصفات القديمة المضافة من البحث، لكنه لا يعيد بناء
  #acsField ولا يحذف مواصفات الفئة. مصدر مواصفات البحث الأساسي هو
  state.categorySchemas[category].specs.
*/
const KEY='workshop_custom_cell_specs_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function key(s){return 'custom_'+String(s).trim().toLowerCase().replace(/\s+/g,'_').replace(/[^\w\u0600-\u06ff-]/g,'_').slice(0,50)}
function render(){
 const r=document.querySelector('.custom-spec-list');if(!r)return;
 const a=load();
 r.innerHTML=a.length?a.map(s=>'<span class="custom-spec-item">'+String(s.label).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))+' <button type="button" data-del="'+s.key+'">×</button></span>').join(''):'<span style="font-size:8px;color:#887e75">لا توجد مواصفات إضافية قديمة</span>';
 r.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
   save(load().filter(s=>s.key!==b.dataset.del)); render();
 });
}
function add(){
 const l=document.getElementById('customSpecLabel'),e=document.getElementById('customSpecExample');
 if(!l)return;
 const label=l.value.trim(); if(!label)return alert('اكتب اسم المواصفة');
 const k=key(label),a=load();
 if(a.some(s=>s.key===k))return alert('المواصفة موجودة بالفعل');
 a.push({key:k,label:label,example:e?.value.trim()||''});save(a);
 l.value=''; if(e)e.value=''; render();
}
function mount(){
 const box=document.getElementById('advancedCellSearch');
 if(!box||document.getElementById('customSpecsArea'))return;
 const d=document.createElement('div');d.id='customSpecsArea';d.className='custom-specs-box';
 d.innerHTML='<div class="custom-specs-head"><b>⚙️ إضافة مواصفة إضافية</b><span style="font-size:8px;color:#8f867d">المواصفات الأساسية الخاصة بكل فئة يتم إدارتها من صفحة «الفئات والمواصفات».</span></div><div class="custom-spec-list"></div><div class="custom-spec-add"><input id="customSpecLabel" placeholder="اسم المواصفة: التردد"><input id="customSpecExample" placeholder="مثال: 50Hz"><button class="btn small" id="customSpecAdd">＋ إضافة</button></div>';
 box.appendChild(d);
 document.getElementById('customSpecAdd').onclick=add; render();
}
const old=window.showView;
if(typeof old==='function')window.showView=function(v){old(v);if(v==='storage')setTimeout(mount,50)};
document.addEventListener('DOMContentLoaded',()=>setTimeout(mount,80));setTimeout(mount,300);
window.getCustomCellSpecs=load;
})();
</script>

<script id="toggle-specs-js">
(function(){
  const KEY='workshop_custom_cell_specs_v1';

  function load(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||'[]');
      return Array.isArray(x)?x.filter(s=>s&&s.key&&s.label):[];
    }catch(e){return[]}
  }
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  function makeKey(s){
    return 'custom_'+String(s).trim().toLowerCase()
      .replace(/\s+/g,'_').replace(/[^\w\u0600-\u06ff-]/g,'_').slice(0,50);
  }

  function refreshSelect(){
    const sel=document.getElementById('acsField'); if(!sel)return;
    const old=sel.value;
    const base=[
      ['price','السعر'],['current','التيار'],['voltage','الجهد'],
      ['size','الحجم'],['package','الباكديج'],['type','النوع'],
      ['power','القدرة'],['manufacturer','الشركة'],['model','الموديل'],
      ['description','الوصف']
    ];
    sel.innerHTML=base.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
    load().forEach(s=>sel.insertAdjacentHTML('beforeend',`<option value="${s.key}">${s.label}</option>`));
    if([...sel.options].some(o=>o.value===old))sel.value=old;
  }
  window.refreshSpecSearchField=refreshSelect;

  function render(){
    const list=document.querySelector('#advancedCellSearch .custom-spec-list');
    if(!list)return;
    const a=load();
    list.innerHTML=a.length
      ? a.map(s=>`<button type="button" class="custom-spec-item" data-spec-key="${s.key}">
          <span class="spec-toggle-dot"></span><span>${s.label}</span>
        </button>`).join('')
      : '<span style="font-size:8px;color:#887e75">لا توجد مواصفات مخصصة</span>';

    list.querySelectorAll('[data-spec-key]').forEach(btn=>{
      btn.onclick=()=>{
        list.querySelectorAll('.custom-spec-item').forEach(x=>x.classList.remove('active'));
        btn.classList.add('active');
        const sel=document.getElementById('acsField');
        if(sel){sel.value=btn.dataset.specKey;sel.dispatchEvent(new Event('change',{bubbles:true}));}
        const q=document.getElementById('acsQuery');if(q)q.focus();
      };
    });
  }

  function add(){
    const l=document.getElementById('customSpecLabel');
    const e=document.getElementById('customSpecExample');
    const label=l?.value.trim();
    if(!label){alert('اكتب اسم المواصفة أولاً');return}
    const k=makeKey(label), a=load();
    const built=['price','current','voltage','size','package','type','power','manufacturer','model','description'];
    if(built.includes(k)||a.some(s=>s.key===k)){alert('هذه المواصفة موجودة بالفعل');return}
    a.push({key:k,label,example:e?.value.trim()||''});
    save(a);
    if(l)l.value=''; if(e)e.value='';
    render(); refreshSelect();
  }

  function mount(){
    const search=document.getElementById('advancedCellSearch');
    if(!search)return;
    let box=document.getElementById('customSpecsArea');
    if(!box){
      box=document.createElement('div');
      box.id='customSpecsArea';
      box.className='custom-specs-box';
      box.innerHTML=`
        <div class="custom-specs-head">
          <b>⚙️ مواصفات إضافية</b>
          <span style="font-size:8px;color:#8f867d">اضغط على المواصفة لتفعيلها</span>
        </div>
        <div class="custom-spec-list"></div>
        <div class="custom-spec-add">
          <input id="customSpecLabel" placeholder="اسم المواصفة: التردد">
          <input id="customSpecExample" placeholder="مثال: 50Hz">
          <button class="btn small" id="customSpecAdd" type="button">＋ إضافة</button>
        </div>`;
      search.appendChild(box);
      document.getElementById('customSpecAdd').onclick=add;
      document.getElementById('customSpecExample').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
    }
    render();refreshSelect();
  }

  const oldShow=window.showView;
  if(typeof oldShow==='function'){
    window.showView=function(v){
      oldShow(v);
      if(v==='storage')setTimeout(mount,50);
    };
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(mount,80));
  setTimeout(mount,300);
})();
</script>


<script>
/* Mobile UX: keep the documentation screen compact on first open. */
(function(){
  const applyMobileDocState=()=>{
    if(window.innerWidth>760) return;
    document.querySelectorAll('.sec-scope .content-block').forEach(block=>{
      if(block.dataset.mobileInit==='1') return;
      block.dataset.mobileInit='1';
      if(block.dataset.block==='explain') return;
      block.classList.add('is-collapsed');
      const btn=block.querySelector('[data-act="collapse"]');
      if(btn){ btn.textContent='⌄ فتح'; btn.title='فتح الكتلة'; }
    });
  };
  const observer=new MutationObserver(()=>requestAnimationFrame(applyMobileDocState));
  observer.observe(document.body,{childList:true,subtree:true});
  window.addEventListener('resize',()=>requestAnimationFrame(applyMobileDocState));
  document.addEventListener('DOMContentLoaded',()=>setTimeout(applyMobileDocState,120));
  setTimeout(applyMobileDocState,500);
})();
</script>

<script id="indicator-system-v2">
(function(){
'use strict';

function escI(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function numI(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d;}
function clampI(n,a=0,b=100){return Math.max(a,Math.min(b,n));}

const CELL_TYPES=[
  ['text','نص'],['number','رقم كبير'],['badge','شارة'],['bar','شريط تقدم'],
  ['ring','حلقة'],['gauge','عداد'],['lamp','لمبة'],['dot','نقطة مضيئة'],
  ['level','مستويات'],['steps','خطوات'],['donut','دونات'],['spark','مخطط صغير'],['mini-bars','أعمدة صغيرة']
];

function migrateCellIndicators(cell){
  if(!Array.isArray(cell.indicators)){
    if(cell.indicator) cell.indicators=[{...cell.indicator,id:cell.indicator.id||uid('cind')}];
    else cell.indicators=[];
  }
  cell.indicators=cell.indicators.map(x=>({
    id:x.id||uid('cind'),enabled:x.enabled!==false,type:x.type||'text',
    source:x.source||'quantity',label:x.label||'',value:x.value??'',
    color:x.color||'#5aa7ff',min:numI(x.min,0),max:numI(x.max,100),unit:x.unit||''
  }));
  return cell.indicators;
}
function cellIndicatorConfig(cell){return migrateCellIndicators(cell)[0]||{enabled:false,type:'text',source:'quantity',label:'',value:'',color:'#5aa7ff',min:0,max:100,unit:''};}

function cellRawI(cell,cfg){
  const comp=cell?.componentId?findComponent(cell.componentId):null;
  switch(cfg.source){
    case 'quantity':return cell?.quantity??0;
    case 'status':return cell?statusLabelAr(cellStatus(cell)):'فارغة';
    case 'voltage':return comp?.voltage||'';
    case 'current':return comp?.current||'';
    case 'power':return comp?.power||'';
    case 'value':return comp?.value||'';
    case 'partNumber':return comp?.partNumber||'';
    case 'componentName':return comp?.name||'';
    case 'category':return comp?.category||'';
    case 'manufacturer':return comp?.manufacturer||'';
    case 'custom':return cfg.value??'';
    default:return cfg.value??'';
  }
}
function indicatorPctI(raw,cfg){
  const n=numI(raw,0), min=numI(cfg.min,0), max=numI(cfg.max,100);
  return max<=min ? (n>min?100:0) : clampI((n-min)/(max-min)*100);
}
function sparkI(pct){
  const levels=['▁','▂','▃','▄','▅','▆','▇','█'];
  const n=clampI(numI(pct),0,100);
  const base=Math.max(0,Math.min(7,Math.round(n/100*7)));
  return levels[Math.max(0,base-1)]+levels[Math.max(0,Math.min(7,base))]+levels[Math.max(0,Math.min(7,base+1))]+levels[Math.max(0,Math.min(7,base-1))]+levels[Math.max(0,Math.min(7,base))];
}
function renderIndicatorI(cfg,raw,compact=false){
  if(!cfg||cfg.enabled===false)return '';
  const color=escI(cfg.color||'#5aa7ff'), value=escI(raw), label=cfg.label?escI(cfg.label)+': ':'';
  const pct=indicatorPctI(raw,cfg), p=pct.toFixed(0);
  const title=escI((cfg.label?cfg.label+': ':'')+String(raw??''));
  let body='';
  if(cfg.type==='bar') body=`<span class="cell-indicator ind-bar" title="${title}" style="--ind-color:${color};--ind-pct:${p}%"><span class="ind-bar-fill"></span></span>`;
  else if(cfg.type==='ring') body=`<span class="cell-indicator ind-ring" title="${title}" style="--ind-color:${color};transform:rotate(${Math.round(pct*3.6)}deg)"><span class="ind-label" style="transform:rotate(-${Math.round(pct*3.6)}deg)">${p}%</span></span>`;
  else if(cfg.type==='gauge') body=`<span class="cell-indicator ind-gauge" title="${title}" style="--ind-color:${color}"><i class="ind-gauge-needle" style="transform:rotate(${Math.round(-65+pct*1.3)}deg)"></i></span>`;
  else if(cfg.type==='lamp') body=`<span class="cell-indicator ind-lamp" title="${title}" style="--ind-color:${color}"><span class="ind-lamp-dot"></span><span class="ind-label">${label}${value}</span></span>`;
  else if(cfg.type==='dot') body=`<span class="cell-indicator ind-dot" title="${title}" style="--ind-color:${color}"></span>`;
  else if(cfg.type==='level') body=`<span class="cell-indicator ind-level" title="${title}" style="--ind-color:${color}">${[1,2,3,4,5].map(n=>`<i class="${pct>=n*20?'on':''}"></i>`).join('')}</span>`;
  else if(cfg.type==='steps') body=`<span class="cell-indicator ind-steps" title="${title}" style="--ind-color:${color}">${[1,2,3,4,5,6].map(n=>`<i class="${pct>=n*100/6?'on':''}"></i>`).join('')}</span>`;
  else if(cfg.type==='donut') body=`<span class="cell-indicator ind-donut" title="${title}" style="--ind-color:${color};--ind-pct:${p}%"><span class="ind-label">${p}%</span></span>`;
  else if(cfg.type==='spark') body=`<span class="cell-indicator ind-spark" title="${title}" style="color:${color}">${sparkI(pct)}</span>`;
  else if(cfg.type==='mini-bars') body=`<span class="cell-indicator ind-mini-bars" title="${title}" style="--ind-color:${color}">${[20,40,60,80,100].map(n=>`<i style="--h:${Math.max(2,Math.round(pct*n/100*0.12)+3)}px"></i>`).join('')}</span>`;
  else if(cfg.type==='number') body=`<span class="cell-indicator ind-number" title="${title}" style="color:${color}">${label}${value}${escI(cfg.unit)}</span>`;
  else if(cfg.type==='badge') body=`<span class="cell-indicator ind-badge" title="${title}" style="color:${color};border-color:${color}">${label}${value}${escI(cfg.unit)}</span>`;
  else body=`<span class="cell-indicator ind-text" title="${title}" style="color:${color}">${label}${value}${escI(cfg.unit)}</span>`;
  return body;
}
function cellIndicatorHTML(cell){
  const arr=migrateCellIndicators(cell).filter(x=>x.enabled!==false);
  if(!arr.length)return '';
  return `<div class="cell-indicators">${arr.slice(0,8).map(cfg=>renderIndicatorI(cfg,cellRawI(cell,cfg),true)).join('')}</div>`;
}

function cellIndicatorFieldsHTML(cell){
  const arr=migrateCellIndicators(cell);
  const rows=arr.map(cellIndicatorRowHTMLI).join('');
  return `<div id="cellIndicatorPanel">
    <div class="visual-modal-advanced">
      <b style="font-size:12px">مؤشرات هذه الخلية</b>
      <div style="font-size:10px;color:var(--dim);margin-top:4px">يمكنك إضافة عدة مؤشرات. كل مؤشر مستقل ويمكنه عرض معلومة مختلفة، وكلها تتكيف تلقائيًا داخل حدود الخلية.</div>
    </div>
    <div id="ciRows">${rows}</div>
    <button class="btn small" id="ciAdd">+ إضافة مؤشر جديد</button>
    <div class="ind-preview" style="margin-top:8px">
      <div style="font-size:10px;color:var(--dim);margin-bottom:5px">معاينة</div>
      <div class="ind-preview-box" id="ciPreview" style="max-width:100%;overflow:hidden"></div>
    </div>
    <button class="btn small primary" id="saveCellIndicatorsBtn" style="margin-top:8px">حفظ جميع مؤشرات الخلية</button>
  </div>`;
}
function cellIndicatorRowHTMLI(c){
  const sourceOpts=[
    ['quantity','الكمية'],['status','الحالة'],['voltage','الجهد'],['current','التيار'],['power','القدرة'],
    ['value','القيمة'],['partNumber','رقم القطعة'],['componentName','اسم المكون'],['category','الفئة'],
    ['manufacturer','الشركة المصنعة'],['custom','قيمة مخصصة']
  ].map(x=>`<option value="${x[0]}" ${c.source===x[0]?'selected':''}>${x[1]}</option>`).join('');
  const typeOpts=CELL_TYPES.map(x=>`<option value="${x[0]}" ${c.type===x[0]?'selected':''}>${x[1]}</option>`).join('');
  return `<div class="visual-var-row ci-row" data-ci="${c.id}">
    <div class="field"><label>البيان</label><select data-ci-v="source">${sourceOpts}</select></div>
    <div class="field"><label>الشكل</label><select data-ci-v="type">${typeOpts}</select></div>
    <div class="field"><label>العنوان</label><input data-ci-v="label" value="${escI(c.label)}" placeholder="مثال: V / مخزون"></div>
    <div class="field"><label>قيمة مخصصة</label><input data-ci-v="value" value="${escI(c.value)}"></div>
    <div class="field"><label>الوحدة</label><input data-ci-v="unit" value="${escI(c.unit)}" placeholder="V / A / قطعة"></div>
    <div class="field"><label>Min</label><input data-ci-v="min" type="number" value="${c.min}"></div>
    <div class="field"><label>Max</label><input data-ci-v="max" type="number" value="${c.max}"></div>
    <div class="field"><label>اللون</label><input data-ci-v="color" type="color" value="${escI(c.color)}" style="height:36px;padding:3px"></div>
    <div style="display:flex;gap:5px;align-items:center">
      <label class="check-row" style="border:0;padding:0"><input data-ci-v="enabled" type="checkbox" ${c.enabled!==false?'checked':''}><span class="ctext">عرض</span></label>
      <button class="btn small danger" data-ci-delete>حذف</button>
    </div>
  </div>`;
}
function wireCellIndicatorSettings(cell){
  const rowsEl=document.getElementById('ciRows');
  const preview=document.getElementById('ciPreview');
  if(!rowsEl)return;
  const readRows=()=>[...rowsEl.querySelectorAll('[data-ci]')].map(row=>({
    id:row.dataset.ci,
    source:row.querySelector('[data-ci-v="source"]').value,
    type:row.querySelector('[data-ci-v="type"]').value,
    label:row.querySelector('[data-ci-v="label"]').value.trim(),
    value:row.querySelector('[data-ci-v="value"]').value,
    unit:row.querySelector('[data-ci-v="unit"]').value.trim(),
    min:numI(row.querySelector('[data-ci-v="min"]').value,0),
    max:numI(row.querySelector('[data-ci-v="max"]').value,100),
