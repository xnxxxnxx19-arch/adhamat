<style>
:root, [data-theme="amber"]{
  --bg:#0b0f14; --panel:#12181f; --panel2:#1a2330; --panel3:#212c3b;
  --border:#28323f; --border-lt:#33404f;
  --text:#e7edf5; --dim:#8ea0b3; --dim2:#5d6c7d;
  --amber:#f2a93c; --amber-dim:#3a2d16; --amber-dark:#b5721f; --amber-ink:#1a1000; --amber-border:#5a4420; --amber-rgb:242,169,60;
  --green:#3ddc84; --green-dim:#123321;
  --yellow:#f2c53d; --yellow-dim:#3a3212;
  --red:#ff5d5d; --red-dim:#3a1414;
  --blue:#4da3ff; --blue-dim:#122a44;
  --grid-rgb:255,255,255; --grid-op:.015;
  --theme-emoji:"🟠"; --theme-label:"كهرماني";
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans Arabic','Segoe UI',sans-serif;
}
[data-theme="night-blue"]{
  --bg:#0a0f1a; --panel:#111a2b; --panel2:#182338; --panel3:#1f2d47;
  --border:#28384f; --border-lt:#334660;
  --text:#e6edf7; --dim:#8a9db8; --dim2:#5a6c85;
  --amber:#4da3ff; --amber-dim:#122a44; --amber-dark:#2f6fc4; --amber-ink:#04101f; --amber-border:#1e3f66; --amber-rgb:77,163,255;
  --green:#3ddc84; --green-dim:#123321;
  --yellow:#f2c53d; --yellow-dim:#3a3212;
  --red:#ff5d5d; --red-dim:#3a1414;
  --blue:#7fc4ff; --blue-dim:#16324d;
  --grid-rgb:255,255,255; --grid-op:.015;
  --theme-emoji:"🌌"; --theme-label:"أزرق ليلي";
}
[data-theme="circuit-green"]{
  --bg:#070c08; --panel:#0d150e; --panel2:#131f15; --panel3:#1a2c1c;
  --border:#20361f; --border-lt:#2b4a2a;
  --text:#e3f3e6; --dim:#88ad8e; --dim2:#557259;
  --amber:#26e07a; --amber-dim:#0f3320; --amber-dark:#189955; --amber-ink:#02150a; --amber-border:#1a5c3a; --amber-rgb:38,224,122;
  --green:#26e07a; --green-dim:#0f3320;
  --yellow:#ffd23d; --yellow-dim:#3a3212;
  --red:#ff4d4d; --red-dim:#3a1414;
  --blue:#4da3ff; --blue-dim:#122a44;
  --grid-rgb:38,224,122; --grid-op:.045;
  --theme-emoji:"🔌"; --theme-label:"دائرة LED";
}
[data-theme="daylight"]{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f5; --panel3:#e4e9ef;
  --border:#d7dee6; --border-lt:#c7d0db;
  --text:#1c2530; --dim:#5c6b7c; --dim2:#8ea0b3;
  --amber:#c9821f; --amber-dim:#fbeedc; --amber-dark:#a56517; --amber-ink:#ffffff; --amber-border:#e0c090; --amber-rgb:201,130,31;
  --green:#1f9d5c; --green-dim:#e3f7ec;
  --yellow:#a8790a; --yellow-dim:#fbf2d9;
  --red:#d9433c; --red-dim:#fceaea;
  --blue:#1f6fb2; --blue-dim:#e6f0fa;
  --grid-rgb:0,0,0; --grid-op:.025;
  --theme-emoji:"☀️"; --theme-label:"فاتح نهاري";
}
[data-theme="warm-paper"]{
  --bg:#f2e9d8; --panel:#f9f3e6; --panel2:#efe4cf; --panel3:#e8dac0;
  --border:#d8c9a8; --border-lt:#c9b896;
  --text:#2e2a22; --dim:#6c6250; --dim2:#8a7355;
  --amber:#8a5a2d; --amber-dim:#e9dcc4; --amber-dark:#6b4420; --amber-ink:#ffffff; --amber-border:#c9a870; --amber-rgb:138,90,45;
  --green:#5c7a52; --green-dim:#e3ead9;
  --yellow:#96700a; --yellow-dim:#f2e6c9;
  --red:#a63a3a; --red-dim:#f2dede;
  --blue:#3a5a8c; --blue-dim:#dde6f2;
  --grid-rgb:0,0,0; --grid-op:.03;
  --theme-emoji:"📖"; --theme-label:"دفتر ورقي";
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
body{background-image:
  linear-gradient(var(--bg) 0, var(--bg) 100%),
  repeating-linear-gradient(0deg, rgba(var(--grid-rgb),var(--grid-op)) 0 1px, transparent 1px 24px),
  repeating-linear-gradient(90deg, rgba(var(--grid-rgb),var(--grid-op)) 0 1px, transparent 1px 24px);
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);border-radius:6px;padding:8px 10px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-lt);border-radius:4px;}
.hidden{display:none !important;}
a{color:var(--blue);}

.app-shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:230px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px 8px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--amber),var(--amber-dark));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--amber-ink);font-family:var(--mono);font-size:15px;}
.brand-text{line-height:1.25;}
.brand-text b{font-size:14.5px;display:block;}
.brand-text span{font-size:11px;color:var(--dim);font-family:var(--mono);}
nav.navlist{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:var(--dim);text-align:right;padding:9px 10px;border-radius:8px;font-size:13.5px;transition:.15s;}
.nav-item .ico{font-size:15px;width:18px;text-align:center;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel3);color:var(--amber);border-right:3px solid var(--amber);padding-right:7px;}
.save-badge{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);padding:8px 10px;border-radius:8px;border:1px solid var(--border);cursor:default;text-align:center;}
.save-badge.fail{cursor:pointer;color:var(--red);border-color:var(--red);}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:relative;z-index:20;}
.search-wrap{position:relative;flex:1;max-width:520px;}
#searchInput{width:100%;padding:10px 14px;font-size:13.5px;}
.search-results{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--panel3);border:1px solid var(--border-lt);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-height:360px;overflow-y:auto;z-index:50;}
.sres-item{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:center;}
.sres-item:last-child{border-bottom:none;}
.sres-item:hover{background:var(--panel2);}
.sres-name{font-weight:600;font-size:13.5px;}
.sres-meta{font-size:11px;color:var(--dim);font-family:var(--mono);}
.sres-loc{font-size:11px;color:var(--amber);font-family:var(--mono);white-space:nowrap;}
.notif-bell{position:relative;font-size:19px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
#notifCount{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-size:10px;font-family:var(--mono);border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;}
.notif-panel{position:absolute;top:60px;left:20px;width:340px;max-height:70vh;overflow-y:auto;background:var(--panel3);border:1px solid var(--border-lt);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:60;padding:8px;}
.notif-row{padding:10px 12px;border-radius:8px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;}
.notif-row:hover{background:var(--panel2);}

#viewContainer{flex:1;overflow-y:auto;padding:22px 26px 60px 26px;overflow-anchor:none;}
.view-title{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
.view-title h1{font-size:19px;margin:0;}
.view-title .sub{color:var(--dim);font-size:12.5px;}
.view-desc{color:var(--dim);font-size:12.5px;margin-bottom:18px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;}
.stat-card .num{font-family:var(--mono);font-size:24px;font-weight:600;}
.stat-card .lbl{font-size:11.5px;color:var(--dim);margin-top:2px;}
.stat-card.warn .num{color:var(--yellow);}
.stat-card.crit .num{color:var(--red);}
.stat-card.good .num{color:var(--green);}
.stat-card.info .num{color:var(--blue);}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
.theme-grid-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:8px;}
.theme-swatch{position:relative;background:var(--panel2);border:1.5px solid var(--border-lt);border-radius:10px;padding:12px;cursor:pointer;transition:.15s;}
.theme-swatch:hover{border-color:var(--amber);transform:translateY(-1px);}
.theme-swatch.active{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-dim);}
.ts-preview{height:34px;border-radius:7px;border:1px solid var(--border-lt);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;background:var(--bg);}
.ts-dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
.ts-name{font-size:12.5px;font-weight:700;}
.ts-desc{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.5;}
.ts-badge{position:absolute;top:8px;left:8px;background:var(--amber);color:var(--amber-ink);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;}
.panel h3{margin:0 0 12px 0;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
.btn{background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:500;transition:.15s;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);}
.btn.primary:hover{filter:brightness(1.1);color:var(--amber-ink);}
.btn.danger{color:var(--red);border-color:var(--red-dim);}
.btn.danger:hover{background:var(--red-dim);}
.btn.small{padding:5px 10px;font-size:11.5px;}

/* Storage / cabinet visuals */
.rack-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:22px;overflow:hidden;}
.rack-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,var(--panel3),var(--panel2));border-bottom:1px solid var(--border);}
.rack-plate{display:flex;align-items:center;gap:10px;}
.plate-tag{font-family:var(--mono);font-size:11px;background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-border);padding:3px 8px;border-radius:5px;}
.rack-head b{font-size:14px;}
.rack-head .meta{color:var(--dim);font-size:11px;}
.rack-head-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;width:100%;}
.rack-columns{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start;background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px);
}
.rack-column{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;min-width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.column-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.column-head b{color:var(--amber);}
.box-card{background:var(--panel3);border:1px solid var(--border-lt);border-radius:8px;padding:8px;}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;margin-bottom:6px;}
.box-head b{font-size:12px;}
.box-cells{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;}
.cell{position:relative;border-radius:7px;border:1px solid var(--border-lt);background:var(--panel);min-height:58px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;overflow:hidden;}
.cell::before,.cell::after{content:'';position:absolute;top:5px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.06);}
.cell::before{right:5px;} .cell::after{left:5px;}
.cell:hover{border-color:var(--amber);transform:translateY(-1px);}
.cell .cid{font-family:var(--mono);font-size:9.5px;color:var(--dim2);}
.cell .cname{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell .cqty{font-family:var(--mono);font-size:14px;font-weight:700;}
.cell.status-green{border-right:4px solid var(--green);}
.cell.status-yellow{border-right:4px solid var(--yellow);}
.cell.status-red{border-right:4px solid var(--red);}
.cell.status-empty{border-style:dashed;opacity:.55;align-items:center;justify-content:center;}
.cell.status-empty .plus{font-size:18px;color:var(--dim2);}
.cell.highlight{animation:pulseBlue 1.1s ease-in-out 3;border-color:var(--blue) !important;box-shadow:0 0 0 3px var(--blue-dim),0 0 20px rgba(77,163,255,.5);}
@keyframes pulseBlue{0%,100%{box-shadow:0 0 0 3px var(--blue-dim);}50%{box-shadow:0 0 0 6px rgba(77,163,255,.25);}}
.cell.dragover{outline:2px dashed var(--amber);}

/* flash sequence: rack -> column -> box -> cell */
@keyframes flashStep{0%,100%{box-shadow:none;} 50%{box-shadow:0 0 0 4px var(--amber-dim),0 0 26px rgba(var(--amber-rgb),.6);border-color:var(--amber) !important;}}
.flash-step{animation:flashStep .55s ease-in-out 2;}
@keyframes pulseWait{0%,100%{box-shadow:0 0 0 3px var(--blue-dim);} 50%{box-shadow:0 0 0 8px rgba(77,163,255,.4);}}
.cell.flash-wait{animation:pulseWait 1s ease-in-out infinite !important;border-color:var(--blue) !important;z-index:5;}

/* collapsed rack list card */
.rack-panel.compact-only{cursor:default;}

/* صفحة تكبير العمود: العبوات بالأعلى ومحتوى كل عبوة بالكامل بالأسفل */
.column-fullpage{background:var(--panel);border:1px solid var(--border);border-radius:14px;min-height:calc(100vh - 150px);overflow:hidden;display:flex;flex-direction:column;}
.column-page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;background:linear-gradient(180deg,var(--panel3),var(--panel2));border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
.column-page-title{display:flex;align-items:center;gap:10px;flex:1;min-width:220px;}.column-page-title h1{margin:0;font-size:18px;}.column-page-title p{margin:2px 0 0;color:var(--dim);font-size:11px;}.column-page-stats{font-size:11px;color:var(--dim);font-family:var(--mono);}.column-page-stats b{color:var(--amber);}.column-page-actions{display:flex;gap:6px;}
.column-page-scroll{overflow:auto;padding:18px;}.column-boxes-index{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:18px;}.cp-section-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}.cp-section-title span{font-size:10.5px;color:var(--dim);font-weight:400;}.column-boxes-index{display:grid;grid-template-columns:1fr;gap:8px;}.column-boxes-index .cp-section-title{grid-column:1/-1;}.column-page-box{display:flex;align-items:center;gap:10px;background:var(--panel3);border:1px solid var(--border-lt);border-radius:9px;padding:10px 12px;cursor:pointer;transition:.15s;}.column-page-box:hover{border-color:var(--amber);transform:translateY(-1px);}.cpb-icon{font-size:22px}.cpb-main{display:flex;flex-direction:column;gap:2px;flex:1}.cpb-main b{font-size:12.5px}.cpb-main span{font-size:10px;color:var(--dim);font-family:var(--mono)}.cpb-arrow{color:var(--amber);font-size:18px}.column-contents{display:flex;flex-direction:column;gap:14px;}.column-contents>.cp-section-title{margin-bottom:0}.column-box-content{scroll-margin-top:90px;}.column-box-content .box-card.expanded{background:var(--panel);border-color:var(--border-lt);padding:12px;margin-bottom:0;}.column-box-content .box-cells{overflow:auto;padding-bottom:3px;}.column-box-content .cell{cursor:pointer;}
@media(max-width:700px){.column-page-head{align-items:flex-start}.column-page-title{min-width:160px}.column-page-stats{width:100%}.column-page-actions{width:100%}.column-page-actions .btn{flex:1}.column-page-scroll{padding:10px;}}

/* full-page rack view: takes over the whole storage screen, columns on top, selected box's cells below */
.rack-fullpage-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 150px);}
.rack-fullpage-wrap .rack-head-top{flex-wrap:wrap;}
.rack-fullpage-columns{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start;border-bottom:1px solid var(--border);background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px);
}
.box-chip{background:var(--panel3);border:1px solid var(--border-lt);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:150px;transition:.15s;}
.box-chip:hover{border-color:var(--amber);}
.box-chip.selected{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-dim);background:var(--panel2);}
.box-chip .bc-name{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.box-chip .bc-name b{font-size:12.5px;}
.box-chip .bc-count{font-family:var(--mono);color:var(--dim);font-size:11px;}
.box-chip .bc-hint{font-size:10px;color:var(--dim2);margin-top:3px;}
.rack-detail-panel{flex:1;padding:20px;background:var(--panel2);min-height:340px;}
.rack-detail-panel .box-card.expanded{background:transparent;border:none;padding:0;}
.rack-detail-empty{text-align:center;color:var(--dim);padding:70px 20px;font-size:13px;}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.preset-row button.active{border-color:var(--amber);color:var(--amber);}

/* checklist */
.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.check-row:last-child{border-bottom:none;}
.check-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--amber);flex-shrink:0;}
.check-row .ctext{flex:1;font-size:13px;}
.check-row .ctext.done{color:var(--dim);text-decoration:line-through;}
.check-row .cdate{font-size:10.5px;color:var(--dim2);font-family:var(--mono);}

/* ============================= CATEGORY DATABASE PAGE ============================= */

/* ============================== نظام التوثيق التقني للخلية (مستورد من code_library) ============================== */
.sec-scope{
  --paper: var(--panel3); --paper-card: var(--panel2); --paper-shadow: rgba(0,0,0,.45);
  --ink: var(--text); --ink-soft: var(--dim); --rule: var(--border-lt);
  --accent: var(--amber); --accent-rgb: var(--amber-rgb); --accent-dark: var(--amber-dark);
  --marker: var(--yellow); --danger: var(--red);
  --tab: #4a3418; --surface: var(--panel3); --surface-soft: var(--panel2);
  --tint: rgba(var(--amber-rgb),.14); --on-accent: var(--amber-ink);
  --font-display: var(--sans);
  --overlay-rgb: 0,0,0; --zebra-rgb: 255,255,255;
  color: var(--text); font-family: var(--sans);
}
.sec-scope .card{background:var(--paper-card);}
.sec-scope button{
    background:var(--surface); color:var(--ink); border:1.5px solid var(--rule);
    padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit;
    transition:border-color .15s, transform .1s, background .15s;
  }
.sec-scope button:hover{border-color:var(--accent);}
.sec-scope button:active{transform:scale(.97);}
.sec-scope button.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent-dark); font-weight:700;}
.sec-scope button.primary:hover{background:var(--accent-dark);}
.sec-scope button.ghost{background:transparent;}
.sec-scope button.danger{color:var(--danger); border-color:#e0bcbc;}
.sec-scope button.small{padding:3px 9px; font-size:11px;}
.sec-scope input[type=text],
.sec-scope input[type=search]{
    background:var(--surface); border:1.5px solid var(--rule); color:var(--ink);
    padding:7px 10px; border-radius:8px; font-size:13px; font-family:inherit;
  }
.sec-scope .autosave-status{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
.sec-scope .autosave-status.on{color:var(--accent-dark); font-weight:700;}
.sec-scope .autosave-status.pending{color:#b8860b; font-weight:700;}
.sec-scope .autosave-status.err{color:var(--danger); font-weight:700;}
.sec-scope .fmt-toolbar{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; padding:6px; background:var(--paper); border:1px solid var(--rule); border-radius:6px;}
.sec-scope .fmt-btn{background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:3px 8px; font-size:12px; cursor:pointer; color:var(--ink); line-height:1.6;}
.sec-scope .fmt-btn:hover{border-color:var(--accent); background:var(--paper-card);}
.sec-scope .fmt-sep{width:1px; align-self:stretch; background:var(--rule); margin:0 2px;}
.sec-scope .fmt-btn.custom-rule{background:#fff8e8; border-color:var(--marker);}
.sec-scope .extra-explanations-holder{display:flex; flex-direction:column; gap:12px; margin-top:10px;}
.sec-scope .extra-explain-box{border:1px solid var(--rule); border-radius:8px; padding:10px; background:var(--paper);}
.sec-scope .extra-explain-box .exbox-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.sec-scope .extra-explain-box.is-collapsed .exbox-body{display:none;}
.sec-scope .extra-explain-box.is-collapsed .exbox-head{margin-bottom:0;}
.sec-scope .extra-explain-box .exbox-title{flex:1; font-size:13px; font-weight:700; border:1px solid var(--rule); border-radius:5px; padding:5px 8px; background:var(--surface); color:var(--ink);}
.sec-scope .add-explain-btn{margin-top:10px;}
.sec-scope .card{
    background:var(--paper-card);
    border:1.5px solid var(--rule); border-radius:4px;
    padding:20px 22px; position:relative;
    box-shadow:3px 4px 0 var(--paper-shadow);
  }
.sec-scope .card::before{ 
    content:""; position:absolute; top:-2px; inset-inline-start:18px; width:46px; height:8px;
    background:var(--marker); border-radius:0 0 4px 4px;
  }
.sec-scope .card-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px; padding-top:4px;}
.sec-scope .card-head input.titlein{
    flex:1; font-size:19px; font-weight:700; background:transparent; border:none;

.sec-scope .section-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px; margin:14px 0 6px; border-bottom:1px dotted var(--rule); padding-bottom:3px;}
.sec-scope .explain-view{
    width:100%; min-height:60px; background:var(--surface-soft); border:1px solid var(--rule); color:var(--ink);
    border-radius:6px; padding:12px 14px; font-size:14.5px; line-height:1.85; direction:rtl; text-align:right;

.sec-scope .explain-view h6.md-h{font-size:14px;}
.sec-scope .explain-view .md-emoji-head{
    font-weight:800; font-size:15.5px; margin:16px 0 8px; color:var(--accent-dark);
    padding-bottom:4px; border-bottom:2px solid var(--rule);
  }
.sec-scope .explain-view .md-subhead{
    font-weight:800; font-size:14.5px; margin:14px 0 6px; color:var(--accent-dark); line-height:1.5;

/* ================= 3D LIBRARY-STYLE STORAGE ================= */

.vs3-book:hover{transform:translateX(7px) translateZ(10px);filter:brightness(1.2);}.vs3-book span{font-size:10px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vs3-book small{font-size:8px;opacity:.8}.vs3-empty-book{color:#9c8b78;text-align:center;padding:25px 5px;font-size:11px;}

.vs3-frame-back{position:absolute;inset:28px 24px 38px;background:linear-gradient(135deg,#120c08,#24160e);box-shadow:inset 0 0 70px rgba(0,0,0,.65);border:8px solid #543019;}
.vs3-full-columns{position:relative;z-index:5;display:flex;gap:12px;align-items:stretch;overflow-x:auto;overflow-anchor:none;padding:14px 10px 12px;min-height:315px;scrollbar-width:thin;}

.vs3-col-actions{position:absolute;bottom:7px;left:7px;right:7px;display:flex;justify-content:center;gap:4px}.vs3-col-actions .btn{font-size:9px;padding:3px 6px}.vs3-cell-panel{background:linear-gradient(#1e282f,#13191e)!important;border-top:1px solid rgba(255,255,255,.08)}.vs3-cell-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#e5d5bf;font-size:12px}.vs3-cell-title span{font-size:10px;color:var(--dim)}

  grid-template-columns:38px minmax(0,1fr) auto;

  flex-wrap:nowrap !important;
  align-items:center;
  gap:6px;

  overflow-y:hidden;
  padding:7px;

  scrollbar-width:thin;

.sec-scope .tech-commandbar .tech-action{
  min-height:36px;
  white-space:nowrap;
}

  display:none !important;
}

/* عناوين البطاقات */
.sec-scope .content-block{min-width:0;}

  gap:6px;
  min-height:46px;

}

  flex:0 0 auto;
}
.sec-scope .content-block .block-tools button{

  min-height:32px;
  white-space:nowrap;
}

/* الشرح */
.sec-scope [data-block="explain"] .block-body{padding:9px;}
.sec-scope .explain-view,
.sec-scope textarea.explain{
  width:100% !important;
  max-width:100% !important;
  overflow-wrap:anywhere;
}

/* الأكواد والجداول: لا تخرج عن عرض البطاقة */
.sec-scope .codes-holder,
.sec-scope .tables-holder,
.sec-scope .drawing-holder,
.sec-scope .mindmap-holder{min-width:0 !important;max-width:100%;}
.sec-scope pre.codeview,
.sec-scope textarea.codearea{max-width:100%;overflow:auto;}
.sec-scope .table-scroll{max-width:100%;overflow:auto;}

/* شريط الرسم: تخطيط واضح على الموبايل بدل تكديس عشوائي */
.sec-scope .draw-toolbar{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) 44px;
  gap:6px;
  align-items:center;
}
.sec-scope .draw-toolbar .draw-tool{
  width:100%;
  min-width:0;
  grid-column:1 / -1;
}
.sec-scope .draw-toolbar .draw-color{
  width:44px !important;
  height:34px;
  justify-self:end;
}
.sec-scope .draw-toolbar .draw-width{
  width:100% !important;
  min-width:0;
}
.sec-scope .draw-toolbar .draw-fontsize{
  width:100% !important;
  min-width:0;
  height:34px;
}
.sec-scope .draw-toolbar .fill-toggle{
  min-height:34px;
  padding:0 8px;

  border-radius:7px;
  background:var(--tool-btn-bg);
  justify-content:center;
  white-space:nowrap;
}
.sec-scope .draw-toolbar .draw-undo,
.sec-scope .draw-toolbar .draw-clear{
  width:100%;
  min-height:34px;
  white-space:nowrap;
}
.sec-scope .draw-canvas{width:100% !important;max-width:100%;}

/* الخريطة الذهنية */
.sec-scope .mm-toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  overflow:visible;
}
.sec-scope .mm-toolbar > *{max-width:100%;}

<script>
/* ============================= DATA MODEL ============================= */
const DB_NAME='workshop_twin_db', DB_VERSION=1, STORE='kv', STATE_KEY='app_state';

const DEFAULT_CATEGORIES=['مقاومات','مقاومات متغيرة','مكثفات','مكثفات متغيرة','ثنائيات','ثنائيات زينر','Schottky','LED','فوتوديود','ترانزستورات','MOSFET','IGBT','دوائر متكاملة','مضخمات عمليات','مقارنات','تايمر/مولدات','منطق رقمي','بوابات منطقية','عدادات ومسجلات','متحكمات دقيقة','معالجات','ذاكرة','EEPROM/Flash','منظمات جهد','محولات DC-DC','دوائر شحن','دوائر حماية','ريليهات','كونتاكتورات','موصلات','رؤوس Pins','سوكتات IC','حساسات','وحدات جاهزة','شاشات','بلورات ورنانات','فيوزات','مفاتيح وأزرار','محولات كهربائية','محركات','مراوح','بطاريات','مزودات طاقة','أسلاك وكابلات','ترامل وملحقات PCB','لوحات PCB','أدوات قياس','أدوات لحام','مواد استهلاكية','3D/ميكانيكا','براغي ومثبتات','أخرى'];

function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n,l=2){return String(n).padStart(l,'0');}
function rowLetter(n){return String.fromCharCode(64+Number(n));}
function nowISO(){return new Date().toISOString();}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});}

let state=null;
/* حالة عرض مؤقتة (لا تُحفظ): أي رف/عبوة مُكبّرة حاليًا في شاشة التخزين المرئي */
let uiState={expandedRack:null,selectedBox:null,selectedColumn:null,expandedColumn:null};

/* ============================= CATEGORY / SPEC DATABASE ============================= */
const CATEGORY_SPEC_TEMPLATES={
  'ترانزستورات':[
    {key:'type',label:'نوع الترانزستور',type:'select',options:['NPN','PNP','MOSFET','IGBT','JFET','Darlington']},
    {key:'channel',label:'القناة',type:'select',options:['N-Channel','P-Channel','N/A']},
    {key:'voltage',label:'أقصى جهد',type:'text',unit:'V'},
    {key:'current',label:'أقصى تيار',type:'text',unit:'A'},
    {key:'power',label:'القدرة',type:'text',unit:'W'},
    {key:'frequency',label:'التردد',type:'text',unit:'Hz'},
    {key:'package',label:'الحزمة',type:'text'}
  ],
  'MOSFET':[
    {key:'type',label:'النوع',type:'select',options:['N-Channel','P-Channel']},
    {key:'voltage',label:'VDS أقصى جهد',type:'text',unit:'V'},
    {key:'current',label:'ID أقصى تيار',type:'text',unit:'A'},
    {key:'rds_on',label:'RDS(on)',type:'text',unit:'Ω'},
    {key:'power',label:'القدرة',type:'text',unit:'W'},
    {key:'package',label:'الحزمة',type:'text'}
  ],
  'IGBT':[
    {key:'type',label:'النوع',type:'select',options:['N-Channel','P-Channel','Module']},
    {key:'voltage',label:'VCE أقصى جهد',type:'text',unit:'V'},
    {key:'current',label:'IC أقصى تيار',type:'text',unit:'A'},
    {key:'power',label:'القدرة',type:'text',unit:'W'},
    {key:'frequency',label:'تردد التشغيل',type:'text',unit:'Hz'},
    {key:'package',label:'الحزمة',type:'text'}
  ],
  'ثنائيات':[
    {key:'type',label:'نوع الدايود',type:'select',options:['Signal','Rectifier','Fast','Schottky','LED','Photodiode']},
    {key:'voltage',label:'الجهد العكسي',type:'text',unit:'V'},
    {key:'current',label:'التيار الأمامي',type:'text',unit:'A'},
    {key:'frequency',label:'التردد',type:'text',unit:'Hz'},
    {key:'package',label:'الحزمة',type:'text'}
  ],
  'مقاومات':[
    {key:'resistance',label:'المقاومة',type:'text',unit:'Ω'},
    {key:'power',label:'القدرة',type:'text',unit:'W'},
    {key:'tolerance',label:'التسامح',type:'text',unit:'%'},
    {key:'voltage',label:'أقصى جهد',type:'text',unit:'V'},
    {key:'package',label:'الحزمة',type:'text'}
  ],
  'مكثفات':[
    {key:'capacitance',label:'السعة',type:'text',unit:'F'},
    {key:'voltage',label:'جهد التحمل',type:'text',unit:'V'},
    {key:'tolerance',label:'التسامح',type:'text',unit:'%'},
    {key:'type',label:'نوع المكثف',type:'select',options:['Ceramic','Electrolytic','Tantalum','Film','Variable']},
    {key:'package',label:'الحزمة',type:'text'}
  ],
  'دوائر متكاملة':[
    {key:'type',label:'نوع الدائرة',type:'text'},
    {key:'voltage',label:'جهد التشغيل',type:'text',unit:'V'},
    {key:'current',label:'التيار',type:'text',unit:'A'},
    {key:'frequency',label:'التردد',type:'text',unit:'Hz'},
    {key:'package',label:'الحزمة',type:'text'}
  ]
};
function categorySpecKey(label){return 'cs_'+String(label||'').trim().toLowerCase().replace(/\s+/g,'_').replace(/[^\w\u0600-\u06ff-]/g,'_').slice(0,70);}
function defaultSpecsForCategory(category){
  const tpl=CATEGORY_SPEC_TEMPLATES[category];
  if(tpl)return tpl.map(x=>({...x}));
  return [{key:'type',label:'النوع',type:'text'},{key:'voltage',label:'الجهد',type:'text',unit:'V'},{key:'current',label:'التيار',type:'text',unit:'A'},{key:'package',label:'الحزمة',type:'text'}];
}
const CATEGORY_BASE_FIELD_TEMPLATES=[
 {key:'name',label:'اسم المكون',type:'text',options:[],defaultValue:''},
 {key:'partNumber',label:'رقم القطعة',type:'text',options:[],defaultValue:''},
 {key:'manufacturer',label:'الشركة المصنعة',type:'text',options:[],defaultValue:''},
 {key:'package',label:'الحزمة Package',type:'text',options:[],defaultValue:''},
 {key:'value',label:'القيمة',type:'text',options:[],defaultValue:''},
 {key:'subcategory',label:'النوع / النوع الفرعي',type:'text',options:[],defaultValue:''},
 {key:'voltage',label:'الجهد',type:'text',options:[],defaultValue:''},
 {key:'current',label:'التيار',type:'text',options:[],defaultValue:''},
 {key:'power',label:'القدرة Power',type:'text',options:[],defaultValue:''},
 {key:'supplier',label:'المورد',type:'text',options:[],defaultValue:''},
 {key:'purchasePrice',label:'سعر الشراء',type:'number',options:[],defaultValue:'0'},
 {key:'warningStock',label:'حد التحذير Yellow',type:'number',options:[],defaultValue:'10'},
 {key:'criticalStock',label:'الحد الحرج Red',type:'number',options:[],defaultValue:'2'},
 {key:'targetStock',label:'هدف المخزون Target',type:'number',options:[],defaultValue:'50'},
 {key:'reorderQty',label:'كمية إعادة الطلب',type:'number',options:[],defaultValue:'0'},
 {key:'notes',label:'ملاحظات',type:'text',options:[],defaultValue:''}
];
function defaultCategoryFields(){return CATEGORY_BASE_FIELD_TEMPLATES.map(x=>({...x,options:[...(x.options||[])]}));}
function normalizeCategoryFields(schema){
 const before=Array.isArray(schema.fields)?JSON.stringify(schema.fields):null;
 if(!Array.isArray(schema.fields)) schema.fields=defaultCategoryFields();
 schema.fields=schema.fields.map(f=>{
   let options=normalizeCategorySpecOptions(f.options);
   let defaultValue=f.defaultValue??'';
   // إصلاح الحقول القديمة: إذا وُضعت القيم الجاهزة في خانة القيمة
   // بهذا الشكل 5,6,7 بدل خانة الاختيارات، ننقلها تلقائيًا إلى الاختيارات.
   if(!options.length && typeof defaultValue==='string' && /[,،;؛]/.test(defaultValue.trim())){
     const migrated=normalizeCategorySpecOptions(defaultValue);
     if(migrated.length>1){ options=migrated; defaultValue=''; }
   }
   // وجود اختيارات يجعل الحقل قائمة اختيار حتى لو كان النوع محفوظًا قديمًا كنص.
   const type=(options.length && (f.type||'text')==='text')?'select':(f.type||'text');
   return {key:f.key||('field_'+Date.now()),label:f.label||f.key||'حقل',type,options,defaultValue};
 });
 try{ const after=JSON.stringify(schema.fields); if(before!==after && typeof saveDirty!=='undefined') scheduleSave(); }catch(_e){}
 return schema.fields;
}
function categoryFieldDefs(category){ensureCategorySchemas();const schema=state.categorySchemas?.[category];return schema?normalizeCategoryFields(schema):[];}
function getCategoryFieldValue(obj,field){
 if(!obj)return field.defaultValue??'';
 if(obj[field.key]!==undefined&&obj[field.key]!==null)return obj[field.key];
 if(obj.customFields?.[field.key]!==undefined)return obj.customFields[field.key];
 return field.defaultValue??'';
}
function setCategoryFieldValue(obj,field,value){
 const base=['name','partNumber','manufacturer','package','value','subcategory','voltage','current','power','supplier','purchasePrice','warningStock','criticalStock','targetStock','reorderQty','notes'];
 if(base.includes(field.key)) obj[field.key]=(field.type==='number'&&value!==''?Number(value):value);
 else {if(!obj.customFields)obj.customFields={};obj.customFields[field.key]=field.type==='number'&&value!==''?Number(value):value;}
}
function renderCategoryManagedFields(obj,category,containerId,prefix,onChange){
 const defs=categoryFieldDefs(category), wrap=document.getElementById(containerId);if(!wrap)return;
 const rows=defs.map(f=>{const v=getCategoryFieldValue(obj,f),opts=normalizeCategorySpecOptions(f.options),id=prefix+'_'+String(f.key).replace(/[^a-zA-Z0-9_-]/g,'_');let control='';
  if(f.type==='number')control=`<input type="number" id="${id}" data-cat-base-field="${categorySpecEscape(f.key)}" value="${categorySpecEscape(v)}" placeholder="${categorySpecEscape(f.defaultValue||'القيمة')}">`;
  else if(f.type==='select'||opts.length){const lid=id+'_list';control=`<div class="cat-managed-combo"><input type="text" id="${id}" data-cat-base-field="${categorySpecEscape(f.key)}" list="${lid}" value="${categorySpecEscape(v)}" placeholder="اكتب أو اختر"><datalist id="${lid}">${opts.map(o=>`<option value="${categorySpecEscape(o)}"></option>`).join('')}</datalist>${opts.length?`<div class="cat-cell-quick-label">اختيارات سريعة:</div><div class="cat-cell-quick-options">${opts.map(o=>`<button type="button" class="cat-cell-quick-chip" data-cat-base-chip="${categorySpecEscape(f.key)}" data-cat-base-value="${categorySpecEscape(o)}">${categorySpecEscape(o)}</button>`).join('')}</div>`:''}</div>`;}
  else control=`<input type="text" id="${id}" data-cat-base-field="${categorySpecEscape(f.key)}" value="${categorySpecEscape(v)}" placeholder="${categorySpecEscape(f.defaultValue||'القيمة')}">`;
  return `<div class="field"><label>${categorySpecEscape(f.label||f.key)}</label>${control}</div>`;}).join('');
 wrap.innerHTML=`<div class="cat-managed-fields-box"><div class="cat-managed-fields-title">⚙️ حقول الفئة «${categorySpecEscape(category||'بدون فئة')}»</div><div class="cat-managed-fields-sub">هذه الحقول تدار من صفحة الفئات والمواصفات، ولكل فئة حقولها واختياراتها وقيمها الجاهزة.</div><div class="field-row">${rows}</div></div>`;
 wrap.querySelectorAll('[data-cat-base-field]').forEach(el=>{const f=defs.find(x=>x.key===el.dataset.catBaseField);if(!f)return;const save=()=>{setCategoryFieldValue(obj,f,el.value);if(typeof onChange==='function')onChange();};el.addEventListener('input',save);el.addEventListener('change',save);});
 wrap.querySelectorAll('[data-cat-base-chip]').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.catBaseChip,f=defs.find(x=>x.key===key),el=wrap.querySelector(`[data-cat-base-field="${CSS.escape(key)}"]`);if(f&&el){el.value=btn.dataset.catBaseValue||'';setCategoryFieldValue(obj,f,el.value);wrap.querySelectorAll(`[data-cat-base-chip="${CSS.escape(key)}"]`).forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(typeof onChange==='function')onChange();}}));
}
function buildDefaultCategorySchemas(){const out={};DEFAULT_CATEGORIES.forEach(cat=>{out[cat]={id:categorySpecKey(cat),description:'',specs:defaultSpecsForCategory(cat),fields:defaultCategoryFields()};});return out;}
function ensureCategorySchemas(){
 if(!state.categorySchemas||typeof state.categorySchemas!=='object'||Array.isArray(state.categorySchemas)){state.categorySchemas=buildDefaultCategorySchemas();return true;}
 let changed=false;(state.categories||[]).forEach(cat=>{if(!state.categorySchemas[cat]){state.categorySchemas[cat]={id:categorySpecKey(cat),description:'',specs:defaultSpecsForCategory(cat),fields:defaultCategoryFields()};changed=true;}else{const sc=state.categorySchemas[cat];if(!Array.isArray(sc.specs)){sc.specs=[];changed=true;}if(!Array.isArray(sc.fields)){sc.fields=defaultCategoryFields();changed=true;}else normalizeCategoryFields(sc);}});return changed;
}

/* ===== ربط جدول مواصفات الفئة مباشرةً بنموذج الخلية/المكون ===== */
function categorySpecDefs(category){
  ensureCategorySchemas();
  const schema=state.categorySchemas?.[category];
  return schema && Array.isArray(schema.specs) ? schema.specs : [];
}
function categorySpecRealField(key){
  // هذه الحقول موجودة أصلًا في المكون، فنحفظها فيها بدل إنشاء نسخة ثانية.
  return ({voltage:'voltage',current:'current',power:'power',package:'package'}[key]) || null;
}
function getCategorySpecValue(obj,spec){
  const real=categorySpecRealField(spec.key);
  if(real) return obj?.[real] ?? '';
  return obj?.customSpecs?.[spec.key] ?? '';
}
function setCategorySpecValue(obj,spec,value){
  const real=categorySpecRealField(spec.key);
  if(real){ obj[real]=value; return; }
  if(!obj.customSpecs) obj.customSpecs={};
  obj.customSpecs[spec.key]=value;
}
function categorySpecEscape(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function normalizeCategorySpecOptions(value){
  if(Array.isArray(value)) return value.map(x=>String(x??'').trim()).filter(Boolean);
  return String(value??'')
    .replace(/،/g,',')
    .replace(/[؛;]/g,',')
    .split(',')
    .map(x=>x.trim())
    .filter(Boolean);
}
function renderCategorySpecsEditor(targetObj,container,category,onChange){
  if(!container) return;
  if(!targetObj.customSpecs) targetObj.customSpecs={};
  const defs=categorySpecDefs(category);

  // كل مواصفات الفئة تظهر تلقائيًا داخل الخلية، بدون الحاجة لإضافتها مرة أخرى.
  const rows=defs.map(spec=>{
    const value=getCategorySpecValue(targetObj,spec);
    const type=spec.type||'text';
    const opts=normalizeCategorySpecOptions(spec.options);
    const unit=spec.unit?` <span class="cat-cell-spec-unit">${categorySpecEscape(spec.unit)}</span>`:'';
    let control='';
    if(type==='select' || opts.length){
      const opts=normalizeCategorySpecOptions(spec.options);
      const listId='catopts_'+String(spec.key).replace(/[^a-zA-Z0-9_-]/g,'_')+'_'+Math.random().toString(36).slice(2,7);
      control=`<div class="cat-cell-combo">
        <input class="cat-cell-spec-control cat-cell-spec-combo" type="text"
          data-cat-spec-value="${categorySpecEscape(spec.key)}"
          list="${listId}" value="${categorySpecEscape(value)}"
          placeholder="اكتب القيمة أو اختر من الاختيارات">
        <datalist id="${listId}">
          ${opts.map(o=>`<option value="${categorySpecEscape(o)}"></option>`).join('')}
        </datalist>
        ${opts.length?`<div class="cat-cell-quick-label">اختيارات سريعة:</div><div class="cat-cell-quick-options">
          ${opts.map(o=>`<button type="button" class="cat-cell-quick-chip" data-cat-quick-key="${categorySpecEscape(spec.key)}" data-cat-quick-value="${categorySpecEscape(o)}">${categorySpecEscape(o)}</button>`).join('')}
        </div>`:''}
      </div>`;
    }else if(type==='number'){
      control=`<input class="cat-cell-spec-control" type="number" data-cat-spec-value="${categorySpecEscape(spec.key)}" value="${categorySpecEscape(value)}" placeholder="القيمة">`;
    }else{
      control=`<input class="cat-cell-spec-control" type="text" data-cat-spec-value="${categorySpecEscape(spec.key)}" value="${categorySpecEscape(value)}" placeholder="القيمة">`;
    }
    return `<div class="cat-cell-spec-row" data-cat-cell-spec="${categorySpecEscape(spec.key)}">
      <label>${categorySpecEscape(spec.label||spec.key)}${unit}</label>${control}
    </div>`;
  }).join('');

  container.innerHTML=defs.length
    ? `<div class="cat-cell-spec-box">
        <div class="cat-cell-spec-title">📋 مواصفات فئة «${categorySpecEscape(category||'بدون فئة')}»</div>
        <div class="cat-cell-spec-sub">هذه الحقول مأخوذة مباشرة من جدول الفئة. أي مواصفة تضيفها هناك تظهر هنا تلقائيًا.</div>
        <div class="cat-cell-spec-grid">${rows}</div>
      </div>`
    : `<div class="cat-cell-spec-box">
        <div class="cat-cell-spec-title">📋 مواصفات الفئة</div>
        <div class="cat-cell-spec-sub">لا توجد مواصفات معرفة لهذه الفئة حاليًا.</div>
      </div>`;

  container.querySelectorAll('[data-cat-quick-value]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=btn.dataset.catQuickKey;
      const spec=defs.find(s=>s.key===key);
      const input=container.querySelector(`[data-cat-spec-value="${CSS.escape(key)}"]`);
      if(spec && input){
        input.value=btn.dataset.catQuickValue||'';
        setCategorySpecValue(targetObj,spec,input.value);
        container.querySelectorAll(`[data-cat-quick-key="${CSS.escape(key)}"]`).forEach(x=>x.classList.remove('active'));
        btn.classList.add('active');
        if(typeof onChange==='function') onChange();
      }
    });
  });
  container.querySelectorAll('[data-cat-spec-value]').forEach(el=>{
    el.addEventListener('input',()=>{
      const key=el.dataset.catSpecValue;
      const spec=defs.find(s=>s.key===key);
      if(spec) setCategorySpecValue(targetObj,spec,el.value);
      if(typeof onChange==='function') onChange();
    });
    el.addEventListener('change',()=>{
      const key=el.dataset.catSpecValue;
      const spec=defs.find(s=>s.key===key);
      if(spec) setCategorySpecValue(targetObj,spec,el.value);
      if(typeof onChange==='function') onChange();
    });
  });
}
function categorySpecsHTML(comp){
  if(!comp) return '';
  const defs=categorySpecDefs(comp.category);
  const rows=defs.map(spec=>{
    const value=getCategorySpecValue(comp,spec);
    if(value===null || value===undefined || String(value)==='') return '';

  }).filter(Boolean).join('');
  return rows ? `<div class="cat-cell-spec-view"><div class="cat-cell-spec-view-title">📋 مواصفات الفئة</div>${rows}</div>` : '';
}

/* ============================= INDEXEDDB PERSISTENCE ============================= */
let dbPromise=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(DB_NAME,DB_VERSION);
      req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    }catch(e){reject(e);}
  });
  return dbPromise;
}
async function idbGet(key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly');
    const r=tx.objectStore(STORE).get(key);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
async function idbSet(key,val){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(val,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}

/* ============================= DETAILED AUDIT HISTORY =============================
   يسجل كل تغيير فعلي في الخلية/المكون حتى لو كان تغيير حرف واحد في صفة أو توثيق.
   لا نستخدم usageHistory لهذا الغرض حتى لا نخلط بين حركة المخزون وسجل التعديلات.
*/
let auditBaseline='';
let auditReady=false;
const AUDIT_MAX_PER_SAVE=80;
const AUDIT_MAX_TOTAL=10000;

function auditClone(v){
  try{return JSON.parse(JSON.stringify(v));}catch(e){return v;}
}
function auditProjection(){
  if(!state) return {};
  const x=auditClone(state)||{};
  delete x.usageHistory; delete x.history; delete x.future; delete x.auditHistory;
  return x;
}
function auditSafeString(v){
  if(v===undefined)return 'غير موجود';
  if(v===null)return 'فارغ';
  if(typeof v==='object'){
    try{const j=JSON.stringify(v); return j.length>260?j.slice(0,257)+'…':j;}catch(e){return String(v);}
  }
  const t=String(v);
  return t.length>260?t.slice(0,257)+'…':t;
}
function auditFieldLabel(path,kind,ownerId){
  const m=String(path||'').split('.');
  const key=m[m.length-1]||'';
  if(kind==='cell'){
    const map={quantity:'الكمية',componentId:'المكون',dateAdded:'تاريخ الإضافة',indicator:'مؤشر الخلية',indicators:'مؤشرات الخلية',section:'التوثيق الفني',boxId:'العبوة',index:'رقم الخلية'};
    if(map[key]) return map[key];
    if(m.includes('customSpecs')){
      const comp=findComponent(ownerId); const specKey=key;
      const def=comp?categorySpecDefs(comp.category).find(x=>x.key===specKey):null;
      return 'مواصفة: '+(def?.label||specKey);
    }
    if(m.includes('customFields')){
      const comp=findComponent(ownerId); const def=comp?categoryFieldDefs(comp.category).find(x=>x.key===key):null;
      return 'حقل بيانات: '+(def?.label||key);
    }
  }
  if(kind==='component'){
    const base={name:'اسم المكون',partNumber:'رقم القطعة',manufacturer:'الشركة المصنعة',category:'الفئة',subcategory:'النوع الفرعي',package:'الحزمة',value:'القيمة',voltage:'الجهد',current:'التيار',power:'القدرة',tolerance:'السماح',frequency:'التردد',datasheet:'الداتا شيت',supplier:'المورد',supplierPartNumber:'رقم المورد',purchasePrice:'سعر الشراء',warningStock:'حد التحذير',criticalStock:'الحد الحرج',targetStock:'هدف المخزون',reorderQty:'كمية إعادة الطلب',notes:'الملاحظات',customSpecs:'مواصفات الفئة',customFields:'حقول بيانات المكون',images:'الصور',links:'الروابط'};
    if(base[key]) return base[key];
    if(m.includes('customSpecs')){const def=categorySpecDefs(state.components.find(c=>c.id===ownerId)?.category).find(x=>x.key===key);return 'مواصفة: '+(def?.label||key);}
    if(m.includes('customFields')){const c=state.components.find(x=>x.id===ownerId);const def=categoryFieldDefs(c?.category).find(x=>x.key===key);return 'حقل بيانات: '+(def?.label||key);}
  }
  if(kind==='category') return 'إعدادات الفئة: '+key;
  if(kind==='layout') return 'تخطيط التخزين: '+key;
  return key||'تعديل';
}
function auditDeepDiff(a,b,path,out,limit,depth){
  if(out.length>=limit)return;
  if(a===b)return;
  if(depth>7){out.push({path,oldValue:a,newValue:b});return;}
  const ao=a&&typeof a==='object', bo=b&&typeof b==='object';
  if(!ao||!bo){out.push({path,oldValue:a,newValue:b});return;}
  if(Array.isArray(a)||Array.isArray(b)){
    const aa=Array.isArray(a)?a:[], bb=Array.isArray(b)?b:[];
    const n=Math.max(aa.length,bb.length);
    for(let i=0;i<n&&out.length<limit;i++) auditDeepDiff(aa[i],bb[i],path+'['+i+']',out,limit,depth+1);
    return;
  }
  const keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
  for(const k of keys){ if(out.length>=limit)break; auditDeepDiff(a?.[k],b?.[k],path?path+'.'+k:k,out,limit,depth+1); }
}
function auditIndexById(arr){const m=new Map();(Array.isArray(arr)?arr:[]).forEach(x=>{if(x&&x.id!=null)m.set(String(x.id),x)});return m;}
function auditRecord(kind,id,cellId,componentId,field,oldValue,newValue,extra){
  const cell=cellId?findContainer(cellId):null;
  const comp=componentId?findComponent(componentId):null;
  const componentName=comp?.name||extra?.componentName||'—';
  const rec={id:uid('audit'),date:nowISO(),kind,action:'تعديل',cellId:cellId||null,componentId:componentId||null,componentName,location:cellId?locationLabel(cellId):(extra?.location||''),field:field||'',oldValue:auditSafeString(oldValue),newValue:auditSafeString(newValue),oldValueRaw:auditClone(oldValue),newValueRaw:auditClone(newValue),description:extra?.description||''};
  if(!Array.isArray(state.auditHistory))state.auditHistory=[];
  state.auditHistory.unshift(rec);
  if(state.auditHistory.length>AUDIT_MAX_TOTAL)state.auditHistory.length=AUDIT_MAX_TOTAL;
}
function auditCaptureChanges(){
  if(!auditReady||!state)return;
  let now;
  try{now=JSON.stringify(auditProjection());}catch(e){return;}
  if(!auditBaseline){auditBaseline=now;return;}
  if(now===auditBaseline)return;
  let before,after;try{before=JSON.parse(auditBaseline);after=JSON.parse(now);}catch(e){auditBaseline=now;return;}
  const created=[];
  const bc=auditIndexById(before.containers), ac=auditIndexById(after.containers);
  const bcomp=auditIndexById(before.components), acomp=auditIndexById(after.components);
  const cellIds=new Set([...bc.keys(),...ac.keys()]);
  for(const id of cellIds){
    const diffs=[];auditDeepDiff(bc.get(id)||{},ac.get(id)||{},'',diffs,30,0);
    const current=ac.get(id)||bc.get(id); const compId=current?.componentId||bc.get(id)?.componentId||null;
    diffs.forEach(d=>created.push({kind:'cell',cellId:id,componentId:compId,field:d.path.replace(/^\./,''),oldValue:d.oldValue,newValue:d.newValue,description:'تعديل داخل الخلية'}));
  }
  const compIds=new Set([...bcomp.keys(),...acomp.keys()]);
  for(const id of compIds){
    const diffs=[];auditDeepDiff(bcomp.get(id)||{},acomp.get(id)||{},'',diffs,30,0);
    const affected=(state.containers||[]).filter(c=>c.componentId===id).map(c=>c.id);
    if(!affected.length) diffs.forEach(d=>created.push({kind:'component',componentId:id,field:d.path.replace(/^\./,''),oldValue:d.oldValue,newValue:d.newValue,description:'تعديل في بيانات المكون'}));
    else diffs.forEach(d=>affected.forEach(cid=>created.push({kind:'cell',cellId:cid,componentId:id,field:d.path.replace(/^\./,''),oldValue:d.oldValue,newValue:d.newValue,description:'تعديل في بيانات المكون المرتبط بالخلية'})));
  }
  const simpleKinds=[['categorySchemas','category'],['categories','category'],['shelves','layout'],['drawers','layout'],['columns','layout'],['boxes','layout'],['workshopMap','layout'],['preferences','layout'],['projects','layout'],['experiments','layout'],['purchases','layout'],['checklist','layout']];
  simpleKinds.forEach(([key,kind])=>{
    const diffs=[];auditDeepDiff(before[key],after[key],key,diffs,20,0);
    diffs.forEach(d=>created.push({kind,field:d.path,oldValue:d.oldValue,newValue:d.newValue,description:kind==='category'?'تعديل في الفئات والمواصفات':'تعديل في بيانات البرنامج'}));
  });
  if(created.length){
    const room=Math.max(0,AUDIT_MAX_TOTAL-(state.auditHistory?.length||0));
    created.slice(0,Math.min(AUDIT_MAX_PER_SAVE,room)).forEach(x=>auditRecord(x.kind,x.cellId,x.cellId,x.componentId,auditFieldLabel(x.field,x.kind,x.componentId),x.oldValue,x.newValue,{description:x.description}));
  }
  auditBaseline=now;
}
function initAuditTracker(){
  if(!state)return;
  if(!Array.isArray(state.auditHistory))state.auditHistory=[];
  try{auditBaseline=JSON.stringify(auditProjection());auditReady=true;}catch(e){auditBaseline='';auditReady=false;}
}
function resetAuditTracker(){auditReady=false;auditBaseline='';if(state&&!Array.isArray(state.auditHistory))state.auditHistory=[];try{auditBaseline=JSON.stringify(auditProjection());auditReady=true;}catch(e){} }

/* ================= RUNTIME PERSISTENCE BRIDGE v1 =================
   كل ما يمكن أن يعيش خارج state يدخل في النسخة الموحدة أيضًا.
*/
const RUNTIME_PERSIST_KEY='__runtimePersistence';
function getPortableLocalStorageSafe(){
  const out={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||k.startsWith('__')||k===FALLBACK_KEY)continue;const v=localStorage.getItem(k);if(v!==null)out[k]=v;}}catch(_e){}
  return out;
}
function captureRuntimeLocalStorageIntoState(){
  if(!state)return;
  const ls=getPortableLocalStorageSafe();
  state[RUNTIME_PERSIST_KEY]=state[RUNTIME_PERSIST_KEY]&&typeof state[RUNTIME_PERSIST_KEY]==='object'?state[RUNTIME_PERSIST_KEY]:{};
  state[RUNTIME_PERSIST_KEY].localStorage=ls;
  state[RUNTIME_PERSIST_KEY].capturedAt=new Date().toISOString();
}
function restoreRuntimeLocalStorageFromState(){
  try{const data=state?.[RUNTIME_PERSIST_KEY]?.localStorage;if(data&&typeof data==='object')restorePortableLocalStorage(data,{warnings:[]});}catch(_e){}
}
let runtimeLocalStorageFingerprint='';
function runtimeLocalStorageFingerprintNow(){try{return JSON.stringify(getPortableLocalStorageSafe());}catch(_e){return '';}}
function startRuntimePersistenceWatcher(){
  runtimeLocalStorageFingerprint=runtimeLocalStorageFingerprintNow();
  setInterval(()=>{const fp=runtimeLocalStorageFingerprintNow();if(fp!==runtimeLocalStorageFingerprint){runtimeLocalStorageFingerprint=fp;try{scheduleSave();}catch(_e){}}},1500);
}

function scheduleSave(){
  try{captureRuntimeLocalStorageIntoState();}catch(_e){}
  auditCaptureChanges();
  saveDirty=true;
  setSaveBadge('pending');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,500);
  syncLowStockToHub();
}
const MAX_EMERGENCY_LOCALSTORAGE_BYTES = 1800000;
let saveRevision = 0;
let saveInFlight = false;
let saveQueued = false;
async function doSave(){
  if(saveInFlight){ saveQueued=true; return; }
  saveInFlight=true;
  try{
    captureRuntimeLocalStorageIntoState();
    const json=JSON.stringify(state);
    const revision=++saveRevision;
    // التخزين الرئيسي: IndexedDB. لا نستخدم localStorage كقاعدة البيانات لأنه صغير ومناسب فقط للطوارئ.
    await idbSet(STATE_KEY,json);
    await idbSet('state_meta',{revision,savedAt:new Date().toISOString(),bytes:json.length,storage:'indexeddb'});
    // نسخة طوارئ صغيرة فقط إذا كانت الحالة صغيرة؛ الملفات الكبيرة لا تدخل هنا إطلاقاً.
    if(json.length<=MAX_EMERGENCY_LOCALSTORAGE_BYTES){
      try{ localStorage.setItem(FALLBACK_KEY,json); }catch(e){}
    }
    saveDirty=false;
    setSaveBadge('saved');
  }catch(e){
    // محاولة أخيرة للنسخة المحلية الصغيرة فقط.
    try{
      const json=JSON.stringify(state);
      if(json.length<=MAX_EMERGENCY_LOCALSTORAGE_BYTES){ localStorage.setItem(FALLBACK_KEY,json); setSaveBadge('saved'); }
      else setSaveBadge('fail','تعذر الحفظ في IndexedDB؛ والحالة أكبر من مساحة النسخة الاحتياطية المحلية.');
    }catch(e2){ setSaveBadge('fail',String(e2?.message||e?.message||e)); }
  }finally{
    saveInFlight=false;
    if(saveQueued){ saveQueued=false; scheduleSave(); }
  }
}

/* انتظار اكتمال آخر حفظ فعلي قبل أي Export/Import. هذا يمنع تصدير نسخة أقدم
   عندما يكون هناك مؤقت حفظ أو عملية IndexedDB ما زالت تعمل. */
async function flushSaveForBackup(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  for(let i=0;i<250;i++){
    if(saveInFlight){ await new Promise(r=>setTimeout(r,20)); continue; }
    if(saveDirty){ await doSave(); continue; }
    if(saveQueued){ await new Promise(r=>setTimeout(r,20)); continue; }
    return true;
  }
  throw new Error('انتهى وقت انتظار الحفظ التلقائي؛ لم يكتمل الحفظ قبل النسخ الاحتياطي.');
}
async function verifyPersistedStateForBackup(){
  await flushSaveForBackup();
  const persisted=await idbGet(STATE_KEY);
  if(typeof persisted!=='string' || !persisted.length) throw new Error('تعذر التحقق من state المحفوظ في IndexedDB.');
  let parsed; try{ parsed=JSON.parse(persisted); }catch(e){ throw new Error('بيانات الحالة المحفوظة غير صالحة JSON.'); }
  return parsed;
}
function flushSaveNow(){
  try{
    const json=JSON.stringify(state);
    if(json.length<=MAX_EMERGENCY_LOCALSTORAGE_BYTES){ try{ localStorage.setItem(FALLBACK_KEY,json); }catch(e){} }
    try{ idbSet(STATE_KEY,json).catch(()=>{}); }catch(e){}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSaveNow(); });
window.addEventListener('pagehide',flushSaveNow);
window.addEventListener('beforeunload',flushSaveNow);
setInterval(()=>{if(saveDirty&&!saveInFlight)doSave();},10000);

/* ترقية البيانات القديمة (رفوف بها صفوف/أعمدة شبكية) إلى نظام الأعمدة/العبوات/الخلايا الجديد */
function migrateStateIfNeeded(){
  if(!state || state.columns) return; // بيانات جديدة بالفعل أو لا توجد بيانات
  const oldContainersById={};
  (state.containers||[]).forEach(c=>{ oldContainersById[c.id]=c; });
  state.columns=[]; state.boxes=[]; state.containers=[];
  [...(state.shelves||[]),...(state.drawers||[])].forEach(rack=>{
    const oldCells=rack.cells||[];
    const oldCols=rack.cols||(oldCells.length?Math.max(...oldCells.map(c=>c.col)):0);
    const oldRows=rack.rows||(oldCells.length?Math.max(...oldCells.map(c=>c.row)):0);
    for(let c=1;c<=oldCols;c++){
      const col={id:uid('col'),rackId:rack.id,order:c,name:'عمود '+c};
      state.columns.push(col);
      const box={id:uid('box'),columnId:col.id,order:1,label:'عبوة '+c,cellCount:oldRows};
      state.boxes.push(box);
      for(let r=1;r<=oldRows;r++){
        const oldCell=oldCells.find(x=>x.row===r&&x.col===c);
        let componentId=null, quantity=0;
        if(oldCell && oldCell.containerId){
          const oldCont=oldContainersById[oldCell.containerId];
          if(oldCont){ componentId=oldCont.componentId; quantity=Number(oldCont.quantity||0); }
        }
        state.containers.push({id:uid('cell'),boxId:box.id,index:r-1,componentId,quantity,dateAdded:nowISO()});
      }
    }
    delete rack.cells; delete rack.cols; delete rack.rows;
  });
  scheduleSave();
}

/* يضمن وجود تقسيمة صفوف/أعمدة لكل عبوة (للبيانات القديمة التي بها عدد خلايا فقط) وقائمة تشيك ليست */
function ensureNewFields(){
  let changed=false;
  (state.boxes||[]).forEach(b=>{
    if(!b.rows || !b.cols){
      b.rows=1; b.cols=b.cellCount||cellsOfBox(b.id).length||1; changed=true;
    }
  });
  if(!state.checklist){ state.checklist=[]; changed=true; }
  if(!Array.isArray(state.auditHistory)){ state.auditHistory=[]; changed=true; }
  if(!state.purchases) state.purchases=[];
  if(!state.uiTheme){ state.uiTheme='amber'; changed=true; }
  if(!Array.isArray(state.categories)) { state.categories=[...DEFAULT_CATEGORIES]; changed=true; }
  else { const merged=[...state.categories]; DEFAULT_CATEGORIES.forEach(c=>{ if(!merged.includes(c)) merged.push(c); }); if(merged.length!==state.categories.length){ state.categories=merged; changed=true; } }
  if(ensureCategorySchemas()) changed=true;
  if(changed) scheduleSave();
}
function applyUiTheme(){
  document.documentElement.setAttribute('data-theme', (state&&state.uiTheme)||'amber');
}

async function loadState(){
  try{
    const raw=await idbGet(STATE_KEY);
    if(raw){ state=JSON.parse(raw); restoreRuntimeLocalStorageFromState(); migrateStateIfNeeded(); ensureNewFields(); ensureStoragePreferences(); applyPreferences(); applyUiTheme(); return; }
  }catch(e){}
  try{
    const raw=localStorage.getItem(FALLBACK_KEY);
    if(raw){ state=JSON.parse(raw); restoreRuntimeLocalStorageFromState(); migrateStateIfNeeded(); ensureNewFields(); ensureStoragePreferences(); applyPreferences(); applyUiTheme(); scheduleSave(); return; }
  }catch(e){}
  state=seedState();
  ensureStoragePreferences();
  applyPreferences();
  applyUiTheme();
  scheduleSave();
}

/* ============================= HELPERS: DATA QUERIES ============================= */
function allRacks(){ return [...state.shelves, ...state.drawers]; }
function findBox(id){ return state.boxes.find(b=>b.id===id); }
function findColumn(id){ return state.columns.find(c=>c.id===id); }
function columnsOfRack(rackId){ return state.columns.filter(c=>c.rackId===rackId).sort((a,b)=>a.order-b.order); }
function boxesOfColumn(colId){ return state.boxes.filter(b=>b.columnId===colId).sort((a,b)=>a.order-b.order); }
function cellsOfBox(boxId){ return state.containers.filter(c=>c.boxId===boxId).sort((a,b)=>a.index-b.index); }
function findContainer(id){ return state.containers.find(c=>c.id===id); } // "container" هنا = خلية (تحمل مكون+كمية مباشرة)
function findCell(cellId){ return findContainer(cellId); }
function findRackByCellId(cellId){
  const cell=findContainer(cellId); if(!cell) return null;
  const box=findBox(cell.boxId); if(!box) return null;
  const col=findColumn(box.columnId); if(!col) return null;
  return allRacks().find(r=>r.id===col.rackId)||null;
}
function findComponent(id){ return state.components.find(c=>c.id===id); }
function containerOfComponent(compId){ return state.containers.filter(c=>c.componentId===compId); }
function totalQtyOfComponent(compId){ return containerOfComponent(compId).reduce((s,c)=>s+Number(c.quantity||0),0); }
function cellStatus(cell){
  if(!cell.componentId) return 'empty';
  const comp=findComponent(cell.componentId);
  if(!comp) return 'gray';
  const q=Number(cell.quantity||0);
  if(q<=Number(comp.criticalStock||0)) return 'red';
  if(q<=Number(comp.warningStock||0)) return 'yellow';
  return 'green';
}
function locationLabel(cellId){
  if(!cellId) return 'غير مخصص (مؤقت)';
  const cell=findContainer(cellId); if(!cell) return cellId;
  const box=findBox(cell.boxId); if(!box) return cellId;
  const col=findColumn(box.columnId);
  const rack=col? allRacks().find(r=>r.id===col.rackId): null;
  if(!rack||!col) return `${box.label} · خلية ${cell.index+1}`;
  return `${rack.name} · ${col.name} · ${box.label} · خلية ${cell.index+1}`;
}
function statusColor(s){ return {green:'#3ddc84',yellow:'#f2c53d',red:'#ff5d5d',empty:'#5d6c7d',gray:'#5d6c7d'}[s]||'#5d6c7d'; }
function statusLabelAr(s){ return {green:'طبيعي',yellow:'تحذير',red:'حرج',empty:'فارغ',gray:'غير معروف'}[s]||s; }

/* ============================= MODAL SYSTEM ============================= */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(title,bodyHTML,footHTML,tabs){
  const root=document.getElementById('modalRoot');
  let tabsHTML='';
  if(tabs&&tabs.length){
    tabsHTML='<div class="modal-tabs">'+tabs.map((t,i)=>`<button class="mtab ${i===0?'active':''}" data-mtab="${t.id}">${t.label}</button>`).join('')+'</div>';
  }
  root.innerHTML=`<div class="modal-backdrop" id="mbackdrop">
    <div class="modal-box">
      <div class="modal-head"><h2>${title}</h2><button class="close" id="mclose">✕</button></div>
      ${tabsHTML}
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML?`<div class="modal-foot">${footHTML}</div>`:''}
    </div>
  </div>`;
  document.getElementById('mclose').onclick=closeModal;
  document.getElementById('mbackdrop').addEventListener('click',e=>{ if(e.target.id==='mbackdrop') closeModal(); });
  if(tabs&&tabs.length){
    root.querySelectorAll('.mtab').forEach(btn=>{
      btn.onclick=()=>{
        root.querySelectorAll('.mtab').forEach(b=>b.classList.remove('active'));
        root.querySelectorAll('.mpanel').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        const p=root.querySelector(`.mpanel[data-panel="${btn.dataset.mtab}"]`);
        if(p) p.classList.add('active');
      };
    });
  }
}

      <div class="field-row full"><div class="field"><label>ملاحظات المكون</label><textarea id="noteText" rows="4">${comp.notes||''}</textarea></div></div>
      <div class="field-row full"><div class="field"><label>روابط صور (رابط لكل سطر)</label><textarea id="imgLinks" rows="3">${(comp.images||[]).join('\\n')}</textarea></div></div>
      <div class="field-row full"><div class="field"><label>روابط مفيدة (Datasheet, ...)</label><textarea id="usefulLinks" rows="2">${(comp.links||[]).join('\\n')}</textarea></div></div>
      <button class="btn small primary" id="saveNotesBtn">حفظ</button>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">${(comp.images||[]).map(u=>`<img src="${u}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--border-lt);">`).join('')}</div>
    </div>

    <div class="mpanel" data-panel="doc">
      <div id="secMount_${cellId}" class="sec-scope"></div>
    </div>

    <div class="mpanel" data-panel="move">
      <div class="field-row full"><div class="field"><label>نقل المكون إلى خلية فارغة أخرى</label>
        <select id="moveTarget"><option value="">— اختر خلية فارغة —</option>${emptyCellOptions()}</select>
      </div></div>
      <button class="btn small" id="doMoveBtn">تنفيذ النقل</button>
      <hr style="border-color:var(--border);margin:14px 0;">
      <button class="btn danger small" id="delContBtn">إفراغ هذه الخلية</button>
    </div>
  `;
  openModal(`${cellId}`,body,'',tabs);

  // وثّق هذه الخلية: نظام السكشن الكامل (شرح+أكواد+جداول+رسم+خريطة ذهنية)
  // نؤجل التركيب لحد ما التبويب يُفتح فعليًا، عشان الرسم/الخريطة الذهنية محتاجين مساحة ظاهرة على الشاشة عشان يتحسبوا صح
  let secMounted=false;
  const docTabBtn=document.querySelector('.mtab[data-mtab="doc"]');
  if(docTabBtn){
    docTabBtn.addEventListener('click',()=>{
      if(secMounted) return;
      secMounted=true;
      const secMountEl=document.getElementById('secMount_'+cellId);
      if(secMountEl && window.mountCellSection) window.mountCellSection(secMountEl, cont);
    });
  }

  // wire actions
  wireCellIndicatorSettings(cont, cellId);
  document.getElementById('editCompBtn').onclick=()=>openEditComponent(comp.id,()=>openCellDetail(cellId));
  document.getElementById('saveStockBtn').onclick=()=>{
    cont.quantity=Number(document.getElementById('stQty').value||0);
    comp.warningStock=Number(document.getElementById('stWarn').value||0);
    comp.criticalStock=Number(document.getElementById('stCrit').value||0);
    comp.targetStock=Number(document.getElementById('stTarget').value||0);
    scheduleSave(); closeModal(); showView(currentView); toast('تم تحديث إعدادات المخزون');
  };
  document.getElementById('useBtn').onclick=()=>{
    const q=Number(document.getElementById('useQty').value||0);
    if(q<=0||q>cont.quantity){ toast('كمية غير صالحة'); return; }
    cont.quantity-=q;
    const projName=document.getElementById('useProject').value.trim();
    let proj=state.projects.find(p=>p.name===projName);
    if(projName && !proj){ proj={id:uid('proj'),name:projName,description:'',date:nowISO(),componentsUsed:[]}; state.projects.push(proj); }
    if(proj) proj.componentsUsed.push({componentId:comp.id,qty:q,date:nowISO()});
    state.usageHistory.unshift({id:uid('h'),date:nowISO(),componentId:comp.id,type:'use',qtyChange:-q,project:projName,purpose:document.getElementById('usePurpose').value,notes:document.getElementById('useNotes').value,fromLocation:cellId,toLocation:''});
    scheduleSave(); closeModal(); showView(currentView); toast(`تم تسجيل استخدام ${q} قطعة`);
  };
  document.getElementById('recvBtn').onclick=()=>{
    const q=Number(document.getElementById('recvQty').value||0);
    if(q<=0){ toast('كمية غير صالحة'); return; }
    cont.quantity+=q;
    state.usageHistory.unshift({id:uid('h'),date:nowISO(),componentId:comp.id,type:'purchase',qtyChange:q,project:'',purpose:'استلام مشتريات',notes:'المورد: '+(document.getElementById('recvSupplier').value||'-'),fromLocation:'',toLocation:cellId});
    const pIdx=state.purchases.findIndex(p=>p.componentId===comp.id && p.status==='pending');
    if(pIdx>-1) state.purchases.splice(pIdx,1);
    scheduleSave(); closeModal(); showView(currentView); toast('تم تسجيل الاستلام');
  };
  document.getElementById('addExpBtn').onclick=()=>{
    const name=document.getElementById('exName').value.trim();
    if(!name){ toast('أدخل اسم التجربة'); return; }
    state.experiments.unshift({id:uid('exp'),componentId:comp.id,name,date:nowISO(),circuit:document.getElementById('exCircuit').value,voltage:document.getElementById('exVolt').value,current:document.getElementById('exCurr').value,frequency:document.getElementById('exFreq').value,temperature:document.getElementById('exTemp').value,measurement:document.getElementById('exMeasure').value,result:document.getElementById('exResult').value,notes:document.getElementById('exNotes').value,images:[],project:''});
    scheduleSave(); closeModal(); showView(currentView); toast('تم حفظ التجربة');
  };
  document.getElementById('saveNotesBtn').onclick=()=>{
    comp.notes=document.getElementById('noteText').value;
    comp.images=document.getElementById('imgLinks').value.split('\\n').map(s=>s.trim()).filter(Boolean);
    comp.links=document.getElementById('usefulLinks').value.split('\\n').map(s=>s.trim()).filter(Boolean);
    scheduleSave(); closeModal(); showView(currentView); toast('تم حفظ الملاحظات');
  };
  document.getElementById('doMoveBtn').onclick=()=>{
    const target=document.getElementById('moveTarget').value;
    if(!target){ toast('اختر خلية هدف'); return; }
    moveContainer(cont.id,target);
    closeModal(); showView(currentView); toast('تم النقل بنجاح');
  };
  document.getElementById('delContBtn').onclick=()=>{
    if(!confirm('هل أنت متأكد من إفراغ هذه الخلية؟ ستبقى الخلية نفسها موجودة داخل العبوة.')) return;
    cont.componentId=null; cont.quantity=0;
    scheduleSave(); closeModal(); showView(currentView); toast('تم إفراغ الخلية');
  };
}

function emptyCellOptions(){
  let out='';
  state.containers.filter(c=>!c.componentId).forEach(c=>{ out+=`<option value="${c.id}">${locationLabel(c.id)}</option>`; });
  return out;
}

function moveContainer(fromCellId,targetCellId){
  const fromCell=findContainer(fromCellId);
  const targetCell=findContainer(targetCellId);
  if(!fromCell||!targetCell||fromCellId===targetCellId) return;
  if(targetCell.componentId){
    if(!confirm('الخلية الهدف بها مكون آخر بالفعل. هل تريد تبديل محتوى الخليتين؟')) return;
    const tmpComp=targetCell.componentId, tmpQty=targetCell.quantity;
    targetCell.componentId=fromCell.componentId; targetCell.quantity=fromCell.quantity;
    fromCell.componentId=tmpComp; fromCell.quantity=tmpQty;
  } else {
    targetCell.componentId=fromCell.componentId; targetCell.quantity=fromCell.quantity;
    fromCell.componentId=null; fromCell.quantity=0;
  }
  state.usageHistory.unshift({id:uid('h'),date:nowISO(),componentId:targetCell.componentId,type:'move',qtyChange:0,project:'',purpose:'نقل مكون بين الخلايا',notes:'',fromLocation:fromCellId,toLocation:targetCellId});
  scheduleSave();
}

function histRowHTML(h){
  const comp=findComponent(h.componentId);
  const icoMap={use:'📤',purchase:'📥',move:'🔀',adjust:'✏️'};
  const signed=h.qtyChange>0?`+${h.qtyChange}`:(h.qtyChange<0?`${h.qtyChange}`:'');
  let desc='';
  if(h.type==='use') desc=`استخدام ${signed} قطعة${h.project?(' · مشروع: '+h.project):''}${h.purpose?(' · '+h.purpose):''}`;
  else if(h.type==='purchase') desc=`إضافة/شراء ${signed} قطعة${h.notes?(' · '+h.notes):''}`;
  else if(h.type==='move') desc=`نُقلت من ${h.fromLocation||'—'} إلى ${h.toLocation||'—'}`;
  else desc=h.purpose||'';
  return `<div class="hist-row"><div class="hist-ico ${h.type}">${icoMap[h.type]||'•'}</div>
    <div class="hist-main"><b>${comp?comp.name:'مكون محذوف'}</b><div class="d">${fmtDate(h.date)}</div><div style="font-size:12px;margin-top:2px;">${desc}</div></div></div>`;
}
function expRowHTML(ex){

    <div style="display:flex;justify-content:space-between;"><b>${ex.name}</b><span class="pill ${ex.result==='PASS'?'green':'red'}">${ex.result}</span></div>

    ${ex.notes?`<div style="font-size:12px;margin-top:4px;">${ex.notes}</div>`:''}

    <div class="field-row"><div class="field"><label>القدرة (Power)</label><input id="ecPower" value="${comp.power||''}"></div>
    <div class="field"></div></div>

  `,`<button class="btn" id="ecCancel">إلغاء</button><button class="btn primary" id="ecSave">حفظ</button>`);

    comp.manufacturer=document.getElementById('ecMan').value;
    comp.package=document.getElementById('ecPkg').value;
