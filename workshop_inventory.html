function openImageDB(){
    if(imgDbPromise) return imgDbPromise;
    imgDbPromise = new Promise((resolve, reject) => {
      if(!("indexedDB" in window)){ reject(new Error("IndexedDB غير مدعوم في هذا المتصفح")); return; }
      const req = indexedDB.open(IMG_DB_NAME, IMG_DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(IMG_STORE)) db.createObjectStore(IMG_STORE);
        if(!db.objectStoreNames.contains(APP_STORE)) db.createObjectStore(APP_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return imgDbPromise;
  }

function genImageId(){ return "idbimg_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9); }

function fileKindFromMime(mime, name){
    mime = mime || ""; name = (name || "").toLowerCase();
    if(mime.indexOf("image/") === 0) return "image";
    if(mime.indexOf("video/") === 0) return "video";
    if(mime.indexOf("audio/") === 0) return "audio";
    if(mime === "application/pdf" || name.endsWith(".pdf")) return "pdf";
    return "other";
  }

function tblFileIconFor(mime, name){
    const kind = fileKindFromMime(mime, name);
    if(kind === "image") return "🖼️";
    if(kind === "video") return "🎬";
    if(kind === "audio") return "🎵";
    if(kind === "pdf") return "📄";
    const n = (name || "").toLowerCase();
    if(/\.(zip|rar|7z|tar|gz)$/.test(n)) return "📦";
    if(/\.(c|cpp|h|hpp|py|js|ts|java|json|html|css|asm|s|hex|ino|sh|php|rb|go|rs)$/.test(n)) return "💻";
    if(/\.(exe|bin|dll|so|apk)$/.test(n)) return "⚙️";
    if(/\.(doc|docx|xls|xlsx|ppt|pptx|txt|md)$/.test(n)) return "📃";
    return "📎";
  }

function formatFileSize(bytes){
    if(bytes == null || !isFinite(bytes)) return "";
    if(bytes < 1024) return bytes + " B";
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
    if(bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + " MB";
    if(bytes < 1024*1024*1024*1024) return (bytes/(1024*1024*1024)).toFixed(2) + " GB";
    return (bytes/(1024*1024*1024*1024)).toFixed(2) + " TB";
  }

function isIdbImageRef(ref){ return typeof ref === "string" && ref.indexOf("data:") !== 0 && ref.indexOf("idbimg_") === 0; }

function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

function base64ToBlob(dataUrl){
    const parts = dataUrl.split(",");
    const meta = parts[0]; const b64 = parts[1];
    const mimeMatch = meta.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type: mime});
  }

/* ============================= LARGE FILE STORAGE ============================= */
const LARGE_ASSET_THRESHOLD = 8 * 1024 * 1024; // 8MB: الملفات الكبيرة تذهب إلى OPFS عند توفره.
const ASSET_META_PREFIX = 'asset_meta:';
let opfsRootPromise=null;
async function getOPFSRoot(){
  if(opfsRootPromise) return opfsRootPromise;
  opfsRootPromise=(async()=>{
    if(!navigator.storage?.getDirectory) return null;
    const root=await navigator.storage.getDirectory();
    return await root.getDirectoryHandle('workshop-assets',{create:true});
  })().catch(()=>null);
  return opfsRootPromise;
}
async function opfsPut(id,blob){
  const dir=await getOPFSRoot(); if(!dir) throw new Error('OPFS غير متاح');
  const h=await dir.getFileHandle(String(id),{create:true});
  const w=await h.createWritable();
  try{ await w.write(blob); await w.close(); }catch(e){ try{await w.abort();}catch(_e){} throw e; }
}
async function opfsGet(id){
  const dir=await getOPFSRoot(); if(!dir) return null;
  try{ const h=await dir.getFileHandle(String(id)); return await h.getFile(); }catch(e){ return null; }
}
async function opfsDelete(id){
  const dir=await getOPFSRoot(); if(!dir) return;
  try{ await dir.removeEntry(String(id)); }catch(e){}
}
async function idbPutImage(id, blob, extraMeta={}){
  const meta={id:String(id),mime:blob?.type||extraMeta.mime||'application/octet-stream',size:Number(blob?.size||extraMeta.size||0),name:extraMeta.name||'',createdAt:extraMeta.createdAt||new Date().toISOString()};
  const shouldUseOPFS=meta.size>=LARGE_ASSET_THRESHOLD;
  if(shouldUseOPFS){
    try{
      await opfsPut(id,blob);
      meta.backend='opfs';
      await idbSet(ASSET_META_PREFIX+String(id),meta);
      return meta;
    }catch(e){ /* fallback to IndexedDB */ }
  }
  const db=await openImageDB();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(IMG_STORE,'readwrite');
    tx.objectStore(IMG_STORE).put(blob,id);
    tx.oncomplete=()=>resolve(true); tx.onerror=()=>reject(tx.error);
  });
  meta.backend='idb';
  try{ await idbSet(ASSET_META_PREFIX+String(id),meta); }catch(e){}
  return meta;
}
async function idbGetImage(id){
  const key=String(id);
  let meta=null; try{ meta=await idbGet(ASSET_META_PREFIX+key); }catch(e){}
  if(meta?.backend==='opfs'){
    const f=await opfsGet(key); if(f) return f;
    // لو ملف OPFS اختفى، جرّب نسخة IndexedDB القديمة إن وجدت.
  }
  try{
    const db=await openImageDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(IMG_STORE,'readonly'); const req=tx.objectStore(IMG_STORE).get(id);
      req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbDeleteImage(id){
  const key=String(id);
  await opfsDelete(key);
  try{
    const db=await openImageDB();
    await new Promise((resolve,reject)=>{const tx=db.transaction(IMG_STORE,'readwrite');tx.objectStore(IMG_STORE).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});
  }catch(e){}
  try{ await idbSet(ASSET_META_PREFIX+key,null); }catch(e){}
}
async function getAssetMeta(id){ try{return await idbGet(ASSET_META_PREFIX+String(id));}catch(e){return null;} }
async function listStoredAssetIds(){
  const ids=new Set();
  try{
    const db=await openImageDB();
    const keys=await new Promise((resolve,reject)=>{const tx=db.transaction(IMG_STORE,'readonly'),req=tx.objectStore(IMG_STORE).getAllKeys();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});
    keys.forEach(k=>ids.add(String(k)));
  }catch(e){}
  // metadata store contains OPFS assets even when the IndexedDB blob store is empty.
  try{
    const db=await openDB();
    const keys=await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).getAllKeys();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});
    keys.filter(k=>String(k).startsWith(ASSET_META_PREFIX)).forEach(k=>ids.add(String(k).slice(ASSET_META_PREFIX.length)));
  }catch(e){}
  return [...ids];
}
async function migrateLegacyDataUrlsToAssets(){
  if(!state || state.__largeAssetMigrationDone) return;
  let changed=false,converted=0;
  const seen=new WeakSet();
  async function walk(obj){
    if(!obj || typeof obj!=='object') return;
    if(seen.has(obj)) return; seen.add(obj);
    if(Array.isArray(obj)){
      for(let i=0;i<obj.length;i++){
        const v=obj[i];
        if(typeof v==='string' && v.startsWith('data:') && v.length>1000){
          try{const blob=base64ToBlob(v);const id=genImageId();await idbPutImage(id,blob,{mime:blob.type});obj[i]=id;changed=true;converted++;}catch(e){}
        }else if(v&&typeof v==='object') await walk(v);
      }
      return;
    }
    for(const k of Object.keys(obj)){
      const v=obj[k];
      if(typeof v==='string' && v.startsWith('data:') && v.length>1000){
        try{const blob=base64ToBlob(v);const id=genImageId();await idbPutImage(id,blob,{mime:blob.type});obj[k]=id;changed=true;converted++;}catch(e){}
      }else if(v&&typeof v==='object') await walk(v);
    }
  }
  try{ await walk(state); state.__largeAssetMigrationDone=true; if(changed) scheduleSave(); if(converted) console.info('Migrated embedded assets:',converted); }catch(e){}
}

let imgNaturalW = 0, imgNaturalH = 0, imgBaseScale = 1, imgZoomFactor = 1, imgTx = 0, imgTy = 0;;
const MIN_ZOOM = 0.5, MAX_ZOOM = 6;;
tblLightboxImgEl.addEventListener("load", ()=>{
    imgNaturalW = tblLightboxImgEl.naturalWidth;
    imgNaturalH = tblLightboxImgEl.naturalHeight;
    imgZoomFactor = 1;
    computeBaseScaleAndCenter();

  });

    e.stopPropagation();
    if(imgZoomFactor > 1.05){ imgZoomFactor = 1; computeBaseScaleAndCenter(); }
    else{ zoomBy(2.2, e.clientX, e.clientY); }
    applyImgTransform();
  });
tblLightboxStageEl.addEventListener("wheel", (e)=>{
    if(tblLightboxImgEl.style.display === "none") return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY);
  }, { passive:false });
const activePointers = new Map();;
let dragStart = null, dragMoved = false, pinchStartDist = null, pinchStartZoom = null;;
tblLightboxStageEl.addEventListener("pointerdown", (e)=>{
    if(tblLightboxImgEl.style.display === "none") return;
    tblLightboxStageEl.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    dragMoved = false;
    if(activePointers.size === 1){
      dragStart = { x:e.clientX, y:e.clientY, tx:imgTx, ty:imgTy };
      tblLightboxStageEl.classList.add("dragging");
    } else if(activePointers.size === 2){
      dragStart = null;
      const pts = Array.from(activePointers.values());
      pinchStartDist = ptDist(pts[0], pts[1]);
      pinchStartZoom = imgZoomFactor;
    }
  });
tblLightboxStageEl.addEventListener("pointermove", (e)=>{
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size === 1 && dragStart){
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if(Math.abs(dx) + Math.abs(dy) > 6) dragMoved = true;
      imgTx = dragStart.tx + dx; imgTy = dragStart.ty + dy;
      applyImgTransform();
    } else if(activePointers.size === 2 && pinchStartDist){
      dragMoved = true;
      const pts = Array.from(activePointers.values());
      const dist = ptDist(pts[0], pts[1]);
      const mid = ptMid(pts[0], pts[1]);
      const stageRect = tblLightboxStageEl.getBoundingClientRect();
      const oldScale = imgBaseScale * imgZoomFactor;
      let newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinchStartZoom * (dist / pinchStartDist)));
      const newScale = imgBaseScale * newZoom;
      const cx = mid.x - stageRect.left, cy = mid.y - stageRect.top;
      imgTx = cx - (cx - imgTx) * (newScale / oldScale);
      imgTy = cy - (cy - imgTy) * (newScale / oldScale);
      imgZoomFactor = newZoom;
      applyImgTransform();
    }
  });
tblLightboxStageEl.addEventListener("pointerup", releasePointer);
tblLightboxStageEl.addEventListener("pointercancel", releasePointer);
tblLightboxStageEl.addEventListener("pointerleave", (e)=>{ if(activePointers.has(e.pointerId)) releasePointer(e); });
window.addEventListener("resize", ()=>{
    if(tblLightboxEl.classList.contains("open") && tblLightboxImgEl.style.display !== "none" && imgNaturalW){

      <div class="block-body"><div class="mindmap-holder"></div></div>
    </div>

    <div class="card-footer">
      <button class="danger ghost" data-act="delete">🗑 مسح كل بيانات التوثيق</button>

  `;

  const holder = card.querySelector(".codes-holder");
  s.codes.forEach((c, ci)=>{ holder.appendChild(buildCodeBlock(s, c, ci)); });
  card.querySelector(".tables-holder").appendChild(buildTablesHolder(s));
  card.querySelector(".drawing-holder").appendChild(buildDrawingPanel(s));
  card.querySelector(".mindmap-holder").appendChild(buildMindMapPanel(s));

  const exHolder = card.querySelector('[data-act="extra-explanations-holder"]');
  s.explanations.forEach((box, bi)=>{ exHolder.appendChild(buildExtraExplainBox(s, box, bi)); });

  enhanceMarkdownView(card.querySelector('[data-act="explain-view"]'));

  const rerender = opts.rerender || function(){};

  card.querySelector('[data-act="star"]').addEventListener("click", ()=>{ s.starred=!s.starred; scheduleSave(); rerender(); });
  card.querySelector('[data-act="title"]').addEventListener("input", (e)=>{ s.title = e.target.value; scheduleSave(); });
  card.querySelector('[data-act="explain"]').addEventListener("input", (e)=>{ s.explanation = e.target.value; scheduleSave(); });
  {
    const viewEl = card.querySelector('[data-act="explain-view"]');
    const taEl = card.querySelector('[data-act="explain"]');
    const toolbarHolder = card.querySelector('[data-act="explain-toolbar-holder"]');
    toolbarHolder.appendChild(buildFormatToolbar(()=> taEl));
    viewEl.addEventListener("click", ()=>{
      viewEl.style.display = "none";

      taEl.style.display = "block";
      taEl.focus();

    taEl.addEventListener("blur", ()=>{
      viewEl.innerHTML = renderMarkdownLite(s.explanation);

      viewEl.style.display = "block";

  card.querySelector('[data-act="add-explain-box"]').addEventListener("click", ()=>{
    s.explanations.push({ id: secUid(), title: "", content: "" });

    btn.addEventListener("click", ()=>{

    });
  });
  card.querySelector('[data-act="expand-explain"]').addEventListener("click", ()=>{
    openFullscreen("الشرح — " + (s.title||"بدون عنوان"), (body)=>{
      const ta = document.createElement("textarea");
      ta.className = "explain";
      ta.style.minHeight = "160px";
      ta.value = s.explanation||"";
      const toolbar = buildFormatToolbar(()=> ta);
      const previewLabel = document.createElement("div");
      previewLabel.className = "section-label";
      previewLabel.style.marginTop = "16px";
      previewLabel.textContent = "🔍 معاينة الشكل النهائي";
      const preview = document.createElement("div");
      preview.className = "explain-view";
      preview.innerHTML = renderMarkdownLite(s.explanation||"");

      ta.addEventListener("input", (e)=>{
        s.explanation = e.target.value;

      body.appendChild(toolbar);

      body.appendChild(previewLabel);

      if(viewEl){ viewEl.innerHTML = renderMarkdownLite(s.explanation); enhanceMarkdownView(viewEl); }

  card.querySelector('[data-act="expand-tables"]').addEventListener("click", ()=>{

    holder2.after(placeholder);
    openFullscreen("جداول — " + (s.title||"بدون عنوان"), (body)=>{
      body.appendChild(holder2);
    }, ()=>{
      placeholder.replaceWith(holder2);
      placeholder.remove?.();
    });
  });
  card.querySelector('[data-act="expand-draw"]').addEventListener("click", ()=>{
    const panel = card.querySelector(".drawpanel");
    const placeholder = document.createComment("drawpanel-placeholder");
    panel.after(placeholder);
    openFullscreen("رسم توضيحي — " + (s.title||"بدون عنوان"), (body)=>{
      body.appendChild(panel);
      resizeDrawCanvas(panel.querySelector(".draw-canvas"), panel._drawState);

      placeholder.replaceWith(panel);
      resizeDrawCanvas(panel.querySelector(".draw-canvas"), panel._drawState);
      placeholder.remove?.();
    });

  card.querySelector('[data-act="expand-mindmap"]').addEventListener("click", ()=>{
    const panel = card.querySelector(".mindmap-panel");
    const placeholder = document.createComment("mindmap-placeholder");

      body.style.padding = "0";
      body.appendChild(panel);
      panel._mmState && panel._mmState.onResize && panel._mmState.onResize();
    }, ()=>{
      placeholder.replaceWith(panel);
      panel._mmState && panel._mmState.onResize && panel._mmState.onResize();
      placeholder.remove?.();
    });
  });

  function focusBlock(name){
    const block=card.querySelector(`[data-block="${name}"]`);
    if(!block) return;
    if(block.classList.contains("is-collapsed")){ block.classList.remove("is-collapsed"); const b=block.querySelector('[data-act="collapse"]'); if(b) b.textContent="⌃ طي"; }
    block.scrollIntoView({behavior:"smooth",block:"center"});

    setTimeout(()=>{block.style.boxShadow="";},900);

  card.querySelector('[data-act="quick-edit"]').addEventListener("click", ()=>{
    focusBlock("explain");
    setTimeout(()=>card.querySelector('[data-act="explain-view"]')?.click(),220);
  });
  card.querySelector('[data-act="addcode-quick"]').addEventListener("click", ()=>{
    focusBlock("codes");
    card.querySelector('[data-act="addcode"]')?.click();
  });
  card.querySelector('[data-act="addtable-quick"]').addEventListener("click", ()=>{
    focusBlock("tables");
    setTimeout(()=>card.querySelector('.add-table-row .btn-accent')?.click(),180);
  });
  card.querySelector('[data-act="focus-draw"]').addEventListener("click", ()=>focusBlock("draw"));
  card.querySelector('[data-act="focus-mindmap"]').addEventListener("click", ()=>focusBlock("mindmap"));
  card.querySelector('[data-act="toggle-all"]').addEventListener("click", ()=>{
    const blocks=[...card.querySelectorAll('.content-block')];
    const shouldCollapse=blocks.some(b=>!b.classList.contains('is-collapsed'));
    blocks.forEach(block=>{
      block.classList.toggle('is-collapsed',shouldCollapse);
      const b=block.querySelector('[data-act="collapse"]');
      if(b) b.textContent=shouldCollapse?'⌄ فتح':'⌃ طي';
    });
  });

  return card;
}

function mountCellSection(mountEl, cont){
  const s = ensureCellSection(cont);
  function doMount(){
    mountEl.innerHTML = "";
    window.__secRerender = doMount;
    mountEl.appendChild(buildSectionCard(s, { rerender: doMount }));
  }
  doMount();
}
window.mountCellSection = mountCellSection;

</script>
<script>
/* ============================= STORAGE VISUAL MOVE / RESIZE SYSTEM v4 ============================= */
(function(){
'use strict';
const KEY='storageVisualLayout_v4';
let mode='move', layout={};
try{layout=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){layout={};}
const SELECTOR='.rack-panel[data-rack-id],.rack-fullpage-wrap[data-rack-id],.rack-column[data-col-id],.vs3-full-column[data-col-id],.box-chip[data-box-id],.box-card[data-box-id],.vs3-full-book[data-box-id],.cell[data-cell-id]';
function save(){try{localStorage.setItem(KEY,JSON.stringify(layout));}catch(e){}}
function key(el){if(el.dataset.rackId)return'rack:'+el.dataset.rackId;if(el.dataset.colId)return'col:'+el.dataset.colId;if(el.dataset.boxId)return'box:'+el.dataset.boxId;if(el.dataset.cellId)return'cell:'+el.dataset.cellId;return null;}
function val(el){return layout[key(el)]||{dx:0,dy:0,sx:1,sy:1};}
function all(){return [...document.querySelectorAll('#viewContainer '+SELECTOR)];}
function select(el){all().forEach(x=>x.classList.remove('sv-selected'));if(el)el.classList.add('sv-selected');updateStatus();}
function apply(el){const v=layout[key(el)];if(!v){el.style.transform='';el.style.willChange='';return;}el.style.transform=`translate3d(${v.dx||0}px,${v.dy||0}px,0) scale(${v.sx||1},${v.sy||1})`;el.style.transformOrigin='top left';el.style.willChange='transform';}
function css(){if(document.getElementById('sv4css'))return;const st=document.createElement('style');st.id='sv4css';st.textContent=`
#storageVisualEditor{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:8px 0;padding:8px 10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;position:relative;z-index:100000}
#storageVisualEditor .sv-title{font-weight:800;font-size:12px}.sv-status{font-size:10.5px;color:var(--dim);margin-right:4px}.sv-arrow{min-width:32px!important;padding:5px 8px!important;font-size:16px!important;font-weight:900!important;line-height:1}.sv-step{font-family:var(--mono);font-size:10px;color:var(--dim);padding:0 3px}.sv-help{font-size:10px;color:var(--dim)}
#storageVisualEditor button.active{border-color:var(--amber)!important;color:var(--amber)!important;box-shadow:0 0 0 2px var(--amber-dim)}
#viewContainer .sv-selected{outline:2px solid var(--amber)!important;outline-offset:2px}
#viewContainer .sv-selected[data-sv-kind]::after{content:'✓';position:absolute;top:-7px;left:-7px;width:16px;height:16px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:100001;pointer-events:none}
.sv-handle{position:absolute;z-index:100002;background:var(--amber);border:2px solid var(--amber-ink);box-sizing:border-box;touch-action:none;pointer-events:auto}
.sv-handle-x{right:2px;top:50%;transform:translateY(-50%);width:10px;height:34px;border-radius:5px;cursor:ew-resize}
.sv-handle-y{bottom:2px;left:50%;transform:translateX(-50%);width:34px;height:10px;border-radius:5px;cursor:ns-resize}
.sv-handle-both{right:2px;bottom:2px;width:16px;height:16px;border-radius:4px;cursor:nwse-resize}
#viewContainer.sv-resize .sv-selected{outline-color:var(--amber)}
#viewContainer.sv-move .sv-handle{display:none}
#viewContainer.sv-resize .sv-handle{display:block}
#viewContainer .sv-control-stop{pointer-events:auto!important}
`;document.head.appendChild(st);}
function updateStatus(){const t=document.getElementById('storageVisualEditor');if(!t)return;const el=document.querySelector('#viewContainer .sv-selected');const n=el?(el.dataset.rackId?'رف/درج':el.dataset.colId?'عمود':el.dataset.boxId?'عبوة':'خلية'):'لا يوجد عنصر';const s=t.querySelector('.sv-status');if(s)s.textContent='العنصر: '+n;}
function mountToolbar(){let t=document.getElementById('storageVisualEditor');if(t)t.remove();t=document.createElement('div');t.id='storageVisualEditor';t.innerHTML=`<span class="sv-title">🛠️ تحكم</span><button class="btn small active" data-m="move">↔ تحريك</button><button class="btn small" data-m="resize">⤢ الحجم</button><span class="sv-status">لا يوجد عنصر</span><span class="sv-step">10px</span><button class="btn small sv-arrow" data-dir="up" title="أعلى">▲</button><button class="btn small sv-arrow" data-dir="left" title="يسار">◀</button><button class="btn small sv-arrow" data-dir="down" title="أسفل">▼</button><button class="btn small sv-arrow" data-dir="right" title="يمين">▶</button><button class="btn small" data-r>↺ إعادة</button><button class="btn small danger" data-ra>🗑 الكل</button><span class="sv-help">اختر عنصرًا ثم استخدم الأسهم. التكبير من المقابض.</span>`;
 const rack=document.querySelector('#viewContainer .rack-fullpage-wrap');const host=rack?rack.querySelector('.rack-head'):document.querySelector('#viewContainer .view-title');if(host)host.insertAdjacentElement(rack?'afterend':'afterend',t);return t;}
function addHandles(el){el.querySelectorAll(':scope > .sv-handle').forEach(x=>x.remove());if(mode!=='resize')return;['x','y','both'].forEach(type=>{const h=document.createElement('i');h.className='sv-handle sv-handle-'+type;h.dataset.resize=type;h.setAttribute('aria-label','تغيير الحجم');el.appendChild(h);});}
function refresh(){all().forEach(el=>{apply(el);addHandles(el);el.dataset.svKind='1';});updateStatus();}
function setMode(m){mode=m;const vc=document.getElementById('viewContainer');if(!vc)return;vc.classList.toggle('sv-move',m==='move');vc.classList.toggle('sv-resize',m==='resize');const t=document.getElementById('storageVisualEditor');if(t)t.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('active',b.dataset.m===m));refresh();}
function moveSelected(dx,dy){const el=document.querySelector('#viewContainer .sv-selected');if(!el)return;if(mode!=='move')return;const k=key(el);if(!k)return;const v=val(el);v.dx=(v.dx||0)+dx;v.dy=(v.dy||0)+dy;layout[k]=v;apply(el);save();}
function init(){const vc=document.getElementById('viewContainer');if(!vc||typeof currentView==='undefined'||currentView!=='storage')return;css();const t=mountToolbar();t.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));t.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();e.stopPropagation();moveSelected(b.dataset.dir==='left'?-10:b.dataset.dir==='right'?10:0,b.dataset.dir==='up'?-10:b.dataset.dir==='down'?10:0);};});t.querySelector('[data-r]').onclick=()=>{const el=vc.querySelector('.sv-selected');if(!el){if(typeof toast==='function')toast('اختر عنصرًا أولًا');return;}delete layout[key(el)];apply(el);save();select(null);refresh();};t.querySelector('[data-ra]').onclick=()=>{if(!confirm('إعادة كل عناصر التخزين المرئي إلى أماكنها وأحجامها الأصلية؟'))return;layout={};save();all().forEach(el=>{el.style.transform='';});select(null);refresh();};
 refresh();setMode(mode);
 if(!vc.dataset.sv4Bound){vc.dataset.sv4Bound='1';let resizeDrag=null;
 vc.addEventListener('click',e=>{
   if(e.target.closest('#storageVisualEditor'))return;
   if(e.target.closest('button,input,select,textarea,a'))return;
   const el=e.target.closest(SELECTOR);
   if(!el||!vc.contains(el))return;
   // لا نوقف انتشار النقر هنا؛ إيقافه في capture كان يمنع أحداث الخلية الأصلية من الوصول إلى openCellDetail.
   select(el);
  },true);
 vc.addEventListener('pointerdown',e=>{if(e.button!==0)return;const handle=e.target.closest('.sv-handle');if(!handle||mode!=='resize')return;const el=handle.closest(SELECTOR);if(!el)return;const k=key(el),v=val(el),r=el.getBoundingClientRect();resizeDrag={el,k,type:handle.dataset.resize,px:e.clientX,py:e.clientY,sx:v.sx||1,sy:v.sy||1,w:r.width/(v.sx||1),h:r.height/(v.sy||1)};select(el);try{el.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();e.stopPropagation();},true);
 vc.addEventListener('pointermove',e=>{if(!resizeDrag)return;const d=resizeDrag,dx=e.clientX-d.px,dy=e.clientY-d.py;let sx=d.sx,sy=d.sy;if(d.type==='x'||d.type==='both')sx=Math.max(.3,Math.min(5,d.sx+dx/d.w));if(d.type==='y'||d.type==='both')sy=Math.max(.3,Math.min(5,d.sy+dy/d.h));layout[d.k]={...val(d.el),sx,sy};apply(d.el);e.preventDefault();},true);
 const finish=()=>{if(resizeDrag){save();resizeDrag=null;}};vc.addEventListener('pointerup',finish,true);vc.addEventListener('pointercancel',finish,true);
 document.addEventListener('keydown',e=>{if(!document.querySelector('#viewContainer .sv-selected'))return;if(e.target.matches('input,textarea,select'))return;if(mode!=='move')return;const m={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];if(!m)return;e.preventDefault();moveSelected(m[0],m[1]);});
 }
}
const oldShowView=window.showView;if(typeof oldShowView==='function')window.showView=function(v){oldShowView(v);if(v==='storage')requestAnimationFrame(()=>requestAnimationFrame(init));};window.initStorageVisualEditor=init;setTimeout(init,100);
})();

<script>
/* ================= STORAGE VISUAL EDITOR v5 ================= */
(function(){
'use strict';
const V5KEY='storageVisualLayout_v5';
let v5Layout={};
try{v5Layout=JSON.parse(localStorage.getItem(V5KEY)||'{}')||{};}catch(e){v5Layout={};}
const SEL='.rack-panel[data-rack-id],.rack-fullpage-wrap[data-rack-id],.rack-column[data-col-id],.vs3-full-column[data-col-id],.box-chip[data-box-id],.box-card[data-box-id],.vs3-full-book[data-box-id],.cell[data-cell-id]';
let v5Mode='move', v5Resize=null;

function v5Save(){try{localStorage.setItem(V5KEY,JSON.stringify(v5Layout));}catch(e){}}
function v5Key(el){
  if(el.dataset.rackId)return'rack:'+el.dataset.rackId;
  if(el.dataset.colId)return'col:'+el.dataset.colId;
  if(el.dataset.boxId)return'box:'+el.dataset.boxId;
  if(el.dataset.cellId)return'cell:'+el.dataset.cellId;
  return null;
}
function v5Val(el){return v5Layout[v5Key(el)]||{dx:0,dy:0,sx:1,sy:1};}
function v5All(){return [...document.querySelectorAll('#viewContainer '+SEL)];}
function v5Apply(el){
  const v=v5Layout[v5Key(el)];
  if(!v){el.style.transform='';return;}
  el.style.transform=`translate3d(${v.dx||0}px,${v.dy||0}px,0) scale(${v.sx||1},${v.sy||1})`;
  el.style.transformOrigin='top left';
}
function v5Selected(){return document.querySelector('#viewContainer .sv-selected');}
function v5Select(el){
  v5All().forEach(x=>x.classList.remove('sv-selected'));
  if(el)el.classList.add('sv-selected');
  v5UpdateToolbar();
}
function v5Type(el){
  if(!el)return'لا يوجد عنصر';
  return el.dataset.rackId?'رف / درج':el.dataset.colId?'عمود':el.dataset.boxId?'عبوة':'خلية';
}
function v5ScaleText(el){
  if(!el)return'100%';
  const v=v5Val(el);
  return `${Math.round((v.sx||1)*100)}% × ${Math.round((v.sy||1)*100)}%`;
}
function v5Step(){
  const el=document.querySelector('#sv5Step');
  return el?Math.max(1,Number(el.value)||10):10;
}
function v5Move(dx,dy){
  const el=v5Selected();if(!el)return;
  const k=v5Key(el);const v=v5Val(el);
  v.dx=(v.dx||0)+dx;v.dy=(v.dy||0)+dy;v5Layout[k]=v;v5Apply(el);v5Save();v5UpdateToolbar();
}
function v5Scale(dsx,dsy){
  const el=v5Selected();if(!el)return;
  const k=v5Key(el);const v=v5Val(el);
  v.sx=Math.max(.35,Math.min(3,(v.sx||1)+dsx));
  v.sy=Math.max(.35,Math.min(3,(v.sy||1)+dsy));
  v5Layout[k]=v;v5Apply(el);v5Save();v5UpdateToolbar();
}
function v5ResetSize(){
  const el=v5Selected();if(!el)return;
  const k=v5Key(el);const v=v5Val(el);
  v.sx=1;v.sy=1;v5Layout[k]=v;v5Apply(el);v5Save();v5UpdateToolbar();
}
function v5ResetAll(){
  if(!confirm('إعادة مواقع وأحجام عناصر المشهد كلها للوضع الأصلي؟'))return;
  v5Layout={};v5Save();v5All().forEach(el=>{el.style.transform='';});
  v5Select(null);v5Refresh();
}

    const s=v5Step(),d=b.dataset.v5dir;

function v5Init(){
  const vc=document.getElementById('viewContainer');
  if(!vc||typeof currentView==='undefined'||currentView!=='storage')return;
  if(!document.getElementById('sv5css')){
    const st=document.createElement('style');st.id='sv5css';
    st.textContent=`
      #viewContainer.sv5-resize .sv-handle{display:block}
      #viewContainer.sv5-move .sv-handle{display:none}
      .sv-handle{position:absolute;z-index:100002;background:var(--amber);border:2px solid var(--amber-ink);box-sizing:border-box;touch-action:none;pointer-events:auto}
      .sv-handle-x{right:2px;top:50%;transform:translateY(-50%);width:11px;height:38px;border-radius:6px;cursor:ew-resize}
      .sv-handle-y{bottom:2px;left:50%;transform:translateX(-50%);width:38px;height:11px;border-radius:6px;cursor:ns-resize}
      .sv-handle-both{right:2px;bottom:2px;width:18px;height:18px;border-radius:5px;cursor:nwse-resize}
    `;
    document.head.appendChild(st);
  }
  v5Toolbar();v5Refresh();
  if(vc.dataset.v5Bound)return;
  vc.dataset.v5Bound='1';

  vc.addEventListener('click',e=>{
    if(e.target.closest('#storageVisualEditor'))return;
    if(e.target.closest('button,input,select,textarea,a'))return;
    const el=e.target.closest(SEL);if(!el||!vc.contains(el))return;
    v5Select(el);
  },true);

  vc.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const h=e.target.closest('.sv-handle');
    if(!h||v5Mode!=='resize')return;
    const el=h.closest(SEL);if(!el)return;
    const k=v5Key(el),v=v5Val(el),r=el.getBoundingClientRect();
    v5Resize={el,k,type:h.dataset.resize,px:e.clientX,py:e.clientY,
      sx:v.sx||1,sy:v.sy||1,w:r.width/(v.sx||1),h:r.height/(v.sy||1)};
    v5Select(el);
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();e.stopPropagation();
  },true);

  vc.addEventListener('pointermove',e=>{
    if(!v5Resize)return;
    const d=v5Resize,dx=e.clientX-d.px,dy=e.clientY-d.py;
    let sx=d.sx,sy=d.sy;
    if(d.type==='x'||d.type==='both')sx=Math.max(.35,Math.min(3,d.sx+dx/d.w));
    if(d.type==='y'||d.type==='both')sy=Math.max(.35,Math.min(3,d.sy+dy/d.h));
    v5Layout[d.k]={...v5Val(d.el),sx,sy};v5Apply(d.el);v5UpdateToolbar();
    e.preventDefault();
  },true);

  const finish=()=>{if(v5Resize){v5Save();v5Resize=null;}};
  vc.addEventListener('pointerup',finish,true);
  vc.addEventListener('pointercancel',finish,true);
}
const oldShow=window.showView;
if(typeof oldShow==='function'){
  window.showView=function(v){oldShow(v);if(v==='storage')requestAnimationFrame(()=>requestAnimationFrame(v5Init));};
}
window.initStorageVisualEditorV5=v5Init;
setTimeout(v5Init,120);
})();
</script>

<script id="advanced-cell-search-js">
(function(){
  const FIELD_ALIASES={
    price:['price','السعر','cost'],
    current:['current','amperage','amps','amp','تيار','التيار'],
    voltage:['voltage','volt','v','فولت','الجهد'],
    size:['size','dimension','dimensions','حجم','الحجم','مقاس'],
    package:['package','packaging','packageType','pack','باكدج','الباكديج','التعبئة'],
    type:['type','category','kind','نوع','النوع'],
    power:['power','watt','watts','قدرة','القدرة'],
    manufacturer:['manufacturer','brand','maker','الشركة','الماركة'],
    model:['model','partNumber','pn','الموديل'],
    description:['description','desc','notes','الوصف','ملاحظات']
  };
  const labels={price:'السعر',current:'التيار',voltage:'الجهد',size:'الحجم',package:'الباكديج',type:'النوع',power:'القدرة',manufacturer:'الشركة',model:'الموديل',description:'الوصف'};

  function allObjects(){
    const s=window.state;
    if(!s)return [];
    const a=[];
    ['cells','components','boxes','columns','racks'].forEach(k=>{
      if(Array.isArray(s[k])) a.push(...s[k].map(x=>({obj:x,kind:k})));
    });
    return a;
  }
  function norm(v){
    return String(v??'').trim().toLowerCase()
      .replace(/أ|إ|آ/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
      .replace(/٫/g,'.').replace(/،/g,',');
  }
  function fieldValue(obj,field){
    const aliases=FIELD_ALIASES[field]||[];
    for(const key of aliases){
      if(Object.prototype.hasOwnProperty.call(obj,key) && obj[key]!=='' && obj[key]!=null)return obj[key];
    }
    return '';
  }
  function extractComponent(cell){
    if(!cell)return null;
    const id=cell.componentId||cell.component_id||cell.component;
    if(!id)return null;
    const s=window.state;
    if(!s)return null;
    return (s.components||[]).find(c=>c.id===id)||null;
  }
  function searchableText(cell){
    const c=extractComponent(cell)||{};
    const vals=[];
    for(const f of Object.keys(FIELD_ALIASES)){
      const v=fieldValue(c,f); if(v!=='') vals.push(v);
      const cv=fieldValue(cell,f); if(cv!=='') vals.push(cv);
    }
    vals.push(cell.name,cell.label,cell.code,cell.description,c.name,c.label,c.code,c.description);
    return norm(vals.filter(Boolean).join(' | '));
  }
  function parseNumber(v){
    const m=norm(v).replace(/,/g,'.').match(/-?\d+(?:\.\d+)?/);
    return m?Number(m[0]):NaN;
  }
  function matches(cell,field,query){
    if(!cell)return false;
    const c=extractComponent(cell)||{};
    const raw=fieldValue(c,field)||fieldValue(cell,field)||searchableText(cell);
    if(field==='current'||field==='voltage'||field==='price'||field==='size'||field==='power'){
      const qn=parseNumber(query), rn=parseNumber(raw);
      if(!Number.isNaN(qn)&&!Number.isNaN(rn)) return rn===qn;
    }
    return norm(raw).includes(norm(query));
  }
  function getCellElements(){
    const root=document.querySelector('#viewContainer');
    if(!root)return [];
    return [...root.querySelectorAll('.cell,[data-cell-id]')].filter(el=>el.closest('.vs3-cell-panel')||el.dataset.cellId);
  }
  function clearMarks(){
    getCellElements().forEach(el=>el.classList.remove('acs-match','acs-dim'));
  }
  function search(){
    const field=document.getElementById('acsField')?.value;
    const q=document.getElementById('acsQuery')?.value?.trim();
    const result=document.getElementById('acsResult');
    clearMarks();
    if(!field||!q){if(result)result.textContent='';return;}
    const cells=Array.isArray(window.state?.cells)?window.state.cells:[];
    let count=0;
    const ids=new Set();
    cells.forEach(cell=>{
      if(matches(cell,field,q)){ids.add(String(cell.id));count++;}
    });
    getCellElements().forEach(el=>{
      const id=String(el.dataset.cellId||el.getAttribute('data-cell-id')||'');
      if(ids.has(id)) el.classList.add('acs-match');
      else el.classList.add('acs-dim');
    });
    if(result)result.textContent=`تم العثور على ${count} خلية مطابقة لـ ${labels[field]||field}: ${q}`;
  }
  function clearSearch(){
    const q=document.getElementById('acsQuery'); if(q)q.value='';
    const r=document.getElementById('acsResult'); if(r)r.textContent='';
    clearMarks();
  }
  window.acsSearch=search;
  window.acsClear=clearSearch;

  function mount(){
    const vc=document.querySelector('#viewContainer');
    if(!vc || document.getElementById('advancedCellSearch'))return;
    const box=document.createElement('div');
    box.id='advancedCellSearch';
    box.className='advanced-cell-search';
    box.innerHTML=`
      <div class="acs-top">
        <span class="acs-label">🔎 بحث بالمواصفات</span>
        <select id="acsField" aria-label="نوع المواصفة">
          ${Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
        </select>
        <input id="acsQuery" placeholder="مثال: 1 أمبير أو TO-220 أو 1000" autocomplete="off">
        <button class="btn small primary" type="button" id="acsRun">بحث</button>
        <button class="btn small" type="button" id="acsClear">مسح</button>
      </div>
      <div class="acs-chips">
        ${['السعر','التيار','الجهد','الحجم','الباكديج','النوع','القدرة','الشركة','الموديل'].map(x=>`<button class="acs-chip" type="button" data-label="${x}">${x}</button>`).join('')}
      </div>
      <div class="acs-help">اختر المواصفة ثم اكتب القيمة. النتائج المطابقة سيتم تمييزها داخل جميع أماكن التخزين، بينما غير المطابق سيصبح باهتًا.</div>
      <div id="acsResult" class="acs-result"></div>`;
    const target=vc.querySelector('.rack-fullpage-wrap,.storage-view,.storage-dashboard')||vc.firstElementChild;
    if(target) target.parentNode.insertBefore(box,target);
    else vc.prepend(box);

    document.getElementById('acsRun').onclick=search;
    document.getElementById('acsClear').onclick=clearSearch;
    document.getElementById('acsQuery').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
    document.querySelectorAll('.acs-chip').forEach(ch=>ch.onclick=()=>{
      const txt=ch.dataset.label;
      const map=Object.entries(labels).find(([,v])=>v===txt);
      if(map)document.getElementById('acsField').value=map[0];
      document.getElementById('acsQuery').focus();
    });
  }

  const oldShow=window.showView;
  if(typeof oldShow==='function'){
    window.showView=function(v){
      oldShow(v);
      if(v==='storage')setTimeout(mount,30);
    };
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(mount,50));
  setTimeout(mount,200);
})();
</script>

<script id="toggle-specs-js">
(function(){

  function load(){

      const x=JSON.parse(localStorage.getItem(KEY)||'[]');
      return Array.isArray(x)?x.filter(s=>s&&s.key&&s.label):[];
    }catch(e){return[]}
  }
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  function makeKey(s){
    return 'custom_'+String(s).trim().toLowerCase()
      .replace(/\s+/g,'_').replace(/[^\w\u0600-\u06ff-]/g,'_').slice(0,50);
  }

  function refreshSelect(){
    const sel=document.getElementById('acsField'); if(!sel)return;
    const old=sel.value;
    const base=[
      ['price','السعر'],['current','التيار'],['voltage','الجهد'],
      ['size','الحجم'],['package','الباكديج'],['type','النوع'],
      ['power','القدرة'],['manufacturer','الشركة'],['model','الموديل'],
      ['description','الوصف']
    ];
    sel.innerHTML=base.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
    load().forEach(s=>sel.insertAdjacentHTML('beforeend',`<option value="${s.key}">${s.label}</option>`));
    if([...sel.options].some(o=>o.value===old))sel.value=old;
  }

  function render(){
    const list=document.querySelector('#advancedCellSearch .custom-spec-list');
    if(!list)return;
    const a=load();
    list.innerHTML=a.length
      ? a.map(s=>`<button type="button" class="custom-spec-item" data-spec-key="${s.key}">
          <span class="spec-toggle-dot"></span><span>${s.label}</span>

    const k=makeKey(label), a=load();
    const built=['price','current','voltage','size','package','type','power','manufacturer','model','description'];
    if(built.includes(k)||a.some(s=>s.key===k)){alert('هذه المواصفة موجودة بالفعل');return}
    a.push({key:k,label,example:e?.value.trim()||''});
    save(a);
    if(l)l.value=''; if(e)e.value='';
    render(); refreshSelect();
  }

  function mount(){
    const search=document.getElementById('advancedCellSearch');
    if(!search)return;

          <button class="btn small" id="customSpecAdd" type="button">＋ إضافة</button>
        </div>`;
      search.appendChild(box);
      document.getElementById('customSpecAdd').onclick=add;
      document.getElementById('customSpecExample').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
    }
    render();refreshSelect();
  }

  const oldShow=window.showView;
  if(typeof oldShow==='function'){
    window.showView=function(v){
      oldShow(v);
      if(v==='storage')setTimeout(mount,50);
    };
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(mount,80));
  setTimeout(mount,300);
})();
</script>


<script>
/* Mobile UX: keep the documentation screen compact on first open. */
(function(){
  const applyMobileDocState=()=>{
    if(window.innerWidth>760) return;
    document.querySelectorAll('.sec-scope .content-block').forEach(block=>{
      if(block.dataset.mobileInit==='1') return;
      block.dataset.mobileInit='1';
      if(block.dataset.block==='explain') return;
      block.classList.add('is-collapsed');
      const btn=block.querySelector('[data-act="collapse"]');
      if(btn){ btn.textContent='⌄ فتح'; btn.title='فتح الكتلة'; }
    });
  };
  const observer=new MutationObserver(()=>requestAnimationFrame(applyMobileDocState));
  observer.observe(document.body,{childList:true,subtree:true});
  window.addEventListener('resize',()=>requestAnimationFrame(applyMobileDocState));
  document.addEventListener('DOMContentLoaded',()=>setTimeout(applyMobileDocState,120));
  setTimeout(applyMobileDocState,500);
})();
</script>

<script id="indicator-system-v2">
(function(){
'use strict';

function escI(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function numI(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d;}
function clampI(n,a=0,b=100){return Math.max(a,Math.min(b,n));}

const CELL_TYPES=[
  ['text','نص'],['number','رقم كبير'],['badge','شارة'],['bar','شريط تقدم'],
  ['ring','حلقة'],['gauge','عداد'],['lamp','لمبة'],['dot','نقطة مضيئة'],
  ['level','مستويات'],['steps','خطوات'],['donut','دونات'],['spark','مخطط صغير'],['mini-bars','أعمدة صغيرة']
];

function migrateCellIndicators(cell){
  if(!Array.isArray(cell.indicators)){
    if(cell.indicator) cell.indicators=[{...cell.indicator,id:cell.indicator.id||uid('cind')}];
    else cell.indicators=[];
  }
  cell.indicators=cell.indicators.map(x=>({
    id:x.id||uid('cind'),enabled:x.enabled!==false,type:x.type||'text',
    source:x.source||'quantity',label:x.label||'',value:x.value??'',
    color:x.color||'#5aa7ff',min:numI(x.min,0),max:numI(x.max,100),unit:x.unit||''
  }));
  return cell.indicators;
}
function cellIndicatorConfig(cell){return migrateCellIndicators(cell)[0]||{enabled:false,type:'text',source:'quantity',label:'',value:'',color:'#5aa7ff',min:0,max:100,unit:''};}

function cellRawI(cell,cfg){
  const comp=cell?.componentId?findComponent(cell.componentId):null;
  switch(cfg.source){
    case 'quantity':return cell?.quantity??0;
    case 'status':return cell?statusLabelAr(cellStatus(cell)):'فارغة';
    case 'voltage':return comp?.voltage||'';
    case 'current':return comp?.current||'';
    case 'power':return comp?.power||'';
    case 'value':return comp?.value||'';
    case 'partNumber':return comp?.partNumber||'';
    case 'componentName':return comp?.name||'';
    case 'category':return comp?.category||'';
    case 'manufacturer':return comp?.manufacturer||'';
    case 'custom':return cfg.value??'';
    default:return cfg.value??'';
  }
}
function indicatorPctI(raw,cfg){
  const n=numI(raw,0), min=numI(cfg.min,0), max=numI(cfg.max,100);
  return max<=min ? (n>min?100:0) : clampI((n-min)/(max-min)*100);
}
function sparkI(pct){
  const levels=['▁','▂','▃','▄','▅','▆','▇','█'];
  const n=clampI(numI(pct),0,100);
  const base=Math.max(0,Math.min(7,Math.round(n/100*7)));
  return levels[Math.max(0,base-1)]+levels[Math.max(0,Math.min(7,base))]+levels[Math.max(0,Math.min(7,base+1))]+levels[Math.max(0,Math.min(7,base-1))]+levels[Math.max(0,Math.min(7,base))];
}
function renderIndicatorI(cfg,raw,compact=false){
  if(!cfg||cfg.enabled===false)return '';
  const color=escI(cfg.color||'#5aa7ff'), value=escI(raw), label=cfg.label?escI(cfg.label)+': ':'';
  const pct=indicatorPctI(raw,cfg), p=pct.toFixed(0);
  const title=escI((cfg.label?cfg.label+': ':'')+String(raw??''));
  let body='';
  if(cfg.type==='bar') body=`<span class="cell-indicator ind-bar" title="${title}" style="--ind-color:${color};--ind-pct:${p}%"><span class="ind-bar-fill"></span></span>`;
  else if(cfg.type==='ring') body=`<span class="cell-indicator ind-ring" title="${title}" style="--ind-color:${color};transform:rotate(${Math.round(pct*3.6)}deg)"><span class="ind-label" style="transform:rotate(-${Math.round(pct*3.6)}deg)">${p}%</span></span>`;
  else if(cfg.type==='gauge') body=`<span class="cell-indicator ind-gauge" title="${title}" style="--ind-color:${color}"><i class="ind-gauge-needle" style="transform:rotate(${Math.round(-65+pct*1.3)}deg)"></i></span>`;
  else if(cfg.type==='lamp') body=`<span class="cell-indicator ind-lamp" title="${title}" style="--ind-color:${color}"><span class="ind-lamp-dot"></span><span class="ind-label">${label}${value}</span></span>`;
  else if(cfg.type==='dot') body=`<span class="cell-indicator ind-dot" title="${title}" style="--ind-color:${color}"></span>`;
  else if(cfg.type==='level') body=`<span class="cell-indicator ind-level" title="${title}" style="--ind-color:${color}">${[1,2,3,4,5].map(n=>`<i class="${pct>=n*20?'on':''}"></i>`).join('')}</span>`;
  else if(cfg.type==='steps') body=`<span class="cell-indicator ind-steps" title="${title}" style="--ind-color:${color}">${[1,2,3,4,5,6].map(n=>`<i class="${pct>=n*100/6?'on':''}"></i>`).join('')}</span>`;
  else if(cfg.type==='donut') body=`<span class="cell-indicator ind-donut" title="${title}" style="--ind-color:${color};--ind-pct:${p}%"><span class="ind-label">${p}%</span></span>`;
  else if(cfg.type==='spark') body=`<span class="cell-indicator ind-spark" title="${title}" style="color:${color}">${sparkI(pct)}</span>`;
  else if(cfg.type==='mini-bars') body=`<span class="cell-indicator ind-mini-bars" title="${title}" style="--ind-color:${color}">${[20,40,60,80,100].map(n=>`<i style="--h:${Math.max(2,Math.round(pct*n/100*0.12)+3)}px"></i>`).join('')}</span>`;
  else if(cfg.type==='number') body=`<span class="cell-indicator ind-number" title="${title}" style="color:${color}">${label}${value}${escI(cfg.unit)}</span>`;
  else if(cfg.type==='badge') body=`<span class="cell-indicator ind-badge" title="${title}" style="color:${color};border-color:${color}">${label}${value}${escI(cfg.unit)}</span>`;
  else body=`<span class="cell-indicator ind-text" title="${title}" style="color:${color}">${label}${value}${escI(cfg.unit)}</span>`;
  return body;
}
function cellIndicatorHTML(cell){
  const arr=migrateCellIndicators(cell).filter(x=>x.enabled!==false);
  if(!arr.length)return '';
  return `<div class="cell-indicators">${arr.slice(0,8).map(cfg=>renderIndicatorI(cfg,cellRawI(cell,cfg),true)).join('')}</div>`;
}

function cellIndicatorFieldsHTML(cell){
  const arr=migrateCellIndicators(cell);
  const rows=arr.map(cellIndicatorRowHTMLI).join('');
  return `<div id="cellIndicatorPanel">
    <div class="visual-modal-advanced">
      <b style="font-size:12px">مؤشرات هذه الخلية</b>
      <div style="font-size:10px;color:var(--dim);margin-top:4px">يمكنك إضافة عدة مؤشرات. كل مؤشر مستقل ويمكنه عرض معلومة مختلفة، وكلها تتكيف تلقائيًا داخل حدود الخلية.</div>
    </div>
    <div id="ciRows">${rows}</div>
    <button class="btn small" id="ciAdd">+ إضافة مؤشر جديد</button>
    <div class="ind-preview" style="margin-top:8px">
      <div style="font-size:10px;color:var(--dim);margin-bottom:5px">معاينة</div>
      <div class="ind-preview-box" id="ciPreview" style="max-width:100%;overflow:hidden"></div>
    </div>
    <button class="btn small primary" id="saveCellIndicatorsBtn" style="margin-top:8px">حفظ جميع مؤشرات الخلية</button>
  </div>`;
}
function cellIndicatorRowHTMLI(c){
  const sourceOpts=[
    ['quantity','الكمية'],['status','الحالة'],['voltage','الجهد'],['current','التيار'],['power','القدرة'],
    ['value','القيمة'],['partNumber','رقم القطعة'],['componentName','اسم المكون'],['category','الفئة'],
    ['manufacturer','الشركة المصنعة'],['custom','قيمة مخصصة']
  ].map(x=>`<option value="${x[0]}" ${c.source===x[0]?'selected':''}>${x[1]}</option>`).join('');
  const typeOpts=CELL_TYPES.map(x=>`<option value="${x[0]}" ${c.type===x[0]?'selected':''}>${x[1]}</option>`).join('');
  return `<div class="visual-var-row ci-row" data-ci="${c.id}">
    <div class="field"><label>البيان</label><select data-ci-v="source">${sourceOpts}</select></div>
    <div class="field"><label>الشكل</label><select data-ci-v="type">${typeOpts}</select></div>
    <div class="field"><label>العنوان</label><input data-ci-v="label" value="${escI(c.label)}" placeholder="مثال: V / مخزون"></div>
    <div class="field"><label>قيمة مخصصة</label><input data-ci-v="value" value="${escI(c.value)}"></div>
    <div class="field"><label>الوحدة</label><input data-ci-v="unit" value="${escI(c.unit)}" placeholder="V / A / قطعة"></div>
    <div class="field"><label>Min</label><input data-ci-v="min" type="number" value="${c.min}"></div>
    <div class="field"><label>Max</label><input data-ci-v="max" type="number" value="${c.max}"></div>
    <div class="field"><label>اللون</label><input data-ci-v="color" type="color" value="${escI(c.color)}" style="height:36px;padding:3px"></div>
    <div style="display:flex;gap:5px;align-items:center">
      <label class="check-row" style="border:0;padding:0"><input data-ci-v="enabled" type="checkbox" ${c.enabled!==false?'checked':''}><span class="ctext">عرض</span></label>
      <button class="btn small danger" data-ci-delete>حذف</button>
    </div>
  </div>`;
}
function wireCellIndicatorSettings(cell){
  const rowsEl=document.getElementById('ciRows');
  const preview=document.getElementById('ciPreview');
  if(!rowsEl)return;
  const readRows=()=>[...rowsEl.querySelectorAll('[data-ci]')].map(row=>({
    id:row.dataset.ci,
    source:row.querySelector('[data-ci-v="source"]').value,
    type:row.querySelector('[data-ci-v="type"]').value,
    label:row.querySelector('[data-ci-v="label"]').value.trim(),
    value:row.querySelector('[data-ci-v="value"]').value,
    unit:row.querySelector('[data-ci-v="unit"]').value.trim(),
    min:numI(row.querySelector('[data-ci-v="min"]').value,0),
    max:numI(row.querySelector('[data-ci-v="max"]').value,100),
    color:row.querySelector('[data-ci-v="color"]').value,
    enabled:row.querySelector('[data-ci-v="enabled"]').checked
  }));
  const update=()=>{
    if(!preview)return;
    const temp={...cell,indicators:readRows()};
    preview.innerHTML=cellIndicatorHTML(temp)||'<span style="color:var(--dim);font-size:10px">لا توجد مؤشرات مفعلة</span>';
  };
  rowsEl.addEventListener('input',update); rowsEl.addEventListener('change',update);
  rowsEl.addEventListener('click',e=>{if(e.target.closest('[data-ci-delete]')){e.target.closest('[data-ci]').remove();update();}});
  document.getElementById('ciAdd')?.addEventListener('click',()=>{
    rowsEl.insertAdjacentHTML('beforeend',cellIndicatorRowHTMLI({id:uid('cind'),enabled:true,type:'badge',source:'quantity',label:'',value:'',unit:'',color:'#5aa7ff',min:0,max:100}));
    update();
  });
  update();
  document.getElementById('saveCellIndicatorsBtn')?.addEventListener('click',()=>{
    cell.indicators=readRows();
    cell.indicator=cell.indicators[0]||null;
    scheduleSave();closeModal();showView(currentView);toast('تم حفظ مؤشرات الخلية');
  });
}

/* ---------- Aggregation for rack / column / box ---------- */
function visualChildren(item,kind,scope){
  const want=scope||'auto';
  if(kind==='rack'){
    const cols=columnsOfRack(item.id);
    if(want==='columns')return cols;
    if(want==='boxes')return cols.flatMap(c=>boxesOfColumn(c.id));
    if(want==='cells')return cols.flatMap(c=>boxesOfColumn(c.id).flatMap(b=>cellsOfBox(b.id)));
    return cols;
  }
  if(kind==='column'){
    const boxes=boxesOfColumn(item.id);
    if(want==='boxes')return boxes;
    if(want==='cells')return boxes.flatMap(b=>cellsOfBox(b.id));
    return boxes;
  }
  if(kind==='box')return cellsOfBox(item.id);
  return [];
}
function visualAllCells(item,kind){
  return visualChildren(item,kind,'cells');
}
function visualMetric(item,kind,v){
  const scope=v.scope||'auto', metric=v.metric||'manual', children=visualChildren(item,kind,scope);
  if(metric==='manual')return {value:numI(v.current,0),count:1,series:[numI(v.current,0)]};
  if(metric==='count')return {value:children.length,count:children.length,series:children.map(()=>1)};
  if(metric==='occupied')return {value:children.filter(x=>x.componentId).length,count:children.length,series:children.map(x=>x.componentId?1:0)};
  if(metric==='empty')return {value:children.filter(x=>!x.componentId).length,count:children.length,series:children.map(x=>x.componentId?0:1)};
  if(metric==='quantity')return {value:children.reduce((s,x)=>s+numI(x.quantity,0),0),count:children.length,series:children.map(x=>numI(x.quantity,0))};
  if(metric==='avgQuantity')return {value:children.length?children.reduce((s,x)=>s+numI(x.quantity,0),0)/children.length:0,count:children.length,series:children.map(x=>numI(x.quantity,0))};
  if(metric==='maxQuantity')return {value:children.length?Math.max(...children.map(x=>numI(x.quantity,0))):0,count:children.length,series:children.map(x=>numI(x.quantity,0))};
  if(metric==='minQuantity')return {value:children.length?Math.min(...children.map(x=>numI(x.quantity,0))):0,count:children.length,series:children.map(x=>numI(x.quantity,0))};
  if(metric==='fill')return {value:children.length?children.filter(x=>x.componentId).length/children.length*100:0,count:children.length,series:children.map(x=>x.componentId?100:0),percent:true};
  if(metric==='componentTypes'){
    const ids=new Set(children.filter(x=>x.componentId).map(x=>x.componentId));return {value:ids.size,count:children.length,series:[ids.size]};
  }
  if(metric==='lowStock'){
    const n=children.filter(x=>{if(!x.componentId)return false;const c=findComponent(x.componentId);return c&&numI(x.quantity,0)<=numI(c.warningStock,0);}).length;
    return {value:n,count:children.length,series:children.map(x=>x.componentId&&(()=>{const c=findComponent(x.componentId);return c&&numI(x.quantity,0)<=numI(c.warningStock,0)?1:0})())};
  }
  if(metric==='criticalStock'){
    const n=children.filter(x=>{if(!x.componentId)return false;const c=findComponent(x.componentId);return c&&numI(x.quantity,0)<=numI(c.criticalStock,0);}).length;
    return {value:n,count:children.length,series:children.map(x=>x.componentId&&(()=>{const c=findComponent(x.componentId);return c&&numI(x.quantity,0)<=numI(c.criticalStock,0)?1:0})())};
  }
  if(metric==='children'){
    return {value:children.length,count:children.length,series:children.map(()=>1)};
  }
  return {value:numI(v.current,0),count:1,series:[numI(v.current,0)]};
}
function visualPercentV(v,res){
  if(v.metric==='fill')return clampI(res.value);
  const min=numI(v.min,0),max=numI(v.max,100);
  return max<=min?(res.value>min?100:0):clampI((res.value-min)/(max-min)*100);
}
function visualSeriesHTMLV(series,color){
  const a=(series||[]).slice(-8); if(!a.length)return '';
  const max=Math.max(1,...a.map(x=>numI(x,0)));
  return a.map(x=>`<i style="height:${Math.max(3,Math.round(numI(x,0)/max*18))}px;background:${color}"></i>`).join('');
}
function visualOneHTML(v,item,kind){
  if(v.visible===false)return '';
  const res=visualMetric(item,kind,v), pct=visualPercentV(v,res), color=v.color||'#f2aa3b', p=Math.round(pct);
  let mark='';
  if(v.mode==='percent')mark=`<span class="vv-value">${p}%</span><span class="vv-bar"><i style="width:${p}%;background:${color}"></i></span>`;
  else if(v.mode==='indicator')mark=`<span class="vv-bar"><i style="width:${p}%;background:${color}"></i></span><span class="vv-value">${p}%</span>`;
  else if(v.mode==='light')mark=`<i class="vv-light" style="color:${color};background:${color}"></i><span class="vv-value">${p}%</span>`;
  else if(v.mode==='level')mark=`<span class="vv-level">${[1,2,3,4,5].map(n=>`<i style="height:${n*3}px;opacity:${p>=n*20?1:.22};background:${color}"></i>`).join('')}</span><span class="vv-value">${p}%</span>`;
  else if(v.mode==='ring')mark=`<span class="vv-ring" style="--vv-color:${color};transform:rotate(${p*3.6}deg)"><span style="transform:rotate(-${p*3.6}deg);font-size:7px">${p}%</span></span>`;
  else if(v.mode==='donut')mark=`<span class="vv-donut" style="--vv-color:${color};--vv-pct:${p}%"><span style="position:relative;z-index:1;font-size:7px">${p}%</span></span>`;
  else if(v.mode==='steps')mark=`<span class="vv-steps">${[1,2,3,4,5,6].map(n=>`<i style="background:${color};opacity:${p>=n*100/6?1:.18}"></i>`).join('')}</span>`;
  else if(v.mode==='bars')mark=`<span class="vv-mini-bars">${visualSeriesHTMLV(res.series,color)}</span>`;
  else if(v.mode==='spark')mark=`<span class="vv-spark" style="color:${color}">${(res.series||[]).slice(-8).map(x=>['▁','▂','▃','▄','▅','▆','▇','█'][Math.max(0,Math.min(7,Math.round(numI(x,0)/(Math.max(1,...(res.series||[1])))*7))) ]).join('')}</span>`;
  else if(v.mode==='gauge')mark=`<span class="vv-gauge"><i style="--vv-color:${color};transform:rotate(${(-65+p*1.3)}deg)"></i></span><span class="vv-value">${p}%</span>`;
  else if(v.mode==='number')mark=`<span class="vv-value" style="color:${color}">${escI(res.value)}${escI(v.unit||'')}</span>`;
  else if(v.mode==='badge')mark=`<span class="vv-badge" style="--vv-color:${color}">${escI(res.value)}${escI(v.unit||'')}</span>`;
  else mark=`<span class="vv-value">${escI(res.value)}${escI(v.unit||'')}</span>`;
  return `<span class="visual-var" title="${escI(v.name||'')}"><span class="vv-name">${escI(v.name||'')}</span>${mark}</span>`;
}
function ensureVisual(item){
  if(!item.visualVars) item.visualVars=[{id:uid('var'),name:'المخزون الحالي',unit:'قطعة',min:0,max:500,current:68,mode:'percent',visible:true,scope:'auto',metric:'manual',color:'#f2aa3b'}];
  if(!Array.isArray(item.visualLinks))item.visualLinks=[];
  if(!item.visualIndicator)item.visualIndicator={x:55,y:8};
  return item;
}
function visualVarsHTML(item,kind){
  ensureVisual(item);
  const strip=(item.visualVars||[]).map(v=>visualOneHTML(v,item,kind)).join('');
  if(!strip)return '';
  return `<div class="visual-var-strip"><span style="font-size:9px;color:var(--dim2)">مؤشرات مرتبطة</span>${strip}</div>`;
}
function visualVarRowHTML(v){
  const scopes=[['auto','الأبناء تلقائيًا'],['columns','الأعمدة'],['boxes','العبوات'],['cells','الخلايا']];
  const metrics=[['manual','قيمة يدوية'],['quantity','إجمالي الكمية'],['avgQuantity','متوسط الكمية'],['maxQuantity','أعلى كمية'],['minQuantity','أقل كمية'],['occupied','خلايا مشغولة'],['empty','خلايا فارغة'],['fill','نسبة الامتلاء'],['count','عدد العناصر'],['componentTypes','عدد أنواع المكونات'],['lowStock','مخزون منخفض'],['criticalStock','مخزون حرج']];
  const modes=[['percent','نسبة مئوية'],['indicator','شريط'],['light','لمبة'],['ring','حلقة'],['donut','دونات'],['level','مستويات'],['steps','خطوات'],['bars','أعمدة'],['spark','مخطط صغير'],['gauge','عداد'],['number','رقم'],['badge','شارة']];
  return `<div class="visual-var-row" data-vrow="${v.id}">
    <div class="field"><label>اسم المؤشر</label><input data-v="name" value="${escI(v.name||'')}"></div>
    <div class="field"><label>من أين البيانات؟</label><select data-v="scope">${scopes.map(x=>`<option value="${x[0]}" ${v.scope===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
    <div class="field"><label>ما الذي نحسبه؟</label><select data-v="metric">${metrics.map(x=>`<option value="${x[0]}" ${v.metric===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
    <div class="field"><label>طريقة العرض</label><select data-v="mode">${modes.map(x=>`<option value="${x[0]}" ${v.mode===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
    <div class="field"><label>الوحدة</label><input data-v="unit" value="${escI(v.unit||'')}"></div>
    <div class="field"><label>Min</label><input data-v="min" type="number" value="${v.min??0}"></div>
    <div class="field"><label>Max</label><input data-v="max" type="number" value="${v.max??100}"></div>
    <div class="field"><label>القيمة اليدوية</label><input data-v="current" type="number" value="${v.current??0}"></div>
    <div class="field"><label>اللون</label><input data-v="color" type="color" value="${escI(v.color||'#f2aa3b')}" style="height:36px;padding:3px"></div>
    <div style="display:flex;gap:5px;align-items:center"><label class="check-row" style="border:0;padding:0"><input data-v="visible" type="checkbox" ${v.visible!==false?'checked':''}><span class="ctext">عرض</span></label><button class="btn small danger" data-v-delete>حذف</button></div>
  </div>`;
}
function visualLinkRowHTML(link,item){
  const storage=[...allRacks(),...state.columns,...state.boxes];
  const sourceOptions=storage.map(x=>`<option value="${x.id}" ${link.sourceId===x.id?'selected':''}>${escI(x.name||x.label)}</option>`).join('');
  const targetOptions=`<option value="alerts" ${link.targetId==='alerts'?'selected':''}>التنبيهات</option><option value="purchases" ${link.targetId==='purchases'?'selected':''}>المشتريات</option><option value="components" ${link.targetId==='components'?'selected':''}>المكونات</option>`+storage.map(x=>`<option value="${x.id}" ${link.targetId===x.id?'selected':''}>${escI(x.name||x.label)}</option>`).join('');
  const varOptions=(item.visualVars||[]).map(v=>`<option ${link.sourceVar===v.name?'selected':''}>${escI(v.name)}</option>`).join('');
  return `<div class="visual-link-row" data-vlink-row="${link.id}">
    <div class="field"><label>العنصر المصدر</label><select data-link="sourceId"><option value="${item.id}" ${!link.sourceId||link.sourceId===item.id?'selected':''}>هذا العنصر</option>${sourceOptions}</select></div>
    <div class="field"><label>المؤشر المصدر</label><select data-link="sourceVar">${varOptions||'<option>المخزون الحالي</option>'}</select></div>
    <div class="field"><label>الهدف</label><select data-link="targetId">${targetOptions}</select></div>
    <div class="field"><label>حقل الهدف</label><select data-link="targetField"><option>القيمة الحالية</option><option>حد التحذير</option><option>حد الخطر</option><option>الكمية المطلوبة</option><option>الحالة</option></select></div>
    <div class="field"><label>التحويل</label><select data-link="transform"><option value="same">نفس القيمة</option><option value="percent">تحويل إلى ٪</option><option value="invert">عكس النسبة</option><option value="boolean">نعم/لا</option></select></div>
    <button class="btn small danger" data-link-delete>حذف</button>
  </div>`;
}
function openVisualVariables(id,kind){
  const item=ensureVisual(visualItem(id,kind));if(!item)return;
  const rows=(item.visualVars||[]).map(visualVarRowHTML).join('');
  const links=(item.visualLinks||[]).map(x=>visualLinkRowHTML({...x,sourceId:x.sourceId||item.id},item)).join('');
  openModal(`مؤشرات وتحليل ${visualLabel(kind)}`,`
    <div class="visual-modal-advanced">
      <b>نظام مؤشرات متقدم</b>
      <div style="font-size:10px;color:var(--dim);margin-top:4px">أضف عددًا غير محدود عمليًا من المؤشرات. كل مؤشر يمكنه جمع بيانات من الأعمدة أو العبوات أو الخلايا، ثم عرضها بأشكال مختلفة. جميع المؤشرات تلتزم بعرض العنصر ولا تخرج خارجه.</div>
    </div>
    <div id="visualVarRows">${rows}</div>
    <button class="btn small" id="visualAddVar">+ إضافة مؤشر</button>
    <h3 style="font-size:13px;margin:18px 0 6px">مؤشرات مرتبطة وربط البيانات</h3>
    <div class="visual-modal-intro">يمكن ربط مؤشرات هذا العنصر بعناصر أخرى أو بأقسام التنبيهات والمشتريات والمكونات.</div>
    <div id="visualLinkRows">${links||'<div class="visual-link-empty">لا توجد علاقات بعد</div>'}</div>
    <button class="btn small" id="visualAddLink">+ إضافة علاقة</button>
    <label class="check-row" style="border:0"><input id="visualApplyAll" type="checkbox"><span class="ctext">تطبيق إعدادات المؤشرات على كل الرفوف والأعمدة والعبوات</span></label>
  `,`<button class="btn" id="visualCancel">إلغاء</button><button class="btn primary" id="visualSave">حفظ</button>`);
  const rowsEl=document.getElementById('visualVarRows'),linksEl=document.getElementById('visualLinkRows');
  document.getElementById('visualAddVar').onclick=()=>rowsEl.insertAdjacentHTML('beforeend',visualVarRowHTML({id:uid('var'),name:'مؤشر جديد',unit:'',min:0,max:100,current:0,mode:'percent',visible:true,scope:'auto',metric:'quantity',color:'#f2aa3b'}));
  document.getElementById('visualAddLink').onclick=()=>{linksEl.querySelector('.visual-link-empty')?.remove();linksEl.insertAdjacentHTML('beforeend',visualLinkRowHTML({id:uid('link'),sourceId:item.id,sourceVar:item.visualVars[0]?.name||'المخزون الحالي',targetId:'alerts',targetField:'القيمة الحالية',transform:'same',sync:'live'},item));};
  rowsEl.addEventListener('click',e=>{if(e.target.closest('[data-v-delete]'))e.target.closest('[data-vrow]').remove();});
  linksEl.addEventListener('click',e=>{if(e.target.closest('[data-link-delete]'))e.target.closest('[data-vlink-row]').remove();});
  document.getElementById('visualCancel').onclick=closeModal;
  document.getElementById('visualSave').onclick=()=>{
    const vars=[...rowsEl.querySelectorAll('[data-vrow]')].map(row=>{const g=k=>row.querySelector(`[data-v="${k}"]`);return {id:row.dataset.vrow,name:g('name').value.trim()||'مؤشر',unit:g('unit').value.trim(),min:numI(g('min').value,0),max:numI(g('max').value,100),current:numI(g('current').value,0),mode:g('mode').value,visible:g('visible').checked,scope:g('scope').value,metric:g('metric').value,color:g('color').value};});
    const links=[...linksEl.querySelectorAll('[data-vlink-row]')].map(row=>{const g=k=>row.querySelector(`[data-link="${k}"]`);return {id:row.dataset.vlinkRow,sourceId:g('sourceId').value,sourceVar:g('sourceVar').value,targetId:g('targetId').value,targetField:g('targetField').value,transform:g('transform').value,sync:'live'};});

  };
}
