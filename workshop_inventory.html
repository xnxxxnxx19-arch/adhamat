<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مخزن المكونات · التوأم الرقمي للورشة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --panel:#12181f; --panel2:#1a2330; --panel3:#212c3b;
  --border:#28323f; --border-lt:#33404f;
  --text:#e7edf5; --dim:#8ea0b3; --dim2:#5d6c7d;
  --amber:#f2a93c; --amber-dim:#3a2d16;
  --green:#3ddc84; --green-dim:#123321;
  --yellow:#f2c53d; --yellow-dim:#3a3212;
  --red:#ff5d5d; --red-dim:#3a1414;
  --blue:#4da3ff; --blue-dim:#122a44;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans Arabic','Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
body{background-image:
  linear-gradient(var(--bg) 0, var(--bg) 100%),
  repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 24px),
  repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 24px);
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);border-radius:6px;padding:8px 10px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-lt);border-radius:4px;}
.hidden{display:none !important;}
a{color:var(--blue);}

.app-shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:230px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px 8px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--amber),#b5721f);display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a1000;font-family:var(--mono);font-size:15px;}
.brand-text{line-height:1.25;}
.brand-text b{font-size:14.5px;display:block;}
.brand-text span{font-size:11px;color:var(--dim);font-family:var(--mono);}
nav.navlist{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:var(--dim);text-align:right;padding:9px 10px;border-radius:8px;font-size:13.5px;transition:.15s;}
.nav-item .ico{font-size:15px;width:18px;text-align:center;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel3);color:var(--amber);border-right:3px solid var(--amber);padding-right:7px;}
.save-badge{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);padding:8px 10px;border-radius:8px;border:1px solid var(--border);cursor:default;text-align:center;}
.save-badge.fail{cursor:pointer;color:var(--red);border-color:var(--red);}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:relative;z-index:20;}
.search-wrap{position:relative;flex:1;max-width:520px;}
#searchInput{width:100%;padding:10px 14px;font-size:13.5px;}
.search-results{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--panel3);border:1px solid var(--border-lt);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-height:360px;overflow-y:auto;z-index:50;}
.sres-item{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:center;}
.sres-item:last-child{border-bottom:none;}
.sres-item:hover{background:var(--panel2);}
.sres-name{font-weight:600;font-size:13.5px;}
.sres-meta{font-size:11px;color:var(--dim);font-family:var(--mono);}
.sres-loc{font-size:11px;color:var(--amber);font-family:var(--mono);white-space:nowrap;}
.notif-bell{position:relative;font-size:19px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
#notifCount{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-size:10px;font-family:var(--mono);border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;}
.notif-panel{position:absolute;top:60px;left:20px;width:340px;max-height:70vh;overflow-y:auto;background:var(--panel3);border:1px solid var(--border-lt);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:60;padding:8px;}
.notif-row{padding:10px 12px;border-radius:8px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;}
.notif-row:hover{background:var(--panel2);}

#viewContainer{flex:1;overflow-y:auto;padding:22px 26px 60px 26px;}
.view-title{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
.view-title h1{font-size:19px;margin:0;}
.view-title .sub{color:var(--dim);font-size:12.5px;}
.view-desc{color:var(--dim);font-size:12.5px;margin-bottom:18px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;}
.stat-card .num{font-family:var(--mono);font-size:24px;font-weight:600;}
.stat-card .lbl{font-size:11.5px;color:var(--dim);margin-top:2px;}
.stat-card.warn .num{color:var(--yellow);}
.stat-card.crit .num{color:var(--red);}
.stat-card.good .num{color:var(--green);}
.stat-card.info .num{color:var(--blue);}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
.panel h3{margin:0 0 12px 0;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
.btn{background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:500;transition:.15s;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.primary{background:var(--amber);color:#1a1000;border-color:var(--amber);}
.btn.primary:hover{filter:brightness(1.1);color:#1a1000;}
.btn.danger{color:var(--red);border-color:var(--red-dim);}
.btn.danger:hover{background:var(--red-dim);}
.btn.small{padding:5px 10px;font-size:11.5px;}

/* Storage / cabinet visuals */
.rack-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:22px;overflow:hidden;}
.rack-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,var(--panel3),var(--panel2));border-bottom:1px solid var(--border);}
.rack-plate{display:flex;align-items:center;gap:10px;}
.plate-tag{font-family:var(--mono);font-size:11px;background:var(--amber-dim);color:var(--amber);border:1px solid #5a4420;padding:3px 8px;border-radius:5px;}
.rack-head b{font-size:14px;}
.rack-head .meta{color:var(--dim);font-size:11px;}
.rack-head-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;width:100%;}
.rack-columns{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start;background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px);
}
.rack-column{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;min-width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.column-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.column-head b{color:var(--amber);}
.box-card{background:var(--panel3);border:1px solid var(--border-lt);border-radius:8px;padding:8px;}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;margin-bottom:6px;}
.box-head b{font-size:12px;}
.box-cells{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;}
.cell{position:relative;border-radius:7px;border:1px solid var(--border-lt);background:var(--panel);min-height:58px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;overflow:hidden;}
.cell::before,.cell::after{content:'';position:absolute;top:5px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.06);}
.cell::before{right:5px;} .cell::after{left:5px;}
.cell:hover{border-color:var(--amber);transform:translateY(-1px);}
.cell .cid{font-family:var(--mono);font-size:9.5px;color:var(--dim2);}
.cell .cname{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell .cqty{font-family:var(--mono);font-size:14px;font-weight:700;}
.cell.status-green{border-right:4px solid var(--green);}
.cell.status-yellow{border-right:4px solid var(--yellow);}
.cell.status-red{border-right:4px solid var(--red);}
.cell.status-empty{border-style:dashed;opacity:.55;align-items:center;justify-content:center;}
.cell.status-empty .plus{font-size:18px;color:var(--dim2);}
.cell.highlight{animation:pulseBlue 1.1s ease-in-out 3;border-color:var(--blue) !important;box-shadow:0 0 0 3px var(--blue-dim),0 0 20px rgba(77,163,255,.5);}
@keyframes pulseBlue{0%,100%{box-shadow:0 0 0 3px var(--blue-dim);}50%{box-shadow:0 0 0 6px rgba(77,163,255,.25);}}
.cell.dragover{outline:2px dashed var(--amber);}

/* flash sequence: rack -> column -> box -> cell */
@keyframes flashStep{0%,100%{box-shadow:none;} 50%{box-shadow:0 0 0 4px var(--amber-dim),0 0 26px rgba(242,169,60,.6);border-color:var(--amber) !important;}}
.flash-step{animation:flashStep .55s ease-in-out 2;}
@keyframes pulseWait{0%,100%{box-shadow:0 0 0 3px var(--blue-dim);} 50%{box-shadow:0 0 0 8px rgba(77,163,255,.4);}}
.cell.flash-wait{animation:pulseWait 1s ease-in-out infinite !important;border-color:var(--blue) !important;z-index:5;}

/* collapsed rack list card */
.rack-panel.compact-only{cursor:default;}

/* full-page rack view: takes over the whole storage screen, columns on top, selected box's cells below */
.rack-fullpage-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 150px);}
.rack-fullpage-wrap .rack-head-top{flex-wrap:wrap;}
.rack-fullpage-columns{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start;border-bottom:1px solid var(--border);background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px);
}
.box-chip{background:var(--panel3);border:1px solid var(--border-lt);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:150px;transition:.15s;}
.box-chip:hover{border-color:var(--amber);}
.box-chip.selected{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-dim);background:var(--panel2);}
.box-chip .bc-name{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.box-chip .bc-name b{font-size:12.5px;}
.box-chip .bc-count{font-family:var(--mono);color:var(--dim);font-size:11px;}
.box-chip .bc-hint{font-size:10px;color:var(--dim2);margin-top:3px;}
.rack-detail-panel{flex:1;padding:20px;background:var(--panel2);min-height:340px;}
.rack-detail-panel .box-card.expanded{background:transparent;border:none;padding:0;}
.rack-detail-empty{text-align:center;color:var(--dim);padding:70px 20px;font-size:13px;}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.preset-row button.active{border-color:var(--amber);color:var(--amber);}

/* checklist */
.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.check-row:last-child{border-bottom:none;}
.check-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--amber);flex-shrink:0;}
.check-row .ctext{flex:1;font-size:13px;}
.check-row .ctext.done{color:var(--dim);text-decoration:line-through;}
.check-row .cdate{font-size:10.5px;color:var(--dim2);font-family:var(--mono);}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,6,9,.7);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:var(--panel);border:1px solid var(--border-lt);border-radius:16px;width:100%;max-width:640px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h2{margin:0;font-size:16px;}
.modal-head .close{background:transparent;border:none;color:var(--dim);font-size:20px;}
.modal-tabs{display:flex;gap:4px;padding:10px 16px 0 16px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.mtab{background:transparent;border:none;color:var(--dim);padding:8px 10px;font-size:12px;border-radius:6px 6px 0 0;}
.mtab.active{color:var(--amber);background:var(--panel2);}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1;}
.mpanel{display:none;}
.mpanel.active{display:block;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.field-row.full{grid-template-columns:1fr;}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.chip{display:inline-block;background:var(--panel3);border:1px solid var(--border-lt);border-radius:20px;padding:3px 10px;font-size:11px;margin:2px;}
.chip.green{color:var(--green);} .chip.yellow{color:var(--yellow);} .chip.red{color:var(--red);}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.tbl th{text-align:right;color:var(--dim);font-weight:500;font-size:11px;padding:8px 10px;border-bottom:1px solid var(--border);}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);}
table.tbl tr:hover td{background:var(--panel2);}
.pill{padding:2px 8px;border-radius:20px;font-size:10.5px;font-family:var(--mono);}
.pill.green{background:var(--green-dim);color:var(--green);}
.pill.yellow{background:var(--yellow-dim);color:var(--yellow);}
.pill.red{background:var(--red-dim);color:var(--red);}
.pill.gray{background:var(--panel3);color:var(--dim);}

.hist-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.hist-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.hist-ico.use{background:var(--red-dim);color:var(--red);}
.hist-ico.purchase{background:var(--green-dim);color:var(--green);}
.hist-ico.move{background:var(--blue-dim);color:var(--blue);}
.hist-ico.adjust{background:var(--yellow-dim);color:var(--yellow);}
.hist-main b{font-size:12.5px;}
.hist-main .d{font-size:11px;color:var(--dim);font-family:var(--mono);}

.map-board{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;min-height:520px;padding:20px;overflow:auto;}
.map-item{position:absolute;background:var(--panel3);border:1px solid var(--border-lt);border-radius:10px;padding:10px 12px;cursor:grab;user-select:none;min-width:110px;text-align:center;transition:border-color .15s;}
.map-item:hover{border-color:var(--amber);}
.map-item b{display:block;font-size:12px;}
.map-item span{font-size:10px;color:var(--dim);font-family:var(--mono);}
.map-item.wb{border-style:dashed;}

.bar-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;}
.bar{width:100%;background:linear-gradient(180deg,var(--amber),#8a5c1c);border-radius:4px 4px 0 0;min-height:3px;}
.bar-lbl{font-size:9.5px;color:var(--dim);text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-val{font-family:var(--mono);font-size:10px;color:var(--text);}

.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.donut{width:130px;height:130px;border-radius:50%;flex-shrink:0;}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px;}
.legend .sw{width:10px;height:10px;border-radius:3px;}

.empty-state{text-align:center;padding:40px 20px;color:var(--dim);}
.empty-state .big{font-size:32px;margin-bottom:8px;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.searchbox-inline{flex:1;min-width:180px;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;}
.card:hover{border-color:var(--amber);}
.card b{font-size:13.5px;display:block;}
.card .sub{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:2px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);padding:10px 18px;border-radius:10px;font-size:12.5px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.5);}
@media (max-width:820px){
  .sidebar{width:64px;}
  .brand-text,.nav-item span.lbl{display:none;}
  .save-badge{font-size:0;}
  .field-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">S01</div>
      <div class="brand-text"><b>ورشة المكونات</b><span>DIGITAL TWIN</span></div>
    </div>
    <nav class="navlist" id="navlist">
      <button class="nav-item" data-view="dashboard"><span class="ico">🏠</span><span class="lbl">لوحة التحكم</span></button>
      <button class="nav-item" data-view="storage"><span class="ico">🗄️</span><span class="lbl">التخزين المرئي</span></button>
      <button class="nav-item" data-view="map"><span class="ico">🗺️</span><span class="lbl">خريطة الورشة</span></button>
      <button class="nav-item" data-view="components"><span class="ico">🔩</span><span class="lbl">المكونات</span></button>
      <button class="nav-item" data-view="lowstock"><span class="ico">⚠️</span><span class="lbl">نقص المخزون</span></button>
      <button class="nav-item" data-view="purchases"><span class="ico">🛒</span><span class="lbl">المشتريات</span></button>
      <button class="nav-item" data-view="checklist"><span class="ico">✅</span><span class="lbl">تشيك ليست</span></button>
      <button class="nav-item" data-view="history"><span class="ico">🕘</span><span class="lbl">سجل الاستخدام</span></button>
      <button class="nav-item" data-view="projects"><span class="ico">📁</span><span class="lbl">المشاريع</span></button>
      <button class="nav-item" data-view="experiments"><span class="ico">🧪</span><span class="lbl">التجارب</span></button>
      <button class="nav-item" data-view="stats"><span class="ico">📊</span><span class="lbl">الإحصائيات</span></button>
      <button class="nav-item" data-view="settings"><span class="ico">⚙️</span><span class="lbl">الإعدادات</span></button>
    </nav>
    <div class="save-badge" id="saveBadge">🟢 محفوظ</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="search-wrap">
        <input id="searchInput" placeholder="🔍 ابحث عن مكون بالاسم أو الرقم أو الفئة...">
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div class="notif-bell" id="notifBell">🔔<span id="notifCount" class="hidden"></span></div>
    </header>
    <main id="viewContainer"></main>
  </div>
</div>
<div id="notifPanel" class="notif-panel hidden"></div>
<div id="modalRoot"></div>

<script>
/* ============================= DATA MODEL ============================= */
const DB_NAME='workshop_twin_db', DB_VERSION=1, STORE='kv', STATE_KEY='app_state';
const FALLBACK_KEY='workshop_twin_state_fallback';

/* ============================= INDEXEDDB PERSISTENCE ============================= */
let dbPromise=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(DB_NAME,DB_VERSION);
      req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    }catch(e){reject(e);}
  });
  return dbPromise;
}
async function idbGet(key){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly');
    const r=tx.objectStore(STORE).get(key);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
async function idbSet(key,val){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(val,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}

let saveTimer=null;
function setSaveBadge(status,extra){
  const el=document.getElementById('saveBadge');
  el.classList.remove('fail');
  el.onclick=null;
  if(status==='pending'){ el.textContent='🟡 جارٍ الحفظ...'; }
  else if(status==='saved'){ el.textContent='🟢 تم الحفظ '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); }
  else if(status==='fail'){
    el.textContent='🔴 فشل الحفظ (اضغط للتفاصيل)';
    el.classList.add('fail');
    el.onclick=()=>alert('تشخيص الخطأ:\\n'+(extra||'خطأ غير معروف')+'\\n\\nتم استخدام التخزين الاحتياطي (localStorage) كإجراء وقائي.');
  }
}
function scheduleSave(){
  setSaveBadge('pending');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,500);
}
async function doSave(){
  const json=JSON.stringify(state);
  try{
    await idbSet(STATE_KEY,json);
    try{ localStorage.setItem(FALLBACK_KEY,json); }catch(e){}
    setSaveBadge('saved');
  }catch(e){
    let msg=e && e.name ? e.name : 'Unknown';
    if(msg==='QuotaExceededError') msg='تجاوز حد التخزين المسموح (QuotaExceededError)';
    else if(msg==='SecurityError') msg='تم رفض الوصول للتخزين (SecurityError) - قد يكون المتصفح في وضع التصفح الخاص';
    else msg='خطأ غير معروف: '+msg;
    try{ localStorage.setItem(FALLBACK_KEY,json); setSaveBadge('fail',msg+'\\n(تم الحفظ احتياطيًا في localStorage)'); }
    catch(e2){ setSaveBadge('fail',msg+'\\nفشل أيضًا الحفظ الاحتياطي.'); }
  }
}
function flushSaveNow(){
  try{
    const json=JSON.stringify(state);
    localStorage.setItem(FALLBACK_KEY,json);
    idbSet(STATE_KEY,json).catch(()=>{});
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSaveNow(); });
window.addEventListener('pagehide',flushSaveNow);
window.addEventListener('beforeunload',flushSaveNow);

/* ترقية البيانات القديمة (رفوف بها صفوف/أعمدة شبكية) إلى نظام الأعمدة/العبوات/الخلايا الجديد */
function migrateStateIfNeeded(){
  if(!state || state.columns) return; // بيانات جديدة بالفعل أو لا توجد بيانات
  const oldContainersById={};
  (state.containers||[]).forEach(c=>{ oldContainersById[c.id]=c; });
  state.columns=[]; state.boxes=[]; state.containers=[];
  [...(state.shelves||[]),...(state.drawers||[])].forEach(rack=>{
    const oldCells=rack.cells||[];
    const oldCols=rack.cols||(oldCells.length?Math.max(...oldCells.map(c=>c.col)):0);
    const oldRows=rack.rows||(oldCells.length?Math.max(...oldCells.map(c=>c.row)):0);
    for(let c=1;c<=oldCols;c++){
      const col={id:uid('col'),rackId:rack.id,order:c,name:'عمود '+c};
      state.columns.push(col);
      const box={id:uid('box'),columnId:col.id,order:1,label:'عبوة '+c,cellCount:oldRows};
      state.boxes.push(box);
      for(let r=1;r<=oldRows;r++){
        const oldCell=oldCells.find(x=>x.row===r&&x.col===c);
        let componentId=null, quantity=0;
        if(oldCell && oldCell.containerId){
          const oldCont=oldContainersById[oldCell.containerId];
          if(oldCont){ componentId=oldCont.componentId; quantity=Number(oldCont.quantity||0); }
        }
        state.containers.push({id:uid('cell'),boxId:box.id,index:r-1,componentId,quantity,dateAdded:nowISO()});
      }
    }
    delete rack.cells; delete rack.cols; delete rack.rows;
  });
  scheduleSave();
}

/* يضمن وجود تقسيمة صفوف/أعمدة لكل عبوة (للبيانات القديمة التي بها عدد خلايا فقط) وقائمة تشيك ليست */
function ensureNewFields(){
  let changed=false;
  (state.boxes||[]).forEach(b=>{
    if(!b.rows || !b.cols){
      b.rows=1; b.cols=b.cellCount||cellsOfBox(b.id).length||1; changed=true;
    }
  });
  if(!state.checklist){ state.checklist=[]; changed=true; }
  if(!state.purchases) state.purchases=[];
  if(changed) scheduleSave();
}

async function loadState(){
  try{
    const raw=await idbGet(STATE_KEY);
    if(raw){ state=JSON.parse(raw); migrateStateIfNeeded(); ensureNewFields(); return; }
  }catch(e){}
  try{
    const raw=localStorage.getItem(FALLBACK_KEY);
    if(raw){ state=JSON.parse(raw); migrateStateIfNeeded(); ensureNewFields(); scheduleSave(); return; }
  }catch(e){}
  state=seedState();
  scheduleSave();
}

/* ============================= HELPERS: DATA QUERIES ============================= */
function allRacks(){ return [...state.shelves, ...state.drawers]; }
function findBox(id){ return state.boxes.find(b=>b.id===id); }
function findColumn(id){ return state.columns.find(c=>c.id===id); }
function columnsOfRack(rackId){ return state.columns.filter(c=>c.rackId===rackId).sort((a,b)=>a.order-b.order); }
function boxesOfColumn(colId){ return state.boxes.filter(b=>b.columnId===colId).sort((a,b)=>a.order-b.order); }
function cellsOfBox(boxId){ return state.containers.filter(c=>c.boxId===boxId).sort((a,b)=>a.index-b.index); }
function findContainer(id){ return state.containers.find(c=>c.id===id); } // "container" هنا = خلية (تحمل مكون+كمية مباشرة)
function findCell(cellId){ return findContainer(cellId); }
function findRackByCellId(cellId){
  const cell=findContainer(cellId); if(!cell) return null;
  const box=findBox(cell.boxId); if(!box) return null;
  const col=findColumn(box.columnId); if(!col) return null;
  return allRacks().find(r=>r.id===col.rackId)||null;
}
function findComponent(id){ return state.components.find(c=>c.id===id); }
function containerOfComponent(compId){ return state.containers.filter(c=>c.componentId===compId); }
function totalQtyOfComponent(compId){ return containerOfComponent(compId).reduce((s,c)=>s+Number(c.quantity||0),0); }
function cellStatus(cell){
  if(!cell.componentId) return 'empty';
  const comp=findComponent(cell.componentId);
  if(!comp) return 'gray';
  const q=Number(cell.quantity||0);
  if(q<=Number(comp.criticalStock||0)) return 'red';
  if(q<=Number(comp.warningStock||0)) return 'yellow';
  return 'green';
}
function locationLabel(cellId){
  if(!cellId) return 'غير مخصص (مؤقت)';
  const cell=findContainer(cellId); if(!cell) return cellId;
  const box=findBox(cell.boxId); if(!box) return cellId;
  const col=findColumn(box.columnId);
  const rack=col? allRacks().find(r=>r.id===col.rackId): null;
  if(!rack||!col) return `${box.label} · خلية ${cell.index+1}`;
  return `${rack.name} · ${col.name} · ${box.label} · خلية ${cell.index+1}`;
}
function statusColor(s){ return {green:'#3ddc84',yellow:'#f2c53d',red:'#ff5d5d',empty:'#5d6c7d',gray:'#5d6c7d'}[s]||'#5d6c7d'; }
function statusLabelAr(s){ return {green:'طبيعي',yellow:'تحذير',red:'حرج',empty:'فارغ',gray:'غير معروف'}[s]||s; }

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

/* ============================= MODAL SYSTEM ============================= */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(title,bodyHTML,footHTML,tabs){
  const root=document.getElementById('modalRoot');
  let tabsHTML='';
  if(tabs&&tabs.length){
    tabsHTML='<div class="modal-tabs">'+tabs.map((t,i)=>`<button class="mtab ${i===0?'active':''}" data-mtab="${t.id}">${t.label}</button>`).join('')+'</div>';
  }
  root.innerHTML=`<div class="modal-backdrop" id="mbackdrop">
    <div class="modal-box">
      <div class="modal-head"><h2>${title}</h2><button class="close" id="mclose">✕</button></div>
      ${tabsHTML}
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML?`<div class="modal-foot">${footHTML}</div>`:''}
    </div>
  </div>`;
  document.getElementById('mclose').onclick=closeModal;
  document.getElementById('mbackdrop').addEventListener('click',e=>{ if(e.target.id==='mbackdrop') closeModal(); });
  if(tabs&&tabs.length){
    root.querySelectorAll('.mtab').forEach(btn=>{
      btn.onclick=()=>{
        root.querySelectorAll('.mtab').forEach(b=>b.classList.remove('active'));
        root.querySelectorAll('.mpanel').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        const p=root.querySelector(`.mpanel[data-panel="${btn.dataset.mtab}"]`);
        if(p) p.classList.add('active');
      };
    });
  }
}

  document.getElementById('useBtn').onclick=()=>{
    const q=Number(document.getElementById('useQty').value||0);
    if(q<=0||q>cont.quantity){ toast('كمية غير صالحة'); return; }
    cont.quantity-=q;
    const projName=document.getElementById('useProject').value.trim();
    let proj=state.projects.find(p=>p.name===projName);
    if(projName && !proj){ proj={id:uid('proj'),name:projName,description:'',date:nowISO(),componentsUsed:[]}; state.projects.push(proj); }
    if(proj) proj.componentsUsed.push({componentId:comp.id,qty:q,date:nowISO()});
    state.usageHistory.unshift({id:uid('h'),date:nowISO(),componentId:comp.id,type:'use',qtyChange:-q,project:projName,purpose:document.getElementById('usePurpose').value,notes:document.getElementById('useNotes').value,fromLocation:cellId,toLocation:''});

    const pIdx=state.purchases.findIndex(p=>p.componentId===comp.id && p.status==='pending');
    if(pIdx>-1) state.purchases.splice(pIdx,1);
    scheduleSave(); closeModal(); showView(currentView); toast('تم تسجيل الاستلام');
  };

    const name=document.getElementById('exName').value.trim();

    state.experiments.unshift({id:uid('exp'),componentId:comp.id,name,date:nowISO(),circuit:document.getElementById('exCircuit').value,voltage:document.getElementById('exVolt').value,current:document.getElementById('exCurr').value,frequency:document.getElementById('exFreq').value,temperature:document.getElementById('exTemp').value,measurement:document.getElementById('exMeasure').value,result:document.getElementById('exResult').value,notes:document.getElementById('exNotes').value,images:[],project:''});
    scheduleSave(); closeModal(); showView(currentView); toast('تم حفظ التجربة');
  };
  document.getElementById('saveNotesBtn').onclick=()=>{
    comp.notes=document.getElementById('noteText').value;
    comp.images=document.getElementById('imgLinks').value.split('\\n').map(s=>s.trim()).filter(Boolean);
    comp.links=document.getElementById('usefulLinks').value.split('\\n').map(s=>s.trim()).filter(Boolean);
    scheduleSave(); closeModal(); showView(currentView); toast('تم حفظ الملاحظات');
  };
  document.getElementById('doMoveBtn').onclick=()=>{
    const target=document.getElementById('moveTarget').value;
    if(!target){ toast('اختر خلية هدف'); return; }
    moveContainer(cont.id,target);
    closeModal(); showView(currentView); toast('تم النقل بنجاح');
  };
  document.getElementById('delContBtn').onclick=()=>{
    if(!confirm('هل أنت متأكد من إفراغ هذه الخلية؟ ستبقى الخلية نفسها موجودة داخل العبوة.')) return;
    cont.componentId=null; cont.quantity=0;
    scheduleSave(); closeModal(); showView(currentView); toast('تم إفراغ الخلية');
  };
}

function emptyCellOptions(){
  let out='';
  state.containers.filter(c=>!c.componentId).forEach(c=>{ out+=`<option value="${c.id}">${locationLabel(c.id)}</option>`; });
  return out;
}

function moveContainer(fromCellId,targetCellId){
  const fromCell=findContainer(fromCellId);
  const targetCell=findContainer(targetCellId);
  if(!fromCell||!targetCell||fromCellId===targetCellId) return;
  if(targetCell.componentId){
    if(!confirm('الخلية الهدف بها مكون آخر بالفعل. هل تريد تبديل محتوى الخليتين؟')) return;
    const tmpComp=targetCell.componentId, tmpQty=targetCell.quantity;
    targetCell.componentId=fromCell.componentId; targetCell.quantity=fromCell.quantity;
    fromCell.componentId=tmpComp; fromCell.quantity=tmpQty;
  } else {
    targetCell.componentId=fromCell.componentId; targetCell.quantity=fromCell.quantity;
    fromCell.componentId=null; fromCell.quantity=0;
  }
  state.usageHistory.unshift({id:uid('h'),date:nowISO(),componentId:targetCell.componentId,type:'move',qtyChange:0,project:'',purpose:'نقل مكون بين الخلايا',notes:'',fromLocation:fromCellId,toLocation:targetCellId});
  scheduleSave();
}

function histRowHTML(h){
  const comp=findComponent(h.componentId);
  const icoMap={use:'📤',purchase:'📥',move:'🔀',adjust:'✏️'};
  const signed=h.qtyChange>0?`+${h.qtyChange}`:(h.qtyChange<0?`${h.qtyChange}`:'');
  let desc='';
  if(h.type==='use') desc=`استخدام ${signed} قطعة${h.project?(' · مشروع: '+h.project):''}${h.purpose?(' · '+h.purpose):''}`;
  else if(h.type==='purchase') desc=`إضافة/شراء ${signed} قطعة${h.notes?(' · '+h.notes):''}`;
  else if(h.type==='move') desc=`نُقلت من ${h.fromLocation||'—'} إلى ${h.toLocation||'—'}`;
  else desc=h.purpose||'';
  return `<div class="hist-row"><div class="hist-ico ${h.type}">${icoMap[h.type]||'•'}</div>
    <div class="hist-main"><b>${comp?comp.name:'مكون محذوف'}</b><div class="d">${fmtDate(h.date)}</div><div style="font-size:12px;margin-top:2px;">${desc}</div></div></div>`;
}
function expRowHTML(ex){
  return `<div class="card" style="margin-bottom:8px;cursor:default;">
    <div style="display:flex;justify-content:space-between;"><b>${ex.name}</b><span class="pill ${ex.result==='PASS'?'green':'red'}">${ex.result}</span></div>
    <div class="sub">${fmtDate(ex.date)} ${ex.circuit?(' · '+ex.circuit):''}</div>
    <div style="font-size:12px;margin-top:4px;color:var(--dim);">${[ex.voltage&&('V: '+ex.voltage),ex.current&&('I: '+ex.current),ex.temperature&&('T: '+ex.temperature)].filter(Boolean).join(' · ')}</div>
    ${ex.notes?`<div style="font-size:12px;margin-top:4px;">${ex.notes}</div>`:''}
  </div>`;
}

/* ============================= VIEWS ============================= */
function viewHeader(title,sub){
  return `<div class="view-title"><h1>${title}</h1><span class="sub">${sub||''}</span></div>`;
}

function computeNotifications(){
  const list=[];
  state.components.forEach(comp=>{
    const total=totalQtyOfComponent(comp.id);
    if(total<=0) list.push({type:'crit',icon:'⛔',text:`${comp.name} — نفد المخزون`,go:()=>{showView('components');}});
    else if(total<=comp.criticalStock) list.push({type:'crit',icon:'🔴',text:`${comp.name} — مستوى حرج (${total})`,go:()=>{showView('components');}});
    else if(total<=comp.warningStock) list.push({type:'warn',icon:'⚠️',text:`${comp.name} — مخزون منخفض (${total})`,go:()=>{showView('components');}});
  });
  const pendingPurchases=state.purchases.filter(p=>p.status==='pending').length;
  if(pendingPurchases) list.push({type:'info',icon:'🛒',text:`${pendingPurchases} عناصر بانتظار الشراء`,go:()=>showView('purchases')});
  const failedExp=state.experiments.filter(e=>e.result==='FAIL').length;
  if(failedExp) list.push({type:'info',icon:'🧪',text:`${failedExp} تجارب بنتيجة FAIL تحتاج مراجعة`,go:()=>showView('experiments')});
  return list;
}
function renderNotifBadge(){
  const list=computeNotifications();
  const c=document.getElementById('notifCount');
  if(list.length){ c.textContent=list.length; c.classList.remove('hidden'); } else c.classList.add('hidden');
}

      <div class="stat-card crit"><div class="num">${out.length}</div><div class="lbl">نفد المخزون</div></div>
      <div class="stat-card info"><div class="num">${totalUsage}</div><div class="lbl">إجمالي القطع المستخدمة</div></div>
    </div>
    <div class="panel">
      <h3>🔔 التنبيهات (${notifs.length})</h3>

    <div class="panel">

function renderStorage(){
  const vc=document.getElementById('viewContainer');
  if(uiState.expandedRack){
    const rack=allRacks().find(r=>r.id===uiState.expandedRack);
    if(rack){
      vc.innerHTML=rackFullPageHTML(rack);
      wireCellEvents();
      wireBoxChipEvents();
      return;
    }
    uiState.expandedRack=null;
  }
  let html=viewHeader('التخزين المرئي','رف ← أعمدة ← عبوات ← خلايا — اضغط 🔍 تكبير على أي رف لفتحه بحجم الصفحة')+`
  <div class="toolbar">
    <button class="btn primary small" onclick="openAddRack('shelf')">+ إضافة رف</button>
    <button class="btn primary small" onclick="openAddRack('drawer')">+ إضافة درج</button>
  </div>`;
  allRacks().forEach(r=>{ html+=rackCollapsedHTML(r); });
  vc.innerHTML=html;
}
function rackCollapsedHTML(rack){
  const cols=columnsOfRack(rack.id);
  let totalCells=0, occCells=0;
  cols.forEach(col=>{ boxesOfColumn(col.id).forEach(box=>{ const cells=cellsOfBox(box.id); totalCells+=cells.length; occCells+=cells.filter(c=>c.componentId).length; }); });
  return `<div class="rack-panel" data-rack-id="${rack.id}">
    <div class="rack-head">
      <div class="rack-head-top">
        <div class="rack-plate"><span class="plate-tag">${rack.type==='shelf'?'S'+pad(rack.number):'D'+pad(rack.number)}</span><b>${rack.name}</b></div>
        <div class="meta">${rack.description||''} · ${occCells}/${totalCells} خلية مشغولة · ${cols.length} عمود</div>
        <button class="btn small primary" onclick="toggleRackExpand('${rack.id}')">🔍 تكبير</button>
      </div>
    </div>
  </div>`;
}
function toggleRackExpand(rackId){
  uiState.expandedRack = (uiState.expandedRack===rackId) ? null : rackId;
  uiState.selectedBox=null;
  showView('storage');
}
function selectBox(boxId){
  uiState.selectedBox = (uiState.selectedBox===boxId) ? null : boxId;
  showView('storage');
}
function boxChipHTML(box){
  const cells=cellsOfBox(box.id);
  const occ=cells.filter(c=>c.componentId).length;
  const rows=box.rows||1, cols=box.cols||cells.length||1;
  const selected=uiState.selectedBox===box.id;
  return `<div class="box-chip ${selected?'selected':''}" data-box-id="${box.id}">
    <div class="bc-name"><b>${box.label}</b><span class="bc-count">${occ}/${cells.length}</span></div>
    <div class="bc-hint">تقسيمة ${rows}×${cols}${selected?' · معروضة أسفل':''}</div>
  </div>`;
}
function columnChipsHTML(col){
  const boxes=boxesOfColumn(col.id);
  const boxesHTML=boxes.map(box=>boxChipHTML(box)).join('');
  return `<div class="rack-column" data-col-id="${col.id}">
    <div class="column-head">
      <b>${col.name}</b>
      <div style="display:flex;gap:4px;">
        <button class="btn small" onclick="openAddBox('${col.id}')">+ عبوة</button>
        <button class="btn small danger" onclick="removeColumn('${col.id}')" title="حذف العمود">🗑</button>

function wireCellEvents(){
  document.querySelectorAll('.cell').forEach(el=>{

    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('dragover'); });

/* يفتح الرف بحجم الصفحة، يختار العبوة المطلوبة (تظهر تقسيمتها ومحتواها أسفل الأعمدة)،
   ثم يعمل فلاش متسلسل: رف ← عمود/عبوة ← لوحة التفاصيل ← خلية، وتبقى الخلية توميض حتى يفتحها المستخدم */
function revealAndFlash(cellId){
  const cell=findContainer(cellId); if(!cell) return;
  const box=findBox(cell.boxId); if(!box) return;
  const col=findColumn(box.columnId); if(!col) return;
  const rack=allRacks().find(r=>r.id===col.rackId); if(!rack) return;

  uiState.expandedRack=rack.id;
  uiState.selectedBox=box.id;
  showView('storage');

  setTimeout(()=>{
    const wrapEl=document.querySelector('.rack-fullpage-wrap');
    const colEl=document.querySelector(`.rack-column[data-col-id="${col.id}"]`);
    const chipEl=document.querySelector(`.box-chip[data-box-id="${box.id}"]`);
    const panelEl=document.querySelector('[data-detail-panel]');
    const cellEl=document.querySelector(`.cell[data-cell-id="${cellId}"]`);

    if(wrapEl) wrapEl.scrollIntoView({behavior:'smooth',block:'start'});

    if(colEl){ colEl.classList.add('flash-step'); setTimeout(()=>colEl.classList.remove('flash-step'),1150); }
    setTimeout(()=>{ if(chipEl){ chipEl.classList.add('flash-step'); setTimeout(()=>chipEl.classList.remove('flash-step'),1150); } },380);
    setTimeout(()=>{ if(panelEl){ panelEl.classList.add('flash-step'); setTimeout(()=>panelEl.classList.remove('flash-step'),1150); } },760);
    setTimeout(()=>{
      if(cellEl){ cellEl.scrollIntoView({behavior:'smooth',block:'center'}); cellEl.classList.add('flash-wait'); }
    },1150);
  },80);
}
function jumpToCell(cellId){ revealAndFlash(cellId); }

function removeBox(boxId){
  const cells=cellsOfBox(boxId);
  const msg=cells.some(c=>c.componentId)? 'هذه العبوة تحتوي على مكونات وسيتم حذفها نهائيًا مع محتواها. متابعة؟':'حذف هذه العبوة؟';
  if(!confirm(msg)) return;
  const ids=new Set(cells.map(c=>c.id));
  state.containers=state.containers.filter(c=>!ids.has(c.id));
  state.boxes=state.boxes.filter(b=>b.id!==boxId);
  if(uiState.selectedBox===boxId) uiState.selectedBox=null;
  scheduleSave(); showView('storage');
}
function setBoxLayout(boxId,rowsRaw,colsRaw){
  const box=findBox(boxId); if(!box) return;
  const rows=Math.max(1,Math.min(20,Number(rowsRaw)||1));
  const cols=Math.max(1,Math.min(20,Number(colsRaw)||1));
  const newCount=rows*cols;
  const cells=cellsOfBox(boxId);
  if(newCount<cells.length){
    const toRemove=cells.slice(newCount);
    if(toRemove.some(c=>c.componentId)){ toast('لا يمكن تصغير التقسيمة: بعض الخلايا مشغولة — أفرغها أولًا'); return; }
    const removeIds=new Set(toRemove.map(c=>c.id));
    state.containers=state.containers.filter(c=>!removeIds.has(c.id));
  } else if(newCount>cells.length){
    for(let i=cells.length;i<newCount;i++){ state.containers.push({id:uid('cell'),boxId,index:i,componentId:null,quantity:0,dateAdded:nowISO()}); }
  }
  box.rows=rows; box.cols=cols; box.cellCount=newCount;
  scheduleSave(); closeModal(); showView('storage'); toast('تم تحديث تقسيمة العبوة');
}

function renderMap(){

  `<div class="map-board" id="mapBoard" style="height:560px;">
    ${state.workshopMap.map(m=>`<div class="map-item ${m.type==='workbench'?'wb':''}" data-id="${m.id}" style="right:${m.x}px;top:${m.y}px;width:${m.w}px;min-height:${m.h}px;">
      <b>${m.label}</b><span>${m.type==='workbench'?'منطقة عمل':(m.type==='shelf'?'رف':'درج')}</span>
    </div>`).join('')}
  </div>`;
  document.querySelectorAll('.map-item').forEach(el=>{
    let dragging=false, sx=0, sy=0, ox=0, oy=0;
    el.addEventListener('pointerdown',e=>{
      dragging=true; sx=e.clientX; sy=e.clientY;
      const m=state.workshopMap.find(x=>x.id===el.dataset.id);
      ox=m.x; oy=m.y; el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove',e=>{
      if(!dragging) return;
      const dx=sx-e.clientX, dy=e.clientY-sy;
      const m=state.workshopMap.find(x=>x.id===el.dataset.id);
      m.x=Math.max(0,ox+dx); m.y=Math.max(0,oy+dy);
      el.style.right=m.x+'px'; el.style.top=m.y+'px';
    });
    el.addEventListener('pointerup',()=>{ if(dragging){ dragging=false; scheduleSave(); } });
    el.addEventListener('click',e=>{
      if(Math.abs(e.clientX-sx)>4||Math.abs(e.clientY-sy)>4) return;
      const m=state.workshopMap.find(x=>x.id===el.dataset.id);
      if(m.refId){ uiState.expandedRack=m.refId; uiState.selectedBox=null; showView('storage'); setTimeout(()=>{ const wrapEl=document.querySelector('.rack-fullpage-wrap'); if(wrapEl){ wrapEl.scrollIntoView({behavior:'smooth',block:'start'}); wrapEl.classList.add('flash-step'); setTimeout(()=>wrapEl.classList.remove('flash-step'),1150); } },60); }
    });
  });
}

function addToPurchaseList(compId){

  const need=Math.max(comp.targetStock-total,comp.reorderQty||0,1);
  const priority= total<=comp.criticalStock?'HIGH':'MEDIUM';
  state.purchases.unshift({id:uid('pur'),componentId:compId,need,priority,status:'pending',supplier:comp.supplier||'',price:comp.purchasePrice||0,date:nowISO()});

function receivePurchase(id){
  const p=state.purchases.find(x=>x.id===id); if(!p) return;
  if(!p.componentId){
    state.purchases=state.purchases.filter(x=>x.id!==id);
    scheduleSave(); showView('purchases'); toast('تم تعليم الصنف اليدوي كمُستلم');
    return;
  }
  const comp=findComponent(p.componentId);
  const containers=containerOfComponent(p.componentId);
  let target=containers[0];
  if(!target){ toast('لا يوجد موقع فعلي لهذا المكون — أضفه أولًا من التخزين المرئي'); return; }
  target.quantity+=p.need;
  state.usageHistory.unshift({id:uid('h'),date:nowISO(),componentId:p.componentId,type:'purchase',qtyChange:p.need,project:'',purpose:'استلام مشتريات',notes:'المورد: '+(p.supplier||'-'),fromLocation:'',toLocation:target.id});
  state.purchases=state.purchases.filter(x=>x.id!==id);
  scheduleSave(); showView('purchases'); toast('تم استلام الكمية وإضافتها للمخزون');
}
function openAddManualPurchase(){
  const compOptions=state.components.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  openModal('إضافة يدوية إلى سلة المشتريات',`
    <div class="field-row full"><div class="field"><label>اربطها بمكوّن موجود (اختياري)</label>
      <select id="mpComp"><option value="">— بدون ربط: اسم حر —</option>${compOptions}</select>
    </div></div>
    <div class="field-row full"><div class="field"><label>اسم الصنف (لو بدون ربط بمكوّن)</label><input id="mpName" placeholder="مثال: مفك براغي دقيق، أسلاك توصيل..."></div></div>
    <div class="field-row"><div class="field"><label>الكمية المطلوبة</label><input type="number" id="mpNeed" value="1" min="1"></div>
    <div class="field"><label>الأولوية</label><select id="mpPriority"><option value="MEDIUM">MEDIUM</option><option value="HIGH">HIGH</option></select></div></div>
    <div class="field-row"><div class="field"><label>المورد</label><input id="mpSupplier"></div>
    <div class="field"><label>السعر التقريبي</label><input type="number" id="mpPrice" value="0"></div></div>
  `,`<button class="btn" id="mpCancel">إلغاء</button><button class="btn primary" id="mpSave">إضافة</button>`);
  document.getElementById('mpCancel').onclick=closeModal;
  document.getElementById('mpSave').onclick=()=>{
    const compId=document.getElementById('mpComp').value||null;
    const manualName=document.getElementById('mpName').value.trim();
    if(!compId && !manualName){ toast('اختر مكونًا أو أدخل اسم الصنف'); return; }
    const need=Math.max(1,Number(document.getElementById('mpNeed').value||1));
    state.purchases.unshift({id:uid('pur'),componentId:compId,manualName:compId?'':manualName,need,priority:document.getElementById('mpPriority').value,status:'pending',supplier:document.getElementById('mpSupplier').value,price:Number(document.getElementById('mpPrice').value||0),date:nowISO(),manual:true});
    scheduleSave(); closeModal(); showView('purchases'); toast('تمت الإضافة إلى سلة المشتريات');
  };
}

function renderHistory(){
  const vc=document.getElementById('viewContainer');
  vc.innerHTML=viewHeader('سجل الاستخدام','كل ما حدث لكل مكون بالترتيب الزمني')+`
    <div class="toolbar"><input class="searchbox-inline" id="histFilter" placeholder="فلترة بالاسم..."></div>
    <div class="panel" id="histList"></div>
  `;
  function draw(f){

    const list=state.usageHistory.filter(h=>{ const c=findComponent(h.componentId); return !f || (c&&c.name.toLowerCase().includes(f)); });
    document.getElementById('histList').innerHTML= list.length? list.map(histRowHTML).join('') : '<div class="empty-state">لا يوجد سجل</div>';

function renderProjects(){
  const vc=document.getElementById('viewContainer');
  vc.innerHTML=viewHeader('المشاريع','المشاريع والمكونات المستخدمة فيها')+`
    <div class="toolbar"><button class="btn primary small" id="newProjBtn">+ مشروع جديد</button></div>
    <div class="grid-cards" id="projGrid"></div>
  `;
  document.getElementById('newProjBtn').onclick=()=>{
    const name=prompt('اسم المشروع الجديد؟'); if(!name) return;
    state.projects.unshift({id:uid('proj'),name,description:'',date:nowISO(),componentsUsed:[]});
    scheduleSave(); renderProjects();
  };
  const grid=document.getElementById('projGrid');
  grid.innerHTML= state.projects.length? state.projects.map(p=>`<div class="card" onclick="openProjectDetail('${p.id}')"><b>${p.name}</b><div class="sub">${fmtDate(p.date)} · ${p.componentsUsed.length} استخدام</div></div>`).join(''):'<div class="empty-state">لا توجد مشاريع بعد</div>';

function openProjectDetail(id){
  const p=state.projects.find(x=>x.id===id); if(!p) return;
  const totals={};
  p.componentsUsed.forEach(u=>{ totals[u.componentId]=(totals[u.componentId]||0)+u.qty; });
  openModal(p.name,`
    <div class="field-row full"><div class="field"><label>الوصف</label><textarea id="projDesc" rows="2">${p.description||''}</textarea></div></div>
    <h3 style="font-size:13px;">المكونات المستخدمة</h3>
    ${Object.keys(totals).length? Object.entries(totals).map(([cid,qty])=>{const c=findComponent(cid); return `<div class="chip">${c?c.name:'—'} × ${qty}</div>`;}).join(''):'<div class="empty-state">لا يوجد استخدام بعد</div>'}
  `,`<button class="btn primary" id="saveProjBtn">حفظ</button>`);
  document.getElementById('saveProjBtn').onclick=()=>{ p.description=document.getElementById('projDesc').value; scheduleSave(); closeModal(); toast('تم الحفظ'); };
}

function renderExperiments(){
  const vc=document.getElementById('viewContainer');
  vc.innerHTML=viewHeader('التجارب','كل التجارب المسجلة على المكونات')+`
    <div class="toolbar"><input class="searchbox-inline" id="expFilter" placeholder="فلترة بالاسم/المكون..."></div>

  `;

function renderChecklist(){
  const vc=document.getElementById('viewContainer');
  vc.innerHTML=viewHeader('تشيك ليست','ملاحظات وطلبات — علّم العنصر كمنجز عند الانتهاء منه')+`
    <div class="panel">
      <div class="field-row">
        <div class="field"><label>النوع</label><select id="clType"><option value="request">طلب</option><option value="note">ملاحظة</option></select></div>
        <div class="field"><label>النص</label><input id="clText" placeholder="اكتب طلبًا أو ملاحظة..."></div>
      </div>
      <button class="btn primary small" id="clAddBtn">+ إضافة</button>
    </div>
    <div class="panel"><h3>الطلبات <span class="pill gray">${state.checklist.filter(i=>i.type==='request'&&!i.done).length} معلّق</span></h3>
      <div id="clRequests"></div>
    </div>
    <div class="panel"><h3>الملاحظات <span class="pill gray">${state.checklist.filter(i=>i.type==='note'&&!i.done).length} معلّق</span></h3>
      <div id="clNotes"></div>
    </div>
  `;
  function row(item){
    return `<div class="check-row">
      <input type="checkbox" ${item.done?'checked':''} onchange="toggleChecklistItem('${item.id}')">
      <div style="flex:1;"><div class="ctext ${item.done?'done':''}">${item.text}</div><div class="cdate">${fmtDate(item.date)}</div></div>
      <button class="btn small danger" onclick="removeChecklistItem('${item.id}')">🗑</button>
    </div>`;
  }
  const requests=state.checklist.filter(i=>i.type==='request').sort((a,b)=>(a.done?1:0)-(b.done?1:0));
  const notes=state.checklist.filter(i=>i.type==='note').sort((a,b)=>(a.done?1:0)-(b.done?1:0));
  document.getElementById('clRequests').innerHTML= requests.length? requests.map(row).join(''):'<div class="empty-state">لا توجد طلبات بعد</div>';
  document.getElementById('clNotes').innerHTML= notes.length? notes.map(row).join(''):'<div class="empty-state">لا توجد ملاحظات بعد</div>';
  document.getElementById('clAddBtn').onclick=()=>{
    const text=document.getElementById('clText').value.trim(); if(!text){ toast('اكتب نصًا أولًا'); return; }
    state.checklist.unshift({id:uid('cl'),text,type:document.getElementById('clType').value,done:false,date:nowISO()});
    scheduleSave(); renderChecklist();
  };
}
function toggleChecklistItem(id){ const it=state.checklist.find(i=>i.id===id); if(it){ it.done=!it.done; scheduleSave(); renderChecklist(); } }
function removeChecklistItem(id){ state.checklist=state.checklist.filter(i=>i.id!==id); scheduleSave(); renderChecklist(); }

function renderStats(){
  const vc=document.getElementById('viewContainer');
  const counts={green:0,yellow:0,red:0,empty:0};
  state.containers.forEach(c=>counts[cellStatus(c)]++);
  const usageByComp={};
  state.usageHistory.filter(h=>h.type==='use').forEach(h=>{ usageByComp[h.componentId]=(usageByComp[h.componentId]||0)+Math.abs(h.qtyChange); });
  const topUsed=Object.entries(usageByComp).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([id,q])=>({name:(findComponent(id)||{}).name||'—',q}));
  const usageByCat={};
  state.usageHistory.filter(h=>h.type==='use').forEach(h=>{ const c=findComponent(h.componentId); if(c) usageByCat[c.category]=(usageByCat[c.category]||0)+Math.abs(h.qtyChange); });
  const topCat=Object.entries(usageByCat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxUse=Math.max(1,...topUsed.map(x=>x.q));

  // monthly consumption (last 6 months)
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({key:d.getFullYear()+'-'+d.getMonth(),label:d.toLocaleDateString('ar-EG',{month:'short'}),total:0}); }
  state.usageHistory.filter(h=>h.type==='use').forEach(h=>{
    const d=new Date(h.date); const key=d.getFullYear()+'-'+d.getMonth();
    const m=months.find(mm=>mm.key===key); if(m) m.total+=Math.abs(h.qtyChange);
  });
  const maxMonth=Math.max(1,...months.map(m=>m.total));

  const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;
  let acc=0; const stops=['green','yellow','red','empty'].map(k=>{ const start=acc/total*360; acc+=counts[k]; const end=acc/total*360; return `${statusColor(k)} ${start}deg ${end}deg`; }).join(',');

  vc.innerHTML=viewHeader('الإحصائيات','تحليل المخزون والاستهلاك')+`
    <div class="panel"><h3>حالة الخلايا</h3>
      <div class="donut-wrap">
        <div class="donut" style="background:conic-gradient(${stops});"></div>
        <div class="legend">
          <div><span class="sw" style="background:var(--green)"></span> طبيعي: ${counts.green}</div>
          <div><span class="sw" style="background:var(--yellow)"></span> تحذير: ${counts.yellow}</div>
          <div><span class="sw" style="background:var(--red)"></span> حرج: ${counts.red}</div>
          <div><span class="sw" style="background:var(--dim2)"></span> فارغ: ${counts.empty}</div>
        </div>
      </div>
    </div>
    <div class="panel"><h3>أكثر المكونات استخدامًا</h3>
      <div class="bar-chart">${topUsed.length? topUsed.map(x=>`<div class="bar-col"><div class="bar-val">${x.q}</div><div class="bar" style="height:${(x.q/maxUse*100)}%;"></div><div class="bar-lbl">${x.name}</div></div>`).join(''):'<div class="empty-state">لا توجد بيانات استخدام بعد</div>'}</div>
    </div>
    <div class="panel"><h3>الاستهلاك الشهري (آخر 6 أشهر)</h3>
      <div class="bar-chart">${months.map(m=>`<div class="bar-col"><div class="bar-val">${m.total}</div><div class="bar" style="height:${(m.total/maxMonth*100)}%;"></div><div class="bar-lbl">${m.label}</div></div>`).join('')}</div>
    </div>
    <div class="panel"><h3>أكثر الفئات استخدامًا</h3>
      ${topCat.length? topCat.map(([cat,q])=>`<div class="chip">${cat}: ${q}</div>`).join(''):'<div class="empty-state">لا توجد بيانات</div>'}
    </div>
  `;
}

function renderSettings(){
  const vc=document.getElementById('viewContainer');
  vc.innerHTML=viewHeader('الإعدادات','النسخ الاحتياطي والفئات وإدارة النظام')+`
    <div class="panel"><h3>تصدير / استيراد قاعدة البيانات</h3>
      <p style="color:var(--dim);font-size:12.5px;">يشمل التصدير جميع الرفوف والأدراج والمكونات والعبوات والسجلات والمشاريع والتجارب والمشتريات وتشيك ليست الملاحظات والطلبات.</p>
      <button class="btn primary small" id="exportBtn">⬇️ تصدير JSON</button>
      <label class="btn small" style="display:inline-block;">⬆️ استيراد JSON<input type="file" id="importFile" accept="application/json" class="hidden"></label>
    </div>
    <div class="panel"><h3>الفئات (Categories)</h3>
      <div id="catChips">${state.categories.map((c,i)=>`<span class="chip">${c} <span style="cursor:pointer;color:var(--red);" onclick="removeCategory(${i})">✕</span></span>`).join('')}</div>
      <div style="margin-top:10px;display:flex;gap:8px;"><input id="newCatInput" placeholder="فئة جديدة" style="max-width:220px;"><button class="btn small" id="addCatBtn">إضافة</button></div>
    </div>
    <div class="panel"><h3>منطقة الخطر</h3>
      <button class="btn danger small" id="resetBtn">🗑️ مسح جميع البيانات والبدء من جديد</button>
    </div>
  `;
  document.getElementById('exportBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='workshop_inventory_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  };
  document.getElementById('importFile').addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    if(!confirm('سيؤدي الاستيراد إلى استبدال جميع البيانات الحالية. متابعة؟')) return;
    const reader=new FileReader();
    reader.onload=()=>{ try{ state=JSON.parse(reader.result); scheduleSave(); showView('dashboard'); toast('تم الاستيراد بنجاح'); }catch(err){ toast('ملف غير صالح'); } };
    reader.readAsText(file);
  });
  document.getElementById('addCatBtn').onclick=()=>{
    const v=document.getElementById('newCatInput').value.trim(); if(!v) return;
    if(!state.categories.includes(v)) state.categories.push(v);
    scheduleSave(); renderSettings();
  };
  document.getElementById('resetBtn').onclick=()=>{
    if(!confirm('تحذير: سيتم حذف كل شيء نهائيًا. هل أنت متأكد؟')) return;
    state=seedState(); scheduleSave(); showView('dashboard'); toast('تمت إعادة التهيئة');
  };
}
function removeCategory(i){ state.categories.splice(i,1); scheduleSave(); renderSettings(); }

/* ============================= SEARCH ============================= */
/* البحث يشمل: اسم المكون، اسم العبوة، اسم الرف، اسم العمود، ورقم الخلية (عبر locationLabel) */
const searchInput=document.getElementById('searchInput');
const searchResultsEl=document.getElementById('searchResults');
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){ searchResultsEl.classList.add('hidden'); return; }
  const seenCell=new Set();
  let rows='';

  const compMatches=state.components.filter(c=>(c.name+' '+(c.partNumber||'')+' '+(c.category||'')).toLowerCase().includes(q)).slice(0,8);
  compMatches.forEach(c=>{
    const containers=containerOfComponent(c.id);
    const first=containers[0];
    const loc=first? locationLabel(first.id): 'مخزون مؤقت (غير مخصص)';
    if(first) seenCell.add(first.id);
    rows+=`<div class="sres-item" data-comp="${c.id}" data-cell="${first?first.id:''}">
      <div><div class="sres-name">${c.name}</div><div class="sres-meta">${c.category||''} · إجمالي: ${totalQtyOfComponent(c.id)}</div></div>
      <div class="sres-loc">${loc}</div>
    </div>`;
  });

  // مطابقة مباشرة على اسم الرف / العمود / العبوة / رقم الخلية
  const locMatches=state.containers.filter(c=>!seenCell.has(c.id) && locationLabel(c.id).toLowerCase().includes(q)).slice(0,8);
  locMatches.forEach(c=>{
    const comp=c.componentId?findComponent(c.componentId):null;
    rows+=`<div class="sres-item" data-cell="${c.id}">
      <div><div class="sres-name">${comp?comp.name:'خلية فارغة'}</div><div class="sres-meta">${comp?('إجمالي: '+totalQtyOfComponent(comp.id)):'موقع تخزين'}</div></div>
      <div class="sres-loc">${locationLabel(c.id)}</div>
    </div>`;
  });

  if(!rows){ searchResultsEl.innerHTML='<div class="sres-item"><span>لا توجد نتائج</span></div>'; searchResultsEl.classList.remove('hidden'); return; }
  searchResultsEl.innerHTML=rows;
  searchResultsEl.classList.remove('hidden');
});
searchResultsEl.addEventListener('click',e=>{
  const row=e.target.closest('.sres-item'); if(!row) return;
  const cellId=row.dataset.cell;
  searchResultsEl.classList.add('hidden'); searchInput.value='';
  if(cellId){ revealAndFlash(cellId); }
  else if(row.dataset.comp){ openComponentQuickView(row.dataset.comp); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('.search-wrap')) searchResultsEl.classList.add('hidden'); });

/* notifications panel */
document.getElementById('notifBell').addEventListener('click',e=>{
  e.stopPropagation();
  const panel=document.getElementById('notifPanel');
  const list=computeNotifications();
  panel.innerHTML= list.length? list.map((n,i)=>`<div class="notif-row" data-i="${i}">${n.icon} ${n.text}</div>`).join(''):'<div class="empty-state">لا توجد تنبيهات</div>';
  panel.classList.toggle('hidden');
  panel.querySelectorAll('.notif-row').forEach((row,i)=>{ row.onclick=()=>{ list[i].go(); panel.classList.add('hidden'); }; });
});
document.addEventListener('click',e=>{ if(!e.target.closest('#notifBell') && !e.target.closest('#notifPanel')) document.getElementById('notifPanel').classList.add('hidden'); });

/* ============================= INIT ============================= */
(async function init(){
  if(navigator.storage && navigator.storage.persist){ try{ await navigator.storage.persist(); }catch(e){} }
  await loadState();
  showView('dashboard');
  renderNotifBadge();
  setInterval(renderNotifBadge,4000);
})();
</script>
