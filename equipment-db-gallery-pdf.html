  }
  #tocToggle:hover{opacity:1; transform:scale(1.06); box-shadow:0 3px 10px rgba(var(--shadow-rgb),.2);}
  #tocToggle.open{opacity:1; background:var(--accent); color:var(--on-accent); border-color:var(--accent-dark);}

  #backdrop{
    position:fixed; inset:0; background:rgba(var(--overlay-rgb),.4); z-index:30;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #backdrop.show{opacity:1; pointer-events:auto;}

  aside#drawer{
    position:fixed; top:0; bottom:0; inset-inline-end:0; width:300px; max-width:85vw;
    background:var(--paper-card); z-index:35; box-shadow:-8px 0 24px rgba(var(--shadow-rgb),.22);
    border-inline-start:1.5px solid var(--rule);
    display:flex; flex-direction:column; overflow:hidden;
    transform:translateX(105%);
    visibility:hidden; pointer-events:none;
    transition:transform .28s ease, visibility 0s linear .28s;
  }
  aside#drawer.open{
    transform:translateX(0);
    visibility:visible; pointer-events:auto;
    transition:transform .28s ease, visibility 0s linear 0s;
  }
  .drawer-scroll{flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:14px;}

  .drawer-title{
    font-size:14px; font-weight:700; color:#fff; background:var(--tab);
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px; flex-shrink:0;
  }
  .drawer-title button{background:rgba(255,255,255,.15); color:#fff; border:none;}
  .drawer-title button:hover{background:rgba(255,255,255,.28); border-color:transparent;}

  .drawer-block{background:var(--surface); border:1.5px solid var(--rule); border-radius:10px; padding:12px;}
  .drawer-block h3{margin:0 0 10px; font-size:12px; color:var(--accent-dark); font-weight:700; letter-spacing:.2px;}
  .drawer-count{float:left;background:var(--tint);border:1px solid var(--rule);border-radius:20px;padding:2px 7px;font-size:10px;color:var(--ink-soft);}

  .side-search{display:flex; gap:6px;}
  .side-search input{flex:1;}
  .side-controls{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); align-items:center; margin-top:10px;}
  .side-controls label{display:flex; align-items:center; gap:5px; cursor:pointer;}

  #tocList{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:4px;}
  #tocList li{
    display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:8px;
    cursor:pointer; font-size:13px; color:var(--ink-soft); border:1px solid var(--rule);
    background:var(--paper);
  }
  #tocList li:hover{border-color:var(--accent);}
  #tocList li.active{background:var(--tint); color:var(--accent-dark); border-color:var(--accent); font-weight:700;}
  #tocList li.dragging{opacity:.4;}
  #tocList li.drag-over{border-color:var(--accent); border-style:dashed; border-width:2px;}
  #tocList li .draghandle{cursor:grab; color:var(--ink-soft); flex-shrink:0; font-size:12px; user-select:none;}
  #tocList li .posnum{
    width:30px; flex-shrink:0; text-align:center; font-size:11px; border:1px solid var(--rule);
    border-radius:5px; background:var(--surface); color:var(--ink-soft); padding:2px 0; cursor:text;
  }
  #tocList li .star{color:#d8cdb4; cursor:pointer; flex-shrink:0;}
  #tocList li .star.on{color:var(--marker); text-shadow:0 0 1px #b8860b;}
  #tocList li .ttl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #tocList li .count{font-size:10px; color:var(--ink-soft); background:var(--surface); padding:1px 6px; border-radius:20px;}
  #tocList li .toc-comment{color:#d8cdb4; cursor:pointer; flex-shrink:0; font-size:12px;}
  #tocList li .toc-comment.on{color:var(--accent-dark);}

  /* language rules manager */
  .langrow{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:6px 10px; font-size:12.5px; margin-bottom:6px;}
  .langrow .name{flex:1; font-weight:600;}
  .langrow .cnt{color:var(--ink-soft); font-size:11px;}
  .upload-lang{font-size:12px; color:var(--ink-soft); display:flex; flex-direction:column; gap:6px; margin-top:8px;}

  /* ============================== شريط أدوات تنسيق النصوص ============================== */
  .fmt-toolbar{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; padding:6px; background:var(--paper); border:1px solid var(--rule); border-radius:6px;}
  .fmt-btn{background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:3px 8px; font-size:12px; cursor:pointer; color:var(--ink); line-height:1.6;}
  .fmt-btn:hover{border-color:var(--accent); background:var(--paper-card);}
  .fmt-sep{width:1px; align-self:stretch; background:var(--rule); margin:0 2px;}
  .fmt-btn.custom-rule{background:#fff8e8; border-color:var(--marker);}

  /* ============================== صناديق شرح إضافية (حرة) ============================== */
  .extra-explanations-holder{display:flex; flex-direction:column; gap:12px; margin-top:10px;}
  .extra-explain-box{border:1px solid var(--rule); border-radius:8px; padding:10px; background:var(--paper);}
  .extra-explain-box .exbox-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .extra-explain-box.is-collapsed .exbox-body{display:none;}
  .extra-explain-box.is-collapsed .exbox-head{margin-bottom:0;}
  .extra-explain-box .exbox-title{flex:1; font-size:13px; font-weight:700; border:1px solid var(--rule); border-radius:5px; padding:5px 8px; background:var(--surface); color:var(--ink);}
  .add-explain-btn{margin-top:10px;}

  /* ============================== مدير قواعد التنسيق ============================== */
  .fmtrow{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:6px 10px; font-size:12.5px; margin-bottom:6px;}
  .fmtrow .name{flex:1; font-weight:600;}
  .fmtrow .cnt{color:var(--ink-soft); font-size:11px;}

  .empty-hint{color:var(--ink-soft); font-size:13.5px; line-height:1.9; padding:40px 10px; text-align:center; background:var(--paper-card); border:1.5px dashed var(--rule); border-radius:14px;}

  /* ---- add-text panel ---- */
  details.addbox{background:var(--paper-card); border:1.5px solid var(--rule); border-radius:12px; margin-bottom:20px;}
  details.addbox summary{padding:12px 16px; cursor:pointer; font-size:14.5px; color:var(--accent-dark); font-weight:700; list-style:none;}
  details.addbox summary::-webkit-details-marker{display:none;}
  .addbox-body{padding:0 16px 16px;}
  textarea.rawinput{
    width:100%; min-height:160px; background:var(--surface-soft); border:1.5px solid var(--rule);
    color:var(--ink); border-radius:8px; padding:10px; font-size:13px; direction:rtl; font-family:inherit;
  }
  .addbox-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .status-msg{font-size:12.5px; margin-top:8px; color:var(--ink-soft);}
  .status-msg.err{color:var(--danger);}
  .status-msg.ok{color:var(--accent-dark); font-weight:700;}

  /* ============ cards (index-card look) ============ */
  #cards{display:flex; flex-direction:column; gap:20px;}
  .card{
    background:var(--paper-card);
    border:1.5px solid var(--rule); border-radius:4px;
    padding:20px 22px; position:relative;
    box-shadow:3px 4px 0 var(--paper-shadow);
  }
  .card::before{ /* folder-tab accent */
    content:""; position:absolute; top:-2px; inset-inline-start:18px; width:46px; height:8px;
    background:var(--marker); border-radius:0 0 4px 4px;
  }
  .card-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px; padding-top:4px;}
  .card-head input.titlein{
    flex:1; font-size:19px; font-weight:700; background:transparent; border:none;
    color:var(--ink); border-bottom:1.5px dashed transparent; padding:2px 0; font-family:var(--font-display);
  }
  .card-head input.titlein:focus{outline:none; border-bottom-color:var(--accent);}
  .card-actions{display:flex; gap:6px; flex-shrink:0;}
  .starbtn{cursor:pointer; font-size:20px; color:#d8cdb4; user-select:none;}
  .starbtn.on{color:var(--marker); text-shadow:0 0 1px #b8860b;}
  .tag{font-size:10.5px; color:#fff; background:var(--tab); padding:2px 9px; border-radius:20px; font-weight:700;}

  .section-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px; margin:14px 0 6px; border-bottom:1px dotted var(--rule); padding-bottom:3px;}

  /* ============================== عرض الشرح المنسّق (ماركداون-لايت) ============================== */
  .explain-view{
    width:100%; min-height:60px; background:var(--surface-soft); border:1px solid var(--rule); color:var(--ink);
    border-radius:6px; padding:12px 14px; font-size:14.5px; line-height:1.85; direction:rtl; text-align:right;
    cursor:text; font-family:"Cairo",sans-serif;
  }
  .explain-view .md-empty{color:var(--ink-soft); font-style:italic;}
  .explain-view .md-p{margin:0 0 10px;}
  .explain-view .md-p:last-child{margin-bottom:0;}
  .explain-view .md-diagram{
    direction:ltr; text-align:left; margin:8px 0 12px; padding:12px 14px; background:#2b2820; color:#e9dfc4;
    border-radius:6px; border:1px solid #45402f; font-family:"Consolas","Fira Code",monospace;
    font-size:12.5px; line-height:1.5; overflow-x:auto; white-space:pre;
  }
  .explain-view .md-h{margin:16px 0 8px; color:var(--accent-dark); font-weight:800; line-height:1.4;}
  .explain-view h4.md-h{font-size:19px;}
  .explain-view h5.md-h{font-size:16px;}
  .explain-view h6.md-h{font-size:14px;}
  .explain-view .md-emoji-head{
    font-weight:800; font-size:15.5px; margin:16px 0 8px; color:var(--accent-dark);
    padding-bottom:4px; border-bottom:2px solid var(--rule);
  }
  /* عنوان فرعي مستنتج من نص بدون # صريح — زي سطر **بولد** كامل، أو سطر قصير منتهي بـ ":"
     (شكل شائع جدًا في ردود الـ AI). بيكون بارز عن الفقرة العادية لكن أصغر من عناوين الـ #. */
  .explain-view .md-subhead{
    font-weight:800; font-size:14.5px; margin:14px 0 6px; color:var(--accent-dark); line-height:1.5;
  }
  .explain-view .md-subhead:first-child{margin-top:0;}
  .explain-view .md-hr{border:none; border-top:1px dashed var(--rule); margin:14px 0;}
  .explain-view .md-quote{
    margin:8px 0; padding:6px 12px; border-right:3px solid var(--accent); background:var(--tint);
    color:var(--ink-soft); border-radius:4px;
  }
  .explain-view .md-list{margin:6px 0 10px; padding-right:22px; padding-left:4px;}
  .explain-view .md-list li{margin:4px 0;}
  .explain-view .md-list .md-list{margin:4px 0 4px; padding-right:20px;} /* قوائم متداخلة */
  .explain-view .md-quote .md-p{margin:0 0 6px;}
  .explain-view .md-quote .md-p:last-child{margin-bottom:0;}
  .explain-view a{color:var(--accent-dark); text-decoration:underline; text-decoration-color:var(--marker);}
  .explain-view a:hover{color:var(--danger);}
  .explain-view del{color:var(--ink-soft); opacity:.75;}
  .explain-view code{
    background:var(--tint); border:1px solid var(--rule); border-radius:4px; padding:1px 6px;
    font-family:"Fira Code","Consolas",monospace; font-size:13px; direction:ltr; display:inline-block;
  }
  .explain-view strong{color:var(--accent-dark);}
  .explain-view .md-table-wrap{overflow-x:auto; margin:8px 0 12px; border-radius:6px; border:1px solid var(--rule);}
  .explain-view table.md-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .explain-view table.md-table th, .explain-view table.md-table td{
    border:1px solid var(--rule); padding:7px 10px; text-align:center; vertical-align:middle;
  }
  .explain-view table.md-table th{background:var(--tint); color:var(--accent-dark); font-weight:800;}
  .explain-view table.md-table tr:nth-child(even) td{background:rgba(var(--zebra-rgb),.045);}

  /* ===== إضافات محرك الماركداون الكامل ===== */
  .explain-view h1.md-h{font-size:24px;}
  .explain-view h2.md-h{font-size:21px;}
  .explain-view h3.md-h{font-size:19px;}
  .explain-view .md-callout{border-radius:8px; padding:10px 14px; border-right-width:5px;}
  .explain-view .md-callout-tip{background:#eaf6ea; border-color:#4caf50;}
  .explain-view .md-callout-warn{background:#fff6e5; border-color:#e0a800;}
  .explain-view .md-callout-info{background:#e8f2fb; border-color:#2f7fd1;}
  .explain-view .md-callout-danger{background:#fdeaea; border-color:var(--danger, #d9534f);}
  .explain-view input[type="checkbox"]{margin-left:6px; transform:translateY(2px);}
  .explain-view .md-tasklist{list-style:none; padding-right:6px;}
  .explain-view .md-tasklist li{margin:4px 0;}

  .explain-view .md-codewrap{
    margin:8px 0 12px; border-radius:8px; overflow:hidden; border:1px solid #2a2a2a; background:#1e1e1e; direction:ltr;
  }
  .explain-view .md-codehead{
    display:flex; align-items:center; justify-content:space-between; background:#2d2d2d; color:#ccc;
    padding:6px 10px; font-size:12px; font-family:"Cairo",sans-serif;
  }
  .explain-view .md-codelang{opacity:.8; text-transform:uppercase; letter-spacing:.5px;}
  .explain-view .md-codebtns{display:flex; gap:6px;}
  .explain-view .md-codebtn{
    background:#3a3a3a; color:#ddd; border:1px solid #4a4a4a; border-radius:5px; padding:3px 9px;
    font-size:11px; cursor:pointer; font-family:"Cairo",sans-serif;
  }
  .explain-view .md-codebtn:hover{background:#4a4a4a;}
  .explain-view .md-codebody{display:flex;}
  .explain-view .md-codewrap.collapsed .md-codebody{display:none;}
  .explain-view .md-codenums{
    user-select:none; opacity:.35; color:#fff; text-align:left; padding:10px 8px 10px 10px;
    font-family:"Fira Code","Consolas",monospace; font-size:13px; line-height:1.6; white-space:pre; border-left:1px solid #333;
  }
  .explain-view .md-codepre{margin:0; padding:10px 12px; overflow-x:auto; flex:1;}
  .explain-view .md-codepre code.hljs{
    background:transparent !important; font-family:"Fira Code","Consolas",monospace; font-size:13px; line-height:1.6; padding:0;
  }
  .explain-view .mermaid-pending{color:var(--ink-soft); font-style:italic; padding:8px 0;}
  .explain-view .mermaid-rendered{margin:10px 0; text-align:center; overflow-x:auto;}
  .explain-view .md-footnotes{margin-top:14px; font-size:13px; color:var(--ink-soft);}
  .explain-view .md-fnlist{padding-right:20px;}
  .explain-view .md-fnref a{text-decoration:none; font-weight:700;}
  .explain-view .md-fnback{margin-right:4px; text-decoration:none;}
  .explain-view .katex-display{overflow-x:auto; overflow-y:hidden; padding:4px 0;}

  textarea.explain{
    width:100%; min-height:220px; background:
      repeating-linear-gradient(var(--surface-soft) 0 31px, var(--rule) 31px 32px);
    background-attachment:local;
    border:1px solid var(--rule);
    color:var(--ink); border-radius:6px; padding:10px 12px; font-size:14.5px; line-height:32px; direction:rtl;
    resize:vertical; font-family:"Cairo",sans-serif;
  }
  .label-row{display:flex; align-items:center; justify-content:space-between; margin:14px 0 6px;}
  .label-row .section-label{margin:0;}
  .expand-btn{padding:2px 9px; font-size:11px;}

  /* ============================== خريطة ذهنية (mind map panel) ============================== */
  .mindmap-panel{
    border:1px solid var(--rule); border-radius:8px; overflow:hidden; background:var(--surface);
    --mm-bg:#fbf9f2; --mm-node:#ffffff; --mm-node-border:#c9bd9a; --mm-text:#241f1a; --mm-line:#a99b74;
  }
  .mindmap-panel:focus{outline:none; box-shadow:inset 0 0 0 2px rgba(122,92,45,.25);}
  .mindmap-panel.mm-dark{ --mm-bg:#1c1a16; --mm-node:#2a2620; --mm-node-border:#4a4436; --mm-text:#efe9da; --mm-line:#8a7f60; }
  .mm-toolbar{
    display:flex; gap:5px; flex-wrap:wrap; align-items:center; padding:7px 9px;
    background:var(--paper); border-bottom:1px solid var(--rule);
  }
  .mm-toolbar button{font-size:11.5px; padding:4px 8px;}
  .mm-toolbar select, .mm-toolbar input[type="text"]{font-size:11.5px; padding:3px 6px; border:1px solid var(--rule); border-radius:5px;}
  .mm-toolbar input[type="text"].mm-search{width:110px;}
  .mm-toolbar .mm-sep{width:1px; align-self:stretch; background:var(--rule); margin:0 2px;}
  .mm-toolbar input[type="color"]{width:26px; height:24px; padding:1px; border:1px solid var(--rule); border-radius:4px; cursor:pointer;}
  .mm-stage-wrap{position:relative; height:380px; background:var(--mm-bg); overflow:hidden; touch-action:none;}
  .mm-stage-wrap svg{width:100%; height:100%; display:block; cursor:grab;}
  .mm-stage-wrap svg.panning{cursor:grabbing;}
  .mm-node-box{
    width:100%; height:100%; box-sizing:border-box; display:flex; align-items:center; justify-content:center;
    background:var(--mm-node); border:2px solid var(--mm-node-border); color:var(--mm-text);
    border-radius:10px; font-size:13px; padding:4px 8px; text-align:center; outline:none;
    cursor:default; overflow:hidden; word-break:break-word; user-select:text;
  }
  .mm-node-box.shape-ellipse{border-radius:999px;}
  .mm-node-box.shape-rect{border-radius:2px;}
  .mm-node-box.shape-none{border-color:transparent; background:transparent;}
  .mm-node-box.shape-circle{border-radius:50%; padding:8px;}
  .mm-node-box.shape-diamond{
    border-radius:0; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    padding:16px 26px;
  }
  .mm-node-box.shape-triangle{
    border-radius:0; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    padding:32px 20px 6px;
  }
  .mm-node-box.shape-hexagon{
    border-radius:0; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    padding:6px 20px;
  }
  .mm-node-box.shape-octagon{
    border-radius:0;
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    padding:6px 18px;
  }
  .mm-node-box.shape-parallelogram{
    border-radius:0; clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
    padding:6px 22px;
  }
  .mm-node-box.shape-arrow-right{
    border-radius:0;
    clip-path: polygon(0% 22%, 62% 22%, 62% 0%, 100% 50%, 62% 100%, 62% 78%, 0% 78%);
    padding:6px 34px 6px 8px;
  }
  .mm-node-box.shape-arrow-left{
    border-radius:0;
    clip-path: polygon(100% 22%, 38% 22%, 38% 0%, 0% 50%, 38% 100%, 38% 78%, 100% 78%);
    padding:6px 8px 6px 34px;
  }
  .mm-node-box.shape-star{
    border-radius:0;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    padding:28px 22px 20px;
  }
  .mm-node-box.shape-cloud{
    border-radius: 42% 58% 55% 45% / 55% 45% 55% 45%;
    padding:6px 14px;
  }
  .mm-node-box.mm-selected{box-shadow:0 0 0 3px rgba(122,92,45,.35);}
  .mm-node-box.mm-match{box-shadow:0 0 0 3px #e0a92b;}
  .mm-note-badge{
    width:18px; height:18px; border-radius:50%; background:var(--marker); color:#5c4a00;
    font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.25); user-select:none;
  }
  .mm-collapse-btn{
    position:absolute; width:16px; height:16px; border-radius:50%; background:var(--accent-dark); color:#fff;
    font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid var(--mm-bg);
  }
  .mm-float-toolbar{
    position:absolute; z-index:6; background:var(--paper-card); border:1px solid var(--rule); border-radius:8px;
    padding:5px 6px; display:flex; gap:4px; align-items:center; box-shadow:0 3px 10px rgba(0,0,0,.15); font-size:11px;
  }
  .mm-float-toolbar button{font-size:11px; padding:3px 6px;}
  .mm-status{font-size:10.5px; color:var(--ink-soft); padding:2px 10px;}
  .fs-overlay{
    position:fixed; inset:0; background:var(--paper-card); z-index:200;
    display:flex;
  }
  .fs-box{
    background:var(--paper-card); width:100%; height:100%;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .fs-head{display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1.5px solid var(--rule); flex-shrink:0;}
  .fs-head strong{font-size:15px;}
  .fs-body{flex:1; overflow:auto; padding:18px;}
  .fs-body textarea.explain{min-height:100%; height:100%;}
  .fs-overlay .fs-body{min-width:0;min-height:0;}
  .fs-overlay .fs-body > .mindmap-panel,
  .fs-overlay .fs-body > .drawpanel,
  .fs-overlay .fs-body > .tables-holder{width:100%;height:100%;max-width:none;}
  .fs-overlay .fs-body > .mindmap-panel{min-height:calc(100vh - 62px);height:100%!important;}
  .fs-overlay .fs-body > .drawpanel{min-height:calc(100vh - 62px);height:100%;}
  .fs-overlay .fs-body > .drawpanel .draw-canvas{height:100%;min-height:0;}
  .fs-overlay .fs-body > .tables-holder{overflow:auto;}
  /* ============================== معرض الصور التوضيحية ============================== */
  .img-gal-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
  .img-gal-card{overflow:hidden; padding:8px; border:1px solid var(--rule); border-radius:8px; background:var(--surface);}
  .img-gal-card img{display:block; width:100%; height:130px; object-fit:cover; border-radius:5px; cursor:zoom-in; background:var(--surface-soft);}
  .img-gal-caption{width:100%; min-height:56px; margin-top:7px; padding:6px; resize:vertical; background:var(--surface-soft); color:var(--ink); border:1px solid var(--rule); border-radius:5px; font-size:12px; font-family:"Cairo",sans-serif;}
  .img-gal-acts{display:flex; gap:5px; margin-top:6px;}
  .img-gal-acts button{flex:1; padding:4px !important; font-size:10.5px !important;}
  .img-gal-add{display:flex; align-items:center; justify-content:center; min-height:118px; padding:10px; border:1px dashed var(--accent); border-radius:8px; background:var(--tint); cursor:pointer; text-align:center; color:var(--ink-soft); font-size:12.5px;}
  .img-gal-add input{display:none;}
  /* ============================== تبويبات دفتر الملاحظات (شرح/كود/جداول/رسم/خريطة) ============================== */
  .nb-tabs{display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 12px; padding-bottom:10px; border-bottom:1.5px solid var(--rule);}
  .nb-tab{background:var(--surface); color:var(--ink-soft); border:1px solid var(--rule); border-radius:20px; padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:"Cairo",sans-serif;}
  .nb-tab.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .nb-pane{min-width:0;}
  .pane-topbar{display:flex; justify-content:flex-end; margin-bottom:8px;}
  .content-block{margin:0 0 12px;min-width:0;}
  .block-head{display:flex;align-items:center;gap:7px;min-height:26px;}
  .block-head .section-label{flex:1;margin:10px 0 6px;}
  .block-toggle{font-size:10px;padding:3px 7px;white-space:nowrap;}
  .content-block.is-collapsed > .block-body{display:none;}
  .content-block.is-collapsed .block-toggle{background:var(--tint);}
  .codeblock.is-collapsed > pre.codeview,
  .codeblock.is-collapsed > textarea.codearea{display:none!important;}
  .codeblock.is-collapsed .codeblock-head{border-bottom:0;}
  .table-panel.is-collapsed > .table-scroll,
  .table-panel.is-collapsed > .row-footer,
  .table-panel.is-collapsed > .table-panel-notes{display:none!important;}
  .plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .plan-card{background:var(--surface-soft);border:1px solid var(--rule);border-radius:12px;padding:11px}
  .plan-card h4{margin:0 0 8px;color:var(--accent-dark);font-size:13px}
  .plan-add{display:flex;gap:6px;margin-top:8px}
  .plan-add input{min-width:0;flex:1}
  .plan-list{display:flex;flex-direction:column;gap:6px}
  .plan-item{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.45}
  .plan-item input{margin-top:3px;accent-color:var(--accent)}
  .plan-item.done span{text-decoration:line-through;opacity:.55}
  .progress-meter{height:8px;background:var(--tint);border-radius:20px;overflow:hidden;margin-top:8px}
  .progress-meter i{display:block;height:100%;background:linear-gradient(90deg,var(--marker),var(--accent));border-radius:20px}
  @media (max-width:720px){.plan-grid{grid-template-columns:1fr}.plan-card{padding:10px}}

  .codeblock{border:1.5px solid var(--rule); border-radius:8px; margin-bottom:10px; overflow:hidden;}
  .codeblock-head{
    display:flex; align-items:center; gap:8px; background:var(--tint); padding:6px 10px;
    border-bottom:1.5px solid var(--rule); font-size:12px;
  }
  .codeblock-head input{background:transparent; border:none; color:var(--ink); font-size:12px; max-width:160px; font-family:inherit;}
  .codeblock-head select{background:var(--surface); color:var(--ink); border:1px solid var(--rule); border-radius:6px; padding:3px 6px; font-size:12px;}
  .codeblock-head .spacer{flex:1;}
  .codeblock-head button{padding:3px 9px; font-size:11px;}
  pre.codeview{margin:0; padding:12px 14px; overflow:auto; font-size:13px; line-height:1.6; background:#211f1a; color:#e7e2d4;}
  textarea.codearea{
    display:none; width:100%; min-height:120px; background:#211f1a; color:#e7e2d4;
    border:none; padding:12px 14px; font-size:13px; line-height:1.6; resize:vertical;
  }
  .codeblock.editing pre.codeview{display:none;}
  .codeblock.editing textarea.codearea{display:block;}

  .addcode-btn{margin-top:4px;}

  .drawpanel{border:1px solid var(--rule); border-radius:8px; overflow:hidden; background:var(--surface);}
  .draw-toolbar{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:8px; background:var(--paper);
    border-bottom:1px solid var(--rule);
  }
  .draw-toolbar select, .draw-toolbar input[type="number"]{
    font-size:12px; border:1px solid var(--rule); border-radius:5px; padding:4px 6px; background:var(--surface); color:var(--ink);
  }
  .draw-toolbar input[type="color"]{width:32px; height:28px; border:1px solid var(--rule); border-radius:5px; padding:1px; cursor:pointer;}
  .draw-toolbar input[type="range"]{width:70px;}
  .draw-toolbar button{font-size:12px;}
  .draw-canvas{display:block; width:100%; height:320px; background:var(--surface-soft); cursor:crosshair; touch-action:none;}

  footer{padding:16px 20px; font-size:11.5px; color:var(--ink-soft); text-align:center;}

  /* ---- نظام تنبيهات مخصص (بديل alert) — بعض المتصفحات/بيئات المعاينة بتحجب alert/confirm الأصلية ---- */
  #toastWrap{position:fixed; bottom:18px; inset-inline:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:300; pointer-events:none; padding:0 14px;}
  .toast{
    background:var(--ink); color:#fdf8ec; padding:10px 16px; border-radius:10px; font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,.25); max-width:520px; text-align:center; opacity:0; transform:translateY(8px);
    transition:opacity .25s, transform .25s;
  }
  .toast.err{background:var(--danger);}
  .toast.ok{background:var(--accent-dark);}
  .toast.show{opacity:1; transform:translateY(0);}

  /* ---- أدوات التحديد الجماعي ---- */
  .bulk-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .bulk-actions button{font-size:11.5px; padding:5px 10px;}
  .selcount{font-size:11px; color:var(--ink-soft); align-self:center;}

  @media (max-width: 720px){
    main{padding:16px;}
    aside#drawer{width:88vw;}
  }

  /* ============================== نظام الجداول (منقول من DBSV) ============================== */
  .tables-holder{display:flex; flex-direction:column; gap:14px;}
  .table-panel{background:var(--surface-soft); border:1.5px solid var(--rule); border-radius:10px; overflow:hidden;}
  .table-panel-head{background:var(--tab); color:#fff; font-weight:700; font-size:12.5px; padding:7px 10px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
  .table-panel-head input.tbl-title{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); color:#fff; font-weight:700; font-size:12.5px; padding:4px 8px; border-radius:4px; min-width:120px; font-family:inherit;}
  .table-panel-head input.tbl-title:focus{outline:none; background:rgba(255,255,255,.22);}
  .table-panel-head .head-actions{display:flex; gap:6px; align-items:center;}
  .table-panel-head .mini-btn{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); color:#fff; font-size:10.5px; border-radius:4px; padding:5px 9px; cursor:pointer;}
  .table-panel-head .mini-btn:hover{background:rgba(255,255,255,.3);}
  .table-panel-head .mini-btn.danger{background:rgba(166,58,58,.55); border-color:#e0bcbc;}
  .table-panel-head .mini-btn.danger:hover{background:var(--danger);}

  .table-scroll{overflow-x:auto;}
  table.sheet{width:100%; border-collapse:collapse; font-size:12.5px; min-width:480px;}
  table.sheet th{background:var(--paper-card); color:var(--ink-soft); font-size:10.5px; font-weight:700; padding:0; border:1px solid var(--rule); text-align:center;}
  .col-head-cell{display:flex; align-items:center; gap:3px; padding:5px 5px; justify-content:center;}
  .col-head-cell input.col-label{width:70px; min-width:50px; text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-soft); background:transparent; border:none; border-bottom:1px dashed var(--rule); font-family:inherit;}
  .col-head-cell input.col-label:focus{outline:none; background:#fff8e2;}
  .col-icon-btn{width:16px;height:16px; border-radius:3px; border:1px solid var(--rule); background:var(--surface); font-size:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:0 0 auto; padding:0;}
  .col-icon-btn:hover{border-color:var(--accent); color:var(--accent-dark);}
  .col-icon-btn.del:hover{border-color:var(--danger); color:var(--danger);}
  th.actions-th{width:1%; white-space:nowrap;}
  th.add-col-th{width:1%;}
  .add-col-btn{width:22px;height:22px; border-radius:4px; border:1.5px dashed var(--accent); background:var(--tint); color:var(--accent-dark); font-weight:900; cursor:pointer; font-size:13px; padding:0;}
  .add-col-btn:hover{background:var(--accent); color:var(--on-accent);}

  table.sheet td{border:1px solid var(--rule); padding:0; vertical-align:middle;}
  table.sheet tbody tr:nth-child(4n+1),
  table.sheet tbody tr:nth-child(4n+2){ background:rgba(var(--zebra-rgb),.045); }

  input.cell-text{font-size:12.5px; font-weight:600; color:var(--ink); background:transparent; border:none; width:100%; padding:7px 6px; font-family:inherit;}
  input.cell-text:focus{outline:none; background:#fff8e2;}
  select.cell-select{font-size:11.5px; font-weight:800; color:var(--accent-dark); background:transparent; border:none; width:100%; text-align:center; padding:7px 2px; cursor:pointer; font-family:inherit;}
  select.cell-select:focus{outline:none; background:#fff8e2;}

  .actions-cell{padding:3px !important; text-align:center; white-space:nowrap;}
  .chk, .note-toggle, .img-toggle, .file-toggle, .row-del{width:19px;height:19px; border-radius:4px; border:1.5px solid var(--rule); background:var(--surface); cursor:pointer; font-size:10px; vertical-align:middle; display:inline-flex; align-items:center; justify-content:center; margin-inline-end:3px; padding:0; color:var(--ink-soft);}
  .chk{color:var(--accent-dark); font-size:11px; font-weight:900;}
  .chk.on{background:var(--accent); border-color:var(--accent-dark); color:var(--on-accent);}
  .note-toggle.has-content{background:#fdf3d4; border-color:var(--marker);}
  .img-toggle{overflow:hidden; position:relative;}
  .img-toggle img{width:100%;height:100%;object-fit:cover;}
  .img-toggle .count-badge{position:absolute; bottom:-2px; left:-2px; background:var(--danger); color:#fff; font-size:7px; border-radius:50%; width:10px;height:10px; display:flex; align-items:center; justify-content:center; font-weight:900;}
  .file-toggle{position:relative;}
  .file-toggle.has-content{background:#e7f0ff; border-color:var(--accent);}
  .file-toggle .count-badge{position:absolute; bottom:-2px; left:-2px; background:var(--danger); color:#fff; font-size:7px; border-radius:50%; width:10px;height:10px; display:flex; align-items:center; justify-content:center; font-weight:900;}
  .row-del:hover{color:var(--danger); border-color:var(--danger);}

  tr.detail-row{display:none;}
  tr.detail-row.open{display:table-row;}
  tr.detail-row td{background:var(--surface-soft); padding:10px; border:1px solid var(--rule);}
  .detail-inner{display:flex; flex-direction:column; gap:9px;}
  .notes-grid{display:flex; gap:7px; flex-wrap:wrap;}
  .note-box{flex:1 1 150px; display:flex; flex-direction:column; gap:3px;}
  .note-box label{font-size:9.5px; color:var(--ink-soft);}
  .note-box textarea{font-size:12px; color:var(--ink); background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:6px 7px; resize:vertical; min-height:38px; font-family:inherit; direction:rtl;}
  .note-box textarea:focus{outline:none; border-color:var(--accent);}

  .comments-area{display:flex; flex-direction:column; gap:5px;}
  .comment-item{display:flex; gap:6px; align-items:flex-start; background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:5px 7px;}
  .comment-item .txt{flex:1; font-size:11.5px; color:var(--ink); line-height:1.45; white-space:pre-wrap;}
  .comment-del{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; padding:0 3px;}
  .comment-del:hover{color:var(--danger);}
  .add-comment-row{display:flex; gap:6px;}
  .add-comment-row input{flex:1; font-size:11.5px; color:var(--ink); background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:6px 8px; font-family:inherit;}
  .add-comment-row input:focus{outline:none; border-color:var(--accent);}
  .btn-accent{background:var(--tint); border:1px solid var(--accent); color:var(--accent-dark); font-weight:700; font-size:11px; border-radius:5px; padding:6px 11px; cursor:pointer; white-space:nowrap;}
  .btn-accent:hover{background:var(--accent); color:var(--on-accent);}

  .images-grid{display:flex; gap:7px; flex-wrap:wrap; align-items:center;}
  .images-grid .thumb-wrap{position:relative; width:56px; height:56px;}
  .images-grid .thumb-wrap img{width:100%; height:100%; object-fit:cover; border-radius:6px; border:1px solid var(--rule); cursor:zoom-in;}
  .images-grid .thumb-del{position:absolute; top:-6px; left:-6px; width:16px;height:16px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .tbl-file-label{background:var(--surface); border:1px dashed var(--rule); border-radius:6px; padding:16px 12px; cursor:pointer; font-size:10.5px; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:3px; width:56px; height:56px; justify-content:center; text-align:center;}
  .tbl-file-label:hover{border-color:var(--accent);}
  .tbl-file-label input{display:none;}
  .files-grid{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:8px;}
  .files-grid .file-chip{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; width:64px; height:64px; border-radius:6px; border:1px solid var(--rule); background:var(--paper-card); cursor:pointer; font-size:9.5px; text-align:center; padding:4px; overflow:hidden; color:var(--ink-soft);}
  .files-grid .file-chip:hover{border-color:var(--accent);}
  .files-grid .file-chip .fi-icon{font-size:20px; line-height:1; margin-bottom:2px;}
  .files-grid .file-chip .fi-name{font-size:8.5px; line-height:1.15; max-height:2.2em; overflow:hidden; word-break:break-word; width:100%;}
  .files-grid .file-del{position:absolute; top:-6px; left:-6px; width:16px;height:16px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}

  .row-footer{padding:8px 10px; display:flex; justify-content:flex-start;}
  .add-row-btn{background:var(--tint); border:1.5px solid var(--accent); color:var(--accent-dark); font-weight:700; font-size:11.5px; border-radius:6px; padding:7px 14px; cursor:pointer;}
  .add-row-btn:hover{background:var(--accent); color:var(--on-accent);}
  .add-table-row{display:flex; justify-content:flex-start; padding:2px 0;}

  /* modal عام لإدارة الجداول (إضافة جدول/عمود/أنواع) */
  .tbl-modal-overlay{position:fixed; inset:0; z-index:210; background:rgba(var(--overlay-rgb),.55); display:none; align-items:center; justify-content:center; padding:20px;}
  .tbl-modal-overlay.open{display:flex;}
  .tbl-modal-panel{background:var(--paper-card); border:1.5px solid var(--rule); border-radius:12px; padding:18px; width:100%; max-width:420px; max-height:85vh; overflow-y:auto;}
  .tbl-modal-panel h4{margin:0 0 12px; font-size:15px; font-weight:900; font-family:var(--font-display);}
  .tbl-modal-field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .tbl-modal-field label{font-size:11.5px; color:var(--ink-soft); font-weight:700;}
  .tbl-modal-field input[type=text]{font-size:13px; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); color:var(--ink); font-family:inherit;}
  .tbl-modal-field input[type=text]:focus{outline:none; border-color:var(--accent);}
  .tbl-modal-radio-group{display:flex; gap:10px;}
  .tbl-modal-radio-group label{display:flex; align-items:center; gap:5px; font-size:12.5px; cursor:pointer; color:var(--ink);}
  .tbl-modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
  .tbl-options-list{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
  .tbl-option-row{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:5px 8px;}
  .tbl-option-row span{flex:1; font-size:12px; color:var(--ink);}
  .tbl-option-row button{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px;}
  .tbl-option-row button:hover{color:var(--danger);}
  .tbl-add-option-row{display:flex; gap:6px;}
  .tbl-add-option-row input{flex:1;}

  /* lightbox لصور الجداول */
  .tbl-lightbox-overlay{position:fixed; inset:0; z-index:220; background:rgba(20,20,30,0.92); display:none; align-items:center; justify-content:center; padding:24px; overflow:hidden;}
  .tbl-lightbox-overlay.open{display:flex;}
  /* الصورة + الشرح أصبحا وحدة واحدة يتم توسيطها دائمًا في منتصف الشاشة */
  .tbl-lightbox-content{position:relative; width:min(1100px,94vw); height:min(90vh,900px); max-width:94vw; max-height:90vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-width:0; min-height:0;}
  .tbl-lightbox-stage{position:relative; flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none; cursor:grab;}
  .tbl-lightbox-stage.zoomed{cursor:grab;}
  .tbl-lightbox-caption{flex:0 0 auto; width:min(900px,100%); max-height:24vh; overflow:auto; margin:0; padding:9px 14px; border-radius:9px; background:rgba(0,0,0,.72); border:1px solid rgba(255,255,255,.18); color:#fff; text-align:right; direction:rtl; font:500 13px/1.7 "Cairo","Tahoma",sans-serif; box-sizing:border-box; z-index:4; backdrop-filter:blur(4px);}
  .tbl-lightbox-caption p{margin:0 0 7px;}
  .tbl-lightbox-caption p:last-child{margin-bottom:0;}
  .tbl-lightbox-caption h1,.tbl-lightbox-caption h2,.tbl-lightbox-caption h3,.tbl-lightbox-caption h4,.tbl-lightbox-caption h5,.tbl-lightbox-caption h6{margin:4px 0 6px; color:#fff;}
  .tbl-lightbox-caption ul,.tbl-lightbox-caption ol{margin:4px 0 7px; padding-right:22px;}
  .tbl-lightbox-stage.dragging{cursor:grabbing;}
  .tbl-lightbox-stage img{position:absolute; top:0; left:0; max-width:none; max-height:none; width:auto; height:auto; user-select:none; -webkit-user-drag:none; border-radius:6px; box-shadow:0 12px 40px rgba(0,0,0,.5); transform-origin:0 0; touch-action:none;}
  .tbl-lightbox-stage video{max-width:92vw; max-height:82vh;}
  .tbl-lightbox-stage audio{width:min(480px,86vw);}
  .tbl-lightbox-stage iframe{width:94vw; height:86vh; background:#fff; border:none; border-radius:8px;}
  .tbl-lb-fallback{color:#fff; text-align:center; padding:20px;}
  .tbl-lb-fallback .fi-big-icon{font-size:64px; display:block; margin-bottom:14px;}
  .tbl-lb-fallback .fi-big-name{font-size:14px; color:#ddd; margin-bottom:16px; word-break:break-word; max-width:80vw;}
  .tbl-lb-fallback a.dl-btn{display:inline-block; background:#fff; color:var(--ink); padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:800; font-size:13px;}
  .tbl-lightbox-toolbar{position:absolute; top:14px; right:70px; left:70px; display:flex; align-items:center; justify-content:center; gap:8px; z-index:2;}
  .tbl-lightbox-toolbar button, .tbl-lightbox-toolbar a{background:#fff; color:var(--ink); border:none; border-radius:8px; min-width:36px; height:36px; padding:0 8px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; text-decoration:none; font-weight:900;}
  .tbl-lightbox-toolbar .zoom-level{color:#fff; font-size:12.5px; min-width:44px; text-align:center; font-weight:700;}
  .tbl-lightbox-image-close{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--ink);border:2px solid rgba(0,0,0,.12);font-size:20px;font-weight:900;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.tbl-lightbox-image-close:hover{transform:scale(1.05)}
.tbl-lightbox-close{position:absolute; top:18px; left:20px; width:38px; height:38px; border-radius:50%; background:#fff; border:none; font-size:18px; cursor:pointer; color:var(--ink); font-weight:900; padding:0; z-index:3;}

  /* ============================================================
     شعار التطبيق (لمسة جرافيك بسيطة في الهيدر — شكل شريحة/IC)
     ============================================================ */
  .app-logo{flex-shrink:0; display:flex; align-items:center; justify-content:center; width:26px; height:26px; color:var(--accent-dark);}
  .app-logo svg{width:100%; height:100%; display:block;}

  /* ============================================================
     مبدّل الثيمات
     ============================================================ */
  .theme-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:2px;}
  @media (max-width:420px){ .theme-grid{grid-template-columns:1fr;} }
  .theme-swatch{
    position:relative; border:1.5px solid var(--rule); border-radius:10px; padding:12px 12px 10px;
    cursor:pointer; text-align:right; background:var(--surface); overflow:hidden;
    transition:transform .12s, box-shadow .15s;
  }
  .theme-swatch:hover{transform:translateY(-2px); box-shadow:0 6px 14px rgba(var(--shadow-rgb),.18);}
  .theme-swatch.active{border-color:var(--accent); border-width:2px;}
  .theme-swatch.active::after{
    content:"✓"; position:absolute; top:6px; left:6px; width:18px; height:18px; border-radius:50%;
    background:var(--accent); color:var(--on-accent); font-size:11px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
  }
  .theme-swatch .ts-preview{
    height:44px; border-radius:6px; margin-bottom:8px; position:relative; overflow:hidden;
    border:1px solid rgba(0,0,0,.08); background:var(--paper);
  }
  .theme-swatch .ts-preview .ts-card{position:absolute; inset:6px 6px 6px 22px; border-radius:4px; background:var(--paper-card); border:1px solid var(--rule);}
  .theme-swatch .ts-preview .ts-accent{position:absolute; top:6px; bottom:6px; right:6px; width:10px; border-radius:3px; background:var(--accent);}
  .theme-swatch .ts-name{font-size:12.5px; font-weight:800; color:var(--ink);}
  .theme-swatch .ts-desc{font-size:10.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}

  /* ============================================================
     لوحة التحكم (Dashboard)
     ============================================================ */
  .dash-wrap{display:flex; flex-direction:column; gap:22px; max-width:920px; margin:0 auto;}
  .dash-intro{font-size:12.5px; color:var(--ink-soft); margin-top:-8px;}
  .dash-section{display:flex; flex-direction:column; gap:10px;}
  .dash-h{
    display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; color:var(--accent-dark);
    letter-spacing:.2px;
  }
  .dash-h .dash-h-icon{font-size:15px;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px;}
  .stat-tile{
    background:var(--paper-card); border:1.5px solid var(--rule); border-radius:10px; padding:12px 12px;
    display:flex; flex-direction:column; gap:2px; position:relative; overflow:hidden;
  }
  .stat-tile .stat-icon{position:absolute; top:8px; left:10px; font-size:17px; opacity:.5;}
  .stat-tile .stat-num{font-size:24px; font-weight:900; color:var(--accent-dark); font-family:var(--font-display); line-height:1.1;}
  .stat-tile .stat-label{font-size:11px; color:var(--ink-soft); font-weight:700;}

  .lang-bars{display:flex; flex-direction:column; gap:8px;}
  .lang-bar-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .lang-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 2px rgba(var(--shadow-rgb),.06);}
  .lang-bar-name{width:84px; flex-shrink:0; color:var(--ink); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lang-bar-track{flex:1; background:var(--tint); border-radius:20px; height:9px; overflow:hidden;}
  .lang-bar-fill{height:100%; border-radius:20px;}
  .lang-bar-count{width:34px; flex-shrink:0; text-align:left; color:var(--ink-soft); font-size:11px;}

  .heatmap-wrap{overflow-x:auto; padding-bottom:4px; direction:ltr;}
  .heatmap-grid{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,11px); gap:3px; width:max-content; direction:ltr;}
  .heatmap-cell{width:11px; height:11px; border-radius:3px; background:var(--tint);}
  .heatmap-cell[data-today="1"]{box-shadow:0 0 0 1.5px var(--accent-dark);}
  .heatmap-legend{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-soft); margin-top:6px;}
  .heatmap-legend .heatmap-cell{width:10px;height:10px;}
  .dash-note{font-size:10.5px; color:var(--ink-soft); font-style:italic;}

  .index-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
  .index-card-btn{
    text-align:right; background:var(--paper-card); border:1.5px solid var(--rule); border-radius:10px;
    padding:11px 12px; cursor:pointer; display:flex; flex-direction:column; gap:4px; font-family:inherit;
  }
  .index-card-btn:hover{border-color:var(--accent);}
  .index-card-btn.is-active{border-color:var(--accent); background:var(--tint);}
  .index-card-btn .ic-title{font-size:13px; font-weight:800; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .index-card-btn .ic-meta{font-size:10.5px; color:var(--ink-soft); display:flex; gap:8px;}

  .dash-quick-actions{display:flex; flex-wrap:wrap; gap:8px;}

  .review-card{
    background:var(--tint); border:1.5px dashed var(--accent); border-radius:10px; padding:12px 14px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .review-card .rc-icon{font-size:22px; flex-shrink:0;}
  .review-card .rc-body{flex:1; min-width:160px;}
  .review-card .rc-title{font-size:12.5px; color:var(--ink-soft); margin-bottom:2px;}
  .review-card .rc-name{font-size:14px; font-weight:800; color:var(--ink);}

  .storage-bar-track{background:var(--tint); border-radius:20px; height:8px; overflow:hidden; margin-top:6px;}
  .storage-bar-fill{height:100%; background:var(--accent); border-radius:20px;}
  .storage-line{font-size:11px; color:var(--ink-soft); display:flex; justify-content:space-between;}

  .dash-empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px;}

  /* ============================================================
     أيقونة الحالة الفارغة
     ============================================================ */
  .empty-hint{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .empty-hint svg{width:52px; height:52px; color:var(--rule);}
  .empty-hint .empty-actions{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; justify-content:center;}

  /* ============================================================
     لوحة الأوامر السريعة (Ctrl/Cmd+K)
     ============================================================ */
  .cmdk-overlay{
    position:fixed; inset:0; z-index:250; background:rgba(var(--overlay-rgb),.55);
    display:flex; align-items:flex-start; justify-content:center; padding:11vh 16px 16px;
  }
  .cmdk-box{
    width:100%; max-width:520px; background:var(--paper-card); border:1.5px solid var(--rule);
    border-radius:12px; box-shadow:0 14px 40px rgba(var(--shadow-rgb),.35); overflow:hidden;
    max-height:70vh; display:flex; flex-direction:column;
  }
  .cmdk-input-row{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1.5px solid var(--rule); flex-shrink:0;}
  .cmdk-input-row .cmdk-icon{font-size:15px; color:var(--ink-soft); flex-shrink:0;}
  .cmdk-input{flex:1; border:none; background:transparent; font-size:14.5px; color:var(--ink); font-family:inherit; outline:none;}
  .cmdk-hint{font-size:10px; color:var(--ink-soft); border:1px solid var(--rule); border-radius:5px; padding:2px 6px; flex-shrink:0;}
  .cmdk-list{overflow-y:auto; padding:6px;}
  .cmdk-item{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .cmdk-item.sel{background:var(--tint);}
  .cmdk-item .cmdk-star{color:var(--marker); flex-shrink:0; width:14px; text-align:center;}
  .cmdk-item .cmdk-title{flex:1; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cmdk-item .cmdk-idx{font-size:10px; color:var(--ink-soft); background:var(--tint); padding:2px 7px; border-radius:20px; flex-shrink:0;}
  .cmdk-empty{padding:22px 14px; text-align:center; color:var(--ink-soft); font-size:12.5px;}

  /* ============ طبقة العرض المحسّنة — إضافات غير متداخلة مع المحتوى القديم ============ */
  :root{
    --ui-radius:16px;
    --ui-ease:cubic-bezier(.22,.8,.22,1);
  }
  body{
    background-image:var(--bg-decoration),linear-gradient(135deg,rgba(var(--accent-rgb),.025),transparent 45%),var(--paper);
  }
  header#mainHeader{
    min-height:64px; padding:10px clamp(14px,3vw,34px);
    border-bottom:1px solid color-mix(in srgb,var(--rule) 78%,transparent);
    box-shadow:0 8px 30px rgba(var(--shadow-rgb),.09);
    backdrop-filter:blur(14px); background:color-mix(in srgb,var(--paper-card) 88%,transparent);
  }
  header#mainHeader .app-logo{
    width:39px;height:39px;display:grid;place-items:center;border-radius:13px;
    color:var(--on-accent);background:linear-gradient(145deg,var(--accent),var(--accent-dark));
    box-shadow:0 7px 16px rgba(var(--accent-rgb),.25);flex:none;
  }
  header#mainHeader .app-logo svg{width:23px;height:23px}
  header#mainHeader h1{font-size:clamp(16px,2vw,20px);letter-spacing:-.25px}
  header#mainHeader h1 span{border-bottom:0;color:var(--accent)}
  header#mainHeader .toolbar{gap:8px}
  header#mainHeader .toolbar button{
    border-radius:11px;padding:8px 11px;background:color-mix(in srgb,var(--surface) 82%,transparent);
    box-shadow:0 2px 8px rgba(var(--shadow-rgb),.04)
  }
  header#mainHeader .toolbar button:hover{transform:translateY(-1px);box-shadow:0 6px 15px rgba(var(--shadow-rgb),.1)}
  .ux-strip{
    position:sticky;top:64px;z-index:18;display:flex;align-items:center;gap:10px;
    width:min(1120px,calc(100% - 32px));margin:12px auto 0;padding:9px 12px;
    border:1px solid color-mix(in srgb,var(--rule) 72%,transparent);border-radius:14px;
    background:color-mix(in srgb,var(--paper-card) 91%,transparent);box-shadow:0 6px 22px rgba(var(--shadow-rgb),.07);
    backdrop-filter:blur(14px);font-size:12px;color:var(--ink-soft)
  }
  .ux-strip .ux-context{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
  .ux-live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(var(--accent-rgb),.12)}
  .ux-context strong{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ux-actions{display:flex;gap:6px;align-items:center}
  .ux-actions button{padding:6px 9px;font-size:11px;border-radius:9px;white-space:nowrap}
  .ux-actions button.is-active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .ux-actions .ux-page-btn{font-weight:800}
  .ux-progress{position:absolute;inset-inline:0;bottom:-2px;height:2px;overflow:hidden;border-radius:2px}
  .ux-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--marker),var(--accent));transition:width .12s linear}
  main{width:min(1120px,calc(100% - 32px));max-width:none;padding:24px 0 48px}
  main:before{content:"";display:block;height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent);margin-bottom:18px;opacity:.6}
  #cards{display:grid;gap:18px}
  #cards > .card{
    border-radius:var(--ui-radius);border:1px solid color-mix(in srgb,var(--rule) 72%,transparent);
    box-shadow:0 8px 25px rgba(var(--shadow-rgb),.07);transition:transform .25s var(--ui-ease),box-shadow .25s var(--ui-ease),border-color .25s;
    overflow:clip
  }
  #cards > .card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(var(--shadow-rgb),.13);border-color:color-mix(in srgb,var(--accent) 55%,var(--rule))}
  .addbox{border-radius:var(--ui-radius);border:1px solid color-mix(in srgb,var(--accent) 36%,var(--rule));box-shadow:0 7px 23px rgba(var(--shadow-rgb),.06);overflow:hidden}
  .addbox summary{padding:14px 16px;font-weight:800}
  footer{border-top:1px solid color-mix(in srgb,var(--rule) 75%,transparent);padding:22px 16px 35px;line-height:1.9}
  .ux-focus-mode header#mainHeader{transform:translateY(-100%);opacity:0;pointer-events:none}
  .ux-focus-mode .ux-strip{top:12px}
  .ux-focus-mode footer,.ux-focus-mode .addbox{display:none}
  .ux-focus-mode main{padding-top:16px}
  .ux-compact-mode main{padding-top:12px}
  .ux-compact-mode #cards{gap:9px}
  .ux-compact-mode #cards > .card{border-radius:11px}
  .ux-compact-mode .card-body{padding-top:10px!important;padding-bottom:10px!important}
  .ux-hidden{display:none!important}
  #homeView{display:block;animation:uxPageIn .28s var(--ui-ease)}
  #homeView[hidden], #addView[hidden], #sectionView[hidden]{display:none!important}
  #addView{animation:uxPageIn .28s var(--ui-ease)}
  @keyframes uxPageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .dash-wrap{width:100%;max-width:none!important;gap:18px!important}
  .dash-section{background:color-mix(in srgb,var(--paper-card) 82%,transparent);border:1px solid color-mix(in srgb,var(--rule) 70%,transparent);border-radius:16px;padding:15px;box-shadow:0 8px 22px rgba(var(--shadow-rgb),.05)}
  .dash-h{border-bottom:1px solid color-mix(in srgb,var(--rule) 65%,transparent);padding-bottom:9px}
  .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .stat-tile{min-height:78px;border-radius:13px;padding:12px 11px;background:var(--surface-soft);border:1px solid color-mix(in srgb,var(--rule) 68%,transparent);box-shadow:none}
  .index-cards{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
  .float-drag-hint{position:fixed;inset-inline-end:15px;bottom:18px;z-index:39;padding:6px 10px;border-radius:20px;background:var(--paper-card);border:1px solid var(--rule);font-size:10px;color:var(--ink-soft);box-shadow:0 6px 20px rgba(var(--shadow-rgb),.15);opacity:0;pointer-events:none;transition:opacity .2s}
  .float-drag-hint.show{opacity:1}
  .tocToggle.dragging{cursor:grabbing!important;opacity:1;transform:scale(1.08)}
  #sectionView,#addView,#homeView,#cards,.card,.card-body,.card-content{min-width:0;max-width:100%}
  .card{box-sizing:border-box}
  .card-head{min-width:0}
  .card-head .titlein{min-width:0;max-width:100%}
  .explain-view,.codeblock,.table-panel,.mindmap-panel,.drawpanel{max-width:100%;box-sizing:border-box}
  .codeview,.codearea,.md-table-wrap,.table-scroll{max-width:100%;box-sizing:border-box}
  .codeview,.codearea{overflow-x:auto}
  .md-table-wrap,.table-scroll{overflow-x:auto}
  @media (max-width:720px){
    header#mainHeader{top:0;min-height:64px;max-height:64px;padding:9px 12px;flex-wrap:nowrap}
    header#mainHeader .toolbar{display:none}
    .ux-strip{top:64px;width:calc(100% - 20px);margin-top:8px;padding:8px}
    .ux-strip .ux-context{max-width:42%}
    .ux-strip .ux-context span:last-child{display:none}
    .ux-actions{overflow-x:auto}
    .ux-actions button{font-size:0;width:31px;height:30px;padding:0}
    .ux-actions .ux-page-btn{font-size:10px;width:auto;min-width:44px;height:30px;padding:5px 7px}
    .ux-actions button:before{font-size:14px}
    #uxFocusBtn:before{content:"⛶"}#uxCompactBtn:before{content:"☷"}#uxTopBtn:before{content:"↑"}
    html,body{overflow-x:hidden}
    main{width:calc(100% - 20px);max-width:calc(100% - 20px);padding-top:18px;overflow:visible}
    #sectionView{width:100%;overflow:visible}
    #cards{width:100%;max-width:100%;gap:12px;overflow:visible}
    #cards > .card{width:100%;max-width:100%;padding:13px 11px;border-radius:13px;overflow:hidden}
    .card-head{gap:6px;align-items:center}
    .card-head input.titlein{font-size:16px;line-height:1.35}
    .card-actions{gap:3px}
    .card-actions button{padding:4px 6px;font-size:11px}
    .explain-view{padding:10px;font-size:13px;line-height:1.75;overflow-wrap:anywhere}
    .codeblock-head{flex-wrap:wrap;gap:5px}
    .codeblock-head input{min-width:0;max-width:42vw}
    .codeblock-head .spacer{display:none}
    .codeblock-head button{padding:3px 6px}
    .codeview{font-size:11px;line-height:1.5;white-space:pre;overscroll-behavior-x:contain}
    .table-panel-head input.tbl-title{min-width:0;max-width:45vw}
    .mindmap-panel{height:min(58vh,420px)!important}
    .draw-canvas{max-width:100%;height:auto;min-height:220px}
    #tocToggle{top:122px;inset-inline-end:10px;width:42px;height:42px}
    .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .dash-section{padding:12px;border-radius:13px}
  }
</style>
</head>
<body>
<div id="toastWrap"></div>

<div class="tbl-lightbox-overlay" id="tblLightbox">
  <button type="button" class="tbl-lightbox-image-close" id="tblLightboxImageClose" title="إغلاق">✕</button>
  <button class="tbl-lightbox-close" id="tblLightboxClose">✕</button>
  <div class="tbl-lightbox-toolbar" id="tblLightboxToolbar" style="display:none;">
    <button type="button" id="tblLbZoomOut" title="تصغير">－</button>
    <span class="zoom-level" id="tblLbZoomLevel">100%</span>
    <button type="button" id="tblLbZoomIn" title="تكبير">＋</button>
    <button type="button" id="tblLbZoomReset" title="إعادة الضبط للحجم الأصلي">⤾</button>
  </div>
  <div class="tbl-lightbox-content" id="tblLightboxContent">
    <div class="tbl-lightbox-stage" id="tblLightboxStage">
      <img id="tblLightboxImg" src="" alt="صورة مكبّرة" style="display:none;">
      <video id="tblLightboxVideo" controls style="display:none;"></video>
      <audio id="tblLightboxAudio" controls style="display:none;"></audio>
      <iframe id="tblLightboxPdf" title="ملف PDF" style="display:none;"></iframe>
      <div id="tblLightboxFallback" class="tbl-lb-fallback" style="display:none;">
        <span class="fi-big-icon" id="tblLbFallbackIcon">📎</span>
        <div class="fi-big-name" id="tblLbFallbackName"></div>
        <a class="dl-btn" id="tblLbFallbackDownload" download>⬇️ تنزيل الملف</a>
      </div>
    </div>
    <div id="tblLightboxCaption" class="tbl-lightbox-caption" style="display:none;"></div>
  </div>
</div>

<div class="tbl-modal-overlay" id="tblModalOverlay">
  <div class="tbl-modal-panel" id="tblModalPanel"></div>
</div>

<div id="sectionsHost">
  <code-section storage-key="__STORAGE_KEY__" initial-title="__INITIAL_TITLE__" data-seed="__SEED_DATA__"></code-section>
</div>

<script>
  /* ==================================================================
     هذا الملف "سكشن" واحد مستقل بذاته — نفس محرك الشرح + الرسم التوضيحي
     + الجداول + الخريطة الذهنية الموجود في code_library.html، لكن بدون
     باقي التطبيق (فهارس، لوحة تحكم، استيراد/تصدير...). يصلح كقالب تدمجه
     في أي صفحة تانية، أو تستخدمه لوحده كسكشن شرح كامل.
     ================================================================== */

  let sections = [];
  let langRules = {};
  // قواعد تنسيق نصوص مخصّصة (مستوردة من ملف JSON) — كل قاعدة بتضيف زرار جديد في شريط
  // أدوات التنسيق، وبتتطبق تلقائيًا على أي صندوق شرح لما يترسم.
  let customFormatRules = [];
  /** بتدمج قواعد جديدة مع القديمة: لو الاسم موجود بالفعل بتستبدله، غير كده بتضيفه. */
  function mergeFormatRules(incoming){
    if(!Array.isArray(incoming)) return;
    incoming.forEach(rule=>{
      if(!rule || typeof rule !== "object" || !rule.name) return;
      const idx = customFormatRules.findIndex(r=>r.name===rule.name);
      if(idx>-1) customFormatRules[idx] = rule; else customFormatRules.push(rule);
    });
  }
  let selected = new Set();
  let idCounter = 1;
  const uid = () => "s" + (idCounter++) + "_" + Math.random().toString(36).slice(2,7);

  /* ============================== تخزين الصور بجودة كاملة (IndexedDB) ==============================
     مشكلة localStorage: محدود بحوالي 5-10 ميجا لكل موقع، وأي صورة متحولة base64 بتاخد حجم أكبر
     بحوالي 33% من حجمها الأصلي، فكان لازم نضغط الصور ونصغّرها عشان الحفظ ميفشلش.
     الحل: الصور بقت بتتخزن كملفات (Blobs) في IndexedDB (مساحته أكبر بكتير، عادة مئات الميجا لجيجا
     كاملة حسب مساحة الجهاز)، وجوه بيانات الصف (row.images) بيتخزن بس "مرجع" (ID) صغير للصورة
     بدل الصورة نفسها. النتيجة: localStorage فاضي وخفيف، والصور بتتحفظ زي ما هي بالظبط من غير
     أي ضغط أو تصغير في الجودة. */
  const IMG_DB_NAME = "code-library-images-db";
  const IMG_DB_VERSION = 2;
  const IMG_STORE = "images";
  // مساحة تخزين البيانات الرئيسية (النصوص/الفهارس/السكشنات) — بقت في IndexedDB بدل localStorage
  // لأن IndexedDB مساحته بتكبر تلقائيًا مع حجم بيانات الجهاز (غالبًا جيجات)، عكس localStorage
  // اللي عنده سقف ثابت صغير (5-10 ميجا تقريبًا) مبيكبرش مهما كان الجهاز فاضي.
  const APP_STORE = "app_data";
  let imgDbPromise = null;

  function openImageDB(){
    if(imgDbPromise) return imgDbPromise;
    imgDbPromise = new Promise((resolve, reject) => {
      if(!("indexedDB" in window)){ reject(new Error("IndexedDB غير مدعوم في هذا المتصفح")); return; }
      const req = indexedDB.open(IMG_DB_NAME, IMG_DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(IMG_STORE)) db.createObjectStore(IMG_STORE);
        if(!db.objectStoreNames.contains(APP_STORE)) db.createObjectStore(APP_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return imgDbPromise;
  }
  async function idbPutImage(id, blob){
    const db = await openImageDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IMG_STORE, "readwrite");
      tx.objectStore(IMG_STORE).put(blob, id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  /* بعض السياقات (زي فتح الملف مباشرة من تطبيق التنزيلات عبر content:// على أندرويد،
     أو المتصفح الخاص، أو تقسيم التخزين لإطار iframe معزول) بتمنع IndexedDB تمامًا
     ("Internal error opening backing store"). بدل ما نوقف حفظ الصورة، بنرجع تلقائيًا
     لتضمينها Base64 داخل بيانات السكشن نفسها — أبطأ شوية وأكبر حجمًا، لكنها بتشتغل
     دايمًا وبتتحفظ مع بيانات الجهاز عادي. */
  async function storeImageAndGetRef(blob){
    try{
      const id = genImageId();
      await idbPutImage(id, blob);
      return id;
    }catch(err){
      console.warn("IndexedDB غير متاح، جاري الحفظ كـ Base64 بدلاً منه:", err);
      return await blobToBase64(blob);
    }
  }
  async function idbGetImage(id){
    const db = await openImageDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IMG_STORE, "readonly");
      const req = tx.objectStore(IMG_STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbDeleteImage(id){
    try{
      const db = await openImageDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IMG_STORE, "readwrite");
        tx.objectStore(IMG_STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }catch(e){ /* تجاهل لو فشل الحذف */ }
  }
  function genImageId(){ return "idbimg_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,9); }

  /* ============ تخزين بيانات التطبيق الرئيسية (نصوص/فهارس/سكشنات) في IndexedDB ============ */
  async function idbPutAppData(key, value){
    const db = await openImageDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(APP_STORE, "readwrite");
      tx.objectStore(APP_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGetAppData(key){
    const db = await openImageDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(APP_STORE, "readonly");
      const req = tx.objectStore(APP_STORE).get(key);
      req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
      req.onerror = () => reject(req.error);
    });
  }

  /* ============================== تصنيف الملفات العامة (PDF/صوت/فيديو/غيرها) ============================== */
  function fileKindFromMime(mime, name){
    mime = mime || ""; name = (name || "").toLowerCase();
    if(mime.indexOf("image/") === 0) return "image";
    if(mime.indexOf("video/") === 0) return "video";
    if(mime.indexOf("audio/") === 0) return "audio";
    if(mime === "application/pdf" || name.endsWith(".pdf")) return "pdf";
    return "other";
  }
  function tblFileIconFor(mime, name){
    const kind = fileKindFromMime(mime, name);
    if(kind === "image") return "🖼️";
    if(kind === "video") return "🎬";
    if(kind === "audio") return "🎵";
    if(kind === "pdf") return "📄";
    const n = (name || "").toLowerCase();
    if(/\\.(zip|rar|7z|tar|gz)$/.test(n)) return "📦";
    if(/\\.(c|cpp|h|hpp|py|js|ts|java|json|html|css|asm|s|hex|ino|sh|php|rb|go|rs)$/.test(n)) return "💻";
    if(/\\.(exe|bin|dll|so|apk)$/.test(n)) return "⚙️";
    if(/\\.(doc|docx|xls|xlsx|ppt|pptx|txt|md)$/.test(n)) return "📃";
    return "📎";
  }
  function formatFileSize(bytes){
    if(bytes == null) return "";
    if(bytes < 1024) return bytes + " B";
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
    return (bytes/(1024*1024)).toFixed(1) + " MB";
  }

  function isIdbImageRef(ref){ return typeof ref === "string" && ref.indexOf("data:") !== 0 && ref.indexOf("idbimg_") === 0; }
  const imgUrlCache = new Map();
  async function getImageDisplayURL(ref){
    if(typeof ref !== "string") return "";
    if(ref.indexOf("data:") === 0) return ref; // صيغة قديمة (base64) — بترجع زي ما هي
    if(imgUrlCache.has(ref)) return imgUrlCache.get(ref);
    try{
      const blob = await idbGetImage(ref);
      if(!blob) return "";
      const url = URL.createObjectURL(blob);
      imgUrlCache.set(ref, url);
      return url;
    }catch(e){ return ""; }
  }
  function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }
  function base64ToBlob(dataUrl){
    const parts = dataUrl.split(",");
    const meta = parts[0]; const b64 = parts[1];
    const mimeMatch = meta.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type: mime});
  }
  /** يمشي على كل الصور جوه بنية الفهارس ويستبدل مراجع IndexedDB بصور base64 كاملة —
   *  مستخدمة وقت التصدير (الملف النهائي يبقى بيحتوي على الصور فعليًا، محمول بالكامل). */
  async function embedAllImagesAsBase64(indexesClone){
    for(const ix of (indexesClone||[])){
      for(const sec of (ix.sections||[])){
        for(const tbl of (sec.tables||[])){
          for(const row of (tbl.rows||[])){
            if(Array.isArray(row.images) && row.images.length){
              const resolved = [];
              for(const ref of row.images){
                if(typeof ref === "string" && ref.indexOf("data:") === 0){ resolved.push(ref); continue; }
                if(isIdbImageRef(ref)){
                  const blob = await idbGetImage(ref);
                  if(blob){ resolved.push(await blobToBase64(blob)); }
                }
              }
              row.images = resolved;
            }
            if(Array.isArray(row.files) && row.files.length){
              const resolvedFiles = [];
              for(const entry of row.files){
                if(entry && typeof entry === "object" && entry.id){
                  const blob = await idbGetImage(entry.id);
                  if(blob){
                    resolvedFiles.push({ name: entry.name, mime: entry.mime, size: entry.size, data: await blobToBase64(blob) });
                  }
                } else if(entry && entry.data){
                  resolvedFiles.push(entry); // بالفعل base64 (من ملف تصدير سابق)
                }
              }
              row.files = resolvedFiles;
            }
          }
        }
      }
    }
    return indexesClone;
  }
  /** عكس العملية: بيدور على أي صورة/ملف base64 جوه بنية مستوردة، يخزنه في IndexedDB،
   *  ويستبدله بمرجع خفيف — مستخدمة وقت الاستيراد. */
  async function migrateAllImagesToIndexedDB(indexesArr){
    for(const ix of (indexesArr||[])){
      for(const sec of (ix.sections||[])){
        for(const tbl of (sec.tables||[])){
          for(const row of (tbl.rows||[])){
            if(Array.isArray(row.images) && row.images.length){
              const migrated = [];
              for(const ref of row.images){
                if(typeof ref === "string" && ref.indexOf("data:") === 0){
                  try{
                    const id = genImageId();
                    await idbPutImage(id, base64ToBlob(ref));
                    migrated.push(id);
                  }catch(e){ /* لو فشل، سيب الصورة كـ base64 زي ما هي بدل ما تتفقد */ migrated.push(ref); }
                } else {
                  migrated.push(ref); // مرجع idbimg_ خفيف موجود بالفعل
                }
              }
              row.images = migrated;
            }
            if(Array.isArray(row.files) && row.files.length){
              const migratedFiles = [];
              for(const entry of row.files){
                if(entry && typeof entry === "object" && entry.id){
                  migratedFiles.push(entry); // مرجع موجود بالفعل
                } else if(entry && entry.data){
                  try{
                    const id = genImageId();
                    await idbPutImage(id, base64ToBlob(entry.data));
                    migratedFiles.push({ id, name: entry.name, mime: entry.mime, size: entry.size });
                  }catch(e){ /* تجاهل الملف ده لو فشل الترحيل */ }
                }
              }
              row.files = migratedFiles;
            }
          }
        }
      }
    }
    return indexesArr;
  }
  const toastWrap = document.getElementById("toastWrap");
  function showToast(msg, kind, ms){
    const t = document.createElement("div");
    t.className = "toast" + (kind ? " "+kind : "");
    t.textContent = msg;
    toastWrap.appendChild(t);
    requestAnimationFrame(()=> t.classList.add("show"));
    setTimeout(()=>{
      t.classList.remove("show");
      setTimeout(()=> t.remove(), 300);
    }, ms || 3200);
  }

  /* ============================== وضع ملء الشاشة العام ============================== */
  function openFullscreen(title, mountFn, onClose){
    const overlay = document.createElement("div");
    overlay.className = "fs-overlay";
    overlay.innerHTML = \`
      <div class="fs-box">
        <div class="fs-head">
          <strong>\${escapeHtml(title)}</strong>
          <button class="ghost" data-act="fs-close">✕ إغلاق (Esc)</button>
        </div>
        <div class="fs-body"></div>
      </div>
    \`;
    document.body.appendChild(overlay);
    const body = overlay.querySelector(".fs-body");
    function close(){
      if(onClose) onClose();
      document.removeEventListener("keydown", onKey);
      overlay.remove();
    }
    mountFn(body, close);
    function onKey(e){ if(e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
    overlay.querySelector('[data-act="fs-close"]').addEventListener("click", close);
  }
  // بعض المتصفحات/بيئات المعاينة بتحجب confirm()/alert() الأصليين فيسيبوا الزرار كأنه مش شغال.
  // البديل: ضغطة أولى "تسلّح" الزرار وتغيّر نصه، والضغطة التانية خلال 3 ثواني تنفّذ فعليًا.
  function armConfirm(btn, label){
    if(btn.dataset.armed === "1"){
      btn.dataset.armed = "0";
      btn.textContent = btn.dataset.original || btn.textContent;
      return true;
    }
    btn.dataset.original = btn.textContent;
    btn.dataset.armed = "1";
    btn.textContent = label || "اضغط تاني للتأكيد";
    clearTimeout(Number(btn.dataset.armTimer) || 0);
    const timer = setTimeout(()=>{
      btn.dataset.armed = "0";
      btn.textContent = btn.dataset.original;
    }, 3000);
    btn.dataset.armTimer = timer;
    return false;
  }
