// تحويل ثيم التطبيق الرئيسي (كهرماني/أزرق ليلي/فاتح نهاري) لأقرب ثيم من ثيمات
// الدفتر الداخلية (ليلي/دائرة/المخطط)، عشان الدفتر يبان جزء متناسق من الصفحة
// من أول لحظة تحميل بدل ما يفضل شكل "ورق كريمي" ثابت مهما كان ثيم التطبيق.
function mapAppThemeToNotebookTheme(appTheme){
  if(appTheme === "daylight") return "blueprint";
  if(appTheme === "night-blue") return "circuit";
  return "night";
}

function buildCodeSectionEmbed(item){
  const storageKey = "item-note-" + item.id;
  const title = (item.name || "ملاحظات فنية").replace(/</g,"").replace(/>/g,"");
  const notebookTheme = mapAppThemeToNotebookTheme(state.settings.theme || "amber");
  const seed = JSON.stringify(item.notebookData || null);
  const html = CODE_SECTION_TEMPLATE
    .split("__STORAGE_KEY__").join(esc(storageKey))
    .split("__INITIAL_TITLE__").join(esc(title))
    .split("__NOTEBOOK_THEME__").join(esc(notebookTheme))
    .split("__SEED_DATA__").join(esc(seed));

  const wrap = document.createElement("div");
  wrap.className = "cs-embed-wrap";

  const iframe = document.createElement("iframe");
  iframe.className = "cs-embed-frame";
  iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-modals allow-popups allow-forms");
  iframe.setAttribute("loading", "lazy");
  iframe.srcdoc = html;

  wrap.appendChild(iframe);

  // استقبال حفظ محتوى الدفتر من جوه الإطار وتخزينه مع بيانات الجهاز نفسه في
  // IndexedDB (بدل ما يفضل محفوظ بمعزل في تخزين الإطار)، عشان يبقى خاضع لنفس
  // نظام الحفظ التلقائي العام، ويتضمن تلقائيًا في التصدير/الاستيراد.
  let noteSaveInFlight = null;
  const onNoteMessage = (e)=>{
    if(e.source !== iframe.contentWindow) return;
    if(!e.data || e.data.type !== "cs-note-save") return;
    if(!iframe.isConnected){ window.removeEventListener("message", onNoteMessage); return; }
    item.notebookData = e.data.data;
    setSaveBadge("saving");
    // بحفظ فورًا من غير أي تأخير إضافي هنا (التأخير الوحيد المقصود هو الـ500ms
    // جوه الدفتر نفسه) — عشان نقلل احتمال ضياع آخر تعديل لو المستخدم عمل
    // Reload بسرعة بعد الكتابة مباشرة.
    noteSaveInFlight = idbPut("items", item)
      .catch(err=> console.error(err))
      .finally(()=> setSaveBadge("idle"));
  };
  window.addEventListener("message", onNoteMessage);

  // ضبط ارتفاع الإطار تلقائيًا حسب محتوى الدفتر الداخلي، بدل ارتفاع ثابت،
  // عشان يبان جزء طبيعي من الصفحة مش صندوق منفصل بيحتاج سكرول داخلي.
  iframe.addEventListener("load", ()=>{
    try{
      const doc = iframe.contentDocument;
      let lastH = 0;
      const resize = ()=>{
        const h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
        if(Math.abs(h - lastH) < 3) return; // فرق تافه — تجاهله عشان مايبقاش فيه حلقة تغذية راجعة
        lastH = h;
        iframe.style.height = (h + 4) + "px";
      };
      resize();
      new ResizeObserver(resize).observe(doc.body);
    }catch(e){ /* في حال منع الوصول لأي سبب، يبقى الارتفاع الافتراضي */ }
  });

  return wrap;
}
</script>

function debounce(fn, ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a), ms); }; }

/* =========================================================
   طبقة التخزين — IndexedDB (مع نسخة احتياطية في الذاكرة
   تعمل تلقائيًا لو IndexedDB غير متاحة، مثلاً عند فتح
   الملف عبر رابط content:// حيث لا يوجد أصل تخزين ثابت)
   stores: folders, items, files(blobs), meta
   ========================================================= */
let STORAGE_MODE = "idb"; // "idb" | "memory"
const memoryDB = {
  folders: new Map(),
  items: new Map(),
  files: new Map(),
  meta: new Map(),
};

function openDB(){
  return new Promise((resolve, reject)=>{
    let req;
    try{ req = indexedDB.open(DB_NAME, DB_VERSION); }
    catch(err){ reject(err); return; }
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains("folders")) d.createObjectStore("folders",{keyPath:"id"});
      if(!d.objectStoreNames.contains("items")){
        const st = d.createObjectStore("items",{keyPath:"id"});
        st.createIndex("folderId","folderId",{unique:false});
      }
      if(!d.objectStoreNames.contains("files")) d.createObjectStore("files",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"key"});
    };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = e=>reject(e.target.error || new Error("idb-open-failed"));
    req.onblocked = ()=>reject(new Error("idb-blocked"));
  });
}
function tx(storeNames, mode){ return db.transaction(storeNames, mode||"readonly"); }

function idbGetAll_real(storeName){
  return new Promise((resolve,reject)=>{
    const t=tx(storeName); const req=t.objectStore(storeName).getAll();
    req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error);
  });
}
function idbGet_real(storeName,key){
  return new Promise((resolve,reject)=>{
    const req=tx(storeName).objectStore(storeName).get(key);
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
function idbPut_real(storeName,value){
  return new Promise((resolve,reject)=>{
    const t=tx(storeName,"readwrite"); t.objectStore(storeName).put(value);
    t.oncomplete=()=>resolve(value); t.onerror=()=>reject(t.error);
  });
}
function idbDelete_real(storeName,key){
  return new Promise((resolve,reject)=>{
    const t=tx(storeName,"readwrite"); t.objectStore(storeName).delete(key);
    t.oncomplete=()=>resolve(); t.onerror=()=>reject(t.error);
  });
}
function idbClear_real(storeName){
  return new Promise((resolve,reject)=>{
    const t=tx(storeName,"readwrite"); t.objectStore(storeName).clear();
    t.oncomplete=()=>resolve(); t.onerror=()=>reject(t.error);
  });
}

function memKey(storeName,value){ return storeName==="meta" ? value.key : value.id; }
function memGetAll(storeName){ return Promise.resolve(Array.from(memoryDB[storeName].values())); }
function memGet(storeName,key){ return Promise.resolve(memoryDB[storeName].get(key)); }
function memPut(storeName,value){ memoryDB[storeName].set(memKey(storeName,value),value); return Promise.resolve(value); }
function memDelete(storeName,key){ memoryDB[storeName].delete(key); return Promise.resolve(); }
function memClear(storeName){ memoryDB[storeName].clear(); return Promise.resolve(); }

/* =========================================================
   التخزين الحقيقي + مزامنة المجلد المرتبط
   IndexedDB يبقى طبقة عمل سريعة، لكن عند ربط مجلد يصبح
   المجلد نسخة التشغيل الخارجية الفعلية: كل تعديل/إضافة/حذف
   يُكتب إليه، والملفات غير المرتبطة تُحذف منه تلقائيًا.
   ========================================================= */
function idbGetAll(storeName){ return STORAGE_MODE==="memory" ? memGetAll(storeName) : idbGetAll_real(storeName); }
function idbGet(storeName,key){ return STORAGE_MODE==="memory" ? memGet(storeName,key) : idbGet_real(storeName,key); }

async function ensureFolderPermission(handle, request=false){

  }catch(e){ console.warn("تعذر التحقق من صلاحية المجلد:",e); }

}

function referencedFileIds(){
  const ids=new Set();
  for(const it of (state.items||[])){
    (it.imageIds||[]).forEach(id=>id&&ids.add(id));

    (it.docs||[]).forEach(d=>d && d.fileId && ids.add(d.fileId));
    const nb=it.notebookData;
    (nb?.images||[]).forEach(x=>x?.id&&ids.add(x.id));
    const ft=nb?.faultTracking;
    (ft?.pages||[]).forEach(pg=>{
      if(pg?.imageId) ids.add(pg.imageId);
      (pg?.hotspots||[]).forEach(h=> (h?.content?.images||[]).forEach(x=>x?.id&&ids.add(x.id)));
    });
  }
  return ids;
}

  catch(e){ try{await w.abort();}catch(_e){} throw e; }
  const final=await handle.getFileHandle(name,{create:true});
  const fw=await final.createWritable();

/* =========================================================
   إحصائيات المحتوى — عدّاد شامل لكل نوع محتوى داخل كل العناصر
   (صور الشرح، مربعات الشرح، صور تتبع الأعطال، الملفات...الخ).

   التخزين المرتبط عند كل مزامنة، و(2) لوحة الإحصائيات في
   صفحة الإعدادات داخل البرنامج، حتى يتطابق العدّاد في المكانين.
   ========================================================= */
function computeContentStats(){
  const s={
    items:0, folders:0,
    itemImages:0, itemDocs:0,
    explanationBoxes:0, explanationImages:0, imageGroups:0,
    codeBlocks:0, drawingShapes:0, mindmaps:0,
    faultPages:0, faultHotspots:0, faultImages:0
  };
  s.items=(state.items||[]).length;
  s.folders=(state.folders||[]).length;
  for(const it of (state.items||[])){
    s.itemImages += (it.imageIds||[]).length;
    s.itemDocs += (it.docs||[]).length;
    const nb=it.notebookData;
    if(!nb) continue;
    if(typeof nb.explanation==='string' && nb.explanation.trim()) s.explanationBoxes += 1;
    s.explanationBoxes += (nb.explanations||[]).length;
    s.explanationImages += (nb.images||[]).length;
    s.imageGroups += (nb.imageGroups||[]).length;
    s.codeBlocks += (nb.codes||[]).length;
    s.drawingShapes += (nb.drawing && Array.isArray(nb.drawing.shapes)) ? nb.drawing.shapes.length : 0;
    if(nb.mindmap) s.mindmaps += 1;
    const ft=nb.faultTracking;
    if(ft && Array.isArray(ft.pages)){
      s.faultPages += ft.pages.length;
      ft.pages.forEach(pg=>{
        if(pg && pg.imageId) s.faultImages += 1;
        (pg?.hotspots||[]).forEach(h=>{
          s.faultHotspots += 1;
          s.faultImages += (h?.content?.images||[]).length;
        });
      });
    }
  }
  return s;
}
function fmtBytes(n){
  if(!n || n<=0) return "0 KB";
  if(n < 1024*1024) return (n/1024).toFixed(0)+" KB";
  if(n < 1024*1024*1024) return (n/1024/1024).toFixed(1)+" MB";
  return (n/1024/1024/1024).toFixed(2)+" GB";
}

async function sha256Blob(blob){
  try{
    if(!window.crypto?.subtle) return null;
    const buf=await blob.arrayBuffer();
    const hash=await crypto.subtle.digest('SHA-256',buf);
    return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }
}

async function writeDataFolder(handle,snapshot){

async function readFolderSnapshot(handle){
  try{
    const stateFile=await readJsonFile(handle,"state.json",null);
    if(stateFile && Array.isArray(stateFile.folders) && Array.isArray(stateFile.items)) return stateFile;

    // دعم النسخ القديمة التي كانت تستخدم project.json
    const old=await readJsonFile(handle,"project.json",null);
    if(old && Array.isArray(old.folders) && Array.isArray(old.items)) return old;

    const dataDir=await handle.getDirectoryHandle("data");
    const folders=await readJsonFile(dataDir,"folders.json",[]);
    const items=await readJsonFile(dataDir,"items.json",[]);
    const settings=await readJsonFile(dataDir,"settings.json",{});
    const cats=await readJsonFile(dataDir,"categories.json",{categories:[],categorySchemas:[]});
    if(Array.isArray(folders)&&Array.isArray(items)){
      return {schemaVersion:4,folders,items,settings,categories:cats.categories||[],categorySchemas:cats.categorySchemas||[]};
    }
  }catch(e){}
  return null;
}
async function readAssetManifest(handle){
  return await readJsonFile(handle,"asset-manifest.json",{schemaVersion:1,files:{}});
}
async function restoreAllFromFolder(handle,snap){
  const gotFolders=Array.isArray(snap?.folders)?snap.folders:[];
  const gotItems=Array.isArray(snap?.items)?snap.items:[];
  const gotSettings=snap?.settings && typeof snap.settings==="object" ? snap.settings : null;

  await idbClear_real("folders"); await idbClear_real("items"); await idbClear_real("files");
  for(const f of gotFolders) await idbPut_real("folders",f);
  for(const it of gotItems) await idbPut_real("items",it);
  if(gotSettings) await idbPut_real("meta",{key:"settings",value:gotSettings});
  if(Array.isArray(snap.categories)) state.categories=snap.categories;
  if(Array.isArray(snap.categorySchemas)) state.categorySchemas=snap.categorySchemas;

  const manifest=await readAssetManifest(handle);
  const present=new Set();
  try{
    const assets=await handle.getDirectoryHandle("assets");
    for await(const [fname,fhandle] of assets.entries()){
      if(fhandle.kind!=="file") continue;
      const fid=fileIdFromAssetName(fname,manifest);
      if(!fid) continue;
      const blob=await fhandle.getFile();
      const meta=manifest.files?.[fname]||{};
      await idbPut_real("files",{
        id:fid,blob,name:meta.name||fname,mime:meta.mime||blob.type||"",
        size:blob.size,updatedAt:meta.updatedAt||Date.now()
      });
      present.add(fid);
    }
  }catch(e){}

  state.folders=gotFolders; state.items=gotItems;
  if(gotSettings) state.settings=Object.assign(state.settings,gotSettings);
  for(const it of state.items){
    it.imageIds=(it.imageIds||[]).filter(id=>present.has(id));
    if(it.mainImageId && !present.has(it.mainImageId)) it.mainImageId=it.imageIds[0]||null;
    it.docs=(it.docs||[]).filter(d=>d?.fileId && present.has(d.fileId));
    if(it.notebookData?.images) it.notebookData.images=it.notebookData.images.filter(x=>present.has(x.id));
    const ft=it.notebookData?.faultTracking;
    if(ft?.pages) ft.pages.forEach(pg=>{
      if(pg.imageId && !present.has(pg.imageId)) pg.imageId=null;
      (pg.hotspots||[]).forEach(h=>{ if(h.content?.images) h.content.images=h.content.images.filter(x=>present.has(x.id)); });
    });
    await idbPut_real("items",it);
  }
}

async function pruneFolderRevisions(handle){

    const names=[];
    for await(const [name,fh] of revDir.entries()) if(fh.kind==="directory" && /^rev_/.test(name)) names.push(name);
    names.sort().reverse();
    for(const name of names.slice(30)) { try{ await revDir.removeEntry(name,{recursive:true}); }catch(e){} }
  }catch(e){}
}

async function syncFolderStorageNow(){
  if(!linkedDirHandle || STORAGE_MODE==="memory") return;
  const ok=await ensureFolderPermission(linkedDirHandle,false);
  if(!ok) throw new Error("folder-permission-required");
  folderSyncBusy=true; folderSyncError=null;
  try{
    const snapshot=await buildFolderStateSnapshot();
    await writeDataFolder(linkedDirHandle,snapshot);

    const assets=await linkedDirHandle.getDirectoryHandle("assets",{create:true});
    const records=await idbGetAll_real("files");
    const refs=referencedFileIds();
    const oldManifest=await readAssetManifest(linkedDirHandle);
    const manifest={schemaVersion:1,updatedAt:snapshot.savedAt,files:{}};
    const live=new Set();

    for(const rec of records){
      if(!rec?.id || !refs.has(rec.id) || !rec.blob) continue;
      let filename=safeFileName(rec.name||("asset_"+rec.id));
      // امنع تعارض أسماء الملفات مع أصول أخرى.
      const base=filename.replace(/(\.[^.]+)$/,"");
      const extMatch=filename.match(/(\.[^.]+)$/);
      const ext=extMatch?extMatch[1]:"";
      let candidate=filename, n=2;
      while(live.has(candidate)){ candidate=base+"_"+n+ext; n++; }
      filename=candidate;
      live.add(filename);

      const size=rec.size ?? rec.blob.size ?? 0;
      const updatedAt=rec.updatedAt||0;
      const old=oldManifest?.files?.[filename];
      let sha=old?.sha256||null;
      if(!(old && old.size===size && old.updatedAt===updatedAt)){
        const fh=await assets.getFileHandle(filename,{create:true});
        const w=await fh.createWritable();
        try{ await w.write(rec.blob); await w.close(); }
        catch(e){ try{await w.abort();}catch(_e){} throw e; }
        sha=await sha256Blob(rec.blob);
      }
      manifest.files[filename]={
        id:rec.id,name:rec.name||filename,mime:rec.mime||rec.blob.type||"",
        size,updatedAt,sha256:sha
      };
    }

    // تنظيف تلقائي: أي ملف داخل assets لم يعد مستخدمًا يحذف من المجلد الحقيقي.
    for await(const [fname,fh] of assets.entries()){
      if(fh.kind==="file" && !live.has(fname)){
        console.warn("أصل غير مستخدم أُبقي:",fname);
      }
    }

    await writeJsonAtomic(linkedDirHandle,"state.json",snapshot);
    await writeJsonAtomic(linkedDirHandle,"asset-manifest.json",manifest);
    await writeJsonAtomic(linkedDirHandle,"COMMIT",{
      schemaVersion:1,revision:snapshot.savedAt,committedAt:Date.now(),
      state:"complete",assetCount:Object.keys(manifest.files).length
    });
    // ملف نصي (txt) داخل نفس مجلد التخزين المرتبط، يحتوي على عدّاد كل نوع
    // محتوى (صور شرح، مربعات شرح، صور تتبع أعطال، ملفات...) — يتحدّث تلقائيًا
    // مع كل مزامنة، بنفس الأرقام المعروضة داخل البرنامج في صفحة الإعدادات.
    try{
      const contentStats=computeContentStats();
      const contentBytes=Object.values(manifest.files).reduce((a,f)=>a+(f.size||0),0);
      let dbBytes=null;
      try{ if(navigator.storage && navigator.storage.estimate){ dbBytes=(await navigator.storage.estimate()).usage||0; } }catch(e){}
      let programBytes=null;
      try{ programBytes=new Blob([document.documentElement.outerHTML]).size; }catch(e){}
      const statsText=buildContentStatsText(contentStats,{
        filesCount:Object.keys(manifest.files).length,
        contentBytes, dbBytes, programBytes
      });
      await writeTextAtomic(linkedDirHandle,"احصائيات-المحتوى.txt",statsText);
    }catch(e){ console.warn("تعذر كتابة ملف إحصائيات المحتوى:",e); }
    await saveFolderRevision(linkedDirHandle,snapshot,manifest);
    try{
      await idbPut_real("meta",{key:"lastFolderSyncAt",value:Date.now()});
      await idbPut_real("meta",{key:"lastFolderRevision",value:snapshot.savedAt});
    }catch(e){}
  }catch(e){ folderSyncError=e; throw e; }
  finally{ folderSyncBusy=false; }
}
function requestFolderSync(){

        try{ await syncFolderStorageNow(); }
        catch(e){ console.warn("فشل تحديث مجلد التخزين:",e); }

    },300);
  });
}

const ACTIVITY_LOG_MAX_G=20000;
const ACTIVITY_TYPES_ALL=['add','edit','delete','image','save','sync','import','export'];
const ACTIVITY_TYPE_META={

let activityLogPersistTimer=null;
function persistActivityLogDebounced(){
  clearTimeout(activityLogPersistTimer);
  activityLogPersistTimer=setTimeout(async ()=>{
    try{ const put=STORAGE_MODE==="memory"?memPut:idbPut_real; await put("meta",{key:"activityLog",value:state.activityLog}); }catch(e){}

function logActivity(type,payload){
  try{
    if(!Array.isArray(state.activityLog)) state.activityLog=[];
    const ts=new Date().toISOString();
    state.activityLog.unshift(Object.assign({id:uid('act'),ts,day:ts.slice(0,10),type},payload));
    if(state.activityLog.length>ACTIVITY_LOG_MAX_G) state.activityLog.length=ACTIVITY_LOG_MAX_G;
    if(!state.syncLogState || typeof state.syncLogState!=='object') state.syncLogState={lastSyncedId:null,lastSyncAt:null,filesWritten:0};
    state.syncLogState.totalLogged=(state.syncLogState.totalLogged||0)+1;
    persistActivityLogDebounced();
    scheduleActivityLogSyncSoon();
  }catch(e){}

function applyLogRetentionG(){
  try{
    const days=Number(state.syncLogSettings && state.syncLogSettings.retentionDays)||0;
    if(!days || !Array.isArray(state.activityLog) || !state.activityLog.length) return;
    const cutoff=new Date(Date.now()-days*86400000).toISOString().slice(0,10);
    const before=state.activityLog.length;
    state.activityLog=state.activityLog.filter(e=>e.day>=cutoff);
    if(state.activityLog.length!==before) persistActivityLogDebounced();
  }catch(e){}
}
function activityLogPendingCountG(){
  const all=state.activityLog||[]; const lastId=state.syncLogState && state.syncLogState.lastSyncedId;
  let cut=all.length;
  if(lastId){ const idx=all.findIndex(e=>e.id===lastId); if(idx!==-1) cut=idx; }
  return cut;
}
function activityLogSavedPercentG(){
  const totalLogged=(state.syncLogState && state.syncLogState.totalLogged)||0;
  if(!totalLogged) return 100;
  const pending=activityLogPendingCountG();
  return Math.max(0,Math.min(100,Math.round(((totalLogged-pending)/totalLogged)*100)));
}
function auditSafeStringG(v){
  if(v===undefined) return 'غير موجود';
  if(v===null) return 'فارغ';
  if(typeof v==='object'){ try{ const j=JSON.stringify(v); return j.length>260?j.slice(0,257)+'…':j; }catch(e){ return String(v); } }
  const t=String(v); return t.length>260?t.slice(0,257)+'…':t;
}
function classifyChangeTypeG(oldValue,newValue,field){
  const f=String(field||'').toLowerCase();
  const oldEmpty=(oldValue===undefined||oldValue===null||oldValue==='غير موجود'||oldValue==='فارغ'||oldValue==='');
  const newEmpty=(newValue===undefined||newValue===null||newValue==='غير موجود'||newValue==='فارغ'||newValue==='');
  if(/image|صور|صورة/.test(f)) return 'image';
  if(oldEmpty && !newEmpty) return 'add';

function galleryFieldLabel(path){
  const parts=String(path||'').split('.'); const key=(parts[parts.length-1]||'').replace(/\[\d+\]$/,'');
  const map={name:'الاسم',model:'الموديل',manufacturer:'الشركة المصنعة',serial:'الرقم التسلسلي',partNumber:'رقم القطعة',type:'النوع',status:'الحالة',notes:'الملاحظات',icon:'الأيقونة',color:'اللون',description:'الوصف',mainImageId:'الصورة الرئيسية',category:'الفئة'};
  if(map[key]) return map[key];
  if(path && path.includes('fields')) return 'حقل بيانات: '+key;

  if(path && path.includes('imageIds')) return 'صورة مرتبطة';
  if(path && path.includes('docs')) return 'مستند مرفق';
  return key||'تعديل';
}
function logStoreActivity(storeName,oldValue,newValue){
  if(storeName==='meta' || !newValue) return;
  if(storeName==='files'){
    const mime=newValue.mime||(newValue.blob&&newValue.blob.type)||'';
    const isImg=/^image\//.test(mime);
    logActivity(isImg?'image':'add',{entity:'file',entityId:newValue.id,entityLabel:newValue.name||newValue.id,field:isImg?'صورة':'ملف مرفق',summary:(oldValue?'تحديث':'إضافة')+' ملف: '+(newValue.name||newValue.id)});
    return;
  }
  if(storeName==='items' || storeName==='folders'){
    const kindLabel = storeName==='items' ? 'عنصر' : 'مجلد';
    const label = newValue.name || (oldValue&&oldValue.name) || newValue.id || '—';
    if(!oldValue){
      logActivity('add',{entity:storeName,entityId:newValue.id,entityLabel:label,field:kindLabel,summary:'إضافة '+kindLabel+' جديد: '+label});
      return;
    }
    // مقارنة سطحية-متعمقة محدودة (نستثني notebookData الثقيلة — لها التقاطها الخاص عبر هذا نفس المسار عند حفظها)
    const oc=galleryClone(oldValue), nc=galleryClone(newValue);
    delete oc.notebookData; delete nc.notebookData;

function galleryDiff(a,b,path,out,limit,depth){
  if(out.length>=limit || a===b) return;
  if(depth>6){ out.push({path,oldValue:a,newValue:b}); return; }
  const ao=a&&typeof a==='object', bo=b&&typeof b==='object';
  if(!ao||!bo){ out.push({path,oldValue:a,newValue:b}); return; }
  if(Array.isArray(a)||Array.isArray(b)){
    const aa=Array.isArray(a)?a:[], bb=Array.isArray(b)?b:[];
    const n=Math.max(aa.length,bb.length);
    for(let i=0;i<n && out.length<limit;i++) galleryDiff(aa[i],bb[i],path+'['+i+']',out,limit,depth+1);
    return;
  }
  const keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
  for(const k of keys){ if(out.length>=limit) break; galleryDiff(a?a[k]:undefined, b?b[k]:undefined, path?path+'.'+k:k, out, limit, depth+1); }
}
function indexByIdG(arr){ const m=new Map(); (arr||[]).forEach(x=>{ if(x && x.id!=null) m.set(String(x.id),x); }); return m; }

async function runActivityLogSync(manual){
  if(!linkedDirHandle){ if(manual) toast('اربط مجلد النسخ الاحتياطي أولًا من الإعدادات.','warn'); return false; }
  if(activityLogSyncBusy) return false;

  try{
    applyLogRetentionG();

    const all=state.activityLog||[];

    let cutIndex=all.length;

      if(manual) toast('لا يوجد جديد للمزامنة.','ok');
      state.syncLogState={...(state.syncLogState||{}),lastError:null};
      try{updateGlobalSyncBadge();}catch(e){}

    const batchSize=Math.max(10,Number(settings.batchSize)||300);
    const batch=pending.slice(0,batchSize);
    const root=await linkedDirHandle.getDirectoryHandle('activity-log',{create:true});
    const groups=new Map();
    batch.forEach(e=>{ const key=activityLogPartitionKey(e); if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(e); });
    const stats=(state.syncLogState && state.syncLogState.partitionStats && typeof state.syncLogState.partitionStats==='object')?state.syncLogState.partitionStats:{};
    let filesWritten=0;
    for(const [key,entries] of groups){
      const parts=key.split('/');
      let dir=root;
      for(let i=0;i<parts.length-1;i++) dir=await dir.getDirectoryHandle(parts[i],{create:true});
      const fileName=parts[parts.length-1]+'.jsonl';
      let existing='';
      try{ const fh=await dir.getFileHandle(fileName); existing=await (await fh.getFile()).text(); }catch(e){}
      const lines=entries.map(e=>JSON.stringify(e)).join('\n');
      const merged=existing? (existing.replace(/\n?$/,'\n')+lines+'\n') : (lines+'\n');
      await writeTextAtomic(dir,fileName,merged);
      const prev=stats[key]||{count:0};
      stats[key]={count:(prev.count||0)+entries.length,path:'activity-log/'+key+'.jsonl',lastUpdated:new Date().toISOString()};
      filesWritten++;
    }
    const totalSynced=((state.syncLogState && state.syncLogState.totalSynced)||0)+batch.length;
    const idx={updatedAt:new Date().toISOString(),totalEntriesInApp:all.length,totalSynced,partitionBy:settings.partitionBy||'day+type',partitions:stats};
    await writeJsonAtomic(root,'index.json',idx);
    state.syncLogState={lastSyncedId:batch[batch.length-1].id,lastSyncAt:new Date().toISOString(),filesWritten:((state.syncLogState&&state.syncLogState.filesWritten)||0)+filesWritten,partitionStats:stats,totalSynced,lastError:null,lastDurationMs:Date.now()-__t0,totalLogged:(state.syncLogState&&state.syncLogState.totalLogged)||0};
    await persistSyncLogMetaNow();
    try{updateGlobalSyncBadge();}catch(e){}
    if(manual) toast('تمت مزامنة '+batch.length+' سجل إلى المجلد (activity-log/).','ok');
    if(pending.length>batch.length) setTimeout(()=>runActivityLogSync(false),300);
    return true;
  }catch(e){
    console.warn('فشل مزامنة سجل النشاط:',e);
    if(manual || (state.syncLogSettings && state.syncLogSettings.notifyOnFailure)) toast('فشلت مزامنة السجل: '+(e.message||e),'err');
    state.syncLogState={...(state.syncLogState||{}),lastError:String((e&&e.message)||e)};
    try{ await persistSyncLogMetaNow(); }catch(e2){}
    try{updateGlobalSyncBadge();}catch(e2){}
    return false;
  }finally{ activityLogSyncBusy=false; }
}

   المزامنة الذكية + كشف العناصر المتشابهة
   ========================================================= */
function normDup(v){
  return String(v??"").toLowerCase().trim().replace(/[\u064B-\u065F\u0670]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[ـ\s\-_./\\()[\]{}]+/g," ").replace(/\s+/g," ");
}
function itemFingerprint(it){
  const tags=(it.tags||[]).map(normDup).filter(Boolean).sort().join("|");
  return [normDup(it.name),normDup(it.model),normDup(it.manufacturer),normDup(it.category),normDup(it.tag||it.code||""),tags].join("¦");
}
function itemLooseFingerprint(it){
  const a=normDup(it.name), b=normDup(it.model), c=normDup(it.manufacturer);
  return [a,b,c].filter(Boolean).join("¦");
}
function itemContentSignature(it){
  try{
    const clone=JSON.parse(JSON.stringify(it||{}));
    delete clone.updatedAt; delete clone.createdAt;
    return JSON.stringify(clone);
  }catch(e){ return String(it?.id||""); }
}
function findDuplicatePairs(localItems, folderItems){
  const pairs=[]; const seen=new Set();
  const byExact=new Map(), byLoose=new Map();
  for(const it of localItems||[]){
    const e=itemFingerprint(it), l=itemLooseFingerprint(it);
    if(e) (byExact.get(e)||byExact.set(e,[]).get(e)).push(it);
    if(l) (byLoose.get(l)||byLoose.set(l,[]).get(l)).push(it);
  }
  for(const f of folderItems||[]){
    let candidates=[];
    const e=itemFingerprint(f), l=itemLooseFingerprint(f);
    if(e && byExact.has(e)) candidates=byExact.get(e);
    else if(l && byLoose.has(l)) candidates=byLoose.get(l);
    else if(f.id){ const same=localItems.find(x=>x.id===f.id); if(same) candidates=[same]; }
    for(const local of candidates){
      const key=(local.id||"")+"::"+(f.id||""); if(seen.has(key)) continue; seen.add(key);
      const exact = itemFingerprint(local)===itemFingerprint(f);
      const sameId = local.id===f.id;
      const sameContent = itemContentSignature(local)===itemContentSignature(f);
      pairs.push({local,folder:f,kind:(sameId&&sameContent)?"identical":(exact?"similar":"possible"),sameId,sameContent});
    }
  }
  return pairs;
}
function cloneItemForMerge(it){ return JSON.parse(JSON.stringify(it)); }
function mergeItemLists(localItems, folderItems, decisions){
  const localById=new Map((localItems||[]).map(x=>[x.id,x]));
  const folderById=new Map((folderItems||[]).map(x=>[x.id,x]));
  const dropLocal=new Set(), dropFolder=new Set();
  for(const d of decisions||[]){
    if(d.choice==='local') dropFolder.add(d.folder.id);
    else if(d.choice==='folder') dropLocal.add(d.local.id);
    else if(d.choice==='both') { /* keep both; IDs are already unique in normal case */ }
    else if(d.choice==='delete-local') dropLocal.add(d.local.id);
    else if(d.choice==='delete-folder') dropFolder.add(d.folder.id);
  }
  const out=[]; const used=new Set();
  for(const it of localItems||[]) if(!dropLocal.has(it.id)){ out.push(cloneItemForMerge(it)); used.add(it.id); }
  for(const it of folderItems||[]) if(!dropFolder.has(it.id)){
    let x=cloneItemForMerge(it);
    if(used.has(x.id)){
      x.id=uid("item");
      // Preserve references inside the item; file IDs are global and remain valid.
    }
    out.push(x); used.add(x.id);
  }
  return out;
}

    for(const f of snap.folders||[]) if(!mergedFolders.some(x=>x.id===f.id)) mergedFolders.push(cloneItemForMerge(f));
    state.folders=mergedFolders;
    state.items=mergeItemLists(localItems,folderItems,decisions);
    await writeMergedStateToIDB();
    await syncFolderStorageNow();
    renderSidebarTree(); navigateTo({type:'home'}); toast('✅ تم دمج البرنامج والمجلد بعد مراجعة العناصر المتشابهة.','ok',6000);
    return true;
  }
  // لا توجد تشابهات: دمج آمن بدل الاستبدال.
  state.folders=[...(state.folders||[])];
  for(const f of snap.folders||[]) if(!state.folders.some(x=>x.id===f.id)) state.folders.push(cloneItemForMerge(f));
  const ids=new Set(state.items.map(x=>x.id));
  for(const it of folderItems){ const x=cloneItemForMerge(it); if(ids.has(x.id)) x.id=uid('item'); state.items.push(x); ids.add(x.id); }
  await writeMergedStateToIDB(); await syncFolderStorageNow();
  renderSidebarTree(); navigateTo({type:'home'}); toast('✅ تم دمج محتوى المجلد بدون تعارضات.','ok',5000); return true;
}

async function linkBackupFolder(){
  if(!FS_ACCESS_SUPPORTED){ toast("هذا المتصفح لا يدعم ربط مجلد حقيقي. استخدم Chrome/Edge بإصدار يدعم File System Access API.","err",6000); return; }
  try{
    const handle=await window.showDirectoryPicker({mode:"readwrite"});
    const granted=await ensureFolderPermission(handle,true);
    if(!granted){ toast("لم يتم منح صلاحية الكتابة على المجلد.","err"); return; }
    linkedDirHandle=handle;
    await idbPut_real("meta",{key:"linkedDir",value:handle});

    const snap=await readFolderSnapshot(handle);
    if(snap){
      const hasLocal=!!((state.items?.length||0)+(state.folders?.length||0));
      const hasFolder=!!((snap.items?.length||0)+(snap.folders?.length||0));
      if(hasLocal && hasFolder){
        const merged=await smartLinkFolderMerge(handle,snap);
        if(!merged){ linkedDirHandle=null; try{await idbDelete_real("meta","linkedDir");}catch(e){} renderFolderLinkStatus(); return; }
        renderFolderLinkStatus(); try{restartActivityLogScheduler();updateGlobalSyncBadge();}catch(e){} return;
      }
      if(hasFolder){
        await restoreAllFromFolder(handle,snap);
        applyTheme(state.settings.theme||"amber");
        renderSidebarTree(); navigateTo({type:"home"});
        toast("✅ تم التعرف على محتوى المجلد واستعادته.","ok",6000);
        renderFolderLinkStatus(); try{restartActivityLogScheduler();updateGlobalSyncBadge();}catch(e){} return;
      }
    }
    await syncFolderStorageNow();
    toast("✅ تم ربط المجلد. كل تعديل سيُزامن إليه تلقائيًا.","ok",5000);
  }catch(e){
    if(e?.name!=="AbortError") toast("تعذر ربط المجلد: "+(e.message||e),"err");
  }
  renderFolderLinkStatus();
  try{restartActivityLogScheduler();updateGlobalSyncBadge();}catch(e){}
}
async function activateLinkedFolder(){
  if(!linkedDirHandle) return linkBackupFolder();
  const ok=await ensureFolderPermission(linkedDirHandle,true);
  if(!ok){ toast("لم تُمنح صلاحية المجلد.","err"); return; }
  const snap=await readFolderSnapshot(linkedDirHandle);
  if((state.items?.length||0)===0 && snap){
    await restoreAllFromFolder(linkedDirHandle,snap);
    renderSidebarTree(); navigateTo({type:"home"});
    toast("♻️ تم الاسترجاع تلقائيًا لأن بيانات IndexedDB كانت فارغة.","ok",5000);
  }else await requestFolderSync();
  renderFolderLinkStatus();
  folderPermissionNeedsActivation=false;
  try{restartActivityLogScheduler();updateGlobalSyncBadge();}catch(e){}
}

/* =========================================================
   استعلامات بيانات مساعدة
   ========================================================= */
function getFolder(id){ return state.folders.find(f=>f.id===id); }
function getChildFolders(parentId){
  return state.folders.filter(f=>f.parentId===parentId).sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name,"ar"));
}
function getRootFolders(){ return getChildFolders(null); }
function getItemsInFolder(folderId){ return state.items.filter(i=>i.folderId===folderId); }
function countItemsDeep(folderId){
  let n = getItemsInFolder(folderId).length;
  for(const c of getChildFolders(folderId)) n += countItemsDeep(c.id);
  return n;
}
function countAllFoldersDeep(folderId){
  let n = 0;
  for(const c of getChildFolders(folderId)){ n += 1 + countAllFoldersDeep(c.id); }
  return n;
}
function getFolderPath(folderId){
  const path = [];
  let f = getFolder(folderId);
  while(f){ path.unshift(f); f = f.parentId ? getFolder(f.parentId) : null; }
  return path;
}
function getEffectiveFieldTemplate(folderId){
  // يبحث في المجلد ثم آبائه عن أقرب قالب حقول غير فارغ
  let f = getFolder(folderId);
  while(f){
    if(f.fieldsTemplate && f.fieldsTemplate.length) return f.fieldsTemplate;
    f = f.parentId ? getFolder(f.parentId) : null;
  }
  return [];
}
function getAllTags(){
  const map = new Map();
  for(const it of state.items){
    for(const t of (it.tags||[])){ map.set(t, (map.get(t)||0)+1); }
  }
  return [...map.entries()].sort((a,b)=>b[1]-a[1]);
}
function isDescendantFolder(folderId, possibleParentId){
  let f = getFolder(folderId);
  while(f){ if(f.parentId===possibleParentId) return true; f = f.parentId ? getFolder(f.parentId): null; }
  return false;
}

   الإقلاع
   ========================================================= */
async function boot(){
  try{
    // لا نجبر التطبيق على وضع الذاكرة عند فتح الملف من file:// أو content://.
    // نحاول IndexedDB أولاً لأنها الوحيدة التي تحفظ البيانات بعد إعادة التحميل/الإغلاق.
    db = await openDB();
    STORAGE_MODE = "idb";
  } catch(err){
    console.error("IndexedDB غير متاح:", err);
    STORAGE_MODE = "memory";
  }
  const [folders, items, metaRows] = await Promise.all([idbGetAll("folders"), idbGetAll("items"), idbGetAll("meta")]);
  state.folders = folders;
  state.items = items;
  const settingsRow = metaRows.find(m=>m.key==="settings");
  if(settingsRow && settingsRow.value) state.settings = Object.assign(state.settings, settingsRow.value);
  applyTheme(state.settings.theme || "amber");
  const actLogRow = metaRows.find(m=>m.key==="activityLog");
  if(actLogRow && Array.isArray(actLogRow.value)) state.activityLog = actLogRow.value;
  const syncSettingsRow = metaRows.find(m=>m.key==="syncLogSettings");
  if(syncSettingsRow && syncSettingsRow.value) state.syncLogSettings = Object.assign(state.syncLogSettings, syncSettingsRow.value);
  const syncStateRow = metaRows.find(m=>m.key==="syncLogState");
  if(syncStateRow && syncStateRow.value) state.syncLogState = Object.assign(state.syncLogState, syncStateRow.value);

  // إذا كان هناك مجلد مرتبط سابقًا، فملف project.json داخله هو المصدر الخارجي
  // الفعلي. لا نستخدم IndexedDB بدلًا منه؛ نحمّل منه عند فتح البرنامج كلما كانت
  // الصلاحية متاحة. إذا كانت الصلاحية تحتاج تفاعلًا من المستخدم، تظهر حالة
  // "تفعيل" في الإعدادات بدل محاولة requestPermission خارج gesture.
  if(STORAGE_MODE!=="memory"){
    const linkedDirRow = metaRows.find(m=>m.key==="linkedDir");
    if(linkedDirRow && linkedDirRow.value){
      linkedDirHandle = linkedDirRow.value;
      try{
        const granted = await ensureFolderPermission(linkedDirHandle,false);
        if(granted){
          const snap = await readFolderSnapshot(linkedDirHandle);
          if(snap){
            await restoreAllFromFolder(linkedDirHandle,snap);
            applyTheme(state.settings.theme || "amber");
          }
        }
      }catch(e){ console.warn("تعذر تحميل التخزين من المجلد المرتبط:",e); }
    }
  }

  bindGlobalEvents();
  renderSidebarTree();
  navigateTo({type:"home"});
  initGalleryAuditTracker();
  try{ restartActivityLogScheduler(); }catch(e){}
  try{
    const gsb=document.getElementById('globalSyncBadge');
    if(gsb) gsb.onclick=handleGlobalSyncBadgeClick;
    updateGlobalSyncBadge();
    setInterval(updateGlobalSyncBadge,15000);
    if(state.syncLogSettings && state.syncLogSettings.autoRequestOnStart && linkedDirHandle && !state.syncLogSettings.enabled){
      state.syncLogSettings.enabled=true;
      persistSyncLogMetaNow();
      restartActivityLogScheduler();
    }
  }catch(e){}

  if(STORAGE_MODE==="memory"){
    // في وضع الذاكرة لا يمكن ضمان بقاء البيانات بعد إغلاق الصفحة.
    // نوضح ذلك للمستخدم بدل أن يظهر التطبيق وكأن الحفظ التلقائي يعمل.
    const badge = document.getElementById("saveBadgeText");
    if(badge) badge.textContent = "⚠️ التخزين الدائم غير متاح";
    toast("تحذير: المتصفح منع IndexedDB، البيانات الحالية مؤقتة.", "err");
    showStorageBanner("⚠️ التخزين الدائم غير متاح في هذا المتصفح — أي عنصر تضيفه الآن سيُفقد فور إغلاق الصفحة. صدّر نسخة ZIP فورًا كل مرة قبل الإغلاق.", "err");

    window.addEventListener("beforeunload", (e)=>{
      if(state.folders.length || state.items.length){
        e.preventDefault();
        e.returnValue = "";
      }
    });
  } else {
    // نطلب من المتصفح تخزينًا "دائمًا" (Persistent Storage) لتقليل احتمال أن يحذف
    // المتصفح بيانات IndexedDB تلقائيًا عند ضغط المساحة أو عدم الاستخدام لفترة (خاصة
    // على الموبايل وفي أوضاع التصفح الخفي/الوضع الخاص، وهو السبب الأشهر لفقدان
    // العناصر بعد إغلاق التطبيق وإعادة فتحه رغم عدم ظهور أي خطأ وقت الحفظ).
    try{
      if(navigator.storage && navigator.storage.persist){
        const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
        if(!already) await navigator.storage.persist();
      }
    }catch(e){ console.warn("storage.persist() غير متاح:", e); }

    // تذكير بالنسخ الاحتياطي: لو مفيش تصدير منذ فترة طويلة (أو أبدًا) ويوجد بيانات فعلية
    try{
      const backupRow = metaRows.find(m=>m.key==="lastBackupAt");
      const lastBackupAt = backupRow ? backupRow.value : null;
      const hasData = (state.folders.length || state.items.length);
      if(hasData && (!lastBackupAt || (Date.now()-lastBackupAt) > 7*24*3600*1000)){
        toast("💡 تذكير: لم يتم تصدير نسخة ZIP احتياطية منذ فترة طويلة — يُفضّل تصديرها بانتظام حماية للبيانات.", "warn", 6000);
      }
    }catch(e){}
  }

  // فحص خفيف للتأكد من أن المجلد ما زال متاحًا. المزامنة الأساسية تتم بعد كل عملية
  // حفظ/تعديل/حذف، وليس بالاعتماد على مؤقت فقط.
  setInterval(()=>{ if(linkedDirHandle && !folderSyncBusy){ if(window.__FS) window.__FS.tick(); else requestFolderSync(); } }, 15000);
}

  } else if(state.view.type==="activitylog"){
    html = '<b data-go="home">🏠 الرئيسية</b><span class="sep">/</span><b>🔄 السجل والمزامنة</b>';

  } else if(state.view.type==="item"){

      html = '<b data-go="home">🏠 الرئيسية</b>';
      path.forEach(f=>{ html += '<span class="sep">/</span><b data-go="folder" data-id="'+f.id+'">'+esc(f.icon||"📁")+" "+esc(f.name)+'</b>'; });
      html += '<span class="sep">/</span><b>'+esc(it.name)+'</b>';
    }
  }
  el.innerHTML = html;
  el.querySelectorAll("[data-go]").forEach(b=>{

      if(go==="home") navigateTo({type:"home"});
      else if(go==="folder") navigateTo({type:"folder", id:b.dataset.id});

  });
}

  const rootFolders = getRootFolders();
  if(!rootFolders.length){
    root.innerHTML = '<div style="padding:10px;font-size:11.5px;color:var(--dim2)">لا توجد مجلدات بعد. اضغط + لإنشاء أول مجلد.</div>';
    return;
  }
  rootFolders.forEach(f=> root.appendChild(buildTreeNode(f)));
}
function buildTreeNode(folder){
  const wrap = document.createElement("div");
  wrap.className = "tree-node";
  const children = getChildFolders(folder.id);
  const row = document.createElement("div");
  row.className = "tree-row";
  row.dataset.id = folder.id;
  const isOpen = state.expandedFolders.has(folder.id);
  row.innerHTML = `
    <span class="tree-toggle ${children.length? (isOpen?'open':'') : 'empty'}">▶</span>
    <span class="tree-ico">${esc(folder.icon||"📁")}</span>
    <span class="tree-name">${esc(folder.name)}</span>
    <span class="tree-count">${countItemsDeep(folder.id)}</span>
  `;
  row.querySelector(".tree-toggle").onclick = (e)=>{
    e.stopPropagation();
    if(!children.length) return;
    if(state.expandedFolders.has(folder.id)) state.expandedFolders.delete(folder.id);
    else state.expandedFolders.add(folder.id);
    renderSidebarTree();
    updateActiveNav();
  };
  row.onclick = ()=> navigateTo({type:"folder", id: folder.id});
  wrap.appendChild(row);
  if(children.length && isOpen){
    const kids = document.createElement("div");
    kids.className = "tree-children";
    children.forEach(c=> kids.appendChild(buildTreeNode(c)));
    wrap.appendChild(kids);
  }
  return wrap;
}

function bindGlobalEvents(){
  document.querySelectorAll(".nav-item[data-nav]").forEach(b=>{
    b.onclick = ()=> navigateTo({type:b.dataset.nav});
  });
  document.getElementById("rootAddFolderBtn").onclick = ()=> openFolderModal(null, null);
  document.getElementById("menuBtn").onclick = ()=>{
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("hidden");
  };
  document.getElementById("sidebarOverlay").onclick = ()=>{
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.add("hidden");
  };
  document.querySelectorAll("#viewSwitch button").forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll("#viewSwitch button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      state.viewMode = b.dataset.mode;
      render();
    };
  });
  const searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", debounce(()=>{
    const q = searchInput.value.trim();
    if(q.length < 1){ document.getElementById("searchResults").classList.add("hidden"); return; }
    runSearch(q);
  }, 180));
  searchInput.addEventListener("keydown", (e)=>{
    if(e.key==="Enter"){
      const q = searchInput.value.trim();
      if(q){ document.getElementById("searchResults").classList.add("hidden"); navigateTo({type:"search", q}); }
    }
  });
  document.addEventListener("click", (e)=>{
    if(!e.target.closest(".search-wrap")) document.getElementById("searchResults").classList.add("hidden");
  });
  // تتبع لحظي (كل حرف) لأي تعديل داخل شاشة العرض أو أي نافذة منبثقة
  const __actLogRegions = ()=> document.querySelectorAll('#viewContainer, #modalRoot, .tbl-modal-overlay, .ft-modal-overlay');
  const __actLogHandler = (e)=>{
    for(const region of __actLogRegions()){ if(region.contains(e.target)){ setTimeout(()=>{ try{ galleryAuditCaptureChanges(); }catch(err){} },0); return; } }
  };
  document.addEventListener('input', __actLogHandler, true);
  document.addEventListener('change', __actLogHandler, true);
}

function render(){
  const c = document.getElementById("viewContainer");
  document.getElementById("viewSwitch").parentElement && null;
  const v = state.view;
  if(v.type==="home") return renderHome(c);
  if(v.type==="folder") return renderFolderView(c, v.id);
  if(v.type==="tags") return renderTagsView(c, v.tag);
  if(v.type==="settings") return renderSettingsView(c);
  if(v.type==="items-sheet") return renderItemsSheetView(c);
  if(v.type==="search") return renderSearchView(c, v.q);
  if(v.type==="item") return renderItemDetail(c, v.id);

}

async function renderItemGallery(holder, items){
  const firstFolder=items.length?getFolder(items[0].folderId):null;
  const columns=Math.max(2,Math.min(6,Number(firstFolder?.columns)||4));
  holder.innerHTML='<div class="item-grid"></div><div class="lazy-list-sentinel" style="height:1px"></div>';
  const grid=holder.querySelector('.item-grid'); grid.style.gridTemplateColumns=`repeat(${columns}, minmax(0,1fr))`;
  const sentinel=holder.querySelector('.lazy-list-sentinel');
  let cursor=0,rendering=false;
  const pageSize=40;
  const renderNext=()=>{
    if(rendering || cursor>=items.length) return;
    rendering=true;
    const end=Math.min(cursor+pageSize,items.length);
    const frag=document.createDocumentFragment();
    for(;cursor<end;cursor++){
      const it=items[cursor], card=document.createElement('div'); card.className='item-card';
      const template=getEffectiveFieldTemplate(it.folderId).filter(f=>f.showInCard); let fieldsHtml='';
      template.forEach(f=>{const val=it.fields?it.fields[f.id]:null;if(val==null||val==='')return;fieldsHtml+=`<div class="row"><span class="k">${esc(f.label)}</span><span class="v">${esc(val)}${f.unit?esc(f.unit):''}</span></div>`;});
      card.innerHTML=`<div class="item-thumb">🧰</div><div class="item-body"><div class="item-name">${esc(it.name)}</div><div class="item-model">${esc(it.model||'—')}</div><div class="item-fields">${fieldsHtml}</div>${(it.tags&&it.tags.length)?`<div class="item-tags">${it.tags.slice(0,4).map(t=>`<span class="tag-chip">#${esc(t)}</span>`).join('')}</div>`:''}${(it.indicators&&it.indicators.length)?renderIndicatorsHtml(it.indicators,true):''}</div>`;
      card.onclick=()=>navigateTo({type:'item',id:it.id});
      if(window.__SI) __SI.tag(card,{kind:'item',itemId:it.id,pos:'tl'});
      frag.appendChild(card);
      if(it.mainImageId) observeLazyFileImage(card.querySelector('.item-thumb'),it.mainImageId);
    }
    grid.appendChild(frag); rendering=false;
  };
  renderNext();
  if('IntersectionObserver' in window){
    const moreObserver=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){renderNext(); if(cursor>=items.length) moreObserver.disconnect();}},{root:document.getElementById('viewContainer'),rootMargin:'500px'});
    moreObserver.observe(sentinel);
  }
}

function renderItemList(holder, items){
  holder.innerHTML='<div class="item-list"></div><div class="lazy-list-sentinel" style="height:1px"></div>';
  const list=holder.querySelector('.item-list'), sentinel=holder.querySelector('.lazy-list-sentinel');
  let cursor=0,rendering=false; const pageSize=60;
  const renderNext=()=>{
    if(rendering||cursor>=items.length)return; rendering=true;
    const end=Math.min(cursor+pageSize,items.length),frag=document.createDocumentFragment();
    for(;cursor<end;cursor++){
      const it=items[cursor],row=document.createElement('div'); row.className='item-list-row';
      row.innerHTML=`<div class="ilr-thumb">🧰</div><div class="ilr-name">${esc(it.name)}</div><div class="ilr-model">${esc(it.model||'—')}</div><div class="ilr-badge">${renderIndicatorsHtml((it.indicators||[]).filter(x=>x.type==='badge').slice(0,1),false)}</div>`;
      row.onclick=()=>navigateTo({type:'item',id:it.id}); if(window.__SI) __SI.tag(row,{kind:'item',itemId:it.id,pos:'cl'}); frag.appendChild(row);
      if(it.mainImageId) observeLazyFileImage(row.querySelector('.ilr-thumb'),it.mainImageId);
    }
    list.appendChild(frag); rendering=false;
  };
  renderNext();
  if('IntersectionObserver' in window){const moreObserver=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){renderNext();if(cursor>=items.length)moreObserver.disconnect();}},{root:document.getElementById('viewContainer'),rootMargin:'500px'});moreObserver.observe(sentinel);}
}

function renderIndicatorsHtml(indicators, compact){
  if(!indicators || !indicators.length) return "";
  let html = '<div class="ind-row">';
  indicators.forEach(ind=>{
    if(ind.type==="badge"){
      const bc = BADGE_COLORS.find(b=>b.v===ind.color) || BADGE_COLORS[0];
      html += `<span class="ind badge-${ind.color||'ok'}">${bc.ico} ${esc(ind.value||ind.label||"")}</span>`;
    } else if(ind.type==="progress"){
      const pct = Math.max(0, Math.min(100, Number(ind.value)||0));
      html += `<span class="ind"><span class="ind-lbl">${esc(ind.label||"")}</span><span class="ind-progress"><span class="ind-progress-fill" style="width:${pct}%"></span></span><span class="ind-val">${pct}%</span></span>`;
    } else {
      html += `<span class="ind"><span class="ind-lbl">${esc(ind.label||"")}</span><span class="ind-val">${esc(ind.value||"")}</span></span>`;
    }
  });
  html += "</div>";
  return html;
}

function openLightbox(url){
  const modal = document.createElement("div");
  modal.className = "modal-backdrop";

  document.getElementById("modalRoot").appendChild(modal);
}
async function confirmDeleteItem(itemId){
  if(!confirm("هل تريد حذف هذا العنصر نهائيًا؟ سيتم حذف صوره ومستنداته أيضًا.")) return;
  const it = state.items.find(i=>i.id===itemId);
  if(!it) return;
  for(const fid of (it.imageIds||[])) await deleteFile(fid);
  for(const d of (it.docs||[])) await deleteFile(d.fileId);
  await idbDelete("items", itemId);
  state.items = state.items.filter(i=>i.id!==itemId);
  await garbageCollectUnreferencedFiles();
  await requestFolderSync();
  toast("تم حذف العنصر", "ok");
  navigateTo({type:"folder", id: it.folderId});
  renderSidebarTree();
}

  if(!tags.length){ cloud.innerHTML = `<div class="empty-state"><div class="ico">🏷️</div><div class="t">لا توجد وسوم بعد</div></div>`; }
  tags.forEach(([tag,count])=>{
    const el = document.createElement("span");
    el.className = "tc";
    el.style.cursor = "pointer";
    if(tag===activeTag){ el.style.borderColor="var(--amber)"; el.style.color="var(--amber)"; }
    el.innerHTML = `#${esc(tag)} <b>${count}</b>`;
    el.onclick = ()=> navigateTo({type:"tags", tag});
    cloud.appendChild(el);
  });
  if(activeTag){
    const items = state.items.filter(i=> (i.tags||[]).includes(activeTag));
    renderItemGallery(document.getElementById("tagItemsHolder"), items);
  }
}

/* =========================================================
   البحث
   ========================================================= */
function matchItem(it, q){
  const hay = [it.name, it.model, it.manufacturer, it.serial, it.partNumber, it.notes, (it.tags||[]).join(" ")];
  const folder = getFolder(it.folderId);
  if(folder) hay.push(folder.name);
  if(it.fields) Object.values(it.fields).forEach(v=> hay.push(String(v)));
  const text = hay.join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(term=> text.includes(term));
}
function runSearch(q){
  const results = state.items.filter(it=> matchItem(it, q)).slice(0, 30);
  const box = document.getElementById("searchResults");
  box.classList.remove("hidden");
  if(!results.length){ box.innerHTML = `<div class="sres-empty">لا توجد نتائج لـ «${esc(q)}»</div>`; return; }
  box.innerHTML = "";
  results.forEach(it=>{
    const path = getFolderPath(it.folderId).map(f=>f.name).join(" / ");
    const row = document.createElement("div");
    row.className = "sres-item";
    row.innerHTML = `<div><div class="sres-name">${esc(it.name)}</div><div class="sres-meta">${esc(it.model||"")}</div></div><div class="sres-loc">${esc(path)}</div>`;
    row.onclick = ()=>{ box.classList.add("hidden"); document.getElementById("searchInput").value=""; navigateTo({type:"item", id:it.id}); };
    box.appendChild(row);
  });
}
function renderSearchView(c, q){
  const results = state.items.filter(it=> matchItem(it, q));
  c.innerHTML = `
    <div class="view-title"><h1>🔎 نتائج البحث</h1><span class="sub">"${esc(q)}" — ${results.length} نتيجة</span></div>
    <div id="searchViewHolder"></div>
  `;
  if(!results.length){
    document.getElementById("searchViewHolder").innerHTML = `<div class="empty-state"><div class="ico">🔎</div><div class="t">لا توجد نتائج مطابقة</div></div>`;
    return;
  }
  renderItemGallery(document.getElementById("searchViewHolder"), results);
}

async function deleteFolderDeep(folderId){
  const ids=new Set();
  function collect(fid){
    ids.add(fid);
    for(const c of getChildFolders(fid)) collect(c.id);
  }
  collect(folderId);
  const doomedItems=state.items.filter(it=>ids.has(it.folderId));
  for(const it of doomedItems){
    for(const fid of (it.imageIds||[])) await deleteFile(fid);
    for(const d of (it.docs||[])) await deleteFile(d.fileId);
  }
  for(const it of doomedItems) await idbDelete("items",it.id);
  for(const fid of ids) await idbDelete("folders",fid);
  state.items=state.items.filter(it=>!ids.has(it.folderId));
  state.folders=state.folders.filter(f=>!ids.has(f.id));
  await garbageCollectUnreferencedFiles();
  await requestFolderSync();
}

    it.fields = it.fields || {};
    document.querySelectorAll("#specFields [data-fid]").forEach(inp=>{ it.fields[inp.dataset.fid] = inp.value.trim(); });
    it.tags = document.getElementById("iTags").value.split(",").map(t=>t.trim()).filter(Boolean);
    it.links = document.getElementById("iLinks").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const parts = l.split("::");
      return parts.length>1 ? {label:parts[0].trim(), url:parts.slice(1).join("::").trim()} : {label:"", url:parts[0]};
    });
    it.notes = document.getElementById("iNotes").value.trim();
    it.indicators = localIndicators.filter(i=>i.label.trim());
    it.updatedAt = Date.now();

    setSaveBadge("saving");
    try{
      const idMap = {};
      for(const p of state.pendingImages){
        const fid = await storeFile(p.blob, p.name, p.blob.type);
        idMap[p.tempId] = fid;
        localImageIds.push(fid);
      }
      if(localMainId && idMap[localMainId]) localMainId = idMap[localMainId];
      it.imageIds = localImageIds;
      it.mainImageId = localMainId || localImageIds[0] || null;

      for(const p of state.pendingDocs){
        const fid = await storeFile(p.blob, p.name, p.blob.type);
        localDocs.push({id: uid("doc"), name: p.name, fileId: fid});
      }
      it.docs = localDocs;

      await idbPut("items", it);
    } finally { setTimeout(()=>setSaveBadge("idle"), 350); }

    if(editing) state.items = state.items.map(x=>x.id===it.id? it : x);
    else {
      state.items.push(it);
      try{
        if(window.HUB) window.HUB.addLog({type:'equipment_registered', value:1, label:it.name, note:[it.manufacturer,it.model].filter(Boolean).join(' — ')}, 'equipment');
      }catch(e){}
    }

    closeModal();
    renderSidebarTree();
    navigateTo({type:"item", id: it.id});
    toast("تم حفظ العنصر", "ok");
  };
}

async function wipeAllData(){
  if(!confirm("سيتم حذف كل المجلدات والعناصر والصور نهائيًا من هذا المتصفح. متابعة؟")) return false;
  if(!confirm("تأكيد أخير: هذا الإجراء لا يمكن التراجع عنه.")) return false;
  state.folders = []; state.items = [];
  await idbClear("folders"); await idbClear("items"); await idbClear("files");
  state.objectUrls.forEach(u=>URL.revokeObjectURL(u)); state.objectUrls.clear();
  await requestFolderSync();
  toast("تم إفراغ قاعدة البيانات وحذف كل البيانات", "ok");
  renderSidebarTree();
  navigateTo({type:"home"});
  return true;
}

/* =========================================================
   التصدير (ZIP)
   ========================================================= */
async function exportProject(){
  toast("جارٍ تجهيز ملف التصدير...");
  try{
    const zip = new JSZip();
    const manifest = {
      app: "workshop-equipment-db",
      version: 2,
      exportedAt: new Date().toISOString(),
      counts: {folders: state.folders.length, items: state.items.length, categories: state.categories.length}
    };
    zip.file("project/manifest.json", JSON.stringify(manifest, null, 2));
    zip.file("project/folders.json", JSON.stringify(state.folders, null, 2));
    zip.file("project/settings.json", JSON.stringify(state.settings, null, 2));
    // نظام الفئات والمواصفات (مستقل عن المجلدات) — كان ناقصًا تمامًا من التصدير القديم
    zip.file("project/categories.json", JSON.stringify({categories: state.categories, categorySchemas: state.categorySchemas}, null, 2));

    const itemsMeta = [];
    const allFiles = await idbGetAll("files");
    const fileMap = new Map(allFiles.map(f=>[f.id,f]));
    const missingFiles = [];

    // نجهّز كل عناصر عنصر واحد بالتوازي (قراءة الملفات من IndexedDB لا تحتاج تسلسل)،
    // وده بيسرّع التصدير بشكل كبير في المشاريع الكبيرة (آلاف الصور/المستندات).
    await Promise.all(state.items.map(async (it)=>{
      const clone = JSON.parse(JSON.stringify(it));
      const folder = zip.folder("equipment/" + it.id);
      const imageNames = [];
      for(const fid of (it.imageIds||[])){
        const frec = fileMap.get(fid);
        if(!frec){ missingFiles.push({item:it.name||it.id, type:"صورة", id:fid}); continue; }
        const ext = guessExt(frec.mime, frec.name);
        const fname = fid + ext;
        folder.folder("images").file(fname, frec.blob);
        imageNames.push({fileId: fid, filename: "images/"+fname, isMain: fid===it.mainImageId});
      }
      const docNames = [];
      for(const d of (it.docs||[])){
        const frec = fileMap.get(d.fileId);
        if(!frec){ missingFiles.push({item:it.name||it.id, type:"مستند", id:d.fileId, name:d.name}); continue; }
        const fname = d.fileId + "_" + (d.name||"file");
        folder.folder("documents").file(fname, frec.blob);
        docNames.push({fileId: d.fileId, filename: "documents/"+fname, name: d.name});
      }
      // صور دفتر الملاحظات التقني (منفصلة عن معرض صور العنصر الرئيسي) — لازم تُصدَّر كمان
      const nbImageNames = [];
      const nbImages = (it.notebookData && Array.isArray(it.notebookData.images)) ? it.notebookData.images : [];
      for(const nimg of nbImages){
        const frec = fileMap.get(nimg.id);
        if(!frec){ missingFiles.push({item:it.name||it.id, type:"صورة دفتر ملاحظات", id:nimg.id}); continue; }
        const ext = guessExt(frec.mime, frec.name);
        const fname = nimg.id + ext;
        folder.folder("notebook_images").file(fname, frec.blob);
        nbImageNames.push({fileId: nimg.id, filename: "notebook_images/"+fname, caption: nimg.caption||''});
      }
      // صور "تتبع الأعطال": صور الصفحات نفسها + الصور المرفقة داخل محتوى كل نقطة تفاعلية
      const ftImageNames = [];
      const ftPages = (it.notebookData && it.notebookData.faultTracking && Array.isArray(it.notebookData.faultTracking.pages)) ? it.notebookData.faultTracking.pages : [];
      const ftFileIds = [];
      ftPages.forEach(p=>{
        if(p.imageId) ftFileIds.push(p.imageId);
        (p.hotspots||[]).forEach(h=>{
          ((h.content&&h.content.images)||[]).forEach(im=> ftFileIds.push(im.id));
        });
      });
      for(const fid of ftFileIds){
        const frec = fileMap.get(fid);
        if(!frec){ missingFiles.push({item:it.name||it.id, type:"صورة تتبع أعطال", id:fid}); continue; }
        const ext = guessExt(frec.mime, frec.name);
        const fname = fid + ext;
        folder.folder("fault_images").file(fname, frec.blob);
        ftImageNames.push({fileId: fid, filename: "fault_images/"+fname});
      }
      clone._images = imageNames;
      clone._docs = docNames;
      clone._notebookImages = nbImageNames;
      clone._faultImages = ftImageNames;
      folder.file("data.json", JSON.stringify(clone, null, 2));
      itemsMeta.push({id: it.id, name: it.name, folderId: it.folderId});
    }));
    zip.file("project/items_index.json", JSON.stringify(itemsMeta, null, 2));
    if(missingFiles.length){
      zip.file("project/export-warnings.json", JSON.stringify(missingFiles, null, 2));
    }

    const blob = await zip.generateAsync({type:"blob", compression:"DEFLATE", compressionOptions:{level:4}});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0,10);
    a.download = `equipment-db-${stamp}.zip`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    if(missingFiles.length){
      console.warn("ملفات مفقودة أثناء التصدير:", missingFiles);
      toast(`تم التصدير مع تحذير: ${missingFiles.length} صورة/مستند لها مرجع بدون ملف فعلي، لم تُدرَج في الأرشيف.`, "err", 7000);
    }else{
      toast("تم تصدير النسخة بنجاح (تشمل الفئات ودفاتر الملاحظات والرسم والخرائط الذهنية)", "ok");
    }
    logActivity('export',{entity:'system',entityId:'export_'+Date.now(),entityLabel:'تصدير كامل (ZIP)',summary:`تصدير ${state.items.length} عنصر و${state.folders.length} مجلد`});
    try{scheduleActivityLogSyncSoon();}catch(e){}
    try{ await idbPut("meta", {key:"lastBackupAt", value: Date.now()}); }catch(e){}
    const bar = document.getElementById("storageWarnBar");
    if(bar && STORAGE_MODE!=="memory") bar.remove();
  }catch(err){
    console.error(err);
    toast("فشل التصدير: " + (err.message||err), "err");
  }
}
function guessExt(mime, name){
  if(name && name.includes(".")) return name.slice(name.lastIndexOf("."));
  if(mime==="image/png") return ".png";
  if(mime==="image/webp") return ".webp";
  if(mime==="image/gif") return ".gif";
  return ".jpg";
}

/* =========================================================
   الاستيراد (ZIP)
   ========================================================= */
document.addEventListener("DOMContentLoaded", ()=>{
  const importInput = document.getElementById("hiddenImportInput");
  importInput.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    e.target.value = "";
    if(!file) return;
    const mode = confirm("اضغط موافق للدمج مع البيانات الحالية، أو إلغاء لاستبدال كل البيانات الحالية بالكامل.") ? "merge" : "replace";
    if(mode==="replace" && !confirm("سيتم حذف كل البيانات الحالية قبل الاستيراد. متابعة؟")) return;
    await importProject(file, mode);
  });
});
async function importProject(file, mode){
  toast("جارٍ الاستيراد...");
  const rep = {itemsRestored:0, itemsFailed:[], imagesRestored:0, imagesMissing:[], docsRestored:0, docsMissing:[], notebookImagesRestored:0, notebookImagesMissing:[], categoriesRestored:0};
  try{
    let zip;
    try{ zip = await JSZip.loadAsync(file); }
    catch(e){ throw new Error("الملف ده مش أرشيف ZIP صالح."); }

    const foldersEntry = zip.file("project/folders.json");
    if(!foldersEntry) throw new Error("project/folders.json مفقود من الأرشيف — هل هذا فعلاً ملف نسخة احتياطية لنفس البرنامج؟");
    const itemsIndexEntry = zip.file("project/items_index.json");
    if(!itemsIndexEntry) throw new Error("project/items_index.json مفقود من الأرشيف — الحزمة غير مكتملة.");

    let importedFolders, itemsIndex;
    try{ importedFolders = JSON.parse(await foldersEntry.async("string")); }
    catch(e){ throw new Error("project/folders.json تالف ولا يمكن تحليله."); }
    try{ itemsIndex = JSON.parse(await itemsIndexEntry.async("string")); }
    catch(e){ throw new Error("project/items_index.json تالف ولا يمكن تحليله."); }
    if(!Array.isArray(importedFolders)) importedFolders = [];
    if(!Array.isArray(itemsIndex)) itemsIndex = [];

    // نظام الفئات والمواصفات (لو موجود في الأرشيف — أرشيفات قديمة قبل هذا الإصلاح مش هتحتويه)
    let importedCategories=null, importedSchemas=null;
    const catEntry = zip.file("project/categories.json");
    if(catEntry){
      try{
        const catData = JSON.parse(await catEntry.async("string"));
        importedCategories = Array.isArray(catData.categories) ? catData.categories : [];
        importedSchemas = (catData.categorySchemas && typeof catData.categorySchemas==='object') ? catData.categorySchemas : {};
      }catch(e){ console.warn('categories.json تالف، تم تجاهله', e); }
    }

    if(mode==="replace"){
      await idbClear("folders"); await idbClear("items"); await idbClear("files");
      state.folders = []; state.items = [];
      if(importedCategories){ state.categories=importedCategories; state.categorySchemas=importedSchemas; }
    } else if(importedCategories){
      // دمج: أي فئة مستوردة مش موجودة محليًا تتضاف بمخططها كامل؛ الفئات المشتركة بالاسم تفضل نسختها المحلية
      importedCategories.forEach(catName=>{
        if(!state.categories.includes(catName)){
          state.categories.push(catName);
          state.categorySchemas[catName] = importedSchemas[catName] || {description:'', specs:[]};
          rep.categoriesRestored++;
        }
      });
    }
    if(importedCategories) await saveCategoryMeta();

    const folderIdMap = {};
    for(const f of importedFolders){
      const newId = mode==="merge" ? uid("fld") : f.id;
      folderIdMap[f.id] = newId;
    }
    for(const f of importedFolders){
      try{
        const nf = Object.assign({}, f, {
          id: folderIdMap[f.id],
          parentId: f.parentId ? (folderIdMap[f.parentId]||null) : null
        });
        await idbPut("folders", nf);
        state.folders.push(nf);
      }catch(e){ rep.itemsFailed.push({item:"مجلد: "+(f.name||f.id), reason:String(e && e.message || e)}); }
    }

    // نستورد كل عنصر بالتوازي (كل عنصر مستقل تمامًا عن غيره أثناء القراءة والتخزين)،
    // وده بيسرّع الاستيراد بشكل كبير في الأرشيفات الكبيرة (آلاف الصور/المستندات).
    await Promise.all(itemsIndex.map(async (meta)=>{
      try{
        const entryPath = "equipment/" + meta.id + "/data.json";
        const entry = zip.file(entryPath);
        if(!entry){ rep.itemsFailed.push({item:meta.name||meta.id, reason:"data.json مفقود من الأرشيف لهذا العنصر"}); return; }
        let data;
        try{ data = JSON.parse(await entry.async("string")); }
        catch(e){ rep.itemsFailed.push({item:meta.name||meta.id, reason:"data.json تالف لهذا العنصر"}); return; }

        const newItemId = mode==="merge" ? uid("itm") : data.id;
        const newImageIds = [];
        let newMainId = null;
        for(const img of (data._images||[])){
          try{
            const zf = zip.file("equipment/" + meta.id + "/" + img.filename);
            if(!zf){ rep.imagesMissing.push({item:meta.name||meta.id, filename:img.filename}); continue; }
            const blob = await zf.async("blob");
            const fid = await storeFile(blob, img.filename);
            newImageIds.push(fid); rep.imagesRestored++;
            if(img.isMain) newMainId = fid;
          }catch(e){ rep.imagesMissing.push({item:meta.name||meta.id, filename:img.filename, reason:String(e && e.message || e)}); }
        }
        const newDocs = [];
        for(const d of (data._docs||[])){
          try{
            const zf = zip.file("equipment/" + meta.id + "/" + d.filename);
            if(!zf){ rep.docsMissing.push({item:meta.name||meta.id, name:d.name}); continue; }
            const blob = await zf.async("blob");
            const fid = await storeFile(blob, d.name);
            newDocs.push({id: uid("doc"), name: d.name, fileId: fid}); rep.docsRestored++;
          }catch(e){ rep.docsMissing.push({item:meta.name||meta.id, name:d.name, reason:String(e && e.message || e)}); }
        }
        // استعادة صور دفتر الملاحظات التقني وربطها بمعرفات ملفات جديدة صحيحة
        const nbImages = [];
        for(const nimg of (data._notebookImages||[])){
          try{
            const zf = zip.file("equipment/" + meta.id + "/" + nimg.filename);
            if(!zf){ rep.notebookImagesMissing.push({item:meta.name||meta.id, filename:nimg.filename}); continue; }
            const blob = await zf.async("blob");
            const fid = await storeFile(blob, nimg.filename);
            nbImages.push({id: fid, caption: nimg.caption||''});
            rep.notebookImagesRestored++;
          }catch(e){ rep.notebookImagesMissing.push({item:meta.name||meta.id, filename:nimg.filename, reason:String(e && e.message || e)}); }
        }
        // استعادة صور "تتبع الأعطال" (صور الصفحات + الصور المرفقة بالنقاط التفاعلية) وربطها بمعرفات ملفات جديدة صحيحة
        const ftIdMap = {};
        for(const fimg of (data._faultImages||[])){
          try{
            const zf = zip.file("equipment/" + meta.id + "/" + fimg.filename);
            if(!zf){ rep.notebookImagesMissing.push({item:meta.name||meta.id, filename:fimg.filename}); continue; }
            const blob = await zf.async("blob");
            const fid = await storeFile(blob, fimg.filename);
            ftIdMap[fimg.fileId] = fid;
            rep.notebookImagesRestored++;
          }catch(e){ rep.notebookImagesMissing.push({item:meta.name||meta.id, filename:fimg.filename, reason:String(e && e.message || e)}); }
        }
        let newFaultTracking = (data.notebookData && data.notebookData.faultTracking) ? JSON.parse(JSON.stringify(data.notebookData.faultTracking)) : {pages:[], activePageId:null};
        if(Array.isArray(newFaultTracking.pages)){
          newFaultTracking.pages.forEach(p=>{
            if(p.imageId) p.imageId = ftIdMap[p.imageId] || null;
            (p.hotspots||[]).forEach(h=>{
              if(h.content && Array.isArray(h.content.images)){
                h.content.images = h.content.images.map(im=> Object.assign({}, im, {id: ftIdMap[im.id] || im.id})).filter(im=> im.id);
              }
            });
          });
        }
        const newNotebookData = data.notebookData ? Object.assign({}, data.notebookData, {images: nbImages, faultTracking: newFaultTracking}) : data.notebookData;
        const newItem = Object.assign({}, data, {
          id: newItemId,
          folderId: folderIdMap[data.folderId] || data.folderId,
          imageIds: newImageIds,
          mainImageId: newMainId || newImageIds[0] || null,
          docs: newDocs,
          notebookData: newNotebookData
        });
        delete newItem._images; delete newItem._docs; delete newItem._notebookImages; delete newItem._faultImages;
        await idbPut("items", newItem);
        state.items.push(newItem);
        rep.itemsRestored++;
      }catch(e){ rep.itemsFailed.push({item:meta.name||meta.id, reason:String(e && e.message || e)}); }
    }));

    renderSidebarTree();
    navigateTo({type:"home"});
    const summary = [`تم الاستيراد: ${rep.itemsRestored} عنصر، ${rep.imagesRestored} صورة، ${rep.docsRestored} مستند، ${rep.notebookImagesRestored} صورة دفتر ملاحظات${rep.categoriesRestored?`، ${rep.categoriesRestored} فئة جديدة`:''}.`];
    if(rep.itemsFailed.length) summary.push(`⚠️ ${rep.itemsFailed.length} عنصر فشل: `+rep.itemsFailed.slice(0,5).map(x=>x.item).join('، ')+(rep.itemsFailed.length>5?' …':''));
    if(rep.imagesMissing.length) summary.push(`⚠️ ${rep.imagesMissing.length} صورة مفقودة من الأرشيف.`);
    if(rep.docsMissing.length) summary.push(`⚠️ ${rep.docsMissing.length} مستند مفقود من الأرشيف.`);
    if(rep.notebookImagesMissing.length) summary.push(`⚠️ ${rep.notebookImagesMissing.length} صورة دفتر ملاحظات مفقودة من الأرشيف.`);
    if(rep.itemsFailed.length || rep.imagesMissing.length || rep.docsMissing.length || rep.notebookImagesMissing.length){
      console.warn("تفاصيل الاستيراد الناقصة:", rep);
      toast(summary.join('\n'), "err", 9000);
    }else{
      toast(summary.join('\n'), "ok");
    }
    logActivity('import',{entity:'system',entityId:'import_'+Date.now(),entityLabel:'استيراد مشروع (ZIP)',summary:`استيراد ${rep.itemsRestored} عنصر — وضع: ${mode==='merge'?'دمج':'استبدال'}`});
    try{ initGalleryAuditTracker(); scheduleActivityLogSyncSoon(); }catch(e){}
  }catch(err){
    console.error(err);
    toast("فشل الاستيراد: " + (err.message||err), "err");
  }
}
