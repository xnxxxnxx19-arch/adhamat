<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="hub.js"></script>
<script>/* HUB_THEME_ADOPT_equipment */try{ if(window.HUB){ window.HUB.applyTheme(window.HUB.getTheme(), "equipment"); window.HUB.onThemeChange(function(name){ window.HUB.applyTheme(name, "equipment"); }); }}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سجل الأجهزة · قاعدة بيانات الورشة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root, [data-theme="amber"]{
  --bg:#0b0f14; --panel:#12181f; --panel2:#1a2330; --panel3:#212c3b;
  --border:#28323f; --border-lt:#33404f;
  --text:#e7edf5; --dim:#8ea0b3; --dim2:#5d6c7d;
  --amber:#f2a93c; --amber-dim:#3a2d16; --amber-dark:#b5721f; --amber-ink:#1a1000; --amber-border:#5a4420;
  --green:#3ddc84; --green-dim:#123321;
  --yellow:#f2c53d; --yellow-dim:#3a3212;
  --red:#ff5d5d; --red-dim:#3a1414;
  --blue:#4da3ff; --blue-dim:#122a44;
  --grid-rgb:255,255,255; --grid-op:.015;
  --theme-emoji:"🟠"; --theme-label:"كهرماني";
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans Arabic','Segoe UI',sans-serif;
}
[data-theme="night-blue"]{
  --bg:#0a0f1a; --panel:#111a2b; --panel2:#182338; --panel3:#1f2d47;
  --border:#28384f; --border-lt:#334660;
  --text:#e6edf7; --dim:#8a9db8; --dim2:#5a6c85;
  --amber:#4da3ff; --amber-dim:#122a44; --amber-dark:#2f6fc4; --amber-ink:#04101f; --amber-border:#1e3f66;
  --green:#3ddc84; --green-dim:#123321;
  --yellow:#f2c53d; --yellow-dim:#3a3212;
  --red:#ff5d5d; --red-dim:#3a1414;
  --blue:#7fc4ff; --blue-dim:#16324d;
  --grid-rgb:255,255,255; --grid-op:.015;
  --theme-emoji:"🌌"; --theme-label:"أزرق ليلي";
}
[data-theme="daylight"]{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f5; --panel3:#e4e9ef;
  --border:#d7dee6; --border-lt:#c7d0db;
  --text:#1c2530; --dim:#5c6b7c; --dim2:#8ea0b3;
  --amber:#c9821f; --amber-dim:#fbeedc; --amber-dark:#a56517; --amber-ink:#ffffff; --amber-border:#e0c090;
  --green:#1f9d5c; --green-dim:#e3f7ec;
  --yellow:#a8790a; --yellow-dim:#fbf2d9;
  --red:#d9433c; --red-dim:#fceaea;
  --blue:#1f6fb2; --blue-dim:#e6f0fa;
  --grid-rgb:0,0,0; --grid-op:.025;
  --theme-emoji:"☀️"; --theme-label:"فاتح نهاري";
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
body{background-image:
  linear-gradient(var(--bg) 0, var(--bg) 100%),
  repeating-linear-gradient(0deg, rgba(var(--grid-rgb),var(--grid-op)) 0 1px, transparent 1px 24px),
  repeating-linear-gradient(90deg, rgba(var(--grid-rgb),var(--grid-op)) 0 1px, transparent 1px 24px);
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);border-radius:6px;padding:8px 10px;width:100%;font-size:13px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-lt);border-radius:4px;}
.hidden{display:none !important;}
.cs-embed-wrap{margin-top:4px;margin-bottom:16px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--panel);}
.cs-embed-frame{display:block;width:100%;height:400px;border:0;background:var(--panel);border-radius:12px;}
a{color:var(--blue);}
label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;font-weight:600;}
.field{margin-bottom:12px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ===== Shell ===== */
.app-shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:250px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;transition:.2s;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px 8px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.brand-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--amber),var(--amber-dark));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--amber-ink);font-family:var(--mono);font-size:16px;flex-shrink:0;}
.brand-text{line-height:1.25;overflow:hidden;}
.brand-text b{font-size:14px;display:block;white-space:nowrap;}
.brand-text span{font-size:10.5px;color:var(--dim);font-family:var(--mono);}
nav.navlist{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:0 0 auto;max-height:38vh;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.nav-item{display:flex;align-items:center;gap:9px;background:transparent;border:none;color:var(--dim);text-align:right;padding:8px 9px;border-radius:8px;font-size:13px;transition:.15s;width:100%;}
.nav-item .ico{font-size:15px;width:17px;text-align:center;flex-shrink:0;}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;}
.nav-item .cnt{font-family:var(--mono);font-size:10.5px;color:var(--dim2);}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel3);color:var(--amber);}

.tree-wrap{flex:1;overflow-y:auto;}
.tree-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px;}
.tree-head span{font-size:10.5px;color:var(--dim2);font-weight:700;letter-spacing:.03em;}
.tree-add{background:var(--panel2);border:1px solid var(--border);color:var(--dim);width:20px;height:20px;border-radius:6px;font-size:13px;display:flex;align-items:center;justify-content:center;}
.tree-add:hover{color:var(--amber);border-color:var(--amber);}
.tree-node{}
.tree-row{display:flex;align-items:center;gap:5px;padding:6px 6px;border-radius:7px;font-size:12.5px;color:var(--dim);cursor:pointer;}
.tree-row:hover{background:var(--panel2);color:var(--text);}
.tree-row.active{background:var(--amber-dim);color:var(--amber);font-weight:600;}
.tree-toggle{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--dim2);transition:.15s;}
.tree-toggle.open{transform:rotate(90deg);}
.tree-toggle.empty{opacity:0;}
.tree-ico{flex-shrink:0;font-size:13px;}
.tree-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tree-count{font-family:var(--mono);font-size:9.5px;color:var(--dim2);}
.tree-children{padding-right:16px;}

.save-badge{margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--panel2);padding:7px 10px;border-radius:8px;border:1px solid var(--border);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.save-badge.saving .save-dot{background:var(--yellow);animation:pulse 1s infinite;}
.global-sync-badge{position:relative;cursor:pointer;font-size:15px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:border-color .2s;}
.global-sync-badge .dot{position:absolute;bottom:3px;left:3px;width:9px;height:9px;border-radius:50%;background:#888;border:2px solid var(--panel2);}
.global-sync-badge.gsb-green{border-color:var(--green);} .global-sync-badge.gsb-green .dot{background:var(--green);}
.global-sync-badge.gsb-amber{border-color:var(--yellow);} .global-sync-badge.gsb-amber .dot{background:var(--yellow);}
.global-sync-badge.gsb-red{border-color:var(--red);} .global-sync-badge.gsb-red .dot{background:var(--red);}
.global-sync-badge.gsb-gray{border-color:var(--border);} .global-sync-badge.gsb-gray .dot{background:#888;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ===== Main ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0;}
.topbar{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:relative;z-index:20;flex-wrap:wrap;}
.menu-btn{display:none;background:var(--panel2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:9px;font-size:16px;flex-shrink:0;}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);flex-wrap:wrap;flex:1;min-width:120px;}
.breadcrumb b{color:var(--text);cursor:pointer;}
.breadcrumb b:hover{color:var(--amber);}
.breadcrumb .sep{color:var(--dim2);}
.search-wrap{position:relative;width:100%;max-width:320px;}
#searchInput{padding:9px 34px 9px 12px;font-size:13px;}
.search-ico{position:absolute;right:11px;top:9px;color:var(--dim2);font-size:13px;pointer-events:none;}
.search-results{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--panel3);border:1px solid var(--border-lt);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-height:400px;overflow-y:auto;z-index:80;}
.sres-item{padding:9px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:center;}
.sres-item:last-child{border-bottom:none;}
.sres-item:hover{background:var(--panel2);}
.sres-name{font-weight:600;font-size:12.5px;}
.sres-meta{font-size:10.5px;color:var(--dim);font-family:var(--mono);}
.sres-loc{font-size:10px;color:var(--amber);font-family:var(--mono);white-space:nowrap;}
.sres-empty{padding:16px;text-align:center;color:var(--dim2);font-size:12px;}
.view-switch{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:3px;}
.view-switch button{background:transparent;border:none;color:var(--dim);width:32px;height:28px;border-radius:6px;font-size:13px;}
.view-switch button.active{background:var(--panel3);color:var(--amber);}

#viewContainer{flex:1;overflow-y:auto;padding:20px 22px 60px 22px;}
.view-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.view-title h1{font-size:19px;margin:0;}
.view-title .sub{color:var(--dim);font-size:12px;font-family:var(--mono);}
.view-desc{color:var(--dim);font-size:12.5px;margin-bottom:16px;max-width:640px;line-height:1.6;}
.view-actions{margin-inline-start:auto;display:flex;gap:8px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;}
.stat-card .num{font-family:var(--mono);font-size:22px;font-weight:600;}
.stat-card .lbl{font-size:11px;color:var(--dim);margin-top:2px;}
.stat-card.good .num{color:var(--green);}
.stat-card.warn .num{color:var(--yellow);}
.stat-card.crit .num{color:var(--red);}
.stat-card.info .num{color:var(--blue);}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:16px;}
.panel h3{margin:0 0 12px 0;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;}
.btn{background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:500;transition:.15s;white-space:nowrap;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);}
.btn.primary:hover{filter:brightness(1.1);color:var(--amber-ink);}
.btn.danger{color:var(--red);border-color:var(--red-dim);}
.btn.danger:hover{background:var(--red-dim);}
.btn.small{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* Folder grid */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:24px;}
.folder-card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:14px;cursor:pointer;transition:.15s;position:relative;}
.folder-card:hover{border-color:var(--amber);transform:translateY(-1px);}
.folder-card .ficon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px;}
.folder-card .fname{font-size:13.5px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.folder-card .fcount{font-size:11px;color:var(--dim);font-family:var(--mono);}
.folder-card .fmenu{position:absolute;top:10px;left:10px;background:var(--panel2);border:1px solid var(--border);width:24px;height:24px;border-radius:7px;font-size:12px;color:var(--dim);opacity:0;transition:.15s;}
.folder-card:hover .fmenu{opacity:1;}
.folder-card .fmenu:hover{color:var(--amber);border-color:var(--amber);}

/* Section header */
.sec-head{display:flex;align-items:center;gap:10px;margin:4px 0 12px;}
.sec-head h2{font-size:14px;margin:0;color:var(--dim);font-weight:600;}
.sec-head .line{flex:1;height:1px;background:var(--border);}

/* Item gallery */
.item-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
.item-card{background:var(--panel);border:1px solid var(--border);border-radius:13px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column;}
.item-card:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.25);}
.item-thumb{width:100%;aspect-ratio:4/3;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--dim2);font-size:30px;overflow:hidden;}
.item-thumb img{width:100%;height:100%;object-fit:cover;}
.item-thumb .lazy-placeholder,.ilr-thumb .lazy-placeholder{opacity:.45;font-size:22px;transition:opacity .2s;}
.lazy-media{content-visibility:auto;}
.item-body{padding:11px 12px 12px;}
.item-name{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item-model{font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item-fields{display:flex;flex-direction:column;gap:3px;}
.item-fields .row{display:flex;justify-content:space-between;font-size:10.5px;gap:6px;}
.item-fields .row .k{color:var(--dim2);white-space:nowrap;}
.item-fields .row .v{color:var(--text);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
.item-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;}
.tag-chip{font-size:9.5px;font-family:var(--mono);background:var(--panel3);color:var(--dim);border:1px solid var(--border);padding:2px 7px;border-radius:20px;}

/* List view */
.item-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.item-list-row{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--border);cursor:pointer;}
.item-list-row:last-child{border-bottom:none;}
.item-list-row:hover{background:var(--panel2);}
.ilr-thumb{width:34px;height:34px;border-radius:7px;background:var(--panel2);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:15px;color:var(--dim2);}
.ilr-thumb img{width:100%;height:100%;object-fit:cover;}
.ilr-name{font-size:12.5px;font-weight:600;flex:1;min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ilr-model{font-size:11px;color:var(--dim);font-family:var(--mono);width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ilr-badge{font-size:10px;}

.empty-state{padding:50px 20px;text-align:center;color:var(--dim2);}
.empty-state .ico{font-size:34px;margin-bottom:10px;}
.empty-state .t{font-size:13.5px;color:var(--dim);margin-bottom:4px;}
.empty-state .s{font-size:11.5px;}

/* Indicators */
.ind-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.ind{display:flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-size:11.5px;}
.ind .ind-lbl{color:var(--dim);}
.ind .ind-val{font-family:var(--mono);font-weight:700;}
.ind.badge-ok{color:var(--green);border-color:var(--green-dim);background:var(--green-dim);}
.ind.badge-warn{color:var(--yellow);border-color:var(--yellow-dim);background:var(--yellow-dim);}
.ind.badge-crit{color:var(--red);border-color:var(--red-dim);background:var(--red-dim);}
.ind.badge-info{color:var(--blue);border-color:var(--blue-dim);background:var(--blue-dim);}
.ind-progress{width:120px;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--border);}
.ind-progress-fill{height:100%;background:var(--amber);}

/* ===== Modals ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(2px);}
.modal-box{background:var(--panel);border:1px solid var(--border-lt);border-radius:15px;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.5);}
.modal-box.wide{max-width:820px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);}
.modal-head h2{font-size:15px;margin:0;}
.modal-close{background:var(--panel2);border:1px solid var(--border);color:var(--dim);width:28px;height:28px;border-radius:8px;font-size:14px;}
.modal-close:hover{color:var(--red);border-color:var(--red);}
.modal-tabs{display:flex;gap:3px;padding:10px 14px 0;border-bottom:1px solid var(--border);overflow-x:auto;}
.mtab{background:transparent;border:none;color:var(--dim);padding:8px 12px;font-size:12px;font-weight:600;border-radius:8px 8px 0 0;white-space:nowrap;}
.mtab.active{color:var(--amber);background:var(--panel2);}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
.modal-foot{display:flex;justify-content:space-between;padding:13px 18px;border-top:1px solid var(--border);gap:8px;}
.modal-foot .left{display:flex;gap:8px;}
.modal-foot .right{display:flex;gap:8px;}
.mtab-panel{display:none;}
.mtab-panel.active{display:block;}

/* Field template editor */
.ft-row{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.ft-row select,.ft-row input{font-size:12px;padding:7px 9px;}

/* Image manager */
.img-drop{border:2px dashed var(--border-lt);border-radius:12px;padding:22px;text-align:center;color:var(--dim);font-size:12.5px;cursor:pointer;transition:.15s;}
.img-drop:hover,.img-drop.drag{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.img-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:12px;}
.img-thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--border);background:var(--panel2);}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-thumb .rm{position:absolute;top:3px;left:3px;background:rgba(0,0,0,.6);color:#fff;width:19px;height:19px;border-radius:50%;font-size:11px;border:none;}
.img-thumb .main-tag{position:absolute;bottom:0;right:0;left:0;background:rgba(0,0,0,.6);color:var(--amber);font-size:8.5px;text-align:center;padding:2px;font-family:var(--mono);}
.img-thumb.is-main{border-color:var(--amber);}

/* Detail view */
.detail-head{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px;}
.detail-img{width:220px;height:220px;border-radius:14px;background:var(--panel2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px;color:var(--dim2);}
.detail-img img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;}
.detail-info{flex:1;min-width:220px;}
.detail-info h1{font-size:21px;margin:0 0 3px;}
.detail-info .model{color:var(--dim);font-family:var(--mono);font-size:13px;margin-bottom:10px;}
.spec-table{width:100%;border-collapse:collapse;}
.spec-table tr{border-bottom:1px solid var(--border);}
.spec-table tr:last-child{border-bottom:none;}
.spec-table td{padding:8px 4px;font-size:12.5px;}
.spec-table td:first-child{color:var(--dim);width:40%;}
.spec-table td:last-child{font-family:var(--mono);font-weight:600;}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;margin-bottom:7px;font-size:12.5px;}
.doc-row .n{flex:1;}
.notes-box{white-space:pre-wrap;font-size:12.5px;line-height:1.7;color:var(--dim);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;}

/* Toast */
#toastWrap{position:fixed;bottom:18px;left:18px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);padding:10px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:toastin .2s ease;}
.toast.ok{border-color:var(--green);color:var(--green);}
.toast.err{border-color:var(--red);color:var(--red);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Theme picker */
.theme-grid-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.theme-swatch{background:var(--panel2);border:1.5px solid var(--border-lt);border-radius:10px;padding:10px;cursor:pointer;}
.theme-swatch.active{border-color:var(--amber);}
.ts-preview{height:28px;border-radius:6px;border:1px solid var(--border-lt);margin-bottom:7px;}
.ts-name{font-size:11.5px;font-weight:700;}

/* Tags cloud */
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px;}
.tag-cloud .tc{background:var(--panel2);border:1px solid var(--border);padding:7px 13px;border-radius:20px;font-size:12px;font-family:var(--mono);color:var(--dim);}
.tag-cloud .tc:hover{border-color:var(--amber);color:var(--amber);}
.tag-cloud .tc b{color:var(--text);margin-inline-start:4px;}

/* Mobile */
@media (max-width:820px){
  .sidebar{position:fixed;right:0;top:0;bottom:0;z-index:150;transform:translateX(100%);box-shadow:0 0 40px rgba(0,0,0,.5);}
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:flex;align-items:center;justify-content:center;}
  .detail-img{width:100%;height:200px;}
}
@media (max-width:480px){
  .field-row{grid-template-columns:1fr;}
  .ft-row{grid-template-columns:1fr 1fr;}
  #viewContainer{padding:14px 12px 50px;}
}

/* ===== إدارة العناصر والمزامنة الذكية ===== */
.sync-conflict-modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:5000;display:flex;align-items:center;justify-content:center;padding:18px}
.sync-conflict-box{width:min(1100px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--border-lt);border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.45);padding:18px;direction:rtl}
.sync-conflict-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.sync-conflict-head h2{font-size:16px;margin:0}.sync-conflict-sub{color:var(--dim);font-size:11.5px;line-height:1.6}
.sync-conflict-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0;padding:9px;background:var(--panel2);border:1px solid var(--border);border-radius:10px}
.sync-conflict-row{display:grid;grid-template-columns:32px 1fr 1fr 150px;gap:8px;align-items:stretch;border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:7px;background:var(--panel2)}
.sync-conflict-cell{min-width:0;padding:6px;border-radius:7px;background:var(--panel)}.sync-conflict-cell b{display:block;font-size:12px;margin-bottom:4px}.sync-conflict-cell span{display:block;color:var(--dim);font-size:10.5px;line-height:1.55;overflow-wrap:anywhere}
.sync-choice{display:flex;flex-direction:column;gap:5px}.sync-choice label{font-size:10.5px;color:var(--text);cursor:pointer}.sync-choice input{margin-left:4px}
.sync-empty{padding:30px;text-align:center;color:var(--dim)}
.sheet-toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.sheet-toolbar input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;min-width:220px}
.elements-sheet{overflow:auto;border:1px solid var(--border);border-radius:11px}.elements-sheet table{width:100%;border-collapse:collapse;min-width:850px;font-size:11.5px}.elements-sheet th,.elements-sheet td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:right;vertical-align:middle}.elements-sheet th{position:sticky;top:0;background:var(--panel3);z-index:1;color:var(--dim);font-size:10.5px}.elements-sheet tr:hover td{background:var(--panel2)}.elements-sheet tr.dup-row td{background:rgba(242,169,60,.07)}.elements-sheet .sel{width:32px;text-align:center}.elements-sheet .mono{font-family:var(--mono)}
.sheet-dup-badge{display:inline-block;font-size:9.5px;border:1px solid var(--yellow);color:var(--yellow);border-radius:20px;padding:2px 6px;margin-right:4px}.sheet-actions{display:flex;gap:4px;flex-wrap:wrap}.sheet-actions .btn{padding:4px 7px;font-size:10.5px}
@media(max-width:760px){.sync-conflict-row{grid-template-columns:28px 1fr;}.sync-conflict-row .sync-choice{grid-column:2}.sheet-toolbar input{min-width:150px;width:100%}}
