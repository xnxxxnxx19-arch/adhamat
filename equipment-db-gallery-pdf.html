/* ===== تبويب الرسم (منقول من نظام الرسم في workshop) ===== */
function nbResizeDrawCanvas(canvas, dstate){
  if(!canvas || !dstate) return;
  const rect=canvas.parentElement.getBoundingClientRect();
  const cssW=Math.max(280, rect.width);
  const cssH=dstate.cssHeight||340;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
  canvas.width=Math.round(cssW*dpr); canvas.height=Math.round(cssH*dpr);
  dstate.cssWidth=cssW; dstate.cssHeight=cssH; dstate.dpr=dpr;
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  dstate.redraw();
}
function nbShapeRefPoints(sh){
  if(sh.type==='freehand') return sh.points||[];
  if(sh.type==='text') return [{x:sh.x,y:sh.y}];
  if(sh.type==='curve') return [{x:sh.x1,y:sh.y1},{x:sh.x2,y:sh.y2},{x:sh.cx,y:sh.cy}];
  if('x1' in sh) return [{x:sh.x1,y:sh.y1},{x:sh.x2,y:sh.y2},{x:(sh.x1+sh.x2)/2,y:(sh.y1+sh.y2)/2}];
  return [];
}
function nbBuildLiveShape(tool,start,end,color,width,filled){
  const base={x1:start.x,y1:start.y,x2:end.x,y2:end.y,color,width,filled:!!filled};
  if(tool==='dotted') return Object.assign({type:'line',dashed:true}, base);
  if(tool==='arrow') return Object.assign({type:'arrow'}, base);
  if(tool==='curve'){
    const mx=(start.x+end.x)/2, my=(start.y+end.y)/2;
    const dx=end.x-start.x, dy=end.y-start.y;
    const len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;
    const bulge=Math.min(len*0.35,60);
    return Object.assign({type:'curve',cx:mx+nx*bulge,cy:my+ny*bulge}, base);
  }
  if(tool==='zigzag') return Object.assign({type:'zigzag'}, base);
  if(tool==='rect') return Object.assign({type:'rect'}, base);
  if(tool==='triangle') return Object.assign({type:'triangle'}, base);
  if(tool==='circle') return Object.assign({type:'circle'}, base);
  return Object.assign({type:'line'}, base);
}
function nbDrawShape(ctx, sh){
  ctx.save();
  ctx.strokeStyle=sh.color||'#1e2519'; ctx.fillStyle=sh.color||'#1e2519';
  ctx.lineWidth=sh.width||2; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.setLineDash(sh.dashed?[(sh.width||2)*2+4,(sh.width||2)*2+4]:[]);
  if(sh.type==='freehand'){
    if(!sh.points||sh.points.length<2){ ctx.restore(); return; }
    ctx.beginPath(); ctx.moveTo(sh.points[0].x, sh.points[0].y);
    for(let i=1;i<sh.points.length;i++) ctx.lineTo(sh.points[i].x, sh.points[i].y);
    ctx.stroke();
  } else if(sh.type==='line'){
    ctx.beginPath(); ctx.moveTo(sh.x1,sh.y1); ctx.lineTo(sh.x2,sh.y2); ctx.stroke();
  } else if(sh.type==='arrow'){
    ctx.beginPath(); ctx.moveTo(sh.x1,sh.y1); ctx.lineTo(sh.x2,sh.y2); ctx.stroke();
    const angle=Math.atan2(sh.y2-sh.y1, sh.x2-sh.x1);
    const headLen=8+(sh.width||2)*2.2;
    ctx.beginPath(); ctx.moveTo(sh.x2,sh.y2);
    ctx.lineTo(sh.x2-headLen*Math.cos(angle-Math.PI/7), sh.y2-headLen*Math.sin(angle-Math.PI/7));
    ctx.lineTo(sh.x2-headLen*Math.cos(angle+Math.PI/7), sh.y2-headLen*Math.sin(angle+Math.PI/7));
    ctx.closePath(); ctx.fill();
  } else if(sh.type==='curve'){
    ctx.beginPath(); ctx.moveTo(sh.x1,sh.y1); ctx.quadraticCurveTo(sh.cx,sh.cy,sh.x2,sh.y2); ctx.stroke();
  } else if(sh.type==='zigzag'){
    const segs=8; const dx=(sh.x2-sh.x1)/segs, dy=(sh.y2-sh.y1)/segs;
    const len=Math.hypot(sh.x2-sh.x1, sh.y2-sh.y1)||1;
    const nx=-(sh.y2-sh.y1)/len, ny=(sh.x2-sh.x1)/len; const amp=10;
    ctx.beginPath(); ctx.moveTo(sh.x1,sh.y1);
    for(let i=1;i<segs;i++){ const sign=(i%2===0)?1:-1; ctx.lineTo(sh.x1+dx*i+nx*amp*sign, sh.y1+dy*i+ny*amp*sign); }
    ctx.lineTo(sh.x2,sh.y2); ctx.stroke();
  } else if(sh.type==='rect'){
    const x=Math.min(sh.x1,sh.x2), y=Math.min(sh.y1,sh.y2), w=Math.abs(sh.x2-sh.x1), h=Math.abs(sh.y2-sh.y1);
    if(sh.filled) ctx.fillRect(x,y,w,h); else ctx.strokeRect(x,y,w,h);
  } else if(sh.type==='triangle'){
    const x1=Math.min(sh.x1,sh.x2), x2=Math.max(sh.x1,sh.x2), y1=Math.min(sh.y1,sh.y2), y2=Math.max(sh.y1,sh.y2);
    ctx.beginPath(); ctx.moveTo((x1+x2)/2,y1); ctx.lineTo(x1,y2); ctx.lineTo(x2,y2); ctx.closePath();
    if(sh.filled) ctx.fill(); else ctx.stroke();
  } else if(sh.type==='circle'){
    const cx=(sh.x1+sh.x2)/2, cy=(sh.y1+sh.y2)/2, rx=Math.abs(sh.x2-sh.x1)/2, ry=Math.abs(sh.y2-sh.y1)/2;
    ctx.beginPath(); ctx.ellipse(cx,cy,rx||1,ry||1,0,0,Math.PI*2);
    if(sh.filled) ctx.fill(); else ctx.stroke();
  } else if(sh.type==='text'){
    ctx.font=(sh.fontSize||16)+'px Tahoma, Arial, sans-serif'; ctx.textBaseline='top'; ctx.fillText(sh.text, sh.x, sh.y);
  }
  ctx.restore();
}
function nbBuildDrawingPanel(section, item){
  if(!section.drawing) section.drawing={shapes:[]};
  const wrap=document.createElement('div');
  wrap.className='drawpanel';
  wrap.innerHTML = `
    <div class="draw-toolbar">
      <select class="draw-tool" title="الأداة">
        <option value="pen">✏️ رسم حر</option>
        <option value="line">📏 خط مستقيم</option>
        <option value="arrow">➡️ سهم</option>
        <option value="dotted">┄ خط منقط</option>
        <option value="curve">〰️ خط منحني</option>
        <option value="zigzag">⚡ خط متعرج</option>
        <option value="rect">▭ مستطيل</option>
        <option value="triangle">▲ مثلث</option>
        <option value="circle">◯ دائرة / بيضاوي</option>
        <option value="text">🔤 نص</option>
        <option value="eraser">🧹 ممحاة</option>
      </select>
      <input type="color" class="draw-color" value="#1e2519" title="اللون">
      <input type="range" class="draw-width" min="1" max="14" value="2" title="سُمك الخط">
      <input type="number" class="draw-fontsize" min="8" max="60" value="16" title="حجم الخط (للنص)" style="width:52px;">
      <label class="fill-toggle" style="display:flex;align-items:center;gap:3px;font-size:11.5px;">
        <input type="checkbox" class="draw-fill"> تعبئة
      </label>
      <button type="button" class="btn small draw-undo" title="تراجع عن آخر شكل">↩️ تراجع</button>
      <button type="button" class="btn small danger draw-clear" title="مسح كل الرسم">🗑 مسح الكل</button>
    </div>
    <div class="draw-canvas-wrap"><canvas class="draw-canvas"></canvas></div>
  `;
  const canvas=wrap.querySelector('.draw-canvas');
  const canvasWrap=wrap.querySelector('.draw-canvas-wrap');
  const ctx=canvas.getContext('2d');
  const toolSel=wrap.querySelector('.draw-tool');
  const colorInput=wrap.querySelector('.draw-color');
  const widthInput=wrap.querySelector('.draw-width');
  const fontInput=wrap.querySelector('.draw-fontsize');
  const fillInput=wrap.querySelector('.draw-fill');
  const dstate={cssWidth:640, cssHeight:340, dpr:1, redraw};
  function redraw(){ ctx.clearRect(0,0,dstate.cssWidth,dstate.cssHeight); section.drawing.shapes.forEach(sh=>nbDrawShape(ctx,sh)); }
  if(window.ResizeObserver) new ResizeObserver(()=>nbResizeDrawCanvas(canvas,dstate)).observe(canvasWrap);
  requestAnimationFrame(()=>nbResizeDrawCanvas(canvas,dstate));

  let dragging=false, startPt=null, penPoints=null;
  function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches&&e.touches[0];
    const clientX=t?t.clientX:e.clientX, clientY=t?t.clientY:e.clientY;
    return { x:(clientX-rect.left)*(dstate.cssWidth/rect.width), y:(clientY-rect.top)*(dstate.cssHeight/rect.height) };
  }
  function commitShape(shape){ section.drawing.shapes.push(shape); nbScheduleSave(item); redraw(); }
  function askInlineText(pos, onDone){
    const input=document.createElement('input');
    input.type='text'; input.placeholder='اكتب النص واضغط Enter…';
    const r=canvas.getBoundingClientRect();
    input.style.cssText=`position:absolute;left:${pos.x*(r.width/dstate.cssWidth)}px;top:${pos.y*(r.height/dstate.cssHeight)}px;z-index:5;font-size:13px;padding:3px 6px;border:1.5px solid var(--amber);border-radius:5px;min-width:120px;`;
    canvasWrap.style.position='relative';
    canvasWrap.appendChild(input); input.focus();
    function finish(commit){ const val=input.value.trim(); input.remove(); if(commit&&val) onDone(val); }
    input.addEventListener('keydown',(e)=>{ if(e.key==='Enter') finish(true); if(e.key==='Escape') finish(false); });
    input.addEventListener('blur',()=>finish(true));
  }
  function eraseNear(pos){
    let bestIdx=-1, bestDist=26;
    section.drawing.shapes.forEach((sh,i)=>{
      nbShapeRefPoints(sh).forEach(p=>{ const d=Math.hypot(p.x-pos.x,p.y-pos.y); if(d<bestDist){ bestDist=d; bestIdx=i; } });
    });
    if(bestIdx!==-1){ section.drawing.shapes.splice(bestIdx,1); nbScheduleSave(item); redraw(); }
  }
  function startDraw(e){
    e.preventDefault();
    const tool=toolSel.value, pos=getPos(e);
    if(tool==='text'){ askInlineText(pos,(txt)=>commitShape({type:'text',x:pos.x,y:pos.y,text:txt,color:colorInput.value,fontSize:parseInt(fontInput.value,10)||16})); return; }
    if(tool==='eraser'){ dragging=true; eraseNear(pos); return; }
    dragging=true; startPt=pos;
    if(tool==='pen') penPoints=[pos];
  }
  function moveDraw(e){
    if(!dragging) return;
    e.preventDefault();
    const tool=toolSel.value, pos=getPos(e), width=parseInt(widthInput.value,10)||2;
    if(tool==='eraser'){ eraseNear(pos); return; }
    redraw();
    if(tool==='pen'){ penPoints.push(pos); nbDrawShape(ctx,{type:'freehand',points:penPoints,color:colorInput.value,width}); }
    else nbDrawShape(ctx, nbBuildLiveShape(tool,startPt,pos,colorInput.value,width,fillInput.checked));
  }
  function endDraw(e){
    if(!dragging) return;
    dragging=false;
    const tool=toolSel.value;
    if(tool==='eraser') return;
    const width=parseInt(widthInput.value,10)||2;
    const t=e.changedTouches&&e.changedTouches[0];
    const pos=getPos(t?{clientX:t.clientX,clientY:t.clientY}:e);
    if(tool==='pen'){
      if(penPoints&&penPoints.length>1) commitShape({type:'freehand',points:penPoints,color:colorInput.value,width});
      else redraw();
      penPoints=null;
    } else {
      const shape=nbBuildLiveShape(tool,startPt,pos,colorInput.value,width,fillInput.checked);
      if(Math.abs(shape.x2-shape.x1)>2 || Math.abs(shape.y2-shape.y1)>2) commitShape(shape);
      else redraw();
    }
    startPt=null;
  }
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  window.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', startDraw, {passive:false});
  canvas.addEventListener('touchmove', moveDraw, {passive:false});
  canvas.addEventListener('touchend', endDraw);
  wrap.querySelector('.draw-undo').onclick=()=>{ section.drawing.shapes.pop(); nbScheduleSave(item); redraw(); };
  wrap.querySelector('.draw-clear').onclick=(e)=>{
    if(!section.drawing.shapes.length) return;
    if(!nbArmConfirm(e.currentTarget,'اضغط تاني لمسح كل الرسم')) return;
    section.drawing.shapes=[]; nbScheduleSave(item); redraw();
    toast('تم مسح الرسم','ok');
  };
  return wrap;
}
function nbDrawTab(body, s, item){

}

/* ===== تبويب الخريطة الذهنية (نسخة مبسّطة شجرية بدل اللوحة الحرة الكاملة) ===== */
function nbBuildMindMapPanel(s, item){
  const mm = ensureMindmapData(s);
  const wrap=document.createElement('div');
  wrap.className='nb-mindmap';
  wrap.tabIndex=0;
  wrap.innerHTML = `
    <div class="mm-toolbar">
      <button type="button" class="btn small" data-act="add-child" title="Tab">➕ تابع</button>
      <button type="button" class="btn small" data-act="add-sibling" title="Enter">➕ شقيق</button>
      <button type="button" class="btn small" data-act="add-parent">➕ أب</button>
      <button type="button" class="btn small" data-act="dup">⧉ تكرار</button>
      <button type="button" class="btn small danger" data-act="del" title="Delete">🗑 حذف</button>
      <button type="button" class="btn small" data-act="undo" title="Ctrl+Z">↩️</button>
      <button type="button" class="btn small" data-act="redo" title="Ctrl+Y">↪️</button>
      <button type="button" class="btn small" data-act="collapse-toggle">⊟ طيّ الفرع</button>
      <button type="button" class="btn small" data-act="zoom-in">🔍+</button>
      <button type="button" class="btn small" data-act="zoom-out">🔍−</button>
      <button type="button" class="btn small" data-act="zoom-reset">⤢ ملائمة</button>
    </div>
    <div class="mm-props" style="display:none;"></div>
    <div class="mm-stage-wrap"><svg></svg></div>
    <div class="mm-status"></div>
  `;
  const propsBar=wrap.querySelector('.mm-props');
  const stageWrap=wrap.querySelector('.mm-stage-wrap');
  const svg=wrap.querySelector('svg');
  const statusEl=wrap.querySelector('.mm-status');

  const st = { scale:1, tx:0, ty:0, selectedIds:new Set([mm.rootId]), history:[], future:[] };

  function childrenOf(id){ return Object.values(mm.nodes).filter(n=>n.parentId===id).sort((a,b)=>a.orderIndex-b.orderIndex); }
  function descendantsOf(id){ const out=[]; childrenOf(id).forEach(c=>{ out.push(c.id); out.push(...descendantsOf(c.id)); }); return out; }
  function isCollapsedAncestor(id){ let n=mm.nodes[id]; while(n && n.parentId){ n=mm.nodes[n.parentId]; if(n && n.collapsed) return true; } return false; }
  function snapshot(){ return JSON.stringify(mm); }
  function pushHistory(){ st.history.push(snapshot()); if(st.history.length>60) st.history.shift(); st.future=[]; nbScheduleSave(item); }
  function undo(){
    if(!st.history.length){ toast('مفيش خطوات للتراجع','err'); return; }
    st.future.push(snapshot());
    Object.assign(mm, JSON.parse(st.history.pop()));
    normalizeSelection(); nbScheduleSave(item); render();
  }
  function redo(){
    if(!st.future.length){ toast('مفيش خطوات لإعادتها','err'); return; }
    st.history.push(snapshot());
    Object.assign(mm, JSON.parse(st.future.pop()));
    normalizeSelection(); nbScheduleSave(item); render();
  }
  function normalizeSelection(){
    st.selectedIds.forEach(id=>{ if(!mm.nodes[id]) st.selectedIds.delete(id); });
    if(!st.selectedIds.size) st.selectedIds.add(mm.rootId);
  }
  function makeNode(text, parentId){
    const id='m'+Math.random().toString(36).slice(2,9);
    const sibs = parentId ? childrenOf(parentId) : [];
    const orderIndex = sibs.length ? Math.max(...sibs.map(x=>x.orderIndex))+1 : 0;
    const parent = parentId ? mm.nodes[parentId] : null;
    return { id, text, parentId, x: parent? parent.x-190 : 0, y: parent? parent.y+sibs.length*60 : 0, color: MM_COLORS[Object.keys(mm.nodes).length % MM_COLORS.length], collapsed:false, orderIndex };
  }
  function selectedSingle(){ const ids=[...st.selectedIds]; return ids.length? mm.nodes[ids[ids.length-1]] : mm.nodes[mm.rootId]; }
  function addChild(){ pushHistory(); const p=selectedSingle(); const node=makeNode('فكرة جديدة', p.id); mm.nodes[node.id]=node; st.selectedIds=new Set([node.id]); nbScheduleSave(item); render(); startEdit(node.id); }
  function addSibling(){ const cur=selectedSingle(); if(cur.id===mm.rootId){ addChild(); return; } pushHistory(); const node=makeNode('فكرة جديدة', cur.parentId); mm.nodes[node.id]=node; st.selectedIds=new Set([node.id]); nbScheduleSave(item); render(); startEdit(node.id); }
  function addParent(){
    pushHistory();
    const cur=selectedSingle(); const oldParentId=cur.parentId;
    const node=makeNode('فكرة جديدة', oldParentId);
    node.x=cur.x+190; node.y=cur.y;
    mm.nodes[node.id]=node; cur.parentId=node.id;
    if(cur.id===mm.rootId) mm.rootId=node.id;
    st.selectedIds=new Set([node.id]); nbScheduleSave(item); render(); startEdit(node.id);
  }
  function duplicateSelected(){
    pushHistory();
    const cur=selectedSingle();
    function cloneSub(id, newParentId){
      const src=mm.nodes[id]; const nid='m'+Math.random().toString(36).slice(2,9);
      mm.nodes[nid]=Object.assign({}, src, {id:nid, parentId:newParentId});
      childrenOf(id).forEach(c=>cloneSub(c.id, nid));
      return nid;
    }
    const sibs=childrenOf(cur.parentId||null);
    const newId=cloneSub(cur.id, cur.parentId);
    mm.nodes[newId].orderIndex=(sibs.length? Math.max(...sibs.map(x=>x.orderIndex)) : 0)+1;
    mm.nodes[newId].x+=24; mm.nodes[newId].y+=24;
    st.selectedIds=new Set([newId]); nbScheduleSave(item); render();
    toast('تم تكرار العقدة وفروعها','ok');
  }
  function deleteSelected(){
    const ids=[...st.selectedIds].filter(id=>id!==mm.rootId);
    if(!ids.length){ toast('لا يمكن حذف العقدة الجذر','err'); return; }
    pushHistory();
    ids.forEach(id=>{ descendantsOf(id).forEach(d=>delete mm.nodes[d]); delete mm.nodes[id]; });
    st.selectedIds=new Set([mm.rootId]); nbScheduleSave(item); render();
  }
  function toggleCollapse(id){ pushHistory(); mm.nodes[id].collapsed=!mm.nodes[id].collapsed; nbScheduleSave(item); render(); }

  function applyTransform(){ gLines.setAttribute('transform', `translate(${st.tx},${st.ty}) scale(${st.scale})`); gNodes.setAttribute('transform', `translate(${st.tx},${st.ty}) scale(${st.scale})`); }
  function zoomAt(sx, sy, newScale){
    newScale=Math.max(0.25, Math.min(3, newScale));
    const wx=(sx-st.tx)/st.scale, wy=(sy-st.ty)/st.scale;
    st.scale=newScale; st.tx=sx-wx*newScale; st.ty=sy-wy*newScale;
    applyTransform();
  }
  function fitToScreen(){
    const nodes=Object.values(mm.nodes);
    if(!nodes.length) return;
    const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
    const minX=Math.min(...xs)-MM_BASE_W, maxX=Math.max(...xs)+MM_BASE_W;
    const minY=Math.min(...ys)-MM_BASE_H, maxY=Math.max(...ys)+MM_BASE_H;
    const rect=stageWrap.getBoundingClientRect();
    const w=Math.max(1,rect.width), h=Math.max(1,rect.height);
    const scale=Math.max(0.3, Math.min(1.6, Math.min(w/(maxX-minX||1), h/(maxY-minY||1))*0.92));
    st.scale=scale; st.tx=w/2-(minX+maxX)/2*scale; st.ty=h/2-(minY+maxY)/2*scale;
    applyTransform();
  }

  svg.innerHTML='';
  const gLines=svgEl('g'), gNodes=svgEl('g');
  svg.appendChild(gLines); svg.appendChild(gNodes);

  function renderStage(){
    gLines.innerHTML=''; gNodes.innerHTML='';
    nodeEls={}; lineEls={}; collapseEls={};
    const visible=Object.values(mm.nodes).filter(n=>!isCollapsedAncestor(n.id));
    visible.forEach(n=>{
      if(!n.parentId) return;
      const p=mm.nodes[n.parentId];
      if(!p || isCollapsedAncestor(p.id)) return;
      const mx=(p.x+n.x)/2;
      const pathEl=svgEl('path',{ d:`M ${p.x} ${p.y} C ${mx} ${p.y}, ${mx} ${n.y}, ${n.x} ${n.y}`, stroke:'var(--border-lt)', 'stroke-width':2, fill:'none' });
      lineEls[n.id]=pathEl;
      gLines.appendChild(pathEl);
    });
    visible.forEach(n=>{
      const w=MM_BASE_W, h=MM_BASE_H;
      const fo=svgEl('foreignObject',{x:n.x-w/2, y:n.y-h/2, width:w, height:h, style:'overflow:visible;'});
      const div=document.createElement('div');
      div.className='mm-node-box'+(st.selectedIds.has(n.id)?' mm-selected':'');
      div.style.borderColor=n.color; div.style.color=n.color;
      div.textContent=n.text; div.dataset.id=n.id; div.setAttribute('spellcheck','false');
      fo.appendChild(div); gNodes.appendChild(fo);
      nodeEls[n.id]={fo, div};
      div.addEventListener('mousedown',(e)=>onNodeDown(e,n.id));
      div.addEventListener('touchstart',(e)=>onNodeDown(e,n.id),{passive:false});
      div.addEventListener('dblclick',(e)=>{ e.stopPropagation(); startEdit(n.id); });
      div.addEventListener('blur',()=>commitEdit(n.id, div));
      div.addEventListener('keydown',(e)=>{ if(e.key==='Enter' && div.isContentEditable){ e.preventDefault(); div.blur(); } e.stopPropagation(); });
      const kids=childrenOf(n.id);
      if(kids.length){
        const btn=svgEl('foreignObject',{x:n.x-w/2-18, y:n.y-9, width:18, height:18});
        const b=document.createElement('div');
        b.className='mm-collapse-btn'; b.textContent=n.collapsed?'+':'−';
        b.addEventListener('mousedown',(e)=>e.stopPropagation());
        b.addEventListener('click',(e)=>{ e.stopPropagation(); toggleCollapse(n.id); });
        btn.appendChild(b); gNodes.appendChild(btn);
        collapseEls[n.id]=btn;
      }
    });
    applyTransform();
    statusEl.textContent = Object.keys(mm.nodes).length+' عقدة'+(st.selectedIds.size>1?' — محدد: '+st.selectedIds.size:'');
  }
  function updateNodePositions(ids){
    const w=MM_BASE_W, h=MM_BASE_H;
    ids.forEach(id=>{
      const n=mm.nodes[id]; if(!n) return;
      const ref=nodeEls[id];
      if(ref){ ref.fo.setAttribute('x', n.x-w/2); ref.fo.setAttribute('y', n.y-h/2); }
      const btn=collapseEls[id];
      if(btn){ btn.setAttribute('x', n.x-w/2-18); btn.setAttribute('y', n.y-9); }
      const ownLine=lineEls[id];
      if(ownLine && n.parentId){
        const p=mm.nodes[n.parentId]; const mx=(p.x+n.x)/2;
        ownLine.setAttribute('d', `M ${p.x} ${p.y} C ${mx} ${p.y}, ${mx} ${n.y}, ${n.x} ${n.y}`);
      }
      childrenOf(id).forEach(child=>{
        const cl=lineEls[child.id];
        if(cl){ const mx=(n.x+child.x)/2; cl.setAttribute('d', `M ${n.x} ${n.y} C ${mx} ${n.y}, ${mx} ${child.y}, ${child.x} ${child.y}`); }
      });
    });
  }
  function render(){ renderStage(); renderProps(); }
  function renderProps(){
    if(st.selectedIds.size!==1){ propsBar.style.display='none'; return; }
    const n=mm.nodes[[...st.selectedIds][0]];
    if(!n){ propsBar.style.display='none'; return; }
    propsBar.style.display='flex';
    propsBar.innerHTML = `
      <input type="text" class="mm-name-input" value="${esc(n.text)}" placeholder="اسم العقدة">
      <span class="mm-props-label">اللون:</span>
      ` + MM_COLORS.map(c=>`<button type="button" class="mm-color-swatch" data-color="${c}" style="background:${c};border-color:${n.color===c?'#fff':'transparent'}"></button>`).join('') + `<input type="color" class="mm-custom-color" value="${n.color}" title="لون مخصص">`;
    const nameInput=propsBar.querySelector('.mm-name-input');
    nameInput.addEventListener('input', ()=>{ n.text=nameInput.value; nbScheduleSave(item); const ref=nodeEls[n.id]; if(ref) ref.div.textContent=n.text; });
    nameInput.addEventListener('keydown',(e)=> e.stopPropagation());
    propsBar.querySelectorAll('[data-color]').forEach(btn=> btn.onclick=()=>{ pushHistory(); n.color=btn.dataset.color; nbScheduleSave(item); render(); });
    propsBar.querySelector('.mm-custom-color').oninput=(e)=>{ n.color=e.target.value; nbScheduleSave(item); const ref=nodeEls[n.id]; if(ref){ ref.div.style.borderColor=n.color; ref.div.style.color=n.color; } };
  }
  function startEdit(id){
    render();
    requestAnimationFrame(()=>{
      const div=gNodes.querySelector(`[data-id="${id}"]`);
      if(!div) return;
      pushHistory();
      div.contentEditable='true'; div.focus();
      document.execCommand && document.execCommand('selectAll', false, null);
    });
  }
  function commitEdit(id, div){
    if(div.isContentEditable){
      div.contentEditable='false';
      const val=div.textContent.trim()||'بدون عنوان';
      if(mm.nodes[id]) mm.nodes[id].text=val;
      nbScheduleSave(item);
      renderProps();
    }
  }

  let nodeEls={}, lineEls={}, collapseEls={};
  let dragMode=null, dragStart=null, dragOrigins=null, dragDistance=0, clickToEditId=null;
  function onNodeDown(e,id){
    const div=e.currentTarget;
    if(div.isContentEditable){ e.stopPropagation(); return; }
    e.stopPropagation(); e.preventDefault();
    wrap.focus();
    const additive=e.shiftKey||e.ctrlKey||e.metaKey;
    const wasSoleSelected=!additive && st.selectedIds.size===1 && st.selectedIds.has(id);
    let selectionChanged=false;
    if(additive){ if(st.selectedIds.has(id)) st.selectedIds.delete(id); else st.selectedIds.add(id); selectionChanged=true; }
    else if(!st.selectedIds.has(id)){ st.selectedIds=new Set([id]); selectionChanged=true; }
    if(selectionChanged) render(); else renderProps();
    dragMode='node'; dragDistance=0; clickToEditId = wasSoleSelected? id : null;
    const t=e.touches? e.touches[0] : e;
    dragStart={x:t.clientX, y:t.clientY};
    dragOrigins={};
    st.selectedIds.forEach(sid=>{ const n=mm.nodes[sid]; dragOrigins[sid]={x:n.x,y:n.y}; });
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragEnd);
    window.addEventListener('touchmove', onDragMove, {passive:false});
    window.addEventListener('touchend', onDragEnd);
  }
  function onStageDown(e){
    if(e.target.closest('.mm-node-box') || e.target.closest('.mm-collapse-btn')) return;
    wrap.focus();
    dragMode='pan'; svg.classList.add('panning');
    const t=e.touches? e.touches[0] : e;
    dragStart={x:t.clientX, y:t.clientY, tx:st.tx, ty:st.ty};
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragEnd);
    window.addEventListener('touchmove', onDragMove, {passive:false});
    window.addEventListener('touchend', onDragEnd);
  }
  function onDragMove(e){
    if(!dragMode) return;
    if(e.cancelable) e.preventDefault();
    const t=e.touches? e.touches[0] : e;
    const dx=t.clientX-dragStart.x, dy=t.clientY-dragStart.y;
    dragDistance=Math.max(dragDistance, Math.hypot(dx,dy));
    if(dragMode==='pan'){ st.tx=dragStart.tx+dx; st.ty=dragStart.ty+dy; applyTransform(); }
    else if(dragMode==='node'){
      const wdx=dx/st.scale, wdy=dy/st.scale;
      const movedIds=[];
      st.selectedIds.forEach(id=>{ const n=mm.nodes[id]; const o=dragOrigins[id]; if(n&&o){ n.x=o.x+wdx; n.y=o.y+wdy; movedIds.push(id); } });
      updateNodePositions(movedIds);
    }
  }
  function onDragEnd(){
    const wasNodeDrag=dragMode==='node', editId=clickToEditId, moved=dragDistance;
    dragMode=null; svg.classList.remove('panning'); clickToEditId=null;
    window.removeEventListener('mousemove', onDragMove);
    window.removeEventListener('mouseup', onDragEnd);
    window.removeEventListener('touchmove', onDragMove);
    window.removeEventListener('touchend', onDragEnd);
    if(wasNodeDrag){
      nbScheduleSave(item);
      if(editId && moved<4) startEdit(editId);
    }
  }
  svg.addEventListener('mousedown', onStageDown);
  svg.addEventListener('touchstart', onStageDown, {passive:false});
  svg.addEventListener('wheel',(e)=>{ e.preventDefault(); const rect=svg.getBoundingClientRect(); zoomAt(e.clientX-rect.left, e.clientY-rect.top, st.scale*(e.deltaY<0?1.12:0.89)); }, {passive:false});

  wrap.addEventListener('keydown',(e)=>{
    const editing = document.activeElement && document.activeElement.isContentEditable;
    if(e.key==='Tab' && !editing){ e.preventDefault(); addChild(); }
    else if(e.key==='Enter' && !editing){ e.preventDefault(); addSibling(); }
    else if(e.key==='F2'){ e.preventDefault(); startEdit(selectedSingle().id); }
    else if(e.key==='Delete' && !editing){ e.preventDefault(); deleteSelected(); }
    else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
    else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
  });

  wrap.querySelector('[data-act="add-child"]').onclick=addChild;
  wrap.querySelector('[data-act="add-sibling"]').onclick=addSibling;
  wrap.querySelector('[data-act="add-parent"]').onclick=addParent;
  wrap.querySelector('[data-act="dup"]').onclick=duplicateSelected;
  wrap.querySelector('[data-act="del"]').onclick=deleteSelected;
  wrap.querySelector('[data-act="undo"]').onclick=undo;
  wrap.querySelector('[data-act="redo"]').onclick=redo;
  wrap.querySelector('[data-act="collapse-toggle"]').onclick=()=>toggleCollapse(selectedSingle().id);
  wrap.querySelector('[data-act="zoom-in"]').onclick=()=>{ const r=stageWrap.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, st.scale*1.2); };
  wrap.querySelector('[data-act="zoom-out"]').onclick=()=>{ const r=stageWrap.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, st.scale/1.2); };
  wrap.querySelector('[data-act="zoom-reset"]').onclick=fitToScreen;

  if(window.ResizeObserver) new ResizeObserver(()=>applyTransform()).observe(stageWrap);
  requestAnimationFrame(fitToScreen);
  render();
  return wrap;
}

const FT_LAYER_COLORS = ["#f2a93c","#4da3ff","#3ddc84","#ff5d5d","#c77dff","#ffb703","#2ec4b6","#e07be0"];
function nbFtHasContent(h){
  const c=h.content||{};

}
function nbFtCloseOnEsc(overlay, close){
  function onKey(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) close(); });
  return onKey;
}
function nbFtRenderContentReadonly(container, content){
  container.innerHTML='';

    const h=document.createElement('h3'); h.className='ft-view-title'; h.textContent=content.title;

  }

      document.body.style.overflow='hidden';

    /* منصة الصورة القابلة للتكبير — تملأ كل المساحة المتبقية */

    const MIN_ZOOM=0.4, MAX_ZOOM=8;
    let natW=0, natH=0, baseScale=1, zoomFactor=1, tx=0, ty=0;
    const zlevelEl=zoomCtrls.querySelector('.ft-zlevel');
    const ctx=canvas.getContext('2d');
    const redoStacks=new Map();
    function clearRedo(layerId){ redoStacks.delete(layerId); }

    function computeBaseScaleAndCenter(){
      const rect=viewport.getBoundingClientRect();
      if(!natW || !natH || !rect.width){ baseScale=1; }
      else{
        const fitScale=Math.min((rect.width*0.98)/natW, (rect.height*0.98)/natH);
        baseScale = isFullscreen ? Math.min(fitScale, MAX_ZOOM) : Math.min(fitScale, 1);
      }
      const dispW=natW*baseScale*zoomFactor, dispH=natH*baseScale*zoomFactor;
      tx=(rect.width-dispW)/2; ty=(rect.height-dispH)/2;
    }
    function applyTransform(){
      const scale=baseScale*zoomFactor;
      world.style.transform=`translate(${tx}px, ${ty}px) scale(${scale})`;
      zlevelEl.textContent=Math.round(zoomFactor*100)+'%';
    }
    function currentScale(){ return baseScale*zoomFactor; }
    function zoomBy(factor, clientX, clientY){
      const rect=viewport.getBoundingClientRect();
      const cx = clientX!=null ? clientX-rect.left : rect.width/2;
      const cy = clientY!=null ? clientY-rect.top : rect.height/2;
      const oldScale=currentScale();
      let newZoom=Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoomFactor*factor));
      const newScale=baseScale*newZoom;
      tx = cx - (cx-tx)*(newScale/oldScale);
      ty = cy - (cy-ty)*(newScale/oldScale);
      zoomFactor=newZoom;
      applyTransform();
    }
    zoomCtrls.querySelector('[data-act="zin"]').onclick=()=>zoomBy(1.35);
    zoomCtrls.querySelector('[data-act="zout"]').onclick=()=>zoomBy(1/1.35);
    zoomCtrls.querySelector('[data-act="zreset"]').onclick=()=>{ zoomFactor=1; computeBaseScaleAndCenter(); applyTransform(); };
    zoomCtrls.querySelector('[data-act="zfull"]').onclick=()=>{ isFullscreen=!isFullscreen; render(); };
    viewport.addEventListener('wheel',(e)=>{ e.preventDefault(); zoomBy(e.deltaY<0?1.15:1/1.15, e.clientX, e.clientY); }, {passive:false});

    function screenToNatural(clientX, clientY){
      const rect=world.getBoundingClientRect();
      const s=currentScale();
      return { x:(clientX-rect.left)/s, y:(clientY-rect.top)/s };
    }

    function updateDrawCursor(){
      viewport.style.cursor=selectMode?'default':(currentTool==='pan'?'grab':'crosshair');
      if(selectMode){ viewport.classList.add('ft-select-mode'); } else viewport.classList.remove('ft-select-mode');
    }
    function pointSegDist(px,py,ax,ay,bx,by){
      const dx=bx-ax, dy=by-ay; const l2=dx*dx+dy*dy;
      if(!l2) return Math.hypot(px-ax,py-ay);
      let t=((px-ax)*dx+(py-ay)*dy)/l2; t=Math.max(0,Math.min(1,t));
      return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
    }
    function shapeHitTest(sh,p,tol){
      if(sh.type==='text'){
        const fs=sh.fontSize||18, w=Math.max(22,(sh.text||'').length*fs*.62);
        return p.x>=sh.x-tol && p.x<=sh.x+w+tol && p.y>=sh.y-tol && p.y<=sh.y+fs*1.35+tol;
      }
      if(sh.type==='freehand'){
        const pts=sh.points||[]; for(let i=1;i<pts.length;i++) if(pointSegDist(p.x,p.y,pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y)<=tol) return true;
        return pts.some(q=>Math.hypot(p.x-q.x,p.y-q.y)<=tol);
      }
      if(sh.type==='curve'){
        let prev={x:sh.x1,y:sh.y1};
        for(let i=1;i<=24;i++){ const t=i/24, u=1-t; const q={x:u*u*sh.x1+2*u*t*sh.cx+t*t*sh.x2,y:u*u*sh.y1+2*u*t*sh.cy+t*t*sh.y2};
          if(pointSegDist(p.x,p.y,prev.x,prev.y,q.x,q.y)<=tol) return true; prev=q; } return false;
      }
      if('x1' in sh){
        if(sh.type==='line'||sh.type==='arrow'||sh.type==='zigzag'||sh.dashed) return pointSegDist(p.x,p.y,sh.x1,sh.y1,sh.x2,sh.y2)<=tol+4;
        const x1=Math.min(sh.x1,sh.x2),x2=Math.max(sh.x1,sh.x2),y1=Math.min(sh.y1,sh.y2),y2=Math.max(sh.y1,sh.y2);
        if(sh.type==='circle'){ const cx=(x1+x2)/2,cy=(y1+y2)/2,rx=Math.max(1,(x2-x1)/2),ry=Math.max(1,(y2-y1)/2); const v=((p.x-cx)/rx)**2+((p.y-cy)/ry)**2; return sh.filled ? v<=1+(tol/Math.max(rx,ry)) : Math.abs(Math.sqrt(v)-1)<=tol/Math.max(1,Math.min(rx,ry)); }
        return p.x>=x1-tol&&p.x<=x2+tol&&p.y>=y1-tol&&p.y<=y2+tol;
      }
      return false;
    }
    function findShapeAt(layer,pos){
      const tol=12/currentScale(); const arr=layer&&layer.content&&layer.content.drawing&&layer.content.drawing.shapes||[];
      for(let i=arr.length-1;i>=0;i--) if(shapeHitTest(arr[i],pos,tol)) return arr[i];
      return null;
    }
    function moveShape(sh,dx,dy){
      if(sh.type==='freehand'){ (sh.points||[]).forEach(p=>{p.x+=dx;p.y+=dy;}); return; }
      if(sh.type==='text'){ sh.x+=dx; sh.y+=dy; return; }
      if('x1' in sh){ sh.x1+=dx; sh.y1+=dy; sh.x2+=dx; sh.y2+=dy; if(sh.type==='curve'){ sh.cx+=dx; sh.cy+=dy; } }
    }
    function drawSelectionOverlay(sh){
      ctx.save(); ctx.strokeStyle='#4da3ff'; ctx.fillStyle='rgba(77,163,255,.12)'; ctx.lineWidth=Math.max(2,2/currentScale()); ctx.setLineDash([6/currentScale(),4/currentScale()]);
      if(sh.type==='freehand' && sh.points&&sh.points.length){ const xs=sh.points.map(p=>p.x),ys=sh.points.map(p=>p.y); ctx.strokeRect(Math.min(...xs)-5,currentScale()?Math.min(...ys)-5:0,Math.max(...xs)-Math.min(...xs)+10,Math.max(...ys)-Math.min(...ys)+10); }
      else if(sh.type==='text'){ const fs=sh.fontSize||18,w=Math.max(22,(sh.text||'').length*fs*.62); ctx.strokeRect(sh.x-4,sh.y-4,w+8,fs*1.35+8); }
      else if('x1' in sh){ const x=Math.min(sh.x1,sh.x2)-6,y=Math.min(sh.y1,sh.y2)-6,w=Math.abs(sh.x2-sh.x1)+12,h=Math.abs(sh.y2-sh.y1)+12; ctx.strokeRect(x,y,w,h); }
      ctx.restore();
    }

    /* في وضع العرض: الطبقات مخفية افتراضيًا، ولا يظهر رسم أو نص إلا للطبقة التي ضُغط عليها */
    function layerIsShown(h){
      if(h.visible===false) return false;
      if(mode==='view') return h.id===revealedLayerId;
      return true;
    }

    function redrawCanvas(){
      if(!natW || !natH) return;
      ctx.clearRect(0,0,natW,natH);
      page.hotspots.forEach(h=>{
        if(!layerIsShown(h)) return;
        (h.content.drawing.shapes||[]).forEach(sh=>{ if(sh.type!=='text') nbDrawShape(ctx,sh); if(selectMode&&selectedShapeRef&&selectedShapeRef.shape===sh&&selectedShapeRef.layerId===h.id) drawSelectionOverlay(sh); });
      });
    }

    function renderTextLabels(){
      textLayer.innerHTML='';
      page.hotspots.forEach(h=>{
        if(!layerIsShown(h)) return;
        (h.content.drawing.shapes||[]).forEach(sh=>{
          if(sh.type!=='text') return;
          const lbl=document.createElement('div');
          lbl.className='ft-text-label'+(mode==='edit'?' editable':'');
          lbl.textContent=sh.text;
          lbl.style.left=sh.x+'px'; lbl.style.top=sh.y+'px';
          lbl.style.color=sh.color||'#1e2519';
          lbl.style.fontSize=(sh.fontSize||18)+'px';
          if(mode==='edit'){
            const del=document.createElement('button'); del.type='button'; del.className='ft-text-del'; del.textContent='✕';
            del.onclick=(e)=>{
              e.stopPropagation();
              const shapes=h.content.drawing.shapes; const i=shapes.indexOf(sh);
              if(i!==-1) shapes.splice(i,1);
              clearRedo(h.id); nbScheduleSave(item); renderTextLabels();
            };
            lbl.appendChild(del);
            lbl.addEventListener('pointerdown',(e)=>{
              if(e.target===del) return;

              selectedShapeRef={layerId:h.id,shape:sh};
              textLayer.querySelectorAll('.ft-text-label.selected').forEach(x=>x.classList.remove('selected'));
              lbl.classList.add('selected');
              redrawCanvas();
              lbl.setPointerCapture(e.pointerId);
              const startX=e.clientX, startY=e.clientY, ox=sh.x, oy=sh.y, sc=currentScale();
              let moved=false;
              function onMove(ev){
                moved=true;
                sh.x=ox+(ev.clientX-startX)/sc; sh.y=oy+(ev.clientY-startY)/sc;
                lbl.style.left=sh.x+'px'; lbl.style.top=sh.y+'px';
              }
              function onUp(){
                lbl.removeEventListener('pointermove', onMove);
                lbl.removeEventListener('pointerup', onUp);
                if(moved) nbScheduleSave(item);
              }
              lbl.addEventListener('pointermove', onMove);
              lbl.addEventListener('pointerup', onUp);
            });
            if(selectMode && selectedShapeRef && selectedShapeRef.shape===sh) lbl.classList.add('selected');
          }
          textLayer.appendChild(lbl);
        });
      });
    }

    function renderLayersBar(){
      layersBar.innerHTML='';
      page.hotspots.forEach((h,idx)=>{
        const chip=document.createElement('div');
        chip.className='ft-layer-chip'+(h.id===activeLayerId?' active':'')+(h.visible===false?' hidden-layer':'');

        chip.append(sw,nm);
        if(mode==='edit'){

          eyeBtn.onclick=(e)=>{ e.stopPropagation(); h.visible=h.visible===false; nbScheduleSave(item); redrawCanvas(); renderTextLabels(); renderMarkers(); renderLayersBar(); };
          const editBtnL=document.createElement('button'); editBtnL.type='button'; editBtnL.className='ft-layer-btn'; editBtnL.textContent='✏️'; editBtnL.title='خصائص الطبقة';
          editBtnL.onclick=(e)=>{ e.stopPropagation(); nbFtOpenEditor(h, item, ()=>{ renderMarkers(); renderLayersBar(); }); };
          const delBtnL=document.createElement('button'); delBtnL.type='button'; delBtnL.className='ft-layer-btn danger'; delBtnL.textContent='🗑'; delBtnL.title='حذف الطبقة';
          delBtnL.onclick=(e)=>{
            e.stopPropagation();
            if(!nbArmConfirm(e.currentTarget,'تأكيد؟')) return;

            if(activeLayerId===h.id) activeLayerId = page.hotspots[0]?page.hotspots[0].id:null;

      if(mode==='edit'){
        const addBtn=document.createElement('button'); addBtn.type='button'; addBtn.className='btn small ft-layer-add'; addBtn.textContent='＋ طبقة جديدة';
        addBtn.onclick=()=>{
          const rect=viewport.getBoundingClientRect();
          const c=screenToNatural(rect.left+rect.width/2, rect.top+rect.height/2);
          const w=Math.min(0.07, natW?60/natW:0.07), h=Math.min(0.07, natH?60/natH:0.07);
          const nh={ id:uid('fths'), name:'طبقة '+(page.hotspots.length+1), x:Math.min(Math.max((c.x/natW)-w/2,0),1-w), y:Math.min(Math.max((c.y/natH)-h/2,0),1-h), w, h, shape:'circle', color:FT_LAYER_COLORS[page.hotspots.length % FT_LAYER_COLORS.length], visible:true, content:{title:'',note:'',images:[],drawing:{shapes:[]}} };
          page.hotspots.push(nh);
          activeLayerId=nh.id;
          nbScheduleSave(item); renderMarkers(); renderLayersBar();
        };
        layersBar.appendChild(addBtn);
      }
    }

    function renderMarkers(){
      markersLayer.innerHTML='';
      page.hotspots.forEach(h=>{
        if(h.visible===false && mode==='view') return;
        const el=document.createElement('div');
        el.className='ft-marker'+(h.shape==='rect'?' shape-rect':' shape-circle')+(mode==='edit'?' mode-edit':' mode-view')+(mode==='edit'&&h.id===activeLayerId?' active-layer':'')+(mode==='view'&&h.id===revealedLayerId?' revealed':'')+(nbFtHasContent(h)?' has-content':'');
        el.style.left=(h.x*natW)+'px'; el.style.top=(h.y*natH)+'px'; el.style.width=(h.w*natW)+'px'; el.style.height=(h.h*natH)+'px';
        el.style.setProperty('--ft-color', h.color||'#f2a93c');
        if(h.visible===false) el.style.opacity='.35';
        if(mode==='view'){
          const dot=document.createElement('div'); dot.className='ft-marker-dot'+(nbFtHasContent(h)?'':' empty');
          el.appendChild(dot);
          if(nbFtHasContent(h)) el.title = h.content.title || h.name || 'اضغط لإظهار محتوى هذه النقطة';
          el.addEventListener('click',(e)=>{
            e.stopPropagation();
            if(panDragMoved || !nbFtHasContent(h)) return;
            revealedLayerId = (revealedLayerId===h.id) ? null : h.id;
            redrawCanvas(); renderTextLabels(); renderMarkers();
          });
        } else {
          el.title = h.name || 'طبقة';
          const handle=document.createElement('div'); handle.className='ft-marker-handle';
          el.appendChild(handle);
          const delBtn=document.createElement('button'); delBtn.type='button'; delBtn.className='ft-marker-del'; delBtn.textContent='✕';
          delBtn.onclick=(e)=>{ e.stopPropagation(); const i=page.hotspots.indexOf(h); if(i!==-1) page.hotspots.splice(i,1); if(activeLayerId===h.id) activeLayerId=page.hotspots[0]?page.hotspots[0].id:null; clearRedo(h.id); nbScheduleSave(item); redrawCanvas(); renderTextLabels(); renderMarkers(); renderLayersBar(); };
          el.appendChild(delBtn);

          /* نقطة اللمس (الطبقة) قابلة لتغيير موقعها دائمًا في وضع التحرير بالسحب */
          el.addEventListener('pointerdown',(e)=>{
            if(e.target===handle || e.target===delBtn) return;
            e.stopPropagation(); e.preventDefault();
            activeLayerId=h.id; renderLayersBar();
            markersLayer.querySelectorAll('.ft-marker.mode-edit').forEach(x=>x.classList.remove('active-layer'));
            el.classList.add('active-layer');
            el.setPointerCapture(e.pointerId);
            const startX=e.clientX, startY=e.clientY, ox=h.x, oy=h.y, s=currentScale();
            let moved=false;
            function onMove(ev){
              moved=true;
              const dx=(ev.clientX-startX)/s/natW, dy=(ev.clientY-startY)/s/natH;
              h.x=Math.min(Math.max(ox+dx,0), Math.max(0,1-h.w));
              h.y=Math.min(Math.max(oy+dy,0), Math.max(0,1-h.h));
              el.style.left=(h.x*natW)+'px'; el.style.top=(h.y*natH)+'px';
            }
            function onUp(){
              el.removeEventListener('pointermove', onMove);
              el.removeEventListener('pointerup', onUp);
              if(moved) nbScheduleSave(item);
            }
            el.addEventListener('pointermove', onMove);
            el.addEventListener('pointerup', onUp);
          });
          handle.addEventListener('pointerdown',(e)=>{
            e.stopPropagation(); e.preventDefault();
            handle.setPointerCapture(e.pointerId);
            const startX=e.clientX, startY=e.clientY, ow=h.w, oh=h.h, s=currentScale();
            function onMove(ev){
              const dx=(ev.clientX-startX)/s/natW, dy=(ev.clientY-startY)/s/natH;
              h.w=Math.min(Math.max(ow+dx, 0.015), Math.max(0.015,1-h.x));
              h.h=Math.min(Math.max(oh+dy, 0.015), Math.max(0.015,1-h.y));
              el.style.width=(h.w*natW)+'px'; el.style.height=(h.h*natH)+'px';
            }
            function onUp(){
              handle.removeEventListener('pointermove', onMove);
              handle.removeEventListener('pointerup', onUp);
              nbScheduleSave(item);
            }
            handle.addEventListener('pointermove', onMove);
            handle.addEventListener('pointerup', onUp);
          });
          el.addEventListener('dblclick',(e)=>{ e.stopPropagation(); nbFtOpenEditor(h, item, ()=>{ redrawCanvas(); renderTextLabels(); renderMarkers(); renderLayersBar(); }); });
        }
        markersLayer.appendChild(el);
      });
    }

    /* ===== تكبير باللمس (Pinch) + تحريك بإصبع واحد + رسم مباشر على الصورة ===== */
    const activePointers=new Map();
    let panDragStart=null, panDragMoved=false;
    let drawState=null;
    function activeLayerNow(){ return page.hotspots.find(x=>x.id===activeLayerId) || null; }

    function askInlineText(pos, onDone){
      const input=document.createElement('input');
      input.type='text'; input.placeholder='اكتب النص واضغط Enter…'; input.className='ft-inline-text-input';
      const fsz=parseInt(fontInput.value,10)||18;
      input.style.left=pos.x+'px'; input.style.top=pos.y+'px';
      input.style.fontSize=fsz+'px';
      input.style.color=colorInput.value;
      world.appendChild(input); input.focus();
      function finish(commit){ const val=input.value.trim(); input.remove(); if(commit&&val) onDone(val); }
      input.addEventListener('pointerdown',(e)=>e.stopPropagation());
      input.addEventListener('keydown',(e)=>{ e.stopPropagation(); if(e.key==='Enter') finish(true); if(e.key==='Escape') finish(false); });
      input.addEventListener('blur',()=>finish(true));
    }
    function eraseNearActive(pos){
      const layer=activeLayerNow(); if(!layer) return;
      const shapes=layer.content.drawing.shapes;
      let bestIdx=-1, bestDist=26/currentScale();
      shapes.forEach((sh,i)=>{
        nbShapeRefPoints(sh).forEach(p=>{ const d=Math.hypot(p.x-pos.x,p.y-pos.y); if(d<bestDist){ bestDist=d; bestIdx=i; } });
      });
      if(bestIdx!==-1){ shapes.splice(bestIdx,1); clearRedo(layer.id); nbScheduleSave(item); redrawCanvas(); renderTextLabels(); }
    }
    function startPan(clientX, clientY){ panDragStart={x:clientX,y:clientY,tx,ty}; }
    function movePan(clientX, clientY){
      if(!panDragStart) return;
      const dx=clientX-panDragStart.x, dy=clientY-panDragStart.y;
      if(Math.abs(dx)+Math.abs(dy)>5) panDragMoved=true;
      tx=panDragStart.tx+dx; ty=panDragStart.ty+dy;
      applyTransform();
    }

    if(drawToolbar){
      drawToolbar.querySelector('.ft-undo-btn').onclick=()=>{
        const layer=activeLayerNow(); if(!layer||!layer.content.drawing.shapes.length) return;
        const popped=layer.content.drawing.shapes.pop();
        const st=redoStacks.get(layer.id)||[]; st.push(popped); redoStacks.set(layer.id, st);
        nbScheduleSave(item); redrawCanvas(); renderTextLabels();
      };
      drawToolbar.querySelector('.ft-redo-btn').onclick=()=>{
        const layer=activeLayerNow(); if(!layer) return;
        const st=redoStacks.get(layer.id)||[]; if(!st.length) return;
        layer.content.drawing.shapes.push(st.pop());
        nbScheduleSave(item); redrawCanvas(); renderTextLabels();
      };
      drawToolbar.querySelector('.ft-clear-btn').onclick=(e)=>{
        const layer=activeLayerNow(); if(!layer) return;
        if(!nbArmConfirm(e.currentTarget,'تأكيد المسح؟')) return;
        layer.content.drawing.shapes=[]; clearRedo(layer.id);
        nbScheduleSave(item); redrawCanvas(); renderTextLabels();
      };
    }

    viewport.addEventListener('pointerdown',(e)=>{
      if(e.target.closest('.ft-marker') || e.target.closest('.ft-zoom-controls') || e.target.closest('.ft-text-label') || e.target.classList.contains('ft-inline-text-input')) return;
      viewport.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      panDragMoved=false;
      if(activePointers.size===1){
        const canDraw = mode==='edit' && activeLayerId && currentTool!=='pan';
        if(selectMode && mode==='edit' && activeLayerId){
          const layer=activeLayerNow();
          const pos=screenToNatural(e.clientX,e.clientY);
          const hit=findShapeAt(layer,pos);
          selectedShapeRef=hit?{layerId:layer.id,shape:hit}:null;
          if(hit){
            drawState={selecting:true,shape:hit,last:pos};
            renderTextLabels(); redrawCanvas();
          } else { renderTextLabels(); redrawCanvas(); }
          return;
        }
        if(canDraw){
          const layer=activeLayerNow();
          const pos=screenToNatural(e.clientX, e.clientY);
          if(currentTool==='text'){
            askInlineText(pos,(txt)=>{
              layer.content.drawing.shapes.push({type:'text',x:pos.x,y:pos.y,text:txt,color:colorInput.value,fontSize:parseInt(fontInput.value,10)||18});
              clearRedo(layer.id); nbScheduleSave(item); redrawCanvas(); renderTextLabels();
            });
            drawState=null; return;
          }
          if(currentTool==='eraser'){ drawState={erasing:true}; eraseNearActive(pos); return; }
          drawState={ tool:currentTool, start:pos, points: currentTool==='pen'?[pos]:null };
          return;
        }
        startPan(e.clientX, e.clientY);
      } else if(activePointers.size===2){
        drawState=null; panDragStart=null;
        const pts=Array.from(activePointers.values());
        viewport._pinchStartDist=ptDist(pts[0],pts[1]);
        viewport._pinchStartZoom=zoomFactor;
      }
    });
    viewport.addEventListener('pointermove',(e)=>{
      if(!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(activePointers.size===1 && drawState){
        const pos=screenToNatural(e.clientX, e.clientY);
        const layer=activeLayerNow(); if(!layer) return;
        if(drawState.selecting && drawState.shape){
          const dx=pos.x-drawState.last.x, dy=pos.y-drawState.last.y;
          moveShape(drawState.shape,dx,dy); drawState.last=pos;
          redrawCanvas(); renderTextLabels(); return;
        }
        if(drawState.erasing){ eraseNearActive(pos); return; }
        const width=parseInt(widthInput.value,10)||3;
        redrawCanvas();
        if(drawState.tool==='pen'){
          drawState.points.push(pos);
          nbDrawShape(ctx,{type:'freehand',points:drawState.points,color:colorInput.value,width});
        } else {
          nbDrawShape(ctx, nbBuildLiveShape(drawState.tool, drawState.start, pos, colorInput.value, width, fillInput.checked));
        }
      } else if(activePointers.size===1 && panDragStart){
        movePan(e.clientX, e.clientY);
      } else if(activePointers.size===2){
        const pts=Array.from(activePointers.values());
        const dist=ptDist(pts[0],pts[1]);
        const mid=ptMid(pts[0],pts[1]);
        const rect=viewport.getBoundingClientRect();
        const oldScale=currentScale();
        let newZoom=Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, (viewport._pinchStartZoom||1)*(dist/(viewport._pinchStartDist||dist))));
        const newScale=baseScale*newZoom;
        const cx=mid.x-rect.left, cy=mid.y-rect.top;
        tx = cx - (cx-tx)*(newScale/oldScale);
        ty = cy - (cy-ty)*(newScale/oldScale);
        zoomFactor=newZoom;
        applyTransform();
      }
    });
    function releasePointer(e){
      activePointers.delete(e.pointerId);
      if(drawState && drawState.selecting){
        nbScheduleSave(item);
      } else if(drawState && !drawState.erasing){
        const layer=activeLayerNow();
        if(layer){
          const pos=screenToNatural(e.clientX, e.clientY);
          const width=parseInt(widthInput.value,10)||3;
          if(drawState.tool==='pen'){
            if(drawState.points && drawState.points.length>1){ layer.content.drawing.shapes.push({type:'freehand',points:drawState.points,color:colorInput.value,width}); clearRedo(layer.id); nbScheduleSave(item); }
          } else {
            const shape=nbBuildLiveShape(drawState.tool, drawState.start, pos, colorInput.value, width, fillInput.checked);
            if(Math.abs(shape.x2-shape.x1)>2/currentScale() || Math.abs(shape.y2-shape.y1)>2/currentScale()){ layer.content.drawing.shapes.push(shape); clearRedo(layer.id); nbScheduleSave(item); }
          }
        }
      }
      drawState=null;
      panDragStart=null;
      redrawCanvas();
      if(activePointers.size===1){
        const entry=Array.from(activePointers.entries())[0];
        startPan(entry[1].x, entry[1].y);
      }
    }
    viewport.addEventListener('pointerup', releasePointer);
    viewport.addEventListener('pointercancel', releasePointer);
    viewport.addEventListener('pointerleave',(e)=>{ if(activePointers.has(e.pointerId)) releasePointer(e); });
    viewport.addEventListener('dblclick',(e)=>{
      if(e.target.closest('.ft-marker') || e.target.closest('.ft-text-label')) return;
      if(!isFullscreen){ isFullscreen=true; render(); return; }
      if(zoomFactor>1.05){ zoomFactor=1; computeBaseScaleAndCenter(); } else zoomBy(2, e.clientX, e.clientY);
      applyTransform();
    });

    worldImg.addEventListener('load', ()=>{
      natW=worldImg.naturalWidth; natH=worldImg.naturalHeight;
      worldImg.style.width=natW+'px'; worldImg.style.height=natH+'px';
      canvas.width=natW; canvas.height=natH; canvas.style.width=natW+'px'; canvas.style.height=natH+'px';
      textLayer.style.width=natW+'px'; textLayer.style.height=natH+'px';
      markersLayer.style.width=natW+'px'; markersLayer.style.height=natH+'px';
      zoomFactor=1;
      computeBaseScaleAndCenter(); applyTransform();
      redrawCanvas(); renderTextLabels(); renderMarkers();
    });
    window.addEventListener('resize', ()=>{ if(natW){ computeBaseScaleAndCenter(); applyTransform(); } });
    document.addEventListener('keydown', function escFsHandler(e){ if(e.key==='Escape' && isFullscreen){ isFullscreen=false; render(); } });

    updateDrawCursor();
    renderLayersBar();
    renderMarkers();
  }
  render();
}

/* ===== الحاوية الرئيسية ===== */
function nbMountNotebook(holder, item){
  const s = ensureNotebookData(item);
  let tab = 'text';
  function render(){
    holder.innerHTML='';
    holder.className='nb-scope';
    const box=document.createElement('div');
    box.className='nb-box';
    const head=document.createElement('div');
    head.className='nb-head';
    const titleInput=document.createElement('input');
    titleInput.className='nb-title';
    titleInput.placeholder='عنوان التوثيق التقني';
    titleInput.value=s.title;
    titleInput.oninput=()=>{ s.title=titleInput.value; nbScheduleSave(item); };
    const note=document.createElement('div');
    note.className='nb-note';
    note.textContent='الحفظ تلقائي';
    head.append(titleInput, note);
    box.appendChild(head);

    const nav=document.createElement('div');
    nav.className='nb-tabs';
    [['text','📝 الشرح والصور'],['code','💻 الأكواد'],['draw','📐 الرسم'],['map','🧠 الخريطة'],['fault','🩺 تتبع الأعطال']].forEach(([id,label])=>{
      const b=document.createElement('button');
      b.type='button'; b.className='btn small'+(id===tab?' primary':'');
      b.textContent=label;
      b.onclick=()=>{ tab=id; render(); };
      nav.appendChild(b);
    });
    box.appendChild(nav);

    const body=document.createElement('div');
    body.className='nb-body';
    box.appendChild(body);
    holder.appendChild(box);

    if(tab==='text') nbTextPanel(body, s, item);
    else if(tab==='code') nbCodePanel(body, s, item, render);
    else if(tab==='draw') nbDrawTab(body, s, item);
    else if(tab==='map') nbMapTab(body, s, item);
    else nbFaultPanel(body, s, item);
  }
  render();
}
window.nbMountNotebook = nbMountNotebook;

})();
</script>
