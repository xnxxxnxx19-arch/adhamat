  const LANG_COLORS = {
    asm:"#8a63d2", avrasm:"#8a63d2", assembly:"#8a63d2", assembler:"#8a63d2",
    c:"#5a8dd6", cpp:"#e06c75", "c++":"#e06c75",
    python:"#f2c94c", py:"#f2c94c",
    javascript:"#f0db4f", js:"#f0db4f", typescript:"#3b82d8", ts:"#3b82d8",
    html:"#e8734a", css:"#4a9de8", json:"#a0a0a0",
    bash:"#6bbf6b", sh:"#6bbf6b", shell:"#6bbf6b",
    arduino:"#2fb3a3", java:"#c9843a", rust:"#d97757", go:"#4dc7c7",
    php:"#8a7fd6", sql:"#5aa9d6", markdown:"#8a8a8a", md:"#8a8a8a",
    yaml:"#c85a5a", xml:"#e89a3c"
  };
  const LANG_PALETTE_FALLBACK = ["#5c9a52","#e8734a","#5a8dd6","#c9843a","#8a63d2","#d64f7a","#4dc7c7","#c9b04c"];
  function colorForLang(lang){
    const key = (lang||"").toLowerCase().trim();
    if(LANG_COLORS[key]) return LANG_COLORS[key];
    let hash = 0;
    for(let i=0;i<key.length;i++) hash = (hash*31 + key.charCodeAt(i)) >>> 0;
    return LANG_PALETTE_FALLBACK[hash % LANG_PALETTE_FALLBACK.length];
  }
  const LANG_DISPLAY_NAMES = {
    asm:"Assembly", avrasm:"AVR ASM", c:"C", cpp:"C++", "c++":"C++", python:"Python", py:"Python",
    javascript:"JavaScript", js:"JavaScript", html:"HTML", css:"CSS", json:"JSON", bash:"Bash", sh:"Shell",
    arduino:"Arduino", java:"Java", rust:"Rust", go:"Go", php:"PHP", sql:"SQL", markdown:"Markdown", md:"Markdown",
    yaml:"YAML", xml:"XML", typescript:"TypeScript", ts:"TypeScript"
  };
  function langDisplayName(lang){
    const key = (lang||"").toLowerCase().trim();
    return LANG_DISPLAY_NAMES[key] || (lang ? lang.toUpperCase() : "—");
  }

  /* ==================================================================
     تعريف الـ Web Component <code-section>
     كل عنصر <code-section> = سكشن مستقل (شرح + أكواد + جداول + رسم +
     خريطة ذهنية) بحالته وتخزينه الخاص، وتقدر تحط منه كام واحد في نفس
     الصفحة من غير ما يتعارضوا مع بعض.

     ملاحظة تصميم: العنصر بيبني محتواه في الـ Light DOM (مش Shadow DOM)
     عشان يفضل يستخدم نفس ملف الـ CSS العام وأنظمة العرض المشتركة
     (التوست، معاينة ملء الشاشة، الصور المكبّرة) بدون تعقيد "تسريب"
     متغيرات CSS عبر حدود الـ Shadow DOM. لو محتاج عزل بصري صارم بين كل
     سكشن وتاني، ده اختياري ممكن نضيفه لاحقًا بسهولة.
     ================================================================== */

  // ---- توجيه الاستدعاءات المشتركة (scheduleAutoSave / renderAll) للنسخة الصحيحة ----
  // المحرّك الأصلي (بناء الجداول/الرسم/الخريطة الذهنية) بينادي على الدالتين دول
  // كأسماء عامة مباشرة. عشان كل <code-section> يفضل معزول عن التاني، بنستخدم
  // "سياق نشط" بيتحدّد تلقائيًا لحظة أي تفاعل (كليك/كتابة/سحب...) جوه عنصر معيّن،
  // عن طريق مستمع بمرحلة "الالتقاط" (capture) على كل عنصر — ده بيضمن إننا نعرف
  // مين صاحب الحدث قبل ما أي كود داخلي ينادي scheduleAutoSave()/renderAll().
  let __activeSectionCtx = null;
  function scheduleAutoSave(){ __activeSectionCtx && __activeSectionCtx._scheduleAutoSave(); }
  function renderAll(){ __activeSectionCtx && __activeSectionCtx._renderCard(); }

  const __CTX_EVENTS = ["pointerdown","mousedown","click","input","change","keydown","blur","touchstart"];

  /* ============================== معرض الصور التوضيحية (مستورد من نظام التوثيق التقني — workshop_inventory) ==============================
     صور بلا حد، مع شرح نصي أسفل كل صورة، وتكبير ومعاينة، وحذف فردي — منفصل عن نص الشرح الرئيسي وعن مرفقات الجداول. */
  function buildImageGalleryPanel(section){
    if(!Array.isArray(section.images)) section.images = [];
    const wrap = document.createElement("div");
    wrap.className = "img-gal-grid";

    function refresh(){
      wrap.innerHTML = "";
      section.images.forEach((entry, i)=>{
        const id = typeof entry === "object" ? entry.id : entry;
        const card = document.createElement("article");
        card.className = "img-gal-card";

        const img = document.createElement("img");
        img.alt = "صورة توضيحية";
        getImageDisplayURL(id).then(u=>{ if(u && img.isConnected) img.src = u; });
        const open = async ()=>{
          const u = await getImageDisplayURL(id);
          const currentEntry = section.images[i];
          const currentCaption = currentEntry && typeof currentEntry === "object" ? (currentEntry.caption || "") : "";
          if(u) openTblViewer({ kind: "image", url: u, name: currentCaption || "صورة توضيحية", caption: currentCaption });
        };
        img.onclick = open;

        const caption = document.createElement("textarea");
        caption.className = "img-gal-caption";
        caption.placeholder = "شرح أسفل الصورة…";
        caption.value = typeof entry === "object" ? (entry.caption || "") : "";
        caption.oninput = ()=>{
          section.images[i] = { id, caption: caption.value };
          scheduleAutoSave();
        };

        const acts = document.createElement("div");
        acts.className = "img-gal-acts";
        const zoom = document.createElement("button"); zoom.className = "ghost"; zoom.textContent = "تكبير"; zoom.onclick = open;
        const del = document.createElement("button"); del.className = "ghost danger"; del.textContent = "حذف";
        del.onclick = ()=>{
          const removed = section.images.splice(i, 1)[0];
          const rid = removed && (typeof removed === "object" ? removed.id : removed);
          if(rid) idbDeleteImage(rid);
          scheduleAutoSave();
          refresh();
        };
        acts.append(zoom, del);

        card.append(img, caption, acts);
        wrap.appendChild(card);
      });

      const add = document.createElement("label");
      add.className = "img-gal-add";
      add.textContent = "＋ أضف صورًا من الجهاز";
      const pick = document.createElement("input");
      pick.type = "file"; pick.accept = "image/*"; pick.multiple = true;
      pick.onchange = async ()=>{
        const files = [...(pick.files || [])];
        if(!files.length) return;
        add.style.pointerEvents = "none";
        add.textContent = "جارٍ حفظ الصور…";
        for(const f of files){
          try{
            const id = await storeImageAndGetRef(f);
            section.images.push({ id, caption: "" });
          }catch(err){
            showToast("تعذّر حفظ الصورة: " + (err && err.message ? err.message : err), "err");
          }
        }
        scheduleAutoSave();
        refresh();
      };
      add.appendChild(pick);
      wrap.appendChild(add);
    }
    refresh();
    return wrap;
  }

  function defaultSectionData(opts){
    opts = opts || {};
    return {
      id: uid(),
      title: opts.title || "سكشن جديد — عدّل العنوان",
      starred: false,
      explanation: opts.explanation || "اكتب هنا شرحك الرئيسي.\\nيدعم **بولد**، *مائل*، قوائم، وجداول ماركداون، وأكواد \`\`\`مثل هذا\`\`\`.",
      explanations: [],
      images: opts.images || [],
      codes: opts.codes || [{ lang: "asm", label: "مثال كود", code: "; مثال بسيط\\nldi r16, 0x05\\nout PORTB, r16" }],
      drawing: { shapes: [] },
      mindmap: null,
      tables: []
    };
  }

  class CodeSectionElement extends HTMLElement{
    constructor(){
      super();
      this._booted = false;
      this._saveTimer = null;
    }

    static get observedAttributes(){ return []; }

    // ---- API عامة: تقدر تقرأ/تكتب بيانات السكشن برمجيًا من بره ----
    get data(){ return this.section; }
    set data(value){
      if(value && typeof value === "object"){
        this.section = value;
        if(!Array.isArray(this.section.explanations)) this.section.explanations = [];
        if(!Array.isArray(this.section.images)) this.section.images = [];
        if(!Array.isArray(this.section.codes)) this.section.codes = [];
        if(!Array.isArray(this.section.tables)) this.section.tables = [];
        if(!this.section.drawing) this.section.drawing = { shapes: [] };
        if(this._booted) this._renderCard();
      }
    }

    get storageKey(){
      return this.getAttribute("storage-key") || ("code-section-auto-" + (this._autoKey || (this._autoKey = uid())));
    }

    connectedCallback(){
      this.classList.add("card");
      if(!this._booted){
        this._booted = true;
        this._loadInitialData();
        __CTX_EVENTS.forEach(type=>{
          this.addEventListener(type, this.__setActiveCtx, true);
        });
        __activeSectionCtx = this;
        this._renderCard();
      }
    }

    disconnectedCallback(){
      __CTX_EVENTS.forEach(type=>{
        this.removeEventListener(type, this.__setActiveCtx, true);
      });
      clearTimeout(this._saveTimer);
    }

    __setActiveCtx = () => { __activeSectionCtx = this; };

    _loadInitialData(){
      const key = this.storageKey;
      let loaded = null;
      // البيانات المحفوظة فعليًا مع العنصر (عبر التطبيق الرئيسي/IndexedDB) هي المصدر
      // الأساسي الآن — بتوصل هنا كسمة "data-seed" وقت بناء الإطار.
      const hostSeed = this.getAttribute("data-seed");
      if(hostSeed && hostSeed !== "null"){
        try{ loaded = JSON.parse(hostSeed); }catch(e){ /* تجاهل بيانات تالفة */ }
      }
      if(!loaded){
        try{
          const raw = localStorage.getItem(key);
          if(raw) loaded = JSON.parse(raw);
        }catch(e){ /* تجاهل بيانات تالفة وابدأ بسكشن جديد */ }
      }
      if(!loaded){
        const seedAttr = this.getAttribute("data");
        if(seedAttr){
          try{ loaded = JSON.parse(seedAttr); }catch(e){ /* تجاهل */ }
        }
      }
      if(!loaded){
        loaded = defaultSectionData({ title: this.getAttribute("initial-title") || undefined });
      }
      if(!Array.isArray(loaded.explanations)) loaded.explanations = [];
      if(!Array.isArray(loaded.images)) loaded.images = [];
      if(!Array.isArray(loaded.codes)) loaded.codes = [];
      if(!Array.isArray(loaded.tables)) loaded.tables = [];
      if(!loaded.drawing) loaded.drawing = { shapes: [] };
      this.section = loaded;
    }

    _scheduleAutoSave(){
      this._setSaveBadge("pending");
      clearTimeout(this._saveTimer);
      this._saveTimer = setTimeout(()=> this._flushAutoSaveNow(), 500);
    }

    _flushAutoSaveNow(){
      // مساحة localStorage جوه الإطار محدودة (~5-10 ميجا فقط) وسهل تمتلئ لو
      // فيه صور اتخزنت كـ Base64 داخل بيانات السكشن (بديل لما IndexedDB يبقى
      // غير متاح). فشل النسخة المحلية دي مش خطر ومينفعش يوقف الحفظ الحقيقي —
      // فبنعامل الاتنين (التخزين المحلي وإرسال البيانات لصفحة الاستضافة)
      // كخطوتين مستقلتين، مش خطوة واحدة بتوقف التانية لو فشلت.
      let localOk = false;
      try{
        localStorage.setItem(this.storageKey, JSON.stringify(this.section));
        localOk = true;
      }catch(e){
        console.warn("تعذّر الحفظ في localStorage (مساحة التخزين المحلية ممتلئة على الأرجح) — البيانات لسه بتتبعت لصفحة الاستضافة:", e);
      }
      this.dispatchEvent(new CustomEvent("section-save", { detail: { data: this.section }, bubbles: true }));
      // ابعت نسخة من بيانات السكشن لصفحة الاستضافة (التطبيق الرئيسي) عشان تتحفظ
      // مع باقي بيانات الجهاز في IndexedDB — ده المصدر الأساسي والدائم للحفظ،
      // وبيشتغل حتى لو التخزين المحلي جوه الإطار امتلأ أو اتعطّل بالكامل.
      let parentOk = false;
      try{
        if(window.parent && window.parent !== window){
          window.parent.postMessage({
            type: "cs-note-save",
            storageKey: this.storageKey,
            data: this.section
          }, "*");
          parentOk = true;
        }
      }catch(e){ /* تجاهل لو مفيش صفحة أب (فتح الإطار لوحده) */ }
      this._setSaveBadge((localOk || parentOk) ? "ok" : "err");
    }

    _setSaveBadge(kind){
      const el = this.querySelector(".save-badge");
      if(!el) return;
      if(kind === "pending") el.textContent = "🟡 جارٍ الحفظ…";
      else if(kind === "ok") el.textContent = "🟢 تم الحفظ — " + new Date().toLocaleTimeString("ar-EG");
      else el.textContent = "🔴 فشل الحفظ (مساحة التخزين ممتلئة؟)";
    }

    _renderCard(){
      const s = this.section;
      const card = this;
      card.innerHTML = \`
        <div class="card-head">
          <span class="starbtn \${s.starred?'on':''}" data-act="star">\${s.starred?'★':'☆'}</span>
          <input class="titlein" data-act="title" value="\${escapeHtml(s.title).replace(/"/g,'&quot;')}">
          <span class="tag">\${s.codes.length} كود</span>
          <span class="tag save-badge">🟢 محفوظ</span>
        </div>

        <nav class="nb-tabs" data-act="nb-tabs">
          <button class="nb-tab" data-tab="explain">📝 الشرح والصور</button>
          <button class="nb-tab" data-tab="codes">💻 الأكواد</button>
          <button class="nb-tab" data-tab="tables">📊 جداول</button>
          <button class="nb-tab" data-tab="draw">📐 الرسم</button>
          <button class="nb-tab" data-tab="mindmap">🧠 الخريطة</button>
        </nav>

        <div class="nb-pane" data-pane="explain">
          <div class="pane-topbar"><button class="ghost expand-btn" data-act="expand-explain" title="تكبير لملء الشاشة">⛶ ملء الشاشة</button></div>
          <div class="explain-view" data-act="explain-view">\${renderMarkdownLite(s.explanation)}</div>
          <div class="fmt-toolbar-holder" data-act="explain-toolbar-holder" style="display:none;"></div>
          <textarea class="explain" data-act="explain" style="display:none;">\${escapeHtml(s.explanation)}</textarea>
          <div class="extra-explanations-holder" data-act="extra-explanations-holder"></div>
          <button class="ghost add-explain-btn" data-act="add-explain-box">➕ إضافة صندوق شرح</button>
          <div class="section-label" style="margin-top:18px">📷 صور توضيحية</div>
          <div class="img-gal-holder"></div>
        </div>

        <div class="nb-pane" data-pane="codes">
          <div class="codes-holder"></div>
          <button class="ghost addcode-btn" data-act="addcode">➕ إضافة كتلة كود</button>
        </div>

        <div class="nb-pane" data-pane="tables">
          <div class="pane-topbar"><button class="ghost expand-btn" data-act="expand-tables" title="تكبير لملء الشاشة">⛶ ملء الشاشة</button></div>
          <div class="tables-holder"></div>
        </div>

        <div class="nb-pane" data-pane="draw">
          <div class="pane-topbar"><button class="ghost expand-btn" data-act="expand-draw" title="تكبير لملء الشاشة">⛶ ملء الشاشة</button></div>
          <div class="drawing-holder"></div>
        </div>

        <div class="nb-pane" data-pane="mindmap">
          <div class="pane-topbar"><button class="ghost expand-btn" data-act="expand-mindmap" title="تكبير لملء الشاشة">⛶ ملء الشاشة</button></div>
          <div class="mindmap-holder"></div>
        </div>

      \`;

      card.querySelector(".img-gal-holder").appendChild(buildImageGalleryPanel(s));

      const holder = card.querySelector(".codes-holder");
      s.codes.forEach((c, ci)=>{ holder.appendChild(buildCodeBlock(s, c, ci)); });
      card.querySelector(".tables-holder").appendChild(buildTablesHolder(s));
      card.querySelector(".drawing-holder").appendChild(buildDrawingPanel(s));
      card.querySelector(".mindmap-holder").appendChild(buildMindMapPanel(s));

      if(!Array.isArray(s.explanations)) s.explanations = [];
      const exHolder = card.querySelector('[data-act="extra-explanations-holder"]');
      s.explanations.forEach((box, bi)=>{ exHolder.appendChild(buildExtraExplainBox(s, box, bi)); });

      enhanceMarkdownView(card.querySelector('[data-act="explain-view"]'));

      // ===== الأحداث (Events) =====
      card.querySelector('[data-act="star"]').addEventListener("click", ()=>{ s.starred=!s.starred; scheduleAutoSave(); renderAll(); });
      card.querySelector('[data-act="title"]').addEventListener("input", (e)=>{ s.title = e.target.value; scheduleAutoSave(); });
      card.querySelector('[data-act="explain"]').addEventListener("input", (e)=>{ s.explanation = e.target.value; scheduleAutoSave(); });
      {
        const viewEl = card.querySelector('[data-act="explain-view"]');
        const taEl = card.querySelector('[data-act="explain"]');
        const toolbarHolder = card.querySelector('[data-act="explain-toolbar-holder"]');
        toolbarHolder.appendChild(buildFormatToolbar(()=> taEl));
        viewEl.addEventListener("click", ()=>{
          viewEl.style.display = "none";
          toolbarHolder.style.display = "flex";
          taEl.style.display = "block";
          taEl.focus();
        });
        taEl.addEventListener("blur", ()=>{
          viewEl.innerHTML = renderMarkdownLite(s.explanation);
          enhanceMarkdownView(viewEl);
          taEl.style.display = "none";
          toolbarHolder.style.display = "none";
          viewEl.style.display = "block";
        });
      }
      card.querySelector('[data-act="add-explain-box"]').addEventListener("click", ()=>{
        if(!Array.isArray(s.explanations)) s.explanations = [];
        s.explanations.push({ id: uid(), title: "", content: "" });
        scheduleAutoSave();
        renderAll();
      });
      card.querySelector('[data-act="addcode"]').addEventListener("click", ()=>{
        s.codes.push({lang:"asm", label:"كود جديد", code:""});

        renderAll();

      if(!card._activeTab) card._activeTab = "explain";
      const tabBtns = card.querySelectorAll(".nb-tab");
      const panes = card.querySelectorAll(".nb-pane");
      const applyActiveTab = ()=>{
        tabBtns.forEach(b=> b.classList.toggle("on", b.dataset.tab === card._activeTab));
        panes.forEach(p=> p.style.display = (p.dataset.pane === card._activeTab) ? "" : "none");
      };
      applyActiveTab();
      tabBtns.forEach(btn=>{
        btn.addEventListener("click", ()=>{
          card._activeTab = btn.dataset.tab;
          applyActiveTab();
        });
      });
      card.querySelector('[data-act="expand-explain"]').addEventListener("click", ()=>{
        openFullscreen("الشرح — " + s.title, (body)=>{
          const ta = document.createElement("textarea");
          ta.className = "explain";
          ta.style.minHeight = "160px";
          ta.value = s.explanation;
          const toolbar = buildFormatToolbar(()=> ta);
          const previewLabel = document.createElement("div");
          previewLabel.className = "section-label";
          previewLabel.style.marginTop = "16px";
          previewLabel.textContent = "🔍 معاينة الشكل النهائي";
          const preview = document.createElement("div");
          preview.className = "explain-view";
          preview.innerHTML = renderMarkdownLite(s.explanation);
          enhanceMarkdownView(preview);
          ta.addEventListener("input", (e)=>{
            s.explanation = e.target.value;
            const inlineTa = card.querySelector('[data-act="explain"]');
            if(inlineTa) inlineTa.value = e.target.value;
            preview.innerHTML = renderMarkdownLite(s.explanation);
            enhanceMarkdownView(preview);
            scheduleAutoSave();
          });
          body.appendChild(toolbar);
          body.appendChild(ta);
          body.appendChild(previewLabel);
          body.appendChild(preview);
          setTimeout(()=> ta.focus(), 50);
        }, ()=>{
          const viewEl = card.querySelector('[data-act="explain-view"]');
          if(viewEl){ viewEl.innerHTML = renderMarkdownLite(s.explanation); enhanceMarkdownView(viewEl); }
        });
      });
      card.querySelector('[data-act="expand-tables"]').addEventListener("click", ()=>{
        const holder = card.querySelector(".tables-holder");
        const placeholder = document.createComment("tables-placeholder");
        holder.after(placeholder);
        openFullscreen("جداول — " + s.title, (body)=>{
          body.appendChild(holder);
        }, ()=>{
          placeholder.replaceWith(holder);
          placeholder.remove?.();
        });
      });
      card.querySelector('[data-act="expand-draw"]').addEventListener("click", ()=>{
        const panel = card.querySelector(".drawpanel");
        const placeholder = document.createComment("drawpanel-placeholder");
        panel.after(placeholder);
        openFullscreen("رسم توضيحي — " + s.title, (body)=>{
          body.appendChild(panel);
          resizeDrawCanvas(panel.querySelector(".draw-canvas"), panel._drawState);
        }, ()=>{
          placeholder.replaceWith(panel);
          resizeDrawCanvas(panel.querySelector(".draw-canvas"), panel._drawState);
          placeholder.remove?.();
        });
      });
      card.querySelector('[data-act="expand-mindmap"]').addEventListener("click", ()=>{
        const panel = card.querySelector(".mindmap-panel");
        const placeholder = document.createComment("mindmap-placeholder");
        panel.after(placeholder);
        openFullscreen("خريطة ذهنية — " + s.title, (body)=>{
          body.style.padding = "0";
          body.appendChild(panel);
          panel._mmState && panel._mmState.onResize && panel._mmState.onResize();
        }, ()=>{
          placeholder.replaceWith(panel);
          panel._mmState && panel._mmState.onResize && panel._mmState.onResize();
          placeholder.remove?.();
        });
      });
    }
  }

  customElements.define("code-section", CodeSectionElement);

  // متابعة تغيير ثيم صفحة الاستضافة (التطبيق الرئيسي) لحظيًا، عشان مظهر الدفتر
  // يفضل متناسق مع باقي الصفحة حتى لو المستخدم بدّل الثيم وهو فاتح تفاصيل الجهاز.
  window.addEventListener("message", (e)=>{
    if(!e.data || e.data.type !== "host-theme") return;
    try{ document.documentElement.setAttribute("data-theme", e.data.theme); }catch(err){}
  });

  // شبكة أمان: لو المستخدم عمل Reload أو قفل الصفحة وفي تعديل لسه واقف في فترة
  // انتظار الحفظ التلقائي (الـ500ms)، نجّز الحفظ فورًا هنا من غير ما ننتظر
  // المؤقّت، عشان آخر تعديل ميضيعش.
  function flushAllSectionsNow(){
    document.querySelectorAll("code-section").forEach(cs=>{
      if(cs._saveTimer){
        clearTimeout(cs._saveTimer);
        cs._flushAutoSaveNow();
      }
    });
  }
  window.addEventListener("pagehide", flushAllSectionsNow);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "hidden") flushAllSectionsNow();
  });

  /* ============================== شريط تجربة بسيط لإضافة/حذف سكشنات ============================== */
  (function boot(){
    (async ()=>{ try{ await navigator.storage?.persist?.(); }catch(e){} })();
  })();
<\/script>
</body>
</html>
`;

// تحويل ثيم التطبيق الرئيسي (كهرماني/أزرق ليلي/فاتح نهاري) لأقرب ثيم من ثيمات
// الدفتر الداخلية (ليلي/دائرة/المخطط)، عشان الدفتر يبان جزء متناسق من الصفحة
// من أول لحظة تحميل بدل ما يفضل شكل "ورق كريمي" ثابت مهما كان ثيم التطبيق.
function mapAppThemeToNotebookTheme(appTheme){
  if(appTheme === "daylight") return "blueprint";
  if(appTheme === "night-blue") return "circuit";
  return "night";
}

function buildCodeSectionEmbed(item){
  const storageKey = "item-note-" + item.id;
  const title = (item.name || "ملاحظات فنية").replace(/</g,"").replace(/>/g,"");
  const notebookTheme = mapAppThemeToNotebookTheme(state.settings.theme || "amber");
  const seed = JSON.stringify(item.notebookData || null);
  const html = CODE_SECTION_TEMPLATE
    .split("__STORAGE_KEY__").join(esc(storageKey))
    .split("__INITIAL_TITLE__").join(esc(title))
    .split("__NOTEBOOK_THEME__").join(esc(notebookTheme))
    .split("__SEED_DATA__").join(esc(seed));

  const wrap = document.createElement("div");
  wrap.className = "cs-embed-wrap";

  const iframe = document.createElement("iframe");
  iframe.className = "cs-embed-frame";
  iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-modals allow-popups allow-forms");
  iframe.setAttribute("loading", "lazy");
  iframe.srcdoc = html;

  wrap.appendChild(iframe);

  // استقبال حفظ محتوى الدفتر من جوه الإطار وتخزينه مع بيانات الجهاز نفسه في
  // IndexedDB (بدل ما يفضل محفوظ بمعزل في تخزين الإطار)، عشان يبقى خاضع لنفس
  // نظام الحفظ التلقائي العام، ويتضمن تلقائيًا في التصدير/الاستيراد.
  let noteSaveInFlight = null;
  const onNoteMessage = (e)=>{
    if(e.source !== iframe.contentWindow) return;
    if(!e.data || e.data.type !== "cs-note-save") return;
    if(!iframe.isConnected){ window.removeEventListener("message", onNoteMessage); return; }
    item.notebookData = e.data.data;
    setSaveBadge("saving");
    // بحفظ فورًا من غير أي تأخير إضافي هنا (التأخير الوحيد المقصود هو الـ500ms
    // جوه الدفتر نفسه) — عشان نقلل احتمال ضياع آخر تعديل لو المستخدم عمل
    // Reload بسرعة بعد الكتابة مباشرة.
    noteSaveInFlight = idbPut("items", item)
      .catch(err=> console.error(err))
      .finally(()=> setSaveBadge("idle"));
  };
  window.addEventListener("message", onNoteMessage);

  // ضبط ارتفاع الإطار تلقائيًا حسب محتوى الدفتر الداخلي، بدل ارتفاع ثابت،
  // عشان يبان جزء طبيعي من الصفحة مش صندوق منفصل بيحتاج سكرول داخلي.
  iframe.addEventListener("load", ()=>{
    try{
      const doc = iframe.contentDocument;
      let lastH = 0;
      const resize = ()=>{
        const h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
        if(Math.abs(h - lastH) < 3) return; // فرق تافه — تجاهله عشان مايبقاش فيه حلقة تغذية راجعة
        lastH = h;
        iframe.style.height = (h + 4) + "px";
      };
      resize();
      new ResizeObserver(resize).observe(doc.body);
    }catch(e){ /* في حال منع الوصول لأي سبب، يبقى الارتفاع الافتراضي */ }
  });

  return wrap;
}
</script>

<script>
/* =========================================================
   سجل الأجهزة — قاعدة بيانات الورشة
   تخزين: IndexedDB (بيانات + صور كـ Blob)
   ========================================================= */
"use strict";

const DB_NAME = "WorkshopEquipmentDB";
const DB_VERSION = 1;
let db = null;

const FIELD_TYPES = [
  {v:"text", l:"نص"},
  {v:"number", l:"رقم"},
  {v:"select", l:"قائمة اختيار"},
];
const INDICATOR_TYPES = [
  {v:"number", l:"رقم"},
  {v:"text", l:"نص"},
  {v:"badge", l:"حالة (Badge)"},
  {v:"progress", l:"شريط تقدم"},
];
const BADGE_COLORS = [
  {v:"ok", l:"أخضر", ico:"🟢"},
  {v:"warn", l:"أصفر", ico:"🟡"},
  {v:"crit", l:"أحمر", ico:"🔴"},
  {v:"info", l:"أزرق", ico:"🔵"},
];
const FOLDER_ICONS = ["📁","🌡️","📡","⚡","🛠️","🔌","🧰","💡","🔋","📦","🧲","🔧","📶","🖥️","🎛️"];
const FOLDER_COLORS = ["#f2a93c","#4da3ff","#3ddc84","#ff5d5d","#f2c53d","#b78cf2","#4dd0e1","#ff8a65"];

/* ---------- حالة التطبيق ---------- */
const state = {
  folders: [],   // {id,parentId,name,icon,color,description,columns,fieldsTemplate:[{id,label,type,unit,showInCard,options}],order,createdAt}
  items: [],     // {id,folderId,name,model,manufacturer,serial,partNumber,type,status,fields:{},tags:[],mainImageId,imageIds:[],docs:[{id,name,fileId,kind}],links:[{label,url}],indicators:[],notes,createdAt,updatedAt}
  settings: {theme:"amber"},
  view: {type:"home"},          // نوع العرض الحالي
  expandedFolders: new Set(),
  objectUrls: new Map(),        // fileId -> object URL (كاش)
  pendingImages: [],            // صور مؤقتة أثناء تحرير عنصر جديد (قبل الحفظ) [{tempId, blob, name}]
  pendingDocs: [],
  editingItemId: null,          // عند التعديل
  editingFolderId: null,
};

/* ---------- أدوات عامة ---------- */
function uid(prefix){ return (prefix||"id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, type, ms){
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast" + (type?(" "+type):"");
  el.style.whiteSpace = "pre-line";
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition=".3s"; setTimeout(()=>el.remove(),300); }, ms||2600);
}
function setSaveBadge(mode){
  const b = document.getElementById("saveBadge");
  const t = document.getElementById("saveBadgeText");
  if(mode==="saving"){ b.classList.add("saving"); t.textContent = "جارٍ الحفظ..."; }
  else { b.classList.remove("saving"); t.textContent = "محفوظ تلقائيًا"; }
}
function debounce(fn, ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a), ms); }; }

/* =========================================================
   طبقة التخزين — IndexedDB (مع نسخة احتياطية في الذاكرة
   تعمل تلقائيًا لو IndexedDB غير متاحة، مثلاً عند فتح
   الملف عبر رابط content:// حيث لا يوجد أصل تخزين ثابت)
   stores: folders, items, files(blobs), meta
   ========================================================= */
let STORAGE_MODE = "idb"; // "idb" | "memory"
const memoryDB = {
  folders: new Map(),
  items: new Map(),
  files: new Map(),
  meta: new Map(),
};

function openDB(){
  return new Promise((resolve, reject)=>{
    let req;
    try{
      req = indexedDB.open(DB_NAME, DB_VERSION);
    }catch(err){ reject(err); return; }
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains("folders")) d.createObjectStore("folders",{keyPath:"id"});
      if(!d.objectStoreNames.contains("items")){
        const s = d.createObjectStore("items",{keyPath:"id"});
        s.createIndex("folderId","folderId",{unique:false});
      }
      if(!d.objectStoreNames.contains("files")) d.createObjectStore("files",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"key"});
    };
    req.onsuccess = (e)=>{ resolve(e.target.result); };
    req.onerror = (e)=>{ reject(e.target.error || new Error("idb-open-failed")); };
    req.onblocked = ()=>{ reject(new Error("idb-blocked")); };
  });
}
function tx(storeNames, mode){
  return db.transaction(storeNames, mode||"readonly");
}

/* ---- تنفيذ فعلي عبر IndexedDB ---- */
function idbGetAll_real(storeName){
  return new Promise((resolve, reject)=>{
    const t = tx(storeName);
    const req = t.objectStore(storeName).getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = ()=>reject(req.error);
  });
}
function idbGet_real(storeName, key){
  return new Promise((resolve, reject)=>{
    const req = tx(storeName).objectStore(storeName).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function idbPut_real(storeName, value){
  return new Promise((resolve, reject)=>{
    const t = tx(storeName, "readwrite");
    t.objectStore(storeName).put(value);
    t.oncomplete = ()=>resolve(value);
    t.onerror = ()=>reject(t.error);
  });
}
function idbDelete_real(storeName, key){
  return new Promise((resolve, reject)=>{
    const t = tx(storeName, "readwrite");
    t.objectStore(storeName).delete(key);
    t.oncomplete = ()=>resolve();
    t.onerror = ()=>reject(t.error);
  });
}
function idbClear_real(storeName){
  return new Promise((resolve, reject)=>{
    const t = tx(storeName, "readwrite");
    t.objectStore(storeName).clear();
    t.oncomplete = ()=>resolve();
    t.onerror = ()=>reject(t.error);
  });
}

/* ---- تنفيذ بديل في الذاكرة (يُستخدم تلقائيًا عند فشل IndexedDB) ---- */
function memKey(storeName, value){ return storeName==="meta" ? value.key : value.id; }
function memGetAll(storeName){ return Promise.resolve(Array.from(memoryDB[storeName].values())); }
function memGet(storeName, key){ return Promise.resolve(memoryDB[storeName].get(key)); }
function memPut(storeName, value){ memoryDB[storeName].set(memKey(storeName, value), value); return Promise.resolve(value); }
function memDelete(storeName, key){ memoryDB[storeName].delete(key); return Promise.resolve(); }
function memClear(storeName){ memoryDB[storeName].clear(); return Promise.resolve(); }

/* ---- الواجهة الموحّدة المستخدمة في باقي التطبيق ---- */
function idbGetAll(storeName){ return STORAGE_MODE==="memory" ? memGetAll(storeName) : idbGetAll_real(storeName); }
function idbGet(storeName, key){ return STORAGE_MODE==="memory" ? memGet(storeName, key) : idbGet_real(storeName, key); }
function idbPut(storeName, value){ return STORAGE_MODE==="memory" ? memPut(storeName, value) : idbPut_real(storeName, value); }
function idbDelete(storeName, key){ return STORAGE_MODE==="memory" ? memDelete(storeName, key) : idbDelete_real(storeName, key); }
function idbClear(storeName){ return STORAGE_MODE==="memory" ? memClear(storeName) : idbClear_real(storeName); }

async function saveAndFlag(storeName, value){
  setSaveBadge("saving");
  try{
    await idbPut(storeName, value);
  } finally {
    setTimeout(()=>setSaveBadge("idle"), 350);
  }
}

/* ملفات (صور/مستندات) كـ Blob */
async function storeFile(blob, name, mime){
  const id = uid("file");
  await idbPut("files", {id, blob, name: name||"", mime: mime||blob.type||""});
  return id;
}
async function getFileBlobURL(fileId){
  if(!fileId) return null;
  if(state.objectUrls.has(fileId)) return state.objectUrls.get(fileId);
  const rec = await idbGet("files", fileId);
  if(!rec) return null;
  const url = URL.createObjectURL(rec.blob);
  state.objectUrls.set(fileId, url);
  return url;
}
async function deleteFile(fileId){
  if(state.objectUrls.has(fileId)){ URL.revokeObjectURL(state.objectUrls.get(fileId)); state.objectUrls.delete(fileId); }
  await idbDelete("files", fileId);
}

/* =========================================================
   استعلامات بيانات مساعدة
   ========================================================= */
function getFolder(id){ return state.folders.find(f=>f.id===id); }
function getChildFolders(parentId){
  return state.folders.filter(f=>f.parentId===parentId).sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name,"ar"));
}
function getRootFolders(){ return getChildFolders(null); }
function getItemsInFolder(folderId){ return state.items.filter(i=>i.folderId===folderId); }
function countItemsDeep(folderId){
  let n = getItemsInFolder(folderId).length;
  for(const c of getChildFolders(folderId)) n += countItemsDeep(c.id);
  return n;
}
function countAllFoldersDeep(folderId){
  let n = 0;
  for(const c of getChildFolders(folderId)){ n += 1 + countAllFoldersDeep(c.id); }
  return n;
}
function getFolderPath(folderId){
  const path = [];
  let f = getFolder(folderId);
  while(f){ path.unshift(f); f = f.parentId ? getFolder(f.parentId) : null; }
  return path;
}
function getEffectiveFieldTemplate(folderId){
  // يبحث في المجلد ثم آبائه عن أقرب قالب حقول غير فارغ
  let f = getFolder(folderId);
  while(f){
    if(f.fieldsTemplate && f.fieldsTemplate.length) return f.fieldsTemplate;
    f = f.parentId ? getFolder(f.parentId) : null;
  }
  return [];
}
function getAllTags(){
  const map = new Map();
  for(const it of state.items){
    for(const t of (it.tags||[])){ map.set(t, (map.get(t)||0)+1); }
  }
  return [...map.entries()].sort((a,b)=>b[1]-a[1]);
}
function isDescendantFolder(folderId, possibleParentId){
  let f = getFolder(folderId);
  while(f){ if(f.parentId===possibleParentId) return true; f = f.parentId ? getFolder(f.parentId): null; }
  return false;
}

/* =========================================================
   الإقلاع
   ========================================================= */
async function boot(){
  try{
    // لا نجبر التطبيق على وضع الذاكرة عند فتح الملف من file:// أو content://.
    // نحاول IndexedDB أولاً لأنها الوحيدة التي تحفظ البيانات بعد إعادة التحميل/الإغلاق.
    db = await openDB();
    STORAGE_MODE = "idb";
  } catch(err){
    console.error("IndexedDB غير متاح:", err);
    STORAGE_MODE = "memory";
  }
  const [folders, items, metaRows] = await Promise.all([idbGetAll("folders"), idbGetAll("items"), idbGetAll("meta")]);
  state.folders = folders;
  state.items = items;
  const settingsRow = metaRows.find(m=>m.key==="settings");
  if(settingsRow && settingsRow.value) state.settings = Object.assign(state.settings, settingsRow.value);
  applyTheme(state.settings.theme || "amber");

  bindGlobalEvents();
  renderSidebarTree();
  navigateTo({type:"home"});

  if(STORAGE_MODE==="memory"){
    // في وضع الذاكرة لا يمكن ضمان بقاء البيانات بعد إغلاق الصفحة.
    // نوضح ذلك للمستخدم بدل أن يظهر التطبيق وكأن الحفظ التلقائي يعمل.
    const badge = document.getElementById("saveBadgeText");
    if(badge) badge.textContent = "⚠️ التخزين الدائم غير متاح";
    toast("تحذير: المتصفح منع IndexedDB، البيانات الحالية مؤقتة.", "err");

    window.addEventListener("beforeunload", (e)=>{
      if(state.folders.length || state.items.length){
        e.preventDefault();
        e.returnValue = "";
      }
    });
  }
}

async function saveSettings(){
  await idbPut("meta", {key:"settings", value: state.settings});
}

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  state.settings.theme = theme;
  // مزامنة لحظية لثيم دفتر الملاحظات مع ثيم التطبيق لو الإطار مفتوح حاليًا
  // (مثلًا المستخدم غيّر الثيم وهو فاتح تفاصيل جهاز فيه دفتر ملاحظات).
  document.querySelectorAll(".cs-embed-frame").forEach(f=>{
    try{ f.contentWindow && f.contentWindow.postMessage({ type:"host-theme", theme: mapAppThemeToNotebookTheme(theme) }, "*"); }catch(e){}
  });
}

/* =========================================================
   التنقّل (Routing) بين العروض
   ========================================================= */
function navigateTo(view){
  state.view = view;
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.add("hidden");
  updateBreadcrumb();
  updateActiveNav();
  render();
}
function updateActiveNav(){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active", b.dataset.nav===state.view.type));
  document.querySelectorAll(".tree-row").forEach(r=>r.classList.toggle("active", state.view.type==="folder" && r.dataset.id===state.view.id));
}
function updateBreadcrumb(){
  const el = document.getElementById("breadcrumb");
  let html = "";
  if(state.view.type==="home"){
    html = "<b>🏠 الرئيسية</b>";
  } else if(state.view.type==="tags"){
    html = '<b data-go="home">🏠 الرئيسية</b><span class="sep">/</span><b>🏷️ الوسوم</b>' + (state.view.tag? '<span class="sep">/</span><b>#'+esc(state.view.tag)+'</b>' : '');
  } else if(state.view.type==="settings"){
    html = '<b data-go="home">🏠 الرئيسية</b><span class="sep">/</span><b>⚙️ الإعدادات</b>';
  } else if(state.view.type==="search"){
    html = '<b data-go="home">🏠 الرئيسية</b><span class="sep">/</span><b>🔎 نتائج البحث</b>';
  } else if(state.view.type==="folder"){
    const path = getFolderPath(state.view.id);
    html = '<b data-go="home">🏠 الرئيسية</b>';
    path.forEach(f=>{ html += '<span class="sep">/</span><b data-go="folder" data-id="'+f.id+'">'+esc(f.icon||"📁")+" "+esc(f.name)+'</b>'; });
  } else if(state.view.type==="item"){
    const it = state.items.find(i=>i.id===state.view.id);
    if(it){
      const path = getFolderPath(it.folderId);
      html = '<b data-go="home">🏠 الرئيسية</b>';
      path.forEach(f=>{ html += '<span class="sep">/</span><b data-go="folder" data-id="'+f.id+'">'+esc(f.icon||"📁")+" "+esc(f.name)+'</b>'; });
      html += '<span class="sep">/</span><b>'+esc(it.name)+'</b>';
    }
  }
  el.innerHTML = html;
  el.querySelectorAll("[data-go]").forEach(b=>{
    b.onclick = ()=>{
      const go = b.dataset.go;
      if(go==="home") navigateTo({type:"home"});
      else if(go==="folder") navigateTo({type:"folder", id:b.dataset.id});
    };
  });
}

/* =========================================================
   شجرة المجلدات (Sidebar)
   ========================================================= */
function renderSidebarTree(){
  const root = document.getElementById("folderTree");
  root.innerHTML = "";
  const rootFolders = getRootFolders();
  if(!rootFolders.length){
    root.innerHTML = '<div style="padding:10px;font-size:11.5px;color:var(--dim2)">لا توجد مجلدات بعد. اضغط + لإنشاء أول مجلد.</div>';
    return;
  }
  rootFolders.forEach(f=> root.appendChild(buildTreeNode(f)));
}
function buildTreeNode(folder){
  const wrap = document.createElement("div");
  wrap.className = "tree-node";
  const children = getChildFolders(folder.id);
  const row = document.createElement("div");
  row.className = "tree-row";
  row.dataset.id = folder.id;
  const isOpen = state.expandedFolders.has(folder.id);
  row.innerHTML = `
    <span class="tree-toggle ${children.length? (isOpen?'open':'') : 'empty'}">▶</span>
    <span class="tree-ico">${esc(folder.icon||"📁")}</span>
    <span class="tree-name">${esc(folder.name)}</span>
    <span class="tree-count">${countItemsDeep(folder.id)}</span>
  `;
  row.querySelector(".tree-toggle").onclick = (e)=>{
    e.stopPropagation();
    if(!children.length) return;
    if(state.expandedFolders.has(folder.id)) state.expandedFolders.delete(folder.id);
    else state.expandedFolders.add(folder.id);
    renderSidebarTree();
    updateActiveNav();
  };
  row.onclick = ()=> navigateTo({type:"folder", id: folder.id});
  wrap.appendChild(row);
  if(children.length && isOpen){
    const kids = document.createElement("div");
    kids.className = "tree-children";
    children.forEach(c=> kids.appendChild(buildTreeNode(c)));
    wrap.appendChild(kids);
  }
  return wrap;
}

/* =========================================================
   ربط الأحداث العامة
   ========================================================= */
function bindGlobalEvents(){
  document.querySelectorAll(".nav-item[data-nav]").forEach(b=>{
    b.onclick = ()=> navigateTo({type:b.dataset.nav});
  });
  document.getElementById("rootAddFolderBtn").onclick = ()=> openFolderModal(null, null);
  document.getElementById("menuBtn").onclick = ()=>{
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("hidden");
  };
  document.getElementById("sidebarOverlay").onclick = ()=>{
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.add("hidden");
  };
  document.querySelectorAll("#viewSwitch button").forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll("#viewSwitch button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      state.viewMode = b.dataset.mode;
      render();
    };
  });
  const searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", debounce(()=>{
    const q = searchInput.value.trim();
    if(q.length < 1){ document.getElementById("searchResults").classList.add("hidden"); return; }
    runSearch(q);
  }, 180));
  searchInput.addEventListener("keydown", (e)=>{
    if(e.key==="Enter"){
      const q = searchInput.value.trim();
      if(q){ document.getElementById("searchResults").classList.add("hidden"); navigateTo({type:"search", q}); }
    }
  });
  document.addEventListener("click", (e)=>{
    if(!e.target.closest(".search-wrap")) document.getElementById("searchResults").classList.add("hidden");
  });
}

function render(){
  const c = document.getElementById("viewContainer");
  document.getElementById("viewSwitch").parentElement && null;
  const v = state.view;
  if(v.type==="home") return renderHome(c);
  if(v.type==="folder") return renderFolderView(c, v.id);
  if(v.type==="tags") return renderTagsView(c, v.tag);
  if(v.type==="settings") return renderSettingsView(c);
  if(v.type==="search") return renderSearchView(c, v.q);
  if(v.type==="item") return renderItemDetail(c, v.id);
}

async function renderItemGallery(holder, items){
  const firstFolder = items.length ? getFolder(items[0].folderId) : null;
  const columns = Math.max(2, Math.min(6, Number(firstFolder?.columns) || 4));
  holder.innerHTML = '<div class="item-grid"></div>';
  const grid = holder.querySelector(".item-grid");
  grid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
  for(const it of items){
    const card = document.createElement("div");
    card.className = "item-card";
    const template = getEffectiveFieldTemplate(it.folderId).filter(f=>f.showInCard);
    let fieldsHtml = "";
    template.forEach(f=>{
      const val = it.fields ? it.fields[f.id] : null;
      if(val==null || val==="") return;
      fieldsHtml += `<div class="row"><span class="k">${esc(f.label)}</span><span class="v">${esc(val)}${f.unit?esc(f.unit):""}</span></div>`;
    });
    card.innerHTML = `
      <div class="item-thumb">🧰</div>
      <div class="item-body">
        <div class="item-name">${esc(it.name)}</div>
        <div class="item-model">${esc(it.model||"—")}</div>
        <div class="item-fields">${fieldsHtml}</div>
        ${(it.tags&&it.tags.length)? `<div class="item-tags">${it.tags.slice(0,4).map(t=>`<span class="tag-chip">#${esc(t)}</span>`).join("")}</div>`:""}
        ${(it.indicators&&it.indicators.length)? renderIndicatorsHtml(it.indicators, true) : ""}
      </div>
    `;
    card.onclick = ()=> navigateTo({type:"item", id:it.id});
    grid.appendChild(card);
    if(it.mainImageId){
      getFileBlobURL(it.mainImageId).then(url=>{
        if(url) card.querySelector(".item-thumb").innerHTML = `<img src="${url}" alt="">`;

    }
  }

function renderItemList(holder, items){
  holder.innerHTML = '<div class="item-list"></div>';
  const list = holder.querySelector(".item-list");

    const row = document.createElement("div");

      <div class="ilr-thumb">🧰</div>

    `;

    list.appendChild(row);

      getFileBlobURL(it.mainImageId).then(url=>{ if(url) row.querySelector(".ilr-thumb").innerHTML = `<img src="${url}">`; });

function renderIndicatorsHtml(indicators, compact){
  if(!indicators || !indicators.length) return "";
  let html = '<div class="ind-row">';
  indicators.forEach(ind=>{
    if(ind.type==="badge"){
      const bc = BADGE_COLORS.find(b=>b.v===ind.color) || BADGE_COLORS[0];
      html += `<span class="ind badge-${ind.color||'ok'}">${bc.ico} ${esc(ind.value||ind.label||"")}</span>`;
    } else if(ind.type==="progress"){
      const pct = Math.max(0, Math.min(100, Number(ind.value)||0));
      html += `<span class="ind"><span class="ind-lbl">${esc(ind.label||"")}</span><span class="ind-progress"><span class="ind-progress-fill" style="width:${pct}%"></span></span><span class="ind-val">${pct}%</span></span>`;
    } else {
      html += `<span class="ind"><span class="ind-lbl">${esc(ind.label||"")}</span><span class="ind-val">${esc(ind.value||"")}</span></span>`;
    }
  });
  html += "</div>";
  return html;
}

function openLightbox(url){
  const modal = document.createElement("div");

async function confirmDeleteItem(itemId){
  if(!confirm("هل تريد حذف هذا العنصر نهائيًا؟ سيتم حذف صوره ومستنداته أيضًا.")) return;
  const it = state.items.find(i=>i.id===itemId);
  if(!it) return;
  for(const fid of (it.imageIds||[])) await deleteFile(fid);
  for(const d of (it.docs||[])) await deleteFile(d.fileId);
  await idbDelete("items", itemId);
  state.items = state.items.filter(i=>i.id!==itemId);
  toast("تم حذف العنصر", "ok");
  navigateTo({type:"folder", id: it.folderId});
  renderSidebarTree();
}

/* =========================================================
   البحث
   ========================================================= */
function matchItem(it, q){
  const hay = [it.name, it.model, it.manufacturer, it.serial, it.partNumber, it.notes, (it.tags||[]).join(" ")];
  const folder = getFolder(it.folderId);
  if(folder) hay.push(folder.name);
  if(it.fields) Object.values(it.fields).forEach(v=> hay.push(String(v)));
  const text = hay.join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(term=> text.includes(term));
}
function runSearch(q){
  const results = state.items.filter(it=> matchItem(it, q)).slice(0, 30);
  const box = document.getElementById("searchResults");
  box.classList.remove("hidden");
  if(!results.length){ box.innerHTML = `<div class="sres-empty">لا توجد نتائج لـ «${esc(q)}»</div>`; return; }
  box.innerHTML = "";
  results.forEach(it=>{
    const path = getFolderPath(it.folderId).map(f=>f.name).join(" / ");
    const row = document.createElement("div");
    row.className = "sres-item";
    row.innerHTML = `<div><div class="sres-name">${esc(it.name)}</div><div class="sres-meta">${esc(it.model||"")}</div></div><div class="sres-loc">${esc(path)}</div>`;
    row.onclick = ()=>{ box.classList.add("hidden"); document.getElementById("searchInput").value=""; navigateTo({type:"item", id:it.id}); };
    box.appendChild(row);
  });
}
function renderSearchView(c, q){
  const results = state.items.filter(it=> matchItem(it, q));
  c.innerHTML = `
    <div class="view-title"><h1>🔎 نتائج البحث</h1><span class="sub">"${esc(q)}" — ${results.length} نتيجة</span></div>
    <div id="searchViewHolder"></div>
  `;
  if(!results.length){
    document.getElementById("searchViewHolder").innerHTML = `<div class="empty-state"><div class="ico">🔎</div><div class="t">لا توجد نتائج مطابقة</div></div>`;
    return;
  }
  renderItemGallery(document.getElementById("searchViewHolder"), results);
}

        <select id="fColumns">
          ${[2,3,4,6].map(n=>`<option value="${n}" ${(Number(f.columns)||4)===n?'selected':''}>${n} عناصر في الصف</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>قالب الحقول (المواصفات التي تظهر تلقائيًا لكل عنصر داخل هذا المجلد أو مجلداته الفرعية)</label>
        <div id="ftRows"></div>
        <button type="button" class="btn small" id="addFieldRow">+ إضافة حقل</button>
      </div>
    </div>
    <div class="modal-foot">
      <div class="left">${editing? '<button class="btn danger small" id="delFolderBtn">🗑 حذف المجلد</button>' : ''}</div>
      <div class="right"><button class="btn" id="mCancel">إلغاء</button><button class="btn primary" id="mSave">حفظ</button></div>
    </div>
  `, false);

  document.getElementById("mClose").onclick = closeModal;
  document.getElementById("mCancel").onclick = closeModal;
  document.querySelectorAll(".icon-pick").forEach(b=> b.onclick = ()=>{ f.icon=b.dataset.ic; document.querySelectorAll(".icon-pick").forEach(x=>x.style.cssText=""); b.style.borderColor="var(--amber)"; b.style.color="var(--amber)"; });
  document.querySelectorAll(".color-pick").forEach(b=> b.onclick = ()=>{ f.color=b.dataset.cl; document.querySelectorAll(".color-pick").forEach(x=>x.style.borderColor="transparent"); b.style.borderColor="#fff"; });

  let fieldRows = (f.fieldsTemplate||[]).map(x=>Object.assign({},x));
  function renderFtRows(){
    const box = document.getElementById("ftRows");
    box.innerHTML = "";
    fieldRows.forEach((fr, idx)=>{
      const row = document.createElement("div");
      row.className = "ft-row";
      row.innerHTML = `
        <input placeholder="اسم الحقل (مثال: مدى القياس)" value="${esc(fr.label)}" data-k="label">
        <select data-k="type">${FIELD_TYPES.map(t=>`<option value="${t.v}" ${t.v===fr.type?'selected':''}>${t.l}</option>`).join("")}</select>
        <input placeholder="وحدة (اختياري)" value="${esc(fr.unit||"")}" data-k="unit">
        <label style="display:flex;align-items:center;gap:5px;font-size:11px;white-space:nowrap;"><input type="checkbox" data-k="showInCard" ${fr.showInCard!==false?'checked':''}> عرض</label>
        <button type="button" class="btn small danger" title="حذف">🗑</button>
      `;
      row.querySelector("[data-k=label]").oninput = (e)=> fr.label = e.target.value;
      row.querySelector("[data-k=type]").onchange = (e)=> fr.type = e.target.value;
      row.querySelector("[data-k=unit]").oninput = (e)=> fr.unit = e.target.value;
      row.querySelector("[data-k=showInCard]").onchange = (e)=> fr.showInCard = e.target.checked;
      row.querySelector("button").onclick = ()=>{ fieldRows.splice(idx,1); renderFtRows(); };
      box.appendChild(row);
    });
  }
  renderFtRows();
  document.getElementById("addFieldRow").onclick = ()=>{
    fieldRows.push({id: uid("fld_f"), label:"", type:"text", unit:"", showInCard: fieldRows.length<4});
    renderFtRows();
  };

  if(editing){
    document.getElementById("delFolderBtn").onclick = async ()=>{
      const deep = countAllFoldersDeep(f.id);
      const itemCount = countItemsDeep(f.id);
      if(!confirm(`سيتم حذف هذا المجلد${deep? " و"+deep+" مجلد فرعي":""} و${itemCount} عنصر بداخله نهائيًا. متابعة؟`)) return;
      await deleteFolderDeep(f.id);
      toast("تم حذف المجلد", "ok");
      closeModal();
      navigateTo({type: f.parentId? "folder":"home", id: f.parentId||undefined});
      renderSidebarTree();
    };
  }

  document.getElementById("mSave").onclick = async ()=>{
    const name = document.getElementById("fName").value.trim();
    if(!name){ toast("اكتب اسم المجلد", "err"); return; }
    f.name = name;
    f.description = document.getElementById("fDesc").value.trim();
    f.columns = [2,3,4,6].includes(Number(document.getElementById("fColumns").value)) ? Number(document.getElementById("fColumns").value) : 4;
    f.fieldsTemplate = fieldRows.filter(fr=>fr.label.trim()).map(fr=>({id: fr.id||uid("fld_f"), label:fr.label.trim(), type:fr.type||"text", unit:fr.unit||"", showInCard: fr.showInCard!==false}));
    await saveAndFlag("folders", f);
    if(!editing) state.folders.push(f);
    else state.folders = state.folders.map(x=>x.id===f.id? f : x);
    closeModal();
    renderSidebarTree();
    navigateTo({type:"folder", id: f.id});
    toast("تم حفظ المجلد", "ok");
  };
}

async function deleteFolderDeep(folderId){
  for(const child of getChildFolders(folderId)) await deleteFolderDeep(child.id);
  for(const it of getItemsInFolder(folderId)){
    for(const fid of (it.imageIds||[])) await deleteFile(fid);
    for(const d of (it.docs||[])) await deleteFile(d.fileId);
    await idbDelete("items", it.id);
  }
  state.items = state.items.filter(i=>i.folderId!==folderId);
  await idbDelete("folders", folderId);
  state.folders = state.folders.filter(f=>f.id!==folderId);
}

/* =========================================================
   مودال: إضافة/تعديل عنصر (جهاز/أداة)
   ========================================================= */
function openItemModal(itemId, folderId){
  const editing = !!itemId;
  const it = editing ? JSON.parse(JSON.stringify(state.items.find(i=>i.id===itemId))) : {
    id: uid("itm"), folderId, name:"", model:"", manufacturer:"", serial:"", partNumber:"", type:"", status:"",
    fields:{}, tags:[], mainImageId:null, imageIds:[], docs:[], links:[], indicators:[], notes:"",
    createdAt: Date.now(), updatedAt: Date.now()
  };
  state.editingItemId = it.id;
  state.pendingImages = [];
  state.pendingDocs = [];

    <div class="modal-head"><h2>${editing? '✎ تعديل العنصر':'＋ عنصر جديد'}</h2><button class="modal-close" id="mClose">✕</button></div>

          <div class="field"><label>الرقم التسلسلي</label><input id="iSerial" value="${esc(it.serial)}"></div>

        <div class="field-row">
          <div class="field"><label>النوع</label><input id="iType" value="${esc(it.type)}" placeholder="جهاز / أداة / حساس..."></div>
          <div class="field"><label>الحالة</label><input id="iStatus" value="${esc(it.status)}" placeholder="متوفر / يحتاج صيانة..."></div>
        </div>
        ${template.length? `<div class="sec-head"><h2>مواصفات المجلد</h2><div class="line"></div></div><div id="specFields"></div>` : `<div style="color:var(--dim2);font-size:12px">لا يوجد قالب حقول لهذا المجلد بعد — يمكنك إضافته من إعدادات المجلد.</div>`}
      </div>
      <div class="mtab-panel" data-panel="images">
        <div class="img-drop" id="imgDrop">📷 اسحب الصور هنا أو اضغط للاختيار (يمكن اختيار أكثر من صورة)</div>
        <div class="img-strip" id="imgStrip"></div>
        <div class="sec-head" style="margin-top:18px"><h2>المستندات (Datasheet / دليل / معايرة)</h2><div class="line"></div></div>
        <button type="button" class="btn small" id="addDocBtn">📄 إضافة مستند</button>
        <div id="docStrip" style="margin-top:10px"></div>
      </div>
      <div class="mtab-panel" data-panel="extra">
        <div class="field"><label>الوسوم (افصل بينها بفاصلة)</label><input id="iTags" value="${esc((it.tags||[]).join(', '))}" placeholder="24V, PT100, Industrial"></div>
        <div class="field"><label>روابط (رابط لكل سطر — عنوان::رابط اختياري)</label><textarea id="iLinks" rows="3" placeholder="صفحة المنتج::https://...">${esc((it.links||[]).map(l=> (l.label? l.label+"::":"")+l.url).join("\n"))}</textarea></div>
        <div class="field"><label>ملاحظات</label><textarea id="iNotes" rows="4">${esc(it.notes||"")}</textarea></div>
      </div>
      <div class="mtab-panel" data-panel="indicators">
        <div id="indRows"></div>
        <button type="button" class="btn small" id="addIndRow">+ إضافة مؤشر</button>
      </div>
    </div>
    <div class="modal-foot">
      <div class="left"></div>
      <div class="right"><button class="btn" id="mCancel">إلغاء</button><button class="btn primary" id="mSave">حفظ</button></div>
    </div>
  `, true);

  document.getElementById("mClose").onclick = closeModal;
  document.getElementById("mCancel").onclick = closeModal;
  document.querySelectorAll(".mtab").forEach(tab=>{
    tab.onclick = ()=>{
      document.querySelectorAll(".mtab").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll(".mtab-panel").forEach(x=>x.classList.remove("active"));
      tab.classList.add("active");
      document.querySelector(`.mtab-panel[data-panel="${tab.dataset.tab}"]`).classList.add("active");
    };
  });

  /* مواصفات المجلد الديناميكية */
  if(template.length){
    const box = document.getElementById("specFields");
    template.forEach(f=>{
      const row = document.createElement("div");
      row.className = "field";
      row.innerHTML = `<label>${esc(f.label)}${f.unit? " ("+esc(f.unit)+")":""}</label><input data-fid="${f.id}" value="${esc(it.fields && it.fields[f.id] || "")}">`;
      box.appendChild(row);
    });
  }

  /* الصور */
  let localImageIds = (it.imageIds||[]).slice();
  let localMainId = it.mainImageId || null;
  async function renderImgStrip(){
    const strip = document.getElementById("imgStrip");
    strip.innerHTML = "";
    for(const fid of localImageIds){
      const t = document.createElement("div");
      t.className = "img-thumb" + (fid===localMainId? " is-main":"");
      t.innerHTML = `<button type="button" class="rm">✕</button>${fid===localMainId? '<div class="main-tag">رئيسية</div>':''}`;
      strip.appendChild(t);
      t.onclick = (e)=>{ if(e.target.closest(".rm")) return; localMainId = fid; renderImgStrip(); };
      t.querySelector(".rm").onclick = async (e)=>{
        e.stopPropagation();
        localImageIds = localImageIds.filter(x=>x!==fid);
        if(localMainId===fid) localMainId = localImageIds[0]||null;
        renderImgStrip();
      };
      const url = await getFileBlobURL(fid);
      if(url){ const img=document.createElement("img"); img.src=url; t.prepend(img); }
    }
    for(const p of state.pendingImages){
      const t = document.createElement("div");
      t.className = "img-thumb" + (p.tempId===localMainId? " is-main":"");
      const url = URL.createObjectURL(p.blob);
      t.innerHTML = `<img src="${url}"><button type="button" class="rm">✕</button>${p.tempId===localMainId? '<div class="main-tag">رئيسية</div>':''}`;
      t.onclick = (e)=>{ if(e.target.closest(".rm")) return; localMainId = p.tempId; renderImgStrip(); };
      t.querySelector(".rm").onclick = (e)=>{ e.stopPropagation(); state.pendingImages = state.pendingImages.filter(x=>x.tempId!==p.tempId); if(localMainId===p.tempId) localMainId=null; renderImgStrip(); };
      strip.appendChild(t);
    }
  }
  renderImgStrip();
  const imgDrop = document.getElementById("imgDrop");
  imgDrop.onclick = ()=> document.getElementById("hiddenFileInput").click();
  ["dragover","dragenter"].forEach(ev=> imgDrop.addEventListener(ev, e=>{ e.preventDefault(); imgDrop.classList.add("drag"); }));
  ["dragleave","drop"].forEach(ev=> imgDrop.addEventListener(ev, e=>{ e.preventDefault(); imgDrop.classList.remove("drag"); }));
  imgDrop.addEventListener("drop", e=>{ handleNewImageFiles(e.dataTransfer.files, localMainId, ()=>renderImgStrip(), (m)=>localMainId=m); });
  const hiddenFileInput = document.getElementById("hiddenFileInput");
  hiddenFileInput.onchange = ()=>{ handleNewImageFiles(hiddenFileInput.files, localMainId, ()=>renderImgStrip(), (m)=>localMainId=m); hiddenFileInput.value=""; };
  function handleNewImageFiles(fileList, curMain, onDone, setMain){
    Array.from(fileList||[]).forEach(file=>{
      if(!file.type.startsWith("image/")) return;
      const tempId = uid("pend");
      state.pendingImages.push({tempId, blob:file, name:file.name});
      if(!curMain && !localMainId){ localMainId = tempId; }
    });
    onDone();
  }

  /* المستندات */
  let localDocs = (it.docs||[]).slice();
  function renderDocStrip(){
    const box = document.getElementById("docStrip");
    box.innerHTML = "";
    localDocs.forEach((d,idx)=>{
      const row = document.createElement("div");
      row.className = "doc-row";
      row.innerHTML = `<span>📄</span><span class="n">${esc(d.name)}</span><button type="button" class="btn small danger">🗑</button>`;
      row.querySelector("button").onclick = ()=>{ localDocs.splice(idx,1); renderDocStrip(); };
      box.appendChild(row);
    });
    state.pendingDocs.forEach((d,idx)=>{
      const row = document.createElement("div");
      row.className = "doc-row";
      row.innerHTML = `<span>📄</span><span class="n">${esc(d.name)} <i style="color:var(--dim2)">(جديد)</i></span><button type="button" class="btn small danger">🗑</button>`;
      row.querySelector("button").onclick = ()=>{ state.pendingDocs.splice(idx,1); renderDocStrip(); };
      box.appendChild(row);
    });
  }
  renderDocStrip();
  document.getElementById("addDocBtn").onclick = ()=> document.getElementById("hiddenDocInput").click();
  document.getElementById("hiddenDocInput").accept = ".pdf,application/pdf";
  document.getElementById("hiddenDocInput").onchange = (e)=>{
    Array.from(e.target.files||[]).forEach(file=>{
      if(file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)){ toast("يسمح هنا بملفات PDF فقط", "err"); return; }
      state.pendingDocs.push({tempId:uid("pdoc"), blob:file, name:file.name});
    });
    e.target.value = "";
    renderDocStrip();
  };

  /* المؤشرات */
  let localIndicators = (it.indicators||[]).map(x=>Object.assign({},x));
  function renderIndRows(){
    const box = document.getElementById("indRows");
    box.innerHTML = "";
    localIndicators.forEach((ind, idx)=>{
      const row = document.createElement("div");
      row.className = "ft-row";
      row.style.gridTemplateColumns = ind.type==="badge" ? "1fr 1fr 1fr auto" : "1fr 1fr 1fr auto";
      const typeOpts = INDICATOR_TYPES.map(t=>`<option value="${t.v}" ${t.v===ind.type?'selected':''}>${t.l}</option>`).join("");
      let valueInput;
      if(ind.type==="badge"){
        valueInput = `<select data-k="color">${BADGE_COLORS.map(b=>`<option value="${b.v}" ${b.v===ind.color?'selected':''}>${b.ico} ${b.l}</option>`).join("")}</select>`;
      } else {
        valueInput = `<input data-k="value" placeholder="القيمة" value="${esc(ind.value||"")}">`;
      }
      row.innerHTML = `
        <input data-k="label" placeholder="اسم المؤشر" value="${esc(ind.label||"")}">
        <select data-k="type">${typeOpts}</select>
        <span data-slot="value">${valueInput}</span>
        <button type="button" class="btn small danger">🗑</button>
      `;
      row.querySelector("[data-k=label]").oninput = e=> ind.label = e.target.value;
      row.querySelector("[data-k=type]").onchange = e=>{ ind.type = e.target.value; renderIndRows(); };
      const vEl = row.querySelector('[data-k="value"], [data-k="color"]');
      if(vEl){
        if(ind.type==="badge") vEl.onchange = e=> ind.color = e.target.value;
        else vEl.oninput = e=> ind.value = e.target.value;
      }
      row.querySelector("button").onclick = ()=>{ localIndicators.splice(idx,1); renderIndRows(); };
      box.appendChild(row);
    });
  }
  renderIndRows();
  document.getElementById("addIndRow").onclick = ()=>{ localIndicators.push({id:uid("ind"), label:"", type:"text", value:"", color:"ok"}); renderIndRows(); };

  /* حفظ العنصر */
  document.getElementById("mSave").onclick = async ()=>{
    const name = document.getElementById("iName").value.trim();
    if(!name){ toast("اكتب اسم العنصر", "err"); document.querySelector('.mtab[data-tab="basic"]').click(); return; }
    it.name = name;
    it.model = document.getElementById("iModel").value.trim();
    it.manufacturer = document.getElementById("iManufacturer").value.trim();
    it.serial = document.getElementById("iSerial").value.trim();
    it.partNumber = document.getElementById("iPartNumber").value.trim();
    it.type = document.getElementById("iType").value.trim();
    it.status = document.getElementById("iStatus").value.trim();
    it.fields = it.fields || {};
    document.querySelectorAll("#specFields [data-fid]").forEach(inp=>{ it.fields[inp.dataset.fid] = inp.value.trim(); });
    it.tags = document.getElementById("iTags").value.split(",").map(t=>t.trim()).filter(Boolean);
    it.links = document.getElementById("iLinks").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const parts = l.split("::");
      return parts.length>1 ? {label:parts[0].trim(), url:parts.slice(1).join("::").trim()} : {label:"", url:parts[0]};
    });
    it.notes = document.getElementById("iNotes").value.trim();
    it.indicators = localIndicators.filter(i=>i.label.trim());
    it.updatedAt = Date.now();

    setSaveBadge("saving");
    try{
      const idMap = {};
      for(const p of state.pendingImages){
        const fid = await storeFile(p.blob, p.name, p.blob.type);
        idMap[p.tempId] = fid;
        localImageIds.push(fid);
      }
      if(localMainId && idMap[localMainId]) localMainId = idMap[localMainId];
      it.imageIds = localImageIds;
      it.mainImageId = localMainId || localImageIds[0] || null;

      for(const p of state.pendingDocs){
        const fid = await storeFile(p.blob, p.name, p.blob.type);
        localDocs.push({id: uid("doc"), name: p.name, fileId: fid});
      }
      it.docs = localDocs;

      await idbPut("items", it);
    } finally { setTimeout(()=>setSaveBadge("idle"), 350); }

    if(editing) state.items = state.items.map(x=>x.id===it.id? it : x);
    else {
      state.items.push(it);
      try{
        if(window.HUB) window.HUB.addLog({type:'equipment_registered', value:1, label:it.name, note:[it.manufacturer,it.model].filter(Boolean).join(' — ')}, 'equipment');
      }catch(e){}
    }

    closeModal();
    renderSidebarTree();
    navigateTo({type:"item", id: it.id});
    toast("تم حفظ العنصر", "ok");
  };
}

  });
  document.getElementById("exportBtn").onclick = exportProject;
  document.getElementById("importBtn").onclick = ()=> document.getElementById("hiddenImportInput").click();
  document.getElementById("wipeBtn").onclick = async ()=>{
    if(!confirm("سيتم حذف كل المجلدات والعناصر والصور نهائيًا من هذا المتصفح. متابعة؟")) return;
    if(!confirm("تأكيد أخير: هذا الإجراء لا يمكن التراجع عنه.")) return;
    await idbClear("folders"); await idbClear("items"); await idbClear("files");
    state.folders = []; state.items = [];
    state.objectUrls.forEach(u=>URL.revokeObjectURL(u)); state.objectUrls.clear();
    toast("تم حذف كل البيانات", "ok");
    renderSidebarTree();
    navigateTo({type:"home"});
  };
}

/* =========================================================
   التصدير (ZIP)
   ========================================================= */
async function exportProject(){
  toast("جارٍ تجهيز ملف التصدير...");
  try{
    const zip = new JSZip();
    const manifest = {
      app: "workshop-equipment-db",
      version: 1,
      exportedAt: new Date().toISOString(),
      counts: {folders: state.folders.length, items: state.items.length}
    };
    zip.file("project/manifest.json", JSON.stringify(manifest, null, 2));
    zip.file("project/folders.json", JSON.stringify(state.folders, null, 2));
    zip.file("project/settings.json", JSON.stringify(state.settings, null, 2));

    const itemsMeta = [];
    const allFiles = await idbGetAll("files");
    const fileMap = new Map(allFiles.map(f=>[f.id,f]));
    // نسجّل أي صورة/مستند مرتبط بعنصر لكن ملفه الفعلي مش موجود في التخزين (مرجع يتيم) —
    // عشان المستخدم يعرف إن نسخة التصدير مش هتحتوي هذا الملف، بدل ما يكتشف غيابه بعدين بصمت.
    const missingFiles = [];

    for(const it of state.items){
      const clone = JSON.parse(JSON.stringify(it));
      const folder = zip.folder("equipment/" + it.id);
      const imageNames = [];
      for(const fid of (it.imageIds||[])){
        const frec = fileMap.get(fid);
        if(!frec){ missingFiles.push({item:it.name||it.id, type:"صورة", id:fid}); continue; }
        const ext = guessExt(frec.mime, frec.name);
        const fname = fid + ext;
        folder.folder("images").file(fname, frec.blob);
        imageNames.push({fileId: fid, filename: "images/"+fname, isMain: fid===it.mainImageId});
      }
      const docNames = [];
      for(const d of (it.docs||[])){
        const frec = fileMap.get(d.fileId);
        if(!frec){ missingFiles.push({item:it.name||it.id, type:"مستند", id:d.fileId, name:d.name}); continue; }
        const fname = d.fileId + "_" + (d.name||"file");
        folder.folder("documents").file(fname, frec.blob);
        docNames.push({fileId: d.fileId, filename: "documents/"+fname, name: d.name});
      }
      clone._images = imageNames;
      clone._docs = docNames;
      folder.file("data.json", JSON.stringify(clone, null, 2));
      itemsMeta.push({id: it.id, name: it.name, folderId: it.folderId});
    }
    zip.file("project/items_index.json", JSON.stringify(itemsMeta, null, 2));
    if(missingFiles.length){
      zip.file("project/export-warnings.json", JSON.stringify(missingFiles, null, 2));
    }

    const blob = await zip.generateAsync({type:"blob", compression:"DEFLATE", compressionOptions:{level:6}});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0,10);
    a.download = `equipment-db-${stamp}.zip`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    if(missingFiles.length){
      console.warn("ملفات مفقودة أثناء التصدير:", missingFiles);
      toast(`تم التصدير مع تحذير: ${missingFiles.length} صورة/مستند لها مرجع بدون ملف فعلي، لم تُدرَج في الأرشيف.`, "err", 7000);
    }else{
      toast("تم تصدير النسخة بنجاح", "ok");
    }
  }catch(err){
    console.error(err);
    toast("فشل التصدير: " + (err.message||err), "err");
  }
}
function guessExt(mime, name){
  if(name && name.includes(".")) return name.slice(name.lastIndexOf("."));
  if(mime==="image/png") return ".png";
  if(mime==="image/webp") return ".webp";
  if(mime==="image/gif") return ".gif";
  return ".jpg";
}

/* =========================================================
   الاستيراد (ZIP)
   ========================================================= */
document.addEventListener("DOMContentLoaded", ()=>{
  const importInput = document.getElementById("hiddenImportInput");
  importInput.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    e.target.value = "";
    if(!file) return;
    const mode = confirm("اضغط موافق للدمج مع البيانات الحالية، أو إلغاء لاستبدال كل البيانات الحالية بالكامل.") ? "merge" : "replace";
    if(mode==="replace" && !confirm("سيتم حذف كل البيانات الحالية قبل الاستيراد. متابعة؟")) return;
    await importProject(file, mode);
  });
});
async function importProject(file, mode){
  toast("جارٍ الاستيراد...");
  // فلسفة الاستيراد: عنصر واحد تالف (JSON غير صالح، صورة مفقودة من الأرشيف) بيتسجّل
  // كتحذير ويتخطى، ومايوقفش استيراد باقي العناصر. الاستبدال (mode=replace) بيتأخر لحد
  // ما نتأكد إن الأرشيف فيه على الأقل folders.json و items_index.json صالحين، عشان
  // بيانات المستخدم الحالية متتمسحش إلا لو فعلاً عندنا حاجة نستبدلها بيها.
  const rep = {itemsRestored:0, itemsFailed:[], imagesRestored:0, imagesMissing:[], docsRestored:0, docsMissing:[]};
  try{
    let zip;
    try{ zip = await JSZip.loadAsync(file); }
    catch(e){ throw new Error("الملف ده مش أرشيف ZIP صالح."); }

    const foldersEntry = zip.file("project/folders.json");
    if(!foldersEntry) throw new Error("project/folders.json مفقود من الأرشيف — هل هذا فعلاً ملف نسخة احتياطية لنفس البرنامج؟");
    const itemsIndexEntry = zip.file("project/items_index.json");
    if(!itemsIndexEntry) throw new Error("project/items_index.json مفقود من الأرشيف — الحزمة غير مكتملة.");

    let importedFolders, itemsIndex;
    try{ importedFolders = JSON.parse(await foldersEntry.async("string")); }
    catch(e){ throw new Error("project/folders.json تالف ولا يمكن تحليله."); }
    try{ itemsIndex = JSON.parse(await itemsIndexEntry.async("string")); }
    catch(e){ throw new Error("project/items_index.json تالف ولا يمكن تحليله."); }
    if(!Array.isArray(importedFolders)) importedFolders = [];
    if(!Array.isArray(itemsIndex)) itemsIndex = [];

    if(mode==="replace"){
      await idbClear("folders"); await idbClear("items"); await idbClear("files");
      state.folders = []; state.items = [];
    }

    const folderIdMap = {};
    for(const f of importedFolders){
      const newId = mode==="merge" ? uid("fld") : f.id;
      folderIdMap[f.id] = newId;
    }
    for(const f of importedFolders){
      try{
        const nf = Object.assign({}, f, {
          id: folderIdMap[f.id],
          parentId: f.parentId ? (folderIdMap[f.parentId]||null) : null
        });
        await idbPut("folders", nf);
        state.folders.push(nf);
      }catch(e){ rep.itemsFailed.push({item:"مجلد: "+(f.name||f.id), reason:String(e && e.message || e)}); }
    }

    for(const meta of itemsIndex){
      try{
        const entryPath = "equipment/" + meta.id + "/data.json";
        const entry = zip.file(entryPath);
        if(!entry){ rep.itemsFailed.push({item:meta.name||meta.id, reason:"data.json مفقود من الأرشيف لهذا العنصر"}); continue; }
        let data;
        try{ data = JSON.parse(await entry.async("string")); }
        catch(e){ rep.itemsFailed.push({item:meta.name||meta.id, reason:"data.json تالف لهذا العنصر"}); continue; }

        const newItemId = mode==="merge" ? uid("itm") : data.id;
        const newImageIds = [];
        let newMainId = null;
        for(const img of (data._images||[])){
          try{
            const zf = zip.file("equipment/" + meta.id + "/" + img.filename);
            if(!zf){ rep.imagesMissing.push({item:meta.name||meta.id, filename:img.filename}); continue; }
            const blob = await zf.async("blob");
            const fid = await storeFile(blob, img.filename);
            newImageIds.push(fid); rep.imagesRestored++;
            if(img.isMain) newMainId = fid;
          }catch(e){ rep.imagesMissing.push({item:meta.name||meta.id, filename:img.filename, reason:String(e && e.message || e)}); }
        }
        const newDocs = [];
        for(const d of (data._docs||[])){
          try{
            const zf = zip.file("equipment/" + meta.id + "/" + d.filename);
            if(!zf){ rep.docsMissing.push({item:meta.name||meta.id, name:d.name}); continue; }
            const blob = await zf.async("blob");
            const fid = await storeFile(blob, d.name);
            newDocs.push({id: uid("doc"), name: d.name, fileId: fid}); rep.docsRestored++;
          }catch(e){ rep.docsMissing.push({item:meta.name||meta.id, name:d.name, reason:String(e && e.message || e)}); }
        }
        const newItem = Object.assign({}, data, {
          id: newItemId,
          folderId: folderIdMap[data.folderId] || data.folderId,
          imageIds: newImageIds,
          mainImageId: newMainId || newImageIds[0] || null,
          docs: newDocs
        });
        delete newItem._images; delete newItem._docs;
        await idbPut("items", newItem);
        state.items.push(newItem);
        rep.itemsRestored++;
      }catch(e){ rep.itemsFailed.push({item:meta.name||meta.id, reason:String(e && e.message || e)}); }
    }

    renderSidebarTree();
    navigateTo({type:"home"});
    const summary = [`تم الاستيراد: ${rep.itemsRestored} عنصر، ${rep.imagesRestored} صورة، ${rep.docsRestored} مستند.`];
    if(rep.itemsFailed.length) summary.push(`⚠️ ${rep.itemsFailed.length} عنصر فشل: `+rep.itemsFailed.slice(0,5).map(x=>x.item).join('، ')+(rep.itemsFailed.length>5?' …':''));
    if(rep.imagesMissing.length) summary.push(`⚠️ ${rep.imagesMissing.length} صورة مفقودة من الأرشيف.`);
    if(rep.docsMissing.length) summary.push(`⚠️ ${rep.docsMissing.length} مستند مفقود من الأرشيف.`);
    if(rep.itemsFailed.length || rep.imagesMissing.length || rep.docsMissing.length){
      console.warn("تفاصيل الاستيراد الناقصة:", rep);
      toast(summary.join('\n'), "err", 9000);
    }else{
      toast(summary.join('\n'), "ok");
    }
  }catch(err){
    console.error(err);
    toast("فشل الاستيراد: " + (err.message||err), "err");
  }
}

window.addEventListener("DOMContentLoaded", boot);
