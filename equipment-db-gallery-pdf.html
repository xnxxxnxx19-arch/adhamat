/* ---------- مزامنة عنصر واحد: item.json + ملفاته (الجديد/المتغيّر بس) ---------- */
async function syncItem(it,base,idx,W,force,ctx){
  const sp=window.__SP;if(sp&&sp.holdItem(it,base)){sp.skipItem(it);return}
  const op=idx.items[it.id],po=op&&op.path===base?op:null,
    Eo={path:base,files:{},name:it.name,folderId:it.folderId||null};
  Eo.sha=await wt(base+"/item.json",JSON.stringify(it,null,2),po&&!force?po.sha:null,W,it.id);
  let fch=!po;
  for(const[fid,k]of refs(it)){
    if(Eo.files[fid])continue;
    const pf0=po&&po.files&&po.files[fid];
    if(sp&&sp.holdFile(fid,it,k)){if(pf0)Eo.files[fid]=pf0;sp.skipFile(fid,it);continue}
    const rec=await idbGet_real("files",fid);if(!rec||!rec.blob)continue;
    const p=base+"/"+k+"/"+fid+ext(rec.name),pf=po&&po.files&&po.files[fid];
    if(sp&&sp.holdPath(p)){if(pf0)Eo.files[fid]=pf0;sp.skipFile(fid,it);continue}
    let s;
    if(pf&&!force&&pf.path===p&&pf.size===rec.size&&pf.upd===rec.updatedAt)s=pf.sha;
    else{
      s=(await Promise.all([shaB(rec.blob),put(p,rec.blob)]))[0]; // الحساب والكتابة بالتوازي
      const f=await getf(p);if(f.size!==rec.blob.size)throw new Error("حجم غير مطابق: "+p);
      W.push({path:p,sha:s,size:rec.blob.size,blob:1,id:it.id});fch=true}
    Eo.files[fid]={path:p,kind:k,size:rec.size,sha:s,upd:rec.updatedAt,name:rec.name,mime:rec.mime}}
  if(!fch&&po&&JSON.stringify(po.files)!==JSON.stringify(Eo.files))fch=true;
  if(fch){await put(base+"/hashes.json",JSON.stringify(Eo.files,null,2));ctx.c=true}
  idx.items[it.id]=Eo}

/* ---------- المرور الواحد ---------- */
async function pass(){
  if(!bind()||STORAGE_MODE==="memory")return;
  if(!(await ensureFolderPermission(E.h,false)))throw new Error("folder-permission-required");
  if(!E.idx){
    E.idx=await loadIdx();
    if(!E.idx){
      let legacy=false;for(const n of["state.json","project.json"])try{await getf(n);legacy=true}catch(e){}
      if(legacy){ // مجلد بإصدار قديم: الكود القديم بيعمل نسخة احتياطية للملفات القديمة (مرة واحدة)
        await prevSync();E.idx=await loadIdx();
        if(E.idx){E.scan=false;await stamp(E.idx.savedAt)}
        return}
      E.idx={schema:2,savedAt:0,groups:{},items:{},unassigned:{},meta:null};E.scan=true}} // مجلد فاضي: نبدأ بفهرس فاضي ونكتب بالنظام الجديد
  const idx=E.idx,items=state.items,W=[],t0=Date.now(),ctx={c:false},
    stateIds=new Set(items.map(i=>i.id));
  if(!items.length&&!state.folders.length&&Object.keys(idx.items).length&&!E.allowEmpty)return; // حماية من الحالة الفاضية المؤقتة
  const dItems=new Set(E.dirty),dFiles=new Set(E.dirtyFiles),doScan=E.scan,forced=new Set(E.force);
  E.dirty.clear();E.dirtyFiles.clear();E.scan=false;E.force.clear();
  if(doScan)E.lastScan=Date.now();
  const sp=window.__SP;if(sp)sp.passStart({scan:doScan,items:items.length,dirtyItems:dItems.size,dirtyFiles:dFiles.size});
  let changed=false;const fails=[],extra=new Set();
  try{
    if(sp)sp.stage("meta");/* 1) الإعدادات والمجموعات (صغيرة، بتتقارن بالبصمة) */
    const mp=idx.meta&&idx.meta.sha,
      ms=await wt("meta.json",JSON.stringify({settings:state.settings,categories:state.categories,categorySchemas:state.categorySchemas},null,2),mp,W);
    if(ms!==mp)changed=true;idx.meta={path:"meta.json",sha:ms};
    const{gp,itemPath}=makePaths(idx);
    for(const f of state.folders){
      const p=gp[f.id],og=idx.groups[f.id],
        s=await wt(p+"/group.json",JSON.stringify(f,null,2),og&&og.path===p?og.sha:null,W);
      if(!og||og.path!==p||og.sha!==s||og.name!==f.name||og.parentId!==(f.parentId||null))changed=true;
      idx.groups[f.id]={path:p,sha:s,name:f.name,parentId:f.parentId||null}}
    if(state.folders.length||E.allowEmpty)for(const id of Object.keys(idx.groups))if(!(id in gp)){delete idx.groups[id];changed=true}

    if(sp)sp.stage("select");/* 2) تحديد العناصر المطلوب مزامنتها: المتغيّرة/الجديدة/اللي مسارها اتغيّر (+ الكل لو فحص شامل) */
    const paths=new Map(),work=[];
    for(const it of items){
      const oe=idx.items[it.id],p=itemPath(it);paths.set(it.id,p);
      let need=doScan||!oe||oe.path!==p||dItems.has(it.id)||forced.has(it.id);
      if(!need&&dFiles.size)for(const[fid]of refs(it))if(dFiles.has(fid)){need=true;break}
      if(need)work.push(it)}
    for(const id of dItems){ // عنصر اتحفظ في قاعدة البيانات ولسه ماتضافش لقائمة البرنامج
      if(stateIds.has(id)||E.deleted.has(id))continue;
      try{const it=await idbGet_real("items",id);
        if(it){paths.set(id,itemPath(it));work.push(it);extra.add(id)}}catch(e){}}

    if(sp){sp.stage("write");sp.sortWork(work)}/* 3) كتابة العناصر بالتوازي (أولوية: المتغيّر أولًا بحكم إن الباقي مش بيكتب حاجة) */
    const errs=await pool(work,POOL,it=>syncItem(it,paths.get(it.id),idx,W,forced.has(it.id),ctx));
    for(const[it,e]of errs){E.dirty.add(it.id);if(sp)sp.itemFail(it,e);if(forced.has(it.id))E.force.add(it.id);fails.push((it.name||it.id)+": "+e.message);console.warn("FastSync item failed:",it.name,e)}
    if(ctx.c||W.length)changed=true;
    if(sp)sp.itemsDone(work,errs);

    if(sp)sp.stage("del");/* 4) العناصر المحذوفة */
    for(const id of Object.keys(idx.items)){
      if(stateIds.has(id)||extra.has(id))continue;
      if(E.deleted.has(id)||E.allowEmpty||(doScan&&items.length)){delete idx.items[id];E.deleted.delete(id);changed=true}}

    if(sp)sp.stage("orphan");/* 5) ملفات غير مرتبطة بأي عنصر (في الفحص الشامل بس) */
    if(doScan){
      const used=new Set();for(const it of items)for(const[fid]of refs(it))used.add(fid);
      const keep={};
      for(const fid of await allKeys("files")){
        if(used.has(fid))continue;
        const rec=await idbGet_real("files",fid);if(!rec||!rec.blob)continue;
        const p="_unassigned/"+fid+ext(rec.name),pf=idx.unassigned[fid];let s;
        if(sp&&sp.holdPath(p)){if(pf)keep[fid]=pf;continue}
        if(pf&&pf.size===rec.size&&pf.upd===rec.updatedAt&&pf.path===p)s=pf.sha;
        else{s=(await Promise.all([shaB(rec.blob),put(p,rec.blob)]))[0];W.push({path:p,sha:s,size:rec.blob.size,blob:1,id:null});changed=true}
        keep[fid]={path:p,size:rec.size,sha:s,upd:rec.updatedAt,name:rec.name,mime:rec.mime}}
      if(Object.keys(keep).sort().join("|")!==Object.keys(idx.unassigned).sort().join("|"))changed=true;
      idx.unassigned=keep}

    if(sp)sp.stage("index");/* 6) الفهرس — بيتكتب آخر حاجة وبس لو فيه تغيير فعلي */
    if(changed&&!(sp&&sp.holdAll())){

      const t=JSON.stringify(idx,null,2);await put("index.json",t);
      const f=await getf("index.json");if(f.size!==ulen(t))throw new Error("حجم غير مطابق: index.json");
      try{
        await idbPut_real("meta",{key:"folderIdxAt",value:idx.savedAt});
        await idbPut_real("meta",{key:"lastFolderSyncAt",value:Date.now()});
        await idbPut_real("meta",{key:"lastFolderRevision",value:idx.savedAt})}catch(e){}
      J("fast_sync",{written:W.length,items:work.length,ms:Date.now()-t0})}
    if(!fails.length)E.allowEmpty=false;
    if(!E.dirty.size&&!E.dirtyFiles.size&&!E.scan&&!fails.length&&E.pend){E.pend=false;try{await idbDelete_real("meta","folderSyncPending")}catch(e){}}

async function stamp(v){
  try{await idbPut_real("meta",{key:"folderIdxAt",value:v});await idbDelete_real("meta","folderSyncPending")}catch(e){}
  E.pend=false}

/* ---------- التحقق العميق في الخلفية (بصمة SHA) بدون ما يعطّل الحفظ ---------- */
function queueVerify(W){
  const w=W.filter(x=>x.id&&(x.blob||x.path.endsWith("/item.json")));
  if(!w.length)return;E.vq.push(...w);clearTimeout(E.vt);E.vt=setTimeout(drain,2500)}
function superseded(w){
  const e=E.idx&&E.idx.items[w.id];if(!e)return true;
  if(w.blob){const fe=Object.values(e.files).find(x=>x.path===w.path);return !fe||fe.sha!==w.sha}
  return e.path+"/item.json"!==w.path||e.sha!==w.sha}
async function drain(){
  if(E.running||E.dirty.size||E.dirtyFiles.size||E.paused||(window.__SP&&window.__SP.holdAll())){E.vt=setTimeout(drain,2500);return}
  const w=E.vq.shift();if(!w)return;
  try{
    if(!superseded(w)){
      const f=await getf(w.path);
      const ok=w.blob?(f.size===w.size&&await shaB(f)===w.sha):(await sha(await f.text())===w.sha);
      if(window.__SP)window.__SP.verified(w,!!ok);
      if(!ok)throw new Error("بصمة مختلفة")}}
  catch(e){
    J("fast_verify_fail",{path:w.path,err:String(e&&e.message||e)});
    if(window.__SP)window.__SP.verified(w,false,e);
    try{S.banner&&S.banner("⛔ فشل التحقق بعد الحفظ: "+w.path)}catch(_){}
    E.force.add(w.id);E.dirty.add(w.id);schedule(0)}
  E.vt=setTimeout(drain,E.vq.length?30:0)}

/* ---------- الجدولة (دور واحد، مفيش طلب بيضيع) ---------- */
const pending=()=>E.dirty.size||E.dirtyFiles.size||E.scan||E.force.size;
function schedule(ms){if(!bind()||STORAGE_MODE==="memory")return;clearTimeout(E.timer);E.timer=setTimeout(()=>{run()},ms==null?DEBOUNCE:ms)}
function backoff(){E.retry++;clearTimeout(E.retryT);E.retryT=setTimeout(()=>{E.retryT=null;run()},Math.min(30000,2000*E.retry))}
function run(){
  if(E.running){E.again=true;return E.running}
  E.running=(async()=>{
    try{
      do{
        E.again=false;
        while(E.paused)await sleep(100);
        folderSyncBusy=true;
        try{await pass();E.retry=0;folderSyncError=null;E.lastErr=null}
        catch(e){
          folderSyncError=e;E.lastErr=e;console.warn("FastSync:",e);
          if(e&&e.message==="folder-permission-required"){try{folderPermissionNeedsActivation=true}catch(_){}}
          else backoff();
          break}
        finally{folderSyncBusy=false}
      }while(E.again||(pending()&&!E.retryT))
    }finally{E.running=null}})();
  return E.running}

/* ---------- استبدال دوال المزامنة القديمة ---------- */
syncFolderStorageNow=async function(){ // مزامنة صريحة (ربط/دمج/استيراد): فحص شامل وبننتظر لحد ما تخلص
  if(!bind()||STORAGE_MODE==="memory")return;
  E.scan=true;E.lastErr=null;
  for(let g=0;g<5;g++){await run();if(E.lastErr||!pending())break}
  if(E.lastErr)throw E.lastErr};
requestFolderSync=function(){ // بتجدول وترجع فورًا — الواجهة مابتستناش المزامنة
  if(linkedDirHandle&&STORAGE_MODE!=="memory")schedule();
  return Promise.resolve()};

/* ---------- تتبّع التغييرات من طبقة التخزين ---------- */
function setPending(){
  if(E.pend)return;E.pend=true;
  try{idbPut_real("meta",{key:"folderSyncPending",value:Date.now()}).catch(()=>{})}catch(e){}}
const oPut=idbPut,oDel=idbDelete,oClr=idbClear;
idbPut=async function(s,v){
  const r=await oPut.apply(this,arguments);
  try{if(bind()){

    else if(s==="files"&&v)E.dirtyFiles.add(v.id);

idbDelete=async function(s,k){

/* ---------- التحميل من المجلد: مايحصلش لو البرنامج بالفعل بنفس النسخة (أو أحدث) ---------- */
const oSnap=readFolderSnapshot,oRestore=restoreAllFromFolder,oLink=linkBackupFolder,oPull=pullFolderData;
readFolderSnapshot=async function(h){
  if(!E.userAct&&state.items.length&&bind()&&h===E.h){
    try{
      const[pn,at,ix]=await Promise.all([idbGet_real("meta","folderSyncPending"),idbGet_real("meta","folderIdxAt"),rj("index.json")]);
      const pend=!!(pn&&pn.value);
      if(pend||(ix&&at&&at.value===ix.savedAt)){
        E.scan=pend; // فيه تعديلات لسه ماتزامنتش => نفحص ونكمّلها، غير كده البرنامج محدّث
        return{__same:true,schemaVersion:5,savedAt:ix?ix.savedAt:0,folders:state.folders,items:state.items,
          settings:state.settings,categories:state.categories,categorySchemas:state.categorySchemas}}}
    catch(e){}}
  return oSnap.apply(this,arguments)};

  if(snap&&snap.__same)return; // البيانات الحالية هي نفس نسخة المجلد (أو أحدث منها وفيها تعديلات لسه هتتزامن)

  finally{
    E.paused--;E.dirs.clear();E.idx=null;E.dirty.clear();E.dirtyFiles.clear();E.force.clear();E.deleted.clear();E.scan=!ok;
    if(ok){try{E.idx=await loadIdx();if(E.idx)await stamp(E.idx.savedAt)}catch(e){}}}};
linkBackupFolder=async function(){E.userAct=true;try{return await oLink.apply(this,arguments)}finally{E.userAct=false}};
pullFolderData=async function(){E.userAct=true;try{return await oPull.apply(this,arguments)}finally{E.userAct=false}};

/* ---------- نبضة خفيفة: بتكمّل أي شغل معلّق، وفحص شامل هادي كل فترة كشبكة أمان ---------- */
window.__FS={
  tick(){
    if(!bind()||STORAGE_MODE==="memory"||E.running)return;
    if(document.visibilityState==="visible"&&Date.now()-E.lastScan>SCAN_EVERY&&!E.dirty.size)E.scan=true;
    if(pending()||E.lastErr){if(!E.retryT)schedule(0)}},
  state:E,kick:schedule,
  plan(){if(!bind())return null;const idx=E.idx||{schema:2,items:{},groups:{},unassigned:{}},m=makePaths(idx);return{idx,gp:m.gp,itemPath:m.itemPath,refs,ext,RT,hasIdx:!!E.idx}},
  info:{
    async idx(){ if(!bind())return null; if(!E.idx){try{E.idx=await loadIdx()}catch(e){}} return E.idx },
    handle:()=>bind()?E.h:null,
    async size(p){ try{ return (await getf(p)).size }catch(e){ return null } },
    pending:()=>!!(pending()||E.running)}};
})();

<script>
/* ===== SyncPipe: خط المزامنة — عرض كامل لكل الملفات + تحكم (إيقاف / استئناف / ابدأ الآن) =====
   - بيقرأ حالة محرك FastSync كما هي (window.__FS) ومابيغيّرش بنية المجلد ولا صيغة الملفات.
   - المحرك بيسأل window.__SP قبل ما يكتب أي ملف: لو الملف/العنصر/المجموعة/الموقع موقوف بيتخطّاه
     (والباقي بيكمّل عادي)، ولما تستأنف بيرجع يتحط في الدور.
   - الإيقافات بتتحفظ في localStorage (مفتاح syncpipe.v1) عشان تفضل بعد إعادة فتح البرنامج. */
(function(){"use strict";
if(window.__SP)return;
const LSK="syncpipe.v1",CHUNK=4*1024*1024,SCAN_EVERY=5*60*1000;
const ST=()=>typeof state!=="undefined"?state:{items:[],folders:[],view:{}};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const N=n=>(Number(n)||0).toLocaleString("en-US");
const ext=n=>(/\.[A-Za-z0-9]{1,5}$/.exec(n||"")||[""])[0];
function fb(n){n=Number(n)||0;if(n<1024)return N(n)+" بايت";const u=["ك.ب","م.ب","ج.ب"];let v=n/1024,i=0;while(v>=1024&&i<2){v/=1024;i++}return (+v.toFixed(v>=100?0:1))+" "+u[i]}
function fdur(ms){ms=Number(ms)||0;if(ms<1000)return Math.round(ms)+" م.ث";const s=ms/1000;if(s<60)return s.toFixed(1)+" ث";const m=Math.floor(s/60);return m+" د "+Math.round(s%60)+" ث"}

const KL={images:"صورة العنصر",docs:"مستند",notebook:"صورة شرح","fault-backgrounds":"خلفية صفحة أعطال","fault-notes":"صورة نقطة عطل",json:"بيانات العنصر",unassigned:"ملف بلا عنصر"};

const ST_RANK={writing:0,failed:1,held:2,queued:3,idle:4,missing:5,saved:6};

/* ---------------- الحالة ---------------- */
const S={holds:[],staleItems:{},staleFiles:{},inflight:new Map(),hist:[],fails:new Map(),fileFails:new Map(),
  verified:new Map(),verifyErr:new Map(),passes:[],cur:null,priority:new Set(),waiters:[],
  meta:new Map(),metaTs:0,metaDirty:true,R:null,filtered:[],host:null,tm:null,
  ui:{tab:"files",status:"all",kind:"all",gid:"",loc:"",q:"",limit:60,open:new Set(),logBytes:null}};
try{const j=JSON.parse(localStorage.getItem(LSK)||"null");
  if(j){S.holds=Array.isArray(j.holds)?j.holds:[];S.staleItems=j.si||{};S.staleFiles=j.sf||{}}}catch(e){}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LSK,JSON.stringify({holds:S.holds,si:S.staleItems,sf:S.staleFiles}))}catch(e){}},300)}
function wake(){S.waiters.splice(0).forEach(f=>{try{f()}catch(e){}})}

/* ---------------- مجموعات وعناصر (كاش خفيف) ---------------- */
let dTs=0,dKey=-1,dKids=new Map(),dCache=new Map();
function descOf(gid){
  const fl=ST().folders||[];
  if(Date.now()-dTs>1000||dKey!==fl.length){dTs=Date.now();dKey=fl.length;dKids=new Map();dCache=new Map();
    for(const f of fl){const p=f.parentId||"";(dKids.get(p)||dKids.set(p,[]).get(p)).push(f.id)}}
  let s=dCache.get(gid);if(s)return s;
  s=new Set();const walk=id=>{if(s.has(id))return;s.add(id);(dKids.get(id)||[]).forEach(walk)};walk(gid);
  dCache.set(gid,s);return s}
let iTs=0,iLen=-1,iMap=new Map(),fTs=0,fMap=new Map();
function itemById(id){const it=ST().items||[];if(Date.now()-iTs>2000||iLen!==it.length){iTs=Date.now();iLen=it.length;iMap=new Map(it.map(x=>[x.id,x]))}return iMap.get(id)}
function refs(it){const R=[],a=(i,k)=>i&&R.push([i,k]);
  (it.imageIds||[]).forEach(i=>a(i,"images"));(it.docs||[]).forEach(d=>d&&a(d.fileId,"docs"));
  (it.notebookData?.images||[]).forEach(x=>a(x.id,"notebook"));
  (it.notebookData?.faultTracking?.pages||[]).forEach(p=>{a(p.imageId,"fault-backgrounds");(p.hotspots||[]).forEach(hs=>(hs.content?.images||[]).forEach(x=>a(x.id,"fault-notes")))});
  return R}
function fidMap(){if(Date.now()-fTs>2000){fTs=Date.now();fMap=new Map();for(const it of ST().items||[])for(const[fid,k]of refs(it))if(!fMap.has(fid))fMap.set(fid,{it,k})}return fMap}
const fidOf=p=>{const m=/([^/]+?)(?:\.[A-Za-z0-9]{1,5})?$/.exec(p||"");return m?m[1]:""};

/* ---------------- منطق الإيقاف: صف افتراضي {gid,itemId,kind,fid,destPath} ---------------- */
function covers(h,r){
  switch(h.type){
    case"all":return true;
    case"group":return descOf(h.key).has(r.gid);
    case"item":return h.key===r.itemId;
    case"kind":return !!r.kind&&r.kind===h.key;
    case"file":return !!r.fid&&r.fid===h.key;
    case"path":{const p=r.destPath;return !!p&&(p===h.key||p.startsWith(h.key+"/"))}
  }return false}
function findCover(r,skip){for(const h of S.holds)if(h!==skip&&covers(h,r))return h;return null}
function heldNow(path){
  const fid=fidOf(path),m=fidMap().get(fid);
  return !!findCover({gid:m?(m.it.folderId||"_root"):"\0",itemId:m?m.it.id:"\0",kind:m?m.k:null,fid,destPath:path})}
async function waitHold(path){while(heldNow(path))await new Promise(r=>{S.waiters.push(r);setTimeout(r,2000)})}

/* ---------------- الواجهة اللي المحرك بينادي عليها ---------------- */
const SP=window.__SP={
  holdAll:()=>S.holds.some(h=>h.type==="all"),
  holdItem:(it,base)=>!!findCover({gid:it.folderId||"_root",itemId:it.id,kind:null,fid:null,destPath:base}),
  holdFile:(fid,it,k)=>!!findCover({gid:it.folderId||"_root",itemId:it.id,kind:k,fid,destPath:null}),
  holdPath:p=>!!findCover({gid:"\0",itemId:"\0",kind:null,fid:null,destPath:p}),
  holdJson(path,id){if(path==="index.json")return false;const it=id?itemById(id):null;
    return !!findCover({gid:it?(it.folderId||"_root"):"\0",itemId:it?it.id:"\0",kind:null,fid:null,destPath:path})},
  skipItem(it){S.staleItems[it.id]=Date.now();if(S.cur)S.cur.skipItems.add(it.id);save()},
  skipFile(fid,it){S.staleFiles[fid]=it.id;if(S.cur)S.cur.skipFiles.add(fid);save()},
  itemFail(it,e){S.fails.set(it.id,{msg:String(e&&e.message||e),ts:Date.now()})},
  itemsDone(work,errs){const bad=new Set(errs.map(x=>x[0].id));let ch=false;
    for(const it of work){if(bad.has(it.id))continue;S.fails.delete(it.id);
      if(S.staleItems[it.id]&&!(S.cur&&S.cur.skipItems.has(it.id))){delete S.staleItems[it.id];ch=true}
      for(const[fid]of refs(it))if(S.staleFiles[fid]&&!(S.cur&&S.cur.skipFiles.has(fid))){delete S.staleFiles[fid];ch=true}}
    if(ch)save()},
  sortWork(work){if(S.priority.size)work.sort((a,b)=>(S.priority.has(b.id)?1:0)-(S.priority.has(a.id)?1:0))},
  /* كتابة الملف على دفعات 4 م.ب: بتدّي نسبة تقدّم حقيقية، وبتسمح بالإيقاف في نص الكتابة */
  async write(w,data,path){
    if(!(typeof Blob!=="undefined"&&data instanceof Blob))return w.write(data);
    const size=data.size,rec={path,size,done:0,start:Date.now(),pausedMs:0,state:"writing"};
    S.inflight.set(path,rec);
    try{
      if(size<=CHUNK)await w.write(data);
      else for(let o=0;o<size;o+=CHUNK){
        if(heldNow(path)){rec.state="paused";const t=Date.now();await waitHold(path);rec.pausedMs+=Date.now()-t;rec.state="writing"}
        await w.write(data.slice(o,Math.min(size,o+CHUNK)));rec.done=Math.min(size,o+CHUNK)}
      rec.done=size;
      S.hist.push({path,size,ms:Math.max(1,Date.now()-rec.start-rec.pausedMs),ts:Date.now()});
      if(S.hist.length>400)S.hist.splice(0,100);
      S.fileFails.delete(path)
    }catch(e){S.fileFails.set(path,String(e&&e.message||e));throw e}
    finally{S.inflight.delete(path)}},
  passStart(i){S.cur=Object.assign({ts:Date.now(),t0:performance.now(),stages:{},stage:null,stageT:0,skipItems:new Set(),skipFiles:new Set()},i)},
  stage(n){const c=S.cur;if(!c)return;const t=performance.now();if(c.stage)c.stages[c.stage]=(c.stages[c.stage]||0)+(t-c.stageT);c.stage=n;c.stageT=t},
  passEnd(i){const c=S.cur;if(!c)return;SP.stage(null);
    S.passes.push(Object.assign({},i,{ts:c.ts,scan:c.scan,items:c.items,dirtyItems:c.dirtyItems,dirtyFiles:c.dirtyFiles,stages:c.stages,total:performance.now()-c.t0,skipped:c.skipItems.size+c.skipFiles.size}));
    if(S.passes.length>60)S.passes.shift();S.cur=null;S.priority.clear();S.metaDirty=true;save()},
  verified(w,ok,err){S.verified.set(w.path,!!ok);if(!ok)S.verifyErr.set(w.path,String(err&&err.message||err||"بصمة مختلفة"))}
};

/* ---------------- بناء جدول كل الملفات ---------------- */
async function loadMeta(){
  try{const recs=await idbGetAll("files"),m=new Map();
    for(const r of recs||[])if(r&&r.id)m.set(r.id,{name:r.name||"",size:r.size??(r.blob&&r.blob.size)??0,upd:r.updatedAt||0,has:!!r.blob});
    S.meta=m;S.metaTs=Date.now();S.metaDirty=false}catch(e){S.metaTs=Date.now()}}
function buildRows(){
  const st=ST(),fs=FS(),P=fs&&fs.plan?fs.plan():null,E=fs&&fs.state||null;
  const root=fs&&fs.info&&fs.info.handle?fs.info.handle():null;
  const idx=P?P.idx:{items:{},unassigned:{}};
  const items=st.items||[],folders=st.folders||[],fmap=new Map(folders.map(f=>[f.id,f]));
  const gname=fid=>{if(!fid||!fmap.has(fid))return"بدون مجموعة";const o=[];let f=fmap.get(fid),d=0;while(f&&d++<30){o.unshift(f.name||"بدون اسم");f=f.parentId?fmap.get(f.parentId):null}return o.join(" › ")};
  const vq=new Set(E?E.vq.map(w=>w.path):[]);
  const rows=[],used=new Set(),metaOk=S.metaTs>0,now=Date.now();
  const nofolder=!P;
  const verOf=p=>{const v=S.verified.get(p);return v===true?"ok":v===false?"bad":vq.has(p)?"pending":null};
  const queuedFor=(id,fid)=>!!(E&&(E.scan||E.running||E.dirty.has(id)||(fid&&E.dirtyFiles.has(fid))));
  const finish=(r,saved,fail)=>{
    const fl=S.inflight.get(r.destPath);
    r.cover=findCover({gid:r.gid,itemId:r.itemId,kind:r.kind==="json"?null:r.kind,fid:r.fid,destPath:r.destPath});
    if(fl){r.status=fl.state==="paused"?"held":"writing";r.done=fl.done;r.start=fl.start;r.live=fl}
    else if(saved){r.status="saved";r.ver=r.destPath?verOf(r.destPath):null}
    else if(r.cover)r.status="held";
    else if(fail)r.status="failed";
    else r.status=nofolder?"idle":(queuedFor(r.itemId,r.fid)?"queued":"idle");
    if(fail)r.err=fail;return r};
  for(const it of items){
    const gid=it.folderId&&fmap.has(it.folderId)?it.folderId:"_root",gn=gname(gid==="_root"?null:gid),
      base=P?P.itemPath(it):null,oe=idx.items[it.id],iname=it.name||"بدون اسم",fe=S.fails.get(it.id);
    {const dest=base?base+"/item.json":null,saved=!!(oe&&oe.path===base&&!S.staleItems[it.id]&&!(E&&E.dirty.has(it.id)));
      rows.push(finish({key:"j:"+it.id,kind:"json",fid:null,itemId:it.id,itemName:iname,gid,groupName:gn,name:"item.json",size:0,destPath:dest,base},saved,fe&&fe.msg))}
    const seen=new Set();
    for(const[fid,k]of refs(it)){
      if(seen.has(fid))continue;seen.add(fid);used.add(fid);
      const m=S.meta.get(fid),nm=(m&&m.name)||(it.docs||[]).find(d=>d&&d.fileId===fid)?.name||fid,
        dest=base?base+"/"+k+"/"+fid+ext(m&&m.name):null,pf=oe&&oe.path===base&&oe.files&&oe.files[fid];
      const r={key:"f:"+fid,kind:k,fid,itemId:it.id,itemName:iname,gid,groupName:gn,name:nm,size:(m&&m.size)||0,destPath:dest,base};
      if(metaOk&&(!m||!m.has)){r.status="missing";r.cover=null;rows.push(r);continue}
      const saved=!!(pf&&m&&pf.size===m.size&&pf.upd===m.upd&&pf.path===dest);
      const fe2=S.fileFails.get(dest)||(fe&&fe.msg)||null;
      rows.push(finish(r,saved,fe2))}}
  if(metaOk)for(const[fid,m]of S.meta){
    if(used.has(fid)||!m.has)continue;
    const dest="_unassigned/"+fid+ext(m.name),pf=idx.unassigned&&idx.unassigned[fid];
    rows.push(finish({key:"f:"+fid,kind:"unassigned",fid,itemId:"\0u",itemName:"—",gid:"\0",groupName:"ملفات بلا عنصر",name:m.name||fid,size:m.size,destPath:P?dest:null,base:"_unassigned"},
      !!(pf&&pf.size===m.size&&pf.upd===m.upd&&pf.path===dest),S.fileFails.get(dest)||null))}
  return{rows,P,E,linked:!!P,root:root?root.name:"",now,vq}}
function totals(rows){
  const t={all:rows.length,saved:0,verok:0,writing:0,queued:0,idle:0,held:0,failed:0,missing:0,bytes:0,savedBytes:0,waitBytes:0,heldBytes:0};
  for(const r of rows){t[r.status]++;
    if(r.status==="saved"&&r.ver==="ok")t.verok++;
    if(r.kind==="json"||r.status==="missing")continue;
    t.bytes+=r.size;
    if(r.status==="saved")t.savedBytes+=r.size;
    else if(r.status==="held")t.heldBytes+=r.size;
    else t.waitBytes+=r.status==="writing"?Math.max(0,r.size-(r.done||0)):r.size}
  return t}
function rate(){const now=Date.now(),a=S.hist.filter(h=>now-h.ts<180000);if(!a.length)return 0;
  let b=0,first=Infinity;for(const h of a){b+=h.size;first=Math.min(first,h.ts-h.ms)}
  const sec=Math.max(2,(now-first)/1000);return b/sec}

/* ---------------- أوامر التحكم ---------------- */
function labelFor(t,v){
  const st=ST();
  if(t==="all")return"كل المزامنة";
  if(t==="group")return v==="_root"?"المجموعة «بدون مجموعة»":"المجموعة «"+((st.folders||[]).find(f=>f.id===v)||{}).name+"»";
  if(t==="item")return"العنصر «"+((itemById(v)||{}).name||v)+"»";
  if(t==="kind")return"كل «"+(KL[v]||v)+"»";
  if(t==="file"){const r=S.R&&S.R.rows.find(x=>x.fid===v);return"الملف «"+(r?r.name:v)+"»"}
  return"الموقع "+v}
function toast2(m,k){try{toast(m,k||"ok")}catch(e){}}
function addHold(type,key,label){key=String(key);
  if(S.holds.some(h=>h.type===type&&h.key===key))return false;
  S.holds.push({id:"h"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type,key,label:label||labelFor(type,key),since:Date.now()});return true}
function commit(rq){wake();save();if(rq)requeue();refresh()}
function requeue(){
  const fs=FS();if(!fs||!fs.plan||!fs.plan())return;const E=fs.state,R=buildRows();
  for(const r of R.rows)if(r.status==="queued"||r.status==="idle"||r.status==="failed"){
    if(r.itemId&&r.itemId!=="\0u")E.dirty.add(r.itemId);
    if(r.fid)E.dirtyFiles.add(r.fid);
    if(r.kind==="unassigned")E.scan=true}
  for(const id in S.staleItems)E.dirty.add(id);
  for(const fid in S.staleFiles)E.dirtyFiles.add(fid);
  fs.kick(0)}
function scopeRows(t,v){
  const R=S.R?S.R.rows:[];
  switch(t){
    case"all":return R;
    case"group":{const d=descOf(v);return R.filter(r=>d.has(r.gid))}
    case"item":return R.filter(r=>r.itemId===v);
    case"file":return R.filter(r=>r.fid===v);
    case"kind":return R.filter(r=>r.kind===v);
    case"path":return R.filter(r=>r.destPath&&(r.destPath===v||r.destPath.startsWith(v+"/")));
    case"filtered":return S.filtered}
  return[]}
function doPause(t,v){
  if(t==="filtered"){let n=0;for(const r of S.filtered)if(r.fid&&r.kind!=="json"&&r.status!=="saved"&&r.status!=="missing"&&addHold("file",r.fid,"الملف «"+r.name+"»"))n++;
    commit(false);toast2("اتوقّف "+N(n)+" ملف.");return}
  if(addHold(t,v,t==="path"?"الموقع "+v:null)){commit(false);toast2("اتوقّف: "+labelFor(t,v))}}
function doResume(t,v){
  if(t==="all"){S.holds=[];commit(true);toast2("اتستأنفت المزامنة كلها.");return}
  const scope=scopeRows(t,v),sc=new Set(scope),all=S.R?S.R.rows:[],blockers=[];let removed=0;
  for(const h of S.holds.slice()){
    if(!scope.some(r=>covers(h,r)))continue;
    if(all.some(r=>!sc.has(r)&&covers(h,r))){blockers.push(h.label);continue}
    S.holds.splice(S.holds.indexOf(h),1);removed++}
  commit(true);
  if(blockers.length)toast2("لسه موقوف بسبب إيقاف أكبر: "+[...new Set(blockers)].join("، ")+" — استأنفه من «الإيقافات الشغّالة».","warn");
  else toast2(removed?"اتستأنف وبقى في الدور.":"مفيش إيقاف على النطاق ده.")}
function doStart(t,v){
  const fs=FS();if(!fs||!fs.plan||!fs.plan()){toast2("اربط مجلد التخزين الأول.","err");return}
  const E=fs.state,rows=scopeRows(t,v);let n=0,blocked=0;
  for(const r of rows){
    if(r.status==="saved"||r.status==="missing"||r.status==="writing")continue;
    if(r.cover){blocked++;continue}
    if(r.itemId&&r.itemId!=="\0u"){S.priority.add(r.itemId);E.dirty.add(r.itemId)}
    if(r.fid)E.dirtyFiles.add(r.fid);
    if(r.kind==="unassigned")E.scan=true;n++}
  fs.kick(0);refresh();
  toast2(n?"بدأت المزامنة لـ "+N(n)+" ملف (بقوا أول الدور).":"مفيش حاجة منتظرة في النطاق ده.",n?"ok":"warn");
  if(blocked)toast2(N(blocked)+" ملف موقوف — استأنفهم الأول.","warn")}
function doRewrite(t,v){
  const fs=FS();if(!fs||!fs.plan||!fs.plan())return;const E=fs.state,ids=new Set();
  for(const r of scopeRows(t,v))if(r.itemId&&r.itemId!=="\0u"&&!r.cover)ids.add(r.itemId);
  ids.forEach(id=>{E.force.add(id);E.dirty.add(id);S.priority.add(id)});
  fs.kick(0);refresh();toast2(ids.size?"هيتعاد كتابة "+N(ids.size)+" عنصر بملفاته.":"مفيش عناصر قابلة لإعادة الكتابة.",ids.size?"ok":"warn")}
function doScan(){const fs=FS();if(!fs||!fs.plan||!fs.plan()){toast2("اربط مجلد التخزين الأول.","err");return}fs.state.scan=true;fs.kick(0);toast2("بدأ فحص شامل.");refresh()}

.sp-note{border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.7;margin-bottom:7px;border:1px solid var(--border);background:var(--panel2)}
.sp-note.red{border-color:var(--red);background:var(--red-dim)}.sp-note.yellow{border-color:var(--yellow);background:var(--yellow-dim)}.sp-note.blue{border-color:var(--blue);background:var(--blue-dim)}
.sp-holds{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.sp-hc{display:inline-flex;align-items:center;gap:6px;background:var(--yellow-dim);border:1px solid var(--yellow);color:var(--text);border-radius:999px;padding:3px 5px 3px 10px;font-size:11.5px}
.sp-hc button{border:0;background:var(--panel);color:var(--text);border-radius:999px;font-size:11px;padding:2px 9px}
.sp-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto}
.sp-tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 13px;font-size:13px;white-space:nowrap}
.sp-tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.sp-flt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.sp-flt label{margin:0 0 3px}
.sp-bulk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:10px;font-size:12px}
.sp-bulk .t{color:var(--dim);margin-inline-end:4px}
.sp-row{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:start;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:9px 10px;margin-bottom:6px}
.sp-row.st-failed,.sp-row.st-missing{border-color:var(--red)}.sp-row.st-held{border-color:var(--yellow)}.sp-row.st-writing{border-color:var(--amber)}
.sp-ico{font-size:18px;text-align:center;padding-top:1px}
.sp-name{font-size:13px;font-weight:600;word-break:break-all}
.sp-name small{font-weight:400;color:var(--dim);font-size:11px;margin-inline-start:6px}
.sp-sub{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.55}
.sp-path{font-family:var(--mono);font-size:11px;color:var(--dim2);margin-top:3px;direction:ltr;text-align:left;word-break:break-all}
.sp-err{font-size:11.5px;color:var(--red);margin-top:3px;word-break:break-word}
.sp-acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.sp-acts button,.sp-bulk button,.sp-ctl button.m{background:var(--panel3);border:1px solid var(--border-lt);color:var(--text);border-radius:7px;padding:4px 9px;font-size:11.5px}
.sp-acts button:hover,.sp-bulk button:hover{border-color:var(--amber);color:var(--amber)}
.sp-acts button:disabled{opacity:.4;cursor:not-allowed}
.sp-chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;border:1px solid var(--border-lt);white-space:nowrap}
.sp-chip.saved{color:var(--green);border-color:var(--green);background:var(--green-dim)}
.sp-chip.writing{color:var(--amber);border-color:var(--amber);background:var(--amber-dim)}
.sp-chip.queued{color:var(--blue);border-color:var(--blue);background:var(--blue-dim)}
.sp-chip.idle{color:var(--dim)}
.sp-chip.held{color:var(--yellow);border-color:var(--yellow);background:var(--yellow-dim)}
.sp-chip.failed,.sp-chip.missing{color:var(--red);border-color:var(--red);background:var(--red-dim)}
.sp-side2{text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sp-node{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:8px 10px;margin:0 calc(var(--lv,0)*18px) 6px 0}
.sp-node.held{border-color:var(--yellow)}
.sp-tg{background:transparent;border:0;color:var(--dim);font-size:13px;padding:2px}
.sp-nt{font-size:13px;font-weight:600;word-break:break-word}
.sp-ns{font-size:11.5px;color:var(--dim);margin-top:2px}
.sp-tbl{width:100%;border-collapse:collapse;font-size:12px}
.sp-tbl th,.sp-tbl td{border-bottom:1px solid var(--border);padding:6px 7px;text-align:right}
.sp-tbl th{color:var(--dim);font-weight:600;font-size:11px}
.sp-tbl td.m{font-family:var(--mono);direction:ltr;text-align:left}
.sp-tw{overflow-x:auto}
.sp-find{font-size:12.5px;line-height:1.8;margin:0;padding-inline-start:18px}
.sp-find li{margin-bottom:6px}
.sp-more{display:block;width:100%;padding:9px;margin-top:4px}
@media(max-width:640px){.sp-row{grid-template-columns:26px 1fr}.sp-row .sp-side2{grid-column:2;align-items:flex-start;text-align:right;flex-direction:row;flex-wrap:wrap;gap:6px}.sp-node{grid-template-columns:22px 1fr}.sp-node .sp-side2{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center}}

function drawHead(R,t){
  const E=R.E,fs=FS(),eng=!R.linked?"مفيش مجلد مرتبط":(E&&E.running)?"شغّال":"فاضي — مستني تعديل";
  const stg=S.cur&&S.cur.stage?STAGE[S.cur.stage]:null;
  const pct=t.all?Math.round((t.saved/t.all)*100):100,rt=rate(),eta=rt>0&&t.waitBytes>0?fdur(t.waitBytes/rt*1000):null;
  const allHeld=S.holds.some(h=>h.type==="all"),f=S.ui.status;
  const st=(k,n,l,s,flt)=>`<button class="sp-st ${f===flt?"on":""}" data-act="flt" data-v="${flt}"><div class="n">${N(n)}</div><div class="l">${l}</div><div class="s">${s}</div></button>`;
  const arr='<div class="sp-arr">◀</div>';

  let h=`<div class="sp-pipe">
    ${st(1,t.all,"في قاعدة المتصفح","كل الملفات المرتبطة بعناصر ("+fb(t.bytes)+")","all")}${arr}
    ${st(2,pend,"في الدور / منتظر","منها "+N(t.idle)+" مستنية الفحص الشامل","pending")}${arr}
    ${st(3,t.writing,"بيتكتب دلوقتي",E?"بالتوازي لحد 4 ملفات":"—","writing")}${arr}
    ${st(4,t.saved,"اتحفظ في المجلد",fb(t.savedBytes),"saved")}${arr}
    ${st(5,t.verok,"اتأكد منه بالبصمة","تحقق SHA في الخلفية","verified")}
  </div>
  <div class="sp-side">
    <button data-act="flt" data-v="held">⏸ موقوف <b>${N(t.held)}</b></button>
    <button data-act="flt" data-v="failed">⚠️ فشل <b>${N(t.failed)}</b></button>
    <button data-act="flt" data-v="missing">❔ مفقود محليًا <b>${N(t.missing)}</b></button>

      <b>${pct}% محفوظ (${N(t.saved)} من ${N(t.all)})</b>

      المحرك: <b style="color:var(--text)">${eng}</b>${stg?" — المرحلة: "+stg:""}
      ${R.linked?`<br>بيتحفظ جوه المجلد: <b style="color:var(--text)">${H(R.root||"المجلد المرتبط")}</b> بالشكل <span style="font-family:var(--mono);direction:ltr;display:inline-block">المجموعة / العنصر / نوع الملف / اسم الملف</span>`:""}
    </div></div>
  <div class="sp-ctl">
    ${allHeld?`<button class="btn primary" data-act="resume" data-t="all">▶ استئناف الكل</button>`:`<button class="btn" data-act="pause" data-t="all">⏸ إيقاف الكل</button>`}
    ${S.holds.length&&!allHeld?`<button class="btn" data-act="resume" data-t="all">▶ استئناف الكل (شيل كل الإيقافات)</button>`:""}
    <button class="btn primary" data-act="start" data-t="all">⚡ ابدأ الآن (كل المنتظر)</button>
    <button class="btn" data-act="scan">🔍 فحص شامل</button>
    <button class="btn" data-act="reload">↻ تحديث</button>
  </div>`;
  const notes=[];
  if(!R.linked)notes.push(["red","مفيش مجلد تخزين مرتبط — الملفات في قاعدة المتصفح بس ومحدش بيكتبها على القرص. اربط مجلد من الإعدادات."]);
  else{
    if(typeof folderPermissionNeedsActivation!=="undefined"&&folderPermissionNeedsActivation)notes.push(["red","صلاحية الكتابة على المجلد محتاجة تأكيد — المزامنة واقفة لحد ما تسمح من الإعدادات أو بضغطة على أيقونة المزامنة."]);
    if(E&&E.lastErr&&E.lastErr.message!=="folder-permission-required")notes.push(["red","آخر خطأ في المزامنة: "+E.lastErr.message+(E.retry?" — بيعيد المحاولة تلقائيًا (محاولة "+E.retry+")":"")]);
    if(allHeld)notes.push(["yellow","⏸ المزامنة كلها موقوفة. التعديلات بتتحفظ في البرنامج بس ومش بتتكتب في المجلد لحد ما تستأنف."]);
    else if(S.holds.length)notes.push(["yellow","⏸ فيه "+S.holds.length+" إيقاف شغّال. الملفات الموقوفة مش هتتكتب لحد ما تستأنفها."]);
    if(t.idle>0&&!(E&&E.running)&&!allHeld){const left=E?Math.max(0,E.lastScan+SCAN_EVERY-Date.now()):0;
      notes.push(["blue",N(t.idle)+" ملف مش في الدور النشط — بيتلقطوا في الفحص الشامل الجاي (بعد حوالي "+fdur(left)+")، أو دوس «ابدأ الآن» وهيبقوا أول الدور."])}
    if(t.failed)notes.push(["red",N(t.failed)+" ملف فشلوا — شوف سبب الفشل في تبويب «الملفات» (فلتر: فشل)."]);
    if(t.missing)notes.push(["red",N(t.missing)+" ملف العنصر بيشاور عليه لكن مش موجود في قاعدة المتصفح — المحرك بيتخطّاه ومش هيتكتب."])}
  h+=notes.map(n=>`<div class="sp-note ${n[0]}">${n[1]}</div>`).join("");
  if(S.holds.length)h+=`<div class="sp-holds">${S.holds.map(x=>`<span class="sp-hc">⏸ ${H(x.label)}<button data-act="unhold" data-v="${x.id}">▶ استئناف</button></span>`).join("")}</div>`;
  document.getElementById("spHead").innerHTML=h}

const TABS=[["files","📄 الملفات"],["tree","🗂️ المجموعات والمواقع"],["log","🔄 سجل النشاط"],["diag","🩺 ليه تقيل؟"]];

function groupOptions(){
  const fl=ST().folders||[],ids=new Set(fl.map(f=>f.id)),kids=new Map();
  fl.forEach(f=>{const p=f.parentId&&ids.has(f.parentId)?f.parentId:"";(kids.get(p)||kids.set(p,[]).get(p)).push(f)});
  const o=['<option value="">كل المجموعات</option>','<option value="_root">بدون مجموعة</option>'];
  const walk=(p,d)=>(kids.get(p)||[]).forEach(f=>{o.push(`<option value="${H(f.id)}" ${S.ui.gid===f.id?"selected":""}>${"— ".repeat(d)}${H(f.name||"بدون اسم")}</option>`);walk(f.id,d+1)});
  walk("",0);return o.join("")}

function applyFilter(){
  const u=S.ui,q=u.q.trim().toLowerCase(),loc=u.loc.trim().replace(/^\/+|\/+$/g,"");
  const g=u.gid?descOf(u.gid):null;
  let a=(S.R?S.R.rows:[]).filter(r=>{
    if(u.status!=="all"){
      if(u.status==="pending"){if(r.status!=="queued"&&r.status!=="idle")return false}
      else if(u.status==="verified"){if(!(r.status==="saved"&&r.ver==="ok"))return false}
      else if(r.status!==u.status)return false}
    if(u.kind!=="all"&&r.kind!==u.kind)return false;
    if(g&&!g.has(r.gid))return false;
    if(loc&&!(r.destPath&&(r.destPath===loc||r.destPath.startsWith(loc+"/")||r.destPath.startsWith(loc))))return false;
    if(q&&!((r.name||"").toLowerCase().includes(q)||(r.itemName||"").toLowerCase().includes(q)))return false;
    return true});
  a.sort((x,y)=>ST_RANK[x.status]-ST_RANK[y.status]||String(x.groupName).localeCompare(String(y.groupName),"ar")||String(x.itemName).localeCompare(String(y.itemName),"ar"));
  S.filtered=a;return a}

    ${r.ver==="bad"?`<div class="sp-err">فشل التحقق بالبصمة: ${H(S.verifyErr.get(r.destPath)||"")}</div>`:""}

/* ---------------- التجميع والتشغيل ---------------- */
function drawAll(){
  const R=S.R;if(!R||!S.host)return;const t=totals(R.rows);
  drawHead(R,t);drawTabs();
  const act=document.activeElement,typing=act&&act.closest&&act.closest("#spFilters");
  if(S.ui.tab==="files"){
    const fe=document.getElementById("spFilters");if(!fe.dataset.on){drawFilters();fe.dataset.on="1"}
    drawFiles()}
  else{document.getElementById("spFilters").innerHTML="";document.getElementById("spFilters").dataset.on="";
    if(S.ui.tab==="tree")drawTree();else if(S.ui.tab==="log")drawLog();else drawDiag()}
  const n=S.holds.length,nb=document.getElementById("spNavCnt");if(nb)nb.textContent=n?"⏸"+n:""}
function refresh(){if(!S.host)return;try{S.R=buildRows();drawAll()}catch(e){console.warn("SyncPipe",e)}}
async function tick(){
  clearTimeout(S.tm);
  if(!S.host||!S.host.isConnected||!ST().view||ST().view.type!=="syncpipe"){S.host=null;return}
  try{const fs=FS(),E=fs&&fs.state;
    if(S.metaDirty||Date.now()-S.metaTs>15000||(E&&E.dirtyFiles.size&&Date.now()-S.metaTs>3000))await loadMeta();
    S.R=buildRows();
    if(S.R.rows.some(r=>r.status==="missing")&&Date.now()-S.metaTs>1200){await loadMeta();S.R=buildRows()}
    drawAll()}catch(e){console.warn("SyncPipe",e)}
  const fs=FS();S.tm=setTimeout(tick,(fs&&fs.state.running)||S.inflight.size?900:2500)}
function mount(c){
  clearTimeout(S.tm);S.host=c;
  c.innerHTML=`<div class="sp-wrap"><div class="view-title"><h1>🧭 خط المزامنة</h1></div>
    <div class="view-desc">كل ملف في طريقه من قاعدة المتصفح لحد المجلد المرتبط: مين مستني دوره، مين بيتكتب، مين اتحفظ ومكانه فين، مع تحكم كامل بالإيقاف والاستئناف والبدء لملف أو مجموعة أو موقع أو الكل.</div>
    <div id="spHead"></div><div class="sp-tabs" id="spTabs"></div><div id="spFilters"></div><div id="spList"></div></div>`;
  const w=c.firstElementChild;w.onclick=onClick;w.oninput=onInput;w.onchange=onInput;S.metaDirty=true;tick()}
function onInput(e){
  const id=e.target.id,u=S.ui;let ch=true;
  if(id==="fStatus")u.status=e.target.value;else if(id==="fKind")u.kind=e.target.value;else if(id==="fGroup")u.gid=e.target.value;
  else if(id==="fLoc")u.loc=e.target.value;else if(id==="fQ")u.q=e.target.value;else ch=false;
  if(ch){u.limit=60;drawFiles()}}
function onClick(e){
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,t=b.dataset.t,v=b.dataset.v,u=S.ui;
  switch(a){
    case"tab":u.tab=v;document.getElementById("spFilters").dataset.on="";break;
    case"flt":u.tab="files";u.status=v;u.kind="all";u.gid="";u.loc="";u.q="";u.limit=60;document.getElementById("spFilters").dataset.on="";break;
    case"more":u.limit+=60;break;
    case"toggle":if(v){u.open.has(v)?u.open.delete(v):u.open.add(v)}break;
    case"goto":u.tab="files";u.status="all";u.kind="all";u.limit=60;
      if(t==="group"){u.gid=v;u.q=""}else{u.gid="";u.q=v}u.loc="";document.getElementById("spFilters").dataset.on="";break;
    case"pause":if(t==="all")addHold("all","*","كل المزامنة");if(t==="all")commit(false);else doPause(t,v);return refresh();
    case"resume":doResume(t,v);return;
    case"start":doStart(t,v);return;
    case"rewrite":doRewrite(t,v);return;
    case"scan":doScan();return;
    case"reload":S.metaDirty=true;toast2("بيتحدّث...");tick();return;
    case"unhold":{const i=S.holds.findIndex(h=>h.id===v);if(i>=0){S.holds.splice(i,1);commit(true)}return}
    case"copy":try{navigator.clipboard.writeText(v);toast2("اتنسخ المسار.")}catch(x){toast2("تعذّر النسخ.","err")}return;
    case"logpause":{const s=ST().syncLogSettings;s.enabled=false;Promise.resolve(persistSyncLogMetaNow()).then(()=>{try{restartActivityLogScheduler();updateGlobalSyncBadge()}catch(x){}refresh()});toast2("اتوقفت مزامنة السجل.");return}
    case"logresume":{const s=ST().syncLogSettings;s.enabled=true;Promise.resolve(persistSyncLogMetaNow()).then(()=>{try{restartActivityLogScheduler();updateGlobalSyncBadge()}catch(x){}return runActivityLogSync(true)}).then(refresh);return}
    case"lognow":Promise.resolve(runActivityLogSync(true)).then(refresh);return;
    case"logsize":try{u.logBytes=new Blob([JSON.stringify(ST().activityLog||[])]).size}catch(x){u.logBytes=null}break;
    case"estimate":try{navigator.storage.estimate().then(x=>{u.est=x;refresh()})}catch(x){}return;
  }
  refresh()}

/* ---------------- استخراج مراجع الملفات من العناصر ---------------- */

  if(Array.isArray(it._docs))it._docs.forEach((x,i)=>{if(x&&x.fileId&&!seen.has(x.fileId)){seen.add(x.fileId);push({role:"doc",value:x.fileId,name:x.name,hint:x.filename,ptr:"_docs["+i+"]",structured:false,fromMeta:true})}});

/* ---------------- التحليل الكامل ---------------- */
function setProg(phase,done,total){S.prog={phase,done,total};if(S.host)drawProgress()}
async function analyze(list){

    /* الملفات */

      const f={id:"f"+(++k),path,name,stem:stemOf(name),ext:extOf(name),size:e.size,from:e.from,sys:SYS.test(path),get:e.get};

    let i=0;for(const f of jsonFiles){setProg("قراءة ملفات البيانات",++i,jsonFiles.length);
      let text="";try{const b=await f.get();f.size=b.size;text=await b.text()}catch(e){prob("err","READ","ماقدرتش أقرا الملف "+f.path,f.path);continue}

      if(p.issues.length)prob(p.partial?"warn":"info",p.partial?"JSON_PARTIAL":"JSON_FIXED","«"+f.path+"»: "+p.issues.join("، ")+" — اتصلّح تلقائيًا (الاستيراد القديم كان هيفشل في قراءته).",f.path);

    /* فحص كل ملف غير JSON */

    const work=async f=>{
      if(f.sys){f.kind="system";setProg("فحص الملفات",++d,rest.length);return}
      try{const b=await f.get();f.blob=b;f.size=b.size;
        const s=await readInfo(b);f.t=s.t;f.kind=s.kind;f.warns=s.warns;

        if(f.kind==="image"&&["jpg","png","gif","webp","bmp","avif","svg","ico"].includes(f.t)){const dm=await decode(b);if(dm){f.w=dm.w;f.h=dm.h}else if(f.size){f.warns.push(["decode","الصورة ماتفتحش في المتصفح (بايتاتها غير صالحة للعرض)."])}}
        else if(f.t==="heic"||f.t==="tiff"){f.warns.push(["unsupported","صيغة "+typeLabel(f.t)+" المتصفح مابيعرضهاش — هتتحفظ كملف بس مش هتظهر كصورة (محتاجة تحويل خارجي)."])}
        if(f.t==="svg")f.kind="image";

    let ci=0;const pool=Array.from({length:3},async()=>{while(ci<rest.length){const f=rest[ci++];await work(f)}});await Promise.all(pool);
    /* ملفات مضمّنة base64 + مراجع */
    setProg("ربط الصور بالعناصر",0,S.items.size);let n=0,inl=0;
    S.refs=[];
    for(const[id,e]of S.items){
      const it=e.cur.it,rs=await collectRefs(id,it);
      for(const r of rs){if(r.inline&&r.value.startsWith("data:")){const b=await dataBlob(r.value);
          if(b&&b.size){const s=await readInfo(b),ex=realExt(s.t)||"bin";inl++;
            const vf={id:"v"+(++k),path:"(مضمّنة داخل البيانات)/"+(it.name||id)+"/صورة-"+inl+"."+ex,name:"صورة-"+inl+"."+ex,stem:"صورة-"+inl,ext:ex,size:b.size,blob:b,kind:s.kind,t:s.t,warns:s.warns,virtual:true,from:"base64 داخل «"+(it.name||id)+"»",mime:b.type||MIME[ex]};
            if(s.kind==="image"){const dm=await decode(b);if(dm){vf.w=dm.w;vf.h=dm.h}}
            vf.hash=await sha(b);S.files.push(vf);r.virtualFile=vf}
          else r.badInline=true}}

    if(inl)prob("info","INLINE","لقيت "+inl+" صورة مضمّنة (base64) جوه بيانات العناصر — الاستيراد القديم كان بيتجاهلها أو بيضيّعها لما يستبدل قايمة الصور.","");
    S.ix=buildIndex(S.files);
    for(const r of S.refs){r.res=resolveRef(r,S.ix)}
    computeDerived();S.ready=true;
    if(!S.files.some(f=>!f.sys&&!f.isJson))prob("warn","NOFILES","مفيش أي ملفات صور/مستندات في المصدر ده — بيانات العناصر بس.","");
  }catch(e){console.error(e);prob("err","FATAL","حصل خطأ أثناء التحليل: "+(e&&e.message||e),"")}
  finally{S.busy=false;S.prog=null;if(S.host)drawAll()}}

/* ---------------- القرارات (تلقائي + تعديلاتك) ---------------- */
const ov=(m,k)=>m.get(k)||{};

function refFile(r){const o=ov(S.ro,r.rid);
  if(o.ignore)return{f:null,ignored:true};
  if(o.fileId){const f=S.files.find(x=>x.id===o.fileId);return{f,manual:true}}
  const x=r.res;if(x.f&&(x.conf==="exact"||x.conf==="high"))return{f:x.f,auto:true,conf:x.conf};
  return{f:null}}
function bad(f){return f.size===0||(f.warns||[]).some(w=>w[0]==="decode"||w[0]==="zero"||w[0]==="read")}
function computeDerived(){
  const files=S.files;files.forEach(f=>{f.refs=[];f.owner=null;f.variantOf=null});
  for(const r of S.refs){const x=refFile(r);r.final=x;if(x.f)x.f.refs.push(r)}
  /* تكرار بالمحتوى */
  const byH=new Map();for(const f of files){if(!f.hash||f.sys)continue;(byH.get(f.hash)||byH.set(f.hash,[]).get(f.hash)).push(f)}
  for(const g of byH.values()){if(g.length<2)continue;g.sort((a,b)=>b.refs.length-a.refs.length||a.path.length-b.path.length);for(let i=1;i<g.length;i++)g[i].dupOf=g[0];}

  const grp=new Map();

    const px=f=>(f.w||0)*(f.h||0)||f.size;g.sort((a,b)=>px(b)-px(a));const best=g[0];best.variantBest=true;best.variants=g;

  for(const f of files){if(f.sys||f.isJson||f.refs.length||f.kind==="system")continue;
    let best=null;
    for(const[id,e]of S.items){const dirs=ownerDirs(id);let sc=0,why="";
      if(underOwner(f,id,dirs)){sc=3;why="موجود جوه مجلد العنصر في الأرشيف"}
      else{const it=e.cur.it,segs=normPath(f.path).split("/").slice(0,-1).map(nn),nm=nn(it.name);if(nm&&segs.some(s=>s===nm||(nm.length>=4&&s.includes(nm))))sc=2,why="اسم مجلده شبه اسم العنصر";

}
function fstatus(f){
  const o=ov(S.fo,f.id);
  if(f.sys)return"system";if(o.ignore)return"ignored";
  const used=f.refs.length>0;
  if(bad(f))return"bad";
  if(used){const fx=f.extMismatch||f.refs.some(r=>r.final.manual||r.res.conf!=="exact")||o.name||o.convert;return fx?"fix":"ok"}
  if(o.assign)return"fix";
  if(f.dupOf&&!o.assign)return"dup";
  if(f.variantOf&&!o.assign)return"variant";
  if(f.owner)return"suggest";
  return"orphan"}
function fileReasons(f){
  const o=[];if(f.sys)return["ملف نظام (مش بيانات) — بيتتجاهل."];
  for(const w of f.warns||[])o.push(w[1]);
  if(f.extMismatch)o.push("الامتداد «."+(f.ext||"بدون")+"» مش بيطابق المحتوى الفعلي ("+typeLabel(f.t)+") — المتصفح/البرنامج ممكن مايعرضوش الملف صح.");
  for(const r of f.refs){if(r.final.manual)o.push("اتربط يدويًا بـ «"+itemName(r.itemId)+"».");else if(r.res.why.length&&r.res.conf!=="exact")o.push(r.res.why[0])}
  if(!f.refs.length){
    if(f.dupOf)o.push("نسخة مطابقة بالحرف لملف تاني ("+f.dupOf.path+").");
    if(f.variantOf)o.push("نسخة تانية من نفس الصورة (حجم/اسم مختلف) — الأكبر هي «"+f.variantOf.name+"».");
    if(f.owner)o.push("مش مشار له من أي عنصر في البيانات، لكن غالبًا بتاع «"+itemName(f.owner.itemId)+"» ("+f.owner.why+").");
    else if(!f.dupOf&&!f.variantOf)o.push("مش مشار له من أي عنصر في البيانات ومفيش مؤشر على صاحبه — الاستيراد القديم كان بيحطه في «_unassigned» بس.")}
  if(f.dupName&&f.dupName>1)o.push("فيه "+f.dupName+" ملفات بنفس الاسم «"+f.name+"» في أماكن مختلفة — الاستيراد القديم كان بيحتفظ بأول واحد ويرمي الباقي من غير تنبيه.");
  return o}
function itemName(id){const e=S.items.get(id);return e?(e.cur.it.name||id):id}

function summary(){
  const fs=S.files.filter(f=>!f.isJson),t={files:fs.length,sys:0,ok:0,fix:0,orphan:0,suggest:0,bad:0,dup:0,variant:0,ignored:0,extBad:0,bytes:0,collide:0};
  const names=new Map();fs.forEach(f=>{if(!f.sys&&!f.virtual)names.set(f.name.toLowerCase(),(names.get(f.name.toLowerCase())||0)+1)});
  fs.forEach(f=>{f.dupName=f.sys||f.virtual?0:names.get(f.name.toLowerCase());if(f.dupName>1)t.collide++;
    const s=fstatus(f);t[s]=(t[s]||0)+1;if(f.extMismatch)t.extBad++;t.bytes+=f.size||0});
  const r={all:S.refs.length,ok:0,auto:0,manual:0,missing:0,ignored:0,sugg:0};
  S.refs.forEach(x=>{const y=x.final;if(y.ignored)r.ignored++;else if(y.f){r.ok++;if(y.manual)r.manual++;else if(x.res.conf!=="exact")r.auto++}else{r.missing++;if(x.res.cands&&x.res.cands.length)r.sugg++}});
  return{f:t,r,items:S.items.size,folders:S.folders.size,json:S.jsons.length,prob:S.problems}}

        const nb=await new Promise(r=>cv.toBlob(r,tgt,.95));if(nb&&nb.size){blob=nb;mime=tgt;name=stemOf(name)+(tgt==="image/png"?".png":".jpg")}}catch(e){rep.errors.push("فشل تحويل "+f.path+": "+e.message)}}

  const orphanAssign=new Map();/* itemId → [{f,role}] */
  for(const f of S.files){const o=ov(S.fo,f.id);if(f.sys||f.isJson||o.ignore)continue;
    if(!f.refs.length){let a=o.assign;

        else if(r.role==="doc"){const d=(Array.isArray(src.docs)?src.docs:[]).find(x=>x&&typeof x==="object"&&(x.fileId===r.value||x.id===r.value||x.name===r.name));docs.push(Object.assign({},d&&typeof d==="object"?d:{},{id:(d&&d.id&&d.id!==r.value?d.id:uid2("doc")),name:(d&&d.name)||r.name||x_name(r),fileId:fid}))}
        else if(r.role==="nb"){const d=(src.notebookData&&Array.isArray(src.notebookData.images)?src.notebookData.images:[]).find(x=>x&&x.id===r.value);nb.push(Object.assign({},d&&typeof d==="object"?d:{},{id:fid,caption:(d&&d.caption)||r.name||""}))}

        if(a.role==="doc")docs.push({id:uid2("doc"),name:ov(S.fo,a.f.id).name||a.f.name,fileId:fid});else if(a.role==="nb"){nb.push({id:fid,caption:""})}else imgs.push(fid)}
      /* بناء العنصر */
      for(const k of Object.keys(it))if(LEG_IMG.test(k)||(LEG_DOC.test(k)&&k!=="docs")||["image","photo","picture","img","mainImage"].includes(k))delete it[k];

            ((p&&p.hotspots)||[]).forEach((h,hi)=>{if(h&&h.content&&Array.isArray(h.content.images))h.content.images=h.content.images.map((im,ii)=>{const r=mp.get("ft.pages["+pi+"].hotspots["+hi+"].images["+ii+"]");return r&&r.newFid?Object.assign({},im,{id:r.newFid}):null}).filter(Boolean)})})}

      else if(nb.length){/* مفيش دفتر ملاحظات: نضيف الصور كصور عادية */imgs.push(...nb.map(x=>x.id))}

      if(!it.folderId)it.folderId=it.folderId||null;
      if(exists){
        /* إكمال العنصر الموجود: نضيف بس اللي ناقص ومانمسحش حاجة */
        const have=new Set();let addI=0,addD=0,addN=0;
        const curRecs=new Map();for(const fid of[...(cur.imageIds||[]),...(cur.docs||[]).map(d=>d&&d.fileId),...((cur.notebookData&&cur.notebookData.images)||[]).map(x=>x&&x.id)]){if(!fid)continue;have.add(fid);const rc=existFiles.get(fid)||await idbGet_real("files",fid);if(rc&&rc.blob){existFiles.set(fid,rc);if(!shaOfExist.has(fid))shaOfExist.set(fid,await sha(rc.blob))}}

  const R=[],it=itemById(d.itemId);
  if(!it)return["معلومات العنصر",[["الحالة","العنصر غير موجود",{cls:"bad"}]]];
  R.push(["النوع","عنصر"]);R.push(["الاسم",it.name||"—"]);
  if(it.folderId)R.push(["المجموعة",folderPath(it.folderId)]);
  const refs=refsOf(it),e=c.idx&&c.idx.items[it.id];
  if(!c.linked){
    let tot=0;for(const fid of refs){const r=await idbRec(fid);if(r&&r.blob)tot+=r.blob.size}
    R.push(["مكان التخزين",NOLINK,{cls:"warn"}]);
    R.push(["عدد الملفات المرفقة",String(refs.length)]);
    R.push(["حجم الملفات المرفقة",fmt(tot)]);
    R.push(["حجم بيانات العنصر (نصوص)",fmt(bytes(it))]);
    return["معلومات تخزين العنصر",R]}
  if(!e){R.push(["مكان التخزين",c.pending?"لم يُكتب في المجلد بعد — في دور المزامنة الآن":"لم يُكتب في المجلد بعد",{cls:"warn"}]);R.push(["حجم بيانات العنصر (نصوص)",fmt(bytes(it))]);return["معلومات تخزين العنصر",R]}
  const g=c.idx.groups[it.folderId];
  R.push(["مكان مجلد العنصر",full(c,e.path),{path:1,copy:1}]);
  if(g)R.push(["مجلد المجموعة",full(c,g.path),{path:1,copy:1}]);
  const jd=await diskSize(c,e.path+"/item.json"),hs=await diskSize(c,e.path+"/hashes.json");
  const by={};let ft=0,fn=0,missing=0;
  for(const fid of refs){const r=e.files[fid];if(!r){missing++;continue}fn++;ft+=r.size;(by[r.kind]||(by[r.kind]={n:0,b:0})).n++;by[r.kind].b+=r.size}
  R.push(["عدد الملفات المرفقة",fn+" ملف"+(missing?" (+"+missing+" لم يُكتب بعد)":""),missing?{cls:"warn"}:null]);
  for(const k in by)R.push(["   • "+(KL[k]||k),by[k].n+" ملف — "+fmt(by[k].b)]);
  R.push(["ملف item.json (كل النصوص والبيانات)",jd==null?"⚠ غير موجود في المجلد!":fmt(jd),jd==null?{cls:"bad"}:null]);
  R.push(["حجم مجلد العنصر الكلي",fmt(ft+(jd||0)+(hs||0))]);
  R.push(["الحالة",jd!=null&&!missing?"✓ العنصر وملفاته مكتوبة في المجلد":"⚠ بعض الملفات لم تُكتب بعد",{cls:jd!=null&&!missing?"ok":"warn"}]);
  return["معلومات تخزين العنصر",R]}

async function rowsFolder(c,d){
  const R=[],f=folderById(d.folderId);
  if(!f)return["معلومات المجموعة",[["الحالة","المجموعة غير موجودة",{cls:"bad"}]]];
  R.push(["النوع","مجموعة / مجلد"]);R.push(["الاسم",folderPath(f.id)]);
  const set=new Set([f.id]);let ch=true;
  while(ch){ch=false;for(const x of ST().folders)if(x.parentId&&set.has(x.parentId)&&!set.has(x.id)){set.add(x.id);ch=true}}
  const its=ST().items.filter(i=>set.has(i.folderId));
  R.push(["عدد المجلدات الفرعية",String(set.size-1)]);R.push(["عدد العناصر (بما فيها الفرعية)",String(its.length)]);
  if(!c.linked){R.push(["مكان التخزين",NOLINK,{cls:"warn"}]);return["معلومات تخزين المجموعة",R]}
  const g=c.idx&&c.idx.groups[f.id];
  if(!g){R.push(["مكان التخزين","لم يُكتب في المجلد بعد",{cls:"warn"}]);return["معلومات تخزين المجموعة",R]}
  R.push(["مكان التخزين",full(c,g.path),{path:1,copy:1}]);
  let tot=0,fn=0,seen=0;
  for(const id in c.idx.items){const e=c.idx.items[id];if(!set.has(e.folderId))continue;seen++;for(const k in e.files){tot+=e.files[k].size;fn++}}
  R.push(["عناصر مكتوبة في المجلد",seen+" من "+its.length,seen<its.length?{cls:"warn"}:{cls:"ok"}]);
  R.push(["عدد الملفات المرفقة",String(fn)]);R.push(["حجم الملفات المرفقة",fmt(tot)]);
  return["معلومات تخزين المجموعة",R]}

async function rowsField(c,d){
  const R=[],it=itemById(d.itemId),obj=d.get?d.get():d.obj,sz=bytes(obj==null?"":obj),e=c.idx&&c.idx.items[d.itemId];
  const lab=typeof d.label==="function"?d.label():d.label;
  R.push(["النوع",lab||"بيانات"]);
  if(it)R.push(["تابع للعنصر",it.name+(it.folderId?"  —  "+folderPath(it.folderId):"")]);
  if(typeof obj==="string")R.push(["عدد الأحرف",obj.length.toLocaleString("en-US")]);
  R.push(["الحجم",fmt(sz)]);
  if(d.fieldPath)R.push(["الموضع داخل الملف",d.fieldPath,{path:1}]);
  if(d.extra)for(const x of d.extra())R.push(x);
  if(!c.linked){R.push(["مكان التخزين","نص داخل بيانات العنصر في "+NOLINK,{cls:"warn"}]);}
  else if(e){
    const p=e.path+"/item.json",ds=await diskSize(c,p);
    R.push(["مكان التخزين (ملف النصوص)",full(c,p),{path:1,copy:1}]);
    R.push(["حجم ملف item.json كله",ds==null?"⚠ غير موجود في المجلد!":fmt(ds),ds==null?{cls:"bad"}:null]);
  }else R.push(["مكان التخزين","نص داخل item.json — لم يُكتب في المجلد بعد",{cls:"warn"}]);
  R.push(["ملاحظة","هذا نص (ليس ملفًا مستقلًا)، فيُحفظ داخل ملف item.json الخاص بالعنصر مع باقي بياناته."]);
  return["معلومات تخزين "+(lab||"البيانات"),R]}

/* ---------- النافذة ---------- */
function openOverlay(){
  const ov=document.createElement("div");ov.className="si-ov";ov.dir="rtl";
  ov.innerHTML='<div class="si-box" role="dialog"><div class="si-head"><b class="si-title">⚙ معلومات التخزين</b><button type="button" class="si-x" title="إغلاق">✕</button></div><div class="si-body"><div class="si-row"><div class="si-v"><span>جارٍ الفحص...</span></div></div></div></div>';
  const close=()=>{ov.remove();document.removeEventListener("keydown",onKey,true)};
  const onKey=e=>{if(e.key==="Escape"){e.stopPropagation();close()}};
  document.addEventListener("keydown",onKey,true);
  ov.addEventListener("click",e=>{if(e.target===ov)close()});
  ov.querySelector(".si-x").onclick=close;
  document.body.appendChild(ov);return ov}
function paint(ov,title,rows){
  ov.querySelector(".si-title").textContent="⚙ "+title;
  const body=ov.querySelector(".si-body");body.textContent="";
  for(const r of rows){if(!r)continue;
    const o=r[2]||{},row=document.createElement("div");row.className="si-row";
    const k=document.createElement("div");k.className="si-k";k.textContent=r[0];
    const v=document.createElement("div");v.className="si-v";
    const s=document.createElement("span");s.textContent=r[1];
    if(o.path){s.className="si-path";s.dir="ltr"}
    if(o.cls)s.classList.add("si-"+o.cls);
    v.appendChild(s);
    if(o.copy){const b=document.createElement("button");b.type="button";b.className="si-copy";b.textContent="نسخ";
      b.onclick=async()=>{try{await navigator.clipboard.writeText(r[1]);b.textContent="تم ✓"}catch(e){b.textContent="تعذّر"}setTimeout(()=>b.textContent="نسخ",1400)};
      v.appendChild(b)}
    row.append(k,v);body.appendChild(row)}}
async function show(d){
  if(!d)return;const ov=openOverlay();
  try{
    const c=await ctx();
    const f={file:rowsFile,item:rowsItem,folder:rowsFolder,field:rowsField}[d.kind]||rowsField;
    const[t,R]=await f(c,d);
    if(c.linked&&c.pending)R.push(["المزامنة","⏳ فيه تعديلات في دور المزامنة — الأرقام قد تتغير خلال ثوانٍ",{cls:"warn"}]);
    paint(ov,t,R);
  }catch(e){paint(ov,"معلومات التخزين",[["خطأ",String(e&&e.message||e),{cls:"bad"}]])}}

/* ---------- وضع الترس ---------- */
function tag(el,desc){
  if(!el)return;el.__si=desc;
  if(el.__siBtn){if(!el.contains(el.__siBtn))el.appendChild(el.__siBtn);return}
  let pos="";try{pos=el.isConnected?getComputedStyle(el).position:""}catch(e){}
  if(!pos||pos==="static")el.classList.add("si-host");
  const b=document.createElement("button");b.type="button";b.className="si-gear si-"+(desc.pos||"tl");
  b.textContent="⚙";b.title="معلومات التخزين: المكان والحجم";b.setAttribute("aria-label","معلومات التخزين");
  for(const ev of["mousedown","mouseup","pointerdown","pointerup","touchstart","touchend","dblclick","contextmenu"])b.addEventListener(ev,e=>e.stopPropagation());
  b.addEventListener("click",e=>{e.stopPropagation();e.preventDefault();show(el.__si)});
  el.__siBtn=b;el.appendChild(b)}
window.__SI={tag,show,fmt,bytes};
})();
</script>
