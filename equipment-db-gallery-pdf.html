  // (عنصر تحت عنصر) اللي بتظهر كتير في ردود ChatGPT/Claude — بدل ما كانت كلها بتتحط في مستوى واحد بس.
  function listMarkerOf(line){
    const expanded = line.replace(/\\t/g, "    ");
    let m = expanded.match(/^(\\s*)[-*•]\\s+(.+)$/);
    if(m) return {indent:m[1].length, type:"ul", text:m[2]};
    m = expanded.match(/^(\\s*)(\\d+)[.)]\\s+(.+)$/);
    if(m) return {indent:m[1].length, type:"ol", text:m[3], start:parseInt(m[2],10)};
    return null;
  }
  // بيبني <ul>/<ol> متداخلة بادئًا من السطر i، وبيرجع الـ HTML وموقع السطر التالي بعد القائمة كلها.
  function renderListBlock(lines, i){
    const levels = [];
    function openLevel(marker){
      levels.push({indent:marker.indent, type:marker.type, start:marker.start, parts:[]});
    }
    function closeTopLevel(){
      const lvl = levels.pop();
      const startAttr = (lvl.type==="ol" && lvl.start && lvl.start!==1) ? \` start="\${lvl.start}"\` : "";
      const inner = \`<\${lvl.type} class="md-list"\${startAttr}>\${lvl.parts.join("")}</\${lvl.type}>\`;
      if(levels.length){
        const parent = levels[levels.length-1];
        const lastIdx = parent.parts.length-1;
        parent.parts[lastIdx] = parent.parts[lastIdx].replace(/<\\/li>$/, inner + "</li>");
        return null;
      }
      return inner;
    }
    let out = "";
    while(i < lines.length){
      const raw = lines[i];
      if(raw.trim() === ""){
        let j = i+1;
        while(j < lines.length && lines[j].trim() === "") j++;
        if(j < lines.length && listMarkerOf(lines[j])){ i = j; continue; }
        break;
      }
      const marker = listMarkerOf(raw);
      if(!marker){
        // سطر متابعة (تكملة نص) تحت عنصر قائمة، من غير علامة قائمة، لكنه متزحزح لجوه
        if(levels.length && /^\\s+\\S/.test(raw) && raw.search(/\\S/) > levels[levels.length-1].indent){
          const parent = levels[levels.length-1];
          const lastIdx = parent.parts.length-1;
          parent.parts[lastIdx] = parent.parts[lastIdx].replace(/<\\/li>$/, " " + inlineMD(raw.trim()) + "</li>");
          i++; continue;
        }
        break;
      }
      while(levels.length && marker.indent < levels[levels.length-1].indent){
        const closed = closeTopLevel();
        if(closed) out += closed;
      }
      if(!levels.length || marker.indent > levels[levels.length-1].indent){
        openLevel(marker);
      } else if(marker.type !== levels[levels.length-1].type){
        const closed = closeTopLevel();
        if(closed) out += closed;
        openLevel(marker);
      }
      levels[levels.length-1].parts.push(\`<li>\${inlineMD(marker.text)}</li>\`);
      i++;
    }
    while(levels.length){
      const closed = closeTopLevel();
      if(closed) out += closed;
    }
    return {html: out, next: i};
  }
  // هذا هو المحرك المبسّط القديم (Markdown Lite) — بقى دلوقتي fallback بس بيشتغل لو المكتبات
  // الاحترافية (marked/highlight.js/إلخ) ما قدرتش تتحمّل (زي عدم وجود إنترنت).
  function renderMarkdownLegacy(raw){
    if(!raw || !raw.trim()) return '<span class="md-empty">(لا يوجد شرح — اضغط هنا للإضافة)</span>';
    const lines = raw.replace(/\\r\\n/g,"\\n").split("\\n");
    let html = "";
    let i = 0;
    let listBuf = null; // {type:'ul'|'ol', items:[]}
    function flushList(){
      if(listBuf){
        const tag = listBuf.type;
        html += \`<\${tag} class="md-list">\` + listBuf.items.map(it=>\`<li>\${inlineMD(it)}</li>\`).join("") + \`</\${tag}>\`;
        listBuf = null;
      }
    }
    while(i < lines.length){
      const line = lines[i];
      const trimmed = line.trim();

      // ردود الـ AI غالبًا بتحط سطر فاضي (أو أكتر) بين عناصر القائمة الواحدة. من غير المعالجة
      // دي، كل عنصر كان بيتحوّل لقائمة <ol>/<ul> منفصلة، فكانت كل الأرقام بتظهر "1." من كتر
      // ما القوائم بتتقطّع. هنا بنتخطى الأسطر الفاضية طالما اللي بعدها لسه من نفس نوع القائمة.
      if(trimmed === "" && listBuf){
        let j = i+1;
        while(j < lines.length && lines[j].trim() === "") j++;
        if(j < lines.length){
          const nt = lines[j].trim();
          if((listBuf.type === "ul" && isUlLine(nt)) || (listBuf.type === "ol" && isOlLine(nt))){
            i = j;
            continue;
          }
        }
      }

      // جدول Markdown بالخط المائل | a | b |
      if(/^\\|.*\\|$/.test(trimmed)){
        const rows = [];
        while(i < lines.length && /^\\|.*\\|$/.test(lines[i].trim())){
          const cells = lines[i].trim().slice(1,-1).split("|").map(c=>c.trim());
          if(!/^:?-{2,}:?$/.test(cells.join(""))) rows.push(cells);
          i++;
        }
        if(rows.length){
          flushList();
          html += buildTableHtml(rows);
        }
        continue;
      }

      // جدول سايب (تابات أو مسافات متعددة) — بنجمع كل الأسطر المتتالية اللي بتتقسّم لنفس عدد الأعمدة
      const rowCells = trimmed ? splitRow(trimmed) : null;
      if(rowCells){
        const rows = [rowCells];
        let j = i+1;
        let sameCount = rowCells.length;
        while(j < lines.length){
          const nt = lines[j].trim();
          if(nt === ""){
            const k = j+1;
            const nextCells = k<lines.length ? splitRow(lines[k].trim()) : null;
            if(nextCells && nextCells.length === sameCount){ j = k; continue; }
            break;
          }
          const cells = splitRow(nt);
          if(cells && cells.length === sameCount){ rows.push(cells); j++; }
          else break;
        }
        if(rows.length >= 2){
          flushList();
          html += buildTableHtml(rows);
          i = j;
          continue;
        }
      }

      // خط فاصل
      if(/^(-{3,}|_{3,}|\\*{3,})$/.test(trimmed)){
        flushList();
        html += "<hr class='md-hr'>";
        i++; continue;
      }

      // عناوين #
      const hMatch = trimmed.match(/^(#{1,4})\\s+(.+)$/);
      if(hMatch){
        flushList();
        const lvl = Math.min(hMatch[1].length + 3, 6);
        html += \`<h\${lvl} class="md-h">\${inlineMD(hMatch[2])}</h\${lvl}>\`;
        i++; continue;
      }

      // عناوين بإيموجي (زي "1️⃣ LDI — تحميل قيمة" أو "🔥 مثال يجمع...")
      const emojiMatch = trimmed.match(EMOJI_HEAD_RE);
      if(emojiMatch && trimmed.length < 90){
        flushList();
        html += \`<div class="md-emoji-head">\${inlineMD(trimmed)}</div>\`;
        i++; continue;
      }

      // سطر بولد كامل (**كده**) بيُستخدم كعنوان فرعي بدون # — شائع في ردود الـ AI
      if(BOLD_LINE_HEAD_RE.test(trimmed)){
        flushList();
        html += \`<div class="md-subhead">\${inlineMD(trimmed.match(BOLD_LINE_HEAD_RE)[1])}</div>\`;
        i++; continue;
      }

      // اقتباس (بيدعم كذا سطر وراء بعض وكمان تنسيق داخلي زي بولد/قوائم جوّه)
      if(/^>\\s?/.test(trimmed)){
        flushList();
        const quoteLines = [];
        while(i<lines.length && /^>\\s?/.test(lines[i].trim())){
          quoteLines.push(lines[i].trim().replace(/^>\\s?/,""));
          i++;
        }
        html += \`<blockquote class="md-quote">\${renderMarkdownLegacy(quoteLines.join("\\n"))}</blockquote>\`;
        continue;
      }

      // قوائم (بتدعم التعشيش — عنصر فرعي تحت عنصر رئيسي بمسافات بادئة، وسطور متابعة بدون علامة)
      if(listMarkerOf(line)){
        flushList();
        const block = renderListBlock(lines, i);
        html += block.html;
        i = block.next;
        continue;
      }
      // سطر قصير بيقف لوحده ومنتهي بـ ":" (زي "طريقة العمل:") — بيتعامل معاه كعنوان تمهيدي
      // مصغّر لو مش سطر رسم توضيحي ومش بداية جدول/قائمة بعده مباشرة بنفس السطر.
      if(COLON_HEAD_RE.test(trimmed) && !DIAGRAM_CHARS_RE.test(trimmed)){
        flushList();
        html += \`<div class="md-subhead">\${inlineMD(trimmed.slice(0,-1))}</div>\`;
        i++; continue;
      }

      flushList();

      // سطر فاضي
      if(trimmed === ""){ i++; continue; }

      // فقرة عادية (بنجمع الأسطر المتتالية اللي مش فاضية ومش من نوع خاص)
      const paraLines = [line];
      i++;
      while(i < lines.length && lines[i].trim() !== "" &&
            !/^\\|.*\\|$/.test(lines[i].trim()) &&
            !splitRow(lines[i].trim()) &&
            !/^(-{3,}|_{3,}|\\*{3,})$/.test(lines[i].trim()) &&
            !/^#{1,4}\\s+/.test(lines[i].trim()) &&
            !/^>\\s?/.test(lines[i].trim()) &&
            !isUlLine(lines[i].trim()) &&
            !isOlLine(lines[i].trim()) &&
            !EMOJI_HEAD_RE.test(lines[i].trim()) &&
            !BOLD_LINE_HEAD_RE.test(lines[i].trim()) &&
            !(COLON_HEAD_RE.test(lines[i].trim()) && !DIAGRAM_CHARS_RE.test(lines[i].trim()))){
        paraLines.push(lines[i]);
        i++;
      }
      const isDiagram = paraLines.length > 1
        ? paraLines.some(l => DIAGRAM_CHARS_RE.test(l))
        : (DIAGRAM_CHARS_RE.test(paraLines[0]) && paraLines[0].trim().length < 60);
      if(isDiagram){
        html += \`<pre class="md-diagram">\${paraLines.map(l=>escapeHtml(l)).join("\\n")}</pre>\`;
      } else {
        html += \`<p class="md-p">\${paraLines.map(l=>inlineMD(l.trim())).join("<br>")}</p>\`;
      }
    }
    flushList();
    return html;
  }
  function buildTableHtml(rows){
    const [head, ...body] = rows;
    let out = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
    out += head.map(c=>\`<th>\${inlineMD(c)}</th>\`).join("");
    out += "</tr></thead><tbody>";
    body.forEach(r=>{
      out += "<tr>" + r.map(c=>\`<td>\${inlineMD(c)}</td>\`).join("") + "</tr>";
    });
    out += "</tbody></table></div>";
    return out;
  }

  /* ===================== محرك ماركداون كامل (marked + DOMPurify + highlight.js + KaTeX + Mermaid) =====================
     ده المحرك الرئيسي دلوقتي. لو المكتبات مش متاحة (مفيش إنترنت مثلاً) بيرجع تلقائيًا لـ renderMarkdownLegacy. */
  const MD_LANG_ALIASES = { avr:"avrasm", asm:"avrasm", assembly:"avrasm", assembler:"avrasm" };
  let __mdReady = false;
  if(window.marked && window.DOMPurify){
    try{
      const renderer = new marked.Renderer();
      renderer.code = function(code, infostring){ return buildCodeBlockHtml(code, infostring); };
      marked.setOptions({ gfm:true, breaks:true, renderer });
      if(window.mermaid){ mermaid.initialize({ startOnLoad:false, theme:"default" }); }
      __mdReady = true;
    } catch(e){ __mdReady = false; }
  }

  function buildCodeBlockHtml(code, infostring){
    const langRaw = (infostring || "").trim().split(/\\s+/)[0] || "";
    const lang = langRaw.toLowerCase();
    if(lang === "diagram"){
      // رسم ASCII (اتحط في fenced block من wrapAsciiDiagrams) — يتعرض زي القديم بالظبط، بدون هيدر
      return \`<pre class="md-diagram">\${escapeHtml(code.replace(/\\n$/,""))}</pre>\`;
    }
    if(lang === "mermaid" && window.mermaid){
      return \`<div class="mermaid-pending" data-mermaid-src="\${encodeURIComponent(code)}">⏳ جاري تجهيز المخطط...</div>\`;
    }
    const hljsLang = MD_LANG_ALIASES[lang] || lang;
    let highlighted, labelText;
    try{
      if(window.hljs && hljsLang && hljs.getLanguage(hljsLang)){
        highlighted = hljs.highlight(code, { language: hljsLang, ignoreIllegals:true }).value;
        labelText = langRaw || hljsLang;
      } else if(window.hljs && lang !== "text" && lang !== "txt" && lang !== ""){
        const auto = hljs.highlightAuto(code);
        highlighted = auto.value;
        labelText = langRaw || auto.language || "كود";
      } else {
        highlighted = escapeHtml(code);
        labelText = langRaw || "نص";
      }
    } catch(e){
      highlighted = escapeHtml(code);
      labelText = langRaw || "كود";
    }
    const lineCount = Math.max(1, code.replace(/\\n$/,"").split("\\n").length);
    let nums = ""; for(let n=1;n<=lineCount;n++){ nums += (n>1?"\\n":"") + n; }
    return \`<div class="md-codewrap">
      <div class="md-codehead">
        <span class="md-codelang">\${escapeHtml(labelText)}</span>
        <div class="md-codebtns">
          <button type="button" class="md-codebtn" data-md-action="copy">📋 نسخ</button>
          <button type="button" class="md-codebtn" data-md-action="collapse">➖ طي</button>
        </div>
      </div>
      <div class="md-codebody">
        <div class="md-codenums" aria-hidden="true">\${nums}</div>
        <pre class="md-codepre"><code class="hljs">\${highlighted}</code></pre>
      </div>
    </div>\`;
  }

  // مستمع واحد للنقر على مستوى الصفحة (event delegation) بدل onclick مضمّن في الـ HTML —
  // أأمن مع DOMPurify (منظّف الـ HTML) وبيشتغل تلقائيًا مع أي كتلة كود جديدة من غير ما نربط أحداث لكل عنصر.
  document.addEventListener("click", function(e){
    const copyBtn = e.target.closest('.md-codebtn[data-md-action="copy"]');
    if(copyBtn){
      const wrap = copyBtn.closest(".md-codewrap");
      const codeEl = wrap && wrap.querySelector("code");
      if(codeEl && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(codeEl.textContent).then(()=>{
          const old = copyBtn.textContent;
          copyBtn.textContent = "✅ اتنسخ";
          setTimeout(()=>{ copyBtn.textContent = old; }, 1400);
        }).catch(()=>{});
      }
      return;
    }
    const collapseBtn = e.target.closest('.md-codebtn[data-md-action="collapse"]');
    if(collapseBtn){
      const wrap = collapseBtn.closest(".md-codewrap");
      if(wrap){
        const collapsed = wrap.classList.toggle("collapsed");
        collapseBtn.textContent = collapsed ? "➕ عرض" : "➖ طي";
      }
    }
  });

  // بنلف أسطر رسومات ASCII (┌─┐ إلخ) جوه fenced code block خاص، عشان تفضل ثابتة العرض
  // بالظبط ومتتلمسش من marked (زي منطق الرسومات في المحرك القديم بالظبط).
  function wrapAsciiDiagrams(raw){
    const segments = raw.split(/(\`\`\`[\\s\\S]*?\`\`\`|~~~[\\s\\S]*?~~~)/g);
    for(let s=0; s<segments.length; s+=2){
      const lines = segments[s].split("\\n");
      const out = [];
      let i = 0;
      while(i < lines.length){
        if(lines[i].trim() === ""){ out.push(lines[i]); i++; continue; }
        const para = [lines[i]]; i++;
        while(i < lines.length && lines[i].trim() !== ""){ para.push(lines[i]); i++; }
        const isDiagram = para.length > 1
          ? para.some(l => DIAGRAM_CHARS_RE.test(l))
          : (DIAGRAM_CHARS_RE.test(para[0]) && para[0].trim().length < 60);
        if(isDiagram){ out.push("\`\`\`diagram", ...para, "\`\`\`"); }
        else { out.push(...para); }
      }
      segments[s] = out.join("\\n");
    }
    return segments.join("");
  }

  // Footnotes: بنستخرج التعريفات [^1]: نص، وبنحوّل الإشارات [^1] لروابط <sup> فوق النص الأصلي
  // قبل ما نبعته لـ marked، عشان الـ HTML الجاهز ده يفضل زي ما هو من غير تعديل.
  function extractFootnoteDefs(raw){
    const defs = {};
    const text = raw.replace(/^\\[\\^([^\\]]+)\\]:\\s*(.+)$/gm, (m, id, def)=>{ defs[id]=def; return ""; });
    return { text, defs };
  }
  function applyFootnoteRefs(text, defs){
    const used = [];
    if(!Object.keys(defs).length) return { text, used };
    const replaced = text.replace(/\\[\\^([^\\]]+)\\]/g, (m, id)=>{
      if(!(id in defs)) return m;
      if(!used.includes(id)) used.push(id);
      const n = used.indexOf(id) + 1;
      return \`<sup class="md-fnref"><a href="#md-fn-\${escapeHtml(id)}" id="md-fnref-\${escapeHtml(id)}">\${n}</a></sup>\`;
    });
    return { text: replaced, used };
  }
  function buildFootnotesHtml(defs, used){
    if(!used.length) return "";
    let out = '<div class="md-footnotes"><hr class="md-hr"><ol class="md-fnlist">';
    used.forEach(id=>{
      out += \`<li id="md-fn-\${escapeHtml(id)}">\${inlineMD(defs[id]||"")} <a href="#md-fnref-\${escapeHtml(id)}" class="md-fnback" title="رجوع">↩</a></li>\`;
    });
    out += "</ol></div>";
    return out;
  }

  // صناديق تنبيه ملوّنة (زي 💡 Tip / ⚠ Warning في ChatGPT): بنكتشفها من أول إيموجي في الاقتباس.
  const MD_CALLOUT_MAP = { "💡":"tip", "📝":"tip", "✅":"tip", "⚠️":"warn", "⚠":"warn", "❗":"warn", "❕":"warn", "ℹ️":"info", "ℹ":"info", "🔴":"danger", "🚫":"danger", "❌":"danger" };
  function decorateRenderedHtml(containerEl){
    containerEl.querySelectorAll("blockquote").forEach(bq=>{
      bq.classList.add("md-quote");
      const firstText = (bq.querySelector("p,li") || bq).textContent.trim();
      for(const emo in MD_CALLOUT_MAP){
        if(firstText.indexOf(emo) === 0){ bq.classList.add("md-callout", "md-callout-"+MD_CALLOUT_MAP[emo]); break; }
      }
    });
    containerEl.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(h=> h.classList.add("md-h"));
    containerEl.querySelectorAll("p").forEach(p=> p.classList.add("md-p"));
    containerEl.querySelectorAll("ul,ol").forEach(l=> l.classList.add("md-list"));
    containerEl.querySelectorAll("ul").forEach(l=>{
      if(l.querySelector(":scope > li.task-list-item")) l.classList.add("md-tasklist");
    });
    containerEl.querySelectorAll("table").forEach(t=>{
      t.classList.add("md-table");
      if(!(t.parentElement && t.parentElement.classList.contains("md-table-wrap"))){
        const wrap = document.createElement("div");
        wrap.className = "md-table-wrap";
        t.parentNode.insertBefore(wrap, t);
        wrap.appendChild(t);
      }
    });
  }

  /** بتطبّق قواعد التنسيق المخصّصة (customFormatRules) على النص الخام قبل تمريره لمحرك
   *  الماركداون — بتحول كل تطابق لـ span/div بستايل مباشر، وبتتجاهل كتل الكود (\`\`\`...\`\`\`)
   *  عشان قواعد التنسيق متلخبطش جوه كود فعلي بيحتوي نفس الرموز بالصدفة. */
  function applyCustomFormatRules(raw){
    if(!customFormatRules.length) return raw;
    const segments = raw.split(/(\`\`\`[\\s\\S]*?\`\`\`)/g);
    return segments.map((seg, idx)=>{
      if(idx % 2 === 1) return seg; // كتلة كود — سيبها زي ما هي
      let text = seg;
      customFormatRules.forEach(rule=>{
        try{
          const icon = rule.icon ? escapeHtml(rule.icon) + " " : "";
          const css = escapeAttr(rule.css || "");
          if(rule.type === "wrap" && rule.marker){
            const m = rule.marker.replace(/[.*+?^\${}()|[\\]\\\\]/g, "\\\\$&");
            const re = new RegExp(m + "([^" + rule.marker[0].replace(/[.*+?^\${}()|[\\]\\\\]/g,"\\\\$&") + "]+?)" + m, "g");
            text = text.replace(re, (all, inner)=> \`<span style="\${css}">\${icon}\${escapeHtml(inner)}</span>\`);
          } else if(rule.type === "keyword" && rule.keyword){
            const kw = rule.keyword.replace(/[.*+?^\${}()|[\\]\\\\]/g, "\\\\$&");
            const re = new RegExp("(^|[^\\\\p{L}\\\\p{N}_])(" + kw + ")(?=[^\\\\p{L}\\\\p{N}_]|$)", "gu");
            text = text.replace(re, (all, pre, word)=> pre + \`<span style="\${css}">\${icon}\${escapeHtml(word)}</span>\`);
          } else if(rule.type === "block" && rule.prefix){
            const lines = text.split("\\n");
            const out = [];
            for(let i=0;i<lines.length;i++){
              if(lines[i].trim().indexOf(rule.prefix) === 0){
                const contentLines = [];
                const firstRest = lines[i].trim().slice(rule.prefix.length).trim();
                if(firstRest) contentLines.push(firstRest);
                let j = i+1;
                while(j<lines.length && lines[j].trim() !== ""){ contentLines.push(lines[j].trim()); j++; }
                out.push(\`<div style="\${css}">\${icon}\${escapeHtml(contentLines.join(" "))}</div>\`);
                i = j-1;
              } else {
                out.push(lines[i]);
              }
            }
            text = out.join("\\n");
          }
        }catch(e){ /* تجاهل أي قاعدة معطوبة عشان ما توقفش عرض باقي الشرح */ }
      });
      return text;
    }).join("");
  }

  /* ============================== شريط أدوات تنسيق النصوص ============================== */
  function wrapSelection(textarea, before, after, placeholder){
    const start = textarea.selectionStart, end = textarea.selectionEnd;
    const val = textarea.value;
    const hasSelection = end > start;
    const selected = hasSelection ? val.slice(start, end) : (placeholder || "");
    textarea.value = val.slice(0, start) + before + selected + after + val.slice(end);
    const selStart = start + before.length;
    const selEnd = selStart + selected.length;
    textarea.focus();
    textarea.setSelectionRange(selStart, selEnd);
    textarea.dispatchEvent(new Event("input", {bubbles:true}));
  }
  function insertLinePrefix(textarea, prefix){
    const start = textarea.selectionStart;
    const val = textarea.value;
    const lineStart = val.lastIndexOf("\\n", start-1) + 1;
    textarea.value = val.slice(0, lineStart) + prefix + val.slice(lineStart);
    const newPos = start + prefix.length;
    textarea.focus();
    textarea.setSelectionRange(newPos, newPos);
    textarea.dispatchEvent(new Event("input", {bubbles:true}));
  }
  function insertAtCursor(textarea, text){
    const start = textarea.selectionStart, end = textarea.selectionEnd;
    const val = textarea.value;
    textarea.value = val.slice(0,start) + text + val.slice(end);
    const pos = start + text.length;
    textarea.focus();
    textarea.setSelectionRange(pos, pos);
    textarea.dispatchEvent(new Event("input", {bubbles:true}));
  }
  /** بيبني شريط أدوات تنسيق كامل (بولد/مائل/عناوين/قوائم/روابط/جداول...) بالإضافة لأي
   *  قواعد مخصّصة مستوردة من JSON. getTextarea() لازم ترجع الـ textarea الحالي المرتبط. */
  function buildFormatToolbar(getTextarea){
    const bar = document.createElement("div");
    bar.className = "fmt-toolbar";
    function btn(label, title, handler, extraStyle){
      const b = document.createElement("button");
      b.type = "button";
      b.className = "fmt-btn";
      b.textContent = label;
      b.title = title || "";
      if(extraStyle) b.style.cssText = extraStyle;
      b.addEventListener("click", (e)=>{
        e.preventDefault();
        const ta = getTextarea();
        if(ta) handler(ta);
      });
      bar.appendChild(b);
      return b;
    }
    function sep(){ const s=document.createElement("span"); s.className="fmt-sep"; bar.appendChild(s); }

    btn("B", "عريض (Bold)", ta=> wrapSelection(ta, "**", "**", "نص عريض"), "font-weight:900;");
    btn("I", "مائل (Italic)", ta=> wrapSelection(ta, "*", "*", "نص مائل"), "font-style:italic;");
    btn("U", "تسطير (Underline)", ta=> wrapSelection(ta, "<u>", "</u>", "نص مسطّر"), "text-decoration:underline;");
    btn("S", "يتوسطه خط (Strikethrough)", ta=> wrapSelection(ta, "~~", "~~", "نص"), "text-decoration:line-through;");
    btn("==", "تمييز (Highlight)", ta=> wrapSelection(ta, "==", "==", "نص مميز"));
    sep();
    btn("H1", "عنوان كبير", ta=> insertLinePrefix(ta, "# "));
    btn("H2", "عنوان متوسط", ta=> insertLinePrefix(ta, "## "));
    btn("H3", "عنوان صغير", ta=> insertLinePrefix(ta, "### "));
    sep();
    btn("•", "قائمة نقطية", ta=> insertLinePrefix(ta, "- "));
    btn("1.", "قائمة مرقّمة", ta=> insertLinePrefix(ta, "1. "));
    btn("❝", "اقتباس", ta=> insertLinePrefix(ta, "> "));
    sep();
    btn("</>", "كود مضمّن", ta=> wrapSelection(ta, "\`", "\`", "code"));
    btn("{ }", "كتلة كود", ta=> insertAtCursor(ta, "\\n\`\`\`\\nكود هنا\\n\`\`\`\\n"));
    btn("🔗", "رابط", ta=>{
      const url = prompt("رابط URL:", "https://");
      if(url) wrapSelection(ta, "[", "](" + url + ")", "نص الرابط");
    });
    btn("▦", "جدول", ta=> insertAtCursor(ta, "\\n| عمود 1 | عمود 2 |\\n| --- | --- |\\n| قيمة | قيمة |\\n"));
    btn("―", "خط فاصل", ta=> insertAtCursor(ta, "\\n---\\n"));
    sep();
    btn("💡", "تنبيه (Tip)", ta=> insertLinePrefix(ta, "> 💡 "));
    btn("⚠️", "تحذير", ta=> insertLinePrefix(ta, "> ⚠️ "));

    if(customFormatRules.length){
      sep();
      customFormatRules.forEach(rule=>{
        const b = document.createElement("button");
        b.type = "button";
        b.className = "fmt-btn custom-rule";
        b.textContent = (rule.icon ? rule.icon+" " : "") + rule.name;
        b.title = "قاعدة مخصّصة: " + rule.name;
        b.addEventListener("click", (e)=>{
          e.preventDefault();
          const ta = getTextarea();
          if(!ta) return;
          if(rule.type === "wrap" && rule.marker) wrapSelection(ta, rule.marker, rule.marker, "نص");
          else if(rule.type === "keyword" && rule.keyword) insertAtCursor(ta, rule.keyword);
          else if(rule.type === "block" && rule.prefix) insertLinePrefix(ta, rule.prefix + " ");
        });
        bar.appendChild(b);
      });
    }
    return bar;
  }

  function renderMarkdownFull(raw){
    const withCustomRules = applyCustomFormatRules(raw);
    const wrapped = wrapAsciiDiagrams(withCustomRules.replace(/\\r\\n/g, "\\n"));
    const { text: noDefs, defs } = extractFootnoteDefs(wrapped);
    const { text: withRefs, used } = applyFootnoteRefs(noDefs, defs);
    const rawHtml = marked.parse(withRefs);
    const safeHtml = DOMPurify.sanitize(rawHtml);
    const tmp = document.createElement("div");
    tmp.innerHTML = safeHtml;
    decorateRenderedHtml(tmp);
    let finalHtml = tmp.innerHTML + buildFootnotesHtml(defs, used);
    if(window.renderMathInElement){
      try{
        const mathHost = document.createElement("div");
        mathHost.innerHTML = finalHtml;
        renderMathInElement(mathHost, {
          delimiters:[
            {left:"$$", right:"$$", display:true},
            {left:"\\\\[", right:"\\\\]", display:true},
            {left:"\\\\(", right:"\\\\)", display:false},
            {left:"$", right:"$", display:false}
          ],
          throwOnError:false
        });
        finalHtml = mathHost.innerHTML;
      } catch(e){ /* نتجاهل أي خطأ في KaTeX ونكمل عرض الباقي عادي */ }
    }
    return finalHtml;
  }

  // بعد ما الـ HTML يتحط فعليًا في الصفحة، بنفعّل أي مخططات Mermaid لسه مستنية (لازم تترسم Async).
  function enhanceMarkdownView(containerEl){
    if(!containerEl || !window.mermaid) return;
    const pendings = containerEl.querySelectorAll(".mermaid-pending");
    pendings.forEach(async (el)=>{
      const src = decodeURIComponent(el.dataset.mermaidSrc || "");
      try{
        const id = "mmd" + Math.random().toString(36).slice(2);
        const { svg } = await mermaid.render(id, src);
        el.outerHTML = \`<div class="mermaid-rendered">\${svg}</div>\`;
      } catch(e){
        el.outerHTML = \`<pre class="md-diagram">\${escapeHtml(src)}</pre>\`;
      }
    });
  }

  function renderMarkdownLite(raw){
    if(!raw || !raw.trim()) return '<span class="md-empty">(لا يوجد شرح — اضغط هنا للإضافة)</span>';
    if(__mdReady){
      try{ return renderMarkdownFull(raw); }
      catch(e){ return renderMarkdownLegacy(raw); }
    }
    return renderMarkdownLegacy(raw);
  }

  function getRuleset(langKey){
    return langRules[langKey] || langRules["plain"] || genericRules;
  }
  function highlight(code, langKey){
    const ruleset = getRuleset(langKey);
    let result = escapeHtml(code);
    // بنستخدم رموز PUA (مساحة استخدام خاص) كـ"عازل" بديل بعد كل تظليل، بدل نصوص \\u0000 القديمة.
    // ده لازم عشان لو قاعدة لاحقة (زي الأرقام أو النصوص) بتدور على حاجة شكلها موجود جوه
    // الـ style الملوّن اللي القاعدة اللي قبلها ظللته (زي "color:#569cd6")، ماتعيدش تظليله فوق بعضه.
    const stash = [];
    ruleset.rules.forEach(rule=>{
      try{
        const flags = (rule.flags && rule.flags.includes("g")) ? rule.flags : (rule.flags||"")+"g";
        const re = new RegExp(rule.pattern, flags);
        result = result.replace(re, (match)=>{
          if(/[\\uE000-\\uF8FF]/.test(match)) return match; // جزء منه اتظلل قبل كده، سيبه زي ما هو
          const idx = stash.length;
          stash.push('<span style="color:'+rule.color+'">'+match+'</span>');
          return String.fromCodePoint(0xE000 + idx);
        });
      }catch(e){ /* ignore bad user regex */ }
    });
    return result.replace(/[\\uE000-\\uF8FF]/g, ch => stash[ch.codePointAt(0) - 0xE000]);
  }
  function langOptions(selectedLang){
    return Object.keys(langRules).map(k=>{
      const d = langRules[k].displayName || k;
      return \`<option value="\${k}" \${k===selectedLang?"selected":""}>\${d}</option>\`;
    }).join("");
  }
