<script id="categories-and-move-system">
(function(){
"use strict";

/* =========================================================
   1) حالة الفئات + التخزين (Categories: مستقلة عن المجلدات)
   ========================================================= */
if(!Array.isArray(state.categories)) state.categories = [];
if(!state.categorySchemas || typeof state.categorySchemas !== 'object') state.categorySchemas = {};

const CAT_META_KEY = 'categoriesMeta';
let _catMetaLoaded = false;

async function loadCategoryMeta(){
  try{
    const row = await idbGet('meta', CAT_META_KEY);
    if(row && row.value){
      state.categories = Array.isArray(row.value.categories) ? row.value.categories : [];
      state.categorySchemas = (row.value.categorySchemas && typeof row.value.categorySchemas === 'object') ? row.value.categorySchemas : {};
    }
  }catch(e){}
}
async function saveCategoryMeta(){
  try{ await idbPut('meta', {key: CAT_META_KEY, value: {categories: state.categories, categorySchemas: state.categorySchemas}}); }catch(e){}
}
async function ensureCategoryMetaLoaded(){
  if(_catMetaLoaded) return;
  _catMetaLoaded = true;
  await loadCategoryMeta();
}
// نضمن تحميل بيانات الفئات مرة واحدة قبل أول عرض فعلي، دون التأثير على تسلسل فتح قاعدة البيانات في boot()
let pendingHighlightItemId = null;
function isSameHighlightFolder(view){
  if(view.type!=='folder') return false;
  const it = state.items.find(i=>i.id===pendingHighlightItemId);
  return !!(it && it.folderId===view.id);
}
const _origNavigateTo = navigateTo;
navigateTo = function(view){
  if(!_catMetaLoaded){
    ensureCategoryMetaLoaded().then(()=> _origNavigateTo(view));
    return;
  }
  if(pendingHighlightItemId){
    if(view.type==='item' && view.id===pendingHighlightItemId) pendingHighlightItemId=null;
    else if(!isSameHighlightFolder(view)) pendingHighlightItemId=null;
  }
  return _origNavigateTo(view);
};

function categorySpecKey(label){
  return 'cs_'+String(label||'').trim().toLowerCase().replace(/\s+/g,'_').replace(/[^\w\u0600-\u06ff-]/g,'_').slice(0,70);
}
function normalizeCategorySpecOptions(value){
  if(Array.isArray(value)) return value.map(x=>String(x??'').trim()).filter(Boolean);
  return String(value??'')
    .replace(/،/g,',')
    .replace(/[؛;]/g,',')
    .split(',')
    .map(x=>x.trim())
    .filter(Boolean);
}
function ensureCategorySchemaObj(cat){
  let schema = state.categorySchemas[cat];
  if(!schema || Array.isArray(schema)){
    // ترحيل من الصيغة القديمة (مصفوفة حقول بسيطة) إلى صيغة جدول الفئة الكاملة
    const oldArr = Array.isArray(schema) ? schema : [];
    schema = { description:'', specs: oldArr.map(f=>({
      key: f.key || f.id || categorySpecKey(f.label),
      label: f.label||'', type: f.type||'text', unit: f.unit||'', options: f.options||[]
    })) };
    state.categorySchemas[cat] = schema;
  }
  if(!Array.isArray(schema.specs)) schema.specs = [];
  if(typeof schema.description !== 'string') schema.description = '';
  return schema;
}
function getCategoryFields(categoryName){
  if(!categoryName) return [];
  const schema = state.categorySchemas[categoryName];
  const specs = (schema && Array.isArray(schema.specs)) ? schema.specs : (Array.isArray(schema) ? schema : []);
  return specs.map(f=>({ id: f.key||f.id, key: f.key||f.id, label: f.label, type: f.type||'text', unit: f.unit||'', options: f.options||[] }));
}
function getEffectiveItemFields(it){
  const folderFields = getEffectiveFieldTemplate(it.folderId) || [];
  const catFields = getCategoryFields(it.category) || [];
  const seen = new Set(folderFields.map(f=>f.id));
  const merged = folderFields.slice();
  catFields.forEach(f=>{ if(!seen.has(f.id)){ merged.push(f); seen.add(f.id); } });
  return merged;
}
function markCategoryUsageCount(name){ return state.items.filter(i=>i.category===name).length; }

function renderCategorySpecRow(spec){
  const options = Array.isArray(spec.options) ? spec.options.join(', ') : '';
  return `<tr data-cat-spec-row="${esc(spec.key)}">
    <td><input class="cat-spec-input" data-cs="label" value="${esc(spec.label||'')}" placeholder="اسم المواصفة"></td>
    <td><select class="cat-spec-input" data-cs="type">
      <option value="text" ${(spec.type||'text')==='text'?'selected':''}>نص / قيمة</option>
      <option value="number" ${spec.type==='number'?'selected':''}>رقم</option>
      <option value="select" ${spec.type==='select'?'selected':''}>قائمة اختيار</option>
    </select></td>
    <td><input class="cat-spec-input" data-cs="unit" value="${esc(spec.unit||'')}" placeholder="V / A / W"></td>
    <td><input class="cat-spec-input" data-cs="options" value="${esc(options)}" placeholder="NPN, PNP, MOSFET"></td>
    <td><button type="button" class="btn small danger" data-cat-del-spec="${esc(spec.key)}">🗑 حذف</button></td>
  </tr>`;
}

/* =========================================================
   3) دمج الفئة داخل مودال العنصر (بدون لمس الدالة الأصلية)
   نعتمد خدعة: نضع صندوق مواصفات الفئة بنفس id="specFields"
   عشان معالج الحفظ الأصلي (اللي بيقرأ document.querySelectorAll
   "#specFields [data-fid]") يلتقط قيمها تلقائيًا ضمن it.fields.
   ========================================================= */
function normLabel(s){
  return String(s??'')
    .replace(/[\u064B-\u065F\u0670]/g,'')
    .replace(/^[•\-–—*]+\s*/,'')
    .replace(/[:：\-–—]+$/,'')
    .trim()
    .toLowerCase()
    .replace(/\s+/g,' ');
}
function insertItemAutofillBox(){
  const basicPanel = document.querySelector('.mtab-panel[data-panel="basic"]');
  if(!basicPanel || basicPanel.querySelector('#itemAutofillBox')) return;
  const box = document.createElement('div');
  box.id = 'itemAutofillBox';
  box.className = 'cat-autofill-box';
  box.innerHTML = `
    <div class="cat-autofill-title">🪄 ملء تلقائي من نص ملصوق</div>
    <div class="cat-autofill-sub">الصق البيانات — أي سطر يبدأ باسم حقل موجود فعلًا في هذا النموذج (متبوع بمسافة أو فاصلة أو نقطتين) هيتسجل تلقائيًا في حقله المناسب، بغض النظر عن ترتيبها. أي سطر مش مطابق يُتجاهل.</div>
    <textarea class="cat-autofill-input" id="itemAutofillInput" placeholder="الصق البيانات هنا..."></textarea>
    <div class="cat-autofill-row">
      <button type="button" class="btn small primary" id="itemAutofillBtn">✨ تحليل وملء الحقول</button>
      <span class="cat-autofill-result" id="itemAutofillResult"></span>
    </div>
  `;
  basicPanel.insertBefore(box, basicPanel.firstChild);

  document.getElementById('itemAutofillBtn').onclick = ()=>{
    const ta = document.getElementById('itemAutofillInput');
    const resultEl = document.getElementById('itemAutofillResult');
    const raw = ta ? ta.value : '';
    if(!raw || !raw.trim()){ if(resultEl) resultEl.textContent='⚠️ الصق البيانات في المربع أولًا.'; return; }

    // نجمع كل الحقول المتاحة حاليًا في النموذج: الأساسية + الديناميكية (مجلد/فئة)
    const candidates = [];
    const seen = new Set();
    function addCandidate(label, setter){
      const t = String(label||'').trim();
      if(!t) return;
      const nk = normLabel(t);
      if(seen.has(nk)) return;
      seen.add(nk);
      candidates.push({text:t, norm:nk, setter});
    }
    const BASIC_FIELDS = [
      ['اسم العنصر','iName'], ['الاسم','iName'],
      ['الموديل','iModel'],
      ['الشركة المصنعة','iManufacturer'], ['الشركة','iManufacturer'],
      ['الرقم التسلسلي','iSerial'],
      ['رقم القطعة','iPartNumber'],
      ['النوع','iType'],
      ['الحالة','iStatus']
    ];
    BASIC_FIELDS.forEach(([label, elId])=>{
      const el = document.getElementById(elId);
      if(el) addCandidate(label, (val)=>{ el.value = val; });
    });
    document.querySelectorAll('#specFields [data-fid]').forEach(inp=>{
      const row = inp.closest('.field');
      const labelEl = row ? row.querySelector('label') : null;
      let labelText = labelEl ? labelEl.textContent : '';
      labelText = labelText.replace(/\s*\([^)]*\)\s*$/,''); // تجاهل الوحدة بين قوسين عند المطابقة
      addCandidate(labelText, (val)=>{ inp.value = val; });
    });

    // الأطول أولًا، عشان "مدى القياس" تتطابق قبل "المدى" مثلًا
    candidates.sort((a,b)=> b.text.length - a.text.length);

    const stripValue = (v)=>{
      let r = v.replace(/^\s+/, '');
      r = r.replace(/^[,:：]+\s*/, '');
      r = r.replace(/^[–—]+\s*/, '');
      r = r.replace(/^-\s+/, '');
      r = r.replace(/^\s+/, '');
      return r.replace(/\s*,+\s*$/, '').trim();
    };
    const lines = raw.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>l.length);
    const found = [];
    let pendingSetter = null;
    lines.forEach(line=>{
      const hit = candidates.find(c=>{
        if(!line.toLowerCase().startsWith(c.text.toLowerCase())) return false;
        const rest = line.slice(c.text.length);
        return rest==='' || /^[\s,:：\-–—(]/.test(rest);
      });
      if(hit){
        const remainder = stripValue(line.slice(hit.text.length));
        if(remainder){ found.push({setter:hit.setter, val:remainder}); pendingSetter=null; }
        else { pendingSetter = hit.setter; }
        return;
      }
      if(pendingSetter){
        found.push({setter:pendingSetter, val: stripValue(line)});
        pendingSetter = null;
        return;
      }
      // أي سطر تاني غير مطابق ومفيش حقل مستنٍ قيمة → يُتجاهل نهائيًا
    });
    found.forEach(f=> f.setter(f.val));
    if(resultEl){
      resultEl.textContent = found.length
        ? `✅ تم التعرف على ${found.length} حقل وملؤها.`
        : '⚠️ لم يتم التعرف على أي حقل. تأكد أن أسماء الحقول في النص مطابقة لتسميات حقول هذا النموذج.';
    }
  };
}

function enhanceItemModalWithCategory(itemId){
  const basicPanel = document.querySelector('.mtab-panel[data-panel="basic"]');
  if(!basicPanel) return;
  insertItemAutofillBox();
  const existingItem = itemId ? state.items.find(i=>i.id===itemId) : null;
  const currentCat = existingItem ? (existingItem.category||'') : '';
  const beforeUpdatedAt = existingItem ? existingItem.updatedAt : null;

  const catBox = document.createElement('div');
  catBox.id = 'itemCategoryBox';
  const options = '<option value="">— بدون فئة —</option>' + state.categories.map(c=>`<option value="${esc(c)}" ${c===currentCat?'selected':''}>${esc(c)}</option>`).join('');
  catBox.innerHTML = `
    <div class="field"><label>🏷️ الفئة (مستقلة عن المجلد — تُستخدم في البحث المتقدم)</label>
      <select id="itemCategorySelect">${options}</select>
    </div>
    <div id="itemCategoryFieldsBox"></div>
  `;
  const folderSpecHead = basicPanel.querySelector('.sec-head');
  if(folderSpecHead) basicPanel.insertBefore(catBox, folderSpecHead);
  else basicPanel.appendChild(catBox);

  function renderCatFields(catName){
    const box = document.getElementById('itemCategoryFieldsBox');
    const fields = getCategoryFields(catName);
    if(!fields.length){ box.innerHTML=''; return; }
    box.innerHTML = '<div class="sec-head" style="margin-top:10px"><h2>مواصفات الفئة</h2><div class="line"></div></div><div id="specFields"></div>';
    const holder = box.querySelector('#specFields');
    fields.forEach(f=>{
      const row = document.createElement('div');
      row.className = 'field';
      const val = existingItem && existingItem.fields ? (existingItem.fields[f.id]||'') : '';
      const labelHtml = `<label>${esc(f.label)}${f.unit? ' ('+esc(f.unit)+')':''}</label>`;
      if(f.type==='select' && Array.isArray(f.options) && f.options.length){
        const opts = '<option value="">— اختر —</option>' + f.options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('');
        row.innerHTML = `${labelHtml}<select data-fid="${f.id}">${opts}</select>`;
      } else {
        const inputType = f.type==='number' ? 'number' : 'text';
        row.innerHTML = `${labelHtml}<input type="${inputType}" data-fid="${f.id}" value="${esc(val)}">`;
      }
      holder.appendChild(row);
    });
  }
  renderCatFields(currentCat);
  document.getElementById('itemCategorySelect').onchange = (e)=> renderCatFields(e.target.value);

  const saveBtn = document.getElementById('mSave');
  if(saveBtn){
    saveBtn.addEventListener('click', ()=>{
      const chosenCat = document.getElementById('itemCategorySelect')?.value || '';
      setTimeout(async ()=>{
        const targetId = (state.view && state.view.type==='item') ? state.view.id : null;
        if(!targetId) return; // فشل التحقق من الاسم أو أُلغيت العملية، لا نغيّر شيئًا
        const saved = state.items.find(i=>i.id===targetId);
        if(!saved) return;
        const isNew = !itemId;
        const wasActuallySaved = isNew ? true : (saved.updatedAt !== beforeUpdatedAt);
        if(!wasActuallySaved) return;
        if(saved.category !== chosenCat){
          saved.category = chosenCat;
          await saveAndFlag('items', saved);
          render();
        }
      }, 150);
    });
  }
}

const _origRenderItemGallery = renderItemGallery;
renderItemGallery = async function(holder, items){
  await _origRenderItemGallery(holder, items);
  const cards = holder.querySelectorAll('.item-card');
  cards.forEach((card, idx)=>{
    const it = items[idx];
    if(!it) return;
    card.dataset.id = it.id;
    if(it.category){
      const catFields = getCategoryFields(it.category);
      let extra = '';
      catFields.forEach(f=>{
        const val = it.fields ? it.fields[f.id] : null;
        if(val==null || val==='') return;
        extra += `<div class="row"><span class="k">${esc(f.label)}</span><span class="v">${esc(val)}${f.unit?esc(f.unit):''}</span></div>`;
      });
      const fieldsBox = card.querySelector('.item-fields');
      if(fieldsBox && extra) fieldsBox.insertAdjacentHTML('beforeend', extra);
      const body = card.querySelector('.item-body');
      const nameEl = body ? body.querySelector('.item-name') : null;
      if(nameEl && !body.querySelector('.cat-chip')){
        const chip = document.createElement('div');
        chip.className = 'cat-chip';

        nameEl.after(chip);

    if(pendingHighlightItemId && it.id===pendingHighlightItemId){
      card.classList.add('search-highlight');
      setTimeout(()=>{ card.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
    }
  });

};

function renderCategoriesPageView(c){
  c.innerHTML = `
    <div class="view-title"><h1>🏷️ الفئات والمواصفات</h1><span class="sub">قاعدة بيانات category الحالية: كل فئة لها جدول مواصفات مستقل يمكنك إضافته وتعديله وحذفه</span></div>
    <div class="category-db-layout">
      <section class="panel category-list-panel">
        <div class="category-panel-head">
          <div><h3 style="margin:0">🗂️ الفئات</h3><span class="category-muted">عدد الفئات: ${state.categories.length}</span></div>

  let selected = state.categories[0] || null;
  const listEl = document.getElementById('categoryList');
  const editorEl = document.getElementById('categoryEditor');
  const selectedCats = new Set();
  let catDragWrap = null, catDragMoved = false;

  function catDragMove(e){
    if(!catDragWrap) return;
    catDragMoved = true;
    const rows = [...listEl.querySelectorAll('.category-row-wrap')];
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    for(const row of rows){
      if(row===catDragWrap) continue;
      const r = row.getBoundingClientRect();
      if(y>r.top && y<r.bottom){
        if(y<r.top+r.height/2) listEl.insertBefore(catDragWrap, row);
        else listEl.insertBefore(catDragWrap, row.nextSibling);
        break;
      }
    }
    e.preventDefault();
  }
  function catDragEnd(){
    if(!catDragWrap) return;
    catDragWrap.classList.remove('dragging');
    const wasMoved = catDragMoved;
    const newOrder = [...listEl.querySelectorAll('.category-row-wrap')].map(w=>w.dataset.cat);
    const rest = state.categories.filter(cc=>!newOrder.includes(cc));
    state.categories = [...newOrder, ...rest];
    catDragWrap=null; catDragMoved=false;
    document.removeEventListener('pointermove', catDragMove);
    document.removeEventListener('pointerup', catDragEnd);
    document.removeEventListener('pointercancel', catDragEnd);
    document.removeEventListener('touchmove', catDragMove);
    document.removeEventListener('touchend', catDragEnd);
    document.removeEventListener('touchcancel', catDragEnd);
    if(wasMoved){ saveCategoryMeta(); drawList(document.getElementById('catSearch').value); }
  }
  function catDragStart(e){
    if(catDragWrap) return;
    const handle = e.target.closest('.cat-drag-handle');
    if(!handle) return;
    const wrap = handle.closest('.category-row-wrap');
    if(!wrap) return;
    catDragWrap = wrap; catDragMoved=false;
    wrap.classList.add('dragging');
    document.addEventListener('pointermove', catDragMove);
    document.addEventListener('pointerup', catDragEnd);
    document.addEventListener('pointercancel', catDragEnd);
    document.addEventListener('touchmove', catDragMove, {passive:false});
    document.addEventListener('touchend', catDragEnd);
    document.addEventListener('touchcancel', catDragEnd);
    e.preventDefault();
  }
  listEl.addEventListener('pointerdown', catDragStart);
  listEl.addEventListener('touchstart', catDragStart, {passive:false});

  function drawList(filter=''){
    const f = String(filter||'').trim().toLowerCase(), filtering = !!f;
    const cats = state.categories.filter(cc=>!f || cc.toLowerCase().includes(f));
    const bulkBarHTML = `<div class="category-bulk-bar ${selectedCats.size?'':'hidden'}" id="catBulkBar"><span>${selectedCats.size} فئة محددة</span><button type="button" class="btn small" id="catSelectNoneBtn">إلغاء التحديد</button><button type="button" class="btn small danger" id="catBulkDeleteBtn">🗑 حذف المحدد</button></div>`;
    listEl.innerHTML = bulkBarHTML + (cats.length ? cats.map(cat=>{
      const schema = ensureCategorySchemaObj(cat);
      const count = schema.specs.length;
      const compCount = markCategoryUsageCount(cat);
      const checked = selectedCats.has(cat);
      return `<div class="category-row-wrap" data-cat="${esc(cat)}">${filtering?'':'<span class="cat-drag-handle" title="اسحب لإعادة الترتيب">⠿</span>'}<label class="cat-select-check"><input type="checkbox" data-cat-check="${esc(cat)}" ${checked?'checked':''}></label><button type="button" class="category-row ${cat===selected?'active':''}" data-cat="${esc(cat)}"><span class="category-row-main"><b>${esc(cat)}</b><small>${compCount} عنصر · ${count} مواصفة</small></span><span class="category-row-arrow">‹</span></button></div>`;
    }).join('') : '<div class="empty-state" style="padding:25px 10px">لا توجد فئات مطابقة</div>');

    listEl.querySelectorAll('.category-row[data-cat]').forEach(btn=> btn.onclick = ()=>{
      selected = btn.dataset.cat;
      drawList(document.getElementById('catSearch').value);
      drawEditor();
    });
    listEl.querySelectorAll('[data-cat-check]').forEach(chk=>{
      chk.addEventListener('change', ()=>{
        const cat = chk.dataset.catCheck;
        if(chk.checked) selectedCats.add(cat); else selectedCats.delete(cat);
        drawList(document.getElementById('catSearch').value);
      });
    });
    const noneBtn = document.getElementById('catSelectNoneBtn');
    if(noneBtn) noneBtn.onclick = ()=>{ selectedCats.clear(); drawList(document.getElementById('catSearch').value); };
    const bulkDelBtn = document.getElementById('catBulkDeleteBtn');
    if(bulkDelBtn) bulkDelBtn.onclick = async ()=>{
      const list=[...selectedCats];
      if(!list.length) return;
      const usedTotal = state.items.filter(i=>list.includes(i.category)).length;
      const msg = usedTotal? `حذف ${list.length} فئة؟ سيتم إزالة تصنيف ${usedTotal} عنصر مرتبط بها (العناصر نفسها تبقى موجودة).` : `حذف ${list.length} فئة محددة؟`;
      if(!confirm(msg)) return;
      const affected = state.items.filter(i=>list.includes(i.category));
      for(const it of affected){ it.category=''; await saveAndFlag('items', it); }
      list.forEach(cat=> delete state.categorySchemas[cat]);
      state.categories = state.categories.filter(cc=>!list.includes(cc));
      selectedCats.clear();
      if(!state.categories.includes(selected)) selected = state.categories[0]||null;
      await saveCategoryMeta();
      drawList(document.getElementById('catSearch').value);
      drawEditor();
      toast(`تم حذف ${list.length} فئة`, 'ok');
    };
  }

  function drawEditor(){
    if(!selected || !state.categories.includes(selected)){ editorEl.innerHTML='<div class="empty-state">اختر فئة لبدء العمل</div>'; return; }
    const schema = ensureCategorySchemaObj(selected);
    editorEl.innerHTML = `
      <div class="category-editor-head">
        <div>
          <div class="category-kicker">CATEGORY TABLE</div>
          <h2>${esc(selected)}</h2>
          <p>هذه الفئة ليست نظامًا منفصلًا؛ إنها نفس حقل <b>category</b> الموجود بالعناصر، لكن إدارتها أصبحت في جدول مستقل.</p>
        </div>
        <div class="category-editor-actions">
          <button type="button" class="btn small" id="catRenameBtn">✏️ تعديل اسم الفئة</button>
          <button type="button" class="btn small danger" id="catDeleteBtn">🗑 حذف الفئة</button>
        </div>
      </div>
      <div class="category-desc-row">
        <label>وصف الفئة</label>
        <input id="catDescription" value="${esc(schema.description||'')}" placeholder="مثال: جميع أجهزة القياس المستخدمة في الورشة">
        <button type="button" class="btn small" id="catDescSave">حفظ</button>
      </div>
      <div class="category-spec-toolbar">
        <div><b>مواصفات الفئة</b><span> · ${schema.specs.length} مواصفة</span></div>
        <button type="button" class="btn primary small" id="catAddSpecBtn">＋ إضافة مواصفة</button>
      </div>
      <div class="cat-autofill-box">
        <div class="cat-autofill-title">🪄 ملء تلقائي لأسماء المواصفات</div>
        <div class="cat-autofill-sub">الصق قائمة أسماء المواصفات (اسم واحد في كل سطر) وسيتم إنشاء مواصفة نصية لكل اسم جديد، بنفس ترتيب اللصق. الأسماء المكررة (الموجودة بالفعل) تُتخطى تلقائيًا.</div>
        <textarea class="cat-autofill-input" id="catSpecBulkInput" placeholder="اسم المواصفة الأولى
اسم المواصفة الثانية
..."></textarea>
        <div class="cat-autofill-row"><button type="button" class="btn small primary" id="catSpecBulkBtn">✨ تحويل إلى مواصفات</button><span class="cat-autofill-result" id="catSpecBulkResult"></span></div>
      </div>
      <div class="category-table-wrap">
        <table class="tbl category-spec-table">
          <thead><tr><th>اسم المواصفة</th><th>نوع الحقل</th><th>الوحدة</th><th>خيارات القائمة</th><th>إجراء</th></tr></thead>
          <tbody id="categorySpecBody">${schema.specs.map(renderCategorySpecRow).join('') || '<tr><td colspan="5" class="category-no-specs">لا توجد مواصفات بعد — أضف أول مواصفة للفئة.</td></tr>'}</tbody>
        </table>
      </div>
    `;

    document.getElementById('catDescSave').onclick = async ()=>{
      schema.description = document.getElementById('catDescription').value.trim();
      await saveCategoryMeta();
      toast('تم حفظ وصف الفئة', 'ok');
    };

    document.getElementById('catRenameBtn').onclick = async ()=>{
      const next = prompt('اسم الفئة الجديد:', selected);
      if(next===null) return;
      const name = next.trim();
      if(!name || name===selected) return;
      if(state.categories.includes(name)){ toast('هذه الفئة موجودة بالفعل', 'err'); return; }
      const oldName = selected;
      state.categories[state.categories.indexOf(oldName)] = name;
      state.categorySchemas[name] = state.categorySchemas[oldName];
      delete state.categorySchemas[oldName];
      const affected = state.items.filter(i=>i.category===oldName);
      for(const it of affected){ it.category=name; await saveAndFlag('items', it); }
      selected = name;
      await saveCategoryMeta();
      drawList(document.getElementById('catSearch').value);
      drawEditor();
      toast('تم تعديل اسم الفئة وتحديث العناصر المرتبطة بها', 'ok');
    };

    document.getElementById('catDeleteBtn').onclick = async ()=>{
      const used = markCategoryUsageCount(selected);
      const msg = used? `الفئة «${selected}» مستخدمة في ${used} عنصر. حذفها سيزيل تصنيفها فقط (العناصر نفسها تبقى موجودة). هل تريد المتابعة؟` : `حذف الفئة «${selected}» مع جدول مواصفاتها؟`;
      if(!confirm(msg)) return;
      const affected = state.items.filter(i=>i.category===selected);
      for(const it of affected){ it.category=''; await saveAndFlag('items', it); }
      delete state.categorySchemas[selected];
      state.categories = state.categories.filter(cc=>cc!==selected);
      selected = state.categories[0]||null;
      await saveCategoryMeta();
      drawList(document.getElementById('catSearch').value);
      drawEditor();
      toast('تم حذف الفئة', 'ok');
    };

    document.getElementById('catAddSpecBtn').onclick = async ()=>{
      let key='spec_'+Date.now().toString(36), n=1;
      while(schema.specs.some(x=>x.key===key)) key='spec_'+Date.now().toString(36)+'_'+(n++);
      schema.specs.push({key, label:'مواصفة جديدة', type:'text', unit:'', options:[]});
      await saveCategoryMeta();
      drawEditor();
      setTimeout(()=>{ const el=editorEl.querySelector('[data-cat-spec-row="'+key+'"] [data-cs="label"]'); if(el){ el.focus(); el.select(); } }, 30);
    };

    document.getElementById('catSpecBulkBtn').onclick = async ()=>{
      const ta=document.getElementById('catSpecBulkInput'), resEl=document.getElementById('catSpecBulkResult');
      const raw = ta? ta.value : '';
      if(!raw || !raw.trim()){ if(resEl) resEl.textContent='⚠️ الصق أسماء المواصفات في المربع أولًا.'; return; }
      const lines = raw.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>l.length);
      const existingLabels = new Set(schema.specs.map(s=>String(s.label||'').trim().toLowerCase()));
      let added=0, skipped=0;
      lines.forEach(line=>{
        const norm=line.toLowerCase();
        if(existingLabels.has(norm)){ skipped++; return; }
        let key=categorySpecKey(line), n=1;
        while(schema.specs.some(x=>x.key===key)) key=categorySpecKey(line)+'_'+(n++);
        schema.specs.push({key, label:line, type:'text', unit:'', options:[]});
        existingLabels.add(norm);
        added++;
      });
      if(added){
        await saveCategoryMeta();
        drawEditor();
        drawList(document.getElementById('catSearch').value);
        toast(`تمت إضافة ${added} مواصفة جديدة${skipped?` (وتخطي ${skipped} مكررة)`:''}`, 'ok');
      } else if(resEl){
        resEl.textContent = skipped? `⚠️ كل الأسماء (${skipped}) موجودة بالفعل — لم تُضَف أي مواصفة جديدة.` : '⚠️ لم يتم العثور على أي اسم صالح في النص.';
      }
    };

    editorEl.querySelectorAll('[data-cat-spec-row]').forEach(row=>{
      const key=row.dataset.catSpecRow, spec=schema.specs.find(x=>x.key===key);
      if(!spec) return;
      row.querySelectorAll('[data-cs]').forEach(inp=>{
        const saveField = async ()=>{
          const field=inp.dataset.cs;
          if(field==='options'){ spec.options=normalizeCategorySpecOptions(inp.value); if(spec.options.length) spec.type='select'; }
          else spec[field]=inp.value.trim();
          await saveCategoryMeta();
          if(field==='label') drawList(document.getElementById('catSearch').value);
        };
        inp.addEventListener('change', saveField);
        if(inp.dataset.cs==='options') inp.addEventListener('input', saveField);
      });
    });

    editorEl.querySelectorAll('[data-cat-del-spec]').forEach(btn=> btn.onclick = async ()=>{
      const key=btn.dataset.catDelSpec, spec=schema.specs.find(x=>x.key===key);
      if(!confirm(`حذف المواصفة «${spec?.label||key}» من فئة «${selected}»؟`)) return;
      schema.specs = schema.specs.filter(x=>x.key!==key);
      await saveCategoryMeta();
      drawEditor();
      drawList(document.getElementById('catSearch').value);
    });
  }

  document.getElementById('catSearch').addEventListener('input', e=> drawList(e.target.value));
  document.getElementById('catAddBtn').onclick = async ()=>{
    const name0 = prompt('اسم الفئة الجديدة:');
    if(name0===null) return;
    const cat = name0.trim();
    if(!cat) return;
    if(state.categories.includes(cat)){ toast('الفئة موجودة بالفعل', 'err'); return; }
    state.categories.push(cat);
    state.categorySchemas[cat] = {description:'', specs:[]};
    selected = cat;
    await saveCategoryMeta();
    drawList();
    drawEditor();
    toast('تمت إضافة الفئة', 'ok');
  };

  drawList();
  drawEditor();
}

      <div class="acs-field-wrap">
        <label>الفئة</label>
        <select id="acsCat"><option value="">— اختر —</option></select>
      </div>
      <div class="acs-field-wrap">
        <label>المواصفة <span class="opt">(اختياري)</span></label>
        <select id="acsField"><option value="">— الكل —</option></select>
      </div>
    </div>
    <div class="acs-row">
      <div class="acs-field-wrap acs-query-wrap">
        <label>القيمة <span class="opt">(اضغط هنا لعرض كل عناصر الفئة، أو اكتب للفلترة)</span></label>
        <input id="acsVal" placeholder="اكتب قيمة المواصفة..." autocomplete="off">
        <div id="acsResultBox" class="acs-dropdown"></div>
      </div>
    </div>
    <div class="acs-row acs-actions">
      <button type="button" class="btn small" id="acsClearBtn">مسح</button>
    </div>
  `;
  function closeDropdown(){ bar.querySelector('#acsResultBox').innerHTML=''; }
  bar.querySelector('#acsCat').addEventListener('change', ()=>{
    populateAcsFields();
    bar.querySelector('#acsVal').value='';
    if(bar.querySelector('#acsCat').value) runAcsSearch();
    else closeDropdown();
  });
  bar.querySelector('#acsField').addEventListener('change', ()=>{
    if(bar.querySelector('#acsCat').value) runAcsSearch();
  });
  bar.querySelector('#acsClearBtn').addEventListener('click', ()=>{
    bar.querySelector('#acsCat').value='';
    populateAcsFields();
    bar.querySelector('#acsVal').value='';
    closeDropdown();
  });
  bar.querySelector('#acsVal').addEventListener('input', ()=>{
    if(bar.querySelector('#acsCat').value) runAcsSearch();
  });
  bar.querySelector('#acsVal').addEventListener('focus', ()=>{
    // أول ما يحدد فئة ويدوس على مربع القيمة، نعرضله كل عناصر الفئة فورًا كقائمة عائمة فوق الصفحة
    if(bar.querySelector('#acsCat').value) runAcsSearch();
  });
  bar.querySelector('#acsVal').addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); runAcsSearch(); }
    if(e.key==='Escape'){ closeDropdown(); bar.querySelector('#acsVal').blur(); }
  });
  document.addEventListener('click', (e)=>{
    if(acsBarEl && !acsBarEl.contains(e.target)) closeDropdown();
  });
  return bar;
}
function populateAcsCategories(){
  if(!acsBarEl) return;
  const sel = acsBarEl.querySelector('#acsCat');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— اختر —</option>' + state.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if(state.categories.includes(cur)) sel.value = cur;
  populateAcsFields();
}
function populateAcsFields(){
  if(!acsBarEl) return;
  const cat = acsBarEl.querySelector('#acsCat').value;
  const sel = acsBarEl.querySelector('#acsField');
  const cur = sel.value;
  const fields = getCategoryFields(cat);
  sel.innerHTML = '<option value="">— الكل —</option>' + fields.map(f=>`<option value="${f.id}">${esc(f.label)}</option>`).join('');
  if(fields.some(f=>f.id===cur)) sel.value = cur;
}
const ACS_CHIP_PALETTE = ['#f2a93c','#4da3ff','#3ddc84','#ff5d5d','#c77dff','#ffb703','#06d6a0','#f72585','#38bdf8','#fb923c'];
function chipColorFor(fieldId){
  let h=0;
  for(let i=0;i<fieldId.length;i++) h=(h*31 + fieldId.charCodeAt(i))>>>0;
  return ACS_CHIP_PALETTE[h % ACS_CHIP_PALETTE.length];
}
function goToItemLocation(itemId){
  const it = state.items.find(i=>i.id===itemId);
  if(!it) return;
  pendingHighlightItemId = itemId;
  acsBarEl.querySelector('#acsResultBox').innerHTML='';
  navigateTo({type:'folder', id: it.folderId});
}
function runAcsSearch(){
  const cat = acsBarEl.querySelector('#acsCat').value;
  const fid = acsBarEl.querySelector('#acsField').value;
  const q = acsBarEl.querySelector('#acsVal').value.trim();
  const resultBox = acsBarEl.querySelector('#acsResultBox');
  if(!cat){ resultBox.innerHTML=''; return; }

  let matches = state.items.filter(it=> it.category===cat);
  if(q){
    const ql = q.toLowerCase();
    if(fid){
      // فلترة على مواصفة محددة بالذات
      matches = matches.filter(it=> it.fields && String(it.fields[fid]||'').toLowerCase().includes(ql));
    } else {
      // فلترة عامة: اسم العنصر أو أي قيمة من مواصفاته
      matches = matches.filter(it=>{
        if(it.name && it.name.toLowerCase().includes(ql)) return true;
        if(it.fields) return Object.values(it.fields).some(v=> v!=null && String(v).toLowerCase().includes(ql));
        return false;
      });
    }
  }
  renderAcsMatches(matches, cat);
}
function renderAcsMatches(matches, cat){
  const resultBox = acsBarEl.querySelector('#acsResultBox');
  if(!matches.length){
    resultBox.innerHTML = `<div class="acs-empty">لا توجد عناصر في فئة <b>${esc(cat)}</b> مطابقة لبحثك.</div>`;
    return;
  }
  const fields = getCategoryFields(cat);
  resultBox.innerHTML = `<div class="acs-match-count">${matches.length} عنصر في فئة «${esc(cat)}»:</div>` + matches.slice(0,60).map(it=>{
    const path = getFolderPath(it.folderId).map(f=>f.name).join(' / ');
    const badges = fields.map(f=>{
      const val = it.fields ? it.fields[f.id] : null;
      if(val==null || val==='') return '';
      return `<span class="acs-val-chip" style="--chip-c:${chipColorFor(f.id)}">${esc(f.label)}: ${esc(val)}${f.unit?esc(f.unit):''}</span>`;
    }).join('');
    return `<div class="acs-match-row" data-id="${it.id}">
      <div class="acs-match-top"><b>${esc(it.name)}</b><span class="p">📍 ${esc(path)}</span></div>
      ${badges? `<div class="acs-match-badges">${badges}</div>` : ''}
    </div>`;
  }).join('');
  resultBox.querySelectorAll('.acs-match-row[data-id]').forEach(row=>{
    row.onclick = ()=> goToItemLocation(row.dataset.id);
  });
}
function mountAdvancedSearchBar(){
  const vc = document.getElementById('viewContainer');
  if(!vc) return;
  const applicable = ['home','folder','tags','search'].includes(state.view.type);
  if(!applicable) return;
  if(!acsBarEl) acsBarEl = buildAcsBar();
  vc.insertBefore(acsBarEl, vc.firstChild);
  populateAcsCategories();
}

const _origRender = render;
render = function(){
  if(state.view.type === 'categories'){
    const c = document.getElementById('viewContainer');
    if(c) renderCategoriesPageView(c);
  } else {
    _origRender();
  }
  mountAdvancedSearchBar();
};

/* =========================================================
   7) نظام النقل الحر: عناصر ومجلدات (مودال + سحب وإفلات)
   ========================================================= */
function collectDescendantIds(folderId){
  let ids = [];
  getChildFolders(folderId).forEach(c=>{ ids.push(c.id); ids = ids.concat(collectDescendantIds(c.id)); });
  return ids;
}

function openFolderPickerModal(opts){
  const {title, excludeIds=[], currentId=null, allowRoot=false, onPick} = opts;
  const rows = [];
  function collect(parentId, depth){
    getChildFolders(parentId).forEach(f=>{
      if(!excludeIds.includes(f.id)){
        rows.push({folder:f, depth});
        collect(f.id, depth+1);
      }
    });
  }
  collect(null, 0);
  let listHtml = '';
  if(allowRoot){
    listHtml += `<div class="fp-row" data-id="__root__">
      <span class="fp-ico">🏠</span><span class="fp-name">(بدون مجلد أب — المستوى الرئيسي)</span>
      ${currentId===null?'<span class="fp-cur">(الحالي)</span>':''}
    </div>`;
  }
  listHtml += rows.map(r=>`
    <div class="fp-row" data-id="${r.folder.id}" style="padding-right:${r.depth*18+12}px">
      <span class="fp-ico">${esc(r.folder.icon||'📁')}</span>
      <span class="fp-name">${esc(r.folder.name)}</span>
      ${r.folder.id===currentId?'<span class="fp-cur">(الحالي)</span>':''}
    </div>`).join('');
  if(!listHtml) listHtml = '<div style="padding:14px;color:var(--dim2)">لا توجد مجلدات متاحة</div>';

  openModalShell(`
    <div class="modal-head"><h2>${esc(title)}</h2><button class="modal-close" id="mClose">✕</button></div>
    <div class="modal-body">
      <input id="fpSearch" placeholder="ابحث عن مجلد..." style="margin-bottom:10px;width:100%;box-sizing:border-box;">
      <div id="fpList" class="fp-list">${listHtml}</div>
    </div>
    <div class="modal-foot"><div class="left"></div><div class="right"><button class="btn" id="mCancel">إلغاء</button></div></div>
  `, false);

  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.querySelectorAll('.fp-row[data-id]').forEach(row=>{
    row.onclick = ()=>{ const id=row.dataset.id; closeModal(); onPick(id==='__root__'? null : id); };
  });
  const searchInput = document.getElementById('fpSearch');
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    document.querySelectorAll('.fp-row[data-id]').forEach(row=>{
      const nameEl = row.querySelector('.fp-name');
      const name = nameEl ? nameEl.textContent.toLowerCase() : '';
      row.style.display = (!q || name.includes(q)) ? '' : 'none';
    });
  });
}

async function moveItemToFolder(itemId, destFolderId){
  const it = state.items.find(i=>i.id===itemId);
  if(!it || !destFolderId) return;
  if(it.folderId===destFolderId){ toast('العنصر موجود بالفعل في هذا المجلد'); return; }
  it.folderId = destFolderId;
  it.updatedAt = Date.now();
  await saveAndFlag('items', it);
  renderSidebarTree();
  toast('تم نقل العنصر', 'ok');
  render();
}
function openItemMoveModal(itemId){
  const it = state.items.find(i=>i.id===itemId);
  if(!it) return;
  openFolderPickerModal({
    title: '📦 نقل العنصر إلى مجلد آخر',
    excludeIds: [],
    currentId: it.folderId,
    allowRoot: false,
    onPick: (destId)=>{ if(destId) moveItemToFolder(itemId, destId); }
  });
}

async function moveFolderToParent(folderId, newParentId){
  const f = getFolder(folderId);
  if(!f) return;
  if(f.parentId===newParentId){ toast('المجلد موجود بالفعل في هذا المكان'); return; }
  if(newParentId===folderId || (newParentId && isDescendantFolder(newParentId, folderId))){
    toast('لا يمكن نقل المجلد داخل نفسه أو داخل أحد مجلداته الفرعية', 'err');
    return;
  }
  f.parentId = newParentId;
  await saveAndFlag('folders', f);
  state.folders = state.folders.map(x=> x.id===f.id? f : x);
  renderSidebarTree();
  toast('تم نقل المجلد', 'ok');
  render();
}
function openFolderMoveModal(folderId){
  const f = getFolder(folderId);
  if(!f) return;
  const excludeIds = [folderId, ...collectDescendantIds(folderId)];
  openFolderPickerModal({
    title: '📂 نقل المجلد إلى مكان آخر',
    excludeIds,
    currentId: f.parentId,
    allowRoot: true,
    onPick: (destId)=> moveFolderToParent(folderId, destId)
  });
}

const _origOpenFolderModal = openFolderModal;
openFolderModal = function(folderId, parentId){
  const ret = _origOpenFolderModal(folderId, parentId);
  if(folderId){
    const foot = document.querySelector('.modal-foot .left');
    if(foot && !foot.querySelector('#moveFolderBtn')){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn small';
      btn.id = 'moveFolderBtn';
      btn.textContent = '📂 نقل المجلد';
      foot.insertBefore(btn, foot.firstChild);
      btn.onclick = ()=> openFolderMoveModal(folderId);
    }
  }
  return ret;
};

/* =========================================================
   سحب وإفلات حر يعمل باللمس والماوس معًا (اضغط مطوّلًا ثم اسحب)
   لاحظ: نظام HTML5 Drag API التقليدي (dragstart/dragover/drop) لا يعمل
   بشكل موثوق على شاشات اللمس، فاستبدلناه بالكامل بـ Pointer Events
   مع اختبار "ماذا يوجد تحت الإصبع" يدويًا عبر document.elementFromPoint.
   ========================================================= */
const LONG_PRESS_MS = 380;
const MOVE_CANCEL_PX = 10;

function makeDraggable(card, getType, getId){
  if(card.dataset.pdBound) return;
  card.dataset.pdBound = '1';

  // نلف onclick الأصلي عشان نمنع فتح العنصر/المجلد بالغلط لو المستخدم كان بيسحب فعلًا
  const origClick = card.onclick;
  card.onclick = function(e){
    if(card._suppressClick){ card._suppressClick=false; return; }
    if(origClick) return origClick.call(this, e);
  };

  card.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    const startX=e.clientX, startY=e.clientY;
    const pointerId=e.pointerId;
    let armed=false, dragging=false, ghost=null, cancelled=false;

    const armTimer=setTimeout(()=>{
      if(cancelled) return;
      armed=true;
      card.style.touchAction='none';
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(_e){} }
      card.classList.add('dnd-armed');
    }, LONG_PRESS_MS);

    function cleanup(){
      clearTimeout(armTimer);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
      card.classList.remove('dnd-armed','dnd-dragging');
      card.style.touchAction='';
      if(ghost){ ghost.remove(); ghost=null; }
      document.querySelectorAll('.dnd-over').forEach(el=>el.classList.remove('dnd-over'));
      document.body.classList.remove('dnd-active');
    }

    function onMove(ev){
      if(ev.pointerId!==pointerId) return;
      const dx=ev.clientX-startX, dy=ev.clientY-startY;
      if(!armed){
        // لو المستخدم حرك إصبعه قبل اكتمال الضغط المطوّل، يبقى قصده تمرير/سكرول عادي
        if(Math.hypot(dx,dy) > MOVE_CANCEL_PX){ cancelled=true; cleanup(); }
        return;
      }
      if(!dragging){
        dragging=true;
        try{ card.setPointerCapture(pointerId); }catch(_e){}
        ghost=card.cloneNode(true);
        ghost.classList.add('dnd-ghost');
        ghost.style.width=card.offsetWidth+'px';
        document.body.appendChild(ghost);
        card.classList.add('dnd-dragging');
        document.body.classList.add('dnd-active');
      }
      ev.preventDefault();
      if(ghost){
        ghost.style.left=(ev.clientX - ghost.offsetWidth/2)+'px';
        ghost.style.top=(ev.clientY - 36)+'px';
      }
      document.querySelectorAll('.dnd-over').forEach(el=>el.classList.remove('dnd-over'));
      const under=document.elementFromPoint(ev.clientX, ev.clientY);
      const zone=under && under.closest('.folder-card[data-id], .tree-row[data-id]');
      if(zone && zone!==card) zone.classList.add('dnd-over');
    }

    function finish(ev){
      if(ev && ev.pointerId!==pointerId) return;
      if(dragging && ev){
        const under=document.elementFromPoint(ev.clientX, ev.clientY);
        const zone=under && under.closest('.folder-card[data-id], .tree-row[data-id]');
        if(zone && zone.dataset.id){
          const destId=zone.dataset.id;
          const type=getType(), id=getId();
          if(type==='item') moveItemToFolder(id, destId);
          else if(type==='folder' && destId!==id) moveFolderToParent(id, destId);
        }
        card._suppressClick=true;
        setTimeout(()=>{ card._suppressClick=false; }, 350);
      }
      cleanup();
    }
    function onUp(ev){ finish(ev); }
    function onCancel(){ cleanup(); }

    document.addEventListener('pointermove', onMove, {passive:false});
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
  });
}

function enhanceDragAndDrop(){
  document.querySelectorAll('.item-card[data-id]').forEach(card=>{
    makeDraggable(card, ()=>'item', ()=>card.dataset.id);
  });
  document.querySelectorAll('.folder-card[data-id]').forEach(card=>{
    makeDraggable(card, ()=>'folder', ()=>card.dataset.id);
  });
  // .tree-row بالسايدبار أهداف إفلات جاهزة تلقائيًا (عبر elementFromPoint) بدون أي ربط إضافي
}
const _origRenderSidebarTree = renderSidebarTree;
renderSidebarTree = function(){
  _origRenderSidebarTree();
  enhanceDragAndDrop();
};

})();
</script>

  clearTimeout(_nbSaveTimers[item.id]);
  _nbSaveTimers[item.id] = setTimeout(()=>{ saveAndFlag('items', item); }, 500);
}
function ensureNotebookData(item){
  if(!item.notebookData || typeof item.notebookData !== 'object' || Array.isArray(item.notebookData)){
    item.notebookData = {title:'', explanation:'', explanations:[], codes:[], images:[], imageGroups:[], drawing:{shapes:[]}, mindmap:null, faultTracking:{pages:[], activePageId:null}};
  }
  const s = item.notebookData;
  if(!Array.isArray(s.explanations)) s.explanations = [];
  if(!Array.isArray(s.codes)) s.codes = [];
  if(!Array.isArray(s.images)) s.images = [];
  if(!Array.isArray(s.imageGroups)) s.imageGroups = [];
  if(!s.drawing || !Array.isArray(s.drawing.shapes)) s.drawing = {shapes:[]};
  if(typeof s.explanation !== 'string') s.explanation = '';
  if(typeof s.title !== 'string') s.title = '';
  ensureFaultTrackingData(s);
  return s;
}
/* بيانات "تتبع الأعطال": صفحات (كل صفحة = صورة) وكل صفحة تحتوي نقاطًا تفاعلية غير محدودة العدد */
function ensureFaultTrackingData(s){
  if(!s.faultTracking || typeof s.faultTracking !== 'object' || Array.isArray(s.faultTracking)){
    s.faultTracking = {pages:[], activePageId:null};
  }
  const ft = s.faultTracking;
  if(!Array.isArray(ft.pages)) ft.pages = [];
  ft.pages.forEach((p,pidx)=>{
    if(typeof p.name !== 'string') p.name = '';
    if(typeof p.caption !== 'string') p.caption = '';
    if(!Array.isArray(p.hotspots)) p.hotspots = [];
    p.hotspots.forEach((h,hidx)=>{
      if(typeof h.x !== 'number') h.x = 0.4;
      if(typeof h.y !== 'number') h.y = 0.4;
      if(typeof h.w !== 'number') h.w = 0.06;
      if(typeof h.h !== 'number') h.h = 0.06;
      if(h.shape !== 'rect' && h.shape !== 'circle') h.shape = 'circle';
      if(typeof h.color !== 'string') h.color = FT_LAYER_COLORS[hidx % FT_LAYER_COLORS.length];
      if(typeof h.visible !== 'boolean') h.visible = true;
      if(typeof h.name !== 'string' || !h.name) h.name = 'طبقة '+(hidx+1);
      if(!h.content || typeof h.content !== 'object' || Array.isArray(h.content)) h.content = {};
      if(typeof h.content.title !== 'string') h.content.title = '';
      if(typeof h.content.note !== 'string') h.content.note = '';
      if(!Array.isArray(h.content.images)) h.content.images = [];
      if(!h.content.drawing || !Array.isArray(h.content.drawing.shapes)) h.content.drawing = {shapes:[]};
    });
  });
  return ft;
}
const MM_COLORS = ["#f2a93c","#4da3ff","#3ddc84","#ff5d5d","#c77dff","#ffb703"];
const MM_BASE_W = 132, MM_BASE_H = 46;
function svgEl(tag, attrs){
  const el=document.createElementNS('http://www.w3.org/2000/svg', tag);
  if(attrs) for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function ensureMindmapData(s){
  if(!s.mindmap || !s.mindmap.nodes || !Object.keys(s.mindmap.nodes).length){
    const rootId='m_root';
    s.mindmap = { nodes: { [rootId]: {id:rootId, text:'الفكرة الرئيسية', parentId:null, x:0, y:0, color:MM_COLORS[0], collapsed:false, orderIndex:0} }, rootId };
  }
  return s.mindmap;
}

function nbArmConfirm(btn, label){
  if(btn.dataset.armed === '1'){
    btn.dataset.armed = '0';
    btn.textContent = btn.dataset.original || btn.textContent;
    return true;
  }
  btn.dataset.original = btn.textContent;
  btn.dataset.armed = '1';
  btn.textContent = label || 'اضغط تاني للتأكيد';
  clearTimeout(Number(btn.dataset.armTimer) || 0);
  const timer = setTimeout(()=>{ btn.dataset.armed='0'; btn.textContent=btn.dataset.original; }, 3000);
  btn.dataset.armTimer = timer;
  return false;
}

function nbWrapSelection(textarea, before, after, placeholder){
  const start=textarea.selectionStart, end=textarea.selectionEnd;
  const val=textarea.value;
  const hasSelection = end>start;
  const selected = hasSelection ? val.slice(start,end) : (placeholder||'');
  textarea.value = val.slice(0,start) + before + selected + after + val.slice(end);
  const selStart = start+before.length, selEnd = selStart+selected.length;
  textarea.focus(); textarea.setSelectionRange(selStart, selEnd);
  textarea.dispatchEvent(new Event('input', {bubbles:true}));
}
function nbInsertLinePrefix(textarea, prefix){
  const start=textarea.selectionStart, val=textarea.value;
  const lineStart = val.lastIndexOf('\n', start-1)+1;
  textarea.value = val.slice(0,lineStart) + prefix + val.slice(lineStart);
  const newPos = start+prefix.length;
  textarea.focus(); textarea.setSelectionRange(newPos, newPos);
  textarea.dispatchEvent(new Event('input', {bubbles:true}));
}
function nbInsertAtCursor(textarea, text){
  const start=textarea.selectionStart, end=textarea.selectionEnd, val=textarea.value;
  textarea.value = val.slice(0,start) + text + val.slice(end);
  const pos = start+text.length;
  textarea.focus(); textarea.setSelectionRange(pos,pos);
  textarea.dispatchEvent(new Event('input', {bubbles:true}));
}
function nbBuildFormatToolbar(getTextarea){
  const bar=document.createElement('div');
  bar.className='fmt-toolbar';
  function btn(label,title,handler,extraStyle){
    const b=document.createElement('button');
    b.type='button'; b.className='fmt-btn'; b.textContent=label; b.title=title||'';
    if(extraStyle) b.style.cssText=extraStyle;
    b.addEventListener('click',(e)=>{ e.preventDefault(); const ta=getTextarea(); if(ta) handler(ta); });
    bar.appendChild(b);
    return b;
  }
  function sep(){ const s=document.createElement('span'); s.className='fmt-sep'; bar.appendChild(s); }
  btn('B','عريض',ta=>nbWrapSelection(ta,'**','**','نص عريض'),'font-weight:900;');
  btn('I','مائل',ta=>nbWrapSelection(ta,'*','*','نص مائل'),'font-style:italic;');
  btn('U','تسطير',ta=>nbWrapSelection(ta,'<u>','</u>','نص مسطّر'),'text-decoration:underline;');
  btn('S','يتوسطه خط',ta=>nbWrapSelection(ta,'~~','~~','نص'),'text-decoration:line-through;');
  btn('==','تمييز',ta=>nbWrapSelection(ta,'==','==','نص مميز'));
  sep();
  btn('H1','عنوان كبير',ta=>nbInsertLinePrefix(ta,'# '));
  btn('H2','عنوان متوسط',ta=>nbInsertLinePrefix(ta,'## '));
  btn('H3','عنوان صغير',ta=>nbInsertLinePrefix(ta,'### '));
  sep();
  btn('•','قائمة نقطية',ta=>nbInsertLinePrefix(ta,'- '));
  btn('1.','قائمة مرقّمة',ta=>nbInsertLinePrefix(ta,'1. '));
  btn('❝','اقتباس',ta=>nbInsertLinePrefix(ta,'> '));
  sep();
  btn('</>','كود مضمّن',ta=>nbWrapSelection(ta,'`','`','code'));
  btn('{ }','كتلة كود',ta=>nbInsertAtCursor(ta,'\n```\nكود هنا\n```\n'));
  btn('🔗','رابط',ta=>{ const url=prompt('رابط URL:','https://'); if(url) nbWrapSelection(ta,'[','](' + url + ')','نص الرابط'); });
  btn('▦','جدول',ta=>nbInsertAtCursor(ta,'\n| عمود 1 | عمود 2 |\n| --- | --- |\n| قيمة | قيمة |\n'));
  btn('―','خط فاصل',ta=>nbInsertAtCursor(ta,'\n---\n'));
  sep();
  btn('💡','تنبيه',ta=>nbInsertLinePrefix(ta,'> 💡 '));
  btn('⚠️','تحذير',ta=>nbInsertLinePrefix(ta,'> ⚠️ '));
  return bar;
}

/* ===== ماركداون خفيف بدون أي مكتبات خارجية ===== */
function nbRenderMarkdown(raw){
  if(!raw || !raw.trim()) return '<span class="md-empty">(لا يوجد شرح — اضغط هنا للإضافة)</span>';
  const codeBlocks=[];
  let text = esc(raw).replace(/\r\n/g,'\n').replace(/```([\s\S]*?)```/g,(m,code)=>{ codeBlocks.push(code); return '\u0001'+(codeBlocks.length-1)+'\u0001'; });
  function inline(s){
    s = s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    s = s.replace(/(^|[^*])\*([^*]+?)\*([^*]|$)/g,'$1<i>$2</i>$3');
    s = s.replace(/&lt;u&gt;([\s\S]+?)&lt;\/u&gt;/g,'<u>$1</u>');
    s = s.replace(/~~(.+?)~~/g,'<s>$1</s>');
    s = s.replace(/==(.+?)==/g,'<mark>$1</mark>');
    s = s.replace(/`([^`]+?)`/g,'<code>$1</code>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  const lines = text.split('\n');
  let html=''; let listType=null; let listItems=[];
  function flushList(){
    if(listType){ html += `<${listType}>` + listItems.map(li=>`<li>${inline(li)}</li>`).join('') + `</${listType}>`; listType=null; listItems=[]; }
  }
  let i=0;
  while(i<lines.length){
    const t = lines[i].trim();
    if(!t){ flushList(); i++; continue; }
    if(/^\|.*\|$/.test(t)){
      const rows=[];
      while(i<lines.length && /^\|.*\|$/.test(lines[i].trim())){
        const cells=lines[i].trim().slice(1,-1).split('|').map(c=>c.trim());
        if(!/^:?-{2,}:?$/.test(cells.join(''))) rows.push(cells);
        i++;
      }
      if(rows.length){
        flushList();
        const [headRow, ...bodyRows] = rows;
        html += '<table class="nb-md-table"><thead><tr>'+headRow.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead>';
        if(bodyRows.length) html += '<tbody>'+bodyRows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody>';
        html += '</table>';
      }
      continue;
    }
    if(/^(-{3,}|_{3,}|\*{3,})$/.test(t)){ flushList(); html+='<hr>'; i++; continue; }
    let m;
    if((m=t.match(/^(#{1,4})\s+(.+)$/))){
      flushList();
      const lvl=m[1].length; // # عنوان رئيسي كبير، ## عنوان فرعي، ### وهكذا أصغر
      html += `<h${lvl} class="md-h${lvl}">${inline(m[2])}</h${lvl}>`;
      i++; continue;
    }
    if((m=t.match(/^&gt;\s?(💡|⚠️)?\s*(.*)$/))){
      flushList();
      if(m[1]==='💡') html += `<div class="md-callout md-tip"><span class="md-callout-ico">💡</span><div>${inline(m[2])}</div></div>`;
      else if(m[1]==='⚠️') html += `<div class="md-callout md-warn"><span class="md-callout-ico">⚠️</span><div>${inline(m[2])}</div></div>`;
      else html += `<blockquote>${inline(m[2])}</blockquote>`;
      i++; continue;
    }
    if((m=t.match(/^[-*]\s+(.+)$/))){ if(listType!=='ul'){flushList();listType='ul';} listItems.push(m[1]); i++; continue; }
    if((m=t.match(/^\d+\.\s+(.+)$/))){ if(listType!=='ol'){flushList();listType='ol';} listItems.push(m[1]); i++; continue; }
    flushList();
    html += `<p>${inline(t)}</p>`;
    i++;
  }
  flushList();
  html = html.replace(/\u0001(\d+)\u0001/g,(m,idx)=>`<pre class="nb-md-code"><code>${codeBlocks[idx]}</code></pre>`);
  return html;
}
function nbEnhanceMarkdownView(container){
  if(!container) return;
  container.querySelectorAll('img').forEach(img=>{
    img.classList.add('md-image');
    img.style.cursor='zoom-in';
    if(!img.dataset.nbViewerBound){
      img.dataset.nbViewerBound='1';
      img.addEventListener('click',(e)=>{ e.preventDefault(); e.stopPropagation(); const src=img.currentSrc||img.src; if(src) nbOpenImageViewer(src,''); });
    }
  });
}
function ptDist(p1,p2){ return Math.hypot(p1.x-p2.x, p1.y-p2.y); }
function ptMid(p1,p2){ return {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2}; }

function nbOpenImageViewer(url, caption, navList, navIndex){
  const MIN_ZOOM=0.5, MAX_ZOOM=6;
  let imgNaturalW=0, imgNaturalH=0, imgBaseScale=1, imgZoomFactor=1, imgTx=0, imgTy=0;
  const activePointers=new Map();
  let dragStart=null, dragMoved=false, pinchStartDist=null, pinchStartZoom=null;
  const hasNav = Array.isArray(navList) && navList.length>1;
  let curIndex = hasNav ? Math.max(0, Math.min(navList.length-1, navIndex||0)) : 0;

  const overlay=document.createElement('div');
  overlay.className='nb-viewer-overlay';
  overlay.innerHTML = `
    <button type="button" class="nb-viewer-close">✕</button>
    <div class="nb-viewer-toolbar">
      <button type="button" class="nb-viewer-zbtn" data-act="zout">−</button>
      <span class="nb-viewer-zlevel">100%</span>
      <button type="button" class="nb-viewer-zbtn" data-act="zin">+</button>
      <button type="button" class="nb-viewer-zbtn" data-act="zreset" title="إعادة ضبط الحجم">⤢</button>
    </div>
    ${hasNav? `<button type="button" class="nb-viewer-nav nb-viewer-prev" title="السابق">‹</button><button type="button" class="nb-viewer-nav nb-viewer-next" title="التالي">›</button><div class="nb-viewer-count"></div>` : ''}
    <div class="nb-viewer-stage">
      <img src="${esc(url)}" class="nb-viewer-img" draggable="false">
    </div>
    <div class="nb-viewer-caption" style="${caption? '' : 'display:none;'}">${esc(caption||'')}</div>
  `;
  document.body.appendChild(overlay);

  const stage=overlay.querySelector('.nb-viewer-stage');
  const img=overlay.querySelector('.nb-viewer-img');
  const zlevelEl=overlay.querySelector('.nb-viewer-zlevel');
  const capEl=overlay.querySelector('.nb-viewer-caption');
  const countEl=overlay.querySelector('.nb-viewer-count');

  function showSlide(idx){
    if(!hasNav) return;
    curIndex=(idx+navList.length)%navList.length;
    const ref=navList[curIndex];
    const newUrl = ref.img ? ref.img.src : (ref.url||'');
    const newCap = ref.cap ? ref.cap.value : (ref.caption||'');
    imgZoomFactor=1;
    img.src=newUrl;
    if(newCap){ capEl.textContent=newCap; capEl.style.display=''; } else { capEl.style.display='none'; }
    if(countEl) countEl.textContent=(curIndex+1)+' / '+navList.length;
  }
  if(hasNav && countEl) countEl.textContent=(curIndex+1)+' / '+navList.length;

  function computeBaseScaleAndCenter(){
    const rect=stage.getBoundingClientRect();
    if(!imgNaturalW || !imgNaturalH || !rect.width){ imgBaseScale=1; }
    else{
      const availW=rect.width*0.94, availH=rect.height*0.9;
      imgBaseScale=Math.min(availW/imgNaturalW, availH/imgNaturalH, 1);
    }
    const dispW=imgNaturalW*imgBaseScale*imgZoomFactor, dispH=imgNaturalH*imgBaseScale*imgZoomFactor;
    imgTx=(rect.width-dispW)/2; imgTy=(rect.height-dispH)/2;
  }
  function applyImgTransform(){
    const s=imgBaseScale*imgZoomFactor;
    img.style.transform=`translate(${imgTx}px, ${imgTy}px) scale(${s})`;
    zlevelEl.textContent=Math.round(imgZoomFactor*100)+'%';
    stage.classList.toggle('zoomed', imgZoomFactor>1.001);
  }
  function zoomBy(factor, clientX, clientY){
    const rect=stage.getBoundingClientRect();
    const cx = clientX!=null ? clientX-rect.left : rect.width/2;
    const cy = clientY!=null ? clientY-rect.top : rect.height/2;
    const oldScale=imgBaseScale*imgZoomFactor;
    let newZoom=Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, imgZoomFactor*factor));
    const newScale=imgBaseScale*newZoom;
    imgTx = cx - (cx-imgTx)*(newScale/oldScale);
    imgTy = cy - (cy-imgTy)*(newScale/oldScale);
    imgZoomFactor=newZoom;
    applyImgTransform();
  }
  img.addEventListener('load', ()=>{
    imgNaturalW=img.naturalWidth; imgNaturalH=img.naturalHeight; imgZoomFactor=1;
    computeBaseScaleAndCenter(); applyImgTransform();
  });
  img.addEventListener('dblclick',(e)=>{
    e.stopPropagation();
    if(imgZoomFactor>1.05){ imgZoomFactor=1; computeBaseScaleAndCenter(); }
    else zoomBy(2.2, e.clientX, e.clientY);
    applyImgTransform();
  });
  stage.addEventListener('wheel',(e)=>{ e.preventDefault(); zoomBy(e.deltaY<0?1.15:1/1.15, e.clientX, e.clientY); }, {passive:false});
  overlay.querySelector('[data-act="zin"]').onclick=()=>zoomBy(1.4);
  overlay.querySelector('[data-act="zout"]').onclick=()=>zoomBy(1/1.4);
  overlay.querySelector('[data-act="zreset"]').onclick=()=>{ imgZoomFactor=1; computeBaseScaleAndCenter(); applyImgTransform(); };

  function releasePointer(e){
    activePointers.delete(e.pointerId);
    stage.classList.remove('dragging');
    dragStart=null; pinchStartDist=null;
    if(activePointers.size===1){
      const entry=Array.from(activePointers.entries())[0];
      dragStart={x:entry[1].x, y:entry[1].y, tx:imgTx, ty:imgTy};
    }
  }
  stage.addEventListener('pointerdown',(e)=>{
    stage.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    dragMoved=false;
    if(activePointers.size===1){
      dragStart={x:e.clientX, y:e.clientY, tx:imgTx, ty:imgTy};
      stage.classList.add('dragging');
    } else if(activePointers.size===2){
      dragStart=null;
      const pts=Array.from(activePointers.values());
      pinchStartDist=ptDist(pts[0],pts[1]);
      pinchStartZoom=imgZoomFactor;
    }
  });
  stage.addEventListener('pointermove',(e)=>{
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size===1 && dragStart){
      const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
      if(Math.abs(dx)+Math.abs(dy)>6) dragMoved=true;
      imgTx=dragStart.tx+dx; imgTy=dragStart.ty+dy;
      applyImgTransform();
    } else if(activePointers.size===2 && pinchStartDist){
      dragMoved=true;
      const pts=Array.from(activePointers.values());
      const dist=ptDist(pts[0],pts[1]);
      const mid=ptMid(pts[0],pts[1]);
      const rect=stage.getBoundingClientRect();
      const oldScale=imgBaseScale*imgZoomFactor;
      let newZoom=Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinchStartZoom*(dist/pinchStartDist)));
      const newScale=imgBaseScale*newZoom;
      const cx=mid.x-rect.left, cy=mid.y-rect.top;
      imgTx = cx - (cx-imgTx)*(newScale/oldScale);
      imgTy = cy - (cy-imgTy)*(newScale/oldScale);
      imgZoomFactor=newZoom;
      applyImgTransform();
    }
  });
  stage.addEventListener('pointerup', releasePointer);
  stage.addEventListener('pointercancel', releasePointer);
  stage.addEventListener('pointerleave',(e)=>{ if(activePointers.has(e.pointerId)) releasePointer(e); });

  function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); window.removeEventListener('resize', onResize); }
  function onKey(e){
    if(e.key==='Escape') close();
    else if(hasNav && e.key==='ArrowRight') showSlide(curIndex+1);
    else if(hasNav && e.key==='ArrowLeft') showSlide(curIndex-1);
  }
  function onResize(){ if(imgNaturalW){ computeBaseScaleAndCenter(); applyImgTransform(); } }
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);
  stage.addEventListener('click',(e)=>{
    if(dragMoved){ dragMoved=false; return; }
    if(e.target===stage) close();
  });
  overlay.querySelector('.nb-viewer-close').onclick = close;
  if(hasNav){
    overlay.querySelector('.nb-viewer-prev').onclick=(e)=>{ e.stopPropagation(); showSlide(curIndex-1); };
    overlay.querySelector('.nb-viewer-next').onclick=(e)=>{ e.stopPropagation(); showSlide(curIndex+1); };
  }
}

/* ===== صندوق شرح إضافي ===== */
function nbBuildExtraExplainBox(s, boxData, index, item, rerenderList){
  const wrap=document.createElement('div');
  wrap.className='nb-exbox';
  wrap.innerHTML = `
    <div class="nb-exbox-head">
      <input class="nb-exbox-title" value="${esc(boxData.title||'')}" placeholder="عنوان الصندوق (اختياري)">
      <button type="button" class="btn small" data-act="collapse">⌃</button>
      <button type="button" class="btn small danger" data-act="delete">🗑</button>
    </div>
    <div class="nb-exbox-body">
      <div class="explain-view" data-act="view">${nbRenderMarkdown(boxData.content)}</div>
      <div class="fmt-toolbar-holder" data-act="toolbar" style="display:none;"></div>
      <textarea class="nb-editor" data-act="text" style="display:none;">${esc(boxData.content||'')}</textarea>
    </div>
  `;
  const titleEl=wrap.querySelector('.nb-exbox-title');
  const viewEl=wrap.querySelector('[data-act="view"]');
  const taEl=wrap.querySelector('[data-act="text"]');
  const toolbarHolder=wrap.querySelector('[data-act="toolbar"]');
  toolbarHolder.appendChild(nbBuildFormatToolbar(()=>taEl));
  nbEnhanceMarkdownView(viewEl);

  wrap.querySelector('[data-act="collapse"]').onclick=(e)=>{
    const collapsed=wrap.classList.toggle('is-collapsed');
    e.currentTarget.textContent=collapsed?'⌄':'⌃';
  };
  titleEl.oninput=(e)=>{ boxData.title=e.target.value; nbScheduleSave(item); };
  taEl.addEventListener('input',(e)=>{ boxData.content=e.target.value; nbScheduleSave(item); });
  viewEl.addEventListener('click',()=>{ viewEl.style.display='none'; toolbarHolder.style.display='flex'; taEl.style.display='block'; taEl.focus(); });
  taEl.addEventListener('blur',()=>{
    viewEl.innerHTML=nbRenderMarkdown(boxData.content);
    nbEnhanceMarkdownView(viewEl);
    taEl.style.display='none'; toolbarHolder.style.display='none'; viewEl.style.display='block';
  });
  wrap.querySelector('[data-act="delete"]').onclick=(e)=>{
    if(!nbArmConfirm(e.currentTarget,'حذف الصندوق؟')) return;
    s.explanations.splice(index,1);
    nbScheduleSave(item);
    rerenderList();
  };
  if(window.__SI) __SI.tag(wrap,{kind:'field',label:()=>'مربع شرح إضافي'+(boxData.title?' «'+boxData.title+'»':''),itemId:item.id,pos:'out',fieldPath:'notebookData.explanations['+index+']',get:()=>boxData});
  return wrap;
}

/* ===== تبويب الشرح والصور ===== */
function nbTextPanel(body, s, item){
  const help=document.createElement('div');
  help.className='nb-help';
  help.textContent='أضف صورًا بلا حد، واكتب وصفًا أسفل كل صورة. اضغط الصورة لمشاهدتها بالحجم الأصلي.';
  body.appendChild(help);

  /* عنوان قابل للطي/الفتح — لا يظهر المحتوى إلا بعد الضغط عليه، ودون التأثير على سلوك التحرير نفسه */

  function buildPhotoCard(entry, navListRef){

    const acts=document.createElement('div');
    acts.className='nb-photo-actions';
    const groupSel=document.createElement('select');
    groupSel.className='nb-photo-group-select';
    groupSel.title='نقل الصورة إلى مجموعة';
    groupSel.innerHTML = '<option value="">بدون مجموعة</option>' + s.imageGroups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');
    groupSel.value = entry.groupId || '';
    groupSel.onchange=()=>{ entry.groupId = groupSel.value || null; nbScheduleSave(item); renderGallery(); };
    const delBtn=document.createElement('button');
    delBtn.type='button'; delBtn.className='btn small danger'; delBtn.textContent='🗑 حذف';
    delBtn.onclick=async ()=>{ const idx=s.images.indexOf(entry); if(idx!==-1) s.images.splice(idx,1); nbScheduleSave(item); await garbageCollectUnreferencedFiles(); await requestFolderSync(); renderGallery(); };
    acts.append(groupSel, delBtn);
    card.append(img, cap, acts);
    navListRef.push({img, cap});
    if(window.__SI) __SI.tag(card,{kind:'file',fileId:entry.id,itemId:item.id,pos:'tl',extra:()=>[['حجم وصف الصورة (نص داخل item.json)',__SI.fmt(__SI.bytes(entry.caption||''))]]});
    return card;
  }
  function renderGallery(){
    gallery.innerHTML='';
    const groups=s.imageGroups;
    groups.forEach(g=>{
      const groupImgs=s.images.filter(e=>e.groupId===g.id);
      const gHead=document.createElement('div');
      gHead.className='nb-photo-group-head';
      gHead.innerHTML=`<b>📁 ${esc(g.name)}</b><span class="nb-photo-group-count">(${groupImgs.length})</span>`;
      const renameBtn=document.createElement('button'); renameBtn.type='button'; renameBtn.className='btn small'; renameBtn.textContent='✏️';
      renameBtn.onclick=()=>{ const nn=prompt('اسم المجموعة:', g.name); if(nn && nn.trim()){ g.name=nn.trim(); nbScheduleSave(item); renderGallery(); } };
      const delGBtn=document.createElement('button'); delGBtn.type='button'; delGBtn.className='btn small danger'; delGBtn.textContent='🗑';
      delGBtn.onclick=(e)=>{
        if(!nbArmConfirm(e.currentTarget,'حذف المجموعة؟ (الصور نفسها تبقى بدون حذف)')) return;
        s.images.forEach(im=>{ if(im.groupId===g.id) im.groupId=null; });
        const gi=s.imageGroups.indexOf(g); if(gi!==-1) s.imageGroups.splice(gi,1);
        nbScheduleSave(item); renderGallery();
      };
      gHead.append(renameBtn, delGBtn);
      gallery.appendChild(gHead);
      const gGrid=document.createElement('div'); gGrid.className='nb-gallery';
      const navList=[];
      groupImgs.forEach(entry=> gGrid.appendChild(buildPhotoCard(entry, navList)));
      gallery.appendChild(gGrid);
    });
    const ungrouped=s.images.filter(e=>!e.groupId || !groups.find(g=>g.id===e.groupId));
    if(groups.length){
      const uHead=document.createElement('div');
      uHead.className='nb-photo-group-head';
      uHead.innerHTML=`<b>🗂 بدون مجموعة</b><span class="nb-photo-group-count">(${ungrouped.length})</span>`;
      gallery.appendChild(uHead);
    }
    const uGrid=document.createElement('div'); uGrid.className='nb-gallery';
    const uNavList=[];
    ungrouped.forEach(entry=> uGrid.appendChild(buildPhotoCard(entry, uNavList)));
    gallery.appendChild(uGrid);

    const addCard=document.createElement('label');
    addCard.className='nb-photo-add';
    addCard.textContent='＋ أضف صورًا من الجهاز';
    const pick=document.createElement('input');
    pick.type='file'; pick.accept='image/*'; pick.multiple=true;
    pick.onchange=async ()=>{
      const files=[...(pick.files||[])];
      if(!files.length) return;
      addCard.textContent='جارٍ حفظ الصور...';
      for(const f of files){ const id=await storeFile(f, f.name, f.type); s.images.push({id, caption:'', groupId:null}); }
      nbScheduleSave(item);
      renderGallery();
    };
    addCard.appendChild(pick);
    uGrid.appendChild(addCard);
  }
  renderGallery();
}

const NB_LANGS=[['text','نص عادي'],['js','JavaScript'],['python','Python'],['c','C / C++'],['asm','Assembly'],['html','HTML'],['css','CSS'],['json','JSON'],['bash','Bash/Shell'],['sql','SQL']];
function nbBuildCodeBlock(section, c, index, item, rerender){
  const box=document.createElement('div');
  box.className='nb-codeblock';
  box.innerHTML = `
    <div class="nb-codeblock-head">
      <input class="nb-code-label" value="${esc(c.label||'')}" placeholder="عنوان الكود">
      <select class="nb-code-lang">${NB_LANGS.map(([v,l])=>`<option value="${v}" ${v===c.lang?'selected':''}>${l}</option>`).join('')}</select>
      <button type="button" class="btn small" data-act="copy">📋 نسخ</button>
      <button type="button" class="btn small danger" data-act="remove">🗑</button>
    </div>
    <textarea class="nb-codearea" spellcheck="false" placeholder="اكتب الكود هنا...">${esc(c.code||'')}</textarea>
  `;
  const ta=box.querySelector('.nb-codearea');
  function autoGrow(){ ta.style.height='auto'; ta.style.height=Math.min(520, Math.max(140, ta.scrollHeight+6))+'px'; }
  box.querySelector('.nb-code-label').oninput=(e)=>{ c.label=e.target.value; nbScheduleSave(item); };
  box.querySelector('.nb-code-lang').onchange=(e)=>{ c.lang=e.target.value; nbScheduleSave(item); };
  ta.addEventListener('input', ()=>{ c.code=ta.value; nbScheduleSave(item); autoGrow(); });
  requestAnimationFrame(autoGrow);
  box.querySelector('[data-act="copy"]').onclick=async ()=>{
    try{ await navigator.clipboard.writeText(c.code||''); toast('تم نسخ الكود','ok'); }
    catch(err){ toast('تعذّر النسخ التلقائي — انسخه يدويًا من المربع','err'); }
  };
  box.querySelector('[data-act="remove"]').onclick=(e)=>{
    if(!nbArmConfirm(e.currentTarget,'اضغط تاني للحذف')) return;

    rerender();
  };
  if(window.__SI) __SI.tag(box,{kind:'field',label:'كتلة كود',itemId:item.id,pos:'out',fieldPath:'notebookData.codes['+index+']',get:()=>c});
  return box;
}
