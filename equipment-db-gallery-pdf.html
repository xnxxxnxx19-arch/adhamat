  function buildCodeBlock(section, c, index){
    const box = document.createElement("div");
    box.className = "codeblock";
    box.innerHTML = \`
      <div class="codeblock-head">
        <input value="\${escapeHtml(c.label).replace(/"/g,'&quot;')}" data-act="label">
        <select data-act="lang">\${langOptions(c.lang)}</select>
        <span class="spacer"></span>
        <button data-act="collapse-code" title="طيّ الكود">⌃</button>
        <button data-act="copy" title="نسخ الكود">📋 نسخ</button>
        <button data-act="toggle">✏️ تعديل</button>
        <button data-act="remove" class="danger">حذف</button>
      </div>
      <pre class="codeview"><code>\${highlight(c.code, c.lang)}</code></pre>
      <textarea class="codearea">\${escapeHtml(c.code)}</textarea>
    \`;
    const pre = box.querySelector(".codeview code");
    const ta = box.querySelector(".codearea");
    const toggleBtn = box.querySelector('[data-act="toggle"]');
    const copyBtn = box.querySelector('[data-act="copy"]');
    const collapseBtn = box.querySelector('[data-act="collapse-code"]');
    collapseBtn.addEventListener("click", ()=>{
      const collapsed = box.classList.toggle("is-collapsed");
      collapseBtn.textContent = collapsed ? "⌄" : "⌃";
      collapseBtn.title = collapsed ? "فتح الكود" : "طيّ الكود";
    });

    function autoGrow(){
      ta.style.height = "auto";
      ta.style.height = Math.max(120, ta.scrollHeight + 4) + "px";
    }
    ta.addEventListener("input", autoGrow);
    setTimeout(autoGrow, 0);

    copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(c.code);
        showToast("تم نسخ الكود ✅", "ok", 1600);
      }catch(err){
        // بديل لو الحافظة الحديثة محجوبة (زي بعض بيئات المعاينة)
        ta.style.display = "block";
        ta.focus(); ta.select();
        try{ document.execCommand("copy"); showToast("تم نسخ الكود ✅", "ok", 1600); }
        catch(e2){ showToast("تعذّر النسخ التلقائي — حدد النص وانسخه يدويًا.", "err"); }
        if(!box.classList.contains("editing")) ta.style.display = "";
      }
    });

    toggleBtn.addEventListener("click", ()=>{
      box.classList.toggle("editing");
      toggleBtn.textContent = box.classList.contains("editing") ? "✅ حفظ العرض" : "✏️ تعديل";
      if(box.classList.contains("editing")) setTimeout(autoGrow, 0);
      if(!box.classList.contains("editing")){
        c.code = ta.value;
        pre.innerHTML = highlight(c.code, c.lang);
        scheduleAutoSave();
      }
    });
    box.querySelector('[data-act="label"]').addEventListener("input",(e)=>{ c.label = e.target.value; scheduleAutoSave(); });
    box.querySelector('[data-act="lang"]').addEventListener("change",(e)=>{
      c.lang = e.target.value;
      pre.innerHTML = highlight(c.code, c.lang);
      scheduleAutoSave();
    });
    box.querySelector('[data-act="remove"]').addEventListener("click", (e)=>{
      if(!armConfirm(e.currentTarget, "اضغط تاني للحذف")) return;
      section.codes.splice(index,1);
      scheduleAutoSave();
      renderAll();
    });
    return box;
  }

  /* ============================== DRAWING PANEL (per card) ============================== */
  function resizeDrawCanvas(canvas, state){
    if(!canvas || !state) return;
    const rect = canvas.parentElement.getBoundingClientRect();
    const inFullscreen = !!canvas.closest(".fs-body");
    const cssW = Math.max(280, rect.width);
    const cssH = inFullscreen ? Math.max(460, rect.height || 460) : (state.cssHeight || 340);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    state.cssWidth = cssW; state.cssHeight = cssH; state.dpr = dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.redraw();
  }

  function buildDrawingPanel(section){
    if(!section.drawing) section.drawing = { shapes: [] };

    const wrap = document.createElement("div");
    wrap.className = "drawpanel";
    wrap.innerHTML = \`
      <div class="draw-toolbar">
        <select class="draw-tool" title="الأداة">
          <option value="pen">✏️ رسم حر</option>
          <option value="line">📏 خط مستقيم</option>
          <option value="arrow">➡️ سهم</option>
          <option value="dotted">┄ خط منقط</option>
          <option value="curve">〰️ خط منحني</option>
          <option value="zigzag">⚡ خط متعرج</option>
          <option value="rect">▭ مستطيل</option>
          <option value="triangle">▲ مثلث</option>
          <option value="circle">◯ دائرة / بيضاوي</option>
          <option value="text">🔤 نص</option>
          <option value="eraser">🧹 ممحاة</option>
        </select>
        <input type="color" class="draw-color" value="#1e2519" title="اللون">
        <input type="range" class="draw-width" min="1" max="14" value="2" title="سُمك الخط">
        <input type="number" class="draw-fontsize" min="8" max="60" value="16" title="حجم الخط (للنص)" style="width:52px;">
        <label class="fill-toggle" style="display:flex; align-items:center; gap:3px; font-size:11.5px;">
          <input type="checkbox" class="draw-fill"> تعبئة
        </label>
        <button type="button" class="ghost draw-undo" title="تراجع عن آخر شكل">↩️ تراجع</button>
        <button type="button" class="ghost danger draw-clear" title="مسح كل الرسم">🗑 مسح الكل</button>
      </div>
      <div class="draw-canvas-wrap" style="position:relative;">
        <canvas class="draw-canvas"></canvas>
      </div>
    \`;

    const canvas = wrap.querySelector(".draw-canvas");
    const canvasWrap = wrap.querySelector(".draw-canvas-wrap");
    const ctx = canvas.getContext("2d");
    const toolSel = wrap.querySelector(".draw-tool");
    const colorInput = wrap.querySelector(".draw-color");
    const widthInput = wrap.querySelector(".draw-width");
    const fontInput = wrap.querySelector(".draw-fontsize");
    const fillInput = wrap.querySelector(".draw-fill");

    const state = { cssWidth: 640, cssHeight: 340, dpr: 1, redraw };
    wrap._drawState = state;

    function redraw(){
      ctx.clearRect(0, 0, state.cssWidth, state.cssHeight);
      section.drawing.shapes.forEach(sh => drawShape(ctx, sh));
    }

    // إعادة الضبط عند تغيير حجم الحاوية (مثلًا عند فتح/إغلاق وضع ملء الشاشة)
    if(window.ResizeObserver){
      new ResizeObserver(()=> resizeDrawCanvas(canvas, state)).observe(canvasWrap);
    }
    requestAnimationFrame(()=> resizeDrawCanvas(canvas, state));

    let dragging = false;
    let startPt = null;
    let penPoints = null;

    function getPos(e){
      const rect = canvas.getBoundingClientRect();
      const t = e.touches && e.touches[0];
      const clientX = t ? t.clientX : e.clientX;
      const clientY = t ? t.clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (state.cssWidth / rect.width),
        y: (clientY - rect.top) * (state.cssHeight / rect.height)
      };
    }

    function commitShape(shape){
      section.drawing.shapes.push(shape);
      scheduleAutoSave();
      redraw();
    }

    // مربع نص داخلي بديل prompt() (بعض المتصفحات بتحجب prompt الأصلي)
    function askInlineText(pos, onDone){
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "اكتب النص واضغط Enter…";
      input.style.cssText = \`position:absolute; left:\${pos.x * (canvas.getBoundingClientRect().width/state.cssWidth)}px; top:\${pos.y * (canvas.getBoundingClientRect().height/state.cssHeight)}px; z-index:5; font-size:13px; padding:3px 6px; border:1.5px solid var(--accent); border-radius:5px; min-width:120px;\`;
      canvasWrap.appendChild(input);
      input.focus();
      function finish(commit){
        const val = input.value.trim();
        input.remove();
        if(commit && val) onDone(val);
      }
      input.addEventListener("keydown", (e)=>{
        if(e.key === "Enter") finish(true);
        if(e.key === "Escape") finish(false);
      });
      input.addEventListener("blur", ()=> finish(true));
    }

    function eraseNear(pos){
      // بيشيل أقرب شكل لمكان الضغط (تقريب بسيط بالمسافة لأقرب نقطة مرجعية للشكل)
      let bestIdx = -1, bestDist = 26;
      section.drawing.shapes.forEach((sh, i)=>{
        const pts = shapeRefPoints(sh);
        pts.forEach(p=>{
          const d = Math.hypot(p.x - pos.x, p.y - pos.y);
          if(d < bestDist){ bestDist = d; bestIdx = i; }
        });
      });
      if(bestIdx !== -1){
        section.drawing.shapes.splice(bestIdx, 1);
        scheduleAutoSave();
        redraw();
      }
    }

    function startDraw(e){
      e.preventDefault();
      const tool = toolSel.value;
      const pos = getPos(e);
      if(tool === "text"){
        askInlineText(pos, (txt)=>{
          commitShape({ type:"text", x:pos.x, y:pos.y, text:txt, color:colorInput.value, fontSize:parseInt(fontInput.value,10)||16 });
        });
        return;
      }
      if(tool === "eraser"){
        dragging = true;
        eraseNear(pos);
        return;
      }
      dragging = true;
      startPt = pos;
      if(tool === "pen") penPoints = [pos];
    }
    function moveDraw(e){
      if(!dragging) return;
      e.preventDefault();
      const tool = toolSel.value;
      const pos = getPos(e);
      const width = parseInt(widthInput.value, 10) || 2;
      if(tool === "eraser"){ eraseNear(pos); return; }
      redraw();
      if(tool === "pen"){
        penPoints.push(pos);
        drawShape(ctx, { type:"freehand", points: penPoints, color: colorInput.value, width });
      } else {
        drawShape(ctx, buildLiveShape(tool, startPt, pos, colorInput.value, width, fillInput.checked));
      }
    }
    function endDraw(e){
      if(!dragging) return;
      dragging = false;
      const tool = toolSel.value;
      if(tool === "eraser"){ return; }
      const width = parseInt(widthInput.value, 10) || 2;
      const t = e.changedTouches && e.changedTouches[0];
      const pos = getPos(t ? { clientX:t.clientX, clientY:t.clientY } : e);
      if(tool === "pen"){
        if(penPoints && penPoints.length > 1) commitShape({ type:"freehand", points: penPoints, color: colorInput.value, width });
        else redraw();
        penPoints = null;
      } else {
        const shape = buildLiveShape(tool, startPt, pos, colorInput.value, width, fillInput.checked);
        if(Math.abs(shape.x2 - shape.x1) > 2 || Math.abs(shape.y2 - shape.y1) > 2) commitShape(shape);
        else redraw();
      }
      startPt = null;
    }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", moveDraw);
    window.addEventListener("mouseup", endDraw);
    canvas.addEventListener("touchstart", startDraw, {passive:false});
    canvas.addEventListener("touchmove", moveDraw, {passive:false});
    canvas.addEventListener("touchend", endDraw);

    wrap.querySelector(".draw-undo").addEventListener("click", ()=>{
      section.drawing.shapes.pop();
      scheduleAutoSave();
      redraw();
    });
    wrap.querySelector(".draw-clear").addEventListener("click", (e)=>{
      if(!section.drawing.shapes.length) return;
      if(!armConfirm(e.currentTarget, "اضغط تاني لمسح كل الرسم")) return;
      section.drawing.shapes = [];
      scheduleAutoSave();
      redraw();
      showToast("تم مسح الرسم.", "ok");
    });

    return wrap;
  }

  // نقاط مرجعية تقريبية لكل شكل — تُستخدم بأداة الممحاة لتحديد أقرب شكل لمكان الضغط
  function shapeRefPoints(sh){
    if(sh.type === "freehand") return sh.points || [];
    if(sh.type === "text") return [{x:sh.x, y:sh.y}];
    if(sh.type === "curve") return [{x:sh.x1,y:sh.y1},{x:sh.x2,y:sh.y2},{x:sh.cx,y:sh.cy}];
    if("x1" in sh) return [{x:sh.x1,y:sh.y1},{x:sh.x2,y:sh.y2},{x:(sh.x1+sh.x2)/2,y:(sh.y1+sh.y2)/2}];
    return [];
  }

  // يبني شكل "حي" أثناء السحب (قبل التأكيد) بناءً على نقطة البداية والنهاية الحاليتين
  function buildLiveShape(tool, start, end, color, width, filled){
    const base = { x1:start.x, y1:start.y, x2:end.x, y2:end.y, color, width, filled: !!filled };
    if(tool === "dotted") return Object.assign({type:"line", dashed:true}, base);
    if(tool === "arrow") return Object.assign({type:"arrow"}, base);
    if(tool === "curve"){
      const mx = (start.x+end.x)/2, my = (start.y+end.y)/2;
      const dx = end.x-start.x, dy = end.y-start.y;
      const len = Math.hypot(dx,dy) || 1;
      const nx = -dy/len, ny = dx/len;
      const bulge = Math.min(len*0.35, 60);
      return Object.assign({type:"curve", cx:mx+nx*bulge, cy:my+ny*bulge}, base);
    }
    if(tool === "zigzag") return Object.assign({type:"zigzag"}, base);
    if(tool === "rect") return Object.assign({type:"rect"}, base);
    if(tool === "triangle") return Object.assign({type:"triangle"}, base);
    if(tool === "circle") return Object.assign({type:"circle"}, base);
    return Object.assign({type:"line"}, base); // "line" tool وأي حالة افتراضية
  }

  // يرسم شكل واحد على الكانفاس — نفس الدالة بتتستخدم للمعاينة الحية وللرسم النهائي المحفوظ
  function drawShape(ctx, sh){
    ctx.save();
    ctx.strokeStyle = sh.color || "#1e2519";
    ctx.fillStyle = sh.color || "#1e2519";
    ctx.lineWidth = sh.width || 2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.setLineDash(sh.dashed ? [(sh.width||2)*2+4, (sh.width||2)*2+4] : []);

    if(sh.type === "freehand"){
      if(!sh.points || sh.points.length < 2){ ctx.restore(); return; }
      ctx.beginPath();
      ctx.moveTo(sh.points[0].x, sh.points[0].y);
      for(let i=1;i<sh.points.length;i++) ctx.lineTo(sh.points[i].x, sh.points[i].y);
      ctx.stroke();
    } else if(sh.type === "line"){
      ctx.beginPath();
      ctx.moveTo(sh.x1, sh.y1);
      ctx.lineTo(sh.x2, sh.y2);
      ctx.stroke();
    } else if(sh.type === "arrow"){
      ctx.beginPath();
      ctx.moveTo(sh.x1, sh.y1);
      ctx.lineTo(sh.x2, sh.y2);
      ctx.stroke();
      const angle = Math.atan2(sh.y2-sh.y1, sh.x2-sh.x1);
      const headLen = 8 + (sh.width||2)*2.2;
      ctx.beginPath();
      ctx.moveTo(sh.x2, sh.y2);
      ctx.lineTo(sh.x2 - headLen*Math.cos(angle - Math.PI/7), sh.y2 - headLen*Math.sin(angle - Math.PI/7));
      ctx.lineTo(sh.x2 - headLen*Math.cos(angle + Math.PI/7), sh.y2 - headLen*Math.sin(angle + Math.PI/7));
      ctx.closePath();
      ctx.fill();
    } else if(sh.type === "curve"){
      ctx.beginPath();
      ctx.moveTo(sh.x1, sh.y1);
      ctx.quadraticCurveTo(sh.cx, sh.cy, sh.x2, sh.y2);
      ctx.stroke();
    } else if(sh.type === "zigzag"){
      const segs = 8;
      const dx = (sh.x2-sh.x1)/segs, dy = (sh.y2-sh.y1)/segs;
      const len = Math.hypot(sh.x2-sh.x1, sh.y2-sh.y1) || 1;
      const nx = -(sh.y2-sh.y1)/len, ny = (sh.x2-sh.x1)/len;
      const amp = 10;
      ctx.beginPath();
      ctx.moveTo(sh.x1, sh.y1);
      for(let i=1;i<segs;i++){
        const sign = (i%2===0) ? 1 : -1;
        ctx.lineTo(sh.x1 + dx*i + nx*amp*sign, sh.y1 + dy*i + ny*amp*sign);
      }
      ctx.lineTo(sh.x2, sh.y2);
      ctx.stroke();
    } else if(sh.type === "rect"){
      const x=Math.min(sh.x1,sh.x2), y=Math.min(sh.y1,sh.y2), w=Math.abs(sh.x2-sh.x1), h=Math.abs(sh.y2-sh.y1);
      if(sh.filled) ctx.fillRect(x,y,w,h); else ctx.strokeRect(x,y,w,h);
    } else if(sh.type === "triangle"){
      const x1=Math.min(sh.x1,sh.x2), x2=Math.max(sh.x1,sh.x2), y1=Math.min(sh.y1,sh.y2), y2=Math.max(sh.y1,sh.y2);
      ctx.beginPath();
      ctx.moveTo((x1+x2)/2, y1);
      ctx.lineTo(x1, y2);
      ctx.lineTo(x2, y2);
      ctx.closePath();
      if(sh.filled) ctx.fill(); else ctx.stroke();
    } else if(sh.type === "circle"){
      const cx=(sh.x1+sh.x2)/2, cy=(sh.y1+sh.y2)/2;
      const rx=Math.abs(sh.x2-sh.x1)/2, ry=Math.abs(sh.y2-sh.y1)/2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx||1, ry||1, 0, 0, Math.PI*2);
      if(sh.filled) ctx.fill(); else ctx.stroke();
    } else if(sh.type === "text"){
      ctx.font = (sh.fontSize||16) + "px Tahoma, Arial, sans-serif";
      ctx.textBaseline = "top";
      ctx.fillText(sh.text, sh.x, sh.y);
    }
    ctx.restore();
  }

  /* ============================== MIND MAP PANEL (per card) ============================== */
  const SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs){
    const el = document.createElementNS(SVGNS, tag);
    if(attrs) for(const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  const MM_COLORS = ["#7a5c2d","#0f5c56","#b23b34","#3a5a8c","#8c5a9c","#6b6255"];
  const MM_BASE_W = 132, MM_BASE_H = 46;

  function buildMindMapPanel(section){
    if(!section.mindmap || !section.mindmap.nodes || !Object.keys(section.mindmap.nodes).length){
      const rootId = "m_root";
      section.mindmap = {
        nodes: { [rootId]: { id:rootId, text:"الفكرة الرئيسية", parentId:null, x:0, y:0, color:MM_COLORS[0], shape:"rounded", scale:1, collapsed:false, orderIndex:0, note:"" } },
        rootId, dir:"rtl", dark:false
      };
    }
    const mm = section.mindmap;

    const wrap = document.createElement("div");
    wrap.className = "mindmap-panel" + (mm.dark ? " mm-dark" : "");
    wrap.innerHTML = \`
      <div class="mm-toolbar">
        <button data-act="add-child" title="إضافة تابع (Tab)">➕ تابع</button>
        <button data-act="add-sibling" title="إضافة شقيق (Enter)">➕ شقيق</button>
        <button data-act="add-parent" title="إضافة أب">➕ أب</button>
        <span class="mm-sep"></span>
        <button data-act="dup" title="تكرار العقدة">⧉ تكرار</button>
        <button data-act="del" title="حذف (Delete)">🗑 حذف</button>
        <span class="mm-sep"></span>
        <button data-act="undo" title="تراجع (Ctrl+Z)">↩️</button>
        <button data-act="redo" title="إعادة (Ctrl+Y)">↪️</button>
        <span class="mm-sep"></span>
        <button data-act="collapse-toggle" title="طيّ/فرد الفرع المحدد">⊟ طيّ الفرع</button>
        <button data-act="layout" title="ترتيب تلقائي">🧩 ترتيب تلقائي</button>
        <span class="mm-sep"></span>
        <button data-act="zoom-in">🔍+</button>
        <button data-act="zoom-out">🔍−</button>
        <button data-act="zoom-reset" title="ملائمة الكل">⤢ ملائمة</button>
        <span class="mm-sep"></span>
        <input type="text" class="mm-search" placeholder="🔎 بحث في الخريطة… (Ctrl+F)">
        <span class="mm-sep"></span>
        <button data-act="dir" title="تبديل اتجاه الخريطة">\${mm.dir === "rtl" ? "⇦ RTL" : "⇨ LTR"}</button>
        <button data-act="theme" title="تبديل الوضع الداكن/الفاتح">\${mm.dark ? "☀️" : "🌙"}</button>
        <span class="mm-sep"></span>
        <button data-act="export-json" title="تصدير JSON">💾 JSON</button>
        <button data-act="import-json" title="استيراد JSON">📂 JSON</button>
        <input type="file" class="mm-import-input" accept=".json" style="display:none;">
        <button data-act="export-png" title="تصدير صورة PNG">🖼 PNG</button>
        <button data-act="export-svg" title="تصدير SVG">🎯 SVG</button>
      </div>
      <div class="mm-toolbar mm-props" style="display:none;"></div>
      <div class="mm-stage-wrap">
        <svg></svg>
      </div>
      <div class="mm-status"></div>
    \`;

    const propsBar = wrap.querySelector(".mm-props");

    const stageWrap = wrap.querySelector(".mm-stage-wrap");
    const svg = wrap.querySelector("svg");
    const searchInput = wrap.querySelector(".mm-search");
    const statusEl = wrap.querySelector(".mm-status");
    const importInput = wrap.querySelector(".mm-import-input");

    const state = {
      scale: 1, tx: 0, ty: 0,
      selectedIds: new Set([mm.rootId]),
      history: [], future: [],
      searchIdx: 0, matches: [],
      onResize: null,
    };
    wrap._mmState = state;

    /* ---------- أدوات بيانات ---------- */
    function childrenOf(id){
      return Object.values(mm.nodes).filter(n=>n.parentId===id).sort((a,b)=>a.orderIndex-b.orderIndex);
    }
    function descendantsOf(id){
      const out = [];
      childrenOf(id).forEach(c=>{ out.push(c.id); out.push(...descendantsOf(c.id)); });
      return out;
    }
    function isCollapsedAncestor(id){
      let n = mm.nodes[id];
      while(n && n.parentId){
        n = mm.nodes[n.parentId];
        if(n && n.collapsed) return true;
      }
      return false;
    }
    function snapshot(){ return JSON.stringify(mm); }
    function pushHistory(){
      state.history.push(snapshot());
      if(state.history.length > 60) state.history.shift();
      state.future = [];
    }
    function undo(){
      if(!state.history.length){ showToast("مفيش خطوات للتراجع.", "err", 1600); return; }
      state.future.push(snapshot());
      const prev = state.history.pop();
      Object.assign(mm, JSON.parse(prev));
      normalizeSelection();
      scheduleAutoSave();
      render();
    }
    function redo(){
      if(!state.future.length){ showToast("مفيش خطوات لإعادتها.", "err", 1600); return; }
      state.history.push(snapshot());
      const next = state.future.pop();
      Object.assign(mm, JSON.parse(next));
      normalizeSelection();
      scheduleAutoSave();
      render();
    }
    function normalizeSelection(){
      state.selectedIds.forEach(id=>{ if(!mm.nodes[id]) state.selectedIds.delete(id); });
      if(!state.selectedIds.size) state.selectedIds.add(mm.rootId);
    }

    function makeNode(text, parentId){
      const id = "m" + Math.random().toString(36).slice(2,9);
      const sibs = parentId ? childrenOf(parentId) : [];
      const orderIndex = sibs.length ? Math.max(...sibs.map(s=>s.orderIndex)) + 1 : 0;
      const parent = parentId ? mm.nodes[parentId] : null;
      return {
        id, text, parentId,
        x: parent ? parent.x + (mm.dir === "rtl" ? -190 : 190) : 0,
        y: parent ? parent.y + sibs.length * 60 : 0,
        color: MM_COLORS[Object.keys(mm.nodes).length % MM_COLORS.length],
        shape: "rounded", scale: 1, collapsed: false, orderIndex, note: ""
      };
    }

    function selectedSingle(){
      const ids = [...state.selectedIds];
      return ids.length ? mm.nodes[ids[ids.length-1]] : mm.nodes[mm.rootId];
    }

    function addChild(){
      pushHistory();
      const parent = selectedSingle();
      const node = makeNode("فكرة جديدة", parent.id);
      mm.nodes[node.id] = node;
      state.selectedIds = new Set([node.id]);
      scheduleAutoSave(); render(); startEdit(node.id);
    }
    function addSibling(){
      const cur = selectedSingle();
      if(cur.id === mm.rootId){ addChild(); return; }
      pushHistory();
      const node = makeNode("فكرة جديدة", cur.parentId);
      mm.nodes[node.id] = node;
      state.selectedIds = new Set([node.id]);
      scheduleAutoSave(); render(); startEdit(node.id);
    }
    function addParent(){
      pushHistory();
      const cur = selectedSingle();
      const oldParentId = cur.parentId;
      const node = makeNode("فكرة جديدة", oldParentId);
      node.x = cur.x + (mm.dir === "rtl" ? 190 : -190);
      node.y = cur.y;
      mm.nodes[node.id] = node;
      cur.parentId = node.id;
      if(cur.id === mm.rootId) mm.rootId = node.id;
      state.selectedIds = new Set([node.id]);
      scheduleAutoSave(); render(); startEdit(node.id);
    }
    function duplicateSelected(){
      pushHistory();
      const cur = selectedSingle();
      const idMap = {};
      function cloneSub(id, newParentId){
        const src = mm.nodes[id];
        const nid = "m" + Math.random().toString(36).slice(2,9);
        idMap[id] = nid;
        const clone = Object.assign({}, src, { id:nid, parentId:newParentId });
        mm.nodes[nid] = clone;
        childrenOf(id).forEach(c=> cloneSub(c.id, nid));
        return nid;
      }
      const sibs = childrenOf(cur.parentId || null);
      const newId = cloneSub(cur.id, cur.parentId);
      mm.nodes[newId].orderIndex = (sibs.length ? Math.max(...sibs.map(s=>s.orderIndex)) : 0) + 1;
      mm.nodes[newId].x += 24; mm.nodes[newId].y += 24;
      state.selectedIds = new Set([newId]);
      scheduleAutoSave(); render();
      showToast("تم تكرار العقدة وفروعها.", "ok", 1600);
    }
    function deleteSelected(){
      const ids = [...state.selectedIds].filter(id=>id !== mm.rootId);
      if(!ids.length){ showToast("مينفعش تحذف العقدة الجذر.", "err"); return; }
      pushHistory();
      ids.forEach(id=>{
        descendantsOf(id).forEach(d=> delete mm.nodes[d]);
        delete mm.nodes[id];
      });
      state.selectedIds = new Set([mm.rootId]);
      scheduleAutoSave(); render();
    }
    function toggleCollapse(id){
      pushHistory();
      mm.nodes[id].collapsed = !mm.nodes[id].collapsed;
      scheduleAutoSave(); render();
    }

    function autoLayout(){
      pushHistory();
      const dir = mm.dir === "rtl" ? -1 : 1;
      const levelGapX = 185, sibGapY = 58;
      let cursorY = 0;
      function measure(id, depth){
        const node = mm.nodes[id];
        const kids = node.collapsed ? [] : childrenOf(id);
        if(!kids.length){
          node.x = depth * levelGapX * dir;
          node.y = cursorY;
          cursorY += sibGapY;
          return;
        }
        kids.forEach(k=> measure(k.id, depth+1));
        const ys = kids.map(k=> mm.nodes[k.id].y);
        node.x = depth * levelGapX * dir;
        node.y = (Math.min(...ys) + Math.max(...ys)) / 2;
      }
      measure(mm.rootId, 0);
      scheduleAutoSave(); fitToScreen(); render();
      showToast("تم إعادة الترتيب التلقائي.", "ok", 1600);
    }

    /* ---------- pan / zoom ---------- */
    function applyTransform(){
      gLines.setAttribute("transform", \`translate(\${state.tx},\${state.ty}) scale(\${state.scale})\`);
      gNodes.setAttribute("transform", \`translate(\${state.tx},\${state.ty}) scale(\${state.scale})\`);
    }
    function zoomAt(sx, sy, newScale){
      newScale = Math.max(0.25, Math.min(3, newScale));
      const wx = (sx - state.tx) / state.scale, wy = (sy - state.ty) / state.scale;
      state.scale = newScale;
      state.tx = sx - wx * newScale;
      state.ty = sy - wy * newScale;
      applyTransform();
    }
    function fitToScreen(){
      const nodes = Object.values(mm.nodes);
      if(!nodes.length) return;
      const xs = nodes.map(n=>n.x), ys = nodes.map(n=>n.y);
      const minX = Math.min(...xs)-MM_BASE_W, maxX = Math.max(...xs)+MM_BASE_W;
      const minY = Math.min(...ys)-MM_BASE_H, maxY = Math.max(...ys)+MM_BASE_H;
      const rect = stageWrap.getBoundingClientRect();
      const w = Math.max(1, rect.width), h = Math.max(1, rect.height);
      const scale = Math.max(0.3, Math.min(1.6, Math.min(w/(maxX-minX||1), h/(maxY-minY||1)) * 0.92));
      state.scale = scale;
      state.tx = w/2 - (minX+maxX)/2*scale;
      state.ty = h/2 - (minY+maxY)/2*scale;
      applyTransform();
    }
    function centerOn(id){
      const n = mm.nodes[id];
      const rect = stageWrap.getBoundingClientRect();
      state.tx = rect.width/2 - n.x*state.scale;
      state.ty = rect.height/2 - n.y*state.scale;
      applyTransform();
    }

    /* ---------- بناء طبقات SVG ---------- */
    svg.innerHTML = "";
    const gLines = svgEl("g");
    const gNodes = svgEl("g");
    svg.appendChild(gLines);
    svg.appendChild(gNodes);

    function nodeSize(n){
      const s = n.scale || 1;
      switch(n.shape){
        case "circle": { const d = 78*s; return { w:d, h:d }; }
        case "star": { const d = 94*s; return { w:d, h:d }; }
        case "diamond": return { w: MM_BASE_W*s, h: MM_BASE_H*1.6*s };
        case "triangle": return { w: MM_BASE_W*s, h: MM_BASE_H*1.6*s };
        case "arrow-right":
        case "arrow-left": return { w: MM_BASE_W*1.2*s, h: MM_BASE_H*s };
        default: return { w: MM_BASE_W*s, h: MM_BASE_H*s };
      }
    }

    function renderStage(){
      gLines.innerHTML = "";
      gNodes.innerHTML = "";
      const visible = Object.values(mm.nodes).filter(n=> !isCollapsedAncestor(n.id));

      // خطوط الربط (منحنية)
      visible.forEach(n=>{
        if(!n.parentId) return;
        const p = mm.nodes[n.parentId];
        if(!p || isCollapsedAncestor(p.id)) return;
        const mx = (p.x+n.x)/2;
        const path = svgEl("path", {
          d: \`M \${p.x} \${p.y} C \${mx} \${p.y}, \${mx} \${n.y}, \${n.x} \${n.y}\`,
          stroke: "var(--mm-line)", "stroke-width": 2, fill: "none"
        });
        gLines.appendChild(path);
      });

      // العقد
      visible.forEach(n=>{
        const {w,h} = nodeSize(n);
        const fo = svgEl("foreignObject", { x:n.x-w/2, y:n.y-h/2, width:w, height:h, style:"overflow:visible;" });
        const div = document.createElement("div");
        div.className = "mm-node-box shape-" + n.shape + (state.selectedIds.has(n.id) ? " mm-selected" : "") + (state.matches.includes(n.id) ? " mm-match" : "");
        div.style.borderColor = n.color; div.style.color = n.color;
        div.textContent = n.text;
        div.dataset.id = n.id;
        div.setAttribute("spellcheck", "false");
        fo.appendChild(div);
        gNodes.appendChild(fo);

        div.addEventListener("mousedown", (e)=> onNodeDown(e, n.id));
        div.addEventListener("touchstart", (e)=> onNodeDown(e, n.id), {passive:false});
        div.addEventListener("dblclick", (e)=>{ e.stopPropagation(); startEdit(n.id); });
        div.addEventListener("blur", ()=> commitEdit(n.id, div));
        div.addEventListener("keydown", (e)=>{
          if(e.key === "Enter" && div.isContentEditable){ e.preventDefault(); div.blur(); }
          e.stopPropagation();
        });

        if(n.note && n.note.trim()){
          const noteBtn = svgEl("foreignObject", { x:n.x + (mm.dir==="rtl" ? w/2-16 : -w/2-2), y:n.y-h/2-2, width:18, height:18, style:"overflow:visible;" });
          const nb = document.createElement("div");
          nb.className = "mm-note-badge";
          nb.textContent = "🗒";
          nb.title = n.note;
          nb.addEventListener("mousedown", (e)=> e.stopPropagation());
          nb.addEventListener("click", (e)=>{ e.stopPropagation(); openNoteEditor(n); });
          noteBtn.appendChild(nb);
          gNodes.appendChild(noteBtn);
        }

        const kids = childrenOf(n.id);
        if(kids.length){
          const btn = svgEl("foreignObject", { x:n.x + (mm.dir==="rtl" ? -w/2-18 : w/2+2), y:n.y-9, width:18, height:18 });
          const b = document.createElement("div");
          b.className = "mm-collapse-btn"; b.textContent = n.collapsed ? "+" : "−";
          b.style.position = "static";
          b.addEventListener("mousedown", (e)=> e.stopPropagation());
          b.addEventListener("click", (e)=>{ e.stopPropagation(); toggleCollapse(n.id); });
          btn.appendChild(b);
          gNodes.appendChild(btn);
        }
      });

      applyTransform();
      statusEl.textContent = Object.keys(mm.nodes).length + " عقدة" + (state.selectedIds.size>1 ? " — محدد: " + state.selectedIds.size : "");
    }
    function render(){ renderStage(); renderProps(); }

    function renderProps(){
      if(state.selectedIds.size !== 1){ propsBar.style.display = "none"; return; }
      const n = mm.nodes[[...state.selectedIds][0]];
      if(!n){ propsBar.style.display = "none"; return; }
      propsBar.style.display = "flex";
      propsBar.innerHTML = \`
        <span style="font-size:11px; color:var(--ink-soft);">خصائص العقدة:</span>
        \${MM_COLORS.map(c=>\`<button data-color="\${c}" style="width:20px;height:20px;border-radius:50%;background:\${c};border:2px solid \${n.color===c?'#000':'transparent'};padding:0;"></button>\`).join("")}
        <input type="color" class="mm-custom-color" value="\${n.color}" title="لون مخصص">
        <span class="mm-sep"></span>
        <select class="mm-shape-sel" title="الشكل">
          <option value="rounded" \${n.shape==="rounded"?"selected":""}>مستطيل مدوّر</option>
          <option value="rect" \${n.shape==="rect"?"selected":""}>مستطيل حاد</option>
          <option value="ellipse" \${n.shape==="ellipse"?"selected":""}>بيضاوي</option>
          <option value="circle" \${n.shape==="circle"?"selected":""}>دائرة</option>
          <option value="diamond" \${n.shape==="diamond"?"selected":""}>معين (قرار)</option>
          <option value="triangle" \${n.shape==="triangle"?"selected":""}>مثلث</option>
          <option value="hexagon" \${n.shape==="hexagon"?"selected":""}>سداسي الأضلاع</option>
          <option value="octagon" \${n.shape==="octagon"?"selected":""}>ثماني الأضلاع</option>
          <option value="parallelogram" \${n.shape==="parallelogram"?"selected":""}>متوازي أضلاع</option>
          <option value="arrow-right" \${n.shape==="arrow-right"?"selected":""}>سهم لليمين</option>
          <option value="arrow-left" \${n.shape==="arrow-left"?"selected":""}>سهم للشمال</option>
          <option value="star" \${n.shape==="star"?"selected":""}>نجمة</option>
          <option value="cloud" \${n.shape==="cloud"?"selected":""}>سحابة</option>
          <option value="none" \${n.shape==="none"?"selected":""}>بدون إطار</option>
        </select>
        <span class="mm-sep"></span>
        <span style="font-size:11px;">الحجم</span>
        <input type="range" class="mm-size-range" min="0.7" max="1.8" step="0.1" value="\${n.scale||1}">
        <span class="mm-sep"></span>
        <button class="small mm-note-btn" type="button" title="إضافة/تعديل ملاحظة على العقدة">🗒️ \${n.note && n.note.trim() ? "تعديل الملاحظة" : "إضافة ملاحظة"}</button>
      \`;
      propsBar.querySelector(".mm-note-btn").addEventListener("click", ()=> openNoteEditor(n));
      propsBar.querySelectorAll("[data-color]").forEach(btn=>{
        btn.addEventListener("click", ()=>{ pushHistory(); n.color = btn.dataset.color; scheduleAutoSave(); render(); });
      });
      propsBar.querySelector(".mm-custom-color").addEventListener("input", (e)=>{
        n.color = e.target.value; scheduleAutoSave(); renderStage();
      });
      propsBar.querySelector(".mm-shape-sel").addEventListener("change", (e)=>{
        pushHistory(); n.shape = e.target.value; scheduleAutoSave(); render();
      });
      propsBar.querySelector(".mm-size-range").addEventListener("input", (e)=>{
        n.scale = parseFloat(e.target.value); scheduleAutoSave(); renderStage();
      });
    }

    function startEdit(id){
      render();
      requestAnimationFrame(()=>{
        const div = gNodes.querySelector(\`[data-id="\${id}"]\`);
        if(!div) return;
        pushHistory();
        div.contentEditable = "true";
        div.focus();
        document.execCommand && document.execCommand("selectAll", false, null);
      });
    }
    function commitEdit(id, div){
      if(div.isContentEditable){
        div.contentEditable = "false";
        const val = div.textContent.trim() || "بدون عنوان";
        if(mm.nodes[id]) mm.nodes[id].text = val;
        scheduleAutoSave();
      }
    }

    function openNoteEditor(n){
      pushHistory();
      const overlay = document.createElement("div");
      overlay.className = "fs-overlay";
      overlay.innerHTML = \`
        <div class="fs-box" style="max-width:420px;">
          <div class="fs-head">
            <strong>🗒️ ملاحظة على: \${escapeHtml(n.text)}</strong>
            <button class="ghost" data-act="note-close">✕ إغلاق</button>
          </div>
          <div class="fs-body">
            <textarea class="rawinput" style="min-height:120px;" placeholder="اكتب ملاحظتك هنا…">\${escapeHtml(n.note||"")}</textarea>
            <div class="addbox-actions">
              <button class="primary" data-act="note-save">حفظ الملاحظة</button>
              <button class="ghost danger" data-act="note-delete">حذف الملاحظة</button>
            </div>
          </div>
        </div>
      \`;
      document.body.appendChild(overlay);
      const ta = overlay.querySelector("textarea");
      setTimeout(()=> ta.focus(), 30);
      function close(){ overlay.remove(); document.removeEventListener("keydown", onKey); }
      function onKey(e){ if(e.key === "Escape") close(); }
      document.addEventListener("keydown", onKey);
      overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
      overlay.querySelector('[data-act="note-close"]').addEventListener("click", close);
      overlay.querySelector('[data-act="note-save"]').addEventListener("click", ()=>{
        n.note = ta.value.trim();
        scheduleAutoSave(); render();
        showToast("تم حفظ الملاحظة.", "ok", 1600);
        close();
      });
      overlay.querySelector('[data-act="note-delete"]').addEventListener("click", ()=>{
        n.note = "";
        scheduleAutoSave(); render();
        showToast("تم حذف الملاحظة.", "ok", 1600);
        close();
      });
    }

    /* ---------- تفاعل السحب والتحديد والتحريك ---------- */
    let dragMode = null; // "node" | "pan"
    let dragStart = null;
    let dragOrigins = null;
    let dragDistance = 0;
    let clickToEditId = null; // لو الضغطة دي على عقدة كانت أصلًا محددة لوحدها، وما حصلش سحب فعلي، نفتح وضع التعديل

    function onNodeDown(e, id){
      const div = e.currentTarget;
      if(div.isContentEditable){ e.stopPropagation(); return; }
      e.stopPropagation();
      e.preventDefault();
      wrap.focus();
      const additive = e.shiftKey || e.ctrlKey || e.metaKey;
      const wasSoleSelected = !additive && state.selectedIds.size === 1 && state.selectedIds.has(id);
      let selectionChanged = false;
      if(additive){
        if(state.selectedIds.has(id)) state.selectedIds.delete(id); else state.selectedIds.add(id);
        selectionChanged = true;
      } else if(!state.selectedIds.has(id)){
        state.selectedIds = new Set([id]);
        selectionChanged = true;
      }
      pushHistory();
      // مهم: نعمل render() الكامل بس لو التحديد اتغيّر فعلًا. إعادة بناء العقدة نفسها
      // مع كل mousedown (حتى لو التحديد ما اتغيرش) كانت بتهدم عنصر الـ DOM قبل ما
      // يوصل الضغط التاني من الدبل كليك، فالمتصفح ما كانش بيولّد حدث dblclick أصلًا،
      // وده اللي كان مانع تعديل اسم العقدة (والدخول في وضع الكتابة بشكل عام).
      if(selectionChanged) render(); else renderProps();
      dragMode = "node";
      dragDistance = 0;
      clickToEditId = wasSoleSelected ? id : null;
      const t = e.touches ? e.touches[0] : e;
      dragStart = { x:t.clientX, y:t.clientY };
      dragOrigins = {};
      state.selectedIds.forEach(sid=>{ const n = mm.nodes[sid]; dragOrigins[sid] = {x:n.x, y:n.y}; });
      window.addEventListener("mousemove", onDragMove);
      window.addEventListener("mouseup", onDragEnd);
      window.addEventListener("touchmove", onDragMove, {passive:false});
      window.addEventListener("touchend", onDragEnd);
    }
    function onStageDown(e){
      wrap.focus();
      dragMode = "pan";
      svg.classList.add("panning");
      const t = e.touches ? e.touches[0] : e;
      dragStart = { x:t.clientX, y:t.clientY, tx:state.tx, ty:state.ty };
      window.addEventListener("mousemove", onDragMove);
      window.addEventListener("mouseup", onDragEnd);
      window.addEventListener("touchmove", onDragMove, {passive:false});
      window.addEventListener("touchend", onDragEnd);
    }
    function onDragMove(e){
      if(!dragMode) return;
      if(e.cancelable) e.preventDefault();
      const t = e.touches ? e.touches[0] : e;
      const dx = t.clientX - dragStart.x, dy = t.clientY - dragStart.y;
      dragDistance = Math.max(dragDistance, Math.hypot(dx, dy));
      if(dragMode === "pan"){
        state.tx = dragStart.tx + dx; state.ty = dragStart.ty + dy;
        applyTransform();
      } else if(dragMode === "node"){
        const wdx = dx/state.scale, wdy = dy/state.scale;
        state.selectedIds.forEach(id=>{
          const n = mm.nodes[id]; const o = dragOrigins[id];
          if(n && o){ n.x = o.x + wdx; n.y = o.y + wdy; }
        });
        render();
      }
    }
    function onDragEnd(){
      const wasNodeDrag = dragMode === "node";
      const editId = clickToEditId;
      const moved = dragDistance;
      if(wasNodeDrag) scheduleAutoSave();
      dragMode = null; svg.classList.remove("panning");
      clickToEditId = null;
      window.removeEventListener("mousemove", onDragMove);
      window.removeEventListener("mouseup", onDragEnd);
      window.removeEventListener("touchmove", onDragMove);
      window.removeEventListener("touchend", onDragEnd);
      // ضغطة عادية (من غير سحب) على عقدة كانت أصلًا محددة لوحدها = ادخل وضع التعديل مباشرة
      if(wasNodeDrag && editId && moved < 4){
        startEdit(editId);
      }
    }
    svg.addEventListener("mousedown", onStageDown);
    svg.addEventListener("touchstart", onStageDown, {passive:false});
    svg.addEventListener("wheel", (e)=>{
      e.preventDefault();
      const rect = svg.getBoundingClientRect();
      zoomAt(e.clientX-rect.left, e.clientY-rect.top, state.scale * (e.deltaY<0 ? 1.12 : 0.89));
    }, {passive:false});

    /* ---------- بحث ---------- */
    function runSearch(){
      const q = searchInput.value.trim().toLowerCase();
      state.matches = q ? Object.values(mm.nodes).filter(n=> n.text.toLowerCase().includes(q)).map(n=>n.id) : [];
      state.searchIdx = 0;
      render();
      if(state.matches.length){ centerOn(state.matches[0]); }
    }
    searchInput.addEventListener("input", runSearch);
    searchInput.addEventListener("keydown",(e)=>{
      e.stopPropagation();
      if(e.key === "Enter" && state.matches.length){
        state.searchIdx = (state.searchIdx + 1) % state.matches.length;
        centerOn(state.matches[state.searchIdx]);
      }
    });

    /* ---------- تصدير/استيراد ---------- */
    function downloadBlob(content, type, filename){
      const blob = new Blob([content], {type});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
    function exportJSON(){
      downloadBlob(JSON.stringify(mm, null, 2), "application/json", (section.title||"mindmap") + "-mindmap.json");
    }
    function exportSVG(){
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", SVGNS);
      clone.querySelectorAll(".mm-node-box").forEach(d=> d.removeAttribute("contenteditable"));
      const src = new XMLSerializer().serializeToString(clone);
      downloadBlob(src, "image/svg+xml", (section.title||"mindmap") + "-mindmap.svg");
    }
    function exportPNG(){
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", SVGNS);
      const rect = stageWrap.getBoundingClientRect();
      clone.setAttribute("width", rect.width); clone.setAttribute("height", rect.height);
      const src = new XMLSerializer().serializeToString(clone);
      const img = new Image();
      const svgBlob = new Blob([src], {type:"image/svg+xml;charset=utf-8"});
      const url = URL.createObjectURL(svgBlob);
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        const dpr = Math.min(window.devicePixelRatio||1, 3);
        canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
        const cctx = canvas.getContext("2d");
        cctx.scale(dpr,dpr);
        cctx.fillStyle = mm.dark ? "#1c1a16" : "#fbf9f2";
        cctx.fillRect(0,0,rect.width,rect.height);
        cctx.drawImage(img, 0, 0, rect.width, rect.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob=>{
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = (section.title||"mindmap") + "-mindmap.png";
          document.body.appendChild(a); a.click(); a.remove();
        });
      };
      img.onerror = ()=>{ showToast("تعذّر تصدير PNG في هذا المتصفح — جرّب SVG بدلًا منه.", "err"); URL.revokeObjectURL(url); };
      img.src = url;
    }

    /* ---------- اختصارات لوحة المفاتيح (تعمل فقط أثناء التركيز داخل هذه اللوحة) ---------- */
    wrap.tabIndex = 0;
    wrap.addEventListener("keydown",(e)=>{
      const editing = document.activeElement && document.activeElement.isContentEditable;
      if(e.key === "Tab" && !editing){ e.preventDefault(); addChild(); }
      else if(e.key === "Enter" && !editing && document.activeElement !== searchInput){ e.preventDefault(); addSibling(); }
      else if(e.key === "F2"){ e.preventDefault(); startEdit(selectedSingle().id); }
      else if(e.key === "Delete" && !editing){ e.preventDefault(); deleteSelected(); }
      else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
      else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); }
      else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); scheduleAutoSave(); showToast("تم الحفظ ✅", "ok", 1200); }
      else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="f"){ e.preventDefault(); searchInput.focus(); }
    });

    /* ---------- ربط أزرار الشريط ---------- */
    wrap.querySelector('[data-act="add-child"]').addEventListener("click", addChild);
    wrap.querySelector('[data-act="add-sibling"]').addEventListener("click", addSibling);
    wrap.querySelector('[data-act="add-parent"]').addEventListener("click", addParent);
    wrap.querySelector('[data-act="dup"]').addEventListener("click", duplicateSelected);
    wrap.querySelector('[data-act="del"]').addEventListener("click", deleteSelected);
    wrap.querySelector('[data-act="undo"]').addEventListener("click", undo);
    wrap.querySelector('[data-act="redo"]').addEventListener("click", redo);
    wrap.querySelector('[data-act="collapse-toggle"]').addEventListener("click", ()=> toggleCollapse(selectedSingle().id));
    wrap.querySelector('[data-act="layout"]').addEventListener("click", autoLayout);
    wrap.querySelector('[data-act="zoom-in"]').addEventListener("click", ()=>{ const r=stageWrap.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, state.scale*1.2); });
    wrap.querySelector('[data-act="zoom-out"]').addEventListener("click", ()=>{ const r=stageWrap.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, state.scale/1.2); });
    wrap.querySelector('[data-act="zoom-reset"]').addEventListener("click", fitToScreen);
    wrap.querySelector('[data-act="dir"]').addEventListener("click", (e)=>{
      mm.dir = mm.dir === "rtl" ? "ltr" : "rtl";
      wrap.dir = mm.dir;
      e.currentTarget.textContent = mm.dir === "rtl" ? "⇦ RTL" : "⇨ LTR";
      scheduleAutoSave();
    });
    wrap.querySelector('[data-act="theme"]').addEventListener("click", (e)=>{
      mm.dark = !mm.dark;
      wrap.classList.toggle("mm-dark", mm.dark);
      e.currentTarget.textContent = mm.dark ? "☀️" : "🌙";
      scheduleAutoSave();
    });
    wrap.querySelector('[data-act="export-json"]').addEventListener("click", exportJSON);
    wrap.querySelector('[data-act="export-png"]').addEventListener("click", exportPNG);
    wrap.querySelector('[data-act="export-svg"]').addEventListener("click", exportSVG);
    wrap.querySelector('[data-act="import-json"]').addEventListener("click", ()=> importInput.click());
    importInput.addEventListener("change",(e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(data.nodes && data.rootId){
            pushHistory();
            Object.assign(mm, data);
            normalizeSelection();
            scheduleAutoSave(); fitToScreen(); render();
            showToast("تم استيراد الخريطة ✅", "ok");
          } else showToast("ملف غير صالح لخريطة ذهنية.", "err");
        }catch(err){ showToast("تعذّر قراءة الملف: " + err.message, "err"); }
      };
      reader.readAsText(f, "utf-8");
      e.target.value = "";
    });

    wrap.dir = mm.dir;
    if(window.ResizeObserver) new ResizeObserver(()=> applyTransform()).observe(stageWrap);
    state.onResize = ()=> requestAnimationFrame(fitToScreen);
    requestAnimationFrame(fitToScreen);
    render();

    return wrap;
  }

  /* ============================== نظام الجداول (منقول من DBSV) ============================== */
  function tblGenId(){ return "tb_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function makeTblRow(values){
    return { id: tblGenId(), values: values, checked:false, note1:"", note2:"", comments:[], images:[], files:[] };
  }

  /* ---- عارض الملفات الموحّد (صور بزوم/باند + فيديو + صوت + PDF + ملفات عامة) ---- */
  const tblLightboxEl = document.getElementById("tblLightbox");
  const tblLightboxImgEl = document.getElementById("tblLightboxImg");
  const tblLightboxVideoEl = document.getElementById("tblLightboxVideo");
  const tblLightboxAudioEl = document.getElementById("tblLightboxAudio");
  const tblLightboxPdfEl = document.getElementById("tblLightboxPdf");
  const tblLightboxFallbackEl = document.getElementById("tblLightboxFallback");
  const tblLbFallbackIconEl = document.getElementById("tblLbFallbackIcon");
  const tblLbFallbackNameEl = document.getElementById("tblLbFallbackName");
  const tblLbFallbackDownloadEl = document.getElementById("tblLbFallbackDownload");
  const tblLightboxStageEl = document.getElementById("tblLightboxStage");
  const tblLightboxCaptionEl = document.getElementById("tblLightboxCaption");
  const tblLightboxToolbarEl = document.getElementById("tblLightboxToolbar");
  const tblLbZoomLevelEl = document.getElementById("tblLbZoomLevel");

  // --- حالة تكبير/تصغير الصورة ---
  let imgNaturalW = 0, imgNaturalH = 0, imgBaseScale = 1, imgZoomFactor = 1, imgTx = 0, imgTy = 0;
  const MIN_ZOOM = 0.5, MAX_ZOOM = 6;

  function applyImgTransform(){
    const s = imgBaseScale * imgZoomFactor;
    tblLightboxImgEl.style.transform = \`translate(\${imgTx}px, \${imgTy}px) scale(\${s})\`;
    tblLbZoomLevelEl.textContent = Math.round(imgZoomFactor * 100) + "%";
    tblLightboxStageEl.classList.toggle("zoomed", imgZoomFactor > 1.001);
  }
  function computeBaseScaleAndCenter(){
    const stageRect = tblLightboxStageEl.getBoundingClientRect();
    if(!imgNaturalW || !imgNaturalH || !stageRect.width){ imgBaseScale = 1; }
    else{
      const availW = stageRect.width * 0.94, availH = stageRect.height * 0.94;
      imgBaseScale = Math.min(availW / imgNaturalW, availH / imgNaturalH, 1);
    }
    const dispW = imgNaturalW * imgBaseScale * imgZoomFactor;
    const dispH = imgNaturalH * imgBaseScale * imgZoomFactor;
    imgTx = (stageRect.width - dispW) / 2;
    imgTy = (stageRect.height - dispH) / 2;
  }
  function resetImgZoomState(){
    imgZoomFactor = 1; imgTx = 0; imgTy = 0; imgNaturalW = 0; imgNaturalH = 0; imgBaseScale = 1;
  }
  function zoomBy(factor, clientX, clientY){
    if(tblLightboxImgEl.style.display === "none") return;
    const stageRect = tblLightboxStageEl.getBoundingClientRect();
    const cx = (clientX != null ? clientX - stageRect.left : stageRect.width / 2);
    const cy = (clientY != null ? clientY - stageRect.top : stageRect.height / 2);
    const oldScale = imgBaseScale * imgZoomFactor;
    let newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, imgZoomFactor * factor));
    const newScale = imgBaseScale * newZoom;
    imgTx = cx - (cx - imgTx) * (newScale / oldScale);
    imgTy = cy - (cy - imgTy) * (newScale / oldScale);
    imgZoomFactor = newZoom;
    applyImgTransform();
  }
  tblLightboxImgEl.addEventListener("load", ()=>{
    imgNaturalW = tblLightboxImgEl.naturalWidth;
    imgNaturalH = tblLightboxImgEl.naturalHeight;
    imgZoomFactor = 1;
    computeBaseScaleAndCenter();
    applyImgTransform();
  });
  document.getElementById("tblLbZoomIn").addEventListener("click", ()=> zoomBy(1.4));
  document.getElementById("tblLbZoomOut").addEventListener("click", ()=> zoomBy(1/1.4));
  document.getElementById("tblLbZoomReset").addEventListener("click", ()=>{
    imgZoomFactor = 1; computeBaseScaleAndCenter(); applyImgTransform();
  });
  tblLightboxImgEl.addEventListener("dblclick", (e)=>{
    e.stopPropagation();
    if(imgZoomFactor > 1.05){ imgZoomFactor = 1; computeBaseScaleAndCenter(); }
    else{ zoomBy(2.2, e.clientX, e.clientY); }
    applyImgTransform();
  });
  tblLightboxStageEl.addEventListener("wheel", (e)=>{
    if(tblLightboxImgEl.style.display === "none") return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY);
  }, { passive:false });

  // --- سحب/بان باللمس أو الماوس + تكبير بإصبعين (pinch) ---
  const activePointers = new Map();
  let dragStart = null, dragMoved = false, pinchStartDist = null, pinchStartZoom = null;
  function ptDist(p1,p2){ return Math.hypot(p1.x-p2.x, p1.y-p2.y); }
  function ptMid(p1,p2){ return {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2}; }
  tblLightboxStageEl.addEventListener("pointerdown", (e)=>{
    if(tblLightboxImgEl.style.display === "none") return;
    tblLightboxStageEl.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    dragMoved = false;
    if(activePointers.size === 1){
      dragStart = { x:e.clientX, y:e.clientY, tx:imgTx, ty:imgTy };
      tblLightboxStageEl.classList.add("dragging");
    } else if(activePointers.size === 2){
      dragStart = null;
      const pts = Array.from(activePointers.values());
      pinchStartDist = ptDist(pts[0], pts[1]);
      pinchStartZoom = imgZoomFactor;
    }
  });
  tblLightboxStageEl.addEventListener("pointermove", (e)=>{
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size === 1 && dragStart){
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if(Math.abs(dx) + Math.abs(dy) > 6) dragMoved = true;
      imgTx = dragStart.tx + dx; imgTy = dragStart.ty + dy;
      applyImgTransform();
    } else if(activePointers.size === 2 && pinchStartDist){
      dragMoved = true;
      const pts = Array.from(activePointers.values());
      const dist = ptDist(pts[0], pts[1]);
      const mid = ptMid(pts[0], pts[1]);
      const stageRect = tblLightboxStageEl.getBoundingClientRect();
      const oldScale = imgBaseScale * imgZoomFactor;
      let newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinchStartZoom * (dist / pinchStartDist)));
      const newScale = imgBaseScale * newZoom;
      const cx = mid.x - stageRect.left, cy = mid.y - stageRect.top;
      imgTx = cx - (cx - imgTx) * (newScale / oldScale);
      imgTy = cy - (cy - imgTy) * (newScale / oldScale);
      imgZoomFactor = newZoom;
      applyImgTransform();
    }
  });
  function releasePointer(e){
    activePointers.delete(e.pointerId);
    tblLightboxStageEl.classList.remove("dragging");
    dragStart = null; pinchStartDist = null;
    if(activePointers.size === 1){
      const entry = Array.from(activePointers.entries())[0];
      dragStart = { x:entry[1].x, y:entry[1].y, tx:imgTx, ty:imgTy };
    }
  }
  tblLightboxStageEl.addEventListener("pointerup", releasePointer);
  tblLightboxStageEl.addEventListener("pointercancel", releasePointer);
  tblLightboxStageEl.addEventListener("pointerleave", (e)=>{ if(activePointers.has(e.pointerId)) releasePointer(e); });
  window.addEventListener("resize", ()=>{
    if(tblLightboxEl.classList.contains("open") && tblLightboxImgEl.style.display !== "none" && imgNaturalW){
      computeBaseScaleAndCenter(); applyImgTransform();
    }
  });

  function tblHideAllViewers(){
    tblLightboxImgEl.style.display = "none"; tblLightboxImgEl.src = "";
    tblLightboxVideoEl.style.display = "none"; tblLightboxVideoEl.pause(); tblLightboxVideoEl.removeAttribute("src"); tblLightboxVideoEl.load();
    tblLightboxAudioEl.style.display = "none"; tblLightboxAudioEl.pause(); tblLightboxAudioEl.removeAttribute("src"); tblLightboxAudioEl.load();
    tblLightboxPdfEl.style.display = "none"; tblLightboxPdfEl.src = "";
    tblLightboxFallbackEl.style.display = "none";
    tblLightboxCaptionEl.style.display = "none";
    tblLightboxCaptionEl.innerHTML = "";
    tblLightboxToolbarEl.style.display = "none";
    resetImgZoomState();
  }
  /** descriptor: { kind:'image'|'video'|'audio'|'pdf'|'other', url, name, mime } */
  function openTblViewer(descriptor){
    if(!descriptor || !descriptor.url) return;
    tblHideAllViewers();
    if(descriptor.kind === "image"){
      tblLightboxImgEl.src = descriptor.url;
      tblLightboxImgEl.style.display = "block";
      tblLightboxToolbarEl.style.display = "flex";
      if(descriptor.caption){
        tblLightboxCaptionEl.innerHTML = renderMarkdownLite(String(descriptor.caption));
        enhanceMarkdownView(tblLightboxCaptionEl);
        tblLightboxCaptionEl.style.display = "block";
      }
    } else if(descriptor.kind === "video"){
      tblLightboxVideoEl.src = descriptor.url;
      tblLightboxVideoEl.style.display = "block";
      tblLightboxVideoEl.play().catch(()=>{});
    } else if(descriptor.kind === "audio"){
      tblLightboxAudioEl.src = descriptor.url;
      tblLightboxAudioEl.style.display = "block";
      tblLightboxAudioEl.play().catch(()=>{});
    } else if(descriptor.kind === "pdf"){
      tblLightboxPdfEl.src = descriptor.url;
      tblLightboxPdfEl.style.display = "block";
    } else {
      tblLbFallbackIconEl.textContent = tblFileIconFor(descriptor.mime, descriptor.name);
      tblLbFallbackNameEl.textContent = descriptor.name || "ملف";
      tblLbFallbackDownloadEl.href = descriptor.url;
      tblLbFallbackDownloadEl.download = descriptor.name || "file";
      tblLightboxFallbackEl.style.display = "block";
    }
    tblLightboxEl.classList.add("open");
    if(descriptor.kind === "image") requestAnimationFrame(()=>{
      if(imgNaturalW && imgNaturalH){ computeBaseScaleAndCenter(); applyImgTransform(); }
    });
  }
  // توافقًا مع أي استدعاء قديم لعرض صورة بس
  function openTblLightbox(src){ if(src) openTblViewer({ kind:"image", url:src }); }
  function closeTblLightbox(){ tblLightboxEl.classList.remove("open"); tblHideAllViewers(); }
  document.getElementById("tblLightboxImageClose").addEventListener("click", (e)=>{ e.stopPropagation(); closeTblLightbox(); });
  tblLightboxEl.addEventListener("click", (e)=>{ if(e.target === tblLightboxEl) closeTblLightbox(); });
  tblLightboxStageEl.addEventListener("click", (e)=>{
    if(dragMoved){ dragMoved = false; return; }
    if(e.target === tblLightboxStageEl) closeTblLightbox();
  });
  document.getElementById("tblLightboxClose").addEventListener("click", closeTblLightbox);

  function tblModalManageOptions(col, rerender){
    openTblModal((panel)=>{
      panel.innerHTML = \`<h4>إدارة خيارات عمود «\${escapeHtml(col.label)}»</h4>\`;
      const list = document.createElement("div"); list.className="tbl-options-list";
      function renderList(){
        list.innerHTML="";
        col.options.forEach((opt, oi)=>{
          const row = document.createElement("div"); row.className="tbl-option-row";
          const span = document.createElement("span"); span.textContent = opt;
          const del = document.createElement("button"); del.textContent="✕";
          del.onclick = ()=>{
            if(col.options.length<=1) return;
            col.options.splice(oi,1);
            renderList();
            scheduleAutoSave(); rerender();
          };
          row.appendChild(span); row.appendChild(del);
          list.appendChild(row);
        });
      }
      renderList();
      panel.appendChild(list);

      const addRow = document.createElement("div"); addRow.className="tbl-add-option-row";
      const input = document.createElement("input"); input.type="text"; input.placeholder="خيار جديد...";
      const addBtn = document.createElement("button"); addBtn.className="btn-accent"; addBtn.textContent="+ إضافة";
      function doAdd(){
        const v = input.value.trim();
        if(!v || col.options.includes(v)) return;
        col.options.push(v);
        input.value="";
        renderList();
        scheduleAutoSave(); rerender();
      }
      addBtn.onclick = doAdd;
      input.onkeydown = (e)=>{ if(e.key==="Enter") doAdd(); };
      addRow.appendChild(input); addRow.appendChild(addBtn);
      panel.appendChild(addRow);

      const actions = document.createElement("div"); actions.className="tbl-modal-actions";
      const close = document.createElement("button"); close.className="primary"; close.textContent="تم"; close.onclick=closeTblModal;
      actions.appendChild(close);
      panel.appendChild(actions);
    });

  /* ---- صور ---- */
  // ملحوظة: الصور دلوقتي بتتخزن بجودتها الأصلية الكاملة من غير أي ضغط أو تصغير،
  // لأنها بقت في IndexedDB مش في localStorage (شوف قسم "تخزين الصور بجودة كاملة" فوق).
  function tblBuildMultiImagePicker(imagesArr, onChange){
    const wrap = document.createElement("div");
    wrap.className="images-grid";
    async function refresh(){
      wrap.innerHTML="";
      for(let ii=0; ii<imagesArr.length; ii++){
        const ref = imagesArr[ii];
        const tw = document.createElement("div"); tw.className="thumb-wrap";
        const img = document.createElement("img"); img.title="اضغط للتكبير";
        img.alt = "";
        getImageDisplayURL(ref).then(url=>{ if(url) img.src = url; });
        img.onclick = async ()=>{ const url = await getImageDisplayURL(ref); openTblViewer({ kind:"image", url }); };
        const del = document.createElement("button"); del.className="thumb-del"; del.textContent="✕";
        del.onclick = (e)=>{
          e.stopPropagation();
          const removed = imagesArr.splice(ii,1)[0];
          if(isIdbImageRef(removed)) idbDeleteImage(removed);
          refresh(); onChange();
        };
        tw.appendChild(img); tw.appendChild(del);
        wrap.appendChild(tw);
      }
      const label = document.createElement("label"); label.className="tbl-file-label"; label.innerHTML="📷<br>إضافة";
      const input = document.createElement("input"); input.type="file"; input.accept="image/*"; input.multiple=true;
      input.onchange = async (e)=>{
        const files = Array.from(e.target.files || []);
        for(const file of files){
          try{
            const id = await storeImageAndGetRef(file); // تخزين الملف الأصلي زي ما هو — بدون أي ضغط
            imagesArr.push(id);
          }catch(err){
            showToast("تعذّر حفظ الصورة: " + (err && err.message ? err.message : err), "err");
          }
        }
        refresh(); onChange();
      };
      label.appendChild(input);
      wrap.appendChild(label);
    }
    refresh();
    return wrap;
  }

  /* ---- مرفقات عامة: PDF، صوت، فيديو، ملفات كود/مكتبات بأي صيغة ----
     بتتخزن بنفس طريقة الصور بالظبط (IndexedDB، جودة/دقة كاملة، بدون أي تحويل)،
     وكل عنصر بيحمل معاه اسمه ونوعه وحجمه عشان يتعرض صح من غير ما نفتح الملف نفسه. */
  function tblBuildMultiFilePicker(filesArr, onChange){
    const wrap = document.createElement("div");
    wrap.className = "files-grid";
    function refresh(){
      wrap.innerHTML = "";
      filesArr.forEach((entry, ii)=>{
        const chip = document.createElement("div"); chip.className = "file-chip";
        chip.title = (entry.name || "ملف") + (entry.size!=null ? " — " + formatFileSize(entry.size) : "");
        const icon = document.createElement("div"); icon.className = "fi-icon"; icon.textContent = tblFileIconFor(entry.mime, entry.name);
        const nm = document.createElement("div"); nm.className = "fi-name"; nm.textContent = entry.name || "ملف";
        chip.appendChild(icon); chip.appendChild(nm);
        chip.onclick = async ()=>{
          const url = await getImageDisplayURL(entry.id);
          if(!url){ showToast("تعذّر تحميل الملف — ممكن يكون اتحذف من التخزين", "err"); return; }
          openTblViewer({ kind: fileKindFromMime(entry.mime, entry.name), url, name: entry.name, mime: entry.mime });
        };
        const del = document.createElement("button"); del.className = "file-del"; del.textContent = "✕";
        del.onclick = (e)=>{
          e.stopPropagation();
          const removed = filesArr.splice(ii,1)[0];
          if(removed && removed.id) idbDeleteImage(removed.id);
          refresh(); onChange();
        };
        chip.appendChild(del);
        wrap.appendChild(chip);
      });
      const label = document.createElement("label"); label.className = "tbl-file-label"; label.innerHTML = "📎<br>ملف";
      const input = document.createElement("input"); input.type = "file"; input.multiple = true;
      input.onchange = async (e)=>{
        const files = Array.from(e.target.files || []);
        for(const file of files){
          try{
            const id = await storeImageAndGetRef(file); // تخزين الملف الأصلي كامل زي ما هو — بدون أي تحويل أو ضغط
            filesArr.push({ id, name: file.name, mime: file.type || "", size: file.size });
          }catch(err){
            showToast("تعذّر حفظ الملف: " + (err && err.message ? err.message : err), "err");
          }
        }
        refresh(); onChange();
      };
      label.appendChild(input);
      wrap.appendChild(label);
    }
    refresh();
    return wrap;
  }

  function tblMakeNoteBox(label, val, onChange){
    const box=document.createElement("div"); box.className="note-box";
    const l=document.createElement("label"); l.textContent=label;
    const ta=document.createElement("textarea"); ta.value=val||"";
    ta.oninput=()=>onChange(ta.value);
    box.appendChild(l); box.appendChild(ta);
    return box;
  }

  /* ---- الحاوية الكلية لجداول السكشن ---- */
  function buildTablesHolder(section){
    const wrap = document.createElement("div");
    if(!section.tables) section.tables = [];

    function rerender(){
      wrap.innerHTML = "";
      section.tables.forEach(tbl=> wrap.appendChild(buildTblPanel(section, tbl, rerender)));
      const addRow = document.createElement("div"); addRow.className="add-table-row";
      const addBtn = document.createElement("button"); addBtn.className="btn-accent"; addBtn.textContent="+ إضافة جدول جديد";
      addBtn.onclick = ()=> tblModalAddTable(section, rerender);
      addRow.appendChild(addBtn);
      wrap.appendChild(addRow);
    }
    rerender();
    return wrap;
  }

  /* ---- بانل جدول واحد ---- */
  function buildTblPanel(section, table, rerenderHolder){
    const panel = document.createElement("div"); panel.className="table-panel";

    const head = document.createElement("div"); head.className="table-panel-head";
    const titleIn = document.createElement("input"); titleIn.className="tbl-title"; titleIn.value = table.title;
    titleIn.oninput = ()=>{ table.title = titleIn.value; scheduleAutoSave(); };
    const countSpan = document.createElement("span"); countSpan.style.opacity=".8"; countSpan.style.fontSize="10.5px"; countSpan.textContent = table.rows.length + " صف";
    const headActions = document.createElement("div"); headActions.className="head-actions";
    const collapseBtn = document.createElement("button"); collapseBtn.className="mini-btn"; collapseBtn.textContent="⌃ طي"; collapseBtn.title="طيّ الجدول";
    collapseBtn.onclick = ()=>{
      const collapsed = panel.classList.toggle("is-collapsed");
      collapseBtn.textContent = collapsed ? "⌄ فتح" : "⌃ طي";
      collapseBtn.title = collapsed ? "فتح الجدول" : "طيّ الجدول";
    };
    const delTableBtn = document.createElement("button"); delTableBtn.className="mini-btn danger"; delTableBtn.textContent="حذف الجدول";
    delTableBtn.onclick = (e)=>{
      if(!armConfirm(e.currentTarget, "اضغط تاني للحذف")) return;
      section.tables = section.tables.filter(t=>t.id!==table.id);
      scheduleAutoSave(); rerenderHolder();
    };
    headActions.appendChild(countSpan); headActions.appendChild(collapseBtn); headActions.appendChild(delTableBtn);
    head.appendChild(titleIn); head.appendChild(headActions);
    panel.appendChild(head);

    const scrollWrap = document.createElement("div"); scrollWrap.className="table-scroll";
    const tableEl = document.createElement("table"); tableEl.className="sheet";

    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    table.columns.forEach(col=>{
      const th = document.createElement("th");
      const cell = document.createElement("div"); cell.className="col-head-cell";
      const labelIn = document.createElement("input"); labelIn.className="col-label"; labelIn.value = col.label;
      labelIn.oninput = ()=>{ col.label = labelIn.value; scheduleAutoSave(); };
      cell.appendChild(labelIn);
      if(col.type==="select"){
        const gear = document.createElement("button"); gear.className="col-icon-btn"; gear.textContent="⚙"; gear.title="إدارة الخيارات";
        gear.onclick = ()=> tblModalManageOptions(col, rerenderHolder);
        cell.appendChild(gear);
      }
      if(table.columns.length>1){
        const del = document.createElement("button"); del.className="col-icon-btn del"; del.textContent="✕"; del.title="حذف العمود";
        del.onclick = (e)=>{
          if(!armConfirm(e.currentTarget, "تأكيد؟")) return;
          table.columns = table.columns.filter(c=>c.id!==col.id);
          table.rows.forEach(r=>{ delete r.values[col.id]; });
          scheduleAutoSave(); rerenderHolder();
        };
        cell.appendChild(del);
      }
      th.appendChild(cell);
      trh.appendChild(th);
    });
    const thAddCol = document.createElement("th"); thAddCol.className="add-col-th";
    const addColBtn = document.createElement("button"); addColBtn.className="add-col-btn"; addColBtn.textContent="+"; addColBtn.title="إضافة عمود";
    addColBtn.onclick = ()=> tblModalAddColumn(table, rerenderHolder);
    thAddCol.appendChild(addColBtn);
    trh.appendChild(thAddCol);
    const thActions = document.createElement("th"); thActions.className="actions-th"; thActions.textContent="إجراءات";
    trh.appendChild(thActions);
    thead.appendChild(trh);
    tableEl.appendChild(thead);

    const tbody = document.createElement("tbody");
    table.rows.forEach(row=> appendTblRow(tbody, table, row, rerenderHolder));
    tableEl.appendChild(tbody);

    scrollWrap.appendChild(tableEl);
    panel.appendChild(scrollWrap);

    const rowFooter = document.createElement("div"); rowFooter.className="row-footer";
    const addRowBtn = document.createElement("button"); addRowBtn.className="add-row-btn"; addRowBtn.textContent="+ إضافة صف";
    addRowBtn.onclick = ()=>{
      const values = {};
      table.columns.forEach(c=>{ values[c.id] = c.type==="select" ? (c.options[0]||"") : ""; });
      table.rows.push(makeTblRow(values));
      scheduleAutoSave(); rerenderHolder();
    };
    rowFooter.appendChild(addRowBtn);
    panel.appendChild(rowFooter);

    return panel;
  }

  function appendTblRow(tbody, table, row, rerenderHolder){
    const tr = document.createElement("tr");

    table.columns.forEach(col=>{
      const td = document.createElement("td");
      if(col.type==="select"){
        const sel = document.createElement("select"); sel.className="cell-select";
        col.options.forEach(opt=>{
          const o = document.createElement("option"); o.value=opt; o.textContent=opt;
          if(row.values[col.id]===opt) o.selected=true;
          sel.appendChild(o);
        });
        sel.onchange = ()=>{ row.values[col.id] = sel.value; scheduleAutoSave(); };
        td.appendChild(sel);
      } else {
        const inp = document.createElement("input"); inp.className="cell-text";
        inp.value = row.values[col.id] !== undefined ? row.values[col.id] : "";
        inp.oninput = ()=>{ row.values[col.id] = inp.value; scheduleAutoSave(); };
        td.appendChild(inp);
      }
      tr.appendChild(td);
    });

    const tdSpacer = document.createElement("td");
    tr.appendChild(tdSpacer);

    const tdActions = document.createElement("td"); tdActions.className="actions-cell";

    const chk = document.createElement("button"); chk.className="chk"+(row.checked?" on":"");
    chk.textContent = row.checked?"✓":""; chk.title="تمييز كمكتمل";
    chk.onclick = ()=>{
      row.checked = !row.checked;
      chk.className="chk"+(row.checked?" on":""); chk.textContent = row.checked?"✓":"";
      scheduleAutoSave();
    };
    tdActions.appendChild(chk);

    const noteBtn = document.createElement("button");
    function hasContent(){ return row.note1 || row.note2 || (row.comments && row.comments.length); }
    noteBtn.className="note-toggle"+(hasContent()?" has-content":"");
    noteBtn.textContent="📝"; noteBtn.title="ملاحظات وتعليقات";
    tdActions.appendChild(noteBtn);

    const imgBtn = document.createElement("button"); imgBtn.className="img-toggle"; imgBtn.title="الصور";
    function refreshImgBtn(){
      if(row.images && row.images.length){
        imgBtn.innerHTML = \`<img><span class="count-badge">\${row.images.length}</span>\`;
        const thumbImg = imgBtn.querySelector("img");
        getImageDisplayURL(row.images[0]).then(url=>{ if(url && thumbImg.isConnected) thumbImg.src = url; });
      } else {
        imgBtn.innerHTML = "📷";
      }
    }
    refreshImgBtn();
    tdActions.appendChild(imgBtn);

    const filesBtn = document.createElement("button"); filesBtn.className="file-toggle"; filesBtn.title="مرفقات (PDF, صوت, فيديو, ملفات...)";
    function refreshFilesBtn(){
      if(row.files && row.files.length){
        filesBtn.innerHTML = \`📎<span class="count-badge">\${row.files.length}</span>\`;
      } else {
        filesBtn.innerHTML = "📎";
      }
    }
    refreshFilesBtn();
    tdActions.appendChild(filesBtn);

    const delRowBtn = document.createElement("button"); delRowBtn.className="row-del"; delRowBtn.textContent="🗑"; delRowBtn.title="حذف الصف";
    delRowBtn.onclick = (e)=>{
      if(!armConfirm(e.currentTarget, "تأكيد؟")) return;
      table.rows = table.rows.filter(r=>r.id!==row.id);
      scheduleAutoSave(); rerenderHolder();
    };
    tdActions.appendChild(delRowBtn);

    tr.appendChild(tdActions);
    tbody.appendChild(tr);

    // صف التفاصيل (ملاحظات/صور/مرفقات/تعليقات)
    const detailTr = document.createElement("tr"); detailTr.className="detail-row";
    const detailTd = document.createElement("td"); detailTd.colSpan = table.columns.length + 2;
    const inner = document.createElement("div"); inner.className="detail-inner";

    const notesGrid = document.createElement("div"); notesGrid.className="notes-grid";
    notesGrid.appendChild(tblMakeNoteBox("ملاحظة 1", row.note1, v=>{ row.note1=v; scheduleAutoSave(); refreshNoteBtn(); }));
    notesGrid.appendChild(tblMakeNoteBox("ملاحظة 2", row.note2, v=>{ row.note2=v; scheduleAutoSave(); refreshNoteBtn(); }));
    inner.appendChild(notesGrid);

    if(!row.images) row.images = [];
    const imagesPicker = tblBuildMultiImagePicker(row.images, ()=>{ scheduleAutoSave(); refreshImgBtn(); });
    inner.appendChild(imagesPicker);

    if(!row.files) row.files = [];
    const filesPicker = tblBuildMultiFilePicker(row.files, ()=>{ scheduleAutoSave(); refreshFilesBtn(); });
    inner.appendChild(filesPicker);

    const commentsWrap = document.createElement("div"); commentsWrap.className="comments-area";
    const list = document.createElement("div"); list.style.display="flex"; list.style.flexDirection="column"; list.style.gap="5px";
    if(!row.comments) row.comments=[];
    function renderComments(){
      list.innerHTML="";
      row.comments.forEach((c,ci)=>{
        const item=document.createElement("div"); item.className="comment-item";
        const txt=document.createElement("div"); txt.className="txt"; txt.textContent=c.text;
        const del=document.createElement("button"); del.className="comment-del"; del.textContent="✕";
        del.onclick=()=>{ row.comments.splice(ci,1); renderComments(); scheduleAutoSave(); refreshNoteBtn(); };
        item.appendChild(txt); item.appendChild(del); list.appendChild(item);
      });
    }
    renderComments();
    commentsWrap.appendChild(list);
    const addRow = document.createElement("div"); addRow.className="add-comment-row";
    const input = document.createElement("input"); input.placeholder="اكتب تعليقًا...";
