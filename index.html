<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>لوحة التطبيقات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  html, body{ margin:0; padding:0; height:100%; overflow:hidden; font-family:"Tahoma","Segoe UI",Arial,sans-serif; }
  #switchBar{
    display:flex; align-items:center; gap:6px; height:52px; box-sizing:border-box;
    padding:0 8px; background:#1c2128; border-bottom:1px solid #30363d; overflow-x:auto;
  }
  #switchBar button{
    flex:1; min-width:90px; height:38px; border:none; border-radius:8px; cursor:pointer;
    font-size:.72rem; font-weight:bold; font-family:inherit; white-space:nowrap;
    background:#2a303a; color:#c9c2a8; transition:background .15s, color .15s;
    overflow:hidden; text-overflow:ellipsis; padding:0 6px;
  }
  #switchBar button.active{ background:#1f8a4c; color:#fff; }
  #switchBar button:not(.active):hover{ background:#333a46; }
  #switchBar button.appBtn{ cursor:grab; }
  #switchBar button.appBtn:active{ cursor:grabbing; }
  #switchBar button.dragging{ opacity:.4; }
  #switchBar button.dragOver{ box-shadow: inset 3px 0 0 #1f8a4c; }
  #frameWrap{ position:absolute; top:52px; left:0; right:0; bottom:0; }
  #frameWrap iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:none; background:#fff;
  }
  #switchBar .divider{ width:1px; align-self:stretch; margin:8px 2px; background:#30363d; flex:0 0 auto; }
  #switchBar .backupBtn{
    flex:0 0 auto; min-width:0; width:42px; height:38px; border:none; border-radius:8px; cursor:pointer;
    font-size:1.05rem; font-family:inherit; background:#2a303a; color:#c9c2a8; transition:background .15s, color .15s;
  }
  #switchBar .backupBtn:hover{ background:#333a46; }
  #switchBar .backupBtn:disabled{ opacity:.5; cursor:default; }
  #backupOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:9999;
  }
  #backupOverlay.show{ display:flex; }
  #backupBox{
    background:#1c2128; color:#e6edf3; border:1px solid #30363d; border-radius:12px; padding:20px 22px;
    max-width:320px; text-align:center; font-size:.9rem; line-height:1.7;
  }
  #backupBox .spinner{
    width:26px; height:26px; margin:0 auto 12px; border-radius:50%;
    border:3px solid #30363d; border-top-color:#1f8a4c; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="switchBar">
  <button type="button" class="appBtn" id="btnShowEnglish" data-key="english" draggable="true">🔤 English App</button>
  <button type="button" class="appBtn" id="btnShowEditor" data-key="editor" draggable="true">📘 Code Editor</button>
  <button type="button" class="appBtn" id="btnShowMeals" data-key="meals" draggable="true">🍽️ Meal Tracker</button>
  <button type="button" class="appBtn" id="btnShowVocab" data-key="vocab" draggable="true">🃏 Flashcards</button>
  <button type="button" class="appBtn" id="btnShowCodeLib" data-key="codelib" draggable="true">🗒️ Code Notes</button>
  <button type="button" class="appBtn" id="btnShowInstructions" data-key="instructions" draggable="true">📚 Instructions</button>
  <button type="button" class="appBtn active" id="btnShowCenter" data-key="center" draggable="true">📊 Command Center</button>
  <button type="button" class="appBtn" id="btnShowMindmap" data-key="mindmap" draggable="true">🧠 Mind Maps</button>
  <button type="button" class="appBtn" id="btnShowDrawing" data-key="drawing" draggable="true">✏️ Drawing</button>
  <button type="button" class="appBtn" id="btnShowWorkshop" data-key="workshop" draggable="true">🧰 Workshop Inventory</button>
  <button type="button" class="appBtn" id="btnShowEquipment" data-key="equipment" draggable="true">🖥️ Equipment</button>
  <div class="divider"></div>
  <button type="button" class="backupBtn" id="btnExportAll" title="تصدير نسخة احتياطية كاملة ZIP (كل التطبيقات + الصور والملفات)">⬇️</button>
  <button type="button" class="backupBtn" id="btnImportAll" title="استيراد نسخة احتياطية كاملة (ZIP)">⬆️</button>
  <input type="file" id="importFileInput" accept="application/zip,.zip" style="display:none;">
</div>

<div id="backupOverlay"><div id="backupBox"><div class="spinner"></div><div id="backupBoxText">جارٍ التجهيز…</div></div></div>

<div id="frameWrap">
  <!-- كل تطبيق شغال جوه iframe منفصل تمامًا — نفس المستند، نفس الجافاسكريبت، نفس الـ CSS
       بتاعته بس، ومفيش أي مشاركة أو تعارض بين التطبيقات خالص. كل تطبيق بيحفظ بياناته
       بطريقته الخاصة (أغلبهم أوتوماتيك، ومذكرة الأكواد ليها زرار ربط حفظ تلقائي لملف
       حقيقي على جهازك بالإضافة لزرار تنزيل نسخة يدوي) -->
  <iframe id="frameEnglish" src="english.html" data-fallback="english_1787254603569.html" onerror="this.src=this.dataset.fallback" style="display:none;"></iframe>
  <iframe id="frameEditor" src="editor.html" data-fallback="editor_1787254603551.html" onerror="this.src=this.dataset.fallback" style="display:none;"></iframe>
  <iframe id="frameMeals" src="meal-tracker.html" data-fallback="meal-tracker_1787254603630.html" onerror="this.src=this.dataset.fallback" style="display:none;"></iframe>
  <iframe id="frameVocab" src="vocab-app.html" data-fallback="vocab-app_1787254603650.html" onerror="this.src=this.dataset.fallback" style="display:none;"></iframe>
  <iframe id="frameCodeLib" src="code_library.html" data-fallback="code_library_1787254603451.html" onerror="this.src=this.dataset.fallback" style="display:none;"></iframe>
  <iframe id="frameInstructions" src="instruction_reference.html" data-fallback="instruction_reference_1787254603609.html" onerror="this.src=this.dataset.fallback" style="display:none;"></iframe>
  <iframe id="frameCenter" src="command-center.html" style="display:block;"></iframe>
  <iframe id="frameMindmap" src="mindmap-standalone.html" data-fallback="mindmap-standalone_1787255479904.html" onerror="this.src=this.dataset.fallback" style="display:none;"></iframe>
  <iframe id="frameDrawing" src="drawing-standalone.html" data-fallback="drawing-standalone_1787255479867.html" onerror="this.src=this.dataset.fallback" style="display:none;"></iframe>
  <iframe id="frameWorkshop" src="workshop_inventory.html" style="display:none;"></iframe>
  <iframe id="frameEquipment" src="equipment-db-gallery-pdf.html" style="display:none;"></iframe>
</div>

<script>
  const buttons = {
    english: document.getElementById('btnShowEnglish'),
    editor: document.getElementById('btnShowEditor'),
    meals: document.getElementById('btnShowMeals'),
    vocab: document.getElementById('btnShowVocab'),
    codelib: document.getElementById('btnShowCodeLib'),
    instructions: document.getElementById('btnShowInstructions'),
    center: document.getElementById('btnShowCenter'),
    mindmap: document.getElementById('btnShowMindmap'),
    drawing: document.getElementById('btnShowDrawing'),
    workshop: document.getElementById('btnShowWorkshop'),
    equipment: document.getElementById('btnShowEquipment'),
  };
  const frames = {
    english: document.getElementById('frameEnglish'),
    editor: document.getElementById('frameEditor'),
    meals: document.getElementById('frameMeals'),
    vocab: document.getElementById('frameVocab'),
    codelib: document.getElementById('frameCodeLib'),
    instructions: document.getElementById('frameInstructions'),
    center: document.getElementById('frameCenter'),
    mindmap: document.getElementById('frameMindmap'),
    drawing: document.getElementById('frameDrawing'),
    workshop: document.getElementById('frameWorkshop'),
    equipment: document.getElementById('frameEquipment'),
  };

  function showApp(key){
    Object.keys(frames).forEach(k => {
      frames[k].style.display = (k === key) ? 'block' : 'none';
      buttons[k].classList.toggle('active', k === key);
    });
  }

  /* يسجل تفاعل المستخدم مع أي تطبيق داخل الإطار، بدون تعديل ملفات التطبيقات نفسها. */
  const ACTIVITY_KEY = 'command_center_activity_v1';
  const activityLabels = {
    english:'تفاعل مع تطبيق الإنجليزي', editor:'تفاعل مع المحرر البرمجي',
    meals:'تفاعل مع متتبع الوجبات', vocab:'تفاعل مع البطاقات',
    codelib:'تفاعل مع مذكرة الأكواد', instructions:'تفاعل مع مرجع التعليمات'
  };
  const lastActivity = {};
  function recordActivity(app, detail){
    const now = Date.now();
    if(lastActivity[app] && now-lastActivity[app] < 45000) return;
    lastActivity[app] = now;
    let list = [];
    try{ list = JSON.parse(localStorage.getItem(ACTIVITY_KEY) || '[]'); }catch(e){}
    list.unshift({ app, title: activityLabels[app] || 'نشاط جديد', text: detail || 'تم استخدام التطبيق', date: new Date().toLocaleString('ar-EG'), icon:'↗', at: now });
    localStorage.setItem(ACTIVITY_KEY, JSON.stringify(list.slice(0, 100)));
    const center = frames.center && frames.center.contentWindow;
    if(center) center.postMessage({ type:'HUB_ACTIVITY', activity:list[0] }, '*');
  }
  function attachInteractionTracking(key){
    if(key === 'center' || !frames[key]) return;
    try{
      const doc = frames[key].contentWindow.document;
      if(doc.__hubTrackingAttached) return;
      doc.__hubTrackingAttached = true;
      const track = type => recordActivity(key, type === 'input' ? 'تم إدخال أو تعديل بيانات' : 'تم استخدام التطبيق');
      doc.addEventListener('click', () => track('click'), true);
      doc.addEventListener('pointerdown', () => track('pointerdown'), true);
      doc.addEventListener('input', () => track('input'), true);
      doc.addEventListener('change', () => track('change'), true);
      doc.addEventListener('submit', () => track('submit'), true);
      doc.addEventListener('keydown', () => track('keydown'), true);
    }catch(e){}
  }
  Object.keys(frames).forEach(key => {
    frames[key].addEventListener('load', () => attachInteractionTracking(key));
  });
  setInterval(() => Object.keys(frames).forEach(attachInteractionTracking), 900);
  window.addEventListener('message', (ev) => {
    const msg = ev.data || {};
    if(msg.type === 'HUB_OPEN_APP' && frames[msg.app]){
      showApp(msg.app);
      if(ev.source) ev.source.postMessage({type:'HUB_OPEN_APP_ACK', requestId:msg.requestId}, '*');
      if(msg.app !== 'center') recordActivity(msg.app, 'تم فتح التطبيق من مركز القيادة');
    }
  });

  buttons.english.addEventListener('click', () => showApp('english'));
  buttons.editor.addEventListener('click', () => showApp('editor'));
  buttons.meals.addEventListener('click', () => showApp('meals'));
  buttons.vocab.addEventListener('click', () => showApp('vocab'));
  buttons.codelib.addEventListener('click', () => showApp('codelib'));
  buttons.instructions.addEventListener('click', () => showApp('instructions'));
  buttons.center.addEventListener('click', () => showApp('center'));
  buttons.mindmap.addEventListener('click', () => showApp('mindmap'));
  buttons.drawing.addEventListener('click', () => showApp('drawing'));
  buttons.workshop.addEventListener('click', () => showApp('workshop'));
  buttons.equipment.addEventListener('click', () => showApp('equipment'));

  /* ============================================================
     ترتيب الأزرار بالسحب والإفلات (Drag & Drop) — الترتيب بيتحفظ
     في localStorage وبيتطبق تلقائيًا في كل مرة تفتح فيها الصفحة.
  ============================================================ */
  const ORDER_KEY = 'command_center_button_order_v1';
  const switchBar = document.getElementById('switchBar');

  function applyStoredOrder(){
    let order;
    try{ order = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null'); }catch(e){ order = null; }
    if(!Array.isArray(order)) return;
    const divider = switchBar.querySelector('.divider');
    order.forEach(key => {
      const btn = buttons[key];
      if(btn) switchBar.insertBefore(btn, divider);
    });
  }

  function saveCurrentOrder(){
    const order = Array.from(switchBar.querySelectorAll('.appBtn')).map(b => b.dataset.key);
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }

  applyStoredOrder();

  /* بتصغّر حجم خط أي زرار لحد ما نصه يبقى داخل حدوده تمامًا، من غير ما
     يخرج برا الإطار. بتشتغل عند التحميل وعند تغيير حجم الشاشة. */
  function fitButtonText(btn){
    const maxSize = 11.5;
    const minSize = 7;
    let size = maxSize;
    btn.style.fontSize = size + 'px';
    while(btn.scrollWidth > btn.clientWidth && size > minSize){
      size -= 0.5;
      btn.style.fontSize = size + 'px';
    }
  }
  function fitAllButtons(){
    document.querySelectorAll('#switchBar .appBtn').forEach(fitButtonText);
  }
  fitAllButtons();
  window.addEventListener('resize', fitAllButtons);

  let draggedBtn = null;
  document.querySelectorAll('.appBtn').forEach(btn => {
    btn.addEventListener('dragstart', (e) => {
      draggedBtn = btn;
      btn.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    btn.addEventListener('dragend', () => {
      btn.classList.remove('dragging');
      draggedBtn = null;
      document.querySelectorAll('.appBtn.dragOver').forEach(b => b.classList.remove('dragOver'));
      saveCurrentOrder();
      fitAllButtons();
    });
    btn.addEventListener('dragover', (e) => {
      e.preventDefault();
      if(!draggedBtn || draggedBtn === btn) return;
      btn.classList.add('dragOver');
      const rect = btn.getBoundingClientRect();
      const before = (e.clientX - rect.left) < rect.width / 2;
      switchBar.insertBefore(draggedBtn, before ? btn : btn.nextSibling);
    });
    btn.addEventListener('dragleave', () => btn.classList.remove('dragOver'));
    btn.addEventListener('drop', (e) => {
      e.preventDefault();
      btn.classList.remove('dragOver');
    });
  });

  /* ============================================================
     نسخة احتياطية شاملة حقيقية — بصيغة ZIP، تشتغل على مستوى المصدر
     (origin) مش على مستوى كل تطبيق لوحده. بما إن الموقع شغال على
     GitHub Pages، كل الصفحات (الأب وكل الـ iframes) على نفس الدومين،
     فالـ localStorage والـ IndexedDB مشتركين فعليًا بين الكل. فبنقرأ
     التخزين كله زي ما هو: كل مفاتيح localStorage في ملف JSON، وكل
     قواعد IndexedDB بكل الـ object stores بتاعتها (فيها الصور
     والملفات) بحيث كل Blob/File بيتحفظ كملف binary حقيقي جوه الـ
     ZIP نفسه (مش base64 مكبّر الحجم) — ده أصغر حجمًا وأسرع وأقوى.
     الاستيراد بيمسح كل حاجة موجودة ويحط مكانها بيانات الملف بالظبط،
     بعدين يعمل reload لكل التطبيقات.
     ملحوظة: زرار "ربط ملف حقيقي على الجهاز" (File System Access)
     في مذكرة الأكواد ده لينك بجهاز معيّن ومش قابل للنقل بين الأجهزة،
     فمش هيتحفظ — لكن كل محتواه الفعلي (النصوص/الصور) بيتحفظ عادي.
  ============================================================ */
  const overlay = document.getElementById('backupOverlay');
  const overlayText = document.getElementById('backupBoxText');
  const btnExportAll = document.getElementById('btnExportAll');
  const btnImportAll = document.getElementById('btnImportAll');
  const importFileInput = document.getElementById('importFileInput');

  function showOverlay(text){ overlayText.textContent = text; overlay.classList.add('show'); }
  function hideOverlay(){ overlay.classList.remove('show'); }

  function idbReq(req){
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  /* يحوّل أي قيمة (حتى المعقدة زي Blob/File/Date/ArrayBuffer وأي
     تعشيش جواها) لصيغة JSON-safe، وأي ملف/صورة بيتكتب كملف binary
     حقيقي مباشرة جوه الـ ZIP بدل تحويله لنص base64. */
  function walkValueIntoZip(val, zip, pathBase, counter){
    if(val === null || val === undefined) return val;
    if(typeof File !== 'undefined' && val instanceof File){
      const path = `${pathBase}/${counter.n++}.bin`;
      zip.file(path, val);
      return { __t:'file', ref: path, name: val.name, mime: val.type, lastModified: val.lastModified };
    }
    if(typeof Blob !== 'undefined' && val instanceof Blob){
      const path = `${pathBase}/${counter.n++}.bin`;
      zip.file(path, val);
      return { __t:'blob', ref: path, mime: val.type };
    }
    if(val instanceof Date){
      return { __t:'date', v: val.toISOString() };
    }
    if(val instanceof ArrayBuffer){
      const path = `${pathBase}/${counter.n++}.bin`;
      zip.file(path, val);
      return { __t:'buf', ref: path };
    }
    if(ArrayBuffer.isView(val)){
      const path = `${pathBase}/${counter.n++}.bin`;
      zip.file(path, val.buffer);
      return { __t:'view', ref: path, ctor: val.constructor.name };
    }
    if(typeof FileSystemFileHandle !== 'undefined' && val instanceof FileSystemFileHandle){
      return { __t:'unsupported', note:'file-system-handle' };
    }
    if(Array.isArray(val)) return val.map(item => walkValueIntoZip(item, zip, pathBase, counter));
    if(typeof val === 'object'){
      const out = {};
      for(const k of Object.keys(val)) out[k] = walkValueIntoZip(val[k], zip, pathBase, counter);
      return out;
    }
    return val;
  }

  async function unwalkValueFromZip(val, zip){
    if(val === null || val === undefined) return val;
    if(typeof val === 'object' && !Array.isArray(val) && val.__t){
      if(val.__t === 'file'){
        const raw = await zip.file(val.ref).async('blob');
        return new File([raw], val.name, { type: val.mime, lastModified: val.lastModified });
      }
      if(val.__t === 'blob'){
        const raw = await zip.file(val.ref).async('blob');
        return val.mime ? new Blob([raw], { type: val.mime }) : raw;
      }
      if(val.__t === 'date') return new Date(val.v);
      if(val.__t === 'buf') return await zip.file(val.ref).async('arraybuffer');
      if(val.__t === 'view'){
        const buf = await zip.file(val.ref).async('arraybuffer');
        const Ctor = window[val.ctor] || Uint8Array;
        return new Ctor(buf);
      }
      if(val.__t === 'unsupported') return undefined; // زي مقابض الملفات المرتبطة بجهاز معيّن
      return val;
    }
    if(Array.isArray(val)){
      const out = [];
      for(const item of val) out.push(await unwalkValueFromZip(item, zip));
      return out;
    }
    if(typeof val === 'object'){
      const out = {};
      for(const k of Object.keys(val)) out[k] = await unwalkValueFromZip(val[k], zip);
      return out;
    }
    return val;
  }

  async function exportIndexedDBIntoZip(zip){
    const manifest = {};
    if(!('indexedDB' in window) || typeof indexedDB.databases !== 'function') return manifest;
    let dbList = [];
    try{ dbList = await indexedDB.databases(); }catch(e){ return manifest; }
    for(const info of dbList){
      if(!info.name) continue;
      try{
        const db = await idbReq(indexedDB.open(info.name));
        const stores = {};
        const storeNames = Array.from(db.objectStoreNames);
        for(const storeName of storeNames){
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const keys = await idbReq(store.getAllKeys());
          const values = await idbReq(store.getAll());
          const counter = { n: 0 };
          const pathBase = `indexeddb/${info.name}/${storeName}`;
          const records = [];
          for(let i = 0; i < values.length; i++){
            records.push({
              key: store.keyPath ? undefined : keys[i],
              value: walkValueIntoZip(values[i], zip, pathBase, counter)
            });
          }
          stores[storeName] = { keyPath: store.keyPath, autoIncrement: store.autoIncrement, records };
        }
        manifest[info.name] = { version: db.version, stores };
        db.close();
      }catch(e){ /* تجاهل القاعدة دي واستمر في الباقي */ }
    }
    return manifest;
  }

  async function importIndexedDBFromZip(manifest, zip, warnings){
    if(!manifest) return;
    for(const dbName of Object.keys(manifest)){
      try{
        const db = await idbReq(indexedDB.open(dbName));
        const dbStores = manifest[dbName].stores || {};
        for(const storeName of Object.keys(dbStores)){
          if(!db.objectStoreNames.contains(storeName)){
            warnings.push(`${dbName}/${storeName} (لازم تفتح التطبيق ده مرة الأول عشان ينشئ مخزنه الداخلي، وبعدين استورد تاني)`);
            continue;
          }
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          await idbReq(store.clear());
          for(const rec of dbStores[storeName].records){
            const value = await unwalkValueFromZip(rec.value, zip);
            if(store.keyPath){ store.put(value); }
            else{ store.put(value, rec.key); }
          }
          await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
        }
        db.close();
      }catch(e){ warnings.push(dbName + ': ' + (e && e.message ? e.message : e)); }
    }
  }

  async function exportAll(){
    if(typeof JSZip === 'undefined'){ alert('مكتبة الضغط (JSZip) ما اتحمّلتش — تأكد إن فيه اتصال إنترنت وجرب تاني.'); return; }
    btnExportAll.disabled = true; btnImportAll.disabled = true;
    showOverlay('جارٍ قراءة كل بيانات كل التطبيقات (localStorage + IndexedDB)…');
    try{
      const zip = new JSZip();

      const localStorageDump = {};
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        localStorageDump[k] = localStorage.getItem(k);
      }
      zip.file('localStorage.json', JSON.stringify(localStorageDump));

      showOverlay('جارٍ تجميع الصور والملفات من قواعد IndexedDB…');
      const indexedDBManifest = await exportIndexedDBIntoZip(zip);
      zip.file('indexeddb/manifest.json', JSON.stringify({
        type: 'unified-origin-backup',
        version: 3,
        exportedAt: new Date().toISOString(),
        databases: indexedDBManifest
      }));

      showOverlay('جارٍ ضغط وتجهيز ملف الـ ZIP للتنزيل…');
      const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      a.href = url;
      a.download = `نسخة-احتياطية-شاملة-${stamp}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }catch(e){
      alert('حصل خطأ أثناء التصدير: ' + (e && e.message ? e.message : e));
    }finally{
      hideOverlay();
      btnExportAll.disabled = false; btnImportAll.disabled = false;
    }
  }

  async function importAll(file){
    if(typeof JSZip === 'undefined'){ alert('مكتبة الضغط (JSZip) ما اتحمّلتش — تأكد إن فيه اتصال إنترنت وجرب تاني.'); return; }
    btnExportAll.disabled = true; btnImportAll.disabled = true;
    showOverlay('جارٍ قراءة ملف الـ ZIP…');
    try{
      let zip;
      try{ zip = await JSZip.loadAsync(file); }
      catch(e){ alert('الملف ده مش ZIP صالح.'); return; }

      const lsEntry = zip.file('localStorage.json');
      const manifestEntry = zip.file('indexeddb/manifest.json');
      if(!lsEntry && !manifestEntry){
        alert('صيغة الملف مش معروفة — لازم يكون ملف نسخة احتياطية اتعمل تصديره من نفس البرنامج.');
        return;
      }

      if(!confirm('هيتم مسح كل بيانات كل التطبيقات الحالية واستبدالها ببيانات الملف ده بالكامل (بما فيها الصور والملفات). متأكد عاوز تكمل؟')) return;

      showOverlay('جارٍ استعادة كل البيانات…');
      const warnings = [];

      if(lsEntry){
        const localStorageDump = JSON.parse(await lsEntry.async('string'));
        localStorage.clear();
        for(const k of Object.keys(localStorageDump)){
          try{ localStorage.setItem(k, localStorageDump[k]); }
          catch(e){ warnings.push('localStorage/' + k + ': ' + (e && e.message ? e.message : e)); }
        }
      }
      if(manifestEntry){
        showOverlay('جارٍ استعادة الصور والملفات في IndexedDB…');
        const manifest = JSON.parse(await manifestEntry.async('string'));
        await importIndexedDBFromZip(manifest.databases, zip, warnings);
      }

      if(warnings.length){
        alert('تم الاستيراد، لكن فيه ملاحظات على بعض الأجزاء:\n' + warnings.join('\n'));
      } else {
        alert('تم استيراد كل البيانات بنجاح ✅ — التطبيقات هتتحدث دلوقتي.');
      }

      showOverlay('جارٍ تحديث كل التطبيقات…');
      Object.keys(frames).forEach(key => {
        try{ frames[key].contentWindow.location.reload(); }
        catch(e){ frames[key].src = frames[key].src; }
      });
    }catch(e){
      alert('حصل خطأ أثناء الاستيراد: ' + (e && e.message ? e.message : e));
    }finally{
      hideOverlay();
      btnExportAll.disabled = false; btnImportAll.disabled = false;
    }
  }

  btnExportAll.addEventListener('click', exportAll);
  btnImportAll.addEventListener('click', () => importFileInput.click());
  importFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    importFileInput.value = '';
    if(file) importAll(file);
  });
</script>

</body>
