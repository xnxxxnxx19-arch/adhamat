<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>لوحة التطبيقات</title>
<style>
  html, body{ margin:0; padding:0; height:100%; overflow:hidden; font-family:"Tahoma","Segoe UI",Arial,sans-serif; }
  #switchBar{
    display:flex; align-items:center; gap:8px; height:52px; box-sizing:border-box;
    padding:0 10px; background:#1c2128; border-bottom:1px solid #30363d;
  }
  #switchBar button{
    flex:1; height:38px; border:none; border-radius:8px; cursor:pointer;
    font-size:.95rem; font-weight:bold; font-family:inherit;
    background:#2a303a; color:#c9c2a8; transition:background .15s, color .15s;
  }
  #switchBar button.active{ background:#1f8a4c; color:#fff; }
  #switchBar button:not(.active):hover{ background:#333a46; }
  #frameWrap{ position:absolute; top:52px; left:0; right:0; bottom:0; }
  #frameWrap iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:none; background:#fff;
  }
</style>
</head>
<body>

<div id="switchBar">
  <button type="button" id="btnShowEnglish" class="active">🔤 تطبيق الإنجليزي</button>
  <button type="button" id="btnShowEditor">📘 المحرر البرمجي</button>
</div>

<div id="frameWrap">
  <!-- كل تطبيق شغال جوه iframe منفصل تمامًا — نفس المستند، نفس الجافاسكريبت، نفس الـ CSS
       بتاعته بس، ومفيش أي مشاركة أو تعارض بين الاتنين خالص -->
  <iframe id="frameEnglish" src="english.html" style="display:block;"></iframe>
  <iframe id="frameEditor" src="editor.html" style="display:none;"></iframe>
</div>

<script>
  const btnEnglish = document.getElementById('btnShowEnglish');
  const btnEditor = document.getElementById('btnShowEditor');
  const frameEnglish = document.getElementById('frameEnglish');
  const frameEditor = document.getElementById('frameEditor');

  function showEnglish(){
    frameEnglish.style.display = 'block';
    frameEditor.style.display = 'none';
    btnEnglish.classList.add('active');
    btnEditor.classList.remove('active');
  }
  function showEditor(){
    frameEditor.style.display = 'block';
    frameEnglish.style.display = 'none';
    btnEditor.classList.add('active');
    btnEnglish.classList.remove('active');
  }
  btnEnglish.addEventListener('click', showEnglish);
  btnEditor.addEventListener('click', showEditor);
</script>

</body>
</html>
